midi:
  # ALL SIXTEEN, AND THE INSTRUMENT WILL TAKE MORE THAN SIXTEEN AT ONCE. "MIDI devices have 16
  # available MIDI channels all of which can be used to communicate with Deluge by USB or the
  # MIDI DIN port" (guidebook_oled p. 237), and going out, "Range is 1-16 channels"
  # (guidebook_oled p. 254). What the field cannot hold is that the channels are not the whole
  # address here: hosted USB devices, a USB host connection and the DIN port each carry their own
  # sixteen, "which would mean more than 16 channels are present simultaneously in the network"
  # (p. 237), and a setting called DIFFERENTIATE INPUTS decides whether the instrument tells
  # them apart. So two controllers can both send on channel 1 to different destinations.
  channels: [1, 16]
  # BOTH, THOUGH SENDING IS A SETTING. Clock is `Yes*` transmitted and `Yes` recognised, the
  # asterisk reading "*Only if MIDI Clock output is enabled" (guidebook_oled p. 241), and the
  # settings menu carries that switch as CLOCK IN and CLOCK OUT (p. 240). Following takes
  # precedence over leading: "Playing as a follower takes precedence. Beat clock outputs will be
  # sent out only when set up with beat clock outputs on and when not playing as a follower"
  # (p. 242).
  clock: both
  # BOTH. Start, Continue and Stop are each `Yes*` transmitted and `Yes` recognised
  # (guidebook_oled p. 241), and the prose says what that is like to use: "Control commands such
  # as play and stop will be triggered by the external device but can be triggered from Deluge
  # when the external controls are not triggered" (p. 242). Song position pointer is `Yes` both
  # ways, which the format has no field for.
  transport: both
  # EVERY CONTROLLER NUMBER BELONGS TO THE PLAYER, IN BOTH DIRECTIONS. The chart answers `Yes`
  # in both columns and qualifies each: "Numbers assigned by user" transmitted, "Parameter must
  # be 'learned' by user" recognised (guidebook_oled p. 241). Going out, sixteen numbers can be
  # set per clip - "In total 16 parameters (8 upper, 8 lower) can be set for MIDI controls" - and
  # the range they may be chosen from is published: "CC messages range from CC0 - CC119, bend and
  # aftertouch. CC1 is typically mod wheel" (p. 255). Coming in, a control is pointed at a
  # parameter by holding LEARN and moving it, and the display answers `LEARNED` (p. 245).
  control_change: learned
  # NO, IN EITHER DIRECTION: `No` transmitted and `No` recognised (guidebook_oled p. 241). The
  # words `SysEx` and `System Exclusive` appear nowhere else in either edition, so this is a
  # checked absence and not an unread appendix - which matters for an instrument whose presets
  # are files on an SD card rather than slots to be dumped.
  sysex: false
  # MPE, IN AND OUT, AND THE BOOLEAN IS THE LEAST OF IT. Everything that cannot fit in it is in
  # the comment below `voice`. The flag is true because the instrument reads a zone of channels
  # as one instrument with per-note expression, rather than reading each channel as a part:
  # "With MPE a series of channels are set up, known as zones, to communicate not only multiple
  # notes but also MIDI information for each individual note" (guidebook_oled p. 258).
  per_voice_channels: true
  program_change:
    # IT SENDS AND DOES NOT ANSWER - the one row where this machine is plainly a sequencer rather
    # than an instrument. PGM change is `Yes` transmitted and `No` recognised, and both bank
    # select rows are the same way round, `CC 0` and `CC 32 (LSB)` each `Yes` and `No`
    # (guidebook_oled p. 241). What it sends is set per MIDI clip: "PGM Program ... None, 1-128.
    # Program change message", "BANK Select ... None, 1-128 CC0 Bank select message" and
    # "SUB-BANK ... None, 1-128 CC32 - LSB Sub bank message" (p. 253). `presets` is deliberately
    # absent: 1-128 is the range of numbers it can be told to send at somebody else's synth, not
    # a count of its own presets, which are files on an SD card and are not addressed by number.
    receives: false
    sends: true

voice:
  # PITCHES, AND NOTHING IS WIRED TO A NOTE UNTIL SOMEBODY WIRES IT. A synth clip is played by
  # pitch across the grid, and the way a controller reaches it is by learning: "Press & hold
  # [LEARN / INPUT] + [AUDITION] pad of a note / pad to map", after which "The MIDI channel plus
  # the external keyboard notes will now be mapped to the Deluge" (guidebook_oled p. 244). A kit
  # is the other shape - one sound to a row, each row learned to its own note - but there is no
  # factory note map for either, so there are no `voices` below and the `learned` note map is
  # the whole answer. The maker publishes no default assignment anywhere in 338 pages.
  addressing: pitches
  note_map: learned
  velocity:
    # RECEIVED AND SENT, THOUGH ITS OWN PADS GENERATE NONE. The chart's note on row is `Yes` in
    # both columns (guidebook_oled p. 241) and the prose confirms the receiving: "Velocity is
    # recorded with MIDI inputs" (p. 244). What it sends is the sequencer's stored value rather
    # than a touch, because "Deluge pads are not velocity sensitive. The default velocity is 64
    # but this default level can be changed in the settings options under the defaults menu"
    # (p. 45) - and that default is a settable one, "Sets the default velocity for newly entered
    # notes between 1-127. Default is 64" (p. 276), on a page that calls its own values defaults.
    note_on: both
    # NOTE OFF VELOCITY IS LEFT UNRECORDED BECAUSE THE DOCUMENT SAYS BOTH THINGS. The chart's
    # note off row is `No` in both columns (guidebook_oled p. 241). Thirty-six printed pages
    # earlier the same chapter says "Also note-off velocity, if delivered by an external
    # controller will be recorded" (p. 246). A reader could reconcile those - recording a value
    # into a clip is not the same as an engine acting on one - but **that distinction is the
    # reader's and not the document's**, so neither is recorded: where one document states a
    # thing twice and the two disagree, this corpus carries neither. Both editions print both
    # statements identically, so this is not an edition's slip.
  # BOTH KINDS ARE ANSWERED, AND ONE OF THEM IS SENT WHERE THE CHART SAYS IT IS NOT. Recognised:
  # `Polyphonic` is `Yes` and `Channel` is `Yes` (guidebook_oled p. 241), so `poly` as the
  # stronger of the two, which is the reading the MC-707's two After Touch rows got. Sending is
  # where the document argues with itself: the chart marks polyphonic aftertouch `No`
  # transmitted, while the MPE chapter says "Kits cannot output MPE MIDI and default, however
  # aftertouch that has been recorded to the row will be output as polyphonic aftertouch for the
  # rows note" (p. 259). This field records reception, so the contradiction does not change its
  # value - but it is written down rather than quietly resolved, and anybody who adds a field for
  # what an instrument transmits will find two answers waiting here.
  aftertouch: poly
  pitch_bend:
    # TWELVE SEMITONES BY DEFAULT AND SETTABLE TO ANYTHING FROM NONE TO EIGHT OCTAVES. The
    # setting is called BEND RANGE and its own cell reads "Global pitch bend range in semitones.
    # Range is 0-96 semitones (default 12)" (guidebook_oled p. 276). The page is headed `System
    # Settings` and calls these values
    # defaults in its own words, which is the test the DrumBrute Impact's five screenshots
    # failed. Zero is a real setting rather than off, and the MPE chapter says what it is for:
    # "Setting the pitch bend range to zero will negate the hard coded patching if required"
    # (p. 259), the hard-coded patching being MPE's X axis.
    #
    # THERE ARE THREE BEND RANGES ON THIS INSTRUMENT AND THIS FIELD HOLDS ONE. The 12 above is
    # the global default. A synth or CV clip then carries two of its own, on a page the second
    # reader found and the first had not: a `NORMAL` range, "Normal pitch bend range in
    # semitones for the Synth or CV clip. Typically this is the pitch bend wheel of a
    # controller" (guidebook_oled p. 86), **for which no number is printed at all**, and an MPE
    # range, "MPE pitch bend
    # range in semitones for the Synth or CV clip. Typically this using two finger MPE
    # expression. Default 48" (guidebook_oled p. 86). So a player bending with a wheel gets 12
    # semitones until they change it and a player bending with a finger on an MPE controller
    # gets 48, and a consumer that draws one bend range will be wrong about one of them. Both
    # editions print both statements identically.
    semitones: 12
    programmable: true

# MPE IS SUPPORTED IN BOTH DIRECTIONS AND NONE OF WHAT FOLLOWS FITS IN THE BOOLEAN ABOVE.
# Zones are MIDI's own: "The master channels are fixed as 1 for lower and at 16 for upper zones"
# (guidebook_oled p. 258), and each zone's member count is set per connected device to OFF or 1
# to 15, in or out, with the master channel excluded from the count (p. 261). The three
# dimensions are patched like any modulation source rather than fixed: X is pitch bend by default
# and may be repatched, Y is free, and "Aftertouch is the pressure applied to a notes key after
# it is initially pressed ... This is patched in Deluge using the 'Aftertouch' parameter and can
# be patched elsewhere" (p. 259). So **Y is not CC 74 here**, which is what MPE's own
# specification expects and what the Carbon8m and the Messenger both record; the guidebook names
# no controller number for it at all, and inventing 74 would be exactly the lift this corpus
# forbids. Zones can be learned from the controller instead of typed - hold LEARN and an
# AUDITION pad and play five or more notes at once (p. 261) - and the instrument sends MCM
# messages when its output zone changes or at power-up (p. 263). Kit rows take all three
# dimensions per row but cannot send MPE. The configuration is stored on the SD card as
# `MIDIDevices.xml` (p. 261), which is a fact about a file rather than about MIDI and is noted
# because it is the only place a reader could go to see what a given machine has learned.
