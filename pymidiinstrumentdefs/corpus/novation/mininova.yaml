# TWO MIDI DOCUMENTS, AND THE ONE CALLED THE IMPLEMENTATION GUIDE HAS NO CONTROLLER NUMBER IN IT.
# Novation publishes both on one page. The `MiniNova MIDI Implementation Guide` is a single sheet
# of the classic Function/Transmitted/Received chart, and where a controller number would be it
# says "See MiniNova CC & NRPN tables" (midi_impl). **Everything below comes from those tables**,
# the nine-sheet `MiniNova CC & NRPN Chart`, and everything about what the instrument answers to
# in general comes from the one-sheet guide. Reading either alone would leave half the file empty.
#
# THE CONTROL CHANGES AND THE NRPNS ARE TWO DIFFERENT SETS OF PARAMETERS, NOT ONE MAP ADDRESSED
# TWICE. **Of 557 controls, 105 carry a controller number, 452 carry an NRPN, and not one carries
# both.** So a panel that offers only control changes reaches 105 of this synthesiser's parameters
# and cannot reach the other 452 at all - which is the opposite of the usual arrangement, where
# the NRPNs are the fine version of numbers a player could also send as controllers.
#
# THREE OF THE CHART'S ROWS ARE NOT CONTROLS AND ARE LEFT OUT. All Sounds Off, Local Off/On and
# All Notes Off are CC 120, 122 and 123, which mean the same on every instrument that has them and
# belong to the MIDI specification rather than to one synthesiser. **The Local Off/On row is worth
# reading before it goes**, because the chart gives it values no specification does - "99=On,
# 33=Off" (midi_impl), where the standard says 0 and 127.
#
# TWO NRPN ADDRESSES CARRY THIRTY-SIX PARAMETERS BETWEEN THEM, and the value says which. NRPN 122
# is thirty switches - every envelope's trigger, every LFO's four, the gator's three, the
# vocoder's five - each with two numbers of its own, so 0 and 1 are the first envelope's and 66
# and 67 the vocoder's input. NRPN 251 is six more. **Each control's range is what tells them
# apart**, and the Circuit's guide does the same thing with two addresses and ten parameters.
#
# AND NRPN 251 IS THE ONE PLACE THIS CHART CONTRADICTS ITSELF. Of its six parameters, the three
# LFO fade modes should occupy three bands and the second and third are printed with the same one,
# 4 to 7; the ninth mod matrix slot's first source sits on the same address with the range 0 to
# 18, which overlaps all of them; and the vocal tuner's insert point is the only row in the chart
# whose named values fall outside its own range. All four are recorded exactly as printed, and the
# insert point is recorded with **no** named values, because the two columns that would name them
# disagree.

definition: 1

model:
  manufacturer: Novation
  name: MiniNova
  # NOT RECORDED, and this one was looked for in three places. The user guide is "Version 1.01"
  # (p. 1) and that is the guide's version, not the instrument's; the chart says "Version 0002" (chart
  # p. 1) on its first seven sheets and "Version 0001" (chart p. 8) on its last two; the
  # implementation guide says "Version: 0001" (midi_impl) and "Date: 10/02/2014" (midi_impl).
  # **None of them
  # is a firmware number.** The guide tells
  # a player where to look instead - "Firmware update files will be available from time to time at
  # support.novationmusic.com" (p. 9) - and the instrument shows its own under "Operating System
  # Version" (p. 13). So what the numbers below match is the chart of February 2014, and nothing
  # published says which firmware that is.

source: >-
  MiniNova CC & NRPN Chart, nine sheets: **every control below is one of its 490 rows**, seven
  sheets of them, with the four tables its Remarks point at on the last two. MiniNova MIDI
  Implementation Guide, one sheet, for everything in `midi:` and `voice:`. MiniNova User Guide
  v1.01, 39 pages, for the voices, the patches and what the keyboard itself sends. And Novation's
  downloads page, for what is published and what is not.

  THE CHART IS THE DOCUMENT WITH THE NUMBERS AND IT IS NOT THE ONE CALLED THE IMPLEMENTATION
  GUIDE. That one-sheet guide is the classic chart of functions, and against Control Change it
  says "See MiniNova CC & NRPN tables" (midi_impl) rather than giving any. Both are linked from
  the same downloads page, 58.41 KB and 120.83 KB; a reader who fetched the one whose name
  promises an implementation would come away with none.

  THE TABLE IS A GRID OF FREE-STANDING WORDS WITH NO RULING IN THE FILE, cut here at measured
  coordinates. Its columns - Category, Parameter, CC, NRPN MSB, NRPN LSB, Input Range, Mapped
  Range, Remarks - are left-aligned and never move across the seven sheets, which makes it the
  easiest chart in this library to cut. **What is not easy is where one row ends**: a row is as
  tall as its Remarks need, one line for most and five for a parameter whose every value is named,
  so a row is not a line. The rows are found by the Parameter column and nothing else.

  THE RANGE RECORDED IS THE INPUT RANGE, NOT THE MAPPED ONE. The chart prints both - what to send
  and what it means - so the first oscillator's pitch bend amount is "(52 - 76)" to send and
  "(-12 - 12)" to read. **What travels is the first of the two**, and the second belongs to a
  panel's display rather than to a file about messages.

  A POINTER LENDS NAMES AND NOT NUMBERS, which is the trap in the Remarks column. 137 of the 490
  rows say "See" something: four point at the tables on sheets 8 and 9, one points outside the
  document altogether - "See User Manual for FX Routing Options" (chart p. 4) - and the rest point
  at another row. **Copied across unchanged, a borrowed set of names lands on numbers the control
  cannot be sent**: the third LFO's one-shot switch has the range 32 to 33 and says "See LFO1
  OneShot" (chart p. 3), where the first LFO's row reads "12=Normal, 13=OneShot" (chart p. 3).
  The names move by the
  distance between the two rows' own ranges, and only where the two are the same width.

  THREE ROWS ARE A FAMILY RATHER THAN A PARAMETER, and they are the only rows here that become
  more than one control each. Their NRPN LSB column holds a range instead of a number and the row
  says what each number in it addresses: the gator's step levels are "0-31 for Steps 1 to 32, 0-7
  for respective Gator step level." (chart p. 5), the vocoder's are "Vocal Tune Spectrum Levels
  for Spectra 0-31" (chart p. 5), and the chorder's are "NRPNLow: 17=Key 2 .. 25=Key 10,
  Value=Number of semitones from the root" (chart p. 5). That is 73 controls out of 557.

  THE MAKER MISSPELLS NRPN AS NPRN, AND NOT ONLY IN PASSING. The chart's first sheet is headed
  "Novation MiniNova Extended CC & NRPN Map" (chart p. 1) and the running foot of all seven says
  "Novation MiniNova CC NPRN Map" (chart p. 1); the file Novation serves it as is named `mininova-cc-nprn-chart.pdf`;
  and two of its own rows are "NPRN LSB" and "NPRN MSB", at CC 98 and 99. Both spellings are the
  maker's and both are kept where they are quoted.

  AND THE PARAMETER NAMED AFTER THE INSTRUMENT IS THERE FOR ITS SIBLING. At the very top of the
  NRPN space, 127:127, sits the arpeggiator parameter the chart spells `Mininova`, with a small n
  where the rest of the document writes MiniNova, remarked "Managed parameter for UltraNova compatibility"
  (chart p. 5). The UltraNova is the larger synthesiser this one is derived from and is **not**
  what this file describes.

  WHAT ELSE THE CHART GETS WRONG OR NEARLY WRONG, recorded rather than mended. Two of its value
  lists end in a stray comma, which drops the last value of each for anyone reading by comma;
  "Breath Controlller" (chart p. 1) has three Ls; "Only banks 1-3 are implmented" (chart p. 1) is
  missing an E; a reverb
  type reads "Lrgroom" beside "SmlRoom"; the global MIDI channel's range is punctuated "(0, 15)"
  as though it were a list of two; and none of the four cross-references matches its table's own
  title - "See Table 1: Waveforms" (chart p. 1) against "Table 1: Waveform Table" (chart p. 8),
  "See Table 3: Sync" (chart p. 3) against "Table 3: Sync Values" (chart p. 8).

  THE SEVEN SHEETS, AND WHAT EACH ONE REACHES, because a reader who wants to check one number has
  to know which to open. Sheet 1 runs from the patch's own category - "Used in save menu 0=None,
  1=Arp, 2=Bass" (chart p. 1) - up through the oscillators; sheet 2 carries the rest of them and
  the animate buttons, "0=Animate Hold Off, 1=Animate Hold On" (chart p. 2); sheet 3 the envelopes
  and the first LFO, whose fade has "0=Fade In, 1=Fade Out, 2=Gate In, 3=Gate Out" (chart p. 3);
  sheet 4 the other two LFOs and the effects, where the first slot offers "0=Bypass, 1=EQ,
  2=Compres1, 3=Compres2" (chart p. 4); sheet 5 the gator, the vocoder and the arpeggiator, the
  gator's mode being "0=Mono16, 1=MonoAlt1, 2=MonoAlt2, 3=Stereo16" (chart p. 5); sheet 6 the
  first nineteen mod matrix slots, each with the same trigger list "0=Off, 1=A1ReTrig, 2=A2ReTrig"
  (chart p. 6); and sheet 7 the twentieth, the tweak assignments and the globals, with the vocal
  tuner's "16=Off, 17=Scale Correction, 18=KBCtrl, 19=Pitch" (chart p. 7).

  WHAT THE CHART DOES NOT LIST. Controller numbers 62, 66, 67, 100 to 105 and 107 appear nowhere
  in it, and each LFO's NRPN block skips one - 72 to 74, 81 to 83, 90 to 92. Both are absences in
  the chart rather than conclusions about the instrument, and nothing here fills them in.

