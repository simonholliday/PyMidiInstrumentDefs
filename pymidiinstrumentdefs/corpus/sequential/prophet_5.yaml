# SEQUENTIAL PUBLISHES A REAL MIDI IMPLEMENTATION FOR THIS INSTRUMENT, which is rarer in this
# corpus than it ought to be: thirteen pages, a received and a transmitted message table, 59
# controller numbers with a parameter and a range each, 71 NRPNs, and four system exclusive
# layouts. Almost everything below is read off it.
#
# THIS IS THE 2020 INSTRUMENT AND NOT THE 1970s ONE. Sequential's Prophet-5 of 2020 is a MIDI
# instrument; the Prophet-5 of 1978 is not, and the Rev 3.3 of the 1980s had a MIDI of its own
# that nothing here describes. The name alone identifies neither, so this file says which.
#
# AND THE MAKER NAMES IT ON A PAGE IT DOES NOT NUMBER. The implementation never says which
# instrument it is for - no revision, no year, no operating system - and the User's Guide says
# both, in its foreword and on its copyright page, which are front matter numbered in roman
# numerals or not at all. So it is stated here without a locator, because there is no locator
# to give: "Or as we call it around here, the Prophet-5 Rev4", and "(c)2020 Sequential LLC".
#
# AND IT IS THE PROPHET-10's IMPLEMENTATION TOO, which is settled by three other documents and
# not by this one: THE IMPLEMENTATION ITSELF NEVER MENTIONS THE PROPHET-10, not once in thirteen
# pages. What settles it is that one documentation page offers this file in both products'
# sections, that the two User's Guides differ in their MIDI material only by the model name, and
# that the instrument's own USB port calls itself "Prophet-5/10". See the source account.
#
# THE IMPLEMENTATION IS OLDER THAN THE INSTRUMENT'S FEATURES. It is version 1.4 of March 2021,
# and two operating system addenda have followed it - 2.0 of September 2021 and 2.1.0 of May 2025
# - neither of which it could describe. Neither mentions MIDI, and neither has an NRPN for the
# parameters it adds.

definition: 1

model:
  manufacturer: Sequential
  name: Prophet-5
  # The newest operating system Sequential publishes an addendum for is 2.1.0, dated May 2025 by
  # its own file. The MIDI Implementation below is version 1.4 of March 2021 and predates both
  # 2.0 and 2.1.0; neither addendum mentions MIDI, so nothing in the tables is known to have
  # changed, and nothing in them covers what those releases added. Checked 2026-10-04.
  firmware: "2.1.0"

source: >-
  Prophet-5 MIDI Implementation, version 1.4, 13 pages: the globals that gate everything on p. 1,
  the received messages on p. 2, the transmitted messages on p. 3, the 59 controller numbers on
  pp. 4 and 5, the NRPN format on p. 6, the NRPN tables on pp. 8 and 9, and the system exclusive
  layouts on pp. 10 to 13. Prophet-5 User's Guide 1.3, 80 sheets: the instrument on p. 1, the
  rear panel on p. 3, the USB port on p. 4, the programs on p. 6, the globals on p. 16,
  oscillator sync on p. 18, the pitch wheel on p. 37 and the aftertouch on p. 38. Prophet-5/10 OS
  2.0 Addendum and OS 2.1.0 Addendum, for what has changed since the implementation was written.
  Prophet-10 User's Guide 1.4, cited for one thing only, which is that it says the same.

  SIXTY-FOUR CONTROLLER NUMBERS, FROM TWO TABLES THAT DO DIFFERENT JOBS. Fifty-nine are the
  parameter map, "Additional Continuous Controllers Transmitted/Received" (pp. 4-5), each with the
  maker's own name and its own range. Five more are performance controllers that the received and
  transmitted message tables name instead (pp. 2-3): the mod wheel, the breath controller, the
  foot controller, bank select and the damper pedal.

  THE TWO MESSAGE TABLES ARE TWO LISTS, SO A NUMBER IN ONE AND NOT THE OTHER IS ONE-WAY. Measured
  over both: only the breath controller is, "Breath Controller: When assigned to Pedal/CV" (p. 3),
  transmitted and never received. Everything else that appears at all appears in both.

  THE LABELS ARE THE MAKER'S OWN WORDS IN THE MAKER'S OWN CAPITALS, TYPOS INCLUDED. Controller 15
  is printed "OSC A SAW ON/FF" (p. 4), which is ON/OFF with a letter missing - and it is printed
  that way in the NRPN table as well (p. 8), so it is what this maker calls the thing rather than
  a slip in one place. Nothing here tidies it.

  AND NRPN IS THE PREFERRED METHOD, WHICH THE MAKER SAYS IN AS MANY WORDS. "Param Xmit: Off, CC,
  NRPN" (p. 1) and "Param Rcv: Off, CC, NRPN" (p. 1) are globals, and of them: "NRPNs are the
  preferred method
  of parameter transmission, since they cover the complete range of all parameters, while CCs are
  limited to a range of 128" (p. 1). So a sender that can do either should do NRPN, and
  `midi.nrpn` records that.

  AND A PARAMETER CHANGE IS ONE OR THE OTHER, NEVER BOTH. Each of those globals takes one of
  three values, so at any moment the instrument is sending CC or sending NRPN or sending nothing,
  and the same for receiving. The controller table says the condition itself: "They are
  transmitted when Param Xmit is set to CC, and recognized/received when Param Rcv is set to CC"
  (p. 4). A panel that offered both at once would be describing a machine that cannot exist.

  THE NRPN TABLE IS CARRIED, AND AN NRPN SITS BESIDE A CONTROLLER ONLY WHERE THE MAKER PRINTS THE
  SAME NAME IN BOTH TABLES. It holds 71 numbered parameters and three more given as spans, from 0 to
  4109 (pp. 8-9), in two runs of numbers: the program parameters from 0 upwards and the global
  parameters from 4096 upwards, which the chapter before them promises as "one for global
  parameters, and the other for program parameters" (implementation p. 6), though it prints one
  table. **The controller table and the NRPN table are two views of the same parameters and they do
  not line up**: no arithmetic relates one number to the other - controller 3 and NRPN 0 are both
  OSC A FREQUENCY, controller 15 and NRPN 3 are both OSC A SAW ON/FF. So 50 controls carry both
  numbers, exactly where the two tables print the same name. Seven more NRPNs sit in the places the
  controller table gives to rows of other names - `AFTERTOUCH > FILTER` where it has
  `PRESSURE FILTER`, and six like it - and are carried as controls of their own, because pairing two
  different names is a reader's judgement and not the maker's, and paired by position one of them
  would disagree with its controller about a destination: the controller table has `PRESSURE FILTER`
  and `PRESSURE LFO` (p. 5), the NRPN table `AFTERTOUCH > FILTER` and `AFTERTOUCH > AMP` (p. 8), and
  the guide's aftertouch switch chooses "the Filter cutoff and/or the LFO amount" (guide p. 38). The
  fourteen global parameters are controls of their own too, 85 controls in all. The three spans are
  not carried: `UNISON NOTE` is one row over ten numbers, 55-64 (p. 9), and carrying it would mean
  writing ten numbers the page does not print one by one, and the other two are `RESERVED`.

  WHAT THE TWO TABLES DO AGREE ABOUT IS EVERY RANGE THEY SHARE. Measured over the 50 parameter names
  printed in both: **not one range differs.** So the two maps disagree about numbering and never
  about scaling, which is worth knowing by anyone who joins them. Beyond those 50, seven more sit in
  the same place under other names - PRESSURE FILTER against AFTERTOUCH > FILTER, and six like it -
  two are controller-only, and seventeen rows are the NRPN table's alone: the fourteen global
  settings and three spans.

  TWO NUMBERS ARE REFUSED BY THE VALIDATOR AND ARE LEFT OUT RATHER THAN DROPPED SILENTLY.
  Controller 123 is "All Notes Off: Clear all MIDI notes" (p. 2) and controller 121 is "Reset All
  Controllers: Clears all MIDI controllers to 0, MIDI volume to maximum" (p. 2). Both are
  received; both are channel mode messages, which this corpus does not record as controls.

  AND ONE ROW IS LEFT OUT BECAUSE THE DOCUMENT SAYS TWO THINGS ABOUT IT. The transmitted table's
  fourth controller row is named "Expression: When assigned to Pedal/CV" (p. 3) and its second
  byte is printed "0000 1101", which is 13. Expression is controller 11. **There is no third
  statement anywhere to settle which the maker meant** - the received table has no Expression row
  at all - so neither number is recorded, and a consumer that wants expression will have to ask.

  THE DOCUMENT HAS SIX MORE DEFECTS AND NONE OF THEM IS RESOLVED HERE, because resolving one
  would be inventing a number the maker has not published.

  The first is a second typo in a parameter name: NRPN 41 is printed "VELOCTIY > FILTER" (p. 8)
  where NRPN 42 beside it spells the word correctly.

  The second is the one a reader would actually be hurt by. **This instrument's system exclusive
  identity is given two ways.** The device inquiry reply gives "0011 0011" (p. 10) as the
  Prophet-5's family byte; the three request and dump chapters give "0011 0001" (pp. 11, 12
  and 13), in nine separate rows. 51 against 49, and nothing in the document says which.

  The third: **the RPN reset message is given the wrong controller numbers.** The received NRPN
  chapter prints "0010 0101" and "0010 0100" (p. 7) for the registered parameter number's two
  halves, which are 37 and 36. They are 101 and 100. Every NRPN controller number on the same two
  pages is right - 99, 98, 6, 38, 96 and 97 - so it is these two rows and not the chapter.

  The fourth: **nothing in the document says how to save the edit buffer.** The table headed Save
  Edit Buffer (p. 12) is byte for byte the Request Program Dump of the page before, command byte
  and all.

  The fifth: **a program is addressed three incompatible ways.** "Bank Number, 0 - 7" with
  "Program Number, 0 - 127" (p. 11); "Group Number: 0 - 9" with "Program Number: 0 - 39" (p. 12);
  and the received program change's own banks on p. 2.

  The sixth: the NRPN tables are headed "Control NRPN Data" and introduced with "It is received
  and transmitted but not saved as part of a program" (p. 9) - **over the parameters the document
  later says are saved**, "The 128 "packed" parameter bytes in the program dump follow the order
  of the NRPN list" (p. 13). The chapter before them promises "the two tables below, one for
  global parameters, and the other for program parameters" (p. 6), and neither table is headed
  that way.

  THE SYSTEM EXCLUSIVE CHAPTER IS FOUR LAYOUTS, not a mention. A universal device inquiry, a
  request program dump, a program data dump and a global parameters data dump, each byte by byte
  (pp. 10-13), and a global chooses the port they travel on: "MIDI SysEx: MIDI, USB" (p. 1).

  IT RECEIVES POLYPHONIC KEY PRESSURE AND ITS OWN KEYBOARD SENDS CHANNEL PRESSURE, which the one
  field here cannot say twice. The received table has "Polyphonic Key Pressure" (p. 2) and
  "Channel Pressure" (p. 2); the transmitted table has "Channel Pressure" (p. 3) and no
  polyphonic row at all. And the User's Guide says what the keyboard is: "The Prophet-5 provides
  monophonic (or "channel")
  aftertouch, which means that applying pressure to any key within a chord will apply modulation
  to all notes currently held" (p. 38). `aftertouch: poly` records what it answers to, which is
  what the field is for, and this paragraph is the rest of it. The Super 6 at rank 64 is the same
  shape from the other side.

  VELOCITY ARRIVES AND IS IGNORED ON NOTE OFF. "Note Off. Velocity is ignored" (p. 2) and "Note
  On. Note off if vvvvvvv = 0" (p. 2), and what it transmits on note off is a literal "0000000"
  (p. 3). Two global curves shape what the keyboard produces, "Vel Response: 0-6" (p. 16) and "AT
  Response: 0-7" (p. 16), and neither says anything about what an incoming velocity does.

  THE BEND RANGE IS PER PROGRAM AND THE PANEL AND THE CONTROLLER COUNT IT DIFFERENTLY. "Use the
  group select (decrement) and bank select (increment) switches to choose the desired range from
  1- 12. A setting of 1 equals a semitone. A setting of 12 equals an octave" (p. 37). Controller
  70 is "PITCH WHEEL RANGE" (p. 5) with a range of "0-11" (p. 5) - twelve values either way, by
  one, and the implementation does not say that the controller's 0 is the panel's 1.

  FOUR MORE RANGES THE GUIDE GIVES DIFFERENTLY, CARRIED AS THE IMPLEMENTATION PRINTS THEM.
  Controller 114 is `UNISON DETUNE` over `0-7` (p. 5), eight values, and the guide says "A setting
  of 0 is minimum detuning. A setting of 8 is maximum detuning" (guide p. 40), nine. Controller 31
  is `RESONANCE` over `0-120` (p. 4), and the guide's example of the pot modes says "the resonance
  parameter has an internal value range of 0 to 127" (guide p. 14). And two of the global NRPNs:
  `VEL RESPONSE` is printed over `0-7` (p. 9), eight values, where the guide's global is "Vel
  Response: 0-6" (guide p. 16), seven; and `ALT TUNINGS` over `0-15` (p. 9), sixteen, where the
  guide offers normal tuning and sixteen more (guide p. 16). The ranges below are what a message
  carries, by the implementation's word; neither document says how the other's numbers map onto
  them.

  FOUR HUNDRED PROGRAMS, AND A PROGRAM CHANGE REACHES FORTY OF THEM. "The Prophet-5 contains a
  total of 400 programs" (p. 6), selected by a group, a bank and a program number. The
  implementation's received table gives "Program change, 0-39" (p. 2) and bank select picks the
  rest: "Bank Select: 1 - 5 select user banks 1 - 5; 6 - 9 select factory banks 1 - 4" (p. 2).

  AND THAT PROGRAM CHANGE ROW CONTRADICTS ITSELF. After the 0-39 it enumerates four spans of
  eight, naming Banks 1, 2, 4 and 5 - thirty-two values across four banks, where the number before
  it is forty and the bank selector cycles through five. **Nothing here resolves it**: 40 is
  recorded because it is the figure the row states outright and because 400 programs in groups of
  five banks of eight agrees with it, and the enumeration is quoted in this paragraph so that a
  reader can see what was set aside.

  AND BANK SELECT NAMES FIVE USER BANKS AND ONLY FOUR FACTORY ONES, where the guide's selector
  "increments and cycles through Groups 1-5" (guide p. 6) in either set of 200. As printed, no bank
  select value reaches a fifth factory group, and the transmitted table says only "Bank Select: 1 -
  5" (p. 3). The program data dump does reach one, in the guide's own word: "Group Number: 0 - 9"
  (p. 12) with "Program Number: 0 - 39" (p. 12), ten groups of forty. Neither document says that a
  bank select value is a group.

  NOT RECORDED: the clock and the transport. The words clock, start, stop, continue, song
  position and active sensing appear nowhere in the thirteen pages of the implementation - not as
  a no, as nothing at all. This instrument has no sequencer and no arpeggiator, and the
  implementation simply does not have those rows.

  NOT RECORDED: anything from the two operating system addenda, which add Stack and Split (2.0) and
  per-program filter Q compensation, velocity and aftertouch amounts, a high note priority and a
  layer link (2.1.0). **Neither addendum mentions MIDI and neither gives a number for anything it
  adds**, so the tables above are what is published and are known to be incomplete for the
  instrument as it ships. One of them visibly so: the guide names four key priorities, "low, last,
  low retrigger, last retrigger" (guide p. 45), and controller 71, `RETRIGGER AND UNISON ASSIGN`,
  has four values (p. 5) - which value is which is not said - and NRPN 87, `RETRIGGER AND UNISON`,
  the same four (p. 9). 2.1.0 adds two more priorities, high note and its retrigger: "High Note
  gives note priority to the highest note played, with a retrigger option" (addendum_2_1_0 p. 3),
  which no value reaches.

