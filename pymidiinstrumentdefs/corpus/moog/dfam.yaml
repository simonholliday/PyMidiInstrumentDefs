# The smallest definition worth having, and a real instrument rather than a
# hypothetical one. It says the absence was checked rather than skipped, and it
# tells a panel not to offer a note grid to something that could not play one.

definition: 1

model:
  manufacturer: Moog Music
  name: DFAM
  # NOT RECORDED. Moog publishes no firmware version anywhere that can be read: its
  # downloads page builds its list in the browser and serves nothing about a version,
  # and the release-note files it used to serve now redirect to a page that is gone
  # (checked 2026-09-30). Its support pages explain how to read the installed version
  # off the instrument, which is a fact about one unit rather than about the model.
  # The manual never mentions firmware, updates or a version in 44 pages. That is not
  # enough to write `none`, which claims the model has no firmware at all: an absence of
  # mention is not a checked absence.

source: >-
  User manual, 44 pages, in which the word "MIDI" does not appear — verified
  across every page. The instrument is driven by clock and trigger at the
  patchbay and by its own 8-step analogue sequencer. Tempo 0.7 Hz to 700 Hz.

