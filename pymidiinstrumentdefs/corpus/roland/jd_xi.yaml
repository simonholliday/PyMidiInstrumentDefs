  # Program effects ───────────────────────────────────────
  # **THESE FIVE NAME NO PART, AND THE PROGRAM HAS A CHANNEL OF ITS OWN.** The Control Change
  # Message List gives them no channel (implementation p. 14). The program's is Prog Rx/Tx Ch:
  # "Specifies the channel used to transmit and receive MIDI messages for the program." (manual
  # p. 13), and the address map has a `Program Control Channel (0 - 16)` with the same range,
  # `1 - 16, OFF` (implementation p. 9), though no page says the two are one setting. No page puts
  # these five on that channel in so many words, so they name no part, which in this format means
  # the base channel, channel 1, the first digital synth's. If they do not answer there, Prog Rx/Tx
  # Ch is the setting to look at.
