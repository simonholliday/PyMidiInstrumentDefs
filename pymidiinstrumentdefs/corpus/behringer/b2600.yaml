# **NO CONTROLS, AND THIS FILE DOES NOT SAY `none`.** All that Behringer publishes for the 2600 is
# a quick start guide, and a quick start guide that lists no controller is not an instrument that
# has none: the ruling `behringer/edge` follows, for the same maker and the same kind of document.
# The guide has no table of MIDI messages at all. Its whole account of MIDI is four numbered items
# of the back panel and a table of switch settings, on one page, and three lines of the
# specifications.
#
# **WHAT IT DOES SETTLE IS A CHANNEL RANGE AND A SWITCH.** Four switches set a channel from 1 to
# 16, and a sliding switch chooses one voice or two.
#
# **AND THE PRODUCT PAGE CLAIMS MORE THAN THE GUIDE DESCRIBES.** Its list of features ends with a
# "Comprehensive MIDI implementation" (product_page), which is `behringer/ub_xa`'s position: a
# claim by the maker with no controller and no table of messages behind it. Of this claim the
# maker's documents set out the channel and the sockets, and no message.
#
# **THREE PRODUCTS, AND ONE ACCOUNT OF MIDI.** Behringer sells two special editions beside the
# 2600, the BLUE MARVIN and the GRAY MEANIE, each with a page and a guide of its own. The three
# guides' four items are the same word for word, and so is every other line a field here rests
# on. This file is the 2600's, and names the others only to say so.

definition: 1

model:
  manufacturer: Behringer
  # `2600` on the guide's cover and in the page's title. `0718-AAI` is the product code in the
  # page's address and in the guide's file name. A rack with no keyboard: the cover reads
  # `Semi-Modular Analog Synthesizer with 3 VCOs and Multi-Mode VCF in 8U Rack-Mount Format`.
  name: "2600"
  # NOT RECORDED, the firmware, and nothing Behringer publishes would establish it. The guide
  # names no version of the instrument or of any software for it, and never mentions firmware.
  # The only versions it prints are its own, `V 4.0` on its cover, and USB 2.0 and two operating
  # systems in the specifications (guide p. 113). The product page lists the guide and an
  # application at 3.2.4, which is the application's version.

source: >-
  **ONE DOCUMENT, A QUICK START GUIDE, AND THE PRODUCT PAGE LISTS NO OTHER.** The page
  embeds its own download list as data, and the list has three items: "Quick Start Guide"
  (product_page), typed `Manual`, and two builds of "Synthtribe App" (product_page), typed
  `Software` at version 3.2.4, one for Windows and one for mac. So the page lists no user manual,
  no firmware and no MIDI document, and that is read off a list and not concluded from a search.
  `behringer/model_d` records a user manual on its own page, so this maker does list one where it
  has one.

  **THE PAGE CLAIMS A COMPREHENSIVE MIDI IMPLEMENTATION, AND BEHRINGER PUBLISHES THE CHANNEL AND THE
  SOCKETS, AND NO MESSAGE.** The page embeds a list of eighteen features as well, and the last is
  its only word on MIDI: "Comprehensive MIDI implementation with MIDI channel and Voice Priority
  selection" (product_page). Both special editions' pages end their lists with the same sentence
  (blue_marvin_page, gray_meanie_page). The guide accounts for half of it, the channel. The word
  priority is in none of the three guides, and the nearest thing they describe is the switch between
  one voice and two. So a selection the maker advertises is set out nowhere the maker publishes,
  which is one more reason this file does not say that there are no controllers.

  **NEITHER LIST IS IN THE PAGE'S VISIBLE TEXT, WHICH NEVER NAMES MIDI.** The downloads and the
  features are data inside the page's script, behind tabs the visible text only labels, and what
  is cited here is an extraction of that data. That is how `behringer/edge` cites its page's
  download list. `behringer/td_3` meets the same stock words on its pages, a MIDI channel and
  Voice Priority selection, and describes them without quoting, the copy it cites being the
  page's visible text.

  **THE GUIDE'S ENGLISH NAMES MIDI ON THREE PAGES.** It is 62 sheets: a cover, then two printed
  pages to a sheet, then a back page, in eleven languages. Its English is safety, warranty and
  compliance text, one section headed `Step 1: Controls`, which is a list of a hundred numbered
  panel items, and the specifications. MIDI is named on the back panel's page (guide p. 18) and
  on two pages of the specifications (guide pp. 111, 113), and on no other English page.

  **FOUR ITEMS OF THE BACK PANEL ARE THE WHOLE OF IT.** The channel: "MIDI CHANNEL SWITCHES – These
  4 switches allow you to set the MIDI Channel number from 1 to 16 (see the table printed in this
  document or refer to the silk-screened switch matrix printed on the back panel)." (guide p. 18),
  and the table is sixteen pictures of the four switches, each over its number. By the pictures the
  levers count in binary from the left, and none raised is channel 1. No sentence says which
  position is on and the table has no legend; the picture of the back panel above it letters
  `ON DIP` over the four levers and `1 2 3 4` under them, so by that lettering a raised lever is
  on. The input: "MIDI
  IN – This port receives MIDI data from an external source over a 5-pin DIN connector."
  (guide p. 18). The through socket, in a sentence printed as it stands: "MIDI THRU – This port
  uses a 5-pin DIN jack is used to pass through MIDI data received at the MIDI IN jack."
  (guide p. 18). And the USB port: "This synthesizer will show up as a class-compliant USB MIDI
  device, capable of supporting MIDI in and out." (guide p. 18). The specifications add a line
  for each connection, "MIDI in / thru 2 x 5-pin DIN, 16 channels" (guide p. 111) and "USB (MIDI)
  Type B" (guide p. 111), and name the switches again as `4 x DIP switches` (guide p. 113).

  **NO TABLE OF MIDI MESSAGES, SO NOTHING FOR A CONTROLLER TO BE MISSING FROM.** No sheet of the
  guide, in any of its languages, prints a controller number, or any of the words such a table
  would: control change, program change, system exclusive, pitch bend, aftertouch, note on and
  note off among them. Velocity is not in its English either; its Spanish, Portuguese and Italian
  print their word for it, each time for the speed of an oscillator, a clock, an envelope, a
  delay, a glide or a switch, and never as a MIDI term. `behringer/td_3` says `none` out of a
  quick start guide because its guide carries such a table and the TD-3-MO's copy of that table
  carries a controller. `behringer/edge` leaves the field unset because its guides carry no
  table, and this guide is the EDGE's case. So `control_change` is unset here. The same silence
  is why velocity, pitch bend, aftertouch, program change, system exclusive, MIDI clock and
  transport are not recorded: none is denied and none is stated.

  **IT IS PLAYED FROM A KEYBOARD IT DOES NOT HAVE, AND NO SENTENCE JOINS THAT KEYBOARD TO MIDI.**
  The guide speaks of the keyboard throughout and means another instrument's: "The Keyboard
  section determines how the built-in Low Frequency Oscillator (LFO) unit works with an external
  keyboard." (guide p. 14). The source at MIDI IN "will commonly be a MIDI keyboard, an external
  hardware sequencer, a computer equipped with a MIDI interface, and so on." (guide p. 18). Inside
  the instrument the keyboard is a voltage: "The keyboard control voltage is available as a
  pre-wired connection wherever you see this label:" (guide p. 14), over a box lettered `KYBD CV`,
  and the picture of the oscillators shows that box under the first FM CONTROL jack of each of
  the three (guide p. 11). Each oscillator has a switch for it, "In the AUDIO position, keyboard
  control is enabled." (guide p. 10), and the one English sentence with the word pitch in it is
  the keyboard section's: "The Portamento function allows one pitch to change gradually to a
  second pitch a predetermined rate." (guide p. 15), printed as it stands. A keyboard's voltage
  can be brought in at a jack too, an input of the Voltage Processor's first inverter: "KYBD CV –
  This input is optimized for control voltage signal from a keyboard." (guide p. 17). But no
  sentence says in terms that a MIDI note plays a pitch, or what the instrument does with
  anything that arrives at MIDI IN beyond passing it through. `addressing: pitches` is a reading:
  of an instrument with a MIDI input and a channel to set, whose guide names a MIDI keyboard
  first among what is plugged into that input, and whose three oscillators are wired to follow a
  keyboard's voltage.

  **ONE VOICE OR TWO IS A SWITCH, AND THE SECOND VOICE IS A CONTROL VOLTAGE AT A JACK.**
  "VOICE MODE(MONO/DUO) – Use this sliding switch to determine whether the keyboard plays one
  voice at a time (MONO) or two voices simultaneously (DUO)." (guide p. 14). What DUO adds is an
  output: "UPPER VOICE – This output sends out a control voltage based on the highest note being
  played on the keyboard while in DUO voice mode." (guide p. 14). No sentence says the upper
  voice is wired to an oscillator, and none says how the second note comes to sound; no box
  under the oscillators' jacks in the picture of them is lettered for it (guide p. 11). The
  specifications print the switch again, "Voice mode: mono / duo, selectable" (guide p. 113),
  give "Number of voices Multiphonic" (guide p. 113), and list one filter and one amplifier. So
  `voicing_modes` is one and two. `polyphony` is not recorded: the specifications give a word,
  Multiphonic, and no figure, and a sliding switch has no default. Whether two notes are to be
  called paraphonic is left unsaid. The word is in no guide. The three oscillators are pre-wired
  into the one filter, "pre-wired connections from Voltage Controlled Oscillators 1, 2 and 3
  into the VCF block" (guide p. 10), and no sentence says which of them plays which note.

  **THE TWO SPECIAL EDITIONS PRINT THE SAME FOUR ITEMS.** The guide itself says what one of them
  changes: "NOTE: 2600 uses a digital reverb, while BLUE MARVIN features a real, on-board spring
  reverb." (guide p. 14). The BLUE MARVIN's guide and the GRAY MEANIE's each print the four
  back-panel items word for word as this one does (blue_marvin_guide p. 18,
  gray_meanie_guide p. 18), and each of their pages lists a guide and the same two builds of the
  application (blue_marvin_page, gray_meanie_page). **Every other line a field here rests on is
  in both as well**: the voice switch's item and the upper voice's (blue_marvin_guide p. 14,
  gray_meanie_guide p. 14), and the specifications' lines for the sixteen channels, the voice
  mode and the number of voices (blue_marvin_guide pp. 111, 113, gray_meanie_guide pp. 71, 73).
  So by its own guide each edition would be recorded as the 2600 is. This file is not offered as
  either's, and whether each wants a definition of its own is not settled here.

  **THE APPLICATION WAS NOT RUN.** The page offers Synthtribe and the guide never mentions it. By
  `behringer/edge`'s account the same application sets that instrument's channel and other
  parameters; whether it reaches the 2600, and what it would show, no document says. Vendor
  software is not installed to read a specification.

  NOT RECORDED: the controllers, for the reason above, and not declared absent; the mode, there
  being no chart; velocity, the note range, pitch bend and aftertouch, none of them mentioned;
  program change, system exclusive and NRPN, none of them named in any spelling; clock and
  transport, every clock in the guide being the sample and hold's; what the USB port sends, of
  which the guide says only that the port supports MIDI both ways; and the firmware.

