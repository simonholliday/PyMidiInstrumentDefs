    # THE SIBLING'S PAGE, FETCHED TO PROVE THE TWO PRODUCTS ARE SERVED ONE MANUAL. Its "Manual"
    # link is share id `eAn5dToRQ6b3xGi` against this product's `egbiccS5iBns7wL`, and the two
