# NOT THE CIRCUIT TRACKS, WHICH IS A DIFFERENT INSTRUMENT AND IS ALSO IN THIS CORPUS. This is the
# original Circuit of 2015, discontinued: two six-voice synths, four drums and a session. The
# Circuit Tracks is the 2020 successor, with two MIDI tracks this has none of and 358 controls
# against this one's 299. There are also a Circuit Rhythm and a Circuit Mono Station, neither
# covered here.
#
# **THE REFERENCE GUIDE PRINTS SEVENTY-FOUR OF ITS SYNTH ROWS TWICE**, in blocks: pages 4, 5 and 6
# repeat the tail of the LFO section and the whole of Effects and EQ. Every repeat is identical in
# every cell, so nothing is lost and nothing has to be chosen between - but a reader who counts
# rows gets 307 where the instrument has 233.
#
# AND THE GUIDE IS STALE ABOUT ITS OWN CHANNELS. It says "Send messages on MIDI Channel 1 for
# Synth 1 and Channel 2 for Synth" and "Messages on MIDI Channel 10", as if those were fixed.
# **Firmware 1.8 made them settable** - three years before this edition of the guide was issued.

definition: 1

model:
  manufacturer: Novation
  name: Circuit
  # The newest firmware any document here describes. The user guide is edition 1.6, the addendum
  # covers 1.7, and the "Circuit 1.8 User Guide" covers 1.8 - which is where the assignable MIDI
  # channels come from. The Programmer's Reference Guide is version 1.3 and names no firmware at
  # all, though it was issued in 2022, three years after 1.8.
  firmware: "1.8"

source: >-
  Programmer's Reference Guide 1.3 (20pp), which carries **all three control tables**: Synths 1 & 2
  at pp. 3-7, Drum Control at p. 10, Session Control at p. 11, with the value tables they point at
  at pp. 8-9 and the patch and session program changes at p. 9. The User Guide (72pp, edition 1.6)
  for the voices, the channels and the MIDI settings; the v1.7 addendum; and **the 1.8 User Guide
  for the one thing that changed the channels**.

  THE GUIDE PRINTS SEVENTY-FOUR OF ITS 307 SYNTH ROWS MORE THAN ONCE. Pages 4, 5 and 6 repeat
  whole blocks - the tail of the LFO section from `Lfo 1 common sync` to `lfo 2 fade mode`, and
  the entire Effects and EQ section from `distortion level` to `chorus delay`. **Every repeat is
  identical in every cell**, which is asserted by the script that reads them, so this costs
  nothing but the counting: 307 rows, **233 distinct synth controls**.

  **A repeat does not carry its own section**, which is the trap in reducing them. A section name
  is printed once, on its first row, so a block repeated further down a later page inherits
  whatever section was open there: `Lfo 2 waveform` is under LFO where it is first printed and
  under Mod Matrix where it is repeated. And the section cannot simply be ignored either, because
  in the Session table the same name under two sections is **two different controls** - `synth 1
  send level` is CC 88 under Reverb and CC 111 under Delay. A repeat is therefore a row whose
  every cell but the section matches an earlier one, which tells the two apart.

  **AND THE REPRINT DID NOT ADD CONTENT, IT REPLACED IT.** Thirty-nine rows the instrument plainly
  has are missing from this guide, and what sits where they should be is the duplicated blocks:

  * **Macro knobs 1 and 2 are absent altogether** - thirty-four rows. Knobs 4 to 8 each have
    seventeen: a position, and for each of four slots A to D a destination, a start position, an
    end position and a depth.
  * **Macro knob 3 begins four rows in**, at `macro knob 3 depth A`. Its position, destination A,
    start position A and end position A are not printed.
  * **`mod matrix 11 destination` is missing**, where mod matrix 1 to 10 each have one.

  The numbering makes the gap unmistakable: the macro positions run CC 83, 84, 85, 86, 87 for
  knobs 4 to 8, and `mod matrix 11 depth` is NRPN 2:8 where 10's destination is 2:4. **The missing
  numbers are predictable and are not recorded**, because predicting a controller number is not
  reading one. What a player cannot reach from this document is two of the eight macro knobs,
  most of a third, and one modulation destination.

  TWO NRPN ADDRESSES CARRY TEN PARAMETERS BETWEEN THEM, told apart by the value sent rather than
  by the address. NRPN 0:122 is eight switches - `lfo 1 one shot` at 12-13, `lfo 1 key sync` at
  14-15, `Lfo 1 common sync` at 16-17 and so on to `lfo 2 delay trigger` at 28-29 - and NRPN 0:123
  is two, `Lfo 1 fade mode` at 0-3 and `lfo 2 fade mode` at 4-7. Each is a control of its own
  below with its own range, which is what a sender needs: the address says nothing and the value
  says everything.

  THE GUIDE IS OUT OF DATE ABOUT ITS OWN CHANNELS, AND IT IS THE NEWER DOCUMENT. It heads the
  synth table "Send messages on MIDI Channel 1 for Synth 1 and Channel 2 for Synth" (guide p. 3)
  and the drum table "Messages on MIDI Channel 10" (guide p. 10), with no suggestion that either
  can move. **Firmware 1.8
  changed that**: "MIDI channels for each track can now be changed from the setup menu. Synth 1,
  Synth 2 and Drum 1/2/3/4 can now be set to MIDI channels 1-15. Channel 16 is reserved for the
  session." The 1.8 guide is dated 2019 and this edition of the reference guide was made in 2022,
  so the newer document describes the older instrument. The channels below follow 1.8.

  **The guide's own sentence about those channels is cut short**: it reads "Channel 2 for Synth"
  where it means Synth 2.

  NOVATION SERVES THIS GUIDE TWICE AT ONE NAME, and the second copy is not listed. The download
  page offers `Circuit Programmer's Reference Guide 1.3_2.pdf`; `_1` is live at the same path and
  nothing points at it. **They are identical in text on all twenty pages** and differ only in how
  their images are compressed - 2.4 MB against 371 KB - and they were exported eighty-three
  minutes apart on the same afternoon. So trying the numbers found a second file and it says
  exactly the same thing, which is worth recording as the outcome it is.

  AND THIS GUIDE'S CONTENTS PAGE IS RIGHT, for all twenty of its entries. Its successor's is a
  page out for eighteen of twenty, which cost real time when that one was read. Same maker, same
  template,
  four years apart, and this is the one that is correct.

  ONE NOTE IS SET IN THE NEXT ROW'S CELL. The Filter `routing` note wraps over four printed lines
  and the fourth - the single word `filter` - is typeset inside the `drive` row's Notes cell. Read
  row by row, `routing` ends mid-sentence at "bypasses the" and `drive` acquires a one-word note
  that means nothing. They are put back together, by name rather than by position, so that a
  re-issue which fixes the typesetting simply stops matching.

  AND ONE SESSION ROW LOOKS LIKE A TYPO THAT IS NOT CORRECTED HERE. The Sidechain section's
  `synth 2 depth` is NRPN 1:69 where its five siblings run 2:65 to 2:68 and synth 1's equivalent
  is 2:59. Both readings found 1:69 in the file. It is almost certainly meant to be 2:69, and
  **the published number is what is recorded**, because correcting a maker's number is not
  reading it.

  NOT RECORDED: the range of notes either synth answers to, which no document states; what
  the drums do with a note outside the four in the Drum Notes Table; and whether the Circuit
  answers to aftertouch or pitch bend, neither of which is mentioned in any of these documents.

sources:
  guide:
    kind: midi_implementation
    title: Programmer's Reference Guide
    edition: "1.3"
    dated: "2022-02-17"
    landing: "https://downloads.novationmusic.com/novation/circuit/circuit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/Circuit%20Programmer%27s%20Reference%20Guide%201.3_2.pdf"
    sha256: 616fbf2ec3b6ea0b5f3032e6e3b8212fc9c24dd837442d6b31a0d557715c3ddf
    retrieved: 2026-10-04
    page_offset: 0
    # 20 pages, each printing its own number as the first line of its text, so a printed page is
    # a sheet. **Every number below comes from this file.** The date is the PDF's own build date;
    # the document states none.
  guide_other_upload:
    kind: midi_implementation
    title: Programmer's Reference Guide
    edition: "1.3"
    dated: "2022-02-17"
    landing: "https://downloads.novationmusic.com/novation/circuit/circuit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/Circuit%20Programmer%27s%20Reference%20Guide%201.3_1.pdf"
    sha256: 6b237fa4abf0def294a504c8994f48af7bb10612deaad320298a241b77d549bc
    retrieved: 2026-10-04
    page_offset: 0
    # **THE SAME GUIDE AT THE SAME VERSION, UPLOADED TWICE AND LISTED ONCE.** Found by trying the
    # number in the file name. Identical in text on all twenty pages; it differs only in image
    # compression and was exported eighty-three minutes earlier. **No number below rests on it**,
    # and it is held because a maker who serves two files under one version number may one day
    # serve two that differ.
  user_guide:
    kind: manual
    title: Circuit User Guide
    edition: "1.6"
    landing: "https://downloads.novationmusic.com/novation/circuit/circuit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/novation/downloads/15792/circuit-ug-en-03-v1-6.pdf"
    sha256: 2b8b0ba00cba799e4c02b723e5b8709059b9ff96e1e23a18eff59ffe25725f4a
    retrieved: 2026-10-04
    page_offset: 1
    # 72 sheets, printing one less than each: sheet 67 prints 66. Cited for the voices, the
    # default channels and the Settings View switches.
  update_1_8:
    kind: release_notes
    title: Circuit 1.8 User Guide
    edition: "1.8"
    dated: "2019-02-26"
    landing: "https://downloads.novationmusic.com/novation/circuit/circuit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/downloads/Circuit%201.8%20User%20Guide.pdf"
    sha256: bc945e3f19419f6d0a5900296844c88236a2527d5a69ad3bbaff3b483b23b5a4
    retrieved: 2026-10-04
    page_offset: 0
    # Seven pages, and **called a User Guide while being release notes** - its contents are the
    # four features 1.8 added. It is cited for one of them, the assignable MIDI channels, which
    # the Programmer's Reference Guide still does not know about three years later.

midi:
  # **1 to 15 FOR A TRACK, AND 16 IS NOT A TRACK'S TO TAKE.** "Synth 1, Synth 2 and Drum 1/2/3/4
  # can now be set to MIDI channels 1-15. Channel 16 is reserved for the session" (update_1_8
  # p. 7). So a consumer offering a channel picker for a track should offer fifteen, not sixteen.
  channels: [1, 15]
  # Four categories of MIDI data, each with its own Rx and Tx switch: "Settings View allows you to
  # decide how you want Circuit to operate with other MIDI equipment for four categories of MIDI
  # data independently: Note, CC (Control Change), Program Change and MIDI Clock" (user_guide
  # p. 67). So clock goes both ways, by a switch for each direction.
  clock: both
  # The guide lists "start", "stop", "continue" and "timing clock" (guide p. 9) together under
  # Realtime Messages (guide p. 9), and the Settings View's MIDI Clock category is the switch for
  # all of them. **It does not say which direction each goes**, and the switch has both, so both
  # is what is recorded.
  transport: both
  program_change:
    receives: true
    sends: true
    # A PROGRAM CHANGE MEANS DIFFERENT THINGS ON DIFFERENT CHANNELS. On a synth channel it picks
    # one of that synth's patches - the guide's table gives "0 – 63" against "select synth 1
    # patch" (guide p. 9) - and on channel 16 it picks a session, "select session (instant)"
    # and "select session (queued)" (guide p. 9). A drum patch is not a program change at all:
    # "Note, for drum patch selection see Drum Control table" (guide p. 9), where it is a
    # control change. **The count here is
    # the synth patches**, which is what a program change on a track channel reaches.
    presets: 64
  # 204 of the 299 controls below are addressed by NRPN and 95 by control change, and the maker
  # never ranks the two: the Settings View switch is a single "MIDI CC data" category covering
  # both, so `supported` is as far as the documents go.
  nrpn: supported
  # Patch dumps, in both directions, with the byte layout published in full: "Replace Current
  # Patch" (guide p. 12), "Replace Patch" (guide p. 12) and "Patch Dump Request" (guide p. 13),
  # with the Synth Patch Format at pp. 14-20.
  sysex: true

voice:
  # NOT GIVEN FOR THE INSTRUMENT, because its parts do not agree: a synth reads a note as a pitch
  # and the drums read one as a choice of four. Each synth has six voices of its own - see
  # `parts.synth` - so there is no shared pool to state here either.
  polyphony_shared: false
  # The Drum Notes Table (guide p. 10), which is what a note means on the drum channel.
  voices:
    drum_1: 60
    drum_2: 62
    drum_3: 64
    drum_4: 65

parts:
  # Every part is given its own channel and none derives one from a base, because there is no base
  # channel here: six tracks are each set to a channel of the player's choosing, and the session
  # answers on one reserved for it.
  synth:
    label: Synth
    count: 2
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]
    # "Circuit's six-note polyphony lets you play any six notes from each synth, and they don't
    # all need to be in the same octave" (user_guide p. 30). **SIX EACH AND NOT SIX SHARED** -
    # the sentence says each synth, which is why the figure is here and not on the instrument.
    #
    # The Circuit Tracks' guide ends the same sentence differently, "a conventional chord", and
    # quoting that one here is a mistake the quotation checker caught.
    polyphony: 6
  drums:
    label: Drums
    channel: assigned
    addressing: voices
    receives: [notes, controls]
    # FOUR DRUMS AND ONE PART, because the control table enumerates all four on one channel:
    # "Messages on MIDI Channel 10" (guide p. 10) heads all 28 of its rows, and the rows name
    # drum 1 to drum 4 individually. **Firmware 1.8 lets each drum take a channel of its own**,
    # and the guide published three years later still prints them on one; what the controller
    # numbers do when the drums are separated is not stated anywhere, so this follows the table.
    # No program change: the guide sends the reader to the drum table instead, where patch
    # selection is CC 8, 18, 44 and 50.
  session:
    label: Session
    channel: assigned
    receives: [controls, program_change]
    # **CHANNEL 16, AND THE ONE CHANNEL A PLAYER CANNOT MOVE**: "Channel 16 is reserved for the
    # session" (update_1_8 p. 7), against the six tracks that may take any of 1 to 15. It takes
    # no notes - it is the reverb, the delay, the master filter, the sidechains and the mixer -
    # and it takes a program change of its own, which selects a session rather than a patch.
    #
    # `channel: assigned` IS THE NEAREST THIS FORMAT HAS and it is not quite right: this channel
    # is fixed, not chosen. The field has `assigned` for a channel the player picks and
    # `channel_offset` for one derived from a base, and no way to say "always 16". Recorded as
    # assigned so that a consumer can address it at all, with the number said here.

# How to read the controls below. Every one is **received**; what the Circuit transmits is the
# same map in reverse, by the Settings View's Tx switches, and the guide publishes one table for
# both directions rather than two.
#
# `range` is the wire range, which is the first pair of numbers in the guide's Range column. Where
# a control is signed the guide prints the player-facing range after it in brackets - `0 – 127
# (-64 – 63)` - and that bracketed pair is a display rather than something to send, so it is not
# recorded. `default` is the guide's own Default Value, likewise its first number.
#
# `choices` appears where the guide names **every** value a control can take, either in its Notes
# column or in a value table it points at. **A note that names some of them does not count**:
# Keyboard Octave runs 58 to 69 and its note reads "60=-4 Octaves, 64=0 Octaves, 68=+4 Octaves",
# three of the twelve steps named to show a reader where the middle is. Recording those three
# would say the other nine do not exist.
#
# NOTHING IS SET ASIDE. Neither the guide's tables nor its value tables hold a mechanism row -
# no bank select, no data entry - so every row of all three tables is below, once.

groups:
  # The guide's own Section column, which is the best thing about this document: it names eight
  # sections for the synths and six for the session, and every row carries one. **`Mixer` is used
  # by both tables**, so the identifiers are qualified by part while the labels stay the maker's.
  voice: Voice
  oscillator: Oscillator
  mixer: Mixer
  filter: Filter
  envelope: Envelope
  lfo: LFO
  effects_and_eq: Effects and EQ
  mod_matrix: Mod Matrix
  # NOT A SECTION OF THE GUIDE'S: the Drum Control table has no Section column at all, and this
  # is the table's own name.
  drums: Drum Control
  reverb: Reverb
  delay: Delay
  master_filter: Master Filter
  sidechain: Sidechain
  session_mixer: Mixer
  additional_controls: Additional Controls

controls:
# ──── synth: voice ────

  polyphony_mode:                    {label: Polyphony Mode, cc: 3, range: [0, 2], default: 2, choices: {"mono": 0, "mono_ag": 1, "poly": 2}, part: synth, group: voice}
  portamento_rate:                   {label: Portamento Rate, cc: 5, default: 0, part: synth, group: voice}
  pre_glide:                         {label: Pre-Glide, cc: 9, range: [52, 76], default: 64, part: synth, group: voice}
  keyboard_octave:                   {label: Keyboard Octave, cc: 13, range: [58, 69], default: 64, part: synth, group: voice}

  # ──── synth: oscillator ────

  osc_1_wave:                        {label: osc 1 wave, cc: 19, range: [0, 29], default: 2, choices: {"sine": 0, "triangle": 1, "sawtooth": 2, "saw_9_1_pw": 3, "saw_8_2_pw": 4, "saw_7_3_pw": 5, "saw_6_4_pw": 6, "saw_5_5_pw": 7, "saw_4_6_pw": 8, "saw_3_7_pw": 9, "saw_2_8_pw": 10, "saw_1_9_pw": 11, "pulse_width": 12, "square_wavetables": 13, "sine_table": 14, "analogue_pulse": 15, "analogue_sync": 16, "triangle_saw_blend": 17, "digital_nasty_1": 18, "digital_nasty_2": 19, "digital_saw_square": 20, "digital_vocal_1": 21, "digital_vocal_2": 22, "digital_vocal_3": 23, "digital_vocal_4": 24, "digital_vocal_5": 25, "digital_vocal_6": 26, "random_collection_1": 27, "random_collection_2": 28, "random_collection_3": 29}, part: synth, group: oscillator}
  osc_1_wave_interpolate:            {label: osc 1 wave interpolate, cc: 20, default: 0, part: synth, group: oscillator}
  osc_1_pulse_width_index:           {label: osc 1 pulse width index, cc: 21, default: 127, part: synth, group: oscillator}
  osc_1_virtual_sync_depth:          {label: osc 1 virtual sync depth, cc: 22, default: 0, part: synth, group: oscillator}
  osc_1_density:                     {label: osc 1 density, cc: 24, default: 0, part: synth, group: oscillator}
  osc_1_density_detune:              {label: osc 1 density detune, cc: 25, default: 0, part: synth, group: oscillator}
  osc_1_semitones:                   {label: osc 1 semitones, cc: 26, default: 64, part: synth, group: oscillator}
  osc_1_cents:                       {label: osc 1 cents, cc: 27, default: 64, part: synth, group: oscillator}
  osc_1_pitchbend:                   {label: osc 1 pitchbend, cc: 28, range: [52, 76], default: 76, part: synth, group: oscillator}
  osc_2_wave:                        {label: osc 2 wave, cc: 29, range: [0, 29], default: 2, choices: {"sine": 0, "triangle": 1, "sawtooth": 2, "saw_9_1_pw": 3, "saw_8_2_pw": 4, "saw_7_3_pw": 5, "saw_6_4_pw": 6, "saw_5_5_pw": 7, "saw_4_6_pw": 8, "saw_3_7_pw": 9, "saw_2_8_pw": 10, "saw_1_9_pw": 11, "pulse_width": 12, "square_wavetables": 13, "sine_table": 14, "analogue_pulse": 15, "analogue_sync": 16, "triangle_saw_blend": 17, "digital_nasty_1": 18, "digital_nasty_2": 19, "digital_saw_square": 20, "digital_vocal_1": 21, "digital_vocal_2": 22, "digital_vocal_3": 23, "digital_vocal_4": 24, "digital_vocal_5": 25, "digital_vocal_6": 26, "random_collection_1": 27, "random_collection_2": 28, "random_collection_3": 29}, part: synth, group: oscillator}
  osc_2_wave_interpolate:            {label: osc 2 wave interpolate, cc: 30, default: 0, part: synth, group: oscillator}
  osc_2_pulse_width_index:           {label: osc 2 pulse width index, cc: 31, default: 127, part: synth, group: oscillator}
  osc_2_virtual_sync_depth:          {label: osc 2 virtual sync depth, cc: 33, default: 0, part: synth, group: oscillator}
  osc_2_density:                     {label: osc 2 density, cc: 35, default: 0, part: synth, group: oscillator}
  osc_2_density_detune:              {label: osc 2 density detune, cc: 36, default: 0, part: synth, group: oscillator}
  osc_2_semitones:                   {label: osc 2 semitones, cc: 37, default: 64, part: synth, group: oscillator}
  osc_2_cents:                       {label: osc 2 cents, cc: 39, default: 64, part: synth, group: oscillator}
  osc_2_pitchbend:                   {label: osc 2 pitchbend, cc: 40, range: [52, 76], default: 76, part: synth, group: oscillator}

  # ──── synth: mixer ────

  osc_1_level:                       {label: osc 1 level, cc: 51, default: 127, part: synth, group: mixer}
  osc_2_level:                       {label: osc 2 level, cc: 52, default: 0, part: synth, group: mixer}
  ring_mod_level:                    {label: ring mod level, cc: 54, default: 0, part: synth, group: mixer}
  noise_level:                       {label: noise level, cc: 56, default: 0, part: synth, group: mixer}
  pre_fx_level:                      {label: pre FX level, cc: 58, range: [52, 82], default: 64, part: synth, group: mixer}
  post_fx_level:                     {label: post FX level, cc: 59, range: [52, 82], default: 64, part: synth, group: mixer}

  # ──── synth: filter ────

  routing:                           {label: routing, cc: 60, range: [0, 2], default: 0, part: synth, group: filter}
  drive:                             {label: drive, cc: 63, default: 0, part: synth, group: filter}
  drive_type:                        {label: drive type, cc: 65, range: [0, 6], default: 0, choices: {"diode": 0, "valve": 1, "clipper": 2, "cross_over": 3, "rectifier": 4, "bit_reducer": 5, "rate_reducer": 6}, part: synth, group: filter}
  type:                              {label: type, cc: 68, range: [0, 5], default: 1, part: synth, group: filter}
  frequency:                         {label: frequency, cc: 74, default: 127, part: synth, group: filter}
  tracking:                          {label: tracking, cc: 69, default: 127, part: synth, group: filter}
  resonance:                         {label: resonance, cc: 71, default: 0, part: synth, group: filter}
  q_normalize:                       {label: Q normalize, cc: 78, default: 64, part: synth, group: filter}
  env_2_to_frequency:                {label: env 2 to frequency, cc: 79, default: 64, part: synth, group: filter}

  # ──── synth: envelope ────

  env_1_velocity:                    {label: env 1 velocity, cc: 108, default: 64, part: synth, group: envelope}
  env_1_attack:                      {label: env 1 attack, cc: 73, default: 2, part: synth, group: envelope}
  env_1_decay:                       {label: env 1 decay, cc: 75, default: 90, part: synth, group: envelope}
  env_1_sustain:                     {label: env 1 sustain, cc: 70, default: 127, part: synth, group: envelope}
  env_1_release:                     {label: env 1 release, cc: 72, default: 40, part: synth, group: envelope}
  env_2_velocity:                    {label: env 2 velocity, nrpn: 0, default: 64, part: synth, group: envelope}
  env_2_attack:                      {label: env 2 attack, nrpn: 1, default: 2, part: synth, group: envelope}
  env_2_decay:                       {label: env 2 decay, nrpn: 2, default: 75, part: synth, group: envelope}
  env_2_sustain:                     {label: env 2 sustain, nrpn: 3, default: 35, part: synth, group: envelope}
  env_2_release:                     {label: env 2 release, nrpn: 4, default: 45, part: synth, group: envelope}
  env_3_delay:                       {label: env 3 delay, nrpn: 14, default: 0, part: synth, group: envelope}
  env_3_attack:                      {label: env 3 attack, nrpn: 15, default: 10, part: synth, group: envelope}
  env_3_decay:                       {label: env 3 decay, nrpn: 16, default: 70, part: synth, group: envelope}
  env_3_sustain:                     {label: env 3 sustain, nrpn: 17, default: 64, part: synth, group: envelope}
  env_3_release:                     {label: env 3 release, nrpn: 18, default: 40, part: synth, group: envelope}

  # ──── synth: lfo ────

  lfo_1_waveform:                    {label: lfo 1 waveform, nrpn: 70, range: [0, 37], default: 0, part: synth, group: lfo}
  lfo_1_phase_offset:                {label: lfo 1 phase offset, nrpn: 71, range: [0, 119], default: 0, part: synth, group: lfo}
  lfo_1_slew_rate:                   {label: lfo 1 slew rate, nrpn: 72, default: 0, part: synth, group: lfo}
  lfo_1_delay:                       {label: lfo 1 delay, nrpn: 74, default: 0, part: synth, group: lfo}
  lfo_1_delay_sync:                  {label: lfo 1 delay sync, nrpn: 75, range: [0, 35], default: 0, part: synth, group: lfo}
