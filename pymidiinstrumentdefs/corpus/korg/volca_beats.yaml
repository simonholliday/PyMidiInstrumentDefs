midi:
  # The chart's Basic Channel row gives 1 to 16 for the default and 1 to 16 for a changed one,
  # remarked "Memorized" (chart p. 1), and the owner's manual says how it is changed: hold MEMORY
  # while turning it on, then "Step buttons 1 to 16 correspond to the MIDI channels 1 to 16"
  # (manual).
  channels: [1, 16]
  # The chart's recognised Mode row reads 3, which is omni off and poly; its Messages and Altered
  # rows are both a cross (chart p. 1).
  mode: 3
  # A circle received and a cross transmitted, with footnote *3 (chart p. 1), and the text file
  # lists "Timing Clock" (midi_impl) among its system real time messages. There is no MIDI OUT to
  # send one on.
  clock: receives
  # Start, Continue and Stop are all in the text file's real time table (midi_impl), and the
  # chart's Command row is a circle received with footnote *3 (chart p. 1). Song Position is a
  # circle too, and the text file says what it does with one: "pppp : 0~15 = STEP 1 ~ STEP 16"
  # (midi_impl).
  transport: receives
  program_change:
    # A cross in both columns, and its Variable Range row is asterisks in both (chart p. 1). The
    # instrument does hold sequences - the owner's manual says it "is equipped with 8 memory
    # locations that are used to save sequences" (manual) - and nothing over MIDI reaches them, so
    # no preset count is recorded.
    receives: false
    sends: false
  # A cross in both columns (chart p. 1).
  sysex: false
  # CHECKED AND ABSENT. The words NRPN, RPN, Registered and Parameter Number appear nowhere in
  # either MIDI document.
  nrpn: none

voice:
  # A NOTE PICKS A PART RATHER THAN A PITCH, and the chart says what happens to any other
  # note: "Sounds are not produced for notes other than the" (chart p. 1) specified ones.
  addressing: voices
  # The chart's True Voice row, which is the narrower of its two: Note Number recognised is
  # "0 - 127" and True Voice is "36 - 75" (chart p. 1). Ten numbers inside that span do something
  # and the rest are silent, which `voices` below gives exactly.
  note_range: [36, 75]
  velocity:
    # FROM THE TEXT FILE, BECAUSE THE CHART'S CELL CANNOT BE READ EITHER WAY. The text file's
    # recognised channel messages include "Note On  vv=1~127" (midi_impl); the chart's Velocity
    # Note On cell holds a cross and that same form together. See the source account.
    note_on: received
    # The chart's Velocity Note Off row is a cross in both columns (chart p. 1) - which is release
    # velocity, and is not the same question as whether a note-off message is accepted. The text
    # file accepts two forms of one, "Note Off  vv=0~127" (midi_impl) and a note-on with a
    # velocity of zero, and ignores the velocity in both.
    note_off: false
  # A checked absence, from the chart's own rows: Polyphonic (Key) is a cross in both columns and
  # Monophonic (Channel) is a cross in both (chart p. 1).
  aftertouch: none
  # NOT RECORDED: pitch bend, because there is none. The chart marks Pitch Bend a cross in both
  # columns (chart p. 1), so there is no range to state.
  #
  # NOT RECORDED: polyphony. Neither document says how many of the ten parts will sound at once,
  # and the specification counts the sound generators rather than the voices - "Analog sound
  # sources (kick drum, snare, high tom, low tom and hi-hat), PCM sound sources (crash, clap,
  # claves and agogo)" (manual).
  voices:
    # THE TEN PARTS AND THE NOTE THAT PLAYS EACH, from the text file's own list, where every number
    # is given in hexadecimal and in decimal and the two agree. **The chart's footnote gives only
    # the first seven of these** - see the note at the top of this file.
    kick: 36
    snare: 38
    clap: 39
    cl_hat: 42
    lo_tom: 43
    op_hat: 46
    crash: 49
    hi_tom: 50
    agogo: 67
    claves: 75

groups:
  # THE MAKER'S OWN PREFIX INSIDE THE ROWS, which is also how the chart rules the same twenty into
  # blocks: ten part levels on 40 to 49, four PCM speeds on 50 to 53, then one row each. **Hat
  # grain has no prefix and no group**, because inventing one for a single control would be
  # inventing a grouping the maker does not have.
  part_level: Part level
  pcm_speed: PCM speed
  stutter: Stutter
  decay: Decay
controls:

  # ──── part_level ────

  part_level_kick:   {label: Part level (kick), cc: 40, direction: receives, group: part_level}
  part_level_snare:  {label: Part level (snare), cc: 41, direction: receives, group: part_level}
  part_level_lo_tom: {label: Part level (lo tom), cc: 42, direction: receives, group: part_level}
  part_level_hi_tom: {label: Part level (hi tom), cc: 43, direction: receives, group: part_level}
  part_level_cl_hat: {label: Part level (cl hat), cc: 44, direction: receives, group: part_level}
  part_level_op_hat: {label: Part level (op hat), cc: 45, direction: receives, group: part_level}
  part_level_clap:   {label: Part level (clap), cc: 46, direction: receives, group: part_level}
  part_level_claves: {label: Part level (claves), cc: 47, direction: receives, group: part_level}
  part_level_agogo:  {label: Part level (agogo), cc: 48, direction: receives, group: part_level}
  part_level_crash:  {label: Part level (crash), cc: 49, direction: receives, group: part_level}

  # ──── pcm_speed ────

  pcm_speed_clap:    {label: PCM speed (clap), cc: 50, direction: receives, group: pcm_speed}
  pcm_speed_claves:  {label: PCM speed (claves), cc: 51, direction: receives, group: pcm_speed}
  pcm_speed_agogo:   {label: PCM speed (agogo), cc: 52, direction: receives, group: pcm_speed}
  pcm_speed_crash:   {label: PCM speed (crash), cc: 53, direction: receives, group: pcm_speed}

  # ──── stutter ────

  stutter_time:      {label: Stutter time, cc: 54, direction: receives, group: stutter}
  stutter_depth:     {label: Stutter depth, cc: 55, direction: receives, group: stutter}

  # ──── decay ────

  decay_tom:         {label: Decay (tom), cc: 56, direction: receives, group: decay}
  decay_closed_hat:  {label: Decay (closed hat), cc: 57, direction: receives, group: decay}
  decay_open_hat:    {label: Decay (open hat), cc: 58, direction: receives, group: decay}

  # ──── no group of its own ────

  hat_grain:         {label: Hat grain, cc: 59, direction: receives}
