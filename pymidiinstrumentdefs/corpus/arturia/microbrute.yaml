    retrieved: 2026-10-06
    # **THE DIGEST IS THE PDF'S, AND THE ADDRESS IS THE ARCHIVE IT CAME OUT OF**, because Arturia
    # publishes no address for this document at all. Fifteen sheets; its own title block reads
    # `MICROBRUTE_connection-Manual_v1.0.2x` while the file is named `v1.0.3`, so the edition
    # above is the filename's. Sheet 13 is the controller table and is the only sheet in either
    # document that carries a controller number.
  release_note:
    kind: release_notes
    title: Arturia MicroBrute Firmware Update V1.0.3.2 and Connection Software
    dated: 2013-11-08
    landing: "https://www.arturia.com/support/downloads-manuals/product/microbrute"
