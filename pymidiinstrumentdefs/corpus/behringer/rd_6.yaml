    # The visible text of the RD-6-BK's page, which offers both documents above, the Chinese and
    # Japanese guides and the Synthtribe app. Its download list is in the script payload of the HTML
    # saved beside it, which hashes to
    # 1f2755856e0ff5f096d4bbb2efffea653349c00e8cd2b36eedbdaa00f7487fef.

midi:
  # "press STEP KEYS 1-16 to select the channel, press PATTERN GROUP to switch between MIDI transmit
  # (out) and receive (in)." (guide p. 34): one channel each way. No default is stated.
  channels: [1, 16]
  # "Step keys 1, 2, 3, or 4 represent clock source INT, MIDI, USB, or TRIG respectively."
  # (guide p. 34), and the table gives `F8` Timing Clock. So MIDI and USB are each a clock this
  # instrument follows. The next four keys set a clock rate, 1PPS, 2PPQ, 24PPQ or 48PPQ, and no page
  # says which sources it applies to. Nothing says a MIDI clock is sent; its SYNC OUT is an analogue
  # jack.
  clock: receives
  # AN INFERENCE, STATED AS ONE. `FA` Start, `FB` Continue and `FC` Stop are in the table
  # (guide p. 53), which gives no direction. MIDI and USB are clock sources (guide p. 34), so they
  # are taken to arrive with the clock, as for `behringer/td_3`. No page says the RD-6 starts or
  # stops from them, or that it sends them.
  transport: receives
  # By the table, and by the inference the account sets out.
  control_change: none

voice:
  # Eight drums on eight notes, each a drum rather than a pitch.
  addressing: voices
  # "Number of simultaneous voices 8" (guide p. 52).
  polyphony: 8
  # The table's channel messages are 8n, 9n and Bn, so neither `An` nor `Dn` is among them.
  aftertouch: none
  # THE GUIDE'S TABLE, in its order and with its names (guide p. 53). No page says they can be
  # changed.
  voices:
    bass_drum: 36
    snare_drum: 40
    low_tom: 45
    hi_tom: 50
    clap: 39
    cymbal: 51
    open_hat: 46
    closed_hat: 42

# NO CONTROLS BLOCK: see midi.control_change above. The same shape as `behringer/td_3` and
# `behringer/rd_9`.
