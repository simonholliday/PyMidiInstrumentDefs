definition: 1

# A MONOPHONIC MOOG WHOSE SOUND CONTROLS ARE IN ONE CONTROL CHANGE TABLE, AND THE TABLE IS OLDER
# THAN THE FIRMWARE MOOG SHIPS. The manual's table gives nearly every sound parameter a controller
# number, and the value of every stepped setting but the two pitch bend depths; this file carries
# all 51 of its 57 rows that have a number, as 52 controls. The manual describes a system before
# 3.1, and Moog's current package is 3.21, whose notes add one controller; see the account.

model:
  manufacturer: Moog Music
  name: Slim Phatty
  # NOT RECORDED: a firmware version. No page's text names one: the start-up message is printed as
  # "Slim Phatty Version X.x" (manual p. 7). Two pictures of the System Utilities display read
  # `VERS: 2.2` (manual pp. 35 and 45) - an illustration rather than a statement of what any Slim
  # Phatty runs, as `alesis/sr_16` treats its pictured `VERSION 1.00`. The manual describes a system
  # before 3.1 all the same, on two kinds of evidence. Every date it carries is earlier than 3.1's
  # announcement in May 2011 - the chart's 10/1/10 (manual p. 67) and the colophon's 2010
  # (manual p. 76) - and so is the pictured 2.2; and none of what 3.1, 3.2 or 3.21 added is on any
  # of its pages. Moog's package today is 3.21. Checked 2026-10-09.

source: >-
  The Slim Phatty User's Manual, 75 sheets: the presets at p. 7, the LFO's sync at p. 27, the Master
  menus at pp. 28 to 34, the pitch bend and Pot Mapping menus at pp. 37 to 39, the arpeggiator's
  menu at p. 40, the SysEx menus at pp. 42 to 44, the MIDI chapter at p. 54, the control change
  table at pp. 55 and 56 with its two value tables at p. 57, the clock appendices at pp. 58 and 59,
  the MIDI Implementation Chart at p. 67, and the specifications at p. 71.

  EVERY CONTROLLER NUMBER AND VALUE BELOW IS THE TABLE'S OR ITS VALUE TABLES'. The table is
  captioned `Slim Phatty MIDI CC messages` under each of its halves and gives each row a section, a
  parameter, a function, a controller number and a value column (manual pp. 55 and 56). The chart
  agrees with it about every number but one: it lists 53 where the table gives cutoff's fine half as
  51 (manual pp. 55 and 67). 51 is recorded, because it is the cutoff's 19 plus 32, as the
  modulation wheel's fine half is its 1 plus 32, which is how the MIDI specification pairs them.

  STEPPED SETTINGS ARE EXACT VALUES, NOT BANDS, because that is how the table prints them: "0 (TRI),
  16 (SQUARE)" (manual p. 55) and so on, a value and its name. They are recorded as `choices`, as
  `moog/messenger` records its one list of exact values. Three rows, two on p. 55 and one on p. 56,
  send the reader to a table on another page: "See table for list of values" (manual p. 55). Those
  tables give fifteen clock divisions and seventeen velocity sensitivities, value by value
  (manual p. 57). The two pitch bend depths are the exception: the table prints them as 0 to 127,
  and the menu that sets the same depths offers seven steps each way (manual pp. 37 and 55).

  TWO CONTROLS ARE FOURTEEN BITS AS RECEIVED, AND TWO MORE SPLIT ONE SETTING. "The SP sends and
  receives 7-bit MIDI CC messages for all parameters except for the Modulation Wheel and Filter
  Cutoff, which receive high-resolution, 14-bit MIDI CC messages." (manual p. 54): 1 with 33, and 19
  with 51. Only receiving them in fourteen bits is stated. The arpeggiator's rate is one row and two
  controllers of a different kind, 4 for the `coarse` rate in steps of 3 BPM over 21 to 320 BPM and
  36 for the `fine` in tenths of one (manual pp. 54 and 56), and the manual works an example: "For
  CC#04 = 40 and CC#36 = 17, the SP's display will show '121.7 BPM'." (manual p. 54). So 36 is
  recorded as a control of its own and not as 4's lower half, although its number is 4 plus 32.

  CONTROLLER 6 IS THE MODULATION AMOUNT, NOT DATA ENTRY, AND A CEILING RATHER THAN A LEVEL. The
  table gives "Adjusts the modulation amount" (manual p. 55) against 6, and no page names a
  registered or non-registered parameter for data entry to set, so 6 is carried as this instrument's
  own control. The panel's AMOUNT "is used to adjust the maximum amount of modulation controlled by
  the Modulation Wheel" (manual p. 18), so 6 sets how far 1 can take the modulation, and with the
  wheel at rest it does nothing audible.

  THE FOUR KNOBS CAN BE GIVEN OTHER NUMBERS. "The Pot Mapping menu allows you to make arbitrary MIDI
  Continuous Controller (CC) assignments to each of the four Analog Edit knobs on the front panel"
  (manual p. 38), to any of `OFF, 0-127`, acting on the instrument, on MIDI or on both
  (manual p. 39), and "The MIDI CC assignments shown for each section are over-ridden when Pot
  Mapping is enabled in that section." (manual p. 54). The table is the map with Pot Mapping off.

  WHAT LATER SYSTEMS ADDED, AND WHY NONE OF IT IS BELOW. Moog's firmware package is 3.21, and its
  update instructions list what changed in 3.2 and 3.21. 3.2 added an arpeggiator setting, sync
  lock, that "Can also set by CC87 (0-63=off, 64-127=on)." (firmware_notes); it fixed a "MIDI CC
  filtering bug" (firmware_notes), the filter being one the manual never mentions; and 3.21 removed
  an option the Slim Phatty never needed. Before them, on Moog's forum, Amos Gaynes - whom the
  manual's foreword names in the team that made the instrument (manual p. 5) - announced a
  pre-release beta of 3.1. It added per-preset settings for legato glide, an LFO reset and volume
  velocity sensitivity; four choices of what MIDI output carries, the default sending every
  controller; and "Arpeggiator if internal clock can now send MIDI Start, MIDI Clock, and MIDI Stop
  messages when running." (forum_post). No page of the manual carries any of these, so this file
  describes the system the manual describes and leaves controller 87 out, as the format records one
  firmware. A consumer driving a unit on 3.21 can send 87 to set sync lock, and may find Start,
  Clock and Stop sent when the arpeggiator runs on its internal clock.

  THE CONTROLLER NUMBERS ARE SHARED WITH THE LITTLE PHATTY. "MIDI Continuous Control numbers (MIDI
  CC's) are consistent between the Little Phatty and Slim Phatty" (manual p. 34), and the manual's
  own pages call the instrument a Little Phatty in places (manual pp. 20, 44 and 59).

  LOCAL CONTROL IS A SETTING HERE, NOT A MESSAGE. The MIDI Setup menu turns the panel's control of
  the sound on and off, "Values: ON, OFF; the default is ON" (manual p. 32), and "It does not
  disable any MIDI transmitting or receiving." (manual p. 32). The chart crosses Local Off both ways
  (manual p. 67), so no MIDI message reaches the setting. All Notes Off is circled both ways, and
  the same menu sends it: "This command is the equivalent of a MIDI panic button to silence stuck
  notes." (manual p. 32).

  NOT RECORDED: the note range. The chart's Note Number row gives 0 to 127 received with no True
  Voice row beneath it (manual p. 67), and no page says directly which notes sound; the nearest is
  the note calibration's default range, MIDI notes 12 to 116 (manual p. 47). The panel's octave
  switches also transpose incoming notes by up to two octaves each way (manual p. 22). NOT RECORDED
  EITHER: the pitch bend depth, which is set for each preset.

