midi:
  # NOT RECORDED, the channel range: see the account. Received: `F8` Timing Clock, `FA` Start, `FB`
  # Continue and `FC` Stop (guide p. 62), the clock followed when its source is MIDI or USB
  # (guide p. 38). Nothing published says either is sent.
  clock: receives
  transport: receives
  program_change:
    # No `Cn` row among the table's channel messages (guide p. 62), which read as a complete list:
    # see the account.
    receives: false
  # `control_change` is left unset because a map is published: the one controller below.
  # NOT RECORDED, system exclusive. The guide never uses the word, and its table is not a list of
  # everything the instrument takes: the Synthtribe application sets the instrument up and updates
  # its firmware (guide p. 60), and no page says over which connection or in what form. What it
  # sends is undocumented, not absent, as for the TD-3.

voice:
  addressing: pitches
  # "Number of voices Monophonic" (guide p. 66).
  polyphony: 1
  # No `An` or `Dn` row among the table's channel messages (guide p. 62), which read as a complete
  # list: see the account.
  aftertouch: none

controls:
  # `Bn 4A xx` Filter Cutoff (guide p. 62): controller 74, its range not printed. Received, as
  # everything in the table is recorded; nothing says it is sent.
  filter_cutoff: {label: Filter Cutoff, cc: 74, direction: receives}
