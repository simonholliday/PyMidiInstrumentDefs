# TWO MAPS, AND THE SAME CONTROLLER NUMBER MEANS DIFFERENT THINGS IN EACH. Appendix C of this
# manual has two controller sections: C.7, what an audio track answers to, and C.8, what a MIDI
# track answers to "While in MIDI mode and CC DIRECT CONNECT is deactivated" (manual p. 141).
# Controller 22 is `Amp param #1 (Attack)` in the first and `Amp param #1 (Transpose)` in the
# second; controller 34 is `FX1 param #1` against `Pitch bend`. **51 of the 64 numbers in the
# audio map are in the MIDI map too, with different meanings**, which is why every control below
# names its part and why a reader who ignored the sections would get half of them wrong.
# **99 of the appendix's 115 rows are below**; the other sixteen are on controller numbers this
# format refuses, and the source account says which and why.
#
# **THIS ONE FILE COVERS THE MKI AND THE MKII, AND THAT WAS ESTABLISHED RATHER THAN ASSUMED.**
# Elektron publishes a manual per product - the MKI's at OS 1.40A of February 2022 and the MKII's
# at OS 1.40C of August 2026 - and the two appendices were read by the same code and compared on
# four questions: the controller numbers, the parameter names, the direction marks and the
# hexadecimal cells. **All 115 rows agree on all four.** Both support pages also serve the same
# firmware image, so an OS version does not tell the two apart either.
#
# WHAT THE TWO PRODUCTS DO DIFFER IN IS NOT MIDI. The MKII (2017) has an OLED screen and balanced
# inputs where the MKI (2010) does not; the MKI is on Elektron's legacy page and the MKII is
# current. **Nothing in this file turns on either**, and the numbers below are from the newer
# manual because it is the newer document and describes the OS both pages serve.
#
# THE MAKER'S WORD `PART` IS NOT THIS FORMAT'S. An Octatrack bank holds "16 patterns and 4 parts"
# (manual p. 17), where a part is a saved set of machine and sample assignments - closer to this
# format's `presets` than to its `parts`. **The two `parts` below are the audio tracks and the
# MIDI tracks**, which is what the format means: things with channels of their own.
#
# AND EVERY ROW OF THE MIDI MAP IS RECEIVE-ONLY, by its own introduction: C.8 says the auto
# channel "responds to the following CC messages" (manual p. 141), and all 51 of its rows carry a
# mark in REC and none in TRN. The audio map has 57 rows marked both ways and 7 received only.
# **No row in either map is marked transmitted only.**

definition: 1

model:
  manufacturer: Elektron
  name: Octatrack
  # BOTH SUPPORT PAGES SERVE THE SAME IMAGE, `OCTATRACK_OS1.40C_readme.pdf`, which is how one
  # firmware number can stand for two products - the PolyBrute pair in this corpus is the other
  # instrument where that is true. The MKII's manual is the edition written for this OS; the
  # MKI's is for 1.40A, two revisions behind, and its appendix is identical anyway.
  firmware: "1.40C"

source: >-
  Octatrack MKII User Manual for OS 1.40C, 148 pages: **APPENDIX C: MIDI CONTROL REFERENCE at
  pp. 137-142**, whose two controller tables are every control below; the MIDI settings at
  pp. 40-41, where the clock, transport, program change and channel architecture are; the MIDI
  sequencer at p. 90; the CTRL pages at p. 94; the OS upgrade at p. 112; the banks and patterns at
  p. 17; and the hardware at p. 116. And the MKI's manual for OS 1.40A, for the comparison that
  establishes one file covers both. And both support pages, for what Elektron publishes.

  THE PRINTED FOLIO EQUALS THE SHEET THROUGHOUT, so no `page_offset`. That was checked on every
  one of the 148 sheets rather than on a sample: sheets 4 to 147 each print their own number, and
  only the cover, two sheets of front matter and the back cover carry none.

  **THE TWO MANUALS' APPENDICES AGREE ON ALL 115 ROWS, WHICH IS WHY THIS FILE COVERS TWO
  PRODUCTS.** They were read by the same extraction code - a comparison of two readings made by
  two different scripts would be measuring the scripts - and compared on four questions asked
  separately: the set of controller numbers, the parameter name on each, the two direction marks,
  and the hexadecimal cell. **Nothing differs.** That is 115 rows of appendix, of which 99 become
  controls below - the comparison is of the documents and not of this file.

  AND THE OLDER MANUAL MISNUMBERS ITS OWN SECTION, which is the one real difference between the
  two documents and is worth knowing before searching either. The MKII calls the second controller
  table **C.8**; the MKI calls it **C.3** - and C.3 is already that manual's SLOTS NOTE MAPPING,
  so the older edition has two sections numbered C.3 and the newer one corrected it. A reader
  searching the MKI's manual for C.8 finds nothing.

  THE MKII'S SUPPORT PAGE PRINTS A DATE THAT CONTRADICTS THE FILE IT SERVES. The page says its
  English manual is of "Apr 14, 2021" (mkii_page); the file is named `..._OS1.40C_260827.pdf`, sits under
  `/uploads/2026/08/`, and its own PDF metadata says it was made on 27 August 2026. **Three
  independent signals against one**, so the page's date is stale rather than the file being
  mislabelled - and **a date taken off a maker's page without checking the file would have put
  this manual five years before the firmware it describes.**

  THE APPENDIX IS A RULED GRID AND ITS ROWS COME OFF THE RULES, with one trap worth passing on:
  **the sheet the controller table opens on also carries two note-mapping tables with a different
  number of columns**, so taking every rule on that sheet gave six columns for a four-column
  table. The grid is therefore built from the rules inside a height window rather than from the
  whole sheet. **A sheet may hold more than one table.**

  THE FIRST COLUMN HOLDS TWO NUMBERS IN ONE CELL - a hexadecimal with a dollar sign and a decimal,
  inside the same ruled box, which is why the heading is the two words `HEX DEC`. **So the
  hexadecimal is asserted against the decimal**, all 115 rows of it, which costs one line and
  which caught a real fault in another maker's table at the rank before this one. Here the two
  agree everywhere.

  AND THE MARKS ARE PLACED BY THE GRID AND NEVER BY READING ORDER, because an `X` in the text
  layer says nothing at all - **only its column does**. The second reader reports that a naive
  search for `X` also picks up the one inside `FX1 param` and `FX2 param` and would have invented
  transmitted marks on twelve rows.

  EVERY NUMBER WAS READ TWICE AND THE TWO READINGS AGREE ON ALL 115 ROWS - on the parameter name,
  the hexadecimal cell, **both direction marks**, the map, and the printed page. The second
  reading used a different library's layout mode on a different interpreter and then checked
  itself against all four sheets rendered at 200 dpi and read by eye.

  **THE SECOND READER REPORTS ONE PLACE WHERE THE RENDERING WAS NOT A CONFIRMATION BUT THE
  ANSWER.** The last sheet of the MIDI map carries no column heading and not one row marked in
  both columns, so there is a single mark position on it and nothing on the sheet itself to say
  which of the two columns that is. They settled it two ways - by the offset measured against the
  previous sheet, and by reading the rendered page, where the left cell is visibly empty on all 28
  rows. **A method that cannot answer from one page needs the page before it or the picture**, and
  saying which was used is part of the reading.

  APPENDIX C'S OWN NAMES FOR THE MIDI MAP'S PAGES ARE THE AUDIO MAP'S NAMES, which is the sharpest
  trap here and the reason the groups below are keyed on the map as well as the name. In C.8,
  `Amp param #1` to `#6` are glossed Transpose, Legato, Mode, Speed, Octave Range and Arp Note
  Length - **which are precisely the six parameters sections 15.4.3 and 15.4.4 put on the
  ARPEGGIATOR pages**, not on an amplifier. Likewise C.8's `Playback param` rows are glossed Note,
  Velocity, Length and three more notes, which is the NOTE page. **A reader grouping on the prefix
  alone would file the arpeggiator under the amplifier.** The bracketed gloss is the evidence.

  TEN OF THE MIDI MAP'S CONTROLLERS SET VALUES WHOSE DESTINATION THE OWNER CHOOSES. Controllers 36
  to 45 are `CC #1 param` to `CC #10 param`, and what they reach is a setting: "CC1-CC4 specifies
  the CC commands that will be controlled on the CTRL 1 MAIN page" (manual p. 94), with a MIDI CC
  learn mode for choosing them. So **the ten numbers are fixed and published and the ten
  destinations are not**, which is a milder form of the owner-editable map the PERKONS HD-01
  raised. Nothing below claims a destination.

  ONE PARAMETER NAME IS AT TWO NUMBERS IN THE AUDIO MAP, with different directions: `Track level`
  is controller 7, marked received only, and controller 46, marked both ways. Controller 7 is the
  MIDI specification's own Channel Volume, so this is the maker giving one parameter a standard
  address that only listens and an address of its own that also reports. **Both are below, told
  apart by number**, because nothing else distinguishes them.

  **SIXTEEN OF THE 115 ROWS CANNOT BE CONTROLS, AND THE MAKER IS THE REASON.** This instrument
  puts its MIDI track solos on controllers **120 to 127** - eight rows in each map, `MIDI Trk 1
  Solo` to `MIDI Trk 8 Solo` - and that block is the MIDI specification's channel mode messages.
  This format refuses them on the rule that a channel mode message means the same on every
  instrument that has it, **which is exactly what this instrument makes untrue**: a sequencer
  sending All Sound Off to it solos a MIDI track.

  So they are published, named and numbered here and absent from the controls below, which leaves
  **99 of the appendix's 115 rows**. That is a real loss and it is recorded rather than worked
  around - the Hydrasynth Explorer met the same thing on four numbers and is handled the same way.
  **Unlike that instrument, this one also puts eight parameters on 112 to 119**, which the
  specification leaves undefined, so the maker has treated the whole of 112 to 127 as free space
  and only half of it is.

  THREE SOCKETS, FROM THE SPECIFICATIONS: "MIDI In/Out/Thru" (manual p. 116), beside a hi-speed
  USB 2.0 port. That is this maker's habit and its own support pages say so of the whole range -
  every Elektron except the Model series has all three - which is worth stating because the next
  rank's instrument has only two.

  WHAT IS ABSENT, CHECKED RATHER THAN ASSUMED. **The words NRPN and RPN appear nowhere in these
  148 pages**, and neither does `system exclusive`, and neither does `voices`. The first of those
  is suggestive and is not recorded: see `midi` below.

  EVERY QUOTATION IN THIS FILE'S PROSE CARRIES A LOCATOR, AUDITED BY PAIRING THE QUOTE MARKS:
  **28 quotations, 28 locators** - 27 citing a page and one naming the unpaginated support page -
  with the seventeen remaining pairs being field values rather than anybody's words.

  **AND THE AUDIT HAS TO STOP AT THE CONTROLS BLOCK ON THIS INSTRUMENT, WHICH IS NEW.** 99 of
  this file's controls carry a label in quote marks - `"Track Mute [0]=Unmuted, [1-127]=Muted"` -
  not because they are quotations but because a YAML flow mapping cannot hold a comma or a bracket
  bare. **A pairing audit run over the whole file reports 113 unlocated quotations and 99 of them
  are not quotations at all.** So the audit is of the prose, and a sweep written for the corpus
  would need to know that.

  THE GAP FROM 61 TO 112 IS REAL AND IS THE MAKER'S. The audio map runs 7, 8, 16 to 61, then 112
  to 127, with nothing between - and the second reader checked the rendered pages for exactly that,
  finding the table closes with a bottom border after 61 and reopens at 112. **Nothing was
  dropped.** The manual defines nothing in that span and says why nowhere.

  FOUR SMALL FAULTS, KEPT AS PRINTED. Controllers 59 and 60 read `Note on  [0]=C-1, 127=G9)` and
  `Note off [0] =C-1, 127=G9)` - an unmatched closing bracket in each, and a stray space that
  falls after `on` in one and before the `=` in the other, so **two sibling rows are mis-set in two
  different ways**. Controller 51 doubles a space where its neighbours do not. And controller 27 is
  `Amp param #6 (N/A)`, a parameter given a slot, a number and a note that it does not apply.

  AND THE TWO MAPS MARK CONTROLLERS 112 TO 127 DIFFERENTLY FOR WHAT READS AS THE SAME ROW. The
  sixteen MIDI track mutes and solos are character-for-character identical in both tables, and the
  audio map marks them transmitted and received while the MIDI map marks them received only.
  **That is not the document contradicting itself**, which is what it looks like: C.8's own
  introduction says the auto channel "responds to the following CC messages" (manual p. 141), so
  **the whole of C.8 is a receive-only table by construction** and all 51 of its rows are marked
  that way. The two tables describe two routes to one parameter, and only one of them reports back.

