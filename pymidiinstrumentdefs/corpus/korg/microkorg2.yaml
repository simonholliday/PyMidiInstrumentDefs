midi:
  # "Sets the global MIDI channel" (p. 84), and the chart gives 1-16 for the basic channel in
  # both directions, transmitted and recognised, with Change 1-16 and "Memorized".
  channels: [1, 16]
  # The chart's Mode row: Default is X transmitted and 3 recognised, and its own legend reads
  # "Mode 3: Omni Off, Poly".
  mode: 3
  # "Sets the clock to which the arpeggiator is synchronized" (p. 84), choosing between Auto,
  # Internal, External USB and External MIDI. The chart gives Clock as O in both columns.
  clock: both
  # A CHECKED ABSENCE. The chart's System Real Time row for Commands is X in both columns, so
  # start, stop and continue are neither sent nor answered - this instrument's arpeggiator and
  # loop recorder follow the clock alone.
  transport: none
  program_change:
    # The chart: Program Change O 0-63 transmitted and O 0-63 recognised, True Number 0-63.
    receives: true
    sends: true
    # "256 (4 banks x 8 genres x 8 programs)" (p. 131). A program change reaches 64 of them and
    # bank select picks the bank: the chart gives CC#0 and CC#32 as 00,00 for CLASSIC, 00,01 for
    # MODERN, 00,02 for FUTURE and 00,03 for USER, which the implementation prints the same way
    # under its own section 1-1.
    presets: 256
  # The NRPNs reach what the control changes cannot: the arpeggiator, the virtual patches, the
  # vocoder's sixteen bands, the hard tune, the harmonizer and the loop recorder. Not preferred,
  # because the maker nowhere says so - only used for a different half of the instrument.
  nrpn: supported
  # The chart gives System Exclusive as O in both columns, and the implementation has a function
  # code list of its own, a device inquiry reply and a Korg search-device exchange. It is gated:
  # "Sets whether MIDI system exclusive messages are transmitted and received" (p. 87). A warning
  # worth passing on: "You may not be able to exchange the MIDI system exclusive messages of the
  # microKORG2 with certain MIDI interface devices" (p. 25).
  sysex: true

voice:
  addressing: pitches
  # The chart's Note Number row: 0-127 transmitted, 0-127 recognised, True Voice 0-127, from a
  # keyboard of 37 keys with octave shift and transpose on top of it.
  note_range: [0, 127]
  # "The maximum polyphony is eight voices (eight notes). In Dual mode, the maximum polyphony is
  # four voices (since timbres 1 and 2 are played together)" (p. 51).
  polyphony: 8
  polyphony_shared: true
  velocity:
    # The chart: Note On is O 9n, V=1-127 in both columns. A global curve shapes what the
    # keyboard produces, "Curve 1...8, Const Max" (p. 81).
    note_on: received
    # IT NEITHER SENDS NOR READS A RELEASE VELOCITY. The chart's Note Off row is "X 8n, V=64"
    # transmitted and X recognised, so what it sends is a fixed 64 and what it receives is
    # discarded.
    note_off: false
  # "This instrument features a 37-note keyboard (mini keyboard, velocity sensitive, no
  # aftertouch)" (p. 14), and the chart's two After Touch rows are X in all four columns.
  aftertouch: none
  pitch_bend:
    # "Pitch Bend Range (PB Range) [-24...0...24]" (p. 53) and "Specifies the amount of pitch change in
    # semitones that occurs when you use the pitch bend" (p. 53), set per program on the timbre's
    # own PITCH page. SYSTEM 2.0 SPLIT IT IN TWO - "Pitch bend up and down range can now be set
    # independently" (supplement p. 2) - which this field cannot say; 24 is
    # the furthest either half reaches.
    semitones: 24
    programmable: true

parts:
  # Two timbres, each on a channel the player sets. Neither is a part a control change is
  # addressed to - the same numbers reach whichever timbre's channel they arrive on - so no
  # control below names one. The voices are shared, which is why neither carries a polyphony:
  # eight between them in Single mode and four each in Dual.
  timbre_1:
    label: Timbre 1
    # It has no channel of its own: it is the global channel. "This MIDI channel is used to
    # transmit and receive note messages, bend messages and control change messages for
    # Timbre 1" (p. 84).
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
  timbre_2:
    label: Timbre 2
    # "Sets the MIDI channel that Timbre 2 will send and receive MIDI messages on. Timbre 2 will
    # sound when a note message is received via this MIDI channel" (p. 84). Set on its own, not
    # derived - and the troubleshooting page confirms the two must differ to be told apart:
    # "Are the MIDI 'Global Ch' and 'Timb2 Ch' set to different channels?" (p. 122).
    channel: assigned
    addressing: pitches
    # NOT program change: a program change selects a program, which contains both timbres, so
    # there is nothing a second channel could select on its own.
    receives: [notes, controls]

groups:
  # The maker's own arrangement twice over: the chart prints one row per group of controller
  # numbers and the manual gives each group its own page, and the two agree. The NRPNs are
  # grouped by their own MSB, which is how the implementation prints them - one per section.
  performance: Performance
  portamento: PITCH
  timbre: TIMBRE
  unison: VOICE
  osc1: OSC 1
  osc2: OSC 2
  osc3: OSC 3
  noise: NOISE
  filter: FILTER
  amp_eg: Amp EG
  filter_eg: Filter EG
  lfo1: LFO 1
  lfo2: LFO 2
  patch: Virtual patch
  mod_effect: MOD
  delay: DELAY
  reverb: REVERB
  eq: EQ
  arpeggiator: Arpeggiator
  vocoder: Vocoder
  hard_tune: Hard Tune
  harmonizer: Harmonizer
  loop_recorder: Loop recorder

controls:

  # ── Control changes, the implementation's note *3 plus the two it keeps elsewhere ──
  # In number order, which is not the order the document prints them in: the modulation wheel
  # and the damper pedal are in the channel-message tables rather than the panel table, and the
  # chart lists them among the control changes. Generated by `Notes/4463_write_controls.py` from
  # the extraction, not typed. A comment carries the maker's own value notation wherever this
  # format has no field for it - a bipolar parameter sent as two data-entry bytes that wrap
  # through zero, or a value list the implementation prints in a table of its own.
  modulation:                  {label: Modulation, cc: 1, group: performance}  # the MOD Wheel, sections 1-1 and 2-1; the chart calls it Modulation wheel
  portamento_time:             {label: Portamento Time, cc: 5, group: portamento}
  timbre_level:                {label: Timbre Level, cc: 7, group: timbre}
  osc1_wave:                   {label: OSC1 Wave, cc: 8, values: {"saw": 0, "square": 22, "triangle": 43, "sine": 64, "dwgs": 86, "one_shot": 107}, group: osc1}
  osc1_shape_sample:           {label: OSC1 Shape/Sample, cc: 9, group: osc1}  # *3-3: 00~7F
  timbre_pan:                  {label: Timbre Pan, cc: 10, group: timbre}  # 00,01~40~7F:L63,L63~Center~R63
  mod_control1:                {label: Mod Control1, cc: 12, group: mod_effect}
  delay_control2:              {label: Delay Control2, cc: 13, group: delay}
  reverb_control2:             {label: Reverb Control2, cc: 14, group: reverb}
  osc1_mod_amount:             {label: OSC1 Mod Amount, cc: 15, group: osc1}  # 00~7F:Off,1~127
  osc1_semitones:              {label: OSC1 Semitones, cc: 16, group: osc1}  # *3-4: 00~7F:-24~24
  osc1_fine_tune:              {label: OSC1 FineTune, cc: 17, group: osc1}  # *3-5: 00~7F:-50~50[Cent]
  osc2_wave:                   {label: OSC2 Wave, cc: 18, values: {"saw": 0, "square": 22, "triangle": 43, "sine": 64, "dwgs": 86, "one_shot": 107}, group: osc2}
  osc2_shape_sample:           {label: OSC2 Shape/Sample, cc: 19, group: osc2}  # *3-3: 00~7F
  osc2_mod_amount:             {label: OSC2 Mod Amount, cc: 20, group: osc2}  # 00~7F:Off,1~127
  osc2_semitones:              {label: OSC2 Semitones, cc: 21, group: osc2}  # *3-4: 00~7F:-24~24
  osc2_fine_tune:              {label: OSC2 FineTune, cc: 22, group: osc2}  # *3-5: 00~7F:-50~50[Cent]
  osc1_level:                  {label: OSC1 Level, cc: 23, group: osc1}
  osc2_level:                  {label: OSC2 Level, cc: 24, group: osc2}
  osc3_level:                  {label: OSC3 Level, cc: 25, group: osc3}
  noise_level:                 {label: Noise Level, cc: 26, group: noise}
  filter_type:                 {label: Filter Type, cc: 27, group: filter}
  filter_keytrack:             {label: Filter Keytrack, cc: 28, group: filter}  # *T-6: 00,01~40~7F:-63,-63~0~63
  noise_type:                  {label: Noise Type, cc: 29, values: {"lpf": 0, "hpf": 32, "bpf": 64, "deci": 96}, group: noise}
  noise_color:                 {label: Noise Color, cc: 30, group: noise}
