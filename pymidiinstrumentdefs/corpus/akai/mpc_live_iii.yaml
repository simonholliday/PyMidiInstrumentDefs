midi:
  # A track takes "Any" channel or one of 1-16 for its input and one of 1-16 for its output
  # (p. 54), and every MIDI Control Mode control chooses one of `(1–16)` (p. 369).
  channels: [1, 16]
  # THE MAPS ARE THE OWNER'S, by MIDI Learn inward and MIDI Control Mode outward, and both are saved
  # with the project (pp. 358, 368). The two numbers the guide gives an effect, 1 and 11, are in the
  # account and not carried - a choice, explained there.
  control_change: learned
  # Clock both ways, and either direction may be switched off; MIDI Time Code is the other choice of
  # both settings, and Ableton Link one more of Receive's (p. 65).
  clock: both
  program_change:
    # "This determines what an incoming MIDI program change message will change: a Sequence or
    # Track" (p. 65).
    receives: true
    # "To select a MIDI program change value for the track to send" (p. 55).
    sends: true
    # NOT RECORDED: presets. See the source account.
  # NOT RECORDED: sysex and nrpn - neither word is anywhere in 545 pages or in either set of release
  # notes, which is silence rather than a checked absence.

voice:
  pitch_bend:
    # "Range Down / Range Up: Use these fields to determine the range of pitch bends in semitones."
    # (p. 66), with a Global Pitch Bend switch that overrides every track's own. THE RANGE THOSE
    # FIELDS TAKE IS NOT PUBLISHED, so `semitones` holds nothing.
    programmable: true
  # NOT RECORDED: polyphony, aftertouch, velocity, the note map and the addressing. See the source
  # account for each.
