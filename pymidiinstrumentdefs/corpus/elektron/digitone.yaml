# The Digitone is nine separately addressable things at once: four synth tracks, four
# MIDI tracks that drive external gear rather than sounding, and an effects and master
# section. Each is given a MIDI channel of its own by the player (14.5.3, pp. 73-74), so
# every control below names the part it belongs to - and it has to, because 33 of the 71
# controller numbers in this manual mean more than one thing depending on which channel
# they arrive on. CC 70 is the filter's Attack Time on a synth track, the chorus's
# High-pass on the effects channel, and the first of the eight values a MIDI track sends.
#
# NRPN is written as one number, the way the format holds it: the manual's NRPN MSB and
# LSB combine as MSB * 128 + LSB, so its 1/20 is 148 here. Elektron uses the MSB as a
# bank - 1 for a synth track's parameters, 2 for the effects and master, 3 for the trig
# parameters - which is why the NRPN addresses never collide where the CCs do.
#
# The appendix gives addresses and nothing else: no value, no band, no default, no unit.
# That absence is the manual's, not an omission here.

definition: 1

model:
  manufacturer: Elektron
  name: Digitone
  # The manual says so itself (p. 11): "This manual for Digitone OS version 1.43 was last
  # updated September 9, 2026." Elektron ships 1.43, and its release notes show no release
  # from 1.30B to 1.43 changing the implementation - MIDI appears there only in fixes, for
  # messages dropped at very low tempos, a missed first trig under external clock, and
  # corrupted SysEx dumps. Later releases do add parameters, which is why this is
  # transcribed from the 1.43 manual and not an earlier one.
  firmware: "1.43"

source: >-
  User manual for OS 1.43, 106 pages: APPENDIX B: MIDI IMPLEMENTATION at pp. 96-99, whose
  124 rows are every control below; the channel architecture at pp. 73-74, where each
  synth track, each MIDI track and the effects section is given its own channel; eight
  voice polyphony at pp. 15 and 37, stolen across the whole instrument rather than per
  track; notes 0-127 at p. 24, with Elektron's own naming putting C0 at note 0; program
  change selecting patterns 1-128 at p. 24, sent and received separately and each on its
  own channel (p. 72); velocity, pitch bend, the mod wheel on CC 1 and the breath
  controller on CC 2 at pp. 30-31, each assignable to up to four parameters; and SysEx
  for projects, patterns and sounds at pp. 74-75.

  Receiving notes and receiving control change can each be switched off entirely (p. 73).

  Every number was read twice, by two methods that agreed on all 124 rows.

  NOT RECORDED: values, bands, defaults and units
  for every control, which the appendix does not give; which kind of aftertouch is
  received, since p. 31 names the aftertouch command without saying channel or poly;
  what a MIDI track does with notes arriving on its own channel, which p. 74 does not
  settle; and which channels the tracks default to, of which only the AUTO channel's 10
  is stated.

sources:
  manual:
    kind: manual
    title: Digitone User Manual
    edition: OS version 1.43
    dated: 2026-09-09
    landing: "https://www.elektron.se/support-downloads/digitone"
    url: "https://www.elektron.se/wp-content/uploads/2026/09/Digitone-User-Manual_ENG_OS1.43_260909.pdf"
    sha256: 12683387b0fc77ada09fddc254437be64c8fc13bfa1cb57a3049f4aba3e75c23
    retrieved: 2026-09-13
    page_offset: 0
    # Elektron reissues this manual under the same title for each OS, so the hash is the
    # only thing that pins which edition was read. It covers the desktop Digitone alone:
    # the Digitone Keys and the Digitone II each have their own manual, and the Keys shares
    # this instrument's firmware but not its documentation.
  release_notes:
    kind: release_notes
    title: "Digitone / Digitone Keys OS release notes"
    edition: OS 1.43
    dated: 2026-09-09
    landing: "https://www.elektron.se/support-downloads/digitone"
    url: "https://www.elektron.se/release-notes/digitone-digitone-keys-os-release-notes"
    sha256: 9f30453cb4200be7e2fd2e8fb10fa67e6e07eb8822e36c9cb8233e5996b812cd
    retrieved: 2026-10-01
    paginated: false
    # Cited for which OS is current and for what each release changed. The sha256 is of the
    # page's visible text as saved; the page as served hashes to
    # 55e997a3148d24f98377a10b7c1b4d8f97ab94412290a6661329d22a9c8f7c87. Elektron adds a
    # change list with every release, so no later fetch will match either.

midi:
  # Nine channels: "TRACK 1-4 CHANNEL" for the synth tracks, "MIDI 1-4 CHANNEL" for the MIDI
  # tracks and "FX CHANNEL" for the effects (pp. 73-74), each selected or set to OFF, plus the
  # AUTO channel. Which channel each part is set to belongs to your project, not here. The AUTO
  # channel, 10 from the factory, addresses whichever track is active, which no field here
  # expresses.
  # SIXTEEN IS THE PROTOCOL'S NUMBER, NOT THIS MAKER'S STATEMENT. **No page of this manual
  # prints the range a channel setting takes**, and unlike its siblings it does not even give
  # the tracks a default channel. The `1-4` above are the track numbers, not channels.
  channels: [1, 16]
  clock: both
  transport: both
  sysex: true
  # Most of the controls below carry one, and which form the knobs send is the player's choice:
  # "PARAM OUTPUT selects what type of MIDI messages the DATA ENTRY knobs send ... NRPN sends
  # NRPN MIDI messages ... CC sends CC MIDI messages" (p. 73). RECEIVE CC/NRPN governs the other
  # direction and names both together.
  nrpn: supported
  program_change:
    receives: true
    sends: true
    presets: 128             # "Program change messages 0-127 will select pattern 1-128" (p. 24)

parts:
  # Each part is given a channel by the player, so none of them derives one: there is no
  # base channel on this instrument to derive from.
  synth:
    label: Synth Track
    count: 4
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
  midi:
    label: MIDI Track
    count: 4
    channel: assigned
    receives: [controls]
    # These do not sound: a MIDI track plays external gear. What it does with notes
    # arriving on its own channel is not stated, so nothing is claimed about notes here -
    # the eight CC values below are what the manual gives for it.
  fx:
    label: FX and Master
    channel: assigned
    receives: [controls]
    # Takes no notes: it is the chorus, delay, reverb, master overdrive and the external
    # input mixer.

voice:
  addressing: pitches
  note_range: [0, 127]
  # Eight voices for the whole instrument, not eight per track: "The Digitone has eight
  # voice polyphony" (p. 37), with voice stealing across tracks and LOCKED VOICES able to
  # reserve some for one track. How a player divides them is a pattern setting, so it is
  # not here.
  polyphony: 8
  polyphony_shared: true
  velocity:
    # Received, with VELOCITY TO VOL choosing OFF, LOG, LIN or EXP (p. 30), so how much it
    # reaches the volume is a setting and one of its positions is off.
    note_on: received
  pitch_bend:
    # PITCH BEND DEPTH "sets how much the pitch bend data from external MIDI devices
    # affects the Digitone" (p. 30), and PITCH BEND assigns up to four parameters to it.
    # The manual gives no range in semitones.
    programmable: true

groups:
  # Elektron's own names, from the headings over the tables these numbers were read from:
  # APPENDIX B: MIDI IMPLEMENTATION, pp. 96-99, which prints a numbered section per group,
  # B.1 TRACK PARAMETERS to B.9 MISC PARAMETERS, and a heading over each table inside it. The
  # table heading is what a group is named here and what it is labelled: B.3 FM PARAMETERS
  # holds SYN1 and SYN2, and B.8 FX PARAMETERS holds CHORUS, DELAY, REVERB and MASTER. The
  # capitals are the appendix's styling throughout and are not reproduced, except where the
  # heading is an abbreviation the panel prints that way. The word PARAMETERS is dropped where
  # a heading carries it, so that B.2's TRIG PARAMETERS reads like its neighbours.
  # The order is this file's own, which collects each part's groups together; the appendix
  # runs in the same order but prints MISC last.
  # The first group is the one the appendix does not hold: both its controls are in the Sound
  # Setup menu instead, at 9.5.13 MOD WHEEL (p. 30) and 9.5.14 BREATH CONTROLLER (p. 31), and
  # Elektron gives the pair no name of its own.
  performance: Performance
  track: Track
  trig: Trig
  syn1: SYN1
  syn2: SYN2
  filter: Filter
  amp: Amp
  lfo: LFO
  misc: Misc
  cc_value: CC Value
  chorus: Chorus
  delay: Delay
  reverb: Reverb
  master: Master

controls:

  # Performance, from the Sound Setup menu rather than the appendix ─────────

  # "the MIDI mod wheel command (CC #1)", assignable to up to four parameters (p. 30). Not
  # in the appendix.
  mod_wheel:              {label: Mod Wheel, cc: 1, part: synth, group: performance}

  # "the MIDI breath controller command (CC #2)", the same way (p. 31). Not in the appendix.
  breath:                 {label: Breath Controller, cc: 2, part: synth, group: performance}

  # B.1 TRACK ───────────────────────────────────────────────────────────────
  track_mute:             {label: Mute, cc: 94, nrpn: 229, part: synth, group: track}
  track_level:            {label: Track level, cc: 95, nrpn: 228, part: synth, group: track}

  # B.2 TRIG PARAMETERS ─────────────────────────────────────────────────────
  trig_root:              {label: Root, cc: 3, nrpn: 384, part: synth, group: trig}
  trig_velocity:          {label: Velocity, cc: 4, nrpn: 385, part: synth, group: trig}
  trig_length:            {label: Length, cc: 5, nrpn: 386, part: synth, group: trig}

  # CC 13 is also AMP Delay Send, on the same channel. The appendix states no rule for
  # telling them apart.
  trig_filter_trig:       {label: Filter Trig, cc: 13, nrpn: 389, part: synth, group: trig}

  # CC 14 is also AMP Reverb Send, on the same channel.
  trig_lfo_trig:          {label: LFO Trig, cc: 14, nrpn: 390, part: synth, group: trig}
  trig_portamento_time:   {label: Portamento Time, cc: 15, nrpn: 391, part: synth, group: trig}

  # CC 16 is also SYN1 Ratio B, on the same channel.
  trig_portamento_on:     {label: Portamento On, cc: 16, nrpn: 392, part: synth, group: trig}

  # B.3 FM PARAMETERS, SYN1 ─────────────────────────────────────────────────
  syn1_algorithm:         {label: Algorithm, cc: 90, nrpn: 200, part: synth, group: syn1}
  syn1_ratio_c:           {label: Ratio C, cc: 91, nrpn: 201, part: synth, group: syn1}
  syn1_ratio_a:           {label: Ratio A, cc: 92, nrpn: 202, part: synth, group: syn1}

  # CC 16 is also TRIG Portamento On, on the same channel.
  syn1_ratio_b:           {label: Ratio B, cc: 16, lsb: 48, nrpn: 203, part: synth, group: syn1}
  syn1_harmonics:         {label: Harmonics, cc: 17, lsb: 49, nrpn: 204, part: synth, group: syn1}
  syn1_detune:            {label: Detune, cc: 18, lsb: 50, nrpn: 205, part: synth, group: syn1}
