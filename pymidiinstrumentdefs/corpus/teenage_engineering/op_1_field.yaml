    page_offset: 0

midi:
  # The incoming table gives "play synth/drum note" (guide) on channels 1 to 16, and pitch bend
  # and program change the same sixteen. The 48 unparted controllers below answer on any of them;
  # the four that are parted answer on the channels their part names.
  channels: [1, 16]
  # RECEIVES, AND THE PROSE ALMOST SAYS MORE - see the source account for the three sentences
  # that describe a clock being sent without saying it is a MIDI one, and for the sync output
  # that is an audio pulse rather than a message. The receiving side is plain: the incoming
  # table lists clock as a sync input and "external clock is detected and sync is received"
  # (pdf p. 53).
  clock: receives
  # ALL FOUR, EACH WITH A ROW OF ITS OWN in the incoming table: start and continue start and
  # continue tape playback, stop stops the tape, and song position is there to "set sequencer
  # position" (guide). A phrase in the settings page reads like a transmitting side as well and
  # is recorded in the source account rather than here.
  transport: receives
  program_change:
    # "load synth/drum slot" (guide), on channels 1 to 16.
    receives: true
    # SIXTEEN SLOTS THROUGH ONE RANGE OF NUMBERS, eight of each kind: "0–7 = synth slots 1–8"
    # (guide) and 8 to 15 the drum slots. So a program change reaches a different kind of sound
    # depending on which half of the range it falls in, which is why this is 16 and not 8.
    presets: 16

voice:
  # "play synth/drum note" (guide) on any of the sixteen channels. Which sound a note plays
  # depends on the mode and the slot, both of which are controls below.
  addressing: pitches
  velocity:
    # The note-on row's value column reads "velocity 1-127" (guide). **The range the maker gives
    # starts at 1**, not nought, which is the standard's own note-off convention stated as a
    # range rather than as a rule.
    note_on: received

parts:
  # TWO SCHEMES OVER THE SAME SIXTEEN CHANNELS, AND THEY OVERLAP. Three mixer controllers answer
  # per tape track, where "channel 1 - 4 = track 1 - 4" (guide); the slot selector answers per
  # sound slot, where "channel 1 - 8 = sound slot 1 - 8" (guide). So channel 2 is tape track 2
  # for a mixer controller and sound slot 2 for the slot selector **at the same time**, and a
  # consumer reading one part's channel cannot conclude anything about the other's.
  #
  # **THESE CHANNELS ARE FIXED AND THE FORMAT HAS NO WORD FOR THAT.** The tables state them as
  # 1 to 4 and 1 to 8 flatly and no document says a base channel moves them. `channel_offset` is
  # used because its stated meaning is that a channel cannot be set on its own, which is true;
  # what it also implies, that the channel is derived from a base channel, is not. That is the
  # SP-404MKII's gap met a second time, and the overlap is new.
  #
  # **NEITHER PART TAKES NOTES.** A note plays the active sound on any of the sixteen channels
  # and reaches no track and no slot of its own, so both parts receive controls and nothing else.
  track:
    label: Tape track
    channel_offset: 0
    count: 4
    receives: [controls]
  sound_slot:
    label: Sound slot
    channel_offset: 0
    count: 8
    receives: [controls]

groups:
