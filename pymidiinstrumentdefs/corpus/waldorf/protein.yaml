    retrieved: 2026-10-06
    # **CITED FOR A COMPARISON RATHER THAN FOR A FACT, AND IT IS THE REASSURING ONE.** Rank 95's
    # instrument had a translation that omitted its whole MIDI implementation, so this pair was
    # checked the same way: 72 sheets against the English 71, `Rev. 1, November 2025` against
    # `Rev. 2, January 2026`, and **every MIDI fact the English edition has** - CC 74 on its sheet
    # 54, the modulation sources on 57, MPE across five sheets, its own glossary at 63.
    # So this is a translation that leaves out no MIDI fact, which is what the other case needed
    # comparing with. **IT IS NEITHER REVISION'S TEXT.** Under `Rev. 1` it prints five later
    # additions in red, the pitch details screen and the fixed pitch among them (german_manual
    # pp. 25 to 27 and 30), where the English edition has the same five with their words in
    # black. And its black text gives the filter one slope, 12 dB, where the English gives two
    # (german_manual p. 27, manual p. 27). Until 2026-10-11 this called it one revision
    # behind. It arrives in the same `.zip` as the English manual.
