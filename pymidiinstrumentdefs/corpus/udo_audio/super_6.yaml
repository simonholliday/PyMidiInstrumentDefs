  dds_1_range:                          {label: DDS 1 Range, cc: 30, values: {"n64": 0, "n32": 21, "n16": 43, "n8": 64, "n4": 85, "n2": 107}}
  dds_2_waveform:                       {label: DDS 2 Waveform, cc: 31, values: {"sine": 0, "saw": 21, "square": 43, "triangle": 64, "noise": 85, "pulse": 107}}
  envelope_1_decay_hold:                {label: Envelope 1 Decay Hold, cc: 32, nrpn: 1056, nrpn_range: [0, 16383]}
  envelope_2_decay_hold:                {label: Envelope 2 Decay Hold, cc: 33, nrpn: 1057, nrpn_range: [0, 16383]}
