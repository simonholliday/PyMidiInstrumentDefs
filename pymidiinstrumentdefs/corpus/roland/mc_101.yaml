# THE MC-707'S SMALLER SIBLING, AND THE INSTRUMENT ITS CHART IS FOOTNOTED FOR. Four tracks where
# the MC-707 has eight, and **the same twenty-five controller numbers with the same names and the
# same directions**. The one place the two charts differ is a footnote: the MC-707 prints "SOUND
# Knob *1" (sibling_chart p. 1) against "*1 for MC-101 compatibility." (sibling_chart p. 1), and
# this chart prints
# "SOUND Knob" with no footnote at all (chart p. 1). The number is native here and borrowed there.
#
# ROLAND SERVES THIS CHART FROM ONE PATH WITH AN EDITION NUMBER IN THE FILE NAME, AND THERE IS NO
# eng02. Trying each in turn finds `eng01` and `eng03` and nothing else: `eng02` and `eng04` both
# answer 403. The MC-707's three editions are all present, so the gap is this product's. What that
# costs is recorded below.

definition: 1

model:
  manufacturer: Roland
  name: MC-101
  # THE NEWEST FIRMWARE ANY DOCUMENT HERE DESCRIBES, from the update notes' own leading section,
  # "Functions Added in Ver.1.80" (update p. 1). That file is cumulative and runs back through
  # Ver.1.71, 1.60, 1.50, 1.30, 1.20 and 1.02 in sections of its own. The reference manual states
  # no version at all in 89 pages, and the MIDI implementation chart states Version 1.60 - which
  # is the chart's statement about the instrument, two releases earlier.
  firmware: "1.80"

source: >-
  MC-101 MIDI Implementation Chart, Version 1.60, dated Sep. 25, 2020 - one page, and the whole of
  this instrument's published control map. Beside it: the MC-101 Reference Manual, 89 pages,
  edition eng01, which carries the channel and system settings; the MC-101 Update notes, 21 pages,
  edition eng09, which document every firmware release from Ver.1.02 to Ver.1.80 and **name three
  controller numbers the chart has never carried**; the Owner's Manual, 24 pages; and the chart's
  earlier edition, for what the current one gained.

  TWO EDITIONS OF THE CHART EXIST AND THE MIDDLE ONE DOES NOT. `eng01` is Version 1.00 of Sep. 1,
  2019 and `eng03` is Version 1.60 of Sep. 25, 2020; `eng02` and `eng04` answer 403. Read against
  each other (`Notes/4360_extract_mc_101_charts.py`), **the same twenty-five controller numbers
  stand unchanged through both**, with the same marks and the same names, and what moved is
  program change: at Version 1.00 it was x in both columns with a True Number of `**********`, and
  at Version 1.60 it is o in both with a True Number of `0-127` and the remark "Scene/Clip Change
  *1" (chart p. 1). Two footnotes appear with it, and the Note Number row gains a marker pointing at the
  second.

  **THE CHART SHOWS IN ONE STEP WHAT THE INSTRUMENT DID IN TWO**, and the missing edition is why.
  The update notes put scene switching at Ver.1.20 - the Control Channel parameter and its three
  switches are listed under "Functions Added in Ver.1.20" (update p. 20) - and a fix for "being
  unable to control scenes 9-128 by receiving" at Ver.1.60 (update p. 13). So there was something
  to print between Version 1.00 and Version 1.60, the sibling printed it, and this product's
  equivalent is either unpublished or withdrawn. **Where a maker numbers its editions, try the
  numbers**: two of the four names here are live and nothing on the page says so.

  THE CHART IS STILL TWO FIRMWARE RELEASES BEHIND THE INSTRUMENT. It is Version 1.60 of September
  2020; the update notes document functions added in Ver.1.71 and Ver.1.80, and **three controller
  numbers are named there and nowhere in the chart** - CC 2, CC 4 and CC 93, each as a per-track
  switch deciding whether an incoming message reaches the track or is recorded into a clip
  (update p. 5). They are below, on the update notes' authority, and marked.

  WHAT THE SECOND SEND REACHES IS NOT SETTLED, and this instrument has less to go on than its
  sibling. The chart gives 91 as "General Purpose Effect 1 (Reverb Send Level)" and 92 as "General
  Purpose Effect 3 (Chorus Send Level)" (chart p. 1). The reference manual's part parameters are **"Delay Send
  (Delay Send Level)" (reference p. 45)** and **"Reverb Send (Reverb Send Level)"
  (reference p. 45)** - no chorus
  anywhere in it - and it gives no controller number for either. The update notes give 93, as a
  switch named "Rx ChoDlySend" explained as "chorus send" (update p. 5). So the maker has a
  chorus send on 92 by the chart, a delay send with no number by the reference, and a
  chorus-or-delay send on 93 by the update notes. All three are below under the name of the
  document that defines each, and which of 92 and 93 reaches what is **not recorded**.

  THE FOUR KNOB NUMBERS ARE THE ONLY ONES THIS INSTRUMENT SENDS, and three of the four are a
  factory default rather than a fact. Ver.1.30 made them settable: "Tx FILTER CC Number CC0, CC1,
  CC2...CC119 Specifies the CC number transmitted by the [FILTER] knob" (update p. 17), and the
  same for MOD and FX. **The SOUND knob is not in that list** - its number is fixed where the
  other three move - which is the one asymmetry between the four. Only the transmitted number
  moves either way, so 80 to 83 remain what the instrument recognises.

  AND THE PANEL HAS NO KNOB OF THOSE NAMES. The MC-101 has four knobs, [C1] to [C4], one per
  track, and four buttons that say what they control: "[SOUND] button Assigns the [C1]-[C4] knobs
  to control the SOUND parameter of track 1-4" (reference p. 4), and the same for FILTER, MOD and
  FX. So each of CC 80 to 83 is a parameter slot on a track channel rather than a physical
  control, which is why all four are marked o in both columns where everything else is received
  only.

  THE CHART CONTRADICTS ITSELF ABOUT MODE MESSAGES, in both editions. Its Mode row marks
  "Messages" x in both columns (chart p. 1) - it answers to no mode message - and eight rows lower
  its Aux Message block marks Omni Mode Off, Omni Mode On, Mono Mode On and Poly Mode On **o
  recognised**, which are the mode messages. Both readings found this independently and neither
  can settle it. Nothing here rests on it: none of the four is a control.

  AND IT LEAVES OUT ROWS THE STANDARD CHART HAS. There is no Local ON/OFF row, no Active Sense and
  no System Reset anywhere in either edition - the Aux Message block stops after Poly Mode On and
  the System Real Time block after Stop. So this instrument's answer to those three is not
  published rather than negative.

  ONE THING ONLY A READER LOOKING AT THE PAGE COULD FIND. In the Version 1.00 edition the System
  Common label collides with the row beside it and the final n is cut off, so **the page shows
  what reads as System Commor** while the file beneath it holds "Common:" (chart_1_00 p. 1). The
  current edition prints the word whole. Nothing rests on it, and it is recorded because it is
  the one place the two readings' methods came apart: the printed form is deliberately not
  quoted here, because a quotation of it would be checked against the text layer and the text
  layer is exactly what does not show it.

  NOT RECORDED: a voice count, which no document here states; whether the four tracks share one
  pool, because unlike the MC-707 this instrument publishes no voice reserve setting to infer it
  from - all the update notes say is that "If VCF is selected, the simultaneous polyphony will be
  less than when TVF is selected" (update p. 2), which is about a filter's cost and not about how
  tracks divide anything; what any controller's value range is, which the chart never gives; and
  whether system exclusive is carried, for the reason below.

