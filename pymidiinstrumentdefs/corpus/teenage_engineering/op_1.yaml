midi:
  # THE PLAYER DECIDES WHICH CONTROLLER REACHES WHAT, four at a time, per sound: "another
  # type of LFO is the MIDI LFO, which lets you receive external MIDI control change (MIDI
  # CC) from other hardware, or from your computer's music software. in this LFO mode, the
  # MIDI CC becomes the LFO" (15.6), and "using the encoders in MIDI LFO, you may route up
  # to four incoming channels of MIDI CC, and target them to your preferred destinations"
  # (15.6). Sending is the player's too: in controller mode "use shift + the encoders to set
  # the behavior of the encoders and arrow keys" (13.4). So there is no factory map, by
  # design, and nothing to publish.
  control_change: learned
  # BOTH, AND WHICH IT DOES IS A SETTING with three states (section 10). Free mode: "no sync
  # is transmitted from OP-1 and any incoming external sync is ignored" (10.4). Beat match:
  # "in beat match OP-1 acts as the master clock source, sending MIDI sync over usb, that
  # can be used to synchronize external gear" (10.5). Sync mode: "sync mode means OP-1 is
  # listening to external MIDI clock, received over usb" (10.6). Which one yours is in
  # belongs to your project, not here.
  # ONE CONFUSION IN THE MAKER'S OWN PARAGRAPH, recorded rather than resolved: 10.6 also
  # says the mode locks the unit "to MIDI time code (MTC) sent from external sequencers or
  # workstations", while the sentences around it say MIDI clock twice, including a nudge
  # that adds or subtracts "1 MIDI clock per key press". Clock and MIDI Time Code are
  # different messages; the weight of the paragraph is on clock, and MTC is not recorded.
  clock: both
  # FROM THE RELEASE NOTES, WHICH THE GUIDE NEVER MENTIONS: "updated: OP-1 sysex identity
  # reply now reflects product family, model and firmware with actual version numbers.
  # previously these values were zero" (os_updates, #243). So it answers an identity
  # request, and on anything older than #243 it answers with zeros - which is why the
  # firmware above is part of this claim rather than beside it. No layout is published, and
  # the word sysex appears nowhere else in any document here.
  sysex: true
  # NOT RECORDED, deliberately, and each for its own reason:
  # CHANNELS. A default and no span: "the OP-1 listens to and transmits MIDI-notes on MIDI
  # channel 1 by default. this can be changed by using shift + blue encoder" (13.3), and in
  # controller mode "you may also switch MIDI channels by using shift + green encoder"
  # (13.4). Nothing states 1-16, so nothing is written rather than assuming the standard.
  # Those two sentences name different encoders for the same job, blue in 13.3 and green in
  # 13.4. They describe different modes, so it may be deliberate; the guide never says.
  # TRANSPORT. One sentence bears on it and will not settle it: "when tape is armed and OP-1
  # receives a play command, recording now starts" (os_updates, #243). Whether a play command
  # is an incoming MIDI start or the unit's own play key is not said, and the bullet above it
  # is about external tempo sync. Left open rather than read either way.
  # NRPN and PROGRAM CHANGE. Neither term appears in any document here, searched as the
  # source paragraph lists. That is silence, not a checked absence, so neither is written.

voice:
  addressing: pitches
  # NOT ESTABLISHED, and the question was asked. Section 5.4 names four play modes - "in play
  # mode, you can select if you want your sound to be polyphonic, monophonic, legato or
  # unison" - and no count for any of them, so there is nothing to put in voicing_modes
  # either. The only number of voices the release notes imply is that there are enough to
  # steal: "fixed: stolen notes would sometimes play at incorrect volume when using external
  # keyboard" (os_updates, #243).
  polyphony: null
