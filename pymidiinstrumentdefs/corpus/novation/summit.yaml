# SIXTY PARAMETERS ARE NAMED HERE WITH NO NUMBER AT ALL, AND THAT IS THIS DOCUMENT'S HEADLINE.
# The MIDI parameters list names all four parameters of all sixteen Modulation Matrix slots. It
# prints the four numbers of slot 1 - NRPN 1:0 to 1:3 - and then the Control Number column is
# empty for every row of slots 2 to 16: sixty rows with a name, a range and a default, and no
# way to address any of them. **The sibling Peak's manual numbers all sixteen slots**, 1:0 to
# 16:3, and the two instruments share an engine - so the numbers exist and are published, in the
# other instrument's document. They are not here, and they are not inferred: see the source
# account for the three editions that were searched before that was written down.
#
# THE MAKER'S DEFAULT COLUMN DOES NOT AGREE WITH ITSELF, AND 36 OF THE 189 CONTROLS BELOW CARRY
# NO DEFAULT BECAUSE OF IT. The list prints up to two numbers per row - `64 (0)` - and the second
# is the first as the display shows it, which the row's own Range column gives the arithmetic
# for: a range of `0-127 (-64 to +63)` says the display is the wire value less 64, so `64 (0)`
# checks out and `0 (60)` cannot. Nothing in either document explains either column. Three ways
# the rule found a row the guide does not settle:
#
#   28 rows where the two halves cannot both be right, by the row's own range;
#    3 where the body states a range shifted from the MIDI one and the default then lands
#      somewhere the document contradicts - a pan that would default to hard left where the
#      screen beside it reads `PanPosn +0` (addendum p. 4), an arpeggiator that would start on
#      two octaves where the body says one, and a reverb whose three presets the body numbers
#      1 to 3;
#    3 that print no default at all, the FM NRPNs the addendum gives in a bug-fix bullet;
#    1 that prints no wire value at all, the Arp/Clock Sync Rate's "16th.";
#    1 whose row carries no range for the arithmetic to use, `Effects Routing`.
#
# A default is recorded only where every statement the documents make about it agrees.
# `Notes/4599_write_controls.py` applies that rule and names each of the 36 refusals with the
# arithmetic that refused it. **THE REVERB IS THE ONE THE GUIDE DISPROVES TWICE**, and it is the
# same parameter of the same engine that the Peak's manual disproves twice: its three presets
# "are simply numbered 1, 2 and 3, and set the RevSize parameter (see page 37) to values of 0,
# 64 or 127 respectively" (guide p. 35), and `RevSize`'s own initial value is 64 - which is
# preset 2, where the Default Value column's 2 on a range of 0-2 would be preset 3.
#
# AND THE SECOND WITNESS THIS GUIDE HAS CANNOT BE JOINED TO ITS OWN TABLE. The Peak's manual
# prints an Init Patch table keyed by parameter name and 34 of its rows could be checked against
# it. This guide has no such table. What it has is 105 blocks of body text, each giving a
# `Displayed as` / `Initial value` / `Range of adjustment` triple, 88 of them with an initial
# value - and the display name is scoped to a menu screen while the MIDI list's name does not
# carry the menu, so `Velocity`, `Delay`, `HoldTime` and `Repeats` each name three or more
# parameters. Joining the 89 names that occur only once, by longest suffix, yields 16 matches of
# which at least two are plainly wrong: the envelope's `Delay` lands on `Reverb Pre Delay`. **A
# false join does not produce a wrong value, it produces a wrong refusal**, discarding a default
# the document states correctly - so none of the 16 was used, and the five joins in `PANEL` were
# each made by hand on the page they cite.
#
# THIS DEFINITION IS BUILT FROM TWO DOCUMENTS DESCRIBING TWO FIRMWARES, and it targets the
# later. The guide is "applicable to Summit synthesisers with v1.1 firmware" (guide p. 4) and the
# addendum is "For Firmware Updates 2.0 and 2.1" (addendum p. 1).
#
# **AND `1.1` IN THE FILE NAME IS THE GUIDE'S EDITION, NOT THE FIRMWARE, ALTHOUGH HERE THEY ARE
# THE SAME NUMBER.** That coincidence is the trap, and one other edition springs it: Novation
# offers this guide in twenty-four language versions, and the Italian is labelled version 1.2
# and dated fourteen months later while its own body sentence still gives the firmware as v1.1.
# So the two numbers move independently and the English reader cannot tell, because for it they
# agree. The French edition, labelled V2, omits the firmware sentence altogether. **No edition
# in any language describes firmware 2.x**, which is what the addendum is for.
#
# TWO PARTS, EACH WITH A CHANNEL OF ITS OWN, AND THE MAP DEPENDS ON THE MODE. This is "a
# bi-timbral, 16-voice, polyphonic instrument" (guide p. 22) whose two Parts are "two independent
# synthesisers" (guide p. 41), and the channel each answers to is a setting rather than a
# derivation, which is why both parts below say `assigned`. A Single Patch is addressed on the
# Global channel and the Parts are silent; a Multi Patch is addressed per Part and the Global
# channel transmits nothing. The guide tabulates the whole of it on p. 46.
#
# **THE ADDENDUM CHANGES THAT TABLE AND THE TABLE WAS NEVER RE-ISSUED.** The guide's p. 46 says
# that in a Multi Patch the Global channel is "Data not accepted" (guide p. 46) in Split mode and
# accepted in Dual mode only "if MULTIPART CONTROL is set to Both" (guide p. 46). Firmware 2.1
# replaced that: "Layer Mode - Both parts respond to MIDI received on the Global Channel"
# (addendum p. 15), Split mode routes Global-channel data to both engines by the split point, and
# Dual mode sends it to the selected Part. So the later document is recorded here and the earlier
# table is left standing in the guide for anyone who reads only that. This is a change the maker
# describes as a change, not two documents contradicting each other.
#
# THE GLOBAL CHANNEL'S DEFAULT IS STATED THREE TIMES AND ONE OF THEM DISAGREES, so no default is
# recorded for it. The Settings menu figure prints `Globl Chan 1`, the overview says "MIDI
# Channel 1 is set as the active channel for global synth data" (guide p. 15), and the paragraph
# beside the figure gives the initial value as 3 - which is Part B's. Two witnesses say 1, one
# says 3, and `channels` holds a span rather than a default, so nothing below turns on it.
#
# NO CONTROL HERE HAS `choices`, ALTHOUGH DOZENS OF THEM ARE SELECTORS. The guide names the
# states of its stepped parameters in prose and numbers none of them: the three sync-rate tables,
# the 60 wavetables, the modulation matrix's 23 sources and 37 destinations, and the chorus
# programs "named 2 Tap, 4 Tap and Ensemble" (guide p. 35) all carry no value against any row.
# **The one place the order of a published list could be checked against something, it agrees** -
# the LFO Range button "has three settings: Low, High and Sync" (guide p. 31) over a range of
# 0-2, and the default is 0, which is Low. That is worth recording because the Peak's manual
# lists the same three settings of the same engine in the other order and so disagrees with its
# own default: this sentence is the one that is right. One list agreeing is not a convention, so
# nothing here is numbered by its order.
#
# NOT RECORDED: the note range, because no page states one - the keyboard is 61 notes (guide
# p. 4) and nothing says which. Transport, which neither document mentions: not start, not stop,
# not continue, not song position. Whether MIDI clock is sent, since both documents describe only
# the receiving side. The MIDI mode, there being no implementation chart in either document. And
# the clock source itself, a five-way setting the MIDI parameters list gives no number for.

definition: 1

model:
  manufacturer: Novation
  name: Summit
  # The newest firmware any document here describes. The addendum is "For Firmware Updates 2.0
  # and 2.1" (addendum p. 1) and its MIDI parameters list adds eighteen of this instrument's
  # parameters and renames one, with three more in a bug-fix bullet - all of which are below.
  # Novation delivers firmware through Novation Components, which serves nothing a fetch can
  # read, so whether 2.1 is still the newest is not stated anywhere this reached. The instrument
  # reports its own version in the Settings menu and the guide's example screen shows
  # "Version 070.618" (guide p. 40) - six digits whose format the guide never explains, and
  # which cannot be the v1.1 its text claims. Checked 2026-10-05.
  firmware: "2.1"

source: >-
  Summit User Guide v1.1 English, 62 pages, created 2021-07-12 by its own metadata, and the
  "Summit and Peak User Guide Addendum Version 2.1" (addendum p. 1), 18 pages, created
  2022-07-27. Novation publishes no programmer's reference and no separate MIDI implementation
  for this instrument, unlike its Circuit, so these two documents are the whole of the published
  map - which the saved downloads page establishes as what was offered on the day.

  BOTH END IN A MIDI PARAMETERS LIST and the two together are this definition: 229 rows over the
  guide's pp. 47-49 and 19 more on the addendum's p. 18, plus three NRPNs the addendum publishes
  in a bug-fix bullet and in no table at all. 189 controls come out of 251 rows. Sixty of the
  rows carry no control number, one carries `NA:NA`, and one is a rename rather than an addition.

  THE TABLE IS A DRAWN GRID AND THAT IS HOW IT WAS READ. Novation's publisher gives every cell a
  rule above and below it, each rule a separate thin rectangle whose own x extent is one column's
  width, so the page itself states where its five columns begin and end. That is not a
  convenience here: cells wrap onto two and three lines, and every page prints two of these
  tables side by side. `Notes/4599_extract_summit.py` reads the grid.

  **TWO THINGS ABOUT THIS DOCUMENT THAT THE PEAK'S DID NOT NEED.** The blocks have to be ordered
  by x rather than by the height of their rules, because on p. 47 the right-hand table's first
  rule sits above the left-hand table's - so reading them in the order the rules appear takes the
  page's second column first and interleaves the table, with every row individually correct,
  which is the kind of wrong that does not announce itself. And counting five columns is not
  enough to find the table: pp. 50-55 carry the 768 factory Patch names in a five-column grid
  drawn the same way, so the header row is what tells them apart.

  THE SIXTY BLANK CELLS WERE CHECKED THREE WAYS BEFORE BEING CALLED BLANK. The grid finds the
  cells empty; a plain text extraction finds nothing between the kind and the range; and no
  number of the form `2:0` to `16:3` occurs anywhere in any edition of this guide that has a
  readable text layer - the English 1.1, the Italian 1.2 and the French V2, two languages over
  fourteen months - while all three print slot 1's four numbers. So this is the maker's omission
  and not one edition's typesetting. `Notes/4599_extract_summit.py` asserts it for all three.

  WHAT THE OTHER EDITIONS ARE FOR, AND WHAT THEY ARE NOT. Neither is read for a number or quoted
  for a word. The Italian settles that the version in the file name is the guide's edition rather
  than the firmware, because it is labelled 1.2 and still states v1.1; its text layer was
  regenerated by a different tool and its reading order is lost, so nothing could be extracted
  from it even had that been wanted, and its parameter names are translated. The French witnesses
  the sixty blank cells a second time. **Its first page is in German**, a colophon whose address
  and trademark notice are in that language, where its second page carries the same colophon in
  French, and its contents page is headed in English.

  THE DEFAULTS REST ON ONE WITNESS AND THE GUIDE HAS A SECOND ONE THAT CANNOT BE REACHED. See
  the comment above the definition: 105 body blocks give an `Initial value` keyed by a display
  name scoped to a menu screen, which the MIDI list's names do not carry. Five were joined by
  hand and three of those refused a default. The other 83 are a witness this reading could not
  use, and saying so is the point - a reader who wants those 36 refusals narrowed has somewhere
  to start, and it is not a method this file pretends to have applied.

  FOUR RANGE CELLS HOLD HALF A RANGE EACH, which is a typesetting fault rather than a
  contradiction, and the range is carried. Measured off the page: `Mixer Osc1` and `Mixer Patch
  Level` are 20-point rows carrying both halves of their range, while `Mixer Osc2`, `Mixer Osc3`,
  `Ring 1*2 Level` and `Noise Level` are 11-point rows carrying one half each, in pairs - the
  wire numbers in the first of each pair and the bracketed display half in the second. Nothing
  disagrees with anything; text has left its box. All six are mixer level controls and the two
  complete cells read `0-255 (0 to +255)`, so that is what the four are given.

  AND THREE ROWS SHOUT. `Oscillator 1/2/3 Shape Source` print their bracketed half as `0 TO +2`
  where all 226 other rows print `to` in lower case. A case-sensitive reader does not mis-read
  them, it fails to read them at all, computes no shift and refuses three defaults the guide
  states perfectly well - so the match is case-insensitive and the three rows are asserted still
  to shout, because a false refusal looks exactly like diligence.

  TWO ROWS HAVE NO RANGE AT ALL, `Effects Routing` (NRPN 0:89) and `Chorus Type` (NRPN 0:111).
  Their neighbours are complete, their own rows are single-height with nothing in the column, and
  no other page gives either a range. `Effects Routing` therefore keeps no default either: its
  column reads `0 (0)`, and with no range there is no arithmetic to check its two halves by,
  which is a different thing from two statements that disagree.

  THE ADDENDUM COVERS THIS INSTRUMENT AND THE PEAK AND MARKS WHAT BELONGS TO WHICH, under
  "Update Features Exclusive to Peak" (addendum p. 12) and "Update Features Exclusive to Summit"
  (addendum p. 14). Four numbers that the Peak's definition left out on that evidence are this
  instrument's and are here. `Atouch Scale`, NRPN 64:3, is aftertouch scaling - "You can adjust
  AtouchForce between 1-10" (addendum p. 14) - under the second heading, and the Peak has no
  keyboard to scale. The three FM NRPNs 25:13, 25:17 and 25:21 appear in no table in either
  document: they are in the p. 15 bug-fix bullet "FM controls now send and respond to their NRPN
  messages" (addendum p. 15), in a list that talks throughout about voices 9 to 16, which an
  eight-voice Peak does not have, and that names this instrument outright in another of its
  bullets. **The reverse also holds and needs no action**: the two features under the Peak's own
  heading, envelope Delay and a high-pass noise filter, were added to the Peak "to match Summit"
  (addendum p. 12), so this instrument already had both and its own list already numbers them.

  VELOCITY ARRIVES AND DOES NOTHING UNTIL A PATCH TURNS IT UP, which is why it is recorded as
  gated. The Amp Envelope's Velocity parameter has an initial value of 0 and "If set to zero, the
  volume is the same regardless of how the keys are played" (guide p. 30). The two Modulation
  Envelopes have the same parameter and the same initial value. So a velocity lane can appear
  dead on a correctly wired Summit, and the three controls that explain it are named in
  `gated_by`. The Peak has the same three parameters at the same defaults and records `received`;
  which of the two is right for that instrument is a question about that definition, not this one.

  NOT RECORDED, AND WHY. The note range: the keyboard is 61 notes (guide p. 4) and no page says
  which 61, nor what octave shifting reaches. Transport: neither document mentions start, stop,
  continue or song position. Whether MIDI clock is sent: the clock source setting chooses between
  the internal clock and one "provided by an external device able to transmit MIDI clock" (guide
  p. 34), and both documents describe only the receiving side, so `both` would claim the half
  that was not established. The MIDI mode, there being no implementation chart in either
  document. And the clock source itself, which the MIDI parameters list gives no number for.

  ONE FURTHER DOCUMENT COULD NOT BE READ. The downloads page offers "an online version of this
  user guide and translations" (download_page) at userguides.novationmusic.com, which answers a
  fetch with a Cloudflare challenge rather than the guide - twice, hours apart. Whether it is a
  later edition than the 1.1 PDF is therefore not established, and nothing here rests on it. The
  Peak's reading met the same refusal at the same domain a day earlier.

sources:
  guide:
    kind: manual
    title: Summit User Guide
    edition: v1.1, for firmware v1.1
    dated: 2021-07-12
    landing: "https://downloads.novationmusic.com/novation/synthesisers/summit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/downloads/Summit%20User%20Guide%201.1%20EN.pdf"
    sha256: 5d0a8eea37b92f1c9760a53235e1bd735e377c50a49c32194e6e705836668d91
    retrieved: 2026-10-05
    # 62 pages, counted with pypdf and with PyMuPDF, which agree. Every page prints its own
    # number and it is the file's own page index, so a citation needs no offset - asserted at
    # pages 1, 2, 3, 4, 5, 11, 21, 31, 45, 46, 47, 48, 49, 56 and 62, including the first and
    # the last. **The folio sits at x 30, y 817 and a controller value never does**, which is
    # how it is kept out of the table: pp. 47-49 print bare integers in their own right.
    # THE BOOKMARK FOR THE MIDI PARAMETERS LIST IS WRONG. The PDF's own outline gives the list
    # at 47 and `Sound designers` at 49, and the list runs to the end of p. 49 - sixty of its
    # rows are on the page the outline says is somebody else's. Found by reading the table's
    # grid to its last rule rather than by trusting the outline.
    page_offset: 0
  addendum:
    kind: manual
    title: Summit and Peak User Guide Addendum Version 2.1
    edition: V1, for firmware updates 2.0 and 2.1
    dated: 2022-07-27
    landing: "https://downloads.novationmusic.com/novation/synthesisers/summit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/summit_peak_2.1_firmware_update_addendum_v1_english_en.pdf"
    sha256: c57ee8ff062dc2cae21d149e57b69865e8c0b0a7c5be1def6102774515c4c5cd
    retrieved: 2026-10-03
    # 18 pages, counted twice and agreed. Covers this instrument and the Peak together and marks
    # which features belong to which, which is why it can be read for one of them. **Offered on
    # both instruments' downloads pages and saved under the Peak, because that is where it was
    # first read** - one file, one digest, two definitions citing it. See its provenance record.
    page_offset: 0
  translation:
