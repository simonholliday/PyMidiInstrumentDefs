midi:
  # Twice over, and the second is a specification rather than a panel note: "A MIDI channel from 1
  # to 16 is selectable using the dip switches." (guide p. 20) and "MIDI In / Out / Thru 2 x 5-pin
  # DIN / 16 channels" (guide p. 86).
  # **AND THE SWITCHES ARE NOT THE ONLY WAY TO SET IT** - see the account for the application that
  # also does, and for what this field cannot say about two mechanisms disagreeing.
  channels: [1, 16]
  # NOT RECORDED, the mode. There is no implementation chart in any of the four documents.
  # **RECEIVES, BY A SETTING WITH THREE VALUES, AND NOTHING SAYS IT SENDS ONE.** "CLOCK – Clock
  # can be set to MIDI, USB or INT / EXT." (guide p. 20), and the input is for it: "MIDI IN – This
  # MIDI DIN input can be used to play sounds via an external MIDI device and also allow MIDI
  # clock to be used." (guide p. 20). What arrives is read against a division setting - "SCALE –
  # This sets the timing of the sequencer against the incoming MIDI or USB CLOCK." (guide p. 20) -
  # and it is read as a tempo in a narrower range than the instrument's own: "TEMPO – Tempo can be
  # set from 10 to 10,000 when set to internal (INT). Via MIDI and USB the range is 10- 300 BPM."
  # (guide p. 20). **So a clock above 300 BPM is something this instrument will not follow**,
  # which no field here holds.
  clock: receives
  # NOT RECORDED, the transport: `Play / stop` is a patch-bay input and no MIDI transport message
  # is named. NOT RECORDED EITHER: program change, system exclusive and NRPN, none of which
  # appears in any spelling in any of the four documents.
  # NOT RECORDED, THE CONTROLLERS, AND NOT DECLARED ABSENT - see the comment above the definition.
  # The application that "allows you to select the MIDI channel number and to set and adjust
  # various parameters of the EDGE" (guide p. 23) is where they would be, and it is software this
  # corpus does not run.

