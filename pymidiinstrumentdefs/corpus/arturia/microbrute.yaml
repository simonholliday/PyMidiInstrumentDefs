    retrieved: 2026-10-06
    paginated: false
    # 846 bytes of plain text out of the same archive, cited by source key because it has no
    # page to turn to. "First Public Release" (release_note), and three known issues about
    # Windows 8.1 and the LFO retrigger. **Nothing about MIDI**, and it is the only release note
    # this instrument has: the 2017 firmware four versions later has none.
  downloads_page:
    kind: download_page
    title: MicroBrute Downloads & Manuals - Arturia
    landing: "https://www.arturia.com/support/downloads-manuals/product/microbrute"
