midi:
  # `1` by default both ways, remarked `Memorized`, and `1–16, OFF` either way (chart p. 1).
  channels: [1, 16]
  # Default `Mode 3` in both columns (chart p. 1), with Messages `x`: the four mode messages are
  # each received as an All Notes Off, and none changes the mode.
  mode: 3
  # Clock `o` in both columns (chart p. 1). Since 1.07 the source may be either port alone,
  # automatic with USB taking priority, or internal, which follows neither. No document says which
  # is the default.
  clock: both
  # Start, Continue and Stop all `o` in both columns (chart p. 1), and Song Position too.
  transport: both
  program_change:
    # Crossed in both columns (chart p. 1), with the True Number row starred out.
    receives: false
    sends: false
  # Crossed in both columns (chart p. 1): a checked absence.
  sysex: false
  # NOT RECORDED: nrpn. The chart has no row for it and neither manual mentions it.

voice:
  # Notes name instruments: the chart's True Voice row is starred out in its Transmitted cell and
  # empty in its Recognized one, and the note tables give each instrument its own numbers.
  addressing: voices
  # NOT RECORDED: note_range. Twenty-three numbers are answered to - 35 to 51, then 56, 62, 63, 64,
  # 70 and 75 - and a single range would claim the eighteen between them.
  # NOT RECORDED: polyphony, which no document states.
  velocity:
    # Note On `o` in both columns (chart p. 1). No page says what a received velocity does.
    note_on: both
    # And Note Off `o` in both (chart p. 1).
    note_off: true
  # Key's and Channel's both `x` in both columns (chart p. 1), as is pitch bend, so this
  # instrument has neither.
  aftertouch: none
  # **THE TRANSMITTED TABLE, `*1`** (chart p. 1): one number for each of the sixteen instruments,
  # in its own order and its own names, and every one of them is also in the recognised table.
  # Seven instruments answer to a second number as well - see the source account. The names are
  # the chart's, which spell some instruments otherwise than the groups do: `high_tom` and
  # `cow_bell` here, `HI TOM` and `COWBELL` there.
  voices:
    bass_drum: 36
    rim_shot: 37
    snare_drum: 38
    hand_clap: 39
    closed_hi_hat: 42
    low_tom: 43
    open_hi_hat: 46
    mid_tom: 47
    cymbal: 49
    high_tom: 50
    cow_bell: 56
    high_conga: 62
    mid_conga: 63
    low_conga: 64
    maracas: 70
    claves: 75

groups:
  # The select switch's own expansion of each code (manual p. 1), in its order. `accent` is the
  # switch's `AC`.
  accent: ACCENT
  bd: BASS DRUM
  sd: SNARE DRUM
  lt: LOW TOM
  mt: MID TOM
  ht: HI TOM
  rs: RIM SHOT
  cp: HAND CLAP
  cb: COWBELL
  cy: CYMBAL
  oh: OPEN HIHAT
  ch: CLS’D HIHAT

controls:

  # **THIRTY-EIGHT NUMBERS OFF ONE LIST, EVERY ONE BOTH WAYS**, grouped by the instrument its code
  # names. The list prints them in number order; they are in the select switch's order here.

  # ACCENT ────────────────────────────────────────────────────
  accent:    {label: ACCENT, cc: 71, group: accent}

  # BASS DRUM ─────────────────────────────────────────────────
  bd_tune:   {label: BD TUNE, cc: 20, group: bd}
  bd_tone:   {label: BD TONE, cc: 21, group: bd}
  bd_comp:   {label: BD COMP, cc: 22, group: bd}
  bd_decay:  {label: BD DECAY, cc: 23, group: bd}
  bd_level:  {label: BD LEVEL, cc: 24, group: bd}

  # SNARE DRUM ────────────────────────────────────────────────
  sd_tone:   {label: SD TONE, cc: 25, group: sd}
  sd_snappy: {label: SD SNAPPY, cc: 26, group: sd}
  sd_comp:   {label: SD COMP, cc: 27, group: sd}
  sd_decay:  {label: SD DECAY, cc: 28, group: sd}
  sd_level:  {label: SD LEVEL, cc: 29, group: sd}

  # LOW TOM ───────────────────────────────────────────────────
  lt_tune:   {label: LT TUNE, cc: 46, group: lt}
  lt_decay:  {label: LT DECAY, cc: 47, group: lt}
  lt_level:  {label: LT LEVEL, cc: 48, group: lt}

  # MID TOM ───────────────────────────────────────────────────
  mt_tune:   {label: MT TUNE, cc: 49, group: mt}
  mt_decay:  {label: MT DECAY, cc: 50, group: mt}
  mt_level:  {label: MT LEVEL, cc: 51, group: mt}

  # HI TOM ────────────────────────────────────────────────────
  ht_tune:   {label: HT TUNE, cc: 52, group: ht}
  ht_decay:  {label: HT DECAY, cc: 53, group: ht}
  ht_level:  {label: HT LEVEL, cc: 54, group: ht}

  # RIM SHOT ──────────────────────────────────────────────────
  rs_tune:   {label: RS TUNE, cc: 55, group: rs}
  rs_decay:  {label: RS DECAY, cc: 56, group: rs}
  rs_level:  {label: RS LEVEL, cc: 57, group: rs}

  # HAND CLAP ─────────────────────────────────────────────────
  cp_tune:   {label: CP TUNE, cc: 58, group: cp}
  cp_decay:  {label: CP DECAY, cc: 59, group: cp}
  cp_level:  {label: CP LEVEL, cc: 60, group: cp}

  # COWBELL ───────────────────────────────────────────────────
  cb_tune:   {label: CB TUNE, cc: 86, group: cb}
  cb_decay:  {label: CB DECAY, cc: 87, group: cb}
  cb_level:  {label: CB LEVEL, cc: 88, group: cb}

  # CYMBAL ────────────────────────────────────────────────────
  cy_tone:   {label: CY TONE, cc: 83, group: cy}
  cy_decay:  {label: CY DECAY, cc: 84, group: cy}
