# THIS MANUAL DESCRIBES THREE INSTRUMENTS AND THIS DEFINITION IS FOR ONE OF THEM. Its title is
# "opsix/opsix SE/opsix module Owner's Manual", and it says so itself: "This Owner's Manual
# applies to the opsix, opsix SE and opsix module" (p. 5). The three differ in ways a definition
# cannot average: the specifications give "opsix: 32 voices", "opsix SE: 80 voices" and "opsix
# module: 80 voices" (p. 105), and the keyboards differ too - "opsix: 37 keys (velocity and
# release-velocity sensitive)" against "opsix SE: 61 keys, Natural Touch keyboard (velocity and
# release-velocity sensitive, with aftertouch)". **Everything below is the opsix.** The SE and
# the module each need a definition of their own, and the documents are already in the library.
#
# THE MANUAL NAMES NO opsix mk II AT ALL, although Korg serves it from the mk II's download
# page. Whether the mk II differs from the opsix in anything MIDI reaches is therefore not
# established here, and is not assumed either way.
#
# THE WHOLE CONTROL MAP IS ONE PAGE, and that page does not extract as text. Printed page 116
# is the MIDI Implementation Chart, and its fonts carry no usable character map: every byte
# comes back 29 below the character it draws, so the title arrives as `0,',,PSOHPHQWDWLRQ&KDUW`
# and the number 71 as two control characters. It was read twice - once by decoding the offset
# and slicing by drawn position, once by rendering the page and reading it by eye.
#
# KORG'S "PROPERTY EXCHANGE MIDI IMPLEMENTATION" IS NOT A CONTROL MAP. The file of that name on
# this instrument's download page holds MIDI-CI Property Exchange - discovery, capabilities,
# resource lists - and not one controller number. The same maker's file of that name for the
# minilogue xd **is** a control-change map. That trap cost the wavestate a search and is
# recorded here so the next Korg does not pay for it again.

definition: 1

model:
  manufacturer: Korg
  name: opsix
  # THE CHART'S VERSION IS THE INSTRUMENT'S, which took two statements to establish and was
  # nearly recorded the other way. The chart's header reads "Version: 3.1.0", and a chart that
  # carries a version is often stating its own - the wavestate's does. What settles it here is
  # the manual's own body, which names the same number as a system version: "This unit supports
  # some MIDI 2.0 functions (Property Exchange), and can interact with compatible MIDI devices.
  # (Supported in system ver.3.1.0 and later.)" (p. 6).
  # A LATER SYSTEM MAY EXIST AND KORG DOES NOT SAY. Its download page offers no OS file and no
  # release notes; the system reaches the instrument through the Korg System Updater, a
  # separate tool with a manual of its own on that page. So this is the version the documents
  # describe, not necessarily the newest. Checked 2026-10-02.
  firmware: "3.1.0"

source: >-
  Owner's Manual, the edition Korg names E 6, 117 pages, published 10/2023: printed pages 105 and 78, the MIDI settings on p. 41, and the chart on p. 116 through a
  decoded rendering of it, for the reason given against that source.

  THE MIDI IMPLEMENTATION CHART IS THE WHOLE OF THE PUBLISHED MAP, and it is a chart rather
  than a table of parameters: it gives 23 control change entries, each with a number or a run
  of numbers, a mark for what the instrument transmits, a mark for what it recognises, and a
  remark naming what the number reaches - "Algorithm" in the Home/Algorithm page, "Resonance"
  parameter in the Filter page, OP1-6 Level sliders, and so on. There is no second table
  anywhere in the manual, searched for and absent.

  THREE OF THOSE 23 ENTRIES ARE NOT CONTROLS AND ARE NOT BELOW. Two give a span rather than a
  controller - 1 to 119 "Assignable for Virtual Patch sources", which the instrument recognises
  and does not send, and 1 to 119 "Transmittable from Motion Sequencer", which it sends and does
  not recognise. So any controller in that span may be made to do something, and which one is
  the player's business. The third is 120 and 121, the channel mode pair, which is a fact about
  MIDI rather than about this instrument.

  THE CHART'S TWO COLUMNS DISAGREE ON FIVE OF THE THIRTY CONTROLS, which is what `direction`
  exists for: volume, pan, expression, sostenuto and soft are recognised and never sent, and
  are marked `receives` below. The other twenty-five travel both ways.

  AFTERTOUCH IS RECEIVED IN BOTH ITS FORMS AND SENT IN NEITHER, on this model. The chart marks
  both Key's and Channel aftertouch as recognised, marks Channel as transmitted and Key's as
  not, and footnotes both "Only the opsix SE can send aftertouch" - and the specifications
  agree, giving the opsix 37 keys without aftertouch where the SE has 61 with it. Which form
  reaches the sound is then a setting: "Aftertouch Src ... Ch: Channel pressure is applied ...
  Poly: Polyphonic key pressure is applied. The effect intensity varies according to the note
  number" (p. 78), and a fourth setting takes both at once - "Both: Both channel and polyphonic
  key pressure are applied" (p. 78). So `voice.aftertouch` is `both`, since this instrument
  answers to either kind and which one reaches the sound is the player's setting, and
  `aftertouch_transmits` is false.

  THE PROGRAM CHANGE REACHES A HUNDRED OF FIVE HUNDRED. The chart gives program change as 0 to
  99 in both directions, and the instrument holds "500 programs (350 preset programs and 150
  user programs as the factory-set default)" (p. 6). Bank select is the other half of that, MSB
  and LSB, which the chart gives as controller 0 and 32 and the manual never mentions. Five
  banks of a hundred is the arithmetic and not the maker's word, so `presets` records the
  hundred the chart states.

  NOT RECORDED: the pitch bend range, which the chart marks as travelling both ways and never
  quantifies, and which no page of the manual states in semitones.

