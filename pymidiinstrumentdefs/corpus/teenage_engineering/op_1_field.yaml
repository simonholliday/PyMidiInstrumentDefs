  midi_lfo_input_3:                 {label: "MIDI LFO input 3", cc: 3, group: midi_lfo, direction: receives}
  midi_lfo_input_4:                 {label: "MIDI LFO input 4", cc: 4, group: midi_lfo, direction: receives}

  # MIXER ---------------------------------------------------------
