midi:
  # "MIDI In Channel: (All, 1…16)" (manual p. 112), where All is every channel at once.
  channels: [1, 16]
  # "MIDI clock mode" (spec p. 39) is off, in, out or in-tempo-sync, so it can be sent or followed.
  clock: both
  # "MIDI start/stop sequence - If on, MIDI start messages will star the internal sequencer"
  # (spec p. 2), and no document says the instrument sends either.
  transport: receives
  program_change:
    # Sent, behind "MIDI Send Program Change" (manual p. 112); receiving is not stated. See the
    # source account for the 500 presets.
    sends: true
  # Pages of it: program import and export, wavetables, samples, a device inquiry (spec pp. 47-75).
  sysex: true
  # "NRPNs are the preferred method." (manual p. 113).
  nrpn: preferred
  # "The 3rd Wave responds to MIDI Polyphonic Expression (MPE)." (manual p. 104), in a mode a global
  # setting turns on, and "the 3rd Wave doesn’t output MPE from its own keyboard" (manual p. 104).
  per_voice_channels: true

voice:
  # "Because the 3rd Wave has 24 voices of polyphony, multi-parts equally divide the 24 voices"
  # (manual p. 9) - so twelve each with two parts active, six each with four.
  polyphony: 24
  pitch_bend:
    # "Pitch bend range up, 0-24 semitones" (spec p. 19) and down the same, per program.
    programmable: true

groups:
  # THE MAKER'S OWN DIVISIONS. The controller table's own column heading for what it lists, and the
  # NRPN table's category names, which the specification defines (spec p. 18).
  panel: 3rd Wave Control
  single: Single
  multi: Multi
  global: Global

