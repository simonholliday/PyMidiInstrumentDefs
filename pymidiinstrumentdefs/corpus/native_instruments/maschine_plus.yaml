    # 243 sheets, not encrypted, with a real text layer, made on 11 May 2022 by Antenna House's
    # formatter from XSL - which is why its text reads cleanly and it carries no soft hyphens.
    # **The date in the file name is two days after the PDF was built**, which is the only version
    # information this document has: it carries no edition number anywhere.
  older_manual:
    kind: manual
    title: MASCHINE+ Manual
    dated: 2020-10-01
    landing: "https://www.native-instruments.com/pages/maschine-downloads"
