midi:
  # The chart's Basic Channel row gives `1–16` against Changed in both columns (manual p. 147), the
  # range any of the four channels below can be set to, and each of the four menu entries agrees.
  channels: [1, 16]
  # `Mode 3` in both columns, with Messages and Altered both x (manual p. 147).
  mode: 3
  # The chart's Clock row is o in both columns (manual p. 147), and the menu has a setting for
  # where it comes from, "MIDI Clock Sync" (manual p. 96).
  clock: both
  # Start and Stop are o in both columns. Continue is x transmitted and o received, and what it
  # does on arrival is start - see the source account.
  transport: both
  program_change:
    # o in both columns with a Settings range of `0–63` in both (manual p. 147), each direction
    # behind its own switch: "Tx Program Change" (manual p. 96) and "Rx Program Change" (manual
    # p. 96).
    receives: true
    sends: true
    # The specifications list sixty-four "User patterns" (manual p. 151), and the chart's range is
    # 0 to 63. Which number reaches which pattern is not stated.
    presets: 64
  # x in both columns (manual p. 147), and "exclusive" is on no other page.
  sysex: false
  # CHECKED AND ABSENT. NRPN, RPN and Registered Parameter are on none of the 152 pages.
  nrpn: none

parts:
  # FOUR CHANNELS, AND THE CHART GIVES ALL FOUR DEFAULTS. Its Basic Channel row names 5 for the
  # granular sampler, 11 for the sample pads and 16 for program change in both columns, and a
  # fourth, 15 for auto, in the received column only (manual p. 147). Each has its own menu entry
  # taking 1 to 16 (manual p. 95, 96), so none is fixed and none derives from another.
  granular:
    label: Granular sampler
    channel: assigned
    # "Sets the MIDI transmitting/receiving channel for the [GRANULAR] pad." (manual p. 96) - and
    # on 1.02 the control changes reach it. How a note arriving here is read is never said, so no
    # addressing is recorded.
    receives: [notes, controls]
    # Four voices: "Granular sampler: 4" (manual p. 151) under maximum polyphony.
    polyphony: 4
  sample_pads:
    label: Sample pads
    channel: assigned
    # A note number chooses a pad and does not play a pitch: "The note numbers are used to specify
    # the sample pads." (manual p. 148). Notes 48 to 95 - see the source account.
    addressing: voices
    receives: [notes]
    # Sixteen voices: `Sample: 16` under maximum polyphony (manual p. 151).
    polyphony: 16
  auto:
    label: Auto
    channel: assigned
    # "This is the MIDI receive channel used for playing the currently selected pad" (manual p. 96)
    # - in scale notes, so a note here is a pitch - "or receiving control change messages." (manual
    # p. 96). It has no voices of its own: it plays whichever pad is selected, from that pad's.
    addressing: pitches
    receives: [notes, controls]
  pattern:
    label: Pattern
    channel: assigned
    # "Sets the MIDI channel for transmitting/receiving the program change messages used to change
    # patterns." (manual p. 96) - and nothing else reaches it.
    receives: [program_change]

voice:
  # NOT SHARED. The specifications give the sample pads and the granular sampler voices of their
  # own (manual p. 151), so each figure is on its part above and none is stated here.
  polyphony_shared: false
  velocity:
    # `o` in both columns of the chart's Note On row (manual p. 147). What the pads send is fixed
    # by a setting, "Key Velocity" (manual p. 96), from 1 to 127.
    note_on: received
    # `x` in both columns of its Note Off row (manual p. 147).
    note_off: false
  # A checked absence, from the chart's own rows: Key's and Channel's are both x in both columns
  # (manual p. 147).
  aftertouch: none
  # NOT RECORDED as a depth, because there is none: pitch bend is crossed both ways (manual p. 147),
  # so this instrument has no pitch bend at all rather than an unpublished range.
  # NOT RECORDED, the note range: the sample pads take 48 to 95 and the auto channel plays at
  # pitch with a true voice of 0 to 127, and this field holds one range for the whole instrument.

groups:
  # THE SECTION EACH LIST ENTRY'S OWN PAGE CITATION LANDS IN. Every row of the list cites the page
  # its parameter is set on, and those pages sit under "SAMPLE EDIT (VOICE) settings" (manual
  # p. 106), "SAMPLE EDIT (FILTER) settings" (manual p. 110), "SAMPLE EDIT (MIXER) settings" (manual
  # p. 112) and "DELAY/REVERB settings" (manual p. 114) - the button names in the brackets are the
  # labels. The two Lo-Fi entries cite the two pages about that effect (manual pp. 12 and 13).
  voice: VOICE
  filter: FILTER
  mixer: MIXER
  lo_fi: Lo-Fi
  delay_reverb: DELAY/REVERB

controls:
  # ──── voice ────

  grain_reverse_probability: {label: Grain Reverse Probability, cc: 3, part: granular, group: voice}
  detune:                    {label: Detune, cc: 13, part: granular, group: voice}
  grain_shape:               {label: Grain Shape, cc: 15, part: granular, group: voice}
  grain_time_key_follow:     {label: Grain Time Key Follow, cc: 16, part: granular, group: voice}
  fine_tune:                 {label: Fine Tune, cc: 18, part: granular, group: voice}
  head_position:             {label: Head Position, cc: 19, part: granular, group: voice}
  head_speed:                {label: Head Speed, cc: 20, part: granular, group: voice}
  grains:                    {label: Grains, cc: 21, part: granular, group: voice}
  grain_size:                {label: Grain Size, cc: 23, part: granular, group: voice}
  spread:                    {label: Spread, cc: 25, part: granular, group: voice}
  amp_switch:                {label: Amp Switch, cc: 28, part: granular, group: voice}
  t_env_mode:                {label: T.Env Mode, cc: 29, part: granular, group: voice}
  t_env_sustain:             {label: T.Env Sustain, cc: 30, part: granular, group: voice}
  grain_timing_jitter:       {label: Grain Timing Jitter, cc: 68, part: granular, group: voice}
  t_env_release:             {label: T.Env Release, cc: 72, part: granular, group: voice}
  t_env_attack:              {label: T.Env Attack, cc: 73, part: granular, group: voice}
  t_env_decay:               {label: T.Env Decay, cc: 75, part: granular, group: voice}
  coarse_tune:               {label: Coarse Tune, cc: 76, part: granular, group: voice}
  t_env_time_key_follow:     {label: T.Env Time Key Follow, cc: 77, part: granular, group: voice}
  start_mode:                {label: Start Mode, cc: 79, part: granular, group: voice}
  sample:                    {label: Sample, cc: 88, part: granular, group: voice}

  # ──── filter ────

  filter_type:               {label: Filter Type, cc: 12, part: granular, group: filter}
  filter_envelope_depth:     {label: Filter Envelope Depth, cc: 24, part: granular, group: filter}
  filter_cutoff_key_follow:  {label: Filter Cutoff Key Follow, cc: 26, part: granular, group: filter}
  filter_resonance:          {label: Filter Resonance, cc: 71, part: granular, group: filter}
  filter_cutoff_frequency:   {label: Filter Cutoff Frequency, cc: 74, part: granular, group: filter}
  filter_velocity_sens:      {label: Filter Velocity Sens, cc: 78, part: granular, group: filter}

  # ──── mixer ────

  level:                     {label: Level, cc: 7, part: granular, group: mixer}
  auto_pan:                  {label: Auto Pan, cc: 9, part: granular, group: mixer}
  pan:                       {label: Pan, cc: 10, part: granular, group: mixer}
  level_jitter:              {label: Level Jitter, cc: 14, part: granular, group: mixer}
  output_bus_select:         {label: Output Bus Select, cc: 84, part: granular, group: mixer}
  send_delay:                {label: Send Delay, cc: 85, part: granular, group: mixer}
  send_reverb:               {label: Send Reverb, cc: 86, part: granular, group: mixer}

  # ──── lo_fi ────

  lo_fi:                     {label: Lo-Fi, cc: 17, part: granular, group: lo_fi}
  lo_fi_switch:              {label: Lo-Fi Switch, cc: 87, part: granular, group: lo_fi}

  # ──── delay_reverb ────

  reverb_time:               {label: Reverb Time, cc: 89, part: granular, group: delay_reverb}
  delay_time:                {label: Delay Time, cc: 90, part: granular, group: delay_reverb}
  reverb_level:              {label: Reverb Level, cc: 91, part: granular, group: delay_reverb}
  delay_level:               {label: Delay Level, cc: 92, part: granular, group: delay_reverb}
