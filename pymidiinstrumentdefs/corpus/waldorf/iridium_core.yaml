    # document that says program change is answered.

midi:
  # NO CHANNEL RANGE: see the account. Clock is received, and no page says MIDI clock is sent
  # (manual p. 179).
  clock: receives
  program_change:
    # ON ONE FAQ ENTRY THE THREE IRIDIUMS SHARE, CONFIRMED ONLY BY A SCREENSHOT - see the account. A
    # program change picks an entry in the `Favorites` list, and no count is recorded.
    receives: true
    # From a Macro button: `Send MIDI Prog` (manual p. 171).
    sends: true
  # LEARNED: see the account, which also says why no range of learnable numbers is given. The
  # fifteen controls below are the ones the maker fixes.
  control_change: learned
  # "the Iridium Core doesn´t react on incoming NRPN MIDI data." (manual p. 179); it sends them.
  nrpn: none
  # MPE, with an optional second zone (manual p. 178).
  per_voice_channels: true
  # NOT RECORDED: `mode`, `transport`, `sysex`; see the account.

voice:
  addressing: pitches
  # "Keep in mind that Iridium Core offers an overall polyphony of 12 voices." (manual p. 154).
  polyphony: 12
  # "If you set Layer 1 to 9 voices, Layer 2 automatically switches to 3 voices" (manual p. 154).
  polyphony_shared: true
  velocity:
    # `MIDI Velocity` among the modulation sources (manual p. 211); release velocity is not in the
    # table - see the account.
    note_on: received
  # Poly AT by default, Mono AT by choice (manual p. 149).
  aftertouch: poly
  pitch_bend:
    # Per oscillator, -24 to +24, default +12 (manual p. 32).
    semitones: 12
    programmable: true

parts:
  layer:
    label: Layer
    # "two different sounds can be played simultaneously" (manual p. 23).
    count: 2
    # `Layer 1/2 Input Channel` (manual p. 177) and `Chan 1 / 2` on output (manual p. 179).
    channel: assigned
    addressing: pitches
    # Program change is read as not a Layer's: the FAQ says only that it picks a `Favorites` entry,
    # which this definition reads as a whole patch, as `waldorf/iridium` does; recalling from the
    # Favorites page loads the whole patch (manual p. 22).
    receives: [notes, controls]

groups:
  controllers: Controllers
  pedals: Pedals
  modulation: Modulation Sources
  mpe: MPE

controls:

  # CONTROLLERS ---------------------------------------------
  wheel:                 {label: Wheel, cc: 1, direction: receives, group: controllers}
  breath_control:        {label: Breath Control, cc: 2, direction: receives, group: controllers}

  # PEDALS --------------------------------------------------
  expression:            {label: Expression, cc: 11, direction: receives, group: pedals}
  pedal:                 {label: Pedal, cc: 64, direction: receives, group: pedals}

  # MODULATION SOURCES --------------------------------------
  cc_22:                 {label: CC 22, cc: 22, direction: receives, group: modulation}
  cc_23:                 {label: CC 23, cc: 23, direction: receives, group: modulation}
  cc_24:                 {label: CC 24, cc: 24, direction: receives, group: modulation}
  cc_25:                 {label: CC 25, cc: 25, direction: receives, group: modulation}
  cc_26:                 {label: CC 26, cc: 26, direction: receives, group: modulation}
  cc_27:                 {label: CC 27, cc: 27, direction: receives, group: modulation}
  cc_28:                 {label: CC 28, cc: 28, direction: receives, group: modulation}
  cc_29:                 {label: CC 29, cc: 29, direction: receives, group: modulation}
  cc_30:                 {label: CC 30, cc: 30, direction: receives, group: modulation}
  cc_31:                 {label: CC 31, cc: 31, direction: receives, group: modulation}

  # MPE -----------------------------------------------------
  # NAMED ONLY FOR MPE INPUT (manual p. 178); see the account.
  mpe_y_axis:            {label: MPE Y Axis, cc: 74, direction: receives, group: mpe}
