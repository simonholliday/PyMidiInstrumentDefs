  oscillator_mix_split_point:           {label: Oscillator Mix/Split Point, cc: 37, nrpn: 1061, nrpn_range: [0, 16383]}
  vcf_hpf_mode:                         {label: VCF HPF Mode, cc: 40, values: {"off": 0, "fix": 43, "trk": 85}}
  vcf_drive:                            {label: VCF Drive, cc: 41, values: {"off": 0, "n1": 43, "n2": 85}}
