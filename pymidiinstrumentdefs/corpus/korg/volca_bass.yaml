midi:
  # "Step buttons 1 to 16 correspond to the MIDI channels 1 to 16." (manual p. 1), and the chart
  # gives 1 - 16 for both the default and the changed channel, with "Memorized" against it. **No
  # default is recorded**: the chart prints the span in the box where a single default would go,
  # and no page says which channel a new instrument starts on.
  channels: [1, 16]
  # The chart's Mode row: 3 recognised, which is OMNI OFF, POLY by its own legend.
  mode: 3
  # RECEIVES, AND IT COULD NOT BE ANYTHING ELSE: the chart marks Clock with a cross transmitted
  # and a circle recognised, and the instrument has no MIDI Out jack to send one from. Conditional
  # on a setting that ships permissive - "Not received when global parameter MIDI Clock src is set
  # to Internal; received when set to Auto." (chart p. 1).
  clock: receives
  # Start, Continue and Stop as one Command row of the chart, and Song Position as its own row,
  # all recognised and none transmitted. The implementation prints the three realtime bytes and
  # misspells one of them.
  transport: receives
  program_change:
    # A CHECKED ABSENCE IN BOTH DIRECTIONS: the chart marks Program Change with a cross
    # transmitted and a cross recognised, and its Variable Range row is the asterisks it prints
    # where a cell does not apply. The implementation lists no program change among the channel
    # messages it recognises, and that table is exhaustive.
    receives: false
    sends: false
  # The implementation enumerates every channel message this instrument answers to and there is
  # no registered or non-registered parameter among them, which makes this a checked absence
  # rather than a silence. The chart has no row for either, as this maker's charts do not.
  nrpn: none
  # The chart marks System Exclusive with a cross in both columns.
  sysex: false

voice:
  # The chart gives Note Number as `0 – 127` recognised, against nothing
  # transmitted, and the implementation's Note On and Note Off rows take a key number. This is a
  # bassline synthesiser and a note is a pitch, which is where it differs from the volca drum.
  addressing: pitches
  note_range: [0, 127]
  velocity:
    # The chart's Velocity row: Note On recognised as "9n, V=1 – 127" (chart p. 1) with a
    # cross in both columns. The implementation agrees and adds the convention in words - a Note
    # On of velocity nought is a Note Off.
    note_on: received
    note_off: false
  # A checked absence from the chart's own rows: Polyphonic (Key) is a cross in both columns and
  # Monophonic (Channel) is a cross in both columns.
  aftertouch: none
  # NOT RECORDED: pitch bend's range. The chart recognises Pitch Bend and the implementation
  # prints its status byte, and **no document says how far it bends**, so there is no number for
  # `semitones` and nothing to say about whether it is programmable.

groups:
  oscillators: Oscillators
  lfo: LFO
  envelope: Envelope
  performance: Performance

controls:
  # OSCILLATORS -----------------------------------------------------
  # **THE ONE CONTROL EITHER DOCUMENT GIVES A MEANING TO.** Six bands over the whole span, from
  # the implementation's `*2` table, which is the only value map anywhere in these documents.
  octave:                           {label: OCTAVE, cc: 40, values: {"oct_1": 0, "oct_2": 22, "oct_3": 44, "oct_4": 66, "oct_5": 88, "oct_6": 110}, group: oscillators, direction: receives}
  vco_pitch_1:                      {label: VCO PITCH 1, cc: 43, group: oscillators, direction: receives}
  vco_pitch_2:                      {label: VCO PITCH 2, cc: 44, group: oscillators, direction: receives}
  vco_pitch_3:                      {label: VCO PITCH 3, cc: 45, group: oscillators, direction: receives}

  # LFO -------------------------------------------------------------
  lfo_rate:                         {label: LFO RATE, cc: 41, group: lfo, direction: receives}
  lfo_int:                          {label: LFO INT, cc: 42, group: lfo, direction: receives}

  # ENVELOPE --------------------------------------------------------
  eg_attack:                        {label: EG ATTACK, cc: 46, group: envelope, direction: receives}
  # **THE CHART'S SPELLING, BECAUSE THE IMPLEMENTATION'S IS NOT A WORD.** That file prints `EG
  # DECAT/RELEASE`; the chart prints `EG DECAY/RELEASE`, and the knob on the panel is DECAY/
  # RELEASE. Recorded here rather than silently corrected, because the number comes from the
  # file that misspells it.
  eg_decay_release:                 {label: EG DECAY/RELEASE, cc: 47, group: envelope, direction: receives}
  cutoff_eg_int:                    {label: CUTOFF EG INT, cc: 48, group: envelope, direction: receives}

  # PERFORMANCE -----------------------------------------------------
  # **THESE THREE ARE THE ONES THE PANEL CANNOT REACH**, marked `*3` on the chart, and two of
  # them are named nowhere in the owner's manual. A controller is the only way to any of them.
  slide_time:                       {label: SLIDE TIME, cc: 5, group: performance, direction: receives}
  expression:                       {label: EXPRESSION, cc: 11, group: performance, direction: receives}
  gate_time:                        {label: GATE TIME, cc: 49, group: performance, direction: receives}
