# TWO MAPS AGAIN, AND THIS TIME ONE IS THE OTHER'S FIRST QUARTER. The PĒRKONS answers to the
# forty-four numbers below **in SINGLE MIDI CHANNEL mode**, where all four voices are on one
# channel and each has eleven numbers of its own. In MULTI MIDI CHANNEL mode each voice takes a
# channel of its own and they all answer to voice 1's eleven - "In MULTI MIDI CHANNEL mode, MIDI
# CC messages for all voices are the same as for VOICE 1, but you have to assign voices to
# different MIDI channels" (p. 35). The mode is a setting on the instrument's configuration page
# and the maker does not say which way it ships.
#
# **THIS FORMAT HAS NO FIELD FOR A MAP THAT IS LIVE IN ONE MODE ONLY**, so the file describes the
# map the maker prints as a table and writes the other out here in words. Nothing is lost by it:
# the other map is these same numbers' first quarter, moved onto four channels.
#
# THE NUMBERS ARE A FACTORY ASSIGNMENT AND THE PLAYER CAN REWRITE THEM, which is unusual enough to
# say on the file's face: "You can alter the MIDI CC message assignment to your preference simply
# by replacing CC message numbers in a text file on the SD card" (p. 36) - a file the same page
# names `single-midi-cc.json`. So everything below is what a PĒRKONS answers to as it leaves the
# factory, and a particular instrument may have been changed. There is no MIDI learn here and no
# way to ask the instrument what it is set to; the file on the card is the whole of it.
#
# THE FOUR NOTE NUMBERS ARE NOT IN PRINT. "Voices will be triggered by NOTE ON messages - Voice 1
# - C, Voice 2 - C#, Voice 3 - D, Voice 4 - D#" (p. 35), and **no octave is given anywhere in
# thirty-seven pages**, so there is no note number to record. A player has to find the octave by
# trying it.
#
# AND NEITHER ARE THE SWITCHES' POSITIONS. Each voice's ALGO, MODE and FILTER switch has three
# positions and the manual names all three of each - the algorithms and their modes at pp. 8 to 11,
# the filters at p. 7 - but it never prints what to send to reach one. So they are plain controls
# below rather than three-state ones, because the only number a player actually needs is the one
# the maker did not print.

definition: 1

model:
  manufacturer: Erica Synths
  # THE MAKER WRITES IT WITH A MACRON and the file's name cannot, so the two differ on purpose.
  # Pērkons is the Baltic god of thunder and the manual opens by saying so. The same manual drops
  # the macron twice - its heading on p. 34 spells the name PERKONS before "FIRMWARE V1.1.
  # CHANGELOG" (p. 34), and p. 32 has "the PERKONS sends out all MIDI information from the internal
  # sequencer" (p. 32) - so both spellings are the maker's.
  name: PĒRKONS HD-01
  # The manual's own page headings: pp. 31, 32 and 33 are each headed "CONFIGURATION SETTINGS -
  # FIRMWARE V1.2" (p. 31). **AND 1.2 IS STILL THE NEWEST**, which is an absence and is evidenced:
  # every post the maker's news listing serves, seventy-five of them in an unbroken run from June
  # 2024 to August 2026, carries three PĒRKONS firmware announcements and no fourth.
  # The maker's two namings of this release differ by a digit: the announcement is headed "PERKONS
  # UPDATE 1.2" (firmware_1_2) and the image it offers is `perkons_both_v1.2.1-0-gbcccfd0.img`.
  # This is 1.2, which is what the pages the numbers come from call it.
  firmware: "1.2"

source: >-
  PĒRKONS HD-01 User Manual, 37 pages, December 2024, for firmware 1.2. **Everything below comes
  from pp. 35 and 36**, the two pages headed MIDI IMPLEMENTATION, and they are the whole of what
  this maker publishes about this instrument's MIDI: there is no implementation chart, no separate
  MIDI document and nothing on midi.guide. Around them: the connectors at p. 6, the voice controls
  at p. 7, the sound engines at pp. 8-11, the configuration page at pp. 31-33, and the firmware 1.1
  changelog at p. 34.

  THE MANUAL IS REACHED THROUGH A NEWS ITEM AND THERE IS NO OTHER ROUTE TO IT. The maker's product
  and support pages assemble their download lists in the browser, so an HTTP client that fetches
  either gets no link to anything. The manual is the second of two links in the announcement of
  firmware 1.2, worded "DOWNLOAD UPDATED MANUAL HERE" (firmware_1_2). That announcement is cited
  here as a document in its own right, with the two before it, because between them they are the
  only changelogs this instrument has.

  FORTY-FOUR CONTROLLER NUMBERS, 70 TO 113, WITH NOTHING UNUSED IN BETWEEN. Eleven controls for
  each of four voices: "All 8 potentiometers and 3 switches of each voice on the PĒRKONS can be
  controlled via MIDI CC messages" (p. 35). Voice 1 has 70 to 80, voice 2 81 to 91, voice 3 92 to
  102 and voice 4 103 to 113, in the order the page lists the controls down its left-hand side.

  THE TABLE IS A DRAWING AND NOT A TABLE. This manual was set in Adobe Illustrator and its two
  kinds of table are grids of free-standing words with no ruling and no cells, so which number
  belongs under which heading is in the coordinates and nowhere else. **Reading by the order the
  words come out of the file is wrong in the way that looks right**: done that way, the fourth
  voice's three algorithms come back as NOISE HAT, NOISE/TONE, ACOUSTIC HATS, which reads as
  algorithms 1, 2 and 3 - and the maker says elsewhere that algorithm 3 is the one with the samples
  in it, "VOICE 4, ALGORITHM 3 contains three hi-hat samples that can be selected via the MODE
  switch" (p. 33), which is ACOUSTIC HATS. The columns settle it; the file order does not. Both
  kinds of page also carry a drawing of the voice panel at the right-hand edge, whose words would
  otherwise land in the table.

  WHAT IS ABSENT, SEARCHED FOR ACROSS ALL THIRTY-SEVEN PAGES. The words NRPN, RPN and Registered
  appear nowhere, which is what `nrpn: none` records. Neither do `System Exclusive`, `SysEx`,
  `Program Change`, `Pitch Bend` or `Aftertouch` - but those are left unrecorded rather than
  written as checked absences, because this is a manual and not an implementation chart, and one
  that does not mention a thing has not been asked about it. The distinction matters most for
  program change: the instrument holds 64 banks of 64 kits and 64 patterns (p. 28) and the manual
  describes no way to reach any of them over MIDI, so no preset count is recorded here at all.

  NO MIDI CHANNEL NUMBER OR RANGE IS PRINTED. The channel is chosen on the instrument - "In the
  SINGLE CHANNEL MIDI CONFIG menu, you can select a MIDI channel for controlling the PĒRKONS"
  (p. 32) - and the manual never says how many there are to choose from. The sub-menu is a row of
  sixteen step buttons and MIDI has sixteen channels, which is a good guess and is not a fact the
  maker printed, so `channels` is left unrecorded. The one channel number in print is a default:
  "Voice 1 = MIDI CH1, Voice 2 = MIDI CH2 etc." (p. 34), for the other mode.

  WHAT THE CONTROLS TRAVEL. Both ways. The connector caption has MIDI IN taking them - "Full-size
  DIN5 MIDI In receives trigger note messages, MIDI clock as well as CC messages for all voice
  parameters" (p. 6) - and the configuration page has them going out, "Step button 7 turns on the
  transmission of parameter MIDI CC messages via the MIDI OUT port" (p. 32). The same caption at
  p. 6 says only that "The MIDI OUT port outputs trigger and MIDI clock messages" (p. 6), which is
  the shorter of the two accounts rather than a contradiction of it.

  THE ONE FIRMWARE NOTE THAT TOUCHES THESE NUMBERS is "Fixed VCF mode CC bug" (firmware_1_2), which
  is the maker saying that a voice's FILTER SWITCH did not answer right before December 2024. The
  1.1 note added the note input - "Set MIDI mode to multi-channel and you can program notes into
  the sequencer either by playing them live and recording or by pressing the desired step button
  and then sending in the MIDI note" (p. 34) - and the 1.0 note mentions MIDI only for its clock.

  THE MANUAL REPEATS A PARAGRAPH AND LOSES ONE, which is worth knowing before trusting any of its
  prose. "Step button 9 of the second track" (p. 32) and "Step button 12 of the second track"
  (p. 33) are both described as inverse odds, word for word the same paragraph twice over, while
  the manual's own diagram has TRACK ROTATE at step 12 (p. 31). The announcement of firmware 1.2 is
  what the missing paragraph would have said. Nothing below rests on that page; it is recorded
  because a document that repeats itself may be missing something.

  AND ITS OWN CROSS-REFERENCES ARE A PAGE OUT. One sends a reader to "page 30 of the manual"
  (p. 17) and the next to "page 30 of this manual" (p. 18), for settings that begin on p. 31. The
  printed page numbers themselves match the sheets exactly, and every locator here was taken from
  the page rather than from a reference to it.

