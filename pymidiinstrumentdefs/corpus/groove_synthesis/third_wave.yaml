# TWO MAPS FOR ONE INSTRUMENT, AND A SETTING CHOOSES WHICH IS LIVE. The maker's MIDI specification
# gives the keyboard a controller table of its knobs and buttons, and every model one NRPN table of
# every setting a program holds. A global setting picks controllers, NRPNs or neither, each
# direction on its own, and the keyboard's manual calls NRPNs the preferred method. Both maps are
# carried below, as separate controls, because the two tables name different things: the controller
# table names a panel's controls - "Wave env time 2/5 pot" (spec p. 3) and the like - and the NRPN table
# names a program's parameters, and nothing in either pairs a row with a row of the other.
#
# THE SPECIFICATION COVERS THREE INSTRUMENTS AND THIS IS ONE OF THEM. The 24-voice keyboard, the
# 24-voice desktop module and the 8-voice desktop each get a controller table of their own, and the
# three differ. This file is the keyboard's: it takes the keyboard's table, and every row of the
# shared NRPN table that its own description does not give to another model.

definition: 1

model:
  manufacturer: Groove Synthesis
  name: 3rd Wave
  # THE NEWEST THE MAKER LISTS, ESTABLISHED BY WHAT EACH RELEASE CHANGED. The support page offers
  # "OS Version 2.0c, released Sep 10, 2026." (support) for both 24-voice models. Each of 2.0a's
  # three MIDI changes is in the specification by name - the per-part NRPN offset, the shimmer
  # reverb, the expanded controller maps of the other two models - and 2.0c's one change is "for
  # upcoming editor / librarian" (release_notes), which touches nothing recorded here.
  firmware: "2.0c"

source: >-
  The maker's "3rd Wave MIDI CC + SysEx Spec v2.0" (spec p. 1), published as a document linked
  from its support page and read as the PDF that document exports, 75 pages: the keyboard's
  controller table is spec pp. 3-8 and the NRPN table spec pp. 18-39. The export prints no page
  numbers, so it is cited by the file's own pages. Beside it, the keyboard's own manual, version
  1.9, for the voices, the parts, the MIDI settings and MPE (pp. 1, 9, 98, 103-104 and 112-113);
  the notes for every firmware release from 1.0 to 2.0c; and the support page that lists them.

  READ TWICE, IN TWO RENDERINGS, BEFORE ANYTHING WAS CARRIED. The maker's document exports as a PDF
  and as plain text, and both came back byte for byte the same on a second fetch. Both tables were
  read from each - the PDF by its ruled grid, the text by its cells - and the two agree on every row
  of both, but for one cell where the PDF wraps `in-tempo-sync` in the middle of a word. **And a
  second reader, working blind from the PDF alone by a different method, agrees with both on every
  row**; most of the disagreements recorded below are that reader's finding.

  TWO MAPS, AND A SETTING CHOOSES. The specification's global settings say a `MIDI param send`
  and a `MIDI para receive` setting each choose "MIDI CC, MIDI nrpn, or off" (spec p. 2), and the
  manual's own list of the settings calls NRPN "the preferred method" (manual p. 113).
  **The NRPN table says the receiving setting's third value is something else**: "0: off, 1: CC, 2:
  CC+NRPN" (spec p. 38). The prose, the manual and the table do not agree about whether the
  instrument can take both at once, and nothing here depends on which is right.

  THE CONTROLLER TABLE NAMES KNOBS, AND THE MAKER SAYS WHY. "originally the MIDI CC implementation
  was designed to map physical controls on the synth" (spec p. 2), and "In later releases there has
  been a shift to expose more parameters over MIDI CC instead of using them to map knobs and
  buttons." (spec p. 2) - for the two desktop models, whose tables grew in 2.0a. **The keyboard's did
  not**: its 101 rows are its panel's controls.

  EVERY ROW OF BOTH TABLES IS ACCOUNTED FOR. The keyboard's controller table prints 101 rows and a
  sub-table of four "New in version 1.9a (remapped CC 65, 66, 67 to prevent conflicts)" (spec p. 8).
  **Four are not carried**: 32, "MIDI bank select" (spec p. 4), which is how a program is addressed
  rather than a parameter of one; and 65, 66 and 67, the low-pass filter's cutoff, resonance and
  envelope amount, which the main table still prints marked "changed in version 1.9, see below"
  (spec p. 5) and which 1.9a moved to 9, 37 and 39. What 65 to 67 do on this firmware is not stated.
  So 101 controls come from that table. The NRPN table prints 469 rows, 0 to 468 without a gap, and
  413 are carried. **The 56 not carried each say why in their own row**: the part-select bitmap at
  0; eleven rows of sequence data, a stream of commands rather than a parameter; 27 whose value
  packs two numbers into one, which a single range cannot describe - the three oscillators'
  wavetable selectors and 24 song steps; six marked deprecated; three marked `not used currently`;
  five "used only on Desktop module" (spec p. 37); two the 8M's own; and 444, filed as `Not
  settable` and "used internally for saving presets via SysEx" (spec p. 37).

  THE MULTI-PART ROWS ARE ADDRESSED THROUGH THE PART BEING EDITED, AND THE FORMAT HAS NO WORD FOR
  THAT. 269 of the carried rows are of the category whose "program contains 4 separate values for a
  multi-part setting, one for each of its 4 parts" (spec p. 18), and a value sent to one of them
  reaches whichever parts NRPN 0 has chosen: "Use NRPN #0 to change the active part that you are
  editing for multi-part settings." (spec p. 18). Since 2.0a a global setting can give each part
  numbers of its own instead - "In this mode it adds 1000 for each part to the NRPN number" (spec
  p. 18) - so part 2's copy of NRPN 255 is 1255. **The numbers below are the table's**, which are part
  1's in that mode and the edited part's otherwise; the three further copies are not written out.
  One of these rows is filed under `Mutli` (spec p. 29), NRPN 253, and is carried as the others.

  FOUR PARTS ON FOUR CHANNELS, IN A MODE, AND NO PARTS DECLARED HERE. "The 3rd Wave is 4-part
  multitimbral" (manual p. 9), and a global setting puts each part on a channel of its own. Neither
  document says whether that setting is on when the instrument leaves the factory, so this file
  describes the instrument on its one MIDI channel and declares no parts. **And the manual
  contradicts itself about the count**: the setting "allows independent MIDI control of multi-parts
  1-2 on a given program" (manual p. 112), and the four settings that follow it give parts 1 to 4 a
  channel each.

  GROOVE SYNTHESIS IS THE THIRTY-SECOND MAKER HERE AND THIS IS ITS FIRST INSTRUMENT, so nothing in
  this account leans on a habit of the maker's, and nothing should be taken from it for the next.

  THIRTY OF THE CARRIED CONTROLLERS ARE NUMBERS THE MIDI SPECIFICATION KEEPS FOR FINE HALVES. It
  makes 32 to 63 the fine halves of 0 to 31, and the keyboard's table gives thirty of them
  parameters of their own. **Three will meet a sender of fourteen-bit values**: 33 is Oscillator
  2's wave offset where a fourteen-bit modulation wheel sends its fine half, 34 is Oscillator 2's
  level beside breath control on 2, and 39 is the low-pass filter's envelope amount beside volume
  on 7. That is a fact about the MIDI specification set beside this table, not the maker's.

  WHAT THE DOCUMENTS DISAGREE ABOUT, recorded and not resolved:

  **One worked example against the NRPN table.** The specification's example of a program dump
  sends "MSB for param 254 (osc 1 level)" (spec p. 50), and its bytes make 254; the table gives
  254 to the third oscillator's fine tuning and puts the first oscillator's level at 255. The table
  is carried as printed - it is the maker's listing, it runs 0 to 468 without a gap, and two
  readings agree on every row of it - and nothing in the documents settles which is wrong. If it
  is the table, the fault is at or before 253, the one row filed under `Mutli`.

  **The modulation sources.** The list of them is "Mod Source values (0-29 values)" (spec p. 39) and
  runs to MIDI breath control at 29 (spec p. 40); the sixteen NRPN rows that choose a source give
  `0-26` (spec p. 26), which stops before the three sources the latest releases added. The rows'
  ranges are carried as printed.

  **Smaller ones.** The metronome's volume is `0-100` by NRPN (spec p. 20) and "Range 0-127"
  in the manual (manual p. 99). The MIDI in and out cables can be set off by NRPN (spec p. 39),
  where the manual offers "MIDI In Cable: (usb+midi, usb, midi)" (manual p. 112). The pitch
  wheel's destination is a `Single` row, one value for the program, where the notes' changes since
  version 1.0 say it became "settable per part" (release_notes).

  **Banks.** "The 3rd Wave has 500 presets divided into 5 banks of 100 presets." (manual p. 1), and
  the bank select controller the table names runs `0-3` (spec p. 4) - four of the five. The system
  exclusive messages index banks `0-4` (spec p. 48).

  **Effect 2's types.** The controller table lists fourteen, 0 to 13, ending with the shimmer reverb
  2.0a added (spec p. 7); the NRPN table's row for the same choice runs `0-12` and stops before it
  (spec p. 28). Both are carried as printed.

  **The modulation destinations.** The list of them runs "Mod destination values (0-126)" (spec
  p. 41); the controller table gives the LFO's destination `0-117` (spec p. 4) and the third and
  fourth envelopes' a cell reading only `117` (spec p. 6). The first is carried as printed and the
  second with no range at all.

  **The pressure curves.** NRPN 39 names nine, from `pressure off` to `fatar` (spec p. 20); the
  manual's list of the same setting differs in places - `Hard 2` and `Hard 3` where the table has
  `hard` and `hard 2`, and `Fatar Default` (manual p. 98). The choices below are the table's,
  because the control is the table's.

  WHAT IS NOT RECORDED, each for a stated reason. **Velocity and aftertouch**: both are modulation
  sources (spec p. 40), and neither document says whether incoming note velocity is used or which
  kind of pressure the keyboard sends - though the notes' changes since version 1.0 fix "clearing polyaftertouch values"
  (release_notes) from controllers that send it. **Receiving program change**: the manual says only that "The
  3rd Wave can send MIDI Program Change messages." (manual p. 103), and so the 500 presets are in
  this account rather than in a field that would claim the instrument answers to one; the
  only hint the other way is a "fix for midi program change via midi din" (release_notes), which
  names no direction. **The pitch
  bend's depth**: it is settable from 0 to 24 semitones up and down per program (NRPNs 36 and 37),
  and no default is given. **A mode** and **a note range**: there is no implementation chart.


