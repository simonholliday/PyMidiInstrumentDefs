    retrieved: 2026-10-05
    paginated: false
    # Cited for the day the manual and OS 1.4.1 were issued together, and for what Elektron
    # offers besides: the OS itself, its release notes, wavetables, and a Japanese manual still
    # at OS 1.00 from November 2025, **which describes a different instrument from this one** and
