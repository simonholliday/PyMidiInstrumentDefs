# **THE DOWNLOAD PAGE OFFERS TEN DATA LISTS FOR THIS INSTRUMENT AND TWO OF THE ROWS SERVE THE SAME
# FILE.** Fetched separately from the row labelled `Data List` and the row labelled
# `Data List for V1.2`: same 5,088,645 bytes, same SHA-256. So a label on that page cannot identify
# an edition, and neither can a filename, because both rows end `montage_en_dl_c0.pdf`. **What
# identifies an edition is the code Yamaha prints in the document's own colophon** - `MW-J0`,
# `MW-I0`, `MW-C0` - matching the suffix of its own file name. All three editions here were
# established that way rather than from the row they came out of.
#
# **AND NO DATA LIST PRINTS A FIRMWARE VERSION ANYWHERE INSIDE IT.** The only version in any of
# them is on the implementation chart, which reads `Version : 1.0` and `Date :18-FEB-2016` **in an
# edition published in May 2020**. Those are the chart's own date and version. A reader who takes
# that 1.0 for a firmware number is three major releases out.
#
# **THE MAP HAS NOT MOVED IN FOUR AND A HALF YEARS, AND THAT IS CHECKED RATHER THAN BELIEVED.**
# Both implementation charts and both control-number lists were read geometrically out of the
# July 2016, September 2019 and May 2020 editions and compared **cell for cell**. Every cell
# agrees, and so does the table of default assignable numbers. So the chart's unchanging claim
# about itself is true, and this definition describes the instrument at every firmware it has had.
#
# **TWO IMPLEMENTATION CHARTS, AND THEY ANSWER DIFFERENTLY.** Yamaha charts a `synthesizer part`
# and a `sequencer part` on facing sheets. The `synthesizer part` takes channel pressure and refuses key
# pressure, transmits no clock, and refuses song position and local control; the `sequencer part`
# takes both kinds of pressure and answers to all three. **This definition follows the synthesizer
# part**, because that is the half that makes a sound, and the account says what the other half
# adds.
#
# **FIVE YAMAHAS ARE HERE NOW AND THE MAKER RULE HELD A TWELFTH TIME.** `yamaha/dx7`,
# `yamaha/reface_cp`, `yamaha/reface_cs` and `yamaha/reface_dx` are the others, and the three
# refaces share one Data List between them - which is why a Yamaha Data List was expected to be a
# family document, and this one is. But none of the four names a MIDI mode and **this one names
# mode 3 outright**, and none of the four has a part structure at all.

definition: 1

model:
  manufacturer: Yamaha
  name: MONTAGE6/7/8
  # **ONE DEFINITION FOR THREE KEYBEDS, FOLLOWING `roland/fantom_6_7_8`** - and the specification
  # settles it rather than the precedent alone: the three models differ in their keybed and in
  # nothing else, and all three have aftertouch. See the account.
  #
  # **3.51, WHICH IS NOT A NUMBER ANY DOCUMENT HERE CARRIES.** It is the newest firmware the
  # maker offers, `MONTAGE OS Updater V3.51` dated 2021-02-22 (downloads_page), while the newest
  # Data List is labelled for V3.50. The map is checked unchanged across three editions spanning
  # 2016 to 2020, which brackets every release, so naming the current firmware is safe here in
  # the way `roland/fantom_6_7_8` established.
  firmware: "3.51"
  # Checked 2026-10-06.

source: >-
  **THE CONTROLLER NUMBERS COME FROM TWO LISTS, AND TWO OF THEM ARE NAMED DIFFERENTLY DEPENDING ON
  WHICH WAY THEY TRAVEL.** The Data List's MIDI Data Format prints a transmitted list of fourteen
  numbers and a received list of twenty-one, and controller 71 is "FILTER RESONANCE" (data_list p. 191) in the
  first and "HARMONIC CONTENT" (data_list p. 191) in the second, while 74 is "FILTER CUTOFF FREQ"
  (data_list p. 191) and "BRIGHTNESS" (data_list p. 191). **Same controller, same sheet, two names** - the instrument's own parameter name going
  out and the MIDI specification's name coming in. The labels below use the received name, because
  what a consumer sends is what the instrument receives, and the transmitted name is here.

  **NOTHING IS TRANSMITTED THAT IS NOT ALSO RECEIVED, AND SEVEN NUMBERS ARE RECEIVED ONLY.** The
  two lists were compared rather than read one from the other: the transmitted list is a subset.
  The seven are 6 and 38 (data entry), 96 and 97 (data entry increment and decrement), and three
  real controls - 11 "EXPRESSION" (data_list p. 191), 65 "PORTAMENTO SWITCH" (data_list p. 191)
  and 66 "SOSTENUTO" (data_list p. 191),
  which are `direction: receives` below. The other twelve go both ways.

  **SIX NUMBERS ARE ADDRESSING MACHINERY AND ARE NOT CONTROLS**, on the ruling the Fantom
  established: 0 and 32 are "Bank Select", 6 and 38 "Data Entry", 96 and 97 "RPN Inc,Dec" and 100
  and 101 "RPN LSB,MSB" (data_list p. 225). They address a parameter rather than being one. The
  chart's channel mode rows are refused by the format in any case.

  **FOURTEEN MORE CONTROLLERS ARE FACTORY ASSIGNMENTS RATHER THAN FIXTURES, AND THE DEFINITION SAYS
  WHICH.** The chart gives "1-95" against "Assignable Cntrl" (data_list p. 225), and a footnote
  prints the shipped assignment of each physical controller: the breath controller to 2, the ribbon
  to 16, the eight assignable knobs to 17 to 24, the two assignable functions to 86 and 87, and the
  motion sequencer's hold and trigger to 88 and 89 (data_list p. 191). Those are the `assignable`
  group below, and every one of them can be moved to any number in 1 to 95. `midi.control_change:
  learned` is what says the rest of that range is the owner's - the same reading
  `waldorf/iridium` carries beside fifteen published controls.

  **TWO OF THE SEVENTEEN ROWS IN THAT FOOTNOTE HAVE A WORD WHERE THE OTHERS HAVE A NUMBER**, and
  they are not controls at all: foot controller 2 is shipped pointing at the Super Knob and the foot
  switch at Arp SW (data_list p. 191). A fifteenth number, foot controller 1 at 11, is a number the
  fixed list already uses for Expression. So fourteen new controls rather than seventeen.

  **EVERY RECEIVED MESSAGE IS BEHIND A SWITCH, AND NO DOCUMENT SAYS WHICH WAY IT POINTS WHEN THE
  INSTRUMENT ARRIVES.** The chart marks almost every recognised row "O *1", with "*1
  receive/transmit if switch is on." (data_list p. 225) and no word about which switch. The
  Reference Manual has it: each of the sixteen parts carries a Receive SW page whose "CC (Receive
  Control Change) Determines whether Control Change messages are received or not. Settings: Off,
  On" (reference_manual p. 92) governs eleven more switches beneath it, every one of which reads
  "This is not available when the Receive Control Change is set to Off" (reference_manual p. 92).
  **Not one of the 187 sheets marks a factory position for any of them.** So the gate is recorded
  here and its shipped state is not, which `dreadbox/nymphes` and the Cascadia both show matters: a
  consumer whose controllers do nothing should look at that page first.

  **THE INSTRUMENT IS SIXTEEN PARTS AND PART N ANSWERS ON CHANNEL N.** "[SW1] Complies with Part
  Receive Switch. The MIDI Receive Channel complies with the Part number." (data_list p. 191), with
  "16 Parts (internal), Audio Input Parts (A/D*1, USB*1)" (manual p. 63) in the specification. The
  `parts` block below says so; which part a player uses belongs to their project.

  **AND THE POLYPHONY IS GIVEN TWICE AND NEVER TOTALLED.** "Polyphony AWM2: 128 (max.; stereo/mono
  waveforms) FM-X: 128 (max.)" (manual p. 63), and in troubleshooting, "the maximum polyphony (128
  for each of AWM2 and FM-X) of the MONTAGE" (manual p. 60). **Two engines, two ceilings, no sum in
  86 sheets** - the word appears exactly twice and both times gives two numbers. So no polyphony is
  recorded, which is the discipline `roland/fantom_6_7_8` applied to a maximum referred to three
  times and never given. `polyphony_shared` is recorded, because the parts do draw on pools rather
  than owning voices; that there are two pools is a thing the boolean cannot say.

  **MODE 3 IS NAMED OUTRIGHT, WHICH NO OTHER YAMAHA HERE DOES.** The `synthesizer part`'s chart gives
  "3" as the default mode in both columns and marks mode messages "X" (data_list p. 225), with the
  legend "Mode 3 : OMNI OFF, POLY" (data_list p. 225) printed beneath it. The `sequencer part`'s chart gives "X" for the
  same row, which is consistent: a recorder has no reception mode.

  **THE TWO CHARTS DISAGREE ABOUT AFTERTOUCH AND THE FIELD HOLDS ONE WORD.** The chart's After Touch block has a
  row for a key's pressure and one for a channel's, and the `synthesizer part` marks the first "X"
  in both columns and the second "O" (data_list p. 225), while the `sequencer part` marks both rows
  "O" both ways (data_list pp. 225-226). So polyphonic pressure is recorded and played back and
  **never reaches the tone generator**, and `aftertouch: channel` describes what makes a sound.
  This is `roland/fantom_6_7_8`'s situation with the answer the other way about, because there both
  kinds reached the engine. **Worth your eye if you disagree** - it is the one field here where the
  two halves of the instrument give different answers and the stronger one is not the right one.

  **THE SAME SPLIT RUNS THROUGH THREE MORE ROWS**, all in the account rather than in a field: the
  `synthesizer part` transmits no clock while the `sequencer part` transmits and receives it, and the
  `sequencer part` alone answers to song position and to local control. `clock: both` and
  `transport: both` describe the instrument, and the `synthesizer part` on its own would have given
  neither.

  **AND THE TWO SOCKETS ARE AN EITHER-OR, WHICH IS WORTH A CONSUMER KNOWING.** "MIDI IN/OUT
  Determines which physical output/input terminal(s) will be used for transmitting/receiving MIDI
  data. Settings: MIDI, USB" (reference_manual p. 169), with "The two types of terminals above
  cannot be used at the same time. Only one of them can be used to transmit/receive MIDI data"
  (reference_manual p. 169). So
  an instrument wired both ways answers over one of them, and nothing in this format can say which.

  **THE THREE MODELS DIFFER IN THEIR KEYBED AND IN NOTHING ELSE**, which is what makes one
  definition right for all three: "MONTAGE8: 88 keys, Balanced Hammer Effect Keyboard (Initial
  Touch/Aftertouch)" (manual p. 63), "MONTAGE7: 76 keys, FSX Keyboard (Initial Touch/Aftertouch)"
  (manual p. 63) and "MONTAGE6: 61 keys, FSX Keyboard (Initial Touch/Aftertouch)" (manual p. 63), over one tone generator, one
  polyphony figure, one multi-timbral capacity and one connector list. `roland/fantom_6_7_8` is the
  precedent for the name; the specification is the evidence.

  **THE FIVE SOUND CONTROLLERS AND THE TWO SOUND CONTROLLER-SHAPED ONES READ THEIR RANGE AS
  SIGNED.** Controllers 71 to 75 are each given as "v = 0: -64 - 64: 0 - 127: +63" (data_list p. 191),
  so 64 means no change and the two halves pull opposite ways. The range below is the MIDI range,
  because that is what a consumer sends; the signed reading is here because no field carries it.

  **THE SUSTAIN CONTROLLER IS CONTINUOUS OR A SWITCH DEPENDING ON THE PEDAL PLUGGED INTO IT.** It
  is received over "v = 0 - 127", but "When the sustain pedal is set to something other than 'FC3
  (Half On),' operating the sustain pedal transmits only values of 0 (off) or 127 (on)"
  (data_list p. 191). So it is recorded as continuous, which is what it answers to, and the
  half-damper caveat is about what it sends.

  **PITCH BEND IS SETTABLE OVER RPN AND THE SHIPPED DEPTH IS NOT PRINTED.** The received flow lists
  three registered parameters - "PITCH BEND SENS." (data_list p. 191), "FINE TUNING" (data_list
  p. 191) and "COARSE TUNING" (data_list p. 191) - and an RPN reset (data_list p. 191). No sheet of any document gives the factory bend range, so `semitones`
  is unrecorded and `programmable` is true.

  CHECKED ABSENCES, AND WHAT WAS SWEPT FOR EACH:

  - **NRPN: none.** The chart's registered-parameter rows are 96-97 and 100-101, which are RPN;
    controllers 98 and 99 appear in no list, in no chart row and in neither flow diagram. So the
    instrument answers to registered parameters and not to non-registered ones.
  - **Release velocity: not received.** The chart's Velocity block has a Note Off row, and it
    reads "X 9nH,v=0" (data_list p. 225) transmitted and "X" recognised (data_list p. 225); the
    data format says of a note off "VELOCITY 0vvvvvvv v: ignored Receive only" (data_list p. 191) - which is the instrument
    saying in two places that it reads the message and discards the number.
  - **Polyphonic aftertouch: not received by the tone generator**, per the chart row above. It is
    not an unread page: the `sequencer part`'s chart marks the same row O, so the X is deliberate.
  - **The note range is the whole of MIDI**, and stated twice: the chart gives 0-127 against both
    Note Number and True Voice (data_list p. 225), and the data format names the ends, "k = 0
    (C-2) - 127 (G8)" (data_list p. 191).

  NOT RECORDED: the number of presets. The specification says "Performances Approx. 1,900"
  (manual p. 63), and the bank table runs to seventy-two banks of 128 across preset, user and
  library space (data_list p. 191). **An approximation is not a count**, so `presets` is left out
  rather than turned into a figure the maker did not give.

