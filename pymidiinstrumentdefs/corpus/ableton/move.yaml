    # **NOT A SPECIFICATION IN THIS CORPUS'S SENSE**: no chart, no controller list, no channel
    # range. Cited for the ports, and saved because it is where the release notes are linked
    # from. It still puts MIDI on USB-A alone, so it is behind the release notes too.
  new_features:
    kind: web_page
    title: Move - All New Features
    landing: "https://www.ableton.com/en/move/all-new-features/"
    url: "https://www.ableton.com/en/move/all-new-features/"
    sha256: "278dc4407e404cdcbfeda68f635dfe7da8c7e97c4d64468fd8611b47a5cee2b3"
    retrieved: 2026-10-05
    paginated: false
    # Cited for one placement: **"Send and receive MIDI" (new_features) is listed under
    # "New features and devices added since release" (new_features)**, which is the single
    # clearest proof that the manual describes an earlier instrument. It dates nothing, which is why the release notes are the
    # cited source for every change.

midi:
  # **FROM THE MAKER'S OWN WORKED EXAMPLE IN THE RELEASE NOTES AND NOWHERE ELSE.** The manual
  # never writes `MIDI channel` at all. Per-track send and receive channels arrived at 1.5.0.
  channels: [1, 16]
  # Out at 1.2.0 and in at 1.5.0, both as the MIDI Sync setting. **The manual mentions clock
  # nowhere**, because at 1.1 there was none.
  clock: both
  # `transport` is deliberately unset: every entry says MIDI Sync, glossed as MIDI clock, and
  # nothing names start, stop, continue or song position as a MIDI message. **Ableton Link's
  # Start/Stop setting is not MIDI** - see the account.
  # A stated absence, not a silence: "monophonic aftertouch, MIDI CC, and MIDI mapping are not
  # supported" (manual), and no release note since adds either. This field is about what the
  # instrument answers to; the one controller it sends, CC 120, is in the account.
  control_change: none
  # `sysex` is **unset and not `false`**, which is the distinction settled on the Roland TR-8S:
  # `false` says the instrument has no system exclusive in either direction, and no
  # document here says that - none of the five mentions it at all. A silence is not a checked
  # absence, however thorough the search behind it.

voice:
  addressing: pitches
  # Received per the manual and sent from 1.3.0, so both ways - and the field holds a kind
  # rather than a direction. Only Drift and Wavetable answer it.
  aftertouch: poly
  # `velocity` is unset in both directions: the pads are velocity-sensitive and no document
  # says whether note velocity travels. `polyphony` is unset because no document states one.

parts:
  track:
    label: Track
    channel: assigned
    count: 4
    addressing: pitches
    # Notes only. **Program change is not mentioned in any of the five documents**, and
    # controls are refused instrument-wide. A track's MIDI In may instead be set to Auto, which
    # answers on every channel not explicitly assigned elsewhere.
    receives: [notes]

# **NO CONTROLS, AND THE MAKER STATES THE ABSENCE RATHER THAN LEAVING IT TO BE INFERRED.** This
# is the third kind of nothing in this corpus: Behringer advertises a map it never publishes,
# Dirtywave calls its controllers user defined, and Ableton says MIDI CC is not supported.
controls: {}
