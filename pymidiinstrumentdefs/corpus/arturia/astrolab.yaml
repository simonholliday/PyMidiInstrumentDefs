    landing: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    url: "https://www.arturia.com/api/content/resources/release_notes?resource_id=52275"
    sha256: 00c0f957d66e031950152cb3186da98108c8a67ab2b9697db4e5400f15a8300d
    retrieved: 2026-10-10
    paginated: false
    # NOT ON ANY PAGE: Arturia shows these only when the version number beside a firmware
    # download is clicked, and serves them as JSON from its own API. The digest is of the text
    # rendering, which `Notes/4073_render_release_notes.py` rebuilds from the saved JSON byte
    # for byte. Cumulative from "First release of AstroLab" (release_notes) at V 1.0.2 to
    # V 2.0.0, and the only document here that says anything about program change. **Its V 1.7.0
    # entry is worded differently from the 1.7.0 notes fetched on 2026-10-03**, which are another
    # resource, id 27493: `Integration of Pigments 7` there, and "Added compatibility for
    # Pigments 7" (release_notes) with a MiniFreak V4 line here.
  release_notes_88:
    kind: release_notes
    title: AstroLab 88 firmware release notes, through 2.0.0
    edition: "2.0.0"
    dated: 2026-10-01
    landing: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    url: "https://www.arturia.com/api/content/resources/release_notes?resource_id=52276"
    sha256: 453b438e26c842e99f6757c9cc6c4721fa0315ea2a1bb6592bfde4f4f065ea1e
    retrieved: 2026-10-10
    paginated: false
    # FETCHED TO PROVE THE TWO MODELS THIS COVERS ARE ON ONE FIRMWARE LINE, and they are: the
    # 88's list begins at V 1.5.0, the firmware the 61 was already running, and its 1.7.0 and
    # 2.0.0 entries are the 61's word for word. Its 1.6.0 entry is the 61's less its Improvements
