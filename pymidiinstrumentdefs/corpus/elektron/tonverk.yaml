    url: "https://www.elektron.se/wp-content/uploads/2026/09/Tonverk-User-Manual_ENG_OS1.4.1_260923.pdf"
    sha256: 0bcb08a1ffdd4ee3d603c2ddf454e082c47b44451b07d905029f2deba5292045
    retrieved: 2026-10-05
    # 130 pages, counted with pypdf and with PyMuPDF, which agree. Every page prints its own
    # number and it is the file's page index - asserted on all five appendix pages - so a
    # citation needs no offset. The folio sits at y 802 and the appendix's tables print bare
    # numbers as high as y 746, which is how the one is kept out of the other.
    # **The edition above is the document's own**, from the last line of the copyright notice
    # at the foot of p. 13. Its cover reads `Tonverk / User Manual` and nothing else. See `model`.
    # Appendix D, pp. 120-124, is the source of every number below but four. Everything else is
    # cited for the structure, the settings, the four absences, the document's own edition, and
    # four controller numbers its text prints outside the appendix: 1 and 2, which are controls
    # below, and 0 and 32, which a track running the MIDI machine sends and which are not.
    page_offset: 0
  download_page:
