midi:
  # NO CHANNEL RANGE IS RECORDED, AND THE ABSENCE IS CHECKED. A channel is chosen per Layer
  # (manual p. 200) and on output as well - "Chan 1 / 2: here you can determine the MIDI channel
  # for Layer 1 and 2, on which MIDI data is sent out" (manual p. 202) - but **no document says
  # which channels are on offer**. 1 to 16 would be the obvious guess and this corpus does not
  # guess.
  #
  # RECEIVED AND NOT SENT, and said in one sentence from the other side: "Internal means that
  # Iridium doesn’t react to incoming MIDI Clock, nor does it send MIDI Clock" (manual p. 202) -
  # the maker's own curly apostrophe - against "MIDI Clock means that Iridium automatically syncs
  # to incoming MIDI Clock if it is sent by an external device" (manual p. 202). The three sync
  # sources are Internal, MIDI Clock and CV Clock, and **none of them is a sending mode**, so the
  # "nor does it send" describes Internal rather than implying some other setting does.
  clock: receives
  program_change:
    # STATED ONCE, ON A WEB PAGE, UNDER A TITLE THAT DENIES IT - see the source account. "This
    # device uses only to the entries in the Favorites lis when Prog CH messages are used"
    # (product_page), the maker's own spelling.
    receives: true
    # AND IT SENDS ONE ON DEMAND, from a Macro button: "Send MIDI Prog Sends a definable MIDI
    # program change from 0 to 127" (manual p. 194). That is a performer firing a chosen message
    # rather than the instrument announcing a patch change, but it is sending program change and
    # the field has no finer word.
    sends: true
  # LEARNED, WHICH IS NEITHER A MAP NOR AN ABSENCE. "Set: opens a page allowing you to link a
  # desired MIDI CC connection to any panel parameter dial, potentio- meter, or button" (manual
  # p. 204), over "CC01 to CC118 (or Off)" (manual p. 187). The fifteen controls below are the
  # ones the maker fixes; the rest are the player's.
  control_change: learned
  # NONE **RECEIVED**, AND IT SENDS THEM: "Keep in mind, that the Iridium doesn´t react on
  # incoming NRPN MIDI data" (manual p. 202), in the same bullet as "Send NRPN: if set to On, the
  # physical panel elements send out MIDI NRPN data" (manual p. 202). This field records what the
  # instrument answers to, which is nothing; that it transmits NRPN has no field and is in the
  # source account.
  nrpn: none
  # MPE: the voices are spread across channels, one note to a channel, rather than sounding on
  # one. Everything else about it is in the comments below, because a boolean cannot carry any of
  # it - the three axes, the automatic configuration from MCM messages, and the second zone.
  per_voice_channels: true

voice:
  addressing: pitches
  # NO NOTE RANGE IS RECORDED, AND THE REASON IS WORTH THE SPACE. The sentence that looked like
  # one is about a parameter's limits rather than the engine's: "Here you determine the keyboard
  # range for the corresponding layer when in Split mode. The lowest setting is 0 (note C-2); the
  # highest is 60 (note C8)" (manual p. 171) - the bounds of a **split point**, not of what the
  # instrument plays. It is also misprinted; see the source account. **No document anywhere gives
  # the span of notes this engine sounds**, and the keybed's 49 keys are a panel rather than a
  # range.
  # "Keep in mind that Iridium of- fers an overall polyphony of 16 voices" (manual p. 171), the
  # maker's own line break.
  polyphony: 16
  # ONE POOL ACROSS THE TWO LAYERS, SAID TWICE: "Keep in mind that both sound layers will share
  # the maximum polyphony of 16 voices" (manual p. 29), and the arithmetic to go with it - "If you
  # set Layer 1 to 9 voices, Layer 2 automatically switches to 7 voices, and vice versa" (manual
  # p. 171).
  polyphony_shared: true
  velocity:
    # The keybed is velocity sensitive and velocity is in the modulation-source table; nothing
    # says anything about release velocity, so `note_off` is left out.
    note_on: both
  # POLYPHONIC, AND THE MANUAL SPENDS A PAGE ON IT: the Keyboard has "49 light-weighted sensitive
  # keys with polyphonic" aftertouch (manual p. 20), and the distinction is drawn explicitly -
  # "Polyphonic aftertouch, that is transmitted individually" (manual p. 21) against monophonic
  # channel aftertouch. The modulation-source table carries "After Touch" described as
  # "Polyphonic Keyboard Pressure Data". **The MPE Z axis is channel aftertouch**, which is a
  # different message from the keybed's own; both are answered to.
  aftertouch: poly
  pitch_bend:
    # PER OSCILLATOR, WHICH IS UNUSUAL: "PB Range Osc 1, 2, or 3" (manual p. 38), "Determines the
    # intensity of the pitch wheel in semitones for the selected oscillator from -24 to +24"
    # (manual p. 38), with "Set Default: sets PB Range to its default value +12" (manual p. 38).
    # Negative values invert the wheel. Twelve is the default of each of the three.
    semitones: 12
    programmable: true

parts:
  layer:
    label: Layer
    # The instrument is "duo-timbral" (product_page) and every page that mentions a Layer mentions
    # two.
    count: 2
    # A CHANNEL EACH, CHOSEN BY THE PLAYER, IN BOTH DIRECTIONS: "Layer 1/2 Input Channel: tap on
    # the corresponding button to open a pop-up menu. Here you can select the desired MIDI channel
    # on which Layer 1 and Layer 2 reacts" (manual p. 200), and "Chan 1 / 2: here you can
    # determine the MIDI channel for Layer 1 and 2, on which MIDI data is sent out" (manual
    # p. 202). Neither derives from the other, so there is no offset.
    channel: assigned
    addressing: pitches
    # NOTES AND CONTROLLERS. A Layer is what a channel addresses and what the mod matrix's MIDI
    # sources feed. **Program change is not a Layer's**: what it selects is a Favorites entry,
    # which is a whole patch.
    receives: [notes, controls]

groups:
  controllers: Controllers
  pedals: Pedals
  modulation: Modulation Sources
  mpe: MPE

