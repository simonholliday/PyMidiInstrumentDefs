    sha256: f89b9bcb645b8ad26ef8c478356b913e25adce1185152e6ac530adb0b2028c59
    retrieved: 2026-10-12
    # 20 sheets, landscape, with no page numbers: a page cited is a sheet. The title is put together
    # here: the manual's first sheet is a picture reading STEAMPIPE and USER MANUAL, in no text
    # layer, and its last reads `User Manual V3, July, 2025`. The date is the day the file was made,
    # by its own metadata, which is also the date the product page gives it. **Many sheets carry
    # pictures of the instrument's screen, whose words and numbers are in no text layer**: those
    # cited here were read by eye, twice.
    page_offset: 0
  product_page:
    kind: product_page
    title: "Steampipe - Erica Synths"
    landing: "https://www.ericasynths.lv/steampipe-3153/"
    url: "https://www.ericasynths.lv/steampipe-3153/"
    sha256: e7d0b09c3dc86556a5f3b7e17b130253a3fe91a3d0b0a282248b12dc1135a8bd
    retrieved: 2026-10-12
    paginated: false
    # Cited for what Erica Synths serves for the Steampipe, one manual and two firmware files
    # among five downloads; for what the 1.1 firmware is said to add; and for its one answer
    # about MPE. The digest is of the page's visible text; the markup as served is kept beside it.

midi:
  # "Synchronizes the LFO to the MIDI clock." (manual p. 9). No sentence has one sent.
  clock: receives
  # A mode of the MIDI menu (manual p. 15).
  mpe: receives
  # A READING of the product page's answer, eight voices and eight MPE channels (product_page).
  per_voice_channels: true
  # NOT RECORDED, AND NOT DECLARED ABSENT, the controllers: see the comment above the definition.
  # NOT RECORDED EITHER: the channels, `mode`, transport, program change, system exclusive and
  # NRPN.

voice:
  addressing: pitches
  # "It is an 8-voice polyphonic synthesizer" (manual p. 3), with a voice mode that can make it one
  # voice at a time or all voices on one note (manual p. 8).
  polyphony: 8
  voicing_modes: [1, 8]
  velocity:
    # Among the messages the manual calls hard-wired (manual p. 12), and an envelope's level can
    # be scaled by it (manual p. 7).
    note_on: received
  pitch_bend:
    # Its range is set on the instrument's screen, in the MIDI device menu (manual p. 13). No
    # sentence says in terms that bend is received.
    programmable: true
  # NOT RECORDED: aftertouch. A row `Mono-P:` in a picture (manual p. 15) is read here as channel
  # pressure; no sentence says so. Nor a note range.
