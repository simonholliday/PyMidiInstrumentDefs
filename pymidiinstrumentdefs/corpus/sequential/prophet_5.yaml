    # are 80 sheets and each carries 65 lines mentioning MIDI, and a line-by-line comparison of
    # those 130 lines finds them identical but for the model name and where the lines wrap.
    page_offset: 11

midi:
  # "MIDI Channel: All, 1...16 - Selects which MIDI channel to send and receive data, 1 to 16.
  # All receives on all 16 channels" (p. 1). The All setting is in the prose above rather than
  # in a number, because this field holds a span.
  channels: [1, 16]
  # THE MAKER'S OWN WORD. "NRPNs are the preferred method of parameter transmission, since they
  # cover the complete range of all parameters, while CCs are limited to a range of 128" (p. 1).
  # 71 controls carry an NRPN, 50 of them beside a controller number; see the source account.
  nrpn: preferred
  program_change:
    # "Program change, 0-39" received (p. 2); "Program change" transmitted (p. 3).
    receives: true
    sends: true
    # "The Prophet-5 contains a total of 400 programs" (p. 6). A single program change reaches
    # forty of them and bank select picks the rest - see the source account, including what the
    # implementation's own row contradicts about it.
    presets: 400
  # Four layouts given byte by byte on printed pp. 10 to 13, and a global that chooses the port.
  sysex: true
  # NOT RECORDED: clock and transport. Neither word appears anywhere in the implementation, which
  # is silence rather than a checked absence. This instrument has no sequencer.

voice:
  # "The Prophet-5 is a five-voice, polyphonic analog synthesizer with analog voltage-controlled
  # oscillators, filters, and amplifiers" (p. 1). INSERTING A PLUG IN THE GATE IN JACK TAKES IT
  # DOWN TO FOUR: "Whenever a ¼ inch connector is inserted into the rear-panel gate in jack on
  # the Prophet-5, its keyboard polyphony is reduced to 4 voices" (p. 3), and no field here holds
  # a polyphony that depends on what is plugged in.
  polyphony: 5
  velocity:
    # "Note On. Note off if vvvvvvv = 0" is received (p. 2). What the keyboard produces is shaped
    # by a global curve, "Vel Response: 0-6" (p. 16).
    note_on: received
    # "Note Off. Velocity is ignored" (p. 2), and what it sends is a literal zero (p. 3).
    note_off: false
  # IT RECEIVES POLYPHONIC KEY PRESSURE AND ITS KEYBOARD SENDS CHANNEL PRESSURE. This field says
  # what it answers to; the source account has both halves.
  aftertouch: poly
  pitch_bend:
    # "A setting of 1 equals a semitone. A setting of 12 equals an octave" (p. 37), chosen per
    # program. Controller 70 counts the same twelve values from 0 to 11.
    semitones: 12
    programmable: true

groups:
  # The maker's own leading words, which is all the implementation gives: it prints no heading
  # over any of its 59 rows. Seventeen rows that begin with none of them are placed by the User's
  # Guide's own chapters, one row at a time, in `Notes/4460_write_controls.py`.
  osc_a: OSC A
  osc_b: OSC B
  poly_mod: POLY MOD
  lfo: LFO
  filter: FILTER
  envelope: ENVELOPE
  unison: UNISON
  pressure: PRESSURE
  performance: Performance
  global: Global
  # The NRPN table's numbers from 4096, which the implementation promises as a table "for global
  # parameters" (implementation p. 6) and prints as the end of one table.
  global_parameters: Global parameters

controls:

  # OSC A ───────────────────────────────────────────────────
  osc_a_frequency:                     {label: OSC A FREQUENCY, cc: 3, nrpn: 0, range: [0, 120], group: osc_a}
  osc_a_saw_on_ff:                     {label: OSC A SAW ON/FF, cc: 15, nrpn: 3, range: [0, 1], group: osc_a}
  osc_a_square_on_off:                 {label: OSC A SQUARE ON/OFF, cc: 20, nrpn: 4, range: [0, 1], group: osc_a}
  osc_a_pulse_width:                   {label: OSC A PULSE WIDTH, cc: 21, nrpn: 8, range: [0, 120], group: osc_a}
  osc_sync_on_off:                     {label: OSC SYNC ON/OFF, cc: 23, nrpn: 10, range: [0, 1], group: osc_a}
  osc_a_level:                         {label: OSC A LEVEL, cc: 27, nrpn: 14, range: [0, 120], group: osc_a}

  # OSC B ───────────────────────────────────────────────────
  osc_b_frequency:                     {label: OSC B FREQUENCY, cc: 9, nrpn: 1, range: [0, 120], group: osc_b}
  osc_b_fine_tune:                     {label: OSC B FINE TUNE, cc: 14, nrpn: 2, group: osc_b}
  osc_b_pulse_width:                   {label: OSC B PULSE WIDTH, cc: 22, nrpn: 9, range: [0, 120], group: osc_b}
  osc_b_low_freq_on_off:               {label: OSC B LOW FREQ ON/OFF, cc: 24, nrpn: 11, range: [0, 1], group: osc_b}
  osc_b_keyboard_on_off:               {label: OSC B KEYBOARD ON/OFF, cc: 25, nrpn: 12, range: [0, 1], group: osc_b}
  osc_b_level:                         {label: OSC B LEVEL, cc: 28, nrpn: 15, range: [0, 120], group: osc_b}
  osc_b_saw_on_off:                    {label: OSC B SAW ON/OFF, cc: 30, nrpn: 5, range: [0, 1], group: osc_b}
  osc_b_tri_on_off:                    {label: OSC B TRI ON/OFF, cc: 52, nrpn: 6, range: [0, 1], group: osc_b}
  osc_b_square_on_off:                 {label: OSC B SQUARE ON/OFF, cc: 116, nrpn: 7, range: [0, 1], group: osc_b}

  # POLY MOD ────────────────────────────────────────────────
  poly_mod_filt_env_amount:            {label: POLY MOD FILT ENV AMOUNT, cc: 59, nrpn: 32, group: poly_mod}
  poly_mod_osc_b_amount:               {label: POLY MOD OSC B AMOUNT, cc: 60, nrpn: 33, range: [0, 120], group: poly_mod}
  poly_mod_freq_a_on_off:              {label: POLY MOD FREQ A ON/OFF, cc: 61, nrpn: 34, range: [0, 1], group: poly_mod}
  poly_mod_pw_on_off:                  {label: POLY MOD PW ON/OFF, cc: 62, nrpn: 35, range: [0, 1], group: poly_mod}
  poly_mod_filter_on_off:              {label: POLY MOD FILTER ON/OFF, cc: 63, nrpn: 36, range: [0, 1], group: poly_mod}

  # LFO ─────────────────────────────────────────────────────
  lfo_frequency:                       {label: LFO FREQUENCY, cc: 46, nrpn: 21, range: [0, 120], group: lfo}
  lfo_initial_amount:                  {label: LFO INITIAL AMOUNT, cc: 47, nrpn: 22, range: [0, 120], group: lfo}
  lfo_source_mix:                      {label: LFO SOURCE MIX, cc: 53, nrpn: 26, range: [0, 120], group: lfo}
  lfo_freq_a_on_off:                   {label: LFO FREQ A ON/OFF, cc: 54, nrpn: 27, range: [0, 1], group: lfo}
