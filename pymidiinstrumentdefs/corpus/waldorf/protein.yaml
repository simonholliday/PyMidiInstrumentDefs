    sha256: db4fff259aa33c936fa507de9af951898695d02bb2beac097a723e442b33fc48
    retrieved: 2026-10-06
    # **71 sheets, of which six are a glossary of general MIDI and synthesis terms** - sheets 62
    # to 67 - and this instrument's own MIDI is on sheets 51 to 53 and 55 to 57. The folio is the
    # sheet number, printed at the foot of each page as `Protein Manual <n>`, so no offset.
    # **ITS TEXT LAYER PUTS A LOW LINE WHERE THE PAGE PRINTS AN `f` LIGATURE**, 226 times: it
    # returns `_ilter` for `filter`, `shuf_led` for `shuffled` and `over_low` for `overflow`, the
    # stand-in followed only ever by `i` or `l`. Made in Pages and exported by Quartz, which is
    # where that comes from. **So a search of this document for `defines` or `specifies` or
    # `firmware` finds nothing**, and `tools/check_quotations.py` now reads a low line back as an
    # `f` so that the words a reader sees on the page are the words a definition can quote.
    # Its own body says `Rev. 2, January 2026` (manual p. 3) while the file was made on 8 September 2026,
    # so the revision is the document's and the date on it is not the file's. Served inside a
    # `.zip` beside the German edition.
