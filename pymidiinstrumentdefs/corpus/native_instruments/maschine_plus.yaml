    kind: manual
    title: MASCHINE+ Manual
    dated: 2022-05-13
    landing: "https://www.native-instruments.com/pages/maschine-downloads"
    url: "https://docs.native-instruments.com/pdf-guides/maschine/MASCHINE_Plus_Manual_English_13_05_2022.pdf"
    sha256: 6bdd6d24586dcfac0598deb9ee6bb9356965062a29011538dde7421a0c25e654
    retrieved: 2026-10-04
