  vcf_envelope_amount:                  {label: VCF Envelope Amount, cc: 45, nrpn: 1069, nrpn_range: [0, 16383]}
  vcf_lfo_1_amount:                     {label: VCF LFO 1 Amount, cc: 46, nrpn: 1070, nrpn_range: [0, 16383]}
  vcf_dds_2_amount:                     {label: VCF DDS 2 Amount, cc: 47, nrpn: 1071, nrpn_range: [0, 16383]}
  vca_dynamics:                         {label: VCA Dynamics, cc: 48, values: {"off": 0, "n1_2": 43, "on": 85}}
  vca_envelope_mode:                    {label: VCA Envelope Mode, cc: 49, values: {"env_2": 0, "fixed_env_1": 43, "fixed_env_2": 85}}
  envelope_1_mode:                      {label: Envelope 1 Mode, cc: 50, values: {"normal": 0, "inverted": 43, "loop": 85}}
  envelope_1_keytrack:                  {label: Envelope 1 Keytrack, cc: 51, values: {"off": 0, "n1_2": 43, "on": 85}}
