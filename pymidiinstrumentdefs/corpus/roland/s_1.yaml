# TWO TABLES, AND NEITHER WOULD DO ON ITS OWN. The S-1's MIDI is at the back of its owner's manual
# in two pieces: an implementation chart on p. 73 whose Control Change rows give **ranges and no
# names at all** - `12-31`, `71-76`, `102-107` - and a control change list on pp. 73 to 75 that
# gives a name for every number and says nothing about direction. **The chart has the directions
# and the list has the names**, and the thirteen ranges cover exactly the fifty-four numbers the
# list has, which is the one cross-check the manual affords.
#
# SIX CONTROLS ARE RECEIVED AND NEVER SENT, and the chart is where that is: six of its thirteen
# Control Change rows are x transmitted and o received, and the numbers in them - 1, 10, 11, 64, 65
# and 77 - are the only ones below marked `receives`. They are the modulation wheel, pan, the
# expression and damper pedals, portamento on-off and the transpose switch.
#
# **TWO CONTROLS HAVE THE SAME NAME AND THE MAKER TELLS THEM APART WITH A DRAWING.** Controllers 19
# and 20 are both an OSC LEVEL for an OSCILLATOR knob (manual p. 74), with a waveform symbol in
# place of the knob's name that no text extraction returns - it is a small bitmap rather than a
# character. Read off the page, **19's is a pulse wave and 20's is a sawtooth**, so they are the
# levels of the two oscillator waveforms. The number goes on the end of each name here, and a
# reader should know that what distinguishes them in the maker's own document is something a
# machine cannot read.
#
# IT ANSWERS ON TWO CHANNELS AT ONCE, AND BOTH ARE SETTABLE. Its chart's Basic Channel default
# cell names two of them, 3 for the synth and 16 for program change, and wraps across two lines in
# doing so (manual p. 73): one channel for notes and controllers, another for the program changes
# that change patterns. The manual has a menu entry for each - "CH (MIDI Channel)" (manual p. 68)
# and "Pc.Ch (Program Change Channel)" (manual p. 68), both 1 to 16. The two are the parts below.

definition: 1

model:
  manufacturer: Roland
  name: S-1
  # THE CHART HEADS ITSELF "AIRA Compact" (manual p. 73), which is Roland's name for the family
  # this belongs to rather than for this instrument. **This file is the S-1 and no sibling**, and
  # the name is worth a caution of its own: a Stylophone S-1 exists and is a different instrument
  # from a different maker.
  # The manual is "Version 1.02" (manual p. 73) and its chart is dated "Apr. 18, 2023" (manual
  # p. 73). **No firmware number appears anywhere in it** - not on the cover, not in the menus and
  # not in the specification - and Roland publishes no release notes for this instrument, so there
  # is none to record. What the numbers below match is the manual of April 2023.

source: >-
  S-1 Owner's Manual, version 1.02, 75 pages: **every number below is on one of its last three**.
  Its MIDI implementation chart is p. 73 and its control change list runs from the foot of that
  page to the end of p. 75. The rest is cited for the two channels, the patterns, the polyphony and
  the connectors. And Roland's owner's manuals page for the S-1, for what is published.

  ROLAND PUBLISHES THIS MANUAL AS WEB PAGES AND AS A PDF, in nine languages each, and **they are
  the same document**: the listing offers "S-1 Owner's Manual (Version 1.02) [HTML]" (downloads)
  and "S-1 Owner's Manual (Version 1.02) [PDF]" (downloads) side by side, both at version
  1.02, and the PDF is what this definition reads because it is the one a machine can check.

  THE CHART'S MARKS ARE LETTERS AND NOT DRAWINGS, which was the first thing checked - another
  maker's chart in this library draws every one of its yes and no marks as a vector and returns
  none of them to a machine. Roland's are **lower-case** `o` and `x`, where most makers use
  capitals, so a check that looked for the capitals would have found nothing and concluded the
  same thing wrongly.

  **TRYING THE NUMBERS FOUND AN UNLISTED EDITION, AND IT IS THE SAME DOCUMENT.** The PDF is served
  as `S-1_eng02_W.pdf`; `S-1_eng01_W.pdf` is live and unlisted beside it, at 4,322,959 bytes
  against 2,835,392, and `eng00` and `eng03` to `eng05` all answer 403. The two were built six days
  apart in May 2023 and **are identical in text on 72 of their 75 sheets**: what differs is a
  five-word phrase about charging temperature that moves from one page to the next, and the edition
  number on the last page. Both say "Version 1.02" (manual p. 73) inside. So this is a re-export
  rather than a correction, and nothing in the definition changes either way. The method found a
  missing edition for another Roland in this library and found nothing here; both are worth having.

  THE TWO TABLES AGREE ABOUT WHICH NUMBERS EXIST, which is asserted rather than assumed. The
  chart's thirteen Control Change rows carry ranges - 1, 3, 5, 10, 11, 12-31, 64, 65, 71-76, 77,
  78-83, 85-87, 89-93 and 102-107 - and expanding them gives exactly the fifty-four numbers the
  list names, with nothing in one and not the other.

  AND FIVE OF THE LIST'S EXPLANATIONS HAVE A HOLE IN THEM. Controllers 15, 19, 20, 102 and 107 each
  have an empty bracket where the manual draws a waveform - a small bitmap, not a character - that
  no text extraction returns. Read off the page, the pulse wave is in 15, 19 and 102 and the
  sawtooth in 20 and 107. For three of them the symbol is inside the panel route and costs nothing;
  **for 19 and 20 it is the only thing that tells two identically-named controls apart**, and it
  is what says 19 is the pulse oscillator's level and 20 the sawtooth's.

  THE LIST ENDS ON P. 74 AND THE RUNNING HEAD SAYS OTHERWISE. Printed p. 75 carries the heading
  "MIDI implementation chart" (manual p. 75) and no table at all: it is the colophon. A reader
  turning to the last page for the last of the controllers finds nothing and might conclude the
  list was truncated.

  THE CHART HAS NO LEGEND. The block that normally sits under a chart of this shape - the one that
  says what Mode 1 to Mode 4 are and that `o` means yes and `x` means no - is absent, so this
  chart's marks are never defined anywhere in the manual. They are read here as every other chart
  in this library reads them.

  WHAT IS ABSENT, from the chart's own rows. System exclusive is x in both columns, and so are song
  position, song select, tune request, and omni, mono and poly mode. Continue is x in both columns
  where start and stop are o in both, so **it answers to a transport it cannot be told to resume**.
  Aftertouch is x in all four of its cells. Pitch bend is x transmitted and o received. And the
  words NRPN, RPN and Registered Parameter appear nowhere in the manual's 75 pages.

