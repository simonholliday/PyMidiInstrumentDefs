  # ── DJ MODE REASSIGNS THE FIRST THREE CHANNELS, which is why these are unparted: channel 1 is
  # one deck, channel 2 the other and channel 3 the pattern sequencer (p. 169), none of which is
  # the bus that channel carries otherwise. **A part here would say the wrong thing in the other
  # mode**, so the channels are in this comment and not in the structure above.
  #
  # The volume slider and the crossfade are the only two that travel both ways in DJ mode.
  volume_slider:                 {label: volume slider, cc: 7}
  # "X-FADE (CH1: CH2 = 127:0-0:127)" (p. 169) - nought is one deck full up and 127 the other,
  # which is a crossfade and not a level.
  x_fade:                        {label: X-FADE, cc: 8}

  # **THE EIGHT BUTTONS DJ MODE SENDS AND DOES NOT ANSWER TO**: "o *8" transmitted against "x"
  # recognised (p. 168), which is the only row in this chart that travels one way and outwards.
  # Six of them are momentary - "0: release the button, 127: press the button" (p. 169) - and
  # two are states.
  play_pause:                    {label: play/pause button, cc: 20, direction: transmits,
    values: {"pause": 0, "play": 127}}
  cue_point:                     {label: cue button, cc: 21, direction: transmits,
    values: {"released": 0, "pressed": 127}}
  sync:                          {label: SYNC button, cc: 22, direction: transmits,
    values: {"off": 0, "on": 127}}
  cue:                           {label: CUE button, cc: 23, direction: transmits,
    values: {"off": 0, "on": 127}}
  bend_up:                       {label: BEND+ button, cc: 24, direction: transmits,
    values: {"released": 0, "pressed": 127}}
  bend_down:                     {label: BEND- button, cc: 25, direction: transmits,
    values: {"released": 0, "pressed": 127}}
  bpm_up:                        {label: BPM+ button, cc: 26, direction: transmits,
    values: {"released": 0, "pressed": 127}}
  bpm_down:                      {label: BPM- button, cc: 27, direction: transmits,
    values: {"released": 0, "pressed": 127}}

  # ── THE SEVEN THE CHART'S ROWS DO NOT CONTAIN, from the Looper mode table (pp. 169-170),
  # which hangs off a footnote cited from rows about other numbers. **Nothing states their
  # direction**: each one's printed effect is something done to this instrument on receiving a
  # value, so they are recorded as received, and that is a reading rather than a cell. On
  # channel 1, which in Looper mode is neither a bus nor a deck.
  #
  # **AND ONE OF THEM DELETES A RECORDING ON A VALUE OF 127.**
  looper_exit:                   {label: EXIT button, cc: 85, direction: receives,
    values: {"stop_all_samples": 127}}
  looper_pitch_speed:            {label: PITCH/SPEED button, cc: 86, direction: receives,
    values: {"reset_tempo": 127}}
  looper_delete:                 {label: DEL button, cc: 87, direction: receives,
    values: {"delete_sampled_content": 127}}
  looper_record:                 {label: REC button, cc: 88, direction: receives,
    values: {"stop_sampling": 0, "start_sampling": 127}}
  looper_resample:               {label: RESAMPLE button, cc: 89, direction: receives,
    values: {"overdub": 127}}
  # "Adjusts the value of BPM/PLAY-RATE parameters" (p. 170) - the one continuous control here.
  looper_ctrl_3:                 {label: CTRL 3 knob, cc: 90, direction: receives}
  # "Undoes (UNDO) the data you just input (recorded)" (p. 170) at 127 and "Cancels the undo
  # action (REDO)" (p. 170) at 0, which is the only control in this corpus where nought is an
  # action rather than an off state.
  looper_undo:                   {label: SHIFT + PATTERN SELECT, cc: 91, direction: receives,
    values: {"redo": 0, "undo": 127}}
