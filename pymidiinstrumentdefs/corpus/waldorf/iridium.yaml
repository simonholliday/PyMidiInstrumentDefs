  # CONTROLLERS ---------------------------------------------
  wheel:                 {label: Wheel, cc: 1, direction: receives, group: controllers}
  breath_control:        {label: Breath Control, cc: 2, direction: receives, group: controllers}

  # PEDALS --------------------------------------------------
  expression:            {label: Expression, cc: 11, direction: receives, group: pedals}
  pedal:                 {label: Pedal, cc: 64, direction: receives, group: pedals}

  # MODULATION SOURCES --------------------------------------
  cc_22:                 {label: CC 22, cc: 22, direction: receives, group: modulation}
  cc_23:                 {label: CC 23, cc: 23, direction: receives, group: modulation}
  cc_24:                 {label: CC 24, cc: 24, direction: receives, group: modulation}
  cc_25:                 {label: CC 25, cc: 25, direction: receives, group: modulation}
  cc_26:                 {label: CC 26, cc: 26, direction: receives, group: modulation}
  cc_27:                 {label: CC 27, cc: 27, direction: receives, group: modulation}
  cc_28:                 {label: CC 28, cc: 28, direction: receives, group: modulation}
  cc_29:                 {label: CC 29, cc: 29, direction: receives, group: modulation}
  cc_30:                 {label: CC 30, cc: 30, direction: receives, group: modulation}
  cc_31:                 {label: CC 31, cc: 31, direction: receives, group: modulation}

  # MPE -----------------------------------------------------
  mpe_y_axis:            {label: MPE Y Axis, cc: 74, direction: receives, group: mpe}
