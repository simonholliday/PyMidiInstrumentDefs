    # The earlier edition, Version 1.00, which Roland's page does not list. Cited for what the
    # current one gained and for nothing else: **no number below rests on it.** It is held
    # because what a maker added to a chart is evidence the current edition alone does not give.
  reference:
    kind: reference
    title: MC-101 Reference Manual
    edition: eng01
    landing: "https://www.roland.com/global/support/by_product/mc-101/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/MC-101_Reference_eng01_W.pdf"
