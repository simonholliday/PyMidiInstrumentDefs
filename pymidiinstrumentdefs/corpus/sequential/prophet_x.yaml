  osc_1_glide_amount:                     {label: Osc 1 Glide Amount, cc: 56, group: oscillators}
  osc_2_glide_amount:                     {label: Osc 2 Glide Amount, cc: 57, group: oscillators}
  arpeggiator_on_off:                     {label: Arpeggiator On/Off, cc: 58, group: arpeggiator}
  arpeggiator_mode:                       {label: Arpeggiator Mode, cc: 59, group: arpeggiator}
  arpeggiator_range:                      {label: Arpeggiator Range, cc: 60, group: arpeggiator}
  arpeggiator_relatch:                    {label: Arpeggiator Relatch, cc: 61, group: arpeggiator}
  # Printed twice, `Clock Divide` both times (guide p. 144).
  clock_divide:                           {label: Clock Divide, cc: 62, group: clock}
  arpeggiator_repeats:                    {label: Arpeggiator Repeats, cc: 63, group: arpeggiator}
