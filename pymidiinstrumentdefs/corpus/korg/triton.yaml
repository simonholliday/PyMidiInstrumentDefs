midi:
  # "MIDI Channel (Global MIDI Channel) [1…16]" (parameter_guide p. 117), and each timbre of a
  # combination and track of a song takes one of its own - see the part below. The chart's Basic
  # Channel row is 1 to 16 both ways and remarked `Memorized` (basic_guide p. 137).
  channels: [1, 16]
  # From the chart's Mode row, whose received cell reads 3 under `Memorized`, with the legend "Mode
  # 3: OMNI OFF, POLY" (basic_guide p. 137). The four mode messages are received and each is glossed
  # "Omni Mode Off ( as All Notes Off )" (implementation) or the like, so the TRITON drops its notes
  # and stays in mode 3; the transmitted list carries no mode message.
  mode: 3
  # Sent "( Always in Prog/Combi/Seq/Song Play mode )" (implementation) when "MIDI Clock in Global
  # mode is Internal." (implementation), and received when it "is External MIDI or External PCI/F."
  # (implementation). So both, and which one depends on a setting rather than on the sockets.
  clock: both
  # Start, Continue and Stop are in both lists (implementation sections 1-3 and 2-3), sent from the
  # sequencer and received for "Seq Start & Arpeggiator Control" (implementation). Song position and
  # song select are received only "when in Sequencer mode (External Clock)" (implementation), and
  # "In Song Play mode, the TRITON will always synchronize to its own internal clock regardless of
  # this setting." (parameter_guide p. 118).
  # FROM SYSTEM 2.5 A FILTER STANDS IN FRONT OF THE RECEIVING SIDE, AND IT STARTS CLOSED. With the
  # TRITON slaved to external clock and `Receive Ext. Realtime Commands` unchecked, "MIDI common
  # messages and realtime messages (song position pointer, start, continue, stop) from the MIDI IN
  # connector or To Host connector will not be received." (update_guide p. 11), though "(Song Select
  # messages will continue to be received.)" (update_guide p. 11). Data from an older system loaded
  # into 2.5 sets it so: "This parameter will be set to the default value (unchecked)."
  # (update_guide p. 13). So a player whose TRITON follows clock and ignores start has that box to
  # check.
  transport: both
  program_change:
    # Sent as "Program Change ( Prog/Combi change )" (implementation) and received "( for Prog/Combi
    # change )" (implementation), with Bank Select MSB and LSB beside it both ways, though "Simply
    # receiving a Bank Select message will not cause the program or bank to change."
    # (basic_guide p. 114). Nothing is changed on the edit pages (basic_guide p. 115), and "It is
    # not possible to use MIDI program changes to select a program on a Timbre whose 'Status' is
    # other than INT." (basic_guide p. 52). The bank layout is a setting, KORG or GM(2), and "With
    # the factory settings, this will be GM(2)." (basic_guide p. 114).
    receives: true
    sends: true
    # NOT RECORDED, the preset count: see the account.
  # THE ARPEGGIATOR'S THREE BOTH WAYS AND EIGHT MORE RECEIVED, all listed as controls below. The
  # chart circles 98 and 99 both ways with "LSB,MSB=02,00: Arpeggiator ON/OFF" (basic_guide p. 137)
  # among its notes.
  nrpn: supported
  # Sections 1-4, 2-4 and 3 of the implementation, and most of its 3,876 lines. The filter that
  # passes it is normally off: "Normally you will leave this unchecked." (parameter_guide p. 119).
  sysex: true

voice:
  addressing: pitches
  # From the chart's True Voice row, received 0 to 127 against the Note Number row's 0 to 127
  # (basic_guide p. 137). The keys reach less, by keyboard - see the model block - and the chart
  # reconciles the two: "Sequencer and Arpeggiator data can transmit all note numbers 0–127"
  # (basic_guide p. 137).
  note_range: [0, 127]
  # "Polyphony: 62 voices (62 oscillators) in single mode" (basic_guide p. 135) and 31 voices on the
  # same 62 oscillators in double mode, which a program chooses: "In the case of Single the maximum
  # polyphony is 62 notes, and in the case of Double the maximum polyphony is 31 notes."
  # (basic_guide p. 45). The optional EXB-MOSS board adds a synthesiser of its own: "The MOSS tone
  # generator has six-note polyphony." (parameter_guide p. 237).
  polyphony: 62
  voicing_modes: [31, 62]
  # ONE POOL FOR EVERY TIMBRE AND TRACK, BY INFERENCE. The specification gives one figure, for the
  # tone generator and in oscillators, and none for a timbre or a track, so the sixteen tracks draw
  # on those 62 oscillators together. No page says how they are divided. The optional MOSS board's
  # six voices are the exception: each timbre is given a share of them by a `MOSS VOICE` setting of
  # 0 to 6 among the implementation's combination parameters, and the history speaks of the MOSS
  # "Voice Allocation Reserve" (history p. 1).
  polyphony_shared: true
  velocity:
    # "Note On (vv)=1-127" (implementation) in both lists, and `9n, V=1-127` both ways on the chart
    # (basic_guide p. 137).
    note_on: both
    # "However, most instruments do not receive or transmit note-off velocity, and neither does the
    # TRITON." (basic_guide p. 114). The transmitted list sends a fixed 40 hexadecimal, and the
    # chart crosses Note Off both ways (basic_guide p. 137).
    note_off: false
  # BOTH KINDS ARE ANSWERED TO AND THE KEYBOARD SENDS ONE. "The TRITON’s keyboard transmits only
  # channel after touch; it does not transmit polyphonic after touch." (parameter_guide p. 119), and
  # it "can receive polyphonic after touch to control individual notes" (parameter_guide p. 119).
  # The chart circles both kinds both ways and remarks "Polyphonic aftertouch transmitted"
  # (basic_guide p. 137), "only as sequence data" (basic_guide p. 137). `poly` is the stronger of
  # the two words this field holds, as `korg/kronos` records it.
  aftertouch: poly
  pitch_bend:
    # In both lists, and settable over the first registered parameter, "r = 0 : Pitch Bend
    # Sensitivity ( Bend Range )." (implementation). The document gives no factory depth; "only
    # positive values can be set using RPN messages." (basic_guide p. 120); and a timbre or track
    # whose bend range is set to PRG takes the program's instead: "These messages will not be
    # received if the setting is PRG." (parameter_guide p. 56).
    programmable: true

parts:
  # SIXTEEN TRACKS, AND A COMBINATION USES EIGHT OF THE SAME KIND. The Basic Guide puts the two side
  # by side: from outside, MIDI can play "a combination (8-part multi-timbral performance)"
  # (basic_guide p. 122) or "a song (using the TRITON as a 16-part multi-timbral tone generator)"
  # (basic_guide p. 122). The specifications give the sequencer "16 timbres, 16 tracks + 1 master
  # track" (basic_guide p. 135). The larger is recorded, the one the Basic Guide calls a
  # multi-timbral tone generator.
  # EACH TAKES A CHANNEL OF ITS OWN: "In Program mode (P0: Play), MIDI data is received on the
  # global MIDI channel, but in Combination mode (P0: Play) or Sequencer mode, MIDI data is received
  # on the MIDI channel specified for each timbre or track." (parameter_guide p. 117). A track whose
  # status is INT or BTH receives; EXT and EX2 only send (basic_guide p. 114). A song's tracks start
  # on channels 1 to 16 in order, "(This is the default.)" (basic_guide p. 64), and in Song Play
  # mode they cannot move: "In Song Play mode, MIDI channels 1–16 correspond to tracks 1–16."
  # (parameter_guide p. 101). A timbre may also follow the global channel, `Gch`
  # (parameter_guide p. 33), and a track may not (parameter_guide p. 55).
  track:
    label: Track
    count: 16
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]

groups:
  # THE IMPLEMENTATION'S TWO LISTS ARE FLAT AND GROUP NOTHING, so these are functional sections, the
  # ones `korg/kronos` uses for the same numbers, with the arpeggiator and the GS parameters added.
  continuous: Continuous controllers
  switch: Switches and pedals
  sound: Sound controllers
  assignable: Assignable knobs, switches and the ribbon
  effects: Effect controls, sends and switches
  arpeggiator: Arpeggiator, by NRPN
  gs_nrpn: Sound parameters received by NRPN

controls:

  # Continuous controllers ──────────────────────────────────
  modulation_1:                {label: Modulation 1 (Joystick +Y), cc: 1, group: continuous}
  modulation_2:                {label: Modulation 2 (Joystick -Y), cc: 2, group: continuous}
  foot_pedal:                  {label: Foot Pedal, cc: 4, group: continuous}
  portamento_time:             {label: Portamento Time, cc: 5, group: continuous}
  volume:                      {label: Volume, cc: 7, group: continuous}
  # Received as "Balance Control ( for Post IFX Panpot control )" (implementation), on the global
  # channel in Program and Sampling modes and on each insert effect's own channel in the others.
  post_ifx_panpot:             {label: Post IFX Panpot, cc: 8, group: continuous}
  panpot:                      {label: Panpot, cc: 10, group: continuous}
  expression:                  {label: Expression, cc: 11, group: continuous}

  # Switches and pedals ─────────────────────────────────────
  hold_1:                      {label: Hold 1 (Damper), cc: 64, group: switch}
  # Received as "dd = 00 - 3F : Off" (implementation) and "40 - 7F : On" (implementation).
  portamento:                  {label: Portamento Off/On, cc: 65, values: {"off": 0, "on": 64}, group: switch}
  sostenuto:                   {label: Sostenuto Off/On, cc: 66, values: {"off": 0, "on": 64}, group: switch}
  soft_pedal:                  {label: Soft Pedal, cc: 67, group: switch}

  # Sound controllers ───────────────────────────────────────
  # Each moves a program parameter: "A value of 64 will correspond to the value specified by the
  # program parameter. 0 will be the minimum, and 127 will be the maximum."
  # (parameter_guide p. 224). For the EXB-MOSS board's bank F programs "Different parameters are
  # controlled" (parameter_guide p. 225).
