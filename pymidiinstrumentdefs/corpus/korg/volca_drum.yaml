    # The only version history Korg publishes for this instrument, and the reason `firmware` is
    # not recorded above: 1.11 fixed MIDI CC assignments and 1.14 fixed single-channel MIDI
    # handling of note events, both after the charts were written.

midi:
  # THE SIX PARTS ARE ON CHANNELS 1 TO 6 AND NOTHING SETS A BASE. The split-channel chart marks
  # Basic Channel as X in the Received column, which is this chart saying there is no basic
  # channel to set: its Mode row remarks "Channel 1-6 = Parts 1-6" instead. So the base is 1 and
  # cannot be anything else, and the part below, six instances from an offset of 0, is what puts
  # them on 1 to 6. Setting a channel at all is what switches the instrument to the other
  # implementation.
  # THE CHART CONTRADICTS ITSELF HERE AND BOTH READINGS ARE RECORDED. An X against Basic Channel
  # says the instrument answers to no basic channel at all, and three cells of the same chart
  # say otherwise: the recognised mode is 3, which is omni off, and the Mode and Velocity rows
  # both spell out that channels 1 to 6 are parts 1 to 6. A device that is omni off and answers
  # on six channels has a basic channel. The single-channel chart gives 1-16 and "Memorized" for
  # the same row. This file follows the X - as "the player cannot change it" rather than "there
  # is none" - because that is the reading the two remarks agree with.
  channels: [1, 1]
  # The chart's recognised Mode default, 3, which is omni off and poly. Mode messages are marked
  # X in both columns.
  mode: 3
  # "System Real Time: Clock" is X transmitted and O received, with footnote *2. The instrument
  # has no MIDI OUT, so nothing it does travels outward; SYNC OUT is a 3.5 mm pulse jack and not
  # MIDI.
  clock: receives
  # "System Real Time: Commands" and "System Common: Song Position" are both X transmitted and
  # O received, with footnote *2. Song Select and Tune Request are X in both columns.
  transport: receives
  program_change:
    # O received, X transmitted, with "True Number" blank in both columns, so the chart says it
    # answers to program change and does not say what range.
    receives: true
    sends: false
    # NOT RECORDED: how many presets. See the source account.
  # System Exclusive is X in both columns of both charts: a checked absence rather than silence.
  sysex: false
  # CHECKED AND ABSENT. The words NRPN, RPN, Registered and Parameter Number appear nowhere on
  # either chart or on printed page 3 of the manual.
  nrpn: none

parts:
  # SIX PARTS ON SIX CHANNELS, with nothing to set: "Channel 1-6 = Parts 1-6" (chart) and, from
  # the player's side, "reverts to part 1-6 assigned to channels 1-6. (factory default)" (p. 3).
  # They are one part with six instances rather than six parts, because the chart gives them one
  # map between them and the channel is the only thing that tells them apart.
  part:
    label: Part
    count: 6
    channel_offset: 0
    # A note reaches the part whose channel carried it and the note number means nothing: the
    # chart recognises 0 to 127 and remarks "Each sound does not correspond to a note number".
    # So this is a part that takes notes and has no note map, which is what `none` says here.
    addressing: none
    receives: [notes, controls]

voice:
  addressing: none
  # "Note Number 0-127" recognised, transmitted nothing (chart).
  note_range: [0, 127]
  # NOT RECORDED: polyphony, for a part or for the instrument. The specification counts the
  # parts - "6 digital parts (each with 2 osc. with pitch mod. and amp. e.g.), and a
  # waveguide-based resonator effect" (p. 3) - and never says how many notes one part will hold.
  velocity:
    # "Note On O 9n, V=1-127" received, X transmitted; "Note Off X" in both columns (chart).
    note_on: received
    note_off: false
  # A checked absence, from the chart's own rows: Key's aftertouch X in both columns, Channel
  # aftertouch X in both columns.
  aftertouch: none
  # NOT RECORDED: pitch bend, because there is none. The chart marks Pitch Bend X in both
  # columns, so there is no range to state and no `pitch_bend` block to state it in.

groups:
  # These three headings are the owner's manual's own, and they are the order it introduces
  # them in. The chart heads nothing over its rows.
  # "Sound Controls: These knobs and buttons control the sound of the currently selected drum
  # part and waveguide resonator effect" (p. 3).
  sound_controls: Sound Controls
  # "When EDIT/STEP is lit, this encoder functions as the PARAM knob, cycling through the
  # following additional part parameters: BIT: bit reduction amount, FLD: wave folder amount,
  # DRV: overdrive gain, PAN: left-right pan, GAN: pre-mix gain adjustment, QPI: enable pitch
  # quantization (semitone)" (p. 3). Five of those six have a controller number; QPI has none
  # on either chart.
  part_parameters: Part Parameters
  # "WAVEGUIDE" heads the SEND, DECAY, BODY and TUNE knobs (p. 3).
  waveguide: Waveguide

controls:

  # Every one of these is received and never sent, and every one is marked with footnote *1,
  # which the source account gives in full. Generated from the chart by
  # `Notes/4204_write_controls.py`, which reproduces this block.
  #
  # THE LAYER SUFFIX IS NOT A RANGE. The chart writes SELECT1, SELECT2, SELECT1-2 against 14,
  # 15, 16: three controls, the third moving both of a part's layers at once.

  # Sound Controls ────────────────────────────────────────────────────────
  select_1:            {label: "Select, layer 1", cc: 14, direction: receives, part: part, group: sound_controls}
  select_2:            {label: "Select, layer 2", cc: 15, direction: receives, part: part, group: sound_controls}
  select_both:         {label: "Select, both layers", cc: 16, direction: receives, part: part, group: sound_controls}
  level_1:             {label: "Level, layer 1", cc: 17, direction: receives, part: part, group: sound_controls}
  level_2:             {label: "Level, layer 2", cc: 18, direction: receives, part: part, group: sound_controls}
  level_both:          {label: "Level, both layers", cc: 19, direction: receives, part: part, group: sound_controls}
  eg_attack_1:         {label: "EG Attack, layer 1", cc: 20, direction: receives, part: part, group: sound_controls}
  eg_attack_2:         {label: "EG Attack, layer 2", cc: 21, direction: receives, part: part, group: sound_controls}
  eg_attack_both:      {label: "EG Attack, both layers", cc: 22, direction: receives, part: part, group: sound_controls}
  eg_release_1:        {label: "EG Release, layer 1", cc: 23, direction: receives, part: part, group: sound_controls}
  eg_release_2:        {label: "EG Release, layer 2", cc: 24, direction: receives, part: part, group: sound_controls}
  eg_release_both:     {label: "EG Release, both layers", cc: 25, direction: receives, part: part, group: sound_controls}
  pitch_1:             {label: "Pitch, layer 1", cc: 26, direction: receives, part: part, group: sound_controls}
  pitch_2:             {label: "Pitch, layer 2", cc: 27, direction: receives, part: part, group: sound_controls}
  pitch_both:          {label: "Pitch, both layers", cc: 28, direction: receives, part: part, group: sound_controls}
  mod_amount_1:        {label: "Mod Amount, layer 1", cc: 29, direction: receives, part: part, group: sound_controls}
  mod_amount_2:        {label: "Mod Amount, layer 2", cc: 30, direction: receives, part: part, group: sound_controls}
  mod_amount_both:     {label: "Mod Amount, both layers", cc: 31, direction: receives, part: part, group: sound_controls}
  mod_rate_1:          {label: "Mod Rate, layer 1", cc: 46, direction: receives, part: part, group: sound_controls}
  mod_rate_2:          {label: "Mod Rate, layer 2", cc: 47, direction: receives, part: part, group: sound_controls}
  mod_rate_both:       {label: "Mod Rate, both layers", cc: 48, direction: receives, part: part, group: sound_controls}

  # Part Parameters ───────────────────────────────────────────────────────
  # THE CHART AND THE MANUAL NAME THESE DIFFERENTLY, and the labels follow the chart, because
  # the chart is where the numbers are. The manual's own list of the same parameters reads
  # "BIT: bit reduction amount, FLD: wave folder amount, DRV: overdrive gain, PAN: left-right
  # pan, GAN: pre-mix gain adjustment" (p. 3), so a player looking for Dry Gain on the display
  # will find GAN.
  pan:                 {label: Pan, cc: 10, direction: receives, part: part, group: part_parameters}
  bit_reduction:       {label: Bit Reduction, cc: 49, direction: receives, part: part, group: part_parameters}
  wave_folder:         {label: Wave Folder, cc: 50, direction: receives, part: part, group: part_parameters}
  drive:               {label: Drive, cc: 51, direction: receives, part: part, group: part_parameters}
  dry_gain:            {label: Dry Gain, cc: 52, direction: receives, part: part, group: part_parameters}

  # Waveguide ─────────────────────────────────────────────────────────────
  # The first of these belongs to a part and the other four do not: "the waveguide resonator is
  # shared for all parts" (p. 3), and "SEND knob: Set the waveguide resonator send amount for
  # the selected part" (p. 3).
  waveguide_send:      {label: Waveguide Send, cc: 103, direction: receives, part: part, group: waveguide}
  waveguide_model:     {label: Waveguide Model, cc: 116, direction: receives, group: waveguide}
  waveguide_decay:     {label: Waveguide Decay, cc: 117, direction: receives, group: waveguide}
  waveguide_body:      {label: Waveguide Body, cc: 118, direction: receives, group: waveguide}
  waveguide_tune:      {label: Waveguide Tune, cc: 119, direction: receives, group: waveguide}
