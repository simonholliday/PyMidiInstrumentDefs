    # The FAQ the MK2's page links, the visible text: the Iridium's entries, every one. The only
    # document that says what program change does.

midi:
  # NO CHANNEL RANGE: see the account. Clock is received, and no page says MIDI clock is sent
  # (manual p. 199).
  clock: receives
  # LEARNED: see the account, which also says why no range of learnable numbers is given. The
  # sixteen controls below are the ones the maker fixes.
  control_change: learned
  # "the Iridium MK2 does not react on incoming NRPN MIDI data." (manual p. 199); it sends them.
  nrpn: none
  # MPE, with an optional second zone (manual p. 198).
  per_voice_channels: true
  program_change:
    # ON ONE FAQ ENTRY THE THREE IRIDIUMS SHARE, AND NOTHING ELSE - see the account. A program
    # change picks an entry in the `Favorites` list. Nothing says it is sent, and no count is
    # recorded.
    receives: true
  # NOT RECORDED: `mode`, `transport`, `sysex`; see the account.

voice:
  addressing: pitches
  # "Iridium MK2 offers an overall polyphony of 16 voices." (manual p. 164).
  polyphony: 16
  # "all sound layers will share the maximum polyphony of 16 voices." (manual p. 22).
  polyphony_shared: true
  velocity:
    # `MIDI Velocity` and `MIDI Release Velocity` among the modulation sources (manual p. 220).
    note_on: received
    note_off: true
  # Poly AT by default, Mono AT by choice (manual p. 167).
  aftertouch: poly
  pitch_bend:
    # Per oscillator, -24 to +24, default +12 (manual p. 31).
    semitones: 12
    programmable: true

parts:
  layer:
    label: Layer
    # "up to 4 different sound patches can be played simultaneously" (manual p. 22).
    count: 4
    # "Layer 1…4 Input Channel" (manual p. 197) and `Chan 1…4` on output (manual p. 199).
    channel: assigned
    addressing: pitches
    # Program change is read as not a Layer's: the FAQ says only that it picks a `Favorites` entry,
    # which this definition reads as a whole patch, as `waldorf/iridium` does.
    receives: [notes, controls]

groups:
  controllers: Controllers
  pedals: Pedals
  modulation: Modulation Sources
  mpe: MPE
  master: Master

