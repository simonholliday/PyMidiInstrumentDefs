# **TWO WHOLE MIDI IMPLEMENTATION CHARTS, FOR TWO MODES, ON FACING PAGES - AND 50 OF THE
# ALTERNATE'S NUMBERS MEAN MORE THAN ONE THING.** Pages 60 and 61 of the owner's manual are each a
# complete chart, and each ends by naming the other: p. 60 is headed `SINGLE Ch.` and says "This
# is the factory default implementation." (manual p. 60), while p. 61 says "This is an alternate
# implementation selectable via MIDI Global settings." (manual p. 61).
#
# **THEY ARE NOT A CHART AND A CONTINUATION.** In the default mode all eleven parts answer on one
# channel, notes 36 to 55 address them, and the controller map is flat. In the alternate mode
# **each part has a channel of its own**, notes run 0 to 127, and the same controller number means
# a different thing on each channel: controller 20 is `BD TUNE` on the first part's channel, the
# fifth user synth parameter on the multi part's and the ninth delay parameter on the effects
# channel. Counted from the two pages: the alternate uses all **67** of the default's controller
# numbers and five more. **56** of the 67 keep their default meaning on one of the alternate's
# parts, and the other **11** are the parts' levels, which the alternate moves to 7 and 39 on each
# part's own channel. The alternate gives **50** of its numbers more than one meaning, and 25 and
# 26 four each, counting a parameter every sound part has - its level, pan and two sends - as one
# meaning. **Until 2026-10-11 this said 65 of the 67 meant different things and 46 had more than
# one meaning.** That count compared labels as the chart prints them, so a parameter printed
# without its part's name, or inside a range, counted as a different one; it counted 120 and 121;
# and it missed or merged the alternate's rows for 7, 39, 91 and 92.
#
# **BOTH ARE CARRIED, EACH IN ITS MODE**, as `roland/ju_06a`'s two pages now are - one file, two
# charts, two states the instrument can be in. Until 2026-10-11 the default was carried and the
# alternate was in prose, because **the alternate cannot be merged** into the default's map: 50 of
# its numbers need more than one meaning at once. Modes hold the two apart instead. The default's
# 66 controls name no part and answer in `single`, marked as the factory mode on the maker's own
# word; the alternate's 179 are on twelve parts that exist only in `multi`, which says
# `unparted: false`.
#
# AND THE SETTING THAT CHOOSES BETWEEN THEM IS ONE LINE OF THE GLOBAL CHAPTER: "CH [1...16, 1-12,
# 2-13...5-16, 6-1..16-11] Sets the MIDI channel used for MIDI sending/receiving. In addition to
# single channels 1 to 16, you can assign 11 parts to different MIDI channels" (manual p. 47). So
# a drumlogue is one of the two instruments these charts describe depending on a number somebody
# set. **The setting's spans are twelve channels wide where its sentence says eleven parts**: the
# alternate's chart has a twelfth part, the effects - see the parts.
#
# **THERE IS NO SEPARATE MIDI IMPLEMENTATION, AND THAT IS NOW THE EXPECTED CASE FOR THIS MAKER.**
# Korg publishes thirteen documents for this instrument and not one is called an implementation;
# the charts are pages of the owner's manual. **That is the third Korg in four ranks whose chart
# is not where its name would put it** - `korg/kronos` had its in an operation guide's appendices
# 884 printed pages from the implementation it summarised, and `korg/ms_20_mini` has its on p. 2
# of a four-page manual while its 2.2 KB implementation carries no chart at all. By now this is
# the first place to look rather than the last.
#
# **EVERY ONE OF THE 245 CONTROLS BELOW IS GATED BY A GLOBAL SWITCH, IN EACH DIRECTION
# SEPARATELY.** The chart footnotes all of them: "*2 : When the GLOBAL setting MIDI RX CC is ON,
# the drumlogue will receive signals; and when the GLOBAL setting MIDI TX CC is ON, the drumlogue
# will transmit signals." (manual p. 60), and the alternate's chart says the same as its `*1`,
# adding "Signals are transmitted on the channel corresponding to the part." (manual p. 61). The
# Global chapter gives both switches and a third for the transport, each `[OFF, ON]`. The format
# has no field for a condition on a whole map, so it is said here - and a consumer offering these
# numbers to a drumlogue that has not been told to listen will find every one of them silent.
#
# ITS NOTES ADDRESS DRUMS AND DO NOTHING ELSE. "*1 : Note numbers correspond to the following
# parts, 36: BD, 37: RS, 39: CP, 40: SD, 42: CH, 45: LT, 46: OH, 50: HT, 52: SP1, 53: SP2, 55:
# MULTI" (manual p. 60), with the remark that settles what the rest of the byte does: "Pitch is
# unaffected by the note number." (manual p. 60). **Eleven voices over a span of twenty**, which
# is not contiguous - 38, 41, 43, 44, 47 to 49, 51 and 54 do nothing.

definition: 1

model:
  manufacturer: Korg
  name: drumlogue
  # **FIRMWARE 1.1.0, AND IT CHANGED NOTHING BELOW.** The owner's manual is edition `E4`, dated
  # 2025-02-26, and the newest system Korg publishes is 1.1.0 from January 2023. Its five new
  # features are **all panel operations** - a solo function and a solo latch, a mute latch, a
  # shift latch and a display change - and the word `MIDI` appears in it only in a link to the
  # downloads page. So the map is the map, and that is a checked absence rather than an
  # assumption.
  # The charts date themselves 16 May 2022 at version 1.01, which is before the firmware and
  # is the chart's own version rather than the instrument's.
  # Checked 2026-10-06.

source: >-
  **The drumlogue Owner's Manual, 62 sheets, whose last two pages are two complete MIDI
  Implementation Charts for two modes of the same instrument.** The single-channel controls below
  come from p. 60, the one its maker calls the factory default, and the multi-channel ones from
  p. 61, the alternate. See the comment above the definition.

  **THIRTEEN DOCUMENTS AND NOT ONE IS A MIDI IMPLEMENTATION.** Korg's downloads page lists the
  owner's manual in four languages, a quick start guide in two, a precautions sheet, the 1.1.0
  new-features note in five languages and a Chinese RoHS notice. The English owner's manual, the
  quick start guide and the new-features note are in the library; the rest are translations of
  those three and a safety sheet, whose digests are in the provenance record.

  **THE QUICK START GUIDE AND THE PRECAUTIONS SHEET CARRY NO CONTROLLER NUMBER**, which is worth
  saying because the guide is the larger file of the two: 8 sheets in five languages, and its
  only MIDI content is the rear-panel description. Nothing below rests on either.

  WHY THE DEFAULT IS MARKED AS THE FACTORY MODE AND THE ALTERNATE IS NOT. **The maker calls it the
  default**, in those words, and it is the map a drumlogue out of the box answers to. Until
  2026-10-11 that was also why only the default was carried: the alternate could not be held
  without parts, because 50 of its numbers mean more than one thing, and parts alone could not
  say that the default's map falls silent when the alternate's parts answer. A mode says it.

  **ITS MASTER VOLUME IS THE DEFAULT MAP'S ONLY FOURTEEN-BIT CONTROL, AND THE CHART WRITES IT AS
  THE SPECIFICATION DOES.** `7, 39 MASTER VOLUME MSB, LSB` - controller 39 being the least
  significant half of controller 7. So that row is one control below rather than two. The
  alternate uses the same pair for every part's level and for the twelfth part's master volume,
  `PART 1-11: LEVEL MSB, LSB. PART 12: MASTER VOLUME MSB, LSB`, so its twelve are fourteen-bit
  too.

  THE CHART'S READING ORDER IS LOST AND ITS CELLS ARE READ BY COORDINATE. The flat text runs
  every row label, then every controller number, then every parameter name, then every mark - so
  no row of it can be matched as a string, and `Control Change 20, 21, 22, 23, 24 O O BD TUNE,
  DRIVE, ATTACK, DECAY, LEVEL` appears nowhere in it. `Notes/4622_extract_drumlogue.py` reads
  both sheets by coordinate and asserts every cell the single-channel fields below rest on. It
  misses p. 61's first row, so the multi-channel fields were read again from a render of that
  page, row by row.

  **AND ITS PARAMETER NAMES ARE A PREFIX AND A COMMA LIST**, which is how the chart saves room:
  `BD TUNE, DRIVE, ATTACK, DECAY, LEVEL` is five controls and only the first carries the part's
  name. The script distributes the prefix, so every label below is one a reader would recognise
  on the panel rather than a bare `DRIVE` that could belong to any of eleven parts. The
  alternate's labels are read the same way, and its rows for parts 1 to 11 at once take each
  part's own name, so `PART 1-11: PAN` is `BD PAN` on the first part and `MULTI PAN` on the
  eleventh. A row naming a range, `USER SYNTH PARAM 1-8`, is read as its numbers in order, the
  first parameter on the first number, as the default's `USER SYNTH PARAM 1, 2, 3, 4` is.

  NOT RECORDED: the polyphony, which no document states. The eleven parts' own parameters beyond
  what the chart gives numbers for - the panel has more knobs than the map has controllers. The
  sequencer, its patterns and its sixteen steps. And the
  SYNC IN and SYNC OUT jacks, which carry a pulse rather than a message and have four settings
  between them.

