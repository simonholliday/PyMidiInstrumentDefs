# THE THIRD CIRCUIT IN THIS CORPUS, AND THE FIRST TIME THREE OF ONE FAMILY CAN BE COMPARED.
# `novation/circuit` and `novation/circuit_tracks` are both already here, so the two-product
# question is asked for the eighth time with two committed files to answer it against rather
# than one - and the answer is sharper than either document says.
#
# SIXTY-FOUR OF THIS INSTRUMENT'S SEVENTY-FOUR ADDRESSES ARE ALSO USED BY THE CIRCUIT, AND
# ONLY ELEVEN OF THEM MEAN THE SAME THING. Ten of the eleven are NRPNs - the Delay's six,
# the Reverb's three and the effects bypass - and **the eleventh is the one control change
# in this family that survives the change of instrument**, controller 71, the master
# filter's resonance. The other fifty-three are control changes that are not portable at
# all: controller 21 is this machine's sample Pitch and the Circuit's oscillator 1 pulse
# width index, because a control change here belongs to a track and the three machines'
# tracks are different machines.
#
# AND THE MASTER FILTER'S FREQUENCY MOVED, WHICH IS THE MOST DANGEROUS LINE IN THE FAMILY.
# It is controller **79** here and controller **74** on both siblings - and 79 on them is
# the drums' pan and the synth's envelope-to-frequency, while this machine uses 74 for
# nothing at all. Its resonance did not move. A definition written by analogy from either
# sibling would put the filter on a number that exists and means something else.
#
# Both figures are asserted in `Notes/4468_compare_with_the_siblings.py`, against what this
# project publishes rather than between documents - and **the eleven are listed there by
# address rather than matched by name**, because a matcher that folds case and punctuation
# answered nine, then twelve, and the truth is eleven.
#
# AND THIS ONE'S REFERENCE DOCUMENTS NO SYSTEM EXCLUSIVE AT ALL, where the Circuit Tracks'
# mentions SysEx twenty-one times and both siblings record `sysex: true`. The word appears
# nowhere in this instrument's 112 sheets, so the field is left out rather than guessed from
# the family - see the source account.
#
# FIVE ROWS ARE PRINTED WITH A RANGE, A DEFAULT AND NO NUMBER, marked NOT SUPPORTED: the
# master volume and the four click parameters. That is a stated absence rather than a gap,
# and it is named below rather than silently dropped.
#
# ITS OWN REFERENCE CARRIES THREE LEFTOVERS FROM A SIBLING'S, which is what a family of
# documents does. Its contents page lists a section called "Triggering Drums" (p. 2) where the
# section itself is headed "Triggering Sample Tracks" (p. 5); a note sends the reader to a "Drum
# Control table" (p. 5) that this document does not contain; and the heading "Patch and Project
# Select" (p. 5) stands over a table that selects projects and nothing else, this machine having
# samples where its siblings have patches. The user guide has a fourth - see the account.

definition: 1

model:
  manufacturer: Novation
  name: Circuit Rhythm
  # THE ONLY FIRMWARE ANY OF THESE DOCUMENTS NAMES. Novation delivers firmware through
  # Novation Components, which serves nothing a fetch can read - the same wall the Circuit
  # Tracks and this maker's Peak met - so the downloads page offers no firmware file and no
  # version. What it does offer is a file the downloads page calls the "Circuit Rhythm 2.0
  # Firmware Update Addendum V1 English" and which heads its own every sheet "Circuit Rhythm
  # Firmware Update - Version 2.0 Addendum" (p. 2).
  # **THE PROGRAMMER'S REFERENCE NAMES NO FIRMWARE AT ALL**, prints no date of its own, and
  # contains none of the five feature names 2.0 added - and two parameters 2.0 puts on the
  # macro pots have no controller number anywhere. So this is the newest firmware the maker
  # names and not a claim that what is below reaches all of it; the source account has the
  # evidence both ways, including the fourteen defaults that do tie the two documents
  # together.
  firmware: "2.0"

source: >-
  Three documents and a downloads page, all Novation's own. The Programmer's Reference
  Guide carries the whole map; the User Guide carries everything about channels, clock and
  configuration; the firmware 2.0 addendum says what the newest release added.

  THE REFERENCE IS SIX SHEETS AND EVERY PARAMETER TABLE ON IT IS RULED BOTH WAYS, so the
  grid was recovered from the rules and the words placed into it. Four tables: Macro Knobs
  and Sampler Parts 1-8 (p. 3), Effects (p. 4) and Global Control Data (p. 5), 87 rows
  between them. One sheet carries two of those tables with different column positions, so
  each table's columns were taken from the rules that share its own vertical extent rather
  than from the sheet.

  AND THE MAKER'S TEXT OVERFLOWS THE MAKER'S OWN RULING, which is worth knowing before
  anybody reads this document again. The section cell on printed page 5 runs from x 36.2 to
  73.4 and holds "LP HP Filter", whose last word starts at 67.3 and ends at 83.1 - so a
  reading that places a word by its middle files that word under Parameter and produces a
  section called "LP HP" and a parameter called "Filter Frequency". The same happens to
  "Audio Input". Every column in this document is left-aligned, which is what makes the left
  edge the right edge to measure by here.

  EIGHTY-SEVEN ROWS AND SEVENTY-FOUR CONTROLS, and the difference is two kinds of row the
  maker prints deliberately. **Eight are the same eight twice**: the Macro Knobs table opens
  "These are identical to the parameters in the 'Sampler Parts' section" (p. 3), and its
  eight numbers, 21 to 28, are eight the Sampler Parts table gives - which was asserted
  rather than taken on trust. They are published once, under the parameter's name, with the
  knob's own name in a comment. **Five more carry a range and a default and no number at
  all**, marked NOT SUPPORTED: Master Volume, and the Click's On/Off, Volume, Rate and
  Choice. Those are named here and are not below.

  THE TABLES PUNCTUATE THEIR RANGES THREE WAYS, and one of them is ambiguous. Nearly
  everywhere a range is an en dash - "0 - 127" - but **fourteen rows use a comma instead,
  and all fourteen are in the Global Control Data table**: "0, 127", which reads as two
  values rather than a span. That is fourteen of the sixteen rows in that table which have a
  range at all; the two that do not take the comma are the master filter's. For an on/off switch the two readings name the same thing; for the compressor's
  attack and release they do not. The two ends are the same either way, so the ends are what
  is recorded and the maker's own notation is kept in a comment on each. Two smaller slips
  in the same vein: "0 -13" for the autofilter's LFO rate, where the space before the dash
  is missing, and "0 - 127" with a hyphen for the master filter's resonance where every
  other row has an en dash.

  AND THREE ROWS STATE THEIR RANGE IN BYTES AND THEIR DEFAULT ON THE PARAMETER'S OWN SCALE,
  which this format's own validator is what caught. The Sampler's Pitch is printed
  "4 - 124 (-60 - 60)" (p. 3) with a default of 0, and 0 is not a byte this parameter accepts: it
  is nought semitones, which is byte 64. The Sampler's Slope and the Mixer's Pan are the
  same shape and pass unnoticed, because their byte ranges happen to contain a nought.
  **The master filter's Frequency is the one that does not**: printed "0 - 127 (-64 - 63)" (p. 5)
  with a default of 64, which is outside the signed scale and so can only be a byte. So no
  default is published for those three, and each says why; the fourth keeps its 64. A
  default is a value somebody will send, and a figure on the wrong scale is worse than none.

  EIGHT SAMPLE TRACKS, ON EIGHT CHANNELS THE PLAYER SETS. "You can change the MIDI channel
  which each track uses in Setup View. Each track can be set to any of MIDI channels 1-15.
  Channel 16 is reserved for the Project" (p. 89 of the guide), and "Important: No two tracks
  can transmit on the same MIDI channel" (p. 89). The factory default is track N on channel
  N, for N from 1 to 8.

  AND THE REFERENCE NAMES A CHANNEL FOR ONE OF ITS FOUR TABLES AND FOR NEITHER OF THE TWO
  THAT MATTER MOST. The Macro Knobs rows each read "Send on appropriate channel 1-8" (p. 3);
  the project-select table and the trigger-note table both name channel 16; **the Effects and
  Global Control Data tables name no channel at all**. The Circuit Tracks' own reference says
  "Send messages on MIDI Channel 16" over the same material, and that is the sibling's
  document and not this one - so the controls below that come from those two tables name no
  part, and the 25 that come from Sampler Parts 1-8 name one.

  THE EIGHT TRACKS ARE ALSO TRIGGERED BY NOTE, ALL ON ONE CHANNEL. "Table of notes used to
  trigger sample tracks from a single MIDI channel" (p. 5), and the table gives C1 to C2 -
  36, 38, 40, 41, 43, 45, 47 and 48 - all on channel 16. Those are below as voices.

  SIXTY-FOUR PROJECTS, AND A PROGRAM CHANGE REACHES THEM TWICE. "You can save your work in
  one of 64 internal Project memories" (p. 6), and the reference's own table gives program
  change 0 to 63 on channel 16 as "select project (instant)" (p. 5) and 64 to 127 as
  "select project (queued)" (p. 5). So the top half of the message space is the same sixty-four projects
  under a different behaviour rather than sixty-four more.

  WHAT THE INSTRUMENT ANSWERS TO, STATED AND ENUMERATED. "MIDI Note On/Note Off, Program
  Change (PGM) and Continuous Controller (CC) messages are all recognised" (p. 93). Against
  that: **aftertouch, pitch bend and system exclusive appear nowhere in any of the three
  documents** - 112 sheets, searched for "aftertouch", "after touch", "pitch bend",
  "pitchbend", "channel pressure", "polyphonic key", "system exclusive" and "SysEx", and not
  one hit. That is an enumerated silence and not a denial, so those fields are left out
  rather than set to none. It is also a real difference from the siblings, whose references
  do document system exclusive.

  CLOCK BOTH WAYS, BY A SWITCH FOR EACH DIRECTION. "MIDI Rx (receive) and Tx (transmit) can
  be enabled independently for each of the data categories" (p. 90), the categories being
  Note, CC, Program Change and Clock, and "By default, both MIDI Rx and MIDI Tx are ON
  (buttons brightly lit) for all data categories" (p. 90). The transport is recorded the same
  way and from the same switch, and all three Circuits now agree about it - see the comment on
  the field.

  THREE SOCKETS, AND THE THIRD IS SWITCHABLE. "three MIDI connectors on 5-pin DIN sockets.
  Allows external equipment to be triggered by Circuit Rhythm's sequences, or external
  controllers to trigger Circuit Rhythm's sequences and to alter samples, Grid FX and FX
  parameters" (p. 19). The Thru can be made a second Out: "The options are for the port to
  act as a regular MIDI Thru port (this is the default), or to duplicate the output of the
  MIDI Out port" (p. 92).

  THE FIRMWARE 2.0 ADDENDUM NAMES FIVE THINGS AND MENTIONS MIDI NOT ONCE in eleven sheets:
  Beat Match, Fixed Length Recording, Grid FX Editing, assigning mute states to scenes, and
  cheat sheets for the seven Grid FX. Each was searched for in the reference by name, which
  is the step `docs/adding-an-instrument.md` prescribes, and **none of them is there** - not
  "Beat Match", not "Fixed Length", not "Mute Recall", not "Triplets", and not even "Grid
  FX", which the user guide says thirty-seven times.

  **THAT TEST PROVES MUCH LESS HERE THAN IT DID ON THE LAST INSTRUMENT, AND SAYING SO IS THE
  POINT.** The reference is six sheets of bare tables with almost no prose: it names no
  feature, prints no date, and never states its own title. A word it does not contain is
  weak evidence, where the same search against a 1,784-line implementation was decisive.

  WHAT DOES CONNECT THE TWO IS A REDUNDANCY THAT HOLDS. The addendum prints a default for
  each Grid FX parameter it puts on a macro pot (p. 6), and **fourteen of those defaults are
  the same fourteen the reference's Effects table prints** - the beat repeat's wet/dry 0, the
  auto filter's depth 40, frequency 80, resonance 63, the phaser's depth 64, feedback 0 and
  centre 0, the vinyl's wobble, crackle, hiss and filter all 64, and the digitise's two 30s.
  All fourteen agree.

  AND WHAT 2.0 ADDS THAT NO NUMBER REACHES. "Macro pot two (Start) always changes the effect
  type" (p. 6 of the addendum), and the reference has no controller for an effect type at
  all; the addendum also puts **Triplets** on macro pot 3 for the beat repeat and the gater,
  and no document numbers it. So the map below is the reference's, and firmware 2.0 reaches
  at least two parameters it does not carry.

  THE REFERENCE ALSO DISAGREES WITH ITSELF ABOUT THE PHASER. Its Effects table gives the
  phaser four parameters besides its on/off - Rate 57, Depth 58, Feedback 59 and Centre 64 -
  while its own FX Parameters table on p. 6 lists three, Rate, Depth and FB, with no Centre.
  The addendum has five, the fifth being the effect type. All three are below as the Effects
  table gives them, which is the only one of the three that carries numbers.

  AND THE SEVEN EFFECTS ARE NAMED FOUR WAYS IN FOUR TABLES, of which **only the Phaser is
  spelled the same in all four**. The reference's Effects table says Gator, DigitalLofi and
  Vinyl; its own FX Parameters table says Reverse, Digital_Lofi; the user guide says Gater,
  Digitise and Vinyl Simulation; the addendum says Gater, Digitise and Vinyl Sim - and
  misspells its own as "Digitse" once. The labels below are the Effects table's, because
  that is the table the numbers are in.

  TWO MORE PLACES THE REFERENCE AND THE GUIDE COUNT DIFFERENTLY, both in the Grid FX and both
  recorded rather than resolved. The guide says "Sixteen delay and eight reverb presets are
  provided" (p. 68) where the reference gives the reverb type a range of 0 to 5, which is
  six. And the two auto-filter counts are **swapped**: the guide describes "a variable state
  (Low/Band/High-Pass)" (p. 74) filter, three, with an LFO whose "shape may be set to Triangle,
  Square, ramp-up, or ramp-down", four (p. 74) - while the reference gives FilterType 0 to 3,
  four, and LFOshape 0 to 2, three. **No value list is published below for any of them**, for
  exactly that reason: the ranges are the reference's and the names are the guide's, and they
  do not line up.

  AND IT IS NOT THE CIRCUIT OR THE CIRCUIT TRACKS, WHICH ARE BOTH ALREADY HERE. "Circuit" is
  a prefix of both the others, so a substring test for the oldest name matches all three
  silently and always by claiming more. Nothing here was matched that way. What the
  comparison found is at the head of this file: 64 shared addresses with the Circuit and 65
  with the Circuit Tracks, of which nine mean the same thing on all three and every one of
  those nine is an effect NRPN.

  THREE LEFTOVERS IN THE REFERENCE AND ONE IN THE GUIDE, each a sibling's text left in this
  machine's document. The reference's contents page lists "Triggering Drums" where the
  section is headed "Triggering Sample Tracks"; a line under the project table reads "Note,
  for drum patch selection see Drum Control table" and there is no Drum Control table in
  these six sheets; and "Patch and Project Select" heads a table that selects projects only.
  In the guide, the Bootloader Mode diagram on printed page 94 labels its pads Synth 1,
  Synth 2, Drum 1 to Drum 4, MIDI 1 and MIDI 2 - **which are the Circuit Tracks' eight
  tracks, not this machine's eight sample tracks.** None of the four changes a number; all
  four would mislead somebody reading quickly.

  THE GUIDE'S LAST SHEET PRINTS NO NUMBER OF ITS OWN and is not cited; the other 94 print
  their own sheet number, and so do all six of the reference's and all eleven of the
  addendum's.

