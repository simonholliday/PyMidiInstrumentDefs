    # 01ee0239355ff72e0c8dd0e85be418704737431b60d9cdc573723d387c9be1f1. One page, cited as p. 1.

midi:
  # The chart's Basic Channel row: 1 to 16 either way, as a default and as changed, with
  # `Memorized` in the remarks - so the number survives a power cycle.
  # **AND THE SAME SETTING IS WHAT CHOOSES BETWEEN THE TWO CHARTS**, its values running past 16
  # into spans of twelve channels. See the comment above the definition.
  channels: [1, 16]
  # The chart's Mode row, recognised. Its Messages row is crossed in both columns, so the mode
  # cannot be set over MIDI.
  mode: 3
  # **BOTH WAYS, AND RECEPTION DEPENDS ON A SETTING WITH FOUR VALUES.** The chart circles Clock
  # in both columns under a footnote: "*5 : When the GLOBAL setting CLOCK SOURCE is INT, the
  # drumlogue will not receive signals. The drumlogue will receive signals when set to AUTO."
  # (manual p. 60). The setting itself is `SOURCE [AUTO, INT., USB, MIDI]` (manual p. 49), which
  # distinguishes the two sockets as well as the two directions.
  clock: both
  # The same: Commands circled both ways under the same footnote. **And the transport has a
  # filter of its own**, separate from the control change and program change ones - `TRANSP
  # (MIDI TRANSPORT) [OFF, ON] A filter to receive MIDI transport messages such as MIDI
  # start/stop.` (manual p. 48), with a transmitting twin.
  transport: both
  program_change:
    # Circled both ways with `(0-127)` in each cell, and its True Number row gives 0 to 127.
    receives: true
    sends: true
    # **A HUNDRED AND TWENTY-EIGHT, WHICH THE CHART STATES RATHER THAN IMPLIES**: the True
    # Number row is the row for exactly this and it reads 0-127, so a program change reaches
    # every program this instrument has and there are no banks.
    presets: 128
    # AND IT IS GATED LIKE THE CONTROLS ARE: "*3 : When the GLOBAL setting MIDI RX PRG CHG is
    # ON, the drumlogue will receive signals; and when the GLOBAL setting MIDI TX PRG CHG is ON,
    # the drumlogue will transmit signals." (manual p. 60).
  # A CHECKED ABSENCE. The word NRPN is on none of the manual's 62 sheets nor in any of the other
  # twelve documents, and controllers 98 and 99 are among the numbers the charts leave unused.
  nrpn: none
  # Circled in both columns, with a footnote naming what else travels: "*4 : In addition to Korg
  # exclusive messages, Inquiry is supported." (manual p. 60).
  sysex: true

voice:
  # THE SINGLE-CHANNEL CHART'S, AS THE `midi` SECTION'S FIELDS ARE: the alternate's chart
  # recognises notes 0 to 127 (manual p. 61), and the parts say which of them take notes and how
  # each reads them.
  # **ITS NOTES NAME DRUMS RATHER THAN PITCHES**, which the chart says twice over - once by
  # listing the eleven and once by saying what the number does not do. See the voices below.
  addressing: voices
  # The chart's Note Number row and its True voice row both give 36 to 55, transmitted and
  # recognised. **The span is twenty and only eleven of it sounds**; the nine numbers between
  # the named ones do nothing, which is a fact about a drum machine's map rather than a gap in
  # this reading.
  note_range: [36, 55]
  velocity:
    # **RECEIVED AS A REAL FIGURE AND SENT AS A CONSTANT.** The chart's Note On row is circled
    # recognised at `9n, V=1-127` and **crossed transmitted at `9n, V=64`** - so an incoming
    # velocity does something and the panel's own buttons send 64 whatever they are struck
    # like, there being no pads on this instrument to strike.
    note_on: received
    # Crossed in both columns, with `8n, V=64` printed beside the cross on the transmitted side.
    note_off: false
  # A CHECKED ABSENCE, BOTH KINDS AND BOTH DIRECTIONS - four crossed cells. It has no keyboard.
  aftertouch: none
  # Never sent: both rows are crossed as transmitted, on both charts (manual pp. 60 and 61).
  aftertouch_transmits: false
  # NOT RECORDED, the pitch bend, and it is a checked absence rather than a gap: the chart
  # crosses it in both columns. On an instrument whose notes do not carry pitch there is nothing
  # for a bend to bend.
  # NOT RECORDED, the polyphony: no document states how many of the eleven parts can sound at
  # once, and `CHOKE` on the panel suggests the answer is not simply eleven.
  voices:
    # **THE ELEVEN PARTS AND THE NOTE THAT PLAYS EACH**, from the chart's own footnote, in the
    # order the footnote prints them rather than in number order - which is the order of the
    # panel's buttons.
    bd: 36
    rs: 37
    cp: 39
    sd: 40
    ch: 42
    lt: 45
    oh: 46
    ht: 50
    sp1: 52
    sp2: 53
    multi: 55

modes:
  # THE TWO CHARTS' OWN HEADINGS: p. 60 is headed `SINGLE Ch.` and p. 61 `MULTI Ch.`. The first is
  # marked as the factory mode on its own words, "This is the factory default implementation."
  # (manual p. 60); the second "is an alternate implementation selectable via MIDI Global
  # settings" (manual p. 61), chosen by the Global setting quoted above the definition.
  single:
    label: SINGLE Ch.
    factory: true
  multi:
    label: MULTI Ch.
    # The default's map does not answer here: the base channel is the first part's, and carries
    # that part's map.
    unparted: false

parts:
  # TWELVE PARTS ON TWELVE CONSECUTIVE CHANNELS, IN THE ALTERNATE MODE ONLY. The chart's Basic
  # Channel row gives `1-12` by default, with "Each part is assigned a separate channel." (manual
  # p. 61) and "Any continuous range of channels can be set." (manual p. 61); the Global setting's
  # spans wrap past 16, as `channel_offset` does. **The manual's sentence counts eleven parts and
  # the chart twelve**: its last row is `PART 1-12: ALL SOUND OFF, RESET ALL CONTROLLERS`. Parts 1
  # to 11 are the eleven sound parts, named on the chart by their first parameters - BD, SD, LT,
  # HT, CH, OH, RS, CP, SP1 and SP2, and the VPM, NOISE and USER SYNTH sources of the eleventh -
  # and PART 12 takes the effects and the master volume. So twelve are carried. Two things here
  # are read and not printed: that part N takes the Nth channel of the span, which follows the
  # numbering, and that the eleventh is the one the charts call the MULTI part, which follows
  # its three sources.
  # NOTES. "Except for the MULTI part, pitch is unaffected by the note number." (manual p. 61), so
  # the eleventh reads a note as a pitch and the other ten take any note and read nothing from it.
  # No page says what a note does on the twelfth part's channel, which has no sound of its own, so
  # it is recorded as taking controls; nor on which channel a program change arrives.
  part_1:   {label: PART 1, mode: multi, channel_offset: 0, addressing: any, receives: [notes, controls]}
  part_2:   {label: PART 2, mode: multi, channel_offset: 1, addressing: any, receives: [notes, controls]}
  part_3:   {label: PART 3, mode: multi, channel_offset: 2, addressing: any, receives: [notes, controls]}
  part_4:   {label: PART 4, mode: multi, channel_offset: 3, addressing: any, receives: [notes, controls]}
  part_5:   {label: PART 5, mode: multi, channel_offset: 4, addressing: any, receives: [notes, controls]}
  part_6:   {label: PART 6, mode: multi, channel_offset: 5, addressing: any, receives: [notes, controls]}
  part_7:   {label: PART 7, mode: multi, channel_offset: 6, addressing: any, receives: [notes, controls]}
  part_8:   {label: PART 8, mode: multi, channel_offset: 7, addressing: any, receives: [notes, controls]}
  part_9:   {label: PART 9, mode: multi, channel_offset: 8, addressing: any, receives: [notes, controls]}
  part_10:  {label: PART 10, mode: multi, channel_offset: 9, addressing: any, receives: [notes, controls]}
  part_11:  {label: PART 11, mode: multi, channel_offset: 10, addressing: pitches, receives: [notes, controls]}
  part_12:  {label: PART 12, mode: multi, channel_offset: 11, receives: [controls]}

groups:
  # **ONE GROUP PER PART, WHICH IS THIS INSTRUMENT'S OWN DIVISION RATHER THAN A CHOICE.** The
  # chart's control change block is written part by part - five rows for the bass drum, five for
  # the snare, three for each hat - and the panel has a button for each. So the grouping is read
  # off the document and off the hardware at once.
  # The multi part gets one group for its three sound sources, because they share a slot: a
  # drumlogue plays a VPM voice or a noise voice or a user-loaded synth there, not all three.
  master: Master
  bass_drum: Bass drum
  snare_drum: Snare drum
  low_tom: Low tom
  high_tom: High tom
  closed_hat: Closed hat
  open_hat: Open hat
  rim_shot: Rim shot
  clap: Clap
  sample_1: Sample 1
  sample_2: Sample 2
  multi: The multi part - VPM, noise and the user synth
  delay: Delay
  reverb: Reverb
  master_fx: Master FX

controls:

  # Master ──────────────────────────────────────────────
  master_volume:                 {label: MASTER VOLUME, cc: 7, lsb: 39, group: master}

  # Bass drum ───────────────────────────────────────────
  bd_tune:                       {label: BD TUNE, cc: 20, group: bass_drum}
  bd_drive:                      {label: BD DRIVE, cc: 21, group: bass_drum}
  bd_attack:                     {label: BD ATTACK, cc: 22, group: bass_drum}
  bd_decay:                      {label: BD DECAY, cc: 23, group: bass_drum}
  bd_level:                      {label: BD LEVEL, cc: 24, group: bass_drum}

  # Snare drum ──────────────────────────────────────────
  sd_tune:                       {label: SD TUNE, cc: 25, group: snare_drum}
  sd_snap_lv:                    {label: SD SNAP.LV, cc: 26, group: snare_drum}
  sd_snap_dec:                   {label: SD SNAP.DEC, cc: 27, group: snare_drum}
  sd_decay:                      {label: SD DECAY, cc: 28, group: snare_drum}
  sd_level:                      {label: SD LEVEL, cc: 29, group: snare_drum}

  # Low tom ─────────────────────────────────────────────
  lt_tune:                       {label: LT TUNE, cc: 46, group: low_tom}
  lt_detune:                     {label: LT DETUNE, cc: 47, group: low_tom}
  lt_decay:                      {label: LT DECAY, cc: 48, group: low_tom}
  lt_level:                      {label: LT LEVEL, cc: 49, group: low_tom}

  # High tom ────────────────────────────────────────────
  ht_tune:                       {label: HT TUNE, cc: 50, group: high_tom}
  ht_detune:                     {label: HT DETUNE, cc: 51, group: high_tom}
  ht_decay:                      {label: HT DECAY, cc: 52, group: high_tom}
  ht_level:                      {label: HT LEVEL, cc: 53, group: high_tom}

  # Closed hat ──────────────────────────────────────────
  ch_tune:                       {label: CH TUNE, cc: 61, group: closed_hat}
  ch_decay:                      {label: CH DECAY, cc: 62, group: closed_hat}
  ch_level:                      {label: CH LEVEL, cc: 63, group: closed_hat}

  # Open hat ────────────────────────────────────────────
  oh_tune:                       {label: OH TUNE, cc: 80, group: open_hat}
  oh_decay:                      {label: OH DECAY, cc: 81, group: open_hat}
  oh_level:                      {label: OH LEVEL, cc: 82, group: open_hat}

  # Rim shot ────────────────────────────────────────────
  rs_tune:                       {label: RS TUNE, cc: 55, group: rim_shot}
  rs_decay:                      {label: RS DECAY, cc: 56, group: rim_shot}
  rs_level:                      {label: RS LEVEL, cc: 57, group: rim_shot}

  # Clap ────────────────────────────────────────────────
  cp_tune:                       {label: CP TUNE, cc: 58, group: clap}
  cp_decay:                      {label: CP DECAY, cc: 59, group: clap}
  cp_level:                      {label: CP LEVEL, cc: 60, group: clap}

  # Sample 1 ────────────────────────────────────────────
  sp1_tune:                      {label: SP1 TUNE, cc: 102, group: sample_1}
  sp1_attack:                    {label: SP1 ATTACK, cc: 103, group: sample_1}
  sp1_decay:                     {label: SP1 DECAY, cc: 104, group: sample_1}
  sp1_level:                     {label: SP1 LEVEL, cc: 105, group: sample_1}

  # Sample 2 ────────────────────────────────────────────
  sp2_tune:                      {label: SP2 TUNE, cc: 106, group: sample_2}
  sp2_attack:                    {label: SP2 ATTACK, cc: 107, group: sample_2}
  sp2_decay:                     {label: SP2 DECAY, cc: 108, group: sample_2}
  sp2_level:                     {label: SP2 LEVEL, cc: 109, group: sample_2}

  # The multi part: VPM, noise and the user synth ───────
  user_synth_param_1:            {label: USER SYNTH PARAM 1, cc: 16, group: multi}
  user_synth_param_2:            {label: USER SYNTH PARAM 2, cc: 17, group: multi}
  user_synth_param_3:            {label: USER SYNTH PARAM 3, cc: 18, group: multi}
  user_synth_param_4:            {label: USER SYNTH PARAM 4, cc: 19, group: multi}
  multi_level:                   {label: MULTI LEVEL, cc: 54, group: multi}
  vpm_note:                      {label: VPM NOTE, cc: 110, group: multi}
