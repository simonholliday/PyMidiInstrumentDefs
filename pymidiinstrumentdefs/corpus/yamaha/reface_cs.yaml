    sha256: 705182642a7be012570805c9686e1eac58bd2b9fa8584f91d33414929e1a85e9
    retrieved: 2026-10-05
    # **Saved once for this family and cited by three definitions**, under the DX because that
    # is where it was first read. The digest above was checked against the copy on disk and
    # against what `yamaha/reface_dx` and `yamaha/reface_cp` record, so all three agree.
    # 19 sheets, four self-contained sections. **This instrument's are 2 to 5** and every one
    # of them prints `reface CS` in its own header; no sheet names two models. Its folio is its
    # own sheet number, printed `reface Data List <n>` in the footer.
    # Its chart dates itself 31 March 2016 at version 1.1, where the other three charts in the
    # same document are version 1.0 - **so this one was reissued and theirs were not**.
    page_offset: 0
  supplement:
    kind: manual
    title: reface Version 1.30 Supplementary Manual
    landing: "https://usa.yamaha.com/support/manuals/index.html?l=en&c=music_production&k=reface"
    url: "https://usa.yamaha.com/files/download/other_assets/0/960060/v130_Manual_en.pdf"
    sha256: 8d00416aff1ad50178fa3db56a1d7d215cd849a793d971987eb0d4c8989873bd
    retrieved: 2026-10-05
    # 28 sheets, partitioned by model as the Data List is, and **this instrument has ten of
    # them, sheets 3 to 12** - more than any of its siblings, because the 1.30 firmware gave the
    # CS nine new functions where it gave the DX two.
    # **Cited for three factory defaults and for nothing else**: the pitch bend range, the
    # receive channel, and which of the pedal's two functions is in effect on a new instrument.
    # **It contains no controller number at all** - neither `CC` nor `Control Change` appears
    # anywhere in its 28 sheets - so nothing in the map below rests on it.
    page_offset: 0
  reference:
    kind: manual
    title: reface Reference Manual
    landing: "https://usa.yamaha.com/support/manuals/index.html?l=en&c=music_production&k=reface"
    url: "https://usa.yamaha.com/files/download/other_assets/7/438827/reface_en_rm_a0.pdf"
    sha256: 78db93bfa3d3fd293b9c9865a236b0df3e74840e00f85d44c314a5941684541d
    retrieved: 2026-10-05
    paginated: false
    # **CITED FOR AN ABSENCE AND QUOTED FOR NOTHING.** Eleven sheets, all of them about Edit
    # mode on the reface DX, and **it says nothing about this instrument**. It is in the same
    # library directory as the two documents above and is a source for `yamaha/reface_dx`, so a
    # reader finding it there could reasonably expect it to be one here. It is not, and this is
    # where that is written down.

midi:
  # The chart's Basic Channel row: 1 transmitted by default, 1 to 16 recognised by default, and
  # 1 to 16 either way once changed. **The two settings are not symmetrical**, as the system
  # table shows - "MIDI transmit channel 1 - 16, off" (dl p. 4) and "MIDI receive channel
  # 1 - 16, All" (dl p. 4) - so it can be told to answer on every channel and to say nothing on any.
  # Both arrived with this firmware, at "Factory default setting: Channel 1" (supplement p. 8)
  # for the one and "Factory default setting: All" (supplement p. 9) for the other.
  channels: [1, 16]
  # NOT RECORDED: the chart gives two different defaults, 3 transmitted and 1 recognised. See
  # the account, and `yamaha/reface_dx`, which drew the same line from the same row.
  # **BOTH WAYS, AND UNLIKE TWO OF ITS SIBLINGS.** The chart circles Clock in both columns where
  # `yamaha/reface_cp`'s and the YC's cross it, and the reason is a block in the system overview
  # those two do not have - a looper. The data format says what receiving one does: "When
  # received via MIDI IN or USB-MIDI IN, the instrument automatically switches to external
  # synchronization. If no signal is received for 3 seconds, it switches back to the internal
  # clock." (dl p. 2). **So it has an internal clock to switch back to**, which is the whole of
  # why this row differs across the family.
  clock: both
  # The same: Commands circled in both columns, where the CP and the YC cross them. Start,
  # Continue and Stop are each given a status byte of their own in the data format (dl p. 2).
  transport: both
  program_change:
    # **A CHECKED ABSENCE BOTH WAYS, AND THE ONE THING IN THIS FAMILY MOST LIKELY TO BE CARRIED
    # ACROSS BY MISTAKE.** The chart crosses Prog Change in both columns and its True # row as
    # well, and the data format has no program change section. **The DX does program change over
    # four banks of eight; this instrument, the CP and the YC do none at all** - which is
    # `yamaha/reface_cp`'s warning, repeated here because it applies equally.
    receives: false
    sends: false
  # A CHECKED ABSENCE. Neither registered nor non-registered parameters appear anywhere in the
  # three documents, and controllers 98 to 101 are among the numbers the Control Change table
  # leaves unused. The pitch bend range, which is what a registered parameter would usually
  # carry, is a system exclusive address here instead.
  nrpn: none
  # Parameter change, bulk dump, dump request and parameter request, with the Model ID `03H`
  # (dl p. 2) that distinguishes this instrument from its siblings. Two parameter tables, a
  # system one of 32 bytes and a tone generator one of 22.
  sysex: true

voice:
  addressing: pitches
  # The chart's recognised Note Number and its True voice row both give 0 to 127, which is the
  # instrument saying it sounds every note it answers to. **What it sends is narrower and is a
  # fact about the keys**: 24 to 108 transmitted, with `Transpose` in the remarks column, for a
  # keyboard of 37.
  note_range: [0, 127]
  # NOT RECORDED, THE POLYPHONY, AND NOR ARE THE VOICING MODES - which needs saying, because
  # one of them is known and that is not enough. The Control Change table's `PORTAMENTO` control
  # offers `Poly 0` against `Mono with Portamento Time 1 - 127` (dl p. 4), so **this instrument
  # is polyphonic and can be made monophonic**, and `voicing_modes` would hold that pair. But
  # the pair is `[1, n]` and **no document in the family states n**: the Data List gives no
  # voice count, the supplement gives none, and the Reference Manual is about another model.
  # Listing `[1]` alone would say it is monophonic only, which is the opposite of what the
  # portamento control shows. So both fields are empty and the fact is here.
  velocity:
    # The chart circles Note ON in both columns, transmitted `9nH,v=1-127` and recognised
    # `v=1-127`.
    note_on: received
    # **AND NO RELEASE VELOCITY EITHER WAY.** The chart crosses Note OFF in both columns, and the
    # data format says of the note off message that velocity is `v: ignored` (dl p. 2) - which is
    # the same pair of statements `yamaha/reface_cp` found for itself.
    note_off: false
  # A CHECKED ABSENCE, BOTH KINDS AND BOTH DIRECTIONS - four crossed cells in the chart, Key's
  # and Ch's against Transmitted and Recognized. It is a 37-key instrument with no pressure
  # sensing at all.
  aftertouch: none
  pitch_bend:
    # **RECEIVED, SENT, AND SETTABLE - WHICH IS WHAT SEPARATES IT FROM THE CP.** The chart
    # circles Pitch Bend in both columns, and the system table carries the range at address
    # `00 00 0F`, printed as "Pitch Bend Range -24 - +24 (semitones)" (dl p. 4). The same
    # address is `reserved` on the CP, which is why that definition records `programmable:
    # false`.
    # The factory depth is a whole octave, which the supplement states and the Data List does
    # not: "Factory default setting: 12 semitones (one octave)" (supplement p. 6).
    semitones: 12
    programmable: true

controls:
  # **THE FOUR THAT WORK WHATEVER `MIDI Control` IS SET TO**, from the data format on sheet 2
  # rather than from the Control Change table. Two are received and never transmitted, which the
  # chart confirms cell by cell and the data format repeats by listing them under
  # `*RECEIVED CONTROL NUMBER` alone.
  modulation:                    {label: MODULATION, cc: 1, direction: receives}
  volume:                        {label: VOLUME, cc: 7, direction: receives}
  # **AND THESE TWO SHARE ONE SOCKET AND EXCLUDE EACH OTHER.** The chart marks both transmitted,
  # each under a footnote naming the setting that makes it so - and the setting has two values,
  # so an instrument sends one of them and never both. Out of the box it is this one.
  expression:                    {label: EXPRESSION, cc: 11}
  # What it sends depends on the pedal as well as on the switch: 0 or 127 with the factory
  # `FC4/5`, continuous with `FC3` - and half-damper does nothing to this instrument's own
  # sound, so the finer values are for something else to read. No bands are declared for it
  # because the received side takes the full range.
  sustain_switch:                {label: SUSTAIN SWITCH, cc: 64}

  # **AND THE SEVENTEEN THAT ANSWER ONLY WHILE `MIDI Control` IS ON**, which is the table's own
  # heading and the chart's footnote `*1`. The maker's own printed names, brackets and all.
  # The three five-way switches carry the values this instrument transmits; see the account for
  # why those rather than the ranges it recognises.
  lfo_assign:                    {label: LFO ASSIGN, cc: 78,
    choices: {"off": 0, "amp": 32, "filter": 64, "pitch": 95, "osc": 127}}
  lfo_depth:                     {label: LFO DEPTH, cc: 77}
  lfo_speed:                     {label: LFO SPEED, cc: 76}
  # **NOT A SELECTOR BUT A BAND AND A VALUE IN ONE CONTROL**: nought is polyphonic, and anything
  # above it is monophonic with that much portamento time. So these are bands rather than exact
  # values, which is the one place this instrument's table differs in shape from the CP's.
  portamento:                    {label: PORTAMENTO, cc: 20,
    values: {"poly": 0, "mono": 1}}
  osc_type:                      {label: OSC TYPE, cc: 80,
    choices: {"multi_saw": 0, "pulse": 32, "oscillator_sync": 64, "ring_modulation": 95,
      "frequency_modulation": 127}}
  osc_texture:                   {label: OSC TEXTURE, cc: 81}
  osc_mod:                       {label: OSC MOD (modulation), cc: 82}
  filter_cutoff:                 {label: FILTER CUTOFF, cc: 74}
  filter_resonance:              {label: FILTER RESONANCE, cc: 71}
  # The table prints this one with an en dash between the two envelopes it balances, which is
  # written here as a hyphen because that is what this corpus prints.
  eg_balance:                    {label: EG FEG - AEG (balance), cc: 83}
  eg_attack:                     {label: EG A (attack time), cc: 73}
  eg_decay:                      {label: EG D (decay time), cc: 75}
  eg_sustain:                    {label: EG S (sustain level), cc: 79}
  eg_release:                    {label: EG R (release time), cc: 72}
  effect_type:                   {label: EFFECT TYPE, cc: 17,
    choices: {"dist": 0, "cho_fla": 32, "phaser": 64, "delay": 95, "off": 127}}
  effect_depth:                  {label: EFFECT DEPTH, cc: 18}
  # Its own note says what the rate means, which is a different thing in each effect: "DIST:
  # tone" (dl p. 4), "CHO/FLA, PHASER: rate" (dl p. 4) and "DELAY: delay time" (dl p. 4).
  effect_rate:                   {label: EFFECT RATE, cc: 19}
