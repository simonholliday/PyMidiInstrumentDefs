midi:
  # 1 to 16, set by holding the pitch button and playing something - "the next MIDI channel
  # message received at Cascadia's MIDI input will set the MIDI channel" (manual p. 17) - or from
  # the maker's configuration program. In the MPE modes the channel setting disappears and up to
  # fifteen member channels are used instead.
  channels: [1, 16]
  # **IT ANSWERS TO MPE AND SOUNDS ONE NOTE.** "Although a monophonic instrument, Cascadia is
  # capable of responding to MPE data" (manual p. 101), so it receives MPE, and
  # `per_voice_channels` stays unrecorded: one voice cannot be spread across channels.
  mpe: receives
  # Answers to an incoming clock and generates one of its own. **Rests on the DIN output alone**;
  # see the account for the USB port, about which this manual says two different things.
  clock: both
  # A checked absence, and the one that could not have been established by counting hits.
  transport: none
  # **The field this whole instrument turns on.** Two jacks take whichever controller their owner
  # teaches them, over the full 0 to 127, so there is no factory map to publish - the reading
  # `teenage_engineering/op_1` established and `waldorf/iridium` carries alongside fifteen
  # published controls, as this one does alongside four.
  control_change: learned
  nrpn: none
  sysex: false
  program_change:
    receives: false
    sends: false

voice:
  addressing: pitches
  # One voice, which the manual says twice and in two ways. Two in Dual Mono mode, and the account
  # explains what that costs.
  polyphony: 1
  voicing_modes: [1, 2]
  velocity:
    # It arrives, and whether it is audible depends on a three-position panel switch whose shipped
    # position no edition prints. See the account - the manual itself describes the silence this
    # value exists to explain.
    note_on: gated
    note_off: false
  aftertouch: channel
  pitch_bend:
    # **Settable, and the shipped value is nowhere printed in four editions.** The maximum is
    # contradicted inside the current one, which the account settles; the default is simply absent.
    programmable: true

groups:
  # One group, because the maker's panel has one section that a controller reaches, and it is
  # printed `MIDI / CV` above the eight jacks these four controllers work through.
  midi_cv: MIDI / CV

controls:

  # THE TWO FIXED CONTROLLERS ------------------------------------------------
  # Not learnable and not reassignable, unlike everything else this instrument answers to.

  # Exact values rather than bands: the manual gives 127 and 0 and says nothing about anything
  # between them, so `choices` is the honest shape. A band would invent a boundary at 64.
  portamento:          {label: Portamento Control, cc: 65, choices: {"off": 0, "on": 127}, direction: receives, group: midi_cv}
  # 0 to about 1.1 seconds across the full range. No `unit`, because the range is in controller
  # values and not in seconds, and the seconds are in the account where they can be explained.
  portamento_time:     {label: Portamento Time MSB, cc: 5, direction: receives, group: midi_cv}

  # THE TWO FACTORY ASSIGNMENTS ----------------------------------------------
  # Each is the default source for one jack and can be changed to any controller in 0 to 127, or
  # to channel pressure. Each drives a jack that is patched to nothing until somebody patches it.
  # In Dual Mono mode both stop being controller destinations altogether.

  midi_cc_output:      {label: MIDI CC Output, cc: 2, direction: receives, group: midi_cv}
  midi_mod_output:     {label: MIDI MOD Output, cc: 1, direction: receives, group: midi_cv}
