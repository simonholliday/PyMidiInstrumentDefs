midi:
  # Sixteen, said twice. The MIDI tracks take "Any MIDI channel can be assigned to the MIDI tracks"
  # (manual p. 90) and "several tracks can share the same channel" (manual p. 90); the audio tracks' "TRIG CHANNEL sets which MIDI channels the
  # audio tracks respond and send data to" (manual p. 41), and "An OFF setting means the audio
  # track will not respond to, nor send out, any MIDI data" (manual p. 41) - so a track may have
  # no channel at all, which is why both parts below say `assigned`.
  channels: [1, 16]
  # BOTH, AND EACH DIRECTION IS ITS OWN SWITCH: "CLOCK SEND will when active make the MKII
  # transmit MIDI clock" (manual p. 40) and "CLOCK RECEIVE will when active make the Octatrack
  # MKII receive MIDI clock from external devices" (manual p. 40).
  clock: both
  # BOTH, LIKEWISE, AND THE MAKER NAMES THE MESSAGES: "TRANSPORT SEND will when active make the
  # Octatrack MKII send out system realtime messages like play, stop, continue and song position
  # pointer" (manual p. 40), against "TRANSPORT RECEIVE will when active make the Octatrack MKII
  # respond to system realtime messages like play, stop, continue and song position pointer"
  # (manual p. 40).
  transport: both
  program_change:
    # Two switches again: "PROG CH SEND will when checked send out program change MIDI messages
    # when the active pattern on the Octatrack MKII changes" (manual p. 40) and "PROG CH RECEIVE
    # will when checked make the Octatrack MKII listen and react to incoming program change
    # messages that changes the pattern on the Octatrack MKII" (manual p. 40).
    receives: true
    sends: true
    # WHAT A PROGRAM CHANGE REACHES IS A PATTERN, AND THE MANUAL COUNTS THEM: "Each project hosts
    # 16 banks and each bank hosts 16 patterns and 4 parts" (manual p. 17), "meaning 256 patterns
    # are always at hand" (manual p. 17). **That arithmetic is the maker's own**, which is worth
    # saying because the last instrument in this corpus got its own multiplication wrong.
    # 256 does not fit in a program change, and the manual does not say how the banks are reached.
    presets: 256
  # TRUE, AND FOR ONE PURPOSE ONLY, WHICH IS DIFFERENT FROM EVERY OTHER ELEKTRON HERE. The words
  # `system exclusive` appear nowhere in 148 pages and there is no dump menu; the single thing
  # this instrument does with system exclusive is take its own operating system - "Load the new OS
  # in an appropriate program capable of sending sysex files" (manual p. 112), and "The upgrade can
  # not be sent over the Octatrack's USB port" (manual p. 112), so over the five-pin ports and
  # nowhere else.
  # **THE OTHER NINE ELEKTRONS HERE RECORD `sysex: true` FOR A DUMP MENU THAT SENDS AND RECEIVES
  # PROJECT AND PATTERN DATA.** This one has no such menu, so the field is the same and what it
  # covers is not. Elektron's own Transfer software moves samples and projects over USB, and the
  # manual does not say what protocol that is.
  sysex: true
  # NOT RECORDED, AND THIS IS THE CLOSEST CALL IN THE FILE. **The words NRPN and RPN appear nowhere
  # in these 148 pages**, and Appendix C lists not one. That is more suggestive here than a bare
  # silence would be, because **this maker's newer manuals publish NRPN beside CC in the same
  # appendix form** - the Digitone's gives both for every row - so the absence of an NRPN column
  # in a document of the same house style is a difference worth noticing.
  # **It is still not a statement.** This appendix is a reference to what the instrument answers
  # to, not a chart with a column for what it does not, and this instrument is from 2010 - older
  # than the habit it is being compared against. So the field is left unset and the evidence is
  # here, which is the honest state rather than a guess in either direction.
  # `control_change` is left unset because two maps are published - see the controls below.

parts:
  # THE AUDIO TRACKS AND THE MIDI TRACKS, which is what the format means by a part: "An Octatrack
  # MKII pattern handles eight audio tracks and eight MIDI tracks" (manual p. 17), each with a
  # channel of its own. **This is not the maker's own word `part`** - a bank holds four of those
  # and they are saved settings, not channels.
  audio:
    label: Audio Track
    count: 8
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # Takes notes as well as controllers, and what a note does depends on a setting: "AUDIO NOTE
    # IN controls how incoming MIDI notes affect the audio tracks" (manual p. 40), with six note
    # mappings in Appendix C to choose between. A note may trigger a track, play a sample
    # chromatically, pick a slot, pick a slice, toggle a mute or set a delay time.
  midi:
    label: MIDI Track
    count: 8
    channel: assigned
    receives: [controls]
    # **THESE DO NOT SOUND**: "no sound is being generated by the MIDI tracks, only data that
    # transmitted through the MIDI OUT port" (manual p. 90) - the maker's own sentence, missing a
    # word and kept as printed. Each "can trigger a chord of up to 4 notes with adjustable
    # velocity and length, control pitch bend and aftertouch as well as 10 freely assignable
    # control change parameters" (manual p. 90).
    # NOT `notes`: what a MIDI track does with a note arriving on its own channel is a mixture
    # rather than a sounding - incoming notes "are mixed with the MIDI data sent by the track"
    # (manual p. 90) and arpeggiated - so only the controllers below are claimed.
  # AND THE TWO BLOCK EACH OTHER WHERE THEY SHARE A CHANNEL, which is a fact a player meets and
  # the format has nowhere to put: "If an audio track and a MIDI track share the same MIDI
  # channel, the MIDI track will block the audio track from sending out data while the audio track
  # will block the MIDI track from receiving data" (manual p. 90).
  # NOT A PART: the AUTO CHANNEL, which "is the MIDI channel giving access to the currently active
  # track" (manual p. 41). It is a route to whichever part is active rather than a part of its
  # own, and it is how C.8's map is reached.

voice:
  addressing: pitches
  # NOT RECORDED: the polyphony. **The word `voices` appears nowhere in these 148 pages.** This is
  # a sampler described entirely in tracks - eight audio tracks, each hosting one machine - and the
  # manual never says how many sounds one track may play at once, so there is no figure to record
  # and none is inferred. A count of tracks is not a count of voices.
  # ALSO NOT RECORDED: the note range, velocity and aftertouch. What the audio tracks do with an
  # incoming note is a choice between six mappings in Appendix C rather than a range, and the
  # widest of them is "C-1 (0) - G9 (127)" (manual p. 138) for the slot mapping, which is the whole of MIDI rather
  # than a property of the instrument. **The MIDI tracks' pitch bend and aftertouch are controls
  # below** - controllers 34 and 35 of the MIDI map - because what they set is a value the track
  # sends onward, not something this instrument's own voice answers to.

groups:
  # THE MAKER'S OWN PARAMETER PAGE NAMES, from sections 11.4 and 15.4, in the order those sections
  # print them: the audio track's pages first, then the MIDI track's.
  # **A CONTROL IS PLACED BY ITS MAP AND ITS OWN NAME TOGETHER, AND THE MAP IS NOT OPTIONAL.**
  # Appendix C reuses the audio map's page names in the MIDI map for different pages: `Amp param`
  # is the AMP page in C.7 and the **ARPEGGIATOR** page in C.8, where its six rows are glossed
  # Transpose, Legato, Mode, Speed, Octave Range and Arp Note Length - precisely what sections
  # 15.4.3 and 15.4.4 put there. `Playback param` is the SRC page in one and the NOTE page in the
  # other. So grouping on the prefix alone files the arpeggiator under the amplifier.
  track: Track
  src: SRC
  amp: Amp
  lfo: LFO
  fx1: FX1
  fx2: FX2
  recorder: Recorder
  scene: Scene
  note: Note
  arpeggiator: Arpeggiator
  midi_lfo: MIDI LFO
  ctrl_1: CTRL 1
  ctrl_2: CTRL 2
  midi_tracks: MIDI Tracks
  # **THREE CONTROLS GET NO PAGE**, all in the audio map: `Note on` and `Note off`, which send a
  # note rather than set a parameter, and `Send request`, which asks the instrument to resend its
  # own controller values. None belongs to a parameter page and the maker names none for them.

controls:

  # audio - Track ─────────────────────────────────────
  audio_track_level_7:         {label: Track level, cc: 7, direction: receives, part: audio, group: track}
  track_balance:               {label: Track balance, cc: 8, direction: receives, part: audio, group: track}
  audio_track_level_46:        {label: Track level, cc: 46, part: audio, group: track}
  cue_level:                   {label: Cue level, cc: 47, part: audio, group: track}
  crossfader:                  {label: Crossfader, cc: 48, part: audio, group: track}
  track_mute:                  {label: "Track Mute [0]=Unmuted, [1-127]=Muted", cc: 49, part: audio, group: track}
  track_solo:                  {label: "Track Solo [0]=No solo, [1-127]=Soloed", cc: 50, part: audio, group: track}
  track_cue:                   {label: "Track Cue [0]=Not Cued, [1-127]=Cued", cc: 51, part: audio, group: track}
  track_arm:                   {label: "Track Arm [0]=Trk disarm, [1-127]=Arm", cc: 52, part: audio, group: track}

  # audio - SRC ───────────────────────────────────────
  audio_playback_param_1:      {label: "Playback param #1", cc: 16, part: audio, group: src}
  audio_playback_param_2:      {label: "Playback param #2", cc: 17, part: audio, group: src}
  audio_playback_param_3:      {label: "Playback param #3", cc: 18, part: audio, group: src}
  audio_playback_param_4:      {label: "Playback param #4", cc: 19, part: audio, group: src}
  audio_playback_param_5:      {label: "Playback param #5", cc: 20, part: audio, group: src}
  audio_playback_param_6:      {label: "Playback param #6", cc: 21, part: audio, group: src}

  # audio - Amp ───────────────────────────────────────
  audio_amp_param_1:           {label: "Amp param #1 (Attack)", cc: 22, part: audio, group: amp}
