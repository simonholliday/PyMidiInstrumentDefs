midi:
  # "MIDI CHANNEL SELECTION. Move the four dip switches to select the incoming MIDI channel for
  # the synthesizer." (manual p. 9), with sixteen settings printed beside the switches, and the
  # specifications agree: "MIDI In/Out (soft Thru) 5-pin DIN/ 16 channels" (manual p. 25).
  channels: [1, 16]
  # NOT RECORDED, for want of the chart row that would carry it - **and the absence of that
  # chart is checked rather than assumed**, across all six documents and 112 sheets. See the
  # comment above the definition.
  # RECEIVES AND DOES NOT SEND, and the manual says what it does and does not do with it: "The
  # LFO will sync to the beat when receiving MIDI clock (it does nothing with MIDI time code)."
  # (manual p. 13). A rate control then picks the division, from four bars to a sixty-fourth.
  # It sends none, having no sequencer and no MIDI OUT.
  clock: receives
  # NOT RECORDED, the transport, and deliberately not `none`. See the account: the words Start,
  # Stop and Continue are on none of the 112 sheets, which says nothing is published rather than
  # that the instrument ignores them.
  # NOT RECORDED, program change: no page mentions it and this instrument has no patch memory
  # for one to select. `behringer/model_d` leaves the field out from the same position.
  # **A CHECKED ABSENCE WITH SOMETHING POSITIVE BEHIND IT, which is why this one says `none`.**
  # The word NRPN is on none of the 112 sheets, and the reason is not an omission: **this
  # instrument's parameter mechanism is system exclusive and the table of it is exhaustive**,
  # running to some forty commands over two pages. There is no non-registered parameter because
  # there is no need of one.
  nrpn: none
  # Abundantly. Two pages of Global Setting and Calibration commands, a software version request
  # and reply, and an editor application that talks to the instrument over USB.
  sysex: true

voice:
  addressing: pitches
  # NOT RECORDED, THE NOTE RANGE, AND THIS IS THE INTERESTING FIELD ON THIS INSTRUMENT. The
  # manual gives a span of 24 to 96 and then says a note outside it is **clamped rather than
  # silenced**. This format's `note_range` means silence outside it, so recording 24 to 96 here
  # would tell a consumer that notes 0 to 23 do nothing, where the maker says they all play C1.
  # The span is in the account above instead. **The first instrument in this corpus that clamps.**
  # MONOPHONIC AS IT SHIPS, AND PARAPHONIC IS A SETTING: "Set Paraphonic Mode F0 00 20 32 28 ID
  # 0A 0F MM F7 MM = 0-Monophonic, 1-Paraphonic. Default:0-Monophonic" (manual p. 27). What
  # paraphonic means here is two oscillators taking two pitches from one filter and one
  # amplifier, which the panel guide puts plainly - and the poly-chain section counts it: "Note
  # that a Neutron in Paraphonic mode will handle 2 notes." (manual p. 14).
  polyphony: 1
  paraphonic: true
  voicing_modes: [1, 2]
  velocity:
    # RECEIVED, AND WHAT IT REACHES IS THE PLAYER'S CHOICE rather than a fixed destination - the
    # filter, as one of four modulation sources, or the assignable control voltage jack. See the
    # account. Nothing here is gated by it, and it is not routed anywhere by default.
    note_on: received
    # NOT RECORDED, release velocity: no page mentions it. What the release note does say about
    # a note off is that **a note-on of velocity nought became one in 2.0.2**.
  # NOT RECORDED, THE AFTERTOUCH KIND, although aftertouch is plainly received - it is one of the
  # filter's four modulation sources and one of the assignable output's five options. No page
  # says whether that is channel pressure or polyphonic. Channel is the likely reading for a
  # monophonic instrument and a reading is not a statement. See the account.
  pitch_bend:
    # "Set Pitch Bend Range (*) F0 00 20 32 28 ID 0A 03 MM F7 MM = 0-24 (semitones). Default:2"
    # (manual p. 27), and the manual's own summary of the editor's options agrees: "Set pitch
    # bend range Select the pitch bend range from 0 to +/-24 semitones (two octaves)." (manual
    # p. 14). So the factory depth is two semitones and it can be set to anything up to 24.
    semitones: 2
    programmable: true

groups:
  # Two controls, so two groups would be one each and a reader learns nothing from either. The
  # MIDI specification's own sections are used, which is what `roland/fantom_6_7_8` does where a
  # map is the standard assignment - and these two are: controller 1 is Modulation and controller
  # 64 is the damper pedal, under the specification's names and at the specification's numbers.
  continuous: Continuous controllers
  switch: Switches and pedals

controls:

  # Continuous controllers ──────────────────────────────────
  # **THE ONLY FOURTEEN-BIT CONTROL IN THIS DEFINITION**, and the manual prints both halves:
  # "Modulation wheel or lever - MIDI CC 0x01 (MSB) & MIDI CC 0x21 (LSB)" (manual p. 27), which
  # is 1 and 33. Sending the coarse half alone is still a legal message.
  # AND IT GOES TO A SOCKET AS WELL AS TO THE SOUND: "This is routed to the assign out when
  # selected as the assign out option" (manual p. 27).
  modulation:                   {label: Modulation, cc: 1, lsb: 33, group: continuous}

  # Switches and pedals ────────────────────────────────────
  # "Damper Pedal on/off (Sustain) - MIDI CC 0x40" (manual p. 27), which is 64. **No threshold
  # is published**, so no bands are recorded: the manual names the two states in its label and
  # gives no number for either, and inventing 0 and 64 would put a figure here that no page
  # carries.
  # WHAT IT DOES ON RELEASE CHANGED IN 2.0.2, and the release note is the only place it is
  # described: "Releasing the sustain pedal now stops all notes, including those that still have
  # a key held" (release_note p. 1).
  sustain:                      {label: Damper Pedal on/off (Sustain), cc: 64, group: switch}
