    retrieved: 2026-10-04
    # **EVERY CONTROL IN THIS FILE COMES FROM PP. 139 TO 142.** 148 sheets, the printed folio
    # equal to the sheet on all of 4 to 147, not encrypted, with a real text layer, made with
    # Adobe InDesign 21.5 on 27 August 2026. The date is the PDF's own and the file name's, and
    # **not the support page's**, which says April 2021 - see the source account.
    # ITS INNER MARGIN SWAPS SIDE between an odd sheet and an even one, so the appendix's columns
    # are at different x positions on different sheets and have to be taken per sheet.
    # **AND IT CARRIES 309 SOFT HYPHENS**, which is what made `tools/check_quotations.py` fold
