    # two charts, a Chinese RoHS declaration, and the System Updater. No other MIDI document.
  release_notes:
    kind: release_notes
    title: volca drum System Updater
    edition: "1.14"
    dated: 2019-09-10
    landing: "https://www.korg.com/us/support/download/"
