# **THE USER'S MANUAL NEVER PRINTS A CONTROLLER NUMBER, AND THE DOCUMENT THAT DOES IS NOT
# PUBLISHED.** Fifty sheets of manual name no controller at all. All thirteen are on one sheet of
# the *MicroBrute Connection* manual, which is not on Arturia's downloads page: it ships **inside
# the Connection software archive**, and the only reason to look there is one sentence on sheet 48
# of the manual - "The "MicroBrute Connection" software and its dedicated User's Manual are freely
# downloadable from the ARTURIA website" (manual p. 48). **A manual that promises a second
# document is a lead, and the download page is not the only place a maker keeps one.**
#
# **AND THE EDITOR DOCUMENT ARTURIA SHIPS TODAY IS FOR OTHER INSTRUMENTS.** The downloads page
# offers the MIDI Control Center manual beside this instrument's files, and that manual names
# DrumBrute, BeatStep, KeyStep, MatrixBrute, KeyLab and MiniLab in thirty sheets and **never names
# the MicroBrute**. So `arturia/drumbrute_impact` cites it legitimately and this definition cannot:
# a document offered on an instrument's own page is not thereby about that instrument.
#
# **NOTHING LEAVES BY THE SOCKET, BECAUSE THERE IS ONLY ONE AND IT IS AN INPUT.** The connector
# list gives "MIDI Input................................Standard MIDI DIN-5" (manual p. 12) and no
# output, and in fifty sheets the words `MIDI Out` occur exactly once - describing the socket on
# somebody else's box, "your external MIDI device's MIDI Out connector" (manual p. 46). So every
# control below is `direction: receives`.
#
# **WHAT IT DOES SEND, IT SENDS OVER USB, AND VELOCITY IS THE CASE THAT MATTERS.** Two documents
# agree that velocity travels out and not in: "The MicroBrute will send velocity as a USB
# controller. It does not have internal velocity routing and does not respond to velocity
# however." (manual p. 32), and more plainly, "The MicroBrute does not receive or respond to
# velocity but it does send it." (connection p. 8). So `voice.velocity` records both halves:
# `note_on: ignored` for what it does with a velocity it is sent, and `transmits: true` for the
# velocity its keys send.
#
# **THE SENTENCE THAT WOULD SET THE POLYPHONY WRONG IS ABOUT THE KEYBOARD, NOT THE SYNTHESIZER.**
# "The keyboard can also be used as a fully polyphonic MIDI controller for other devices via the
# rear panel USB jack." (manual p. 42) - an analogue monosynth whose keys send chords to something
# else. What the instrument sounds is settled by a different sentence: "Low Note priority means if
# two notes are played at the same time, the lower note on the keyboard is prioritized and played."
# (connection p. 8). One of two notes is one note.
#
# **AND THE ABSENCES HERE WERE READ, NOT COUNTED** - the account below quotes the ordinary-English
# hits with their pages, so this note is only about the machinery.
# `Notes/4655_extract_microbrute.py` reads every occurrence of `Start`, `Stop`, `Continue`, `Local`
# and `Bank` and asserts how many are MIDI messages rather than how many there are, and its
# reader is **proved against seventeen hand-made sentences, seven of them real messages** - not by
# watching it pass on this document set, where the answer it should give is zero.
#
# The one it is allowed to find is `Local`, once, in the controller table: its test leans towards
# saying yes, because a false yes only makes an absence harder to claim while a false no would let
# one through.

definition: 1

model:
  manufacturer: Arturia
  name: MicroBrute
  # **1.0.4.114, AND WHAT IT CHANGED IS NOT PUBLISHED.** The downloads page serves
  # `MicroBrute_Firmware_Update_1_0_4_114.mbf`, dated 2017, with no release notes beside it. The
  # only release note Arturia ships for this instrument is inside the 2013 Connection archive and
  # describes the version before it - "First Public Release" (release_note), listing three known
  # issues, none about MIDI. **So the controller table below is documented against 1.0.3.2 and the
  # current firmware is four years later**, and whether those four years changed anything is a
  # thing nobody has said. The same shape as `korg/volca_fm`.
  firmware: 1.0.4.114
  # Checked 2026-10-06.

source: >-
  **THE CONTROLLERS ARE IN A DOCUMENT THAT SHIPS INSIDE A SOFTWARE ARCHIVE.** Thirteen numbers,
  102 to 114, all on connection p. 13 under the heading `Changing parameters via MIDI CCs` - and
  that manual is not a download on Arturia's page for this instrument. It is a file in
  `MicroBrute_1_0_3_2_win.zip`, found because the user's manual names it (manual p. 48). The
  archive's other two files are the firmware and a release note; its executable was not run.

  **THE TABLE WAS READ BY COORDINATE AND ITS FIFTEEN ROWS ARE NOT FIFTEEN CONTROLS.** Two of them
  are not controller numbers: the pitch bend range is reached by `RPN 06` and is recorded under
  `voice.pitch_bend`, and `Local ON/OFF` is controller 122, inside the Channel Mode range this
  library's validator refuses - the ruling `roland/fantom_6_7_8` set and every maker since has
  met. **And Arturia's own value text for that row is missing a word**: it prints `0 = or 127`,
  where the two state names should be. That is the document's typo and not a bad read, which the
  extraction script asserts by checking the row still says neither `On` nor `Off`.

  **WHAT THE THIRTEEN ARE FOR, WHICH IS NOT WHAT A PANEL CONTROL IS FOR.** Not one of them is a
  knob on the front of the instrument - no cutoff, no resonance, no envelope. They are the
  thirteen settings of the editor, reachable by controller so a sequencer can change them: "The
  MicroBrute allows you simple access to all the parameters found in the editor via easy to use
  MIDI CCs." (connection p. 13). The groups below are that editor's own four section headings.
  **And they do not persist**: "When parameters are changed using CCs, changes will be lost after
  a restart. To write changes to internal memory you have to use the editor." (connection p. 13) -
  so a consumer offering these should say they are for the session, not for the instrument.

  **ONE MIDI SOCKET, AND IT IS AN INPUT, SO NOTHING LEAVES BY DIN.** The connector list gives
  "MIDI Input................................Standard MIDI DIN-5" (manual p. 12) and no output,
  and "The MIDI In jack lets your MicroBrute be controlled from other MIDI devices." (manual
  p. 46). In fifty sheets the words `MIDI Out` occur exactly once, describing the socket on
  somebody else's box - "your external MIDI device's MIDI Out connector" (manual p. 46). So every
  control here is `direction: receives`, and a consumer can stop waiting for this instrument to
  report anything over a cable. **What it does send, it sends over USB**: the keyboard's notes,
  "a fully polyphonic MIDI controller for other devices via the rear panel USB jack" (manual
  p. 42), and velocity.

  **VELOCITY GOES OUT AND NOT IN, AND THE FILE SAYS BOTH.** "The MicroBrute does not receive or
  respond to velocity but it does send it." (connection p. 8), which the user's manual says twice
  in its own words: "The MicroBrute will send velocity as a USB controller. It does not have
  internal velocity routing and does not respond to velocity however." (manual p. 32). It
  transmits and does not recognise, so `voice.velocity.note_on` is `ignored` - send this
  instrument a velocity and nothing will happen - and `voice.velocity.transmits` is true. **And
  controller 112 sets the curve of the velocity it sends** - a parameter governing something it
  will never hear.

  **AND IT IS MONOPHONIC, THOUGH ONE SENTENCE READS LIKE THE OPPOSITE.** That `fully polyphonic
  MIDI controller` is the keyboard sending chords out of the USB socket, not the synthesiser
  sounding them. What it sounds is settled elsewhere: "Low Note priority means if two notes are
  played at the same time, the lower note on the keyboard is prioritized and played." (connection
  p. 8). One of two notes is one note. The word for it appears in neither document, so
  `polyphony: 1` rests on that behaviour rather than on a label - and controller 111 is the choice
  of which single note wins.

  THE CHANNELS, WHICH FACE OPPOSITE WAYS. "Receive Channel - this sets the channel that the
  MicroBrute will receive MIDI data on. You can choose individual channels or ALL channels."
  (connection p. 5) and "Transmit Channel - this sets the MIDI channel that the MicroBrute will
  send MIDI data on via USB." (connection p. 5). So one setting governs the DIN input and the
  other governs what the keyboard sends out of the USB socket, and both are controller-addressable
  - 102 taking `17=All` for omni and 103 taking only `1 to 16`.

  THE PITCH BEND, GIVEN THREE TIMES AND AGREEING EVERY TIME. "The Range of the Pitch bend defaults
  to 2 semitones." (manual p. 42); "The default pitch-bend range is set to +/- two semi-tones but
  it can be set to range from 1 semi-tone to 1octave +/-." (connection p. 7); and the `RPN 06` row
  with `1 to 12` (connection p. 13). Two documents, three statements, one answer - which is rarer
  in this corpus than a contradiction.

  **NOT RECORDED, AND EACH ONE IS A CHECKED ABSENCE OVER A NAMED SET OF SHEETS** - fifty of
  manual and fifteen of connection, squashed so a term broken across a line still matches. The
  words `Program Change`, `aftertouch`, `System Exclusive`, `SysEx`, `Song Position` and `Omni`
  appear nowhere in either. So this definition says nothing about preset changes, aftertouch or
  system exclusive: it is not that they are refused, it is that in sixty-five sheets the maker
  never raises them. **The firmware arrives as a `.mbf` file over USB and no document says how**,
  which is the one place system exclusive would be expected and is not found.

  **NOT RECORDED, THE TRANSPORT - AND IT IS THE ABSENCE A COUNTING SWEEP GETS WRONG.** `Start`
  appears twenty-nine times across the two documents and `Stop`, `Continue`, `Local` and `Bank`
  between them twelve more, and **not once as a MIDI message**. Every one is ordinary English:
  "Now start playing notes on the keyboard." (manual p. 23); "the LFO will start on power up"
  (connection p. 7); "The sequence will continue playing from the place where it stopped."
  (connection p. 5); "Please consult a local electrician" (manual p. 9); and "a price that will
  not break the bank" (manual p. 8), which is the manual's only `Bank`. A sweep that counted hits
  instead of reading them would have reported transport and bank select as documented here. So
  what the sequencer does on receiving Start or Stop is unestablished: all that is published is
  that it follows a clock.

  **AND THE THIRTEEN ARE DOCUMENTED AGAINST A FIRMWARE FOUR VERSIONS OLD.** The Connection manual
  describes 1.0.3.2, from November 2013; Arturia's current MicroBrute firmware is 1.0.4.114, from
  2017, and **publishes no release notes at all**. The only release note this instrument has is
  the first one, which says "First Public Release" (release_note) and nothing about MIDI. So
  whether those four years changed any of these numbers is a thing nobody has said, and a
  consumer should treat them as the best published account rather than as a current one.

  NOT RECORDED, the MIDI mode. No document names one, which is why `midi.mode` is absent - as it
  is from all six other Arturias here. The instrument is monophonic and can be set to receive on
  all channels, and the specification's word for that is Omni, which neither document uses.

  **NOT RECORDED, THE MODULATION WHEEL - AND THAT IS THE POINT.** The manual names it fifteen
  times and the words `CC 1` and `CC#1` appear in neither document. Its switch routes it to the
  filter cutoff or the LFO depth inside the instrument: "It sets the overall amount of modulation
  signal sent to targets selected by the MOD Wheel switch." (manual p. 42). **A wheel on a panel
  is not a controller number**, and nothing published says this one sends or answers to one.

