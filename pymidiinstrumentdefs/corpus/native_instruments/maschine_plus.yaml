    sha256: 9a56f6404f6a541d1368b80cc3717047ee761d9cd800122af340264d578f3955
    retrieved: 2026-10-04
    page_offset: 8
    # **LIVE AND NOT LINKED FROM THE DOWNLOADS PAGE**, which the instrument survey found and this
    # confirms. 215 sheets against 243, so the newer edition grew by 28 pages.
    # **Cited for nothing and read in full**, because the question it answers is whether the two
    # editions publish different controller numbers. They publish the same two, in the same words,
    # at printed pp. 35 and 83 here against 43 and 94 there. So the absence this definition records
    # is not an artefact of which edition was read.
  downloads_page:
    kind: download_page
    title: "MASCHINE Downloads"
    landing: "https://www.native-instruments.com/pages/maschine-downloads"
    url: "https://www.native-instruments.com/pages/maschine-downloads"
    sha256: c3876e2a61956c89e6d6beea27ba2110d3bd210d8c27e8f827c0976f198540fc
    retrieved: 2026-10-04
    paginated: false
    # The visible text of the page. **Cited for nothing** and saved for what it does not contain:
    # no Hardware Control Reference for this product, where five other Maschine products have one,
    # and **no Controller Editor manual at all**.
    # One thing about reading it: it lists documents for ten Maschine products at once, so a search
    # for a file name has to be filtered by product. Only `MASCHINE_Plus_*` is this instrument.
    # The sha256 is of the page's visible text; the page as served hashes to
    # 045a47111785ba4b3ecf1d8762a853c974902956114a10052e22e48015a4ae87.

midi:
  # PER SOUND AND PER GROUP, AND `All` IS THE DEFAULT: "Select the MIDI channel on which the Sound
  # or Group will receive MIDI notes. If you select All (default setting), the Sound or Group will
  # receive MIDI notes from all channels" (manual p. 166). So sixteen channels, each assignable to
  # a Sound or a Group - and the default is to listen on all of them, which is why the parts below
  # say `assigned` rather than deriving anything.
  channels: [1, 16]
  # BOTH, AND THE SETTING IS EXCLUSIVE, which is unusual enough to say. The maker gives a section
  # to each direction - "it can be controlled externally via MIDI Clock by any device that is
  # capable of sending MIDI Clock" (manual p. 17) and "If MASCHINE+ is running in Standalone mode,
  # it can send a MIDI Clock signal to any device capable of receiving MIDI Clock" (manual p. 18) -
  # but the settings page makes them one three-way choice: "Send Clock: Sends a MIDI Clock signal
  # to any device that is capable of receiving MIDI Clock" (manual p. 58) against "Receive Clock:
  # Receives external MIDI Clock signals and can then be controlled by any device capable of
  # sending MIDI Clock" (manual p. 58), with Off as the third. **So it does each and not both at
  # once**, which this field cannot say and this comment does.
  clock: both
  program_change:
    # RECEIVED, AND WHAT IT REACHES IS NOT A SOUND: "Selects the type of MIDI Change item you want
    # to trigger using Notes or Program Change MIDI messages from an external MIDI device" (manual
    # p. 60), where the items are Scenes, Sections and Lock snapshots, and "Program Change: Selects
    # Program Changes Note messages as the trigger for MIDI Changes" (manual p. 60) - the maker's
    # own sentence, with a word left in from the Note option above it. The channel is its own
    # setting: "Selects the MIDI channel number MASCHINE+ will receive MIDI notes or Program Change
    # messages" (manual p. 60).
    receives: true
    # NOT RECORDED, WHETHER IT SENDS ONE. A program change can leave this instrument, but only as
    # something the player assigned: "It is also possible to assign MIDI Control Change messages,
    # Pitchbend and Program Changes to Macro Controls in order to control external MIDI devices"
    # (manual p. 174). **That is the instrument sending a message the owner chose, not reporting
    # its own state**, which is what this field is about - so it is left unset rather than claimed.
    # ALSO NOT RECORDED: a preset count. A program change here selects a Scene, a Section or a Lock
    # snapshot, and the manual puts no number on how many of those a project may hold.
  # EVERY CONTROLLER NUMBER BUT TWO BELONGS TO THE PLAYER, and the maker says where they are
  # decided: "an application that allows you to precisely define all MIDI assignments for your
  # MASCHINE controller" (manual p. 19). Inside the instrument the Macro Controls are the same
  # thing (manual p. 174), and even the pedal socket "can also be configured to send Continuous
  # MIDI CC messages in the Preferences of the Controller Editor software" (manual p. 18).
  # **THE TWO CONTROLS BELOW ARE THE EXCEPTIONS AND NEITHER IS THIS MAKER'S CHOICE** - both are
  # numbers the MIDI specification had already spoken for. The Iridium and the Pulsar-23 are the
  # other definitions here that are `learned` and still carry the few numbers somebody fixed.
  control_change: learned
  # NOT RECORDED: NRPN, system exclusive and the mode. **The words NRPN, RPN, System Exclusive and
  # SysEx appear nowhere in either edition**, which is a checked absence; with no implementation
  # chart there is no form in this document that undertakes to deny them, so nothing is recorded.

parts:
  # SOUNDS AND GROUPS, WHICH IS HOW THIS INSTRUMENT IS ORGANISED AND HOW ITS MIDI IS ADDRESSED.
  # Each can be given a channel and a port of its own - "You can let particular Sounds and Groups
  # react to incoming MIDI data and send MIDI data to the desired port" (manual p. 17) - and the
  # default is neither: "By default, all MIDI data incoming on the activated MIDI input port(s)
  # will be received by the focused Sound of the focused Group" (manual p. 162).
  # **SO THE DEFAULT IS NOT A CHANNEL BUT A FOCUS**, which is unlike every other part in this
  # corpus: what answers is whichever Sound the player is looking at. Both parts say `assigned`
  # because a channel is something you give them, and neither has a default channel to record.
  sound:
    label: Sound
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # It sends too, and without needing a plug-in loaded: "MIDI notes corresponding to your hits
    # on the pads" (manual p. 163), and "if the Sound has no Plug-in it will forward any incoming
    # MIDI notes to its MIDI output" (manual p. 163).
  group:
    label: Group
    channel: assigned
    addressing: pitches
    receives: [notes]
    # A Group takes notes and not controllers: the MIDI page of the Input properties is where its
    # note input is configured, and the Output properties' MIDI page "is available for Sounds
    # only" (manual p. 163). So nothing claims a Group answers to a controller.
  # NOT A PART: the Master. It has Macro Controls and Channel properties like the others, and the
  # manual gives it no MIDI channel of its own.

voice:
  addressing: pitches
  # NOT RECORDED: the polyphony and the note range. **This instrument's sound is a project of
  # Groups and Sounds rather than a voice count**, and the manual gives no figure for either - no
  # maximum polyphony, and no range of notes it answers to. What it does give is a note *mapping*
  # for one case: a Group set to Drumkit mode places "each Sound on a specific key chromatically
  # across the keyboard starting from C2 upwards" (manual p. 166), which is where its notes land
  # and not how many it has.
  # ALSO NOT RECORDED: velocity and aftertouch. The pads are velocity-sensitive and the manual
  # describes what they send rather than what arrives, so nothing about reception is established.

groups:
  # The two sections of the instrument the two controls below belong to, named as the manual names
  # them. **Neither is a parameter page this maker publishes a map for**, because it publishes no
  # map: they are the places these two numbers are mentioned.
  smart_strip: Smart Strip
  sampler: Sampler

controls:

  # Smart Strip ─────────────────────────────────────────────
  # THE MAKER NAMING THE PROTOCOL'S OWN MEANING RATHER THAN CLAIMING A NUMBER: "The Smart Strip
  # always controls the parameter that is assigned to the standard MIDI CC #1. This MIDI Continuous
  # Controller is reserved for the modulation wheel" (manual p. 43). So in Modulation mode the
  # strip is a modulation wheel, and controller 1 is what it moves.
  modulation:                  {label: Modulation, cc: 1, group: smart_strip}

  # Sampler ─────────────────────────────────────────────────
  # **A CONTINUOUS PARAMETER ON A NUMBER THE SPECIFICATION DEFINES AS A SWITCH**, which the maker
  # does not remark on: "This can also be controlled by an external MIDI controller or keyboard
  # using the MIDI Control Change 64" (manual p. 94), of the Sampler's envelope Sustain, which
  # "Determines the constant level being kept after Decay until the note ends" (manual p. 94).
  # Controller 64 is the damper pedal. **Nothing here resolves that**; it is recorded as printed
  # because a player meets it as a surprise - a sustain pedal moving an envelope's sustain level.
  # Received only: the sentence is about what an external controller or keyboard can do to this
  # parameter, and no page says the instrument sends it.
  sustain:                     {label: Sustain, cc: 64, direction: receives, group: sampler}
