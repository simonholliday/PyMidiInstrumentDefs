# **THREE WHOLE IMPLEMENTATION CHARTS, AND THEY ARE NOT ALTERNATIVES.** `roland/ju_06a` and
# `korg/drumlogue` each met a maker printing two maps where only one is in force at a time, and
# the ruling there was to carry the one in force by default. **This instrument needs the opposite
# treatment**: its manual prints `MIDI implementation chart (Tone)` (manual p. 240),
# `MIDI implementation chart (Rhythm)` (manual p. 241) and
# `MIDI implementation chart (SYSTEM)` (manual p. 242), and **all three are in force at once**,
# because they describe three kinds of destination inside one instrument - four tone parts, one
# rhythm part, and the control channel that changes patterns.
#
# **AND ONLY THE TONE CHART HAS ANY CONTROL CHANGE AT ALL.** The rhythm chart reads
# "Control Change x x" (manual p. 241) and the SYSTEM chart "ControlChange x x"
# (manual p. 242). So the thirty-two controls below are the tone parts' controls, and **a reader
# addressing the rhythm part gets nothing from them** - a fact about this instrument that a
# single-chart definition could not state.
#
# **THE INSTRUMENT'S ONLY WAY OF SENDING CONTROLLER 1 IS TILTING THE BOX.** Controller 1 and
# channel pressure both carry footnote "*1 Can be transmitted from D-MOTION only"
# (manual p. 241), and D-MOTION is the motion sensor: its three choices are "AFT Channel
# aftertouch" (manual p. 72), "MOD Modulation (CC#01)" (manual p. 72) and "PIT Pitch bend"
# (manual p. 72). There is no
# modulation wheel on this instrument, so that footnote is the whole of how those messages leave
# it.
#
# **AND ONE FOOTNOTE IS CARRIED WITHOUT BEING RESOLVED.** "*2 Channel Key Pressure and all
# Control Change messages except for CC#0 and CC#32 are recognized depending on settings of
# MATRIX" (manual p. 241) - MATRIX being the modulation matrix, whose sources include "as well as
# external MIDI signals like control change messages" (manual p. 44). **Whether that gates the
# thirty-two named rows or adds further numbers to them is nowhere stated.** The table is
# unambiguous about which number means what, so the numbers are carried and the footnote is
# quoted whole rather than interpreted.

definition: 1

model:
  manufacturer: Roland
  name: SH-4d
  # **2.00, WHICH IS THE VERSION THE SUPPORT PAGE PUTS IN THE MANUAL'S OWN TITLE** -
  # `[English] SH-4d Owner's Manual (Version 2.00)` - and the newest system program offered for
  # the instrument is `SH-4d System Program ( Ver.2.00 )`, so the manual and the firmware agree.
  # The manual's own last sheet says "SH-4d Owner's Manual 03" (manual p. 244), which is the
  # document's revision and not the instrument's.
  firmware: "2.00"
  # A synthesizer, **still made**. Checked 2026-10-06.

source: >-
  **A 244-SHEET OWNER'S MANUAL AND NO SEPARATE MIDI DOCUMENT AT ALL.** Roland gave `roland/tb_3`
  a one-sheet chart and a six-sheet MIDI Implementation of its own; for this instrument the
  support page offers a quick start in eight languages and this manual, and nothing else. **The
  MIDI is sheets 240 to 243**, and the printed folio is the file sheet throughout.

  **THREE WHOLE CHARTS, IN FORCE AT THE SAME TIME**, one per kind of destination:
  "MIDI implementation chart (Tone)" (manual p. 240),
  "MIDI implementation chart (Rhythm)" (manual p. 241) and
  "MIDI implementation chart (SYSTEM)" (manual p. 242). **Only the first has any control change**
  - the other two cross the whole row - so every control below belongs to a tone part.

  **THE THIRTY-TWO ROWS ARE READ BY COORDINATE**, from the chart's own heading row at x=167
  `Transmitted`, x=296 `Recognized` and x=426 `Remarks`, because the footnote markers sit beside
  the marks and a flat reading joins them to the wrong row. **Twelve of the thirty-two carry the
  name the MIDI standard gives that number** - 1 modulation, 7 level, 10 pan, 64 hold, 65 and 84
  portamento, 66 sostenuto, 71 resonance, 72 release, 73 attack, 74 cutoff, 75 decay - which is
  the cheapest check there is that the rows were paired with the right names rather than one off.

  **THE BANK NUMBERS ARE PUBLISHED AND WHAT THEY SELECT IS NOT.** Every bank and program row of
  the tone and rhythm charts carries footnote "*3 See Sound List" (manual p. 241), and
  `Sound List` appears on sheets 241 and 242 and nowhere else in the 244 - that is, only in the
  footnotes naming it. No sound list is offered on the support page. So a reader can address bank
  87 program 12 and has nothing published that says what will sound, which is the shape
  `roland/tr_909` met with a leaflet.

  **AND THE PITCH BEND RANGE WAS NEARLY RECORDED AS ABSENT, BECAUSE THIS MAKER WRITES IT AS ONE
  WORD.** A search of all 244 sheets for `Bend Range` returns nothing; the parameter is
  "BendRange Up 0-48 Sets how much the pitch changes (in semitones) when the [PITCH +] button is
  pressed." (manual p. 43), with "BendRange Dw 0-48" (manual p. 43) beside it. A sweep that drops
  everything but letters and digits finds it at once, and an exact search does not. **So an
  absence has to be swept for with the text squashed**, which is the same fault as a ligature or
  a low line standing in for a letter.

  **AND WHAT THAT PARAMETER GOVERNS IS NOT FULLY SAID.** Both sentences describe the panel's
  `[PITCH +]` and `[PITCH -]` buttons, and the tone chart marks Pitch Bend in both columns
  without naming a depth. Nothing states whether a received pitch bend message bends by the same
  amount. `programmable: true` is carried because a settable bend range plainly exists; no
  `semitones` figure is carried, because 0-48 is the setting's range and no document gives the
  value in force.

