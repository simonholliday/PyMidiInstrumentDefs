    sha256: e5a5245d391348f15c9723b435292ecfab449db27b80bf9948a797200eb968b8
    retrieved: 2026-10-04
    page_offset: 0
    # One page. Its own stamp is "Date: Sep. 25, 2020" and "Version 1.60" (chart p. 1), and it
    # is headed "GROOVEBOX" and "Model: MC-101" (chart p. 1). **Every number below that is not
    # marked otherwise comes from this file.**
  chart_1_00:
    kind: midi_implementation
    title: MC-101 MIDI Implementation Chart
    edition: eng01
    dated: 2019-09-01
    landing: "https://www.roland.com/global/support/by_product/mc-101/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/MC-101_MIDIImpleChart_eng01_W.pdf"
