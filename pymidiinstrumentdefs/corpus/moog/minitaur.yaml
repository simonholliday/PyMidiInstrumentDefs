definition: 1

model:
  manufacturer: Moog Music
  name: Minitaur
  firmware: "2.1"
  # What this definition describes, from the addendum bound into its manual. Moog ships **2.2.1**
  # (checked 2026-10-01; its downloads data offers v2.2.0 and v2.2.1 packages, each holding
  # release notes, which the library now holds with provenance). What the notes say changed after
  # 2.1, read with their columns resolved by coordinates because their change log is one wide
  # artwork drawn three times rather than three pages of text:
  # v2.2.0 added RPN 2 coarse tuning over -64 to +63 semitones, and a system exclusive message
  # for the CV start note, "F0 04 08 23 18 00 nn F7, where nn = start note in hex", moving that
  # start note's default from 20 to 0. v2.2.1's two entries are a MIDI-sync LFO trigger fault and
  # an envelope-release fault, and whether they are faults it fixed or faults still open is not
  # settled by the document: they sit under a bare version heading in a change log, which says
  # fixed, and are phrased as present-tense symptoms where every other entry says "Fixed".
  # NO CONTROLLER NUMBER CHANGED between 2.1 and 2.2.1, so every number below still describes a
  # current instrument. The notes name no CC at all, and no NRPN, no bank select, no MIDI channel
  # and no velocity anywhere in either of them.

source: >-
  User manual (c)2012 pp. 21-24 for the control-change chart, and THE FIRMWARE v2.1 ADDENDUM AT
  pp. 31-34 OF THE SAME FILE. The addendum is not a separate document and never was: pages 31 to
  34 of this manual are headed "MOOG MINITAUR FIRMWARE v2.1 ADDENDUM", and its corrections are
  the section headed CORRECTIONS TO THE MANUAL on pp. 33-34. That was established on 2026-10-01;
  before then this file cited the addendum without knowing where it was.
  Two band boundaries below are those corrections and differ from the chart, and the addendum
  quotes the error it is fixing: "TRIGGER MODE - CC 73 (values) 0-42 (LEGATO ON), 43-85 (LEGATO
  OFF) 86-127 (EG RESET) [was incorrectly given as 85-127 in manual]", and "KEY PRIORITY - CC 91
  (values) 0-42 (LOW) 43-85 (HIGH) 86-127 (LAST) [was incorrectly given as 87-127 in manual]".
  So the chart leaves 85-86 unassigned for key priority, which is the printing error the addendum
  fixes -- and the widely shared Moog_Minitaur.midnam has it as 85, which is wrong.
  NOT RECORDED, and marked in place: the 22 bands of the LFO clock division and
  the 8 bands of bend up/down, for which the source gives only the first and
  last. The LSB of EG amount and filter KB tracking are deliberately omitted --
  see the note above those controls.

sources:
  manual:
    kind: manual
    title: Minitaur Manual
    landing: "https://www.moogmusic.com/downloads/?product=Minitaur&type=User+Manual"
    url: "https://cdn.inmusicbrands.com/Moog/Minitaur/Minitaur_Manual.pdf"
    sha256: 794eb65a62de6fadc6785ae8cfd28b222813ca1fbef9600b1c3cba394fbcc566
    retrieved: 2026-09-13
    page_offset: 2
    pages_per_sheet: 2
  release_notes:
    kind: release_notes
    title: Moog Minitaur Firmware v2.2.1 Release Notes
    edition: "v2.2.1, a change log back to v1.0.3"
    landing: "https://www.moogmusic.com/downloads/?product=Minitaur&type=Firmware%20Update"
    url: "https://cdn.inmusicbrands.com/Moog/Minitaur/Minitaur%20Firmware%20v2.2.1.zip"
    sha256: 81ce4cb2445a30c8b230bdeb8d36357f3d5aca6e3d98573277f60dd6416999b2
    retrieved: 2026-10-01
    page_offset: 0
    # Cited for the firmware Moog ships and for what changed around the one this definition
    # describes - no controller number among it. The sha256 is of the release notes PDF, which is
    # a member of the zip at the url above rather than a file Moog serves on its own:
    # "Minitaur Firmware v2.2.1/Minitaur Firmware v2.2.1 Release Notes.pdf". The zip hashes to
    # 462f8d3b153529822d27f05be575c2d04f837bd8b9e428168af5406f6e00d5d0 and re-extracting that
    # member reproduces the cited bytes, which was asserted rather than assumed.
    # NOT RECORDED, dated: the document prints no date of its own.
    # READ IT BY COORDINATES. Its change log is a single artwork about 1880 points wide, drawn on
    # each of three pages with a translation and a clip, so every page's content stream holds the
    # whole log and a plain reading returns it three times with the columns interleaved. Which
    # version a line belongs to is the x position of the heading above it, not reading order.
    # It defers to a document of its own for the firmware this definition describes: "See
    # separate v2_1 new-features documentation for complete details", in its v2.1.0 column. That
    # document is the addendum at pp. 31-34 of the manual above.

midi:
  channels: [1, 16]
  mode: 4                  # Omni off, Mono
  clock: receives
  program_change:
    receives: true
    presets: 94

voice:
  addressing: pitches
  # C-1 to C5, and the range this records is the PITCH range, which is the one a panel needs:
  # note 72 is as high as the oscillators go, "which is a hardware limitation" in the maker's
  # words. THE INSTRUMENT HAS TWO CEILINGS, and one field cannot hold both. From firmware 1.0.6,
  # "VCA Gate responds to MIDI notes above note 72 (VCO pitch still limited to note 72, which is
  # a hardware limitation)" (release notes, column 3 under the v1.0.6 heading) - so a note above
  # 72 is answered to, and sounds at 72 rather than not at all. From v2.1 the addendum's WRAP TOP
  # OCTAVE setting makes "a note which is above C5 ... play the equivalent pitch (C, D, E etc.)
  # in its top octave, instead of always playing the highest C for all notes above C5" (p. 33).
  # So on the firmware this describes, transposing a part above 72 sounds, and sounds wrong
  # rather than silent, which is the opposite way round from what this file said before 2026-10-01.
  note_range: [0, 72]
  polyphony: 1
  velocity:
    # Received, but it does nothing at all unless one of the two sensitivity
    # parameters is up. That is why a velocity lane can appear dead on a
    # correctly wired Minitaur.
    note_on: gated
    note_off: false
    gated_by: [filter_velocity_sensitivity, volume_velocity_sensitivity]
  aftertouch: none
  pitch_bend:
    semitones: 24
    programmable: true

controls:

  # ── Modulation ────────────────────────────────────────────────────────────

  lfo_rate:
    label: LFO Rate
    cc: 3
    lsb: 35
    group: modulation
  lfo_to_vco_amount:
    label: LFO to VCO Amount
    cc: 13
    lsb: 45
    group: modulation
  lfo_to_vcf_amount:
    label: LFO to VCF Amount
    cc: 12
    lsb: 44
    group: modulation
  lfo_midi_sync:
    label: LFO MIDI Sync
    cc: 87
    values: {internal: 0, midi_clock: 64}
    panel_only: true
    group: modulation
  lfo_sync_clock_division:
    label: LFO Sync Clock Division
    cc: 86
    # 22 divisions, from four whole notes (0-6) to a 1/64 triplet (122-127).
    # The source gives only the two ends, so the bands between them are not
    # recorded and are not guessed at here. It is left continuous rather than
    # declared a choice, because a choice with no states gives a panel nothing
    # to offer.
    panel_only: true
    group: modulation
  lfo_key_trigger:
    label: LFO Key Trigger
    cc: 82
    values: {"off": 0, "on": 64}
    panel_only: true
    group: modulation

  # ── Oscillators and glide ─────────────────────────────────────────────────

  vco_1_wave:
    label: VCO 1 Wave
    cc: 70
    values: {saw: 0, square: 64}
    group: oscillator
  vco_2_wave:
    label: VCO 2 Wave
    cc: 71
    values: {saw: 0, square: 64}
    group: oscillator
  vco_2_freq:
    label: VCO 2 Frequency
    cc: 17
    lsb: 49
    default: 64              # unison; plus or minus one octave
    group: oscillator
  vco_2_beat:
    label: VCO 2 Beat
    cc: 18
    lsb: 50
    default: 64              # plus or minus 50 cents
    panel_only: true
    group: oscillator
  note_sync:
    label: Note Sync
    cc: 81
    values: {"off": 0, "on": 64}
    panel_only: true
    group: oscillator
  glide_rate:
    label: Glide Rate
    cc: 5
    group: glide
  glide_switch:
    label: Glide
    cc: 65
    values: {"off": 0, "on": 64}
    group: glide
  glide_type:
    label: Glide Type
    cc: 92
    values: {lcr: 0, lct: 43, exp: 85}
    panel_only: true
    group: glide
  legato_glide:
    label: Legato Glide
    cc: 83
    values: {always: 0, legato_only: 64}
    panel_only: true
    group: glide

  # ── Mixer ─────────────────────────────────────────────────────────────────

  vco_1_level:
    label: VCO 1 Level
    cc: 15
    lsb: 47
    group: mixer
  vco_2_level:
    label: VCO 2 Level
    cc: 16
    lsb: 48
    group: mixer
  external_in_level:
    label: External In Level
    cc: 27
    lsb: 59
    default: 64              # up to 200%
    panel_only: true
    group: mixer

  # ── Filter ────────────────────────────────────────────────────────────────
  # EG amount and filter KB tracking are 7-bit only here on purpose. The manual
  # prints their LSBs as 50 and 54, but 50 is already VCO 2 Beat's LSB and the
  # manual's own stated rule (LSB = MSB + 32) would make them 54 and 52. Two of
  # the three cannot be right and the source does not settle it, so the coarse
  # numbers -- confirmed twice each -- are published and the fine ones are not.
  # A wrong LSB moves a different parameter silently, which is the one failure
  # this package exists to prevent.

  cutoff:
    label: Cutoff
    cc: 19
    lsb: 51
    unit: hz                 # 20 Hz to 20 kHz
    group: filter
  resonance:
    label: Resonance
    cc: 21
    lsb: 53
    group: filter
  eg_amount:
    label: EG Amount
    cc: 22
    group: filter
  filter_kb_tracking:
    label: Filter Keyboard Tracking
    cc: 20
    default: 32
    panel_only: true
    group: filter
  filter_velocity_sensitivity:
    label: Filter Velocity Sensitivity
    cc: 89
    default: 64
    panel_only: true
    group: filter

  # ── Envelopes ─────────────────────────────────────────────────────────────

  vcf_attack:
    label: VCF Attack
    cc: 23
    lsb: 55
    group: envelope
  vcf_decay_release:
    label: VCF Decay / Release
    cc: 24
    lsb: 56
    group: envelope
  vcf_sustain:
    label: VCF Sustain
    cc: 25
    lsb: 57
    group: envelope
  vca_attack:
    label: VCA Attack
    cc: 28
    lsb: 60
    group: envelope
  vca_decay_release:
    label: VCA Decay / Release
    cc: 29
    lsb: 61
    group: envelope
  vca_sustain:
    label: VCA Sustain
    cc: 30
    lsb: 62
    group: envelope
  release_switch:
    label: Release
    cc: 72
    values: {"off": 0, "on": 64}
    group: envelope
  trigger_mode:
    label: Trigger Mode
    cc: 73
    # Third band starts at 86, per the v2.1 addendum. The manual prints 85.
    values: {legato_on: 0, legato_off: 43, eg_reset: 86}
    panel_only: true
    group: envelope

  # ── Volume ────────────────────────────────────────────────────────────────

  vca_output_level:
    label: VCA Output Level
    cc: 7
    lsb: 39
    panel_only: true
    group: volume
  volume_velocity_sensitivity:
    label: Volume Velocity Sensitivity
    cc: 90
    default: 64              # 50%
    panel_only: true
    group: volume

  # ── Keyboard ──────────────────────────────────────────────────────────────

  key_priority:
    label: Key Priority
    cc: 91
    # Third band starts at 86, per the v2.1 addendum. The manual prints 87 and
    # leaves 85-86 assigned to nothing; the shared .midnam file says 85.
    values: {low: 0, high: 43, last: 86}
    panel_only: true
    group: keyboard

  # ── Performance ───────────────────────────────────────────────────────────

  mod_wheel:
    label: Mod Wheel
    cc: 1
    lsb: 33
    group: performance
  bend_up:
    label: Bend Up
    cc: 107
    # Eight bands of sixteen: 0-15 off, 16-31 two semitones, up to 112-127
    # twenty-four. The source gives the first, the second and the last, so the
    # five between them are not recorded, and the control is left continuous
    # for the same reason as the LFO clock division.
    panel_only: true
    group: performance
  bend_down:
    label: Bend Down
    cc: 108
    # The same eight bands as Bend Up.
    panel_only: true
    group: performance

# Local Control (CC 122), All Sound Off (120) and All Notes Off (123) are
# recognised, and are deliberately not listed here: they are the same on every
# instrument that has them, so they are specification facts and live in
# pymididefs.cc. Only what is particular to this model belongs in a definition.
