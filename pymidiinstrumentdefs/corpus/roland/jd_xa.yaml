  digital_vibrato_delay:                  {label: Vibrato Delay, cc: 78, direction: receives, part: digital, group: controllers}
  digital_reverb_send_level:              {label: Reverb Send Level, cc: 91, direction: receives, part: digital, group: controllers}

  # THE DIGITAL PARTS' CC ASSIGNMENTS (parameter_guide pp. 70 and 71), both ways: portamento, and
  # thirty parameters for each of three partials.
  digital_porta_time:                     {label: Porta Time, cc: 5, part: digital, group: portamento}
  partial_1_lfo_rate:                     {label: Partial 1 LFO Rate, cc: 16, part: digital, group: lfo}
  partial_2_lfo_rate:                     {label: Partial 2 LFO Rate, cc: 17, part: digital, group: lfo}
  partial_3_lfo_rate:                     {label: Partial 3 LFO Rate, cc: 18, part: digital, group: lfo}
  partial_1_lfo_fade_time:                {label: Partial 1 LFO Fade Time, nrpn: 6, part: digital, group: lfo}
  partial_2_lfo_fade_time:                {label: Partial 2 LFO Fade Time, nrpn: 7, part: digital, group: lfo}
  partial_3_lfo_fade_time:                {label: Partial 3 LFO Fade Time, nrpn: 8, part: digital, group: lfo}
