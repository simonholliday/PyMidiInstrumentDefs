midi:
  # A track takes "Any" channel or one of 1-16 for its input and its output alike (p. 54).
  channels: [1, 16]
  # THE MAPS ARE THE OWNER'S, by MIDI Learn inward and MIDI Control Mode outward, both saved with
  # the project (pp. 358, 368). The two numbers the guide gives an effect, 1 and 11, are in the
  # account and not carried - a choice, explained there.
  control_change: learned
  # Clock both ways; MIDI Time Code is the other choice of both settings, Ableton Link one more of
  # Receive's (p. 65).
  clock: both
  program_change:
    # "what an incoming MIDI program change message will change: a Sequence or Track" (p. 65).
    receives: true
    # "To select a MIDI program change value for the track to send" (p. 55).
    sends: true
  # NOT RECORDED: sysex and nrpn - neither word is anywhere in 545 pages or either set of notes.

voice:
  pitch_bend:
    # "Range Down / Range Up: Use these fields to determine the range of pitch bends in semitones."
    # (p. 66), with a Global Pitch Bend switch that overrides every track's own, and "Note: Pitch
    # Bend ranges are only applied to MPC instruments and not to third-party plugins." (p. 104).
    # THE RANGE THOSE FIELDS TAKE IS NOT PUBLISHED, so `semitones` holds nothing.
    programmable: true
  # NOT RECORDED: polyphony, aftertouch, velocity, the note map and the addressing. See the account.
