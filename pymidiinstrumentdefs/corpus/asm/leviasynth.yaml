  # Global ────────────────────────────────────────────────────
  # **THE SIX THE `Parameter TX / RX` SETTINGS CANNOT SWITCH OFF.** This module is the list
  # p. 153's footnote promises under a name the chart never uses - see the source account - so
  # these work whatever format the rest of the file is set to travel in.
  global_bank_select_msb:
    label: Global Bank select MSB
    cc: 0
    # The bank table's MSB column reads `00` on every one of its four rows (p. 151), so nought
    # is the only value this half ever carries. It is sent anyway, because the maker requires
    # both halves before a program change will leave the current bank.
    range: [0, 0]
    group: global
  global_modulation_wheel:     {label: Global Modulation wheel, cc: 1, group: global}
  global_master_volume:        {label: Global Master Volume, cc: 7, group: global}
  global_expression_pedal:     {label: Global Expression pedal, cc: 11, group: global}
  global_bank_select_lsb:
    label: Global Bank select LSB
    cc: 32
    # **THE MAKER PUBLISHES A VALUE PER BANK**, in a table of four rows on p. 151, which is why
    # this is a control here rather than a sentence under `program_change`. Twenty-three banks:
    # the eight Single banks A to H, then the Upper patches of the five Multis, then their Lower
    # patches, then the five Multis themselves.
    #
    # **THAT TABLE PRINTS EACH BAND THREE TIMES AND THE THREE DISAGREE.** Its MIDI CC column
    # counts from nought - `00-07`, `08-12`, `13-17`, `18-22` on its four rows (p. 151) - its
    # Decimal column from one, and **its Hexadecimal column does neither
    # consistently**: `00-07` and `08-0C` follow the MIDI CC column, `0D-12` spans six values
    # where there are five banks, and `13-17` is the Decimal column converted rather than the
    # MIDI CC one. The values below are the MIDI CC column's, which is what goes in the message;
    # a reader who takes the Decimal figure selects one bank too high every time, and the
    # Hexadecimal column cannot be used at all.
    range: [0, 22]
    choices:
      bank_a: 0
      bank_b: 1
      bank_c: 2
      bank_d: 3
      bank_e: 4
      bank_f: 5
      bank_g: 6
      bank_h: 7
      m1_upper: 8
      m2_upper: 9
      m3_upper: 10
      m4_upper: 11
      m5_upper: 12
      m1_lower: 13
      m2_lower: 14
      m3_lower: 15
      m4_lower: 16
      m5_lower: 17
      multi_1: 18
      multi_2: 19
      multi_3: 20
      multi_4: 21
      multi_5: 22
    group: global
  global_sustain_pedal:        {label: Global Sustain pedal, cc: 64, group: global}

