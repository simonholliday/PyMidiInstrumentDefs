  filter_base:                 {label: Base, cc: 84, nrpn: 179, part: audio, group: filter}
  filter_width:                {label: Width, cc: 85, nrpn: 180, part: audio, group: filter}
  filter_srr_routing:          {label: SRR Routing, cc: 88, nrpn: 182, part: audio, group: filter}

  # AMP ─────────────────────────────────────────────────────────────────
  amp_attack_time:             {label: Attack Time, cc: 78, nrpn: 152, part: audio, group: amp}
  amp_hold_time:               {label: Hold Time, cc: 79, nrpn: 153, part: audio, group: amp}
