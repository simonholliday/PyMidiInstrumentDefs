  track_1_lfo_amount:            {label: LFO Amount, cc: 38, part: track_1, group: lfo}
  track_1_lfo_shape:             {label: LFO Shape, cc: 39, part: track_1, group: lfo}
  # ---- track 2, SD, on base channel + 0
  track_2_level:                 {label: Level, cc: 9, part: track_2}
  track_2_mute:                  {label: Mute (>0 mutes trk), cc: 13, direction: receives, part: track_2}
  track_2_machine_parameter_1:   {label: Machine parameter 1, cc: 40, part: track_2, group: synthesis}
  # ---- track 3, HT, on base channel + 0
  track_3_level:                 {label: Level, cc: 10, part: track_3}
  track_3_mute:                  {label: Mute (>0 mutes trk), cc: 14, direction: receives, part: track_3}
  track_3_machine_parameter_1:   {label: Machine parameter 1, cc: 72, part: track_3, group: synthesis}
  # ---- track 4, MT, on base channel + 0
  track_4_level:                 {label: Level, cc: 11, part: track_4}
  track_4_mute:                  {label: Mute (>0 mutes trk), cc: 15, direction: receives, part: track_4}
  track_4_machine_parameter_1:   {label: Machine parameter 1, cc: 96, part: track_4, group: synthesis}
  # ---- track 5, LT, on base channel + 1
  track_5_level:                 {label: Level, cc: 8, part: track_5}
  track_5_mute:                  {label: Mute (>0 mutes trk), cc: 12, direction: receives, part: track_5}
  track_5_machine_parameter_1:   {label: Machine parameter 1, cc: 16, part: track_5, group: synthesis}
  # ---- track 6, CP, on base channel + 1
  track_6_level:                 {label: Level, cc: 9, part: track_6}
  track_6_mute:                  {label: Mute (>0 mutes trk), cc: 13, direction: receives, part: track_6}
  track_6_machine_parameter_1:   {label: Machine parameter 1, cc: 40, part: track_6, group: synthesis}
  # ---- track 7, RS, on base channel + 1
  track_7_level:                 {label: Level, cc: 10, part: track_7}
  track_7_mute:                  {label: Mute (>0 mutes trk), cc: 14, direction: receives, part: track_7}
  track_7_machine_parameter_1:   {label: Machine parameter 1, cc: 72, part: track_7, group: synthesis}
  # ---- track 8, CB, on base channel + 1
