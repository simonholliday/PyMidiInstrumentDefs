  download_page:
    kind: download_page
    title: Summit Downloads
    landing: "https://downloads.novationmusic.com/"
    url: "https://downloads.novationmusic.com/novation/synthesisers/summit"
    sha256: 0c22844bd9b37f2560699786dbdb3686c3f5ba86c0040a61c18eaad79e00f429
    retrieved: 2026-10-05
    paginated: false
    # Cited for what Novation publishes for this instrument and for what it does not. **The
    # English guide is the oldest numbered edition on the page**: v1.1, against eighteen
    # translations at v1.2 and a French one at V2. No programmer's reference and no separate MIDI
    # implementation are offered, unlike this maker's Circuit. The digest is of the extraction;
    # the served bytes are saved beside it as `.html`.

midi:
  # "MIDI protocol provides for 16 channels of data" (guide p. 41), and three settings choose
  # them: `PartA Chan`, `PartB Chan` and `Globl Chan`, each with a "Range of adjustment: 1 to 16"
  # (guide p. 41). **No default is recorded for the Global channel** - the figure beside that
  # paragraph prints `Globl Chan 1` and the overview says "MIDI Channel 1 is set as the active
  # channel for global synth data" (guide p. 15), while the paragraph itself gives the initial
  # value as 3, which is Part B's. Two statements against one, and the field holds a span anyway.
  channels: [1, 16]
  # RECEIVES, AND ONLY THAT IS ESTABLISHED. The clock source is a five-way setting choosing
  # between the internal clock and one "provided by an external device able to transmit MIDI
  # clock" (guide p. 34), and the LFOs, delay and arpeggiator all follow an incoming one.
  # Nothing in either document says this instrument sends a clock, so `both` would claim the
  # half that was not established.
  clock: receives
  program_change:
    # "This setting controls how Summit handles MIDI Program Change and Bank Change messages"
    # (guide p. 42), defaulting to Rec+Tran, with which "Summit sends a Program/Bank Change
    # message whenever a new Patch is loaded, and will also load a Patch when told to by an
    # external MIDI controller" (guide p. 42). Both directions, and both switchable independently
    # of the controllers, which have a setting of their own.
    receives: true
    sends: true
    # TWO BLOCKS OF 512, WHICH IS WHY THIS IS 1024. The memory holds "512 for Single Patches"
    # (guide p. 12) and 512 for Multi Patches, and "each consists of four Banks of 128" (guide
    # p. 12) designated A to D. Both halves of the count are stated twice and agree: p. 4 gives
    # 384 factory Patches of each kind "each arranged as three banks of 128" (guide p. 4) plus a
    # User bank of 128, and p. 12 gives "768 factory Patches" (guide p. 12) over Banks A to C.
    # **Which block a program change reaches is the Single or Multi mode the player is in**, not
    # a MIDI message, so 512 are addressable at a time and 1024 exist.
    presets: 1024
  # 115 OF THE 189 CONTROLS BELOW ARE ADDRESSED BY NRPN AND BY NOTHING ELSE, against 74 the
  # control changes reach. The maker still does not prefer either in words:
  # the Settings menu names them together as one switch, "CC/NRPN", with one value for both
  # (guide p. 42), so `supported` is as far as the documents go.
  nrpn: supported
  # Patches travel this way: "It is also possible to import Patch data into Summit via MIDI SysEx
  # messages, using applications such as SysEx Librarian (Mac) or MIDI-OX (Windows)" (guide
  # p. 45), and the Settings menu's backup page sends the current Patch, any of the eight Banks,
  # all of either block, the Settings, or everything (guide p. 44). No byte layout is published.
  sysex: true

voice:
  addressing: pitches
  # NO SINGLE FIGURE FOR THE WHOLE INSTRUMENT, and the maker gives the reason rather than leaving
  # one out: "When you select a Single Patch, Summit becomes a single synth with sixteen voices.
  # With Multi Patches, you still have sixteen voices, but now eight are allocated to generating
  # Part A and eight to Part B" (guide p. 22). The allocation is fixed rather than drawn from a
  # pool, so eight is a figure each part can count on and is recorded against each below.
  polyphony_shared: false
  # ONE OR SIXTEEN IN A SINGLE PATCH, because voicing is a setting saved with the Patch and
  # chosen per Part: five modes of which "three of the possible modes are mono and two are
  # polyphonic" (guide p. 22), and in Poly "up to 16 voices of a Single Patch can sound
  # simultaneously" (guide p. 22). In a Multi Patch the ceiling is the eight on each part below.
  voicing_modes: [1, 16]
  velocity:
    # IT ARRIVES AND DOES NOTHING UNTIL A PATCH TURNS IT UP. The Amp Envelope's Velocity
    # parameter has an initial value of 0, and "If set to zero, the volume is the same regardless
    # of how the keys are played" (guide p. 30). The two Modulation Envelopes carry the same
    # parameter at the same initial value. So a velocity lane can appear dead on a correctly
    # wired Summit, which is what this value is for, and `gated_by` names the three controls
    # that explain it. A global `VelCurve` (guide p. 44) shapes the keyboard's own response and
    # gates nothing.
    note_on: gated
    gated_by: [amp_envelope_velocity, mod_envelope_1_velocity, mod_envelope_2_velocity]
  # CHANNEL AFTERTOUCH FROM ITS OWN KEYBOARD, AND POLY ACCEPTED FROM OUTSIDE - one field, two
  # kinds, and the stronger one recorded. The modulation matrix's AftTouch source takes
  # "aftertouch, either from Summit's own keyboard or as external MIDI data" (guide p. 39), which
  # "is the most common type of aftertouch" (guide p. 39) - channel pressure - and "Summit will
  # also accept polyphonic aftertouch" (guide p. 39) from a controller that sends it. The
  # sending side is channel pressure only: "The keys, mod and pitch wheels and aftertouch send
  # MIDI data" (addendum p. 14). How hard the keyboard has to be pressed is itself settable,
  # `atouch_scale` below.
  aftertouch: poly
  pitch_bend:
    # TWELVE BY DEFAULT AND SETTABLE PER OSCILLATOR, which is unusual enough to say plainly:
    # there is no one bend range here but three, `Oscillator 1/2/3 Bend Range` below, each an
    # NRPN over 40-88 for -24 to +24. "The keyboard pitch wheel can vary the pitch of each of
    # the oscillators by up to two octaves" (guide p. 26) agrees with that span, and twelve is
    # where all three start - stated as "a default value of +12" (guide p. 26) and as the MIDI
    # list's 76, which is +12 on that range.
    semitones: 12
    programmable: true

parts:
  # THE TWO HALVES OF A MULTI PATCH, each given a channel of its own rather than deriving one:
  # "PartA Chan lets you select which MIDI channel is to be used for MIDI data relating to Part
  # A" (guide p. 41), and Part B's setting "operates described for as PartA Chan above" (guide
  # p. 41) - the maker's own words, and the transposition is theirs. The factory values are
  # channel 2 for Part A and 3 for Part B.
  #
  # **IN A SINGLE PATCH NEITHER IS ADDRESSED**: "No data is transmitted or received on the Single
  # MIDI channels when Summit is in Multi Patch mode" (guide p. 41) is the one direction, and
  # p. 46's table gives the other - a Single Patch transmits and receives "on the Global Channel
  # only" (guide p. 46), with the Parts marked "No data transmitted or received" (guide p. 46).
  # That is why every control below is unparted: the same parameter is reached on the Global
  # channel in Single mode and on a Part's channel in Multi mode, and which one is a mode rather
  # than a property of the control.
  #
  # **AND WHETHER THE GLOBAL CHANNEL ALSO REACHES A PART CHANGED IN FIRMWARE 2.1.** The guide's
  # table says Layer mode accepts Global-channel data, Split mode does not, and Dual mode does
  # only "if MULTIPART CONTROL is set to Both" (guide p. 46). The addendum replaces that for all
  # three: "Layer Mode - Both parts respond to MIDI received on the Global Channel" (addendum
  # p. 15), Split mode routes it to both engines by the split point, and Dual mode sends it to
  # the selected Part. The later document is what `receives` records.
  part_a:
    label: Part A
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]
    # "you still have sixteen voices, but now eight are allocated to generating Part A and eight
    # to Part B" (guide p. 22), and "Summit supports eight voices per Part" (guide p. 22).
    polyphony: 8
  part_b:
    label: Part B
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]
    polyphony: 8

