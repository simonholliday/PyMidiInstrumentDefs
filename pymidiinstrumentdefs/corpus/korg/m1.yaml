# THE ONLY DOCUMENT KORG PUBLISHES FOR THIS INSTRUMENT IS A SCAN WITH NO TEXT IN IT AT ALL.
# 138 sheets, one image per sheet, **zero text characters** by both `pypdf` and PyMuPDF, and
# `pypdf` reports it encrypted besides. So **no machine in this project can read a number out of
# it**, the citation checker cannot follow a page, and the quotation checker reports every
# quotation below as one it could not check. Every figure here was read by eye off a rendered
# image, twice, by two readers rendering with different tools.
#
# THAT IS NOT A REASON TO LOWER THE STANDARD, and the procedure is unchanged: the two readings were
# independent, every number is traced to a printed page, and where the scan is ambiguous this
# file says so. `roland/juno_106` was read the same way, off a 1984 photograph.
#
# **`file(1)` SAYS THIS DOCUMENT HAS 13 PAGES. IT HAS 138.** Both `pypdf` and PyMuPDF agree on
# 138, and the sheets themselves number to 137. A page count from `file` is worth nothing, which
# this corpus has now met often enough to stop checking any other way.
#
# WHAT THE INSTRUMENT ANSWERS TO IS ALMOST NOTHING, AND THAT IS THE FINDING. The chart lists ten
# control change numbers and **six of them are how an RPN travels** - data entry, increment,
# decrement and the two halves of the RPN for master tune. Four are parameters. Everything else
# about this synthesiser is reached by system exclusive: "Parameter change by system exclusive is
# used to edit Programs with the use of a computer" (p. 116). A 1988 workstation with 100
# programs and an eight-track sequencer publishes four controller numbers.

definition: 1

model:
  manufacturer: Korg
  name: M1
  # NOT RECORDED: firmware. The manual names no version of the instrument's software anywhere,
  # and Korg publishes no update history for a model it stopped making in 1995. The document's
  # own identifier is "E 4", which is its `/Subject` and the `_E4` in its file name - an edition
  # of the manual, not of the instrument.

source: >-
  M1 Owner's Manual, 138 sheets, which is **the whole of what Korg publishes about this
  instrument's MIDI**: the M1 MIDI Implementation Chart is its p. 135, the specifications its
  p. 134, the MIDI settings in Global Mode its pp. 115-118, the eight-timbre Multi mode its
  pp. 72-73, and system exclusive its pp. 122-131. Korg's download page is cited for what else
  it offers and for the instrument being out of production.

  **EVERY NUMBER BELOW WAS READ BY EYE AND NO GATE CAN CHECK ONE OF THEM.** The manual is a pure
  scan - 138 images, no text layer, nothing for `pypdf` or PyMuPDF to extract - so
  `check_citations.py` reports its numbers as not checkable and `check_quotations.py` reports
  every quotation here as one it could not read. **The quotations are still exact**, transcribed
  from the rendered page, and the pages are cited so a reader can turn to them. `yamaha/dx7` is
  the other definition in this corpus with that property and `roland/juno_106` was read the same
  way.

  THE CHART IS COMPLETE AND LEGIBLE, which is the good news. "M1 MIDI IMPLEMENTATION CHART"
  (p. 135) has every conventional row filled in, four footnotes and two lettered remarks, and
  nothing in it was hard to read at 110 dots per inch.

  TEN CONTROL CHANGE NUMBERS ARE LISTED AND FOUR ARE PARAMETERS. The chart's Control Change
  block gives 1 "Pitch MG", 2 "VDF modulation", 6 "Data entry (MSB)", 7 "Volume", 38 "Data entry
  (LSB)", 64 "Sustain", 96 "Data increment", 97 "Data decrement", 100 "LSB of RPC for master
  tune" and 101 "MSB of RPC for master tune". **Six of those ten are how a registered parameter
  travels**, not parameters themselves, and they are held back exactly as `oberheim/teo_5` and
  `oberheim/ob_x8` hold theirs back. 100 and 101 are also the only two rows in the whole block
  marked transmitted "x" and "Recognized" "o", so the instrument answers to them and never sends
  them - which is what an RPN target looks like.

  AND AN ELEVENTH ROW IS NOT A CONTROL AT ALL. Under the ten, the chart prints "0-101" against
  "Sending and receiving Seq. Data only". That is the sequencer passing control changes through,
  not the synthesiser answering to them, and **nothing in the range 0 to 101 is a control here
  beyond the four above**. It is recorded in this account rather than as a control, because a
  consumer that read it as one would offer 102 controllers that do nothing to the sound.

  EVERYTHING ELSE IS SYSTEM EXCLUSIVE, which the manual says in as many words: "Parameter change
  by system exclusive is used to edit Programs with the use of a computer" (p. 116). The
  exclusive section runs from p. 122 to p. 131 and defines twenty-nine numbered message types.
  **This format holds none of them**, as it holds none of `behringer/model_d`'s, and the four
  controls above are the whole of what a panel can send this instrument without them.

  FOUR GLOBAL SWITCHES DECIDE WHETHER ANY OF IT ARRIVES, AND THEY DO NOT DIVIDE THE WAY A
  READER WOULD GUESS. "MIDI FILTERING" (p. 116) has Combination/Program Change, After Touch,
  Control Change and Exclusive, each "DIS/ENA", and "When set to DIS, the selected MIDI data is
  not received or sent." The chart's footnotes then put each row under one of them - **and the
  ten control change numbers are split between two different switches**. The four published
  below are marked "Transmit/receive if CONTROL is set to ENA in GLOBAL Mode", and **so is pitch
  bend**; the six held back - data entry, increment, decrement and the two halves of the RPN -
  are marked "Transmit/receive if EXCLUSIVE is set to ENA in GLOBAL Mode", because on this
  instrument they are the machinery of parameter editing rather than performance control. A
  definition that treats all ten as ordinary controllers names the wrong switch for six of them.
  **So every field below is what the instrument does with its switches on**, which is a
  condition this format cannot carry and the chart states four times.

  AND THE DOCUMENT CONTRADICTS ITSELF ABOUT WHICH SWITCH GOVERNS AFTERTOUCH. The chart's
  lettered remark says channel pressure is gated by the AFTER TOUCH filter: "Transmit/receive
  when AFTER TOUCH is set to ENA in GLOBAL Mode". The system exclusive section's own tables give
  "Channel Pressure ( After Touch )" the enable code "C", which that section defines as "Enable
  when Control is On" - and its key has no code for the AFTER TOUCH filter at all, defining only
  A, C, P, E and Q. **Both readers checked the letter at full resolution and it is a C.** One of
  the two statements is wrong and nothing in the manual says which, so neither is recorded as
  fact and `aftertouch` below records only that it is the channel kind.

  THE BULK DUMP IS AN EXCEPTION TO THE EXCLUSIVE SWITCH, which the chart does not say and the
  Global page does: "MIDI data dump can be sent and received when this page is selected
  regardless of the Exclusive parameter setting of F 5 -2, MIDI Filtering" (p. 118). So the
  chart's footnote is true of parameter change and untrue of a dump.

  THE CLOCK AND THE TRANSPORT GO ONE WAY AT A TIME, AND WHICH WAY IS A SETTING. The chart marks
  both "o" in both columns with the footnote "When Clock is Internal, it transmits but does not
  receive. When External, the opposite is true." The Global page agrees from the other side:
  Clock Source is "INT/EXT", and "The M1 will receive start, stop, continue, song select, and
  song position data from external MIDI devices only when this function is set to EXT" (p. 115).
  So `both` records the pair of settings and not a simultaneous capability.

  EIGHT TIMBRES, EACH WITH ITS OWN MIDI CHANNEL, AND A GLOBAL CHANNEL THAT IS NOT ONE OF THEM.
  "Selection of the MIDI receive channel of each Timbre" over eight rows of "1 ~ 16" (p. 73), and
  "Playing eight separate Programs simultaneously is possible with multi-channel MIDI data
  received through MIDI IN, when a different MIDI channel is set for each Timbre" (p. 73).
  **What reaches a timbre is stated**: "Program change, pitch bend, after touch and control
  change parameters receive data over the MIDI channel set for each Timbre" (p. 73). The global
  channel is separate and governs the keyboard: "When playing the keyboard of the M1, only the
  Timbres which are set to the same channel as the MIDI Global channel (GLOBAL Mode, F 5-1) will
  sound" (p. 73), and "Real time performance controls such as joy stick and after touch affect
  only the Timbres whose channels are the same as the Global channel" (p. 73).

  THE PRESET COUNT IS A SETTING AND 100 IS ONE OF ITS TWO VALUES. "100 Programs" and "100
  Combinations" in the specifications (p. 134), footnoted "Memory allocation can be changed to 50
  Programs and 50 Combinations" - and the Global page offers "100 PROG/100 COMBI/4400 SEQ" or
  "50 PROG/50 COMBI/7700 SEQ" (p. 117). 100 is recorded because the chart agrees with it from the
  other side, "Program Change Actual No." being "0 ~ 99" transmitted; **a reader whose instrument
  is set the other way has fifty.**

  NOT RECORDED: `nrpn`. **The chart has no NRPN row at all, and controllers 98 and 99 appear
  nowhere in the document** - the received-data table steps straight from 97 to 100. What the
  instrument has is one RPN, and it reaches exactly one parameter: control changes 100 and 101
  are "LSB of RPC for master tune" and "MSB of RPC for master tune", RPC being Korg's spelling of
  RPN, and the exclusive section prints their value bytes as fixed - "RPC Parameter No.(LSB)
  (M.Tune)" against 1 and "RPC Parameter No.(MSB) (M.Tune)" against 0. **That is RPN 0,1, which
  is the MIDI specification's own Master Fine Tuning**, and the chart marks both numbers
  transmitted "x", so the instrument answers to it and never sends it. The parameter it moves is
  Global "Master Tune", "-50 ~ +50" in cents (p. 110). An absence with pages behind it rather
  than an unread one.

  SIX MORE CONTROLLER NUMBERS EXIST INSIDE THE INSTRUMENT AND NEVER CROSS THE CABLE. The
  sequencer's event editor lists control numbers 102 to 107 - VDF Cutoff, two effect switches,
  two effect controls and Tempo Change - and says of them: "**MIDI does not input or output 102
  to 107**" (p. 105). That is why the chart's pass-through row stops at 101. **A reader who finds
  that table and publishes `cc: 102` for VDF Cutoff would be publishing a number the instrument
  cannot hear**, which is the most likely way to get this definition wrong, and it is recorded
  here because the table is forty pages from the chart that contradicts it.

  NOT RECORDED: `pitch_bend`. The chart marks pitch bend "o" both ways and **no page in the
  manual gives a bend range in semitones**, searched for through the Global, Program and
  Combination sections. The joystick's own range is a Program parameter and is not stated as a
  MIDI quantity.

  NOT RECORDED: a drum note map. The M1 has four Drum Kits of up to 30 sounds, and **the key each
  sound sits on is set by the player**: "Key sets the key (C0 to G8) to which the sound is
  assigned" (p. 114), with "Two or more sounds cannot be assigned to the same key". So there is
  no factory map to publish, which is the same state as `soma/pulsar_23` reached by a different
  road - that instrument learns its notes, this one has them assigned in a menu.

sources:
  manual:
    kind: manual
    title: M1 Owner's Manual
    edition: E 4
    landing: "https://www.korg.com/us/support/download/product/1/139/"
    url: "https://cdn.korg.com/us/support/download/files/e223761dc7dee38a7c3c76983ddf2ea1.pdf"
    sha256: 6882c3cb2e62f4ef00a1366f327833bcab04a0134de040c74a4585e9e38cbf20
    retrieved: 2026-10-04
    # Printed page plus one is the sheet: the cover is unnumbered and everything after it runs
    # one behind. The edition is the document's own `/Subject`, "E 4", which is also the `_E4`
    # in Korg's file name; the manual's pages carry no edition statement.
    page_offset: 1
  download_page:
    kind: download_page
    title: "Downloads | M1 | KORG (USA)"
    landing: "https://www.korg.com/us/support/download/product/1/139/"
    url: "https://www.korg.com/us/support/download/product/1/139/"
    sha256: a13b69f995a966c55affc9983c22f50ca18d05d8700740d2542cac0a59c69531
    retrieved: 2026-10-04
    paginated: false
    # The digest is of the page's visible text as saved on 2026-10-04. **This is the nearest
    # thing Korg has to a product page for the M1**: it heads the model "（sold out）" and offers
    # five documents and one software download. There is no specification page, which is why
    # every figure below comes from the manual.

midi:
  # "Basic Channel Default 1 ~ 16 / 1 ~ 16, Change 1 ~ 16 / 1 ~ 16", remarked "Memorized"
  # (p. 135). The Global page is the same setting from the other side: "Channel 1-16,
  # Input/Output channel of internal play data" (p. 115).
  channels: [1, 16]
  # **ONLY THE RECOGNIZED COLUMN GIVES A MODE.** The chart's Mode Default row is "x" transmitted
  # against "3" under "Recognized", and its Messages row is blank transmitted against "x". So
  # the instrument powers up in mode 3 - OMNI OFF, POLY, by the chart's own key - and does not
  # say what it transmits.
  mode: 3
  # BOTH, BY A SETTING THAT CHOOSES WHICH. "When Clock is Internal, it transmits but does not
  # receive. When External, the opposite is true" (p. 135). See the source account.
  clock: both
  # BOTH, ON THE SAME SETTING. Song position, song select and the real-time commands are all "o"
  # in both columns under the same footnote, and the Global page says the M1 "will receive start,
  # stop, continue, song select, and song position data from external MIDI devices only when
  # this function is set to EXT" (p. 115). Song select is bounded: "o 0 ~ 19" both ways.
  transport: both
  program_change:
    # "Program Change Actual No." is "o 0 ~ 99" transmitted and "o 0 ~ 127" under "Recognized" over
    # "0 ~ 99" (p. 135) - so it answers to the whole range and uses the first hundred of it.
    # **AND WHAT IT DOES WITH THE REST IS STATED**: a number above 99 has 100 taken off it, "ex.
    # 100 -> 00, 127 -> 27" (p. 123), and where the memory is allocated the other way 50 is taken
    # off repeatedly instead. So nothing in 0 to 127 is refused.
    receives: true
    sends: true
    # 100, and it is one of two values the player chooses: see the source account.
    presets: 100
  # NOT RECORDED: nrpn. The chart has no NRPN row; what it has is an RPN. See the source account.
  # "System Exclusive o / o" (p. 135), footnoted "Dumps and edits the Program data. Compatible
  # with universal exclusive (Device ID)" - and it is how every parameter but the four below is
  # reached.
  sysex: true

voice:
  addressing: pitches
  # "16 voice, 16 oscillator (Single mode)" and "8 voice, 16 oscillator (Double mode)" (p. 134).
  # Sixteen is the figure a player gets unless a Program uses two oscillators per voice, so it is
  # the default and both are listed.
  polyphony: 16
  voicing_modes: [8, 16]
  # TRUE, AND THE MAKER HAS A NAME FOR IT: "8 tracks, 8-timbre multi-timbral operation (Dynamic
  # Voice Allocation)" (p. 134). The eight timbres draw on the one pool of sixteen rather than
  # owning two each, so no timbre below carries a figure of its own.
  polyphony_shared: true
  # "0 ~ 127" under "Recognized", in both the Note number row and the Sound range row beneath it
  # (p. 135). The keyboard sends less than it answers to - "24 ~ 108" transmitted - which is the
  # 61 keys plus the transpose range, and is a fact about the keyboard rather than about what
  # arrives.
  note_range: [0, 127]
  velocity:
    # "Velocity Note on o 9n, V=10 ~ 127" transmitted against "o 9n, V=1 ~ 127" received, and
    # **note off is "x" in both columns** (p. 135). So a release velocity is neither sent nor
    # answered to. The keyboard's own floor is 10 where it answers down to 1.
    note_on: received
    note_off: false
  # CHANNEL, AND THE CHART IS EXPLICIT: "After Touch Keys x / x" against "Ch's o / o" (p. 135).
  # Polyphonic key pressure is refused in both directions, which is a denial rather than a
  # silence. Remarked "Transmit/receive when AFTER TOUCH is set to ENA in GLOBAL Mode".
  aftertouch: channel
  # NOT RECORDED: pitch_bend. Marked "o" both ways with no range anywhere in the manual.

parts:
  # EIGHT TIMBRES, EACH WITH ITS OWN RECEIVE CHANNEL. **These are the Combination mode's Multi
  # type, and the sequencer's eight Tracks are a different mechanism with the same count** - the
  # tracks have playback channels and a four-way "OFF/EXT/INT/ON" status (p. 87) where the
  # timbres have receive channels and four DIS/ENA switches. Both are eight parts on sixteen
  # shared voices, so the shape below is true of either, but they are configured on different
  # pages and only the timbres are described here.
  # The channel is the player's to set - "Selection of the MIDI receive channel
  # of each Timbre", eight rows of "1 ~ 16" (p. 73) - so none is recorded here.
  # **WHAT EACH ONE ANSWERS TO IS STATED RATHER THAN ASSUMED**: "Program change, pitch bend,
  # after touch and control change parameters receive data over the MIDI channel set for each
  # Timbre" (p. 73). Each timbre also has its own switch for program change, damper, after touch
  # and control change (p. 72), so a timbre can be made deaf to any of them.
  # The keyboard reaches only some of them: "When playing the keyboard of the M1, only the
  # Timbres which are set to the same channel as the MIDI Global channel (GLOBAL Mode, F 5-1)
  # will sound" (p. 73).
  timbre_1:
    label: Timbre 1
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_2:
    label: Timbre 2
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_3:
    label: Timbre 3
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_4:
    label: Timbre 4
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_5:
    label: Timbre 5
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_6:
    label: Timbre 6
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_7:
    label: Timbre 7
    channel: assigned
    receives: [notes, controls, program_change]
  timbre_8:
    label: Timbre 8
    channel: assigned
    receives: [notes, controls, program_change]

# FOUR CONTROLS, AND THE LABELS ARE THE CHART'S OWN REMARKS. The chart's Control Change block
# names each number in its Remarks column and that is the only name this instrument's MIDI
# implementation gives them. Every one is marked "o" in both columns, so all four travel each
# way, and all four are subject to the Control Change filter being set to ENA.
# **TWO OF THE FOUR ARE ONE JOYSTICK**, which the chart's abbreviations hide and the system
# exclusive section spells out: controller 1 is "Pitch Modulation ( Joy Stick(+Y) )" and
# controller 2 is "VDF Modulation ( Joy Stick(-Y) )" (p. 122). They are the two directions of
# one axis, not a modulation wheel, and a panel that labels controller 1 "Modulation Wheel"
# would be wrong about the control and about what it does.
#
# AND CONTROLLER 64 IS PRINTED UNDER THREE NAMES in this one manual - "Sustain" in the chart,
# "Damper Off" and "Damper On ( Damper Pedal )" in the exclusive section with the data bytes
# written out, and "Damper Switch" in the sequencer's event editor. The chart's name is kept
# below because the chart is this instrument's MIDI implementation.
controls:
  pitch_mg:       {label: Pitch MG, cc: 1}
  vdf_modulation: {label: VDF modulation, cc: 2}
  volume:         {label: Volume, cc: 7}
  sustain:        {label: Sustain, cc: 64}
