    sha256: e28fd0529337bcc1609ba54c3d5176357554897e36d815514dc09745ab7cff8c
    retrieved: 2026-10-11
    # A SCAN: 58 pages, each one image 1728 by 2208 and no text, made by HyperGEAR's PDF library.
    # **CITED BY PAGE WITH `page_offset: 0`**: the printed folio is the page of the file on every
    # page from 5 to 49, which is every numbered page cited. The chart, the operation table and the
    # MIDI implementation print none, so they are cited by their place in the file: the chart on
    # 50, the table on 51 to 54, the implementation on 55 and 56. The third page, a panel drawing
    # set sideways, prints 4. The last page carries a label: `10666` under Roland's name and again
    # as `UPC 10666` over a barcode, with a smaller number beside the barcode that the scan leaves
    # in doubt.
    page_offset: 0
  archive:
    kind: download_page
    title: Roland - Support - Manual Archive
    landing: "https://www.roland.com/us/support/"
    url: "https://www.roland.com/us/support/manual_archive/"
    sha256: aa08cc61d2b474998265e8e0c893154f7145dfdb48d2726e8478c90e2558b499
    retrieved: 2026-10-11
    paginated: false
    # Its visible text, byte for byte the copy `roland/alpha_juno_2`, `roland/jx_8p` and
    # `roland/jd_800` cite. It lists `TR-707 Owner’s Manual` among ten TR drum machines, each an
    # owner's manual and nothing else.

midi:
  # `1 - 16` in both columns' Default and Changed rows, `Memorized` (manual p. 50). One channel
  # for both directions (manual p. 53).
  channels: [1, 16]
  # `Mode 3` transmitted and `Mode 1` recognised as the defaults (manual p. 50): it sends on its
  # channel and, until OMNI is turned off, answers on all of them.
  mode: {receives: 1, sends: 3}
  # Circled in both columns, and recognised when `SYNC mode = MIDI` (manual p. 50).
  clock: both
  # Start, Continue and Stop in both tables (manual p. 55); recognised in MIDI sync mode only.
  transport: both
  program_change:
    # Crossed in both columns, with True # starred out in the transmitted one (manual p. 50).
    receives: false
    sends: false
  # Crossed in both columns (manual p. 50): a checked absence. See the account.
  control_change: none
  nrpn: none
  # Circled both ways, `For rhythm seq` (manual p. 50): sequence data, by a handshake.
  sysex: true

voice:
  # A note names a drum voice: "here, each drum voice is represented by key number" (manual p. 42).
  addressing: voices
  # Assigned by holding a voice's key and sending the instrument a note, from 35 to 98
  # (manual p. 45), so the numbers below are the factory's.
  note_map: learned
  # NOT RECORDED: note_range and polyphony. See the account.
  velocity:
    # Circled in both columns, `v=1-127` recognised and `9n v=40-124` transmitted (manual p. 50).
    note_on: both
    # Crossed as recognised (manual p. 50): "All the note OFF messages are ignored."
    # (manual p. 55). It sends a note on with a velocity of nought in place of one.
    note_off: false
  # Key's and Ch's crossed in both columns, as is Pitch Bender (manual p. 50).
  aftertouch: none
  # **THE FACTORY'S RECEIVED NUMBERS**, under the implementation's names and in its order
  # (manual p. 55), at the lower number where a voice has two. Low Tom also answers to 43, Closed
  # Hi-Hat to 44, Mid Tom to 47 and High Tom to 50. By the MIDI chapter and the implementation,
  # notes sound only in Track Play mode (manual pp. 42, 55).
  voices:
    bass_drum_1: 35
    bass_drum_2: 36
    rim_shot: 37
    snare_drum_1: 38
    hand_clap: 39
    snare_drum_2: 40
    low_tom: 41
    closed_hi_hat: 42
    mid_tom: 45
    open_hi_hat: 46
    high_tom: 48
    crash_cymbal: 49
    ride_cymbal: 51
    tambourine: 54
    cowbell: 56

# NO CONTROLS BLOCK: see `midi.control_change` above.
