  # Swedish word and in `8-Step` sequencer prose.
  # **ONE, STATED AS A WORD RATHER THAN A FIGURE**: "Number of voices Monophonic" (guide p. 86).
  # **AND THE PAGE SELLS SIXTEEN OF THEM CHAINED TOGETHER**, which is not sixteen voices of this
  # instrument and is why this field reads one: the poly chain is sixteen monophonic EDGEs passing
