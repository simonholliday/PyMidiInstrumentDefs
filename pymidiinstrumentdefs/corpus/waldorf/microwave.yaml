midi:
  # `1..16` as the received Changed row (performance p. 121); the setting is omni or 1 to 16
  # (performance p. 37). No `mode`: see the account.
  channels: [1, 16]
  # Commands crossed in both columns (performance p. 121). No `clock`: see the account.
  transport: none
  program_change:
    # Crossed as transmitted and marked received over `0..127` (performance p. 121).
    receives: true
    sends: false
    # Sixty-four inside and sixty-four on a card, and as many Multi-programs again; see the account.
    presets: 128
  # Four numbers are the owner's to set at the panel, Control W to Z, beside the six the
  # maker fixes, five of them controls below; see the account.
  control_change: learned
  # No page or line names one, and a parameter is edited by system exclusive; see the account.
  nrpn: none
  # Marked in both columns (performance p. 121).
  sysex: true

voice:
  addressing: pitches
  # What the chart recognises; its True Voice row is `0..108` (performance p. 121).
  note_range: [0, 127]
  # "using all eight voices of the MicroWave" (performance p. 28), and in Multi mode the
  # Instruments draw on the same eight (performance p. 51).
  polyphony: 8
  polyphony_shared: true
  velocity:
    # Both marked received and neither sent (performance p. 121).
    note_on: received
    note_off: true
  # Key's and Ch's both marked received (performance p. 121).
  aftertouch: both
  pitch_bend:
    # A range for each oscillator of a sound, 0 to 12 semitones (programming p. 38).
    programmable: true

modes:
  single:
    label: Single mode
    # "The MicroWave defaults to Single mode upon powering up." (performance p. 28), said again on
    # p. 33; the first-steps chapter allows for a display in Multi mode after switching on
    # (performance p. 14).
    factory: true
  multi:
    label: Multi mode
    # The instrument's own channel hears only program changes here (performance pp. 53, 73).
    unparted: false

parts:
  # Up to eight, each with a channel from 1 to 16 that may be another's as well
  # (performance pp. 51, 60). The Multi Init patch has one Instrument, on channel 01
  # (performance pp. 54-55).
  instrument:
    label: Instrument
    mode: multi
    count: 8
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]

controls:

  # THE FIVE NUMBERS THE CHART AND THE MANUALS' OWN PAGES BOTH NAME, each received and none sent
  # (performance p. 121). The labels are the Programming Manual's names for the sources
  # (programming p. 27), and for 65 the word its account of Glide uses (programming p. 100), which
  # the chart shortens to `Porta`.
  # Single mode, on the instrument's channel ───────────────
  modulation:  {label: Modulation wheel, cc: 1, direction: receives}
  volume:      {label: Volume controller, cc: 7, direction: receives}
  panning:     {label: Panning controller, cc: 10, direction: receives}
  sustain:     {label: Sustain pedal, cc: 64, direction: receives}
  portamento:  {label: Portamento, cc: 65, direction: receives}

  # Multi mode, on an Instrument's channel ────────────────
  # The first four are recognised by the Instrument unless its own setting shuts them out
  # (performance pp. 67-68). The fifth is a reading; see the account.
  instrument_modulation:  {label: Modulation wheel, cc: 1, direction: receives, part: instrument}
  instrument_volume:      {label: Volume controller, cc: 7, direction: receives, part: instrument}
  instrument_panning:     {label: Panning controller, cc: 10, direction: receives, part: instrument}
  instrument_sustain:     {label: Sustain pedal, cc: 64, direction: receives, part: instrument}
  instrument_portamento:  {label: Portamento, cc: 65, direction: receives, part: instrument}
