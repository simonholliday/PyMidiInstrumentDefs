    # Every post the listing serves across its six pages, merged and de-duplicated: 75 of them in
    # an unbroken run from June 2024 to August 2026. **It is here to evidence an absence** - that
    # no firmware after 1.2 has been announced - which is the one thing a definition usually has to
    # hedge. The maker's sitemap says the same and cannot be relied on: its newest entry is from
    # January 2026 and a post from August 2026 is missing from it altogether.

midi:
  # NOT RECORDED: the channel range. See the source account - the maker prints no number and no
  # range anywhere, and the sixteen step buttons of the channel sub-menu are a good guess rather
  # than a fact.
  #
  # NOT RECORDED: the mode. Omni and poly are not mentioned in thirty-seven pages.
  #
  # "Use the first three step buttons of the first track to select a clock source – internal clock,
  # MIDI clock or external analogue clock" (p. 31) for one direction, and "step button 3 activates
  # MIDI CLOCK on MIDI OUT" (p. 32) for the other. The connector caption agrees: "The MIDI OUT port
  # outputs trigger and MIDI clock messages" (p. 6).
  clock: both
  # NOT RECORDED: transport. Start, Stop and Continue are not named anywhere, and the setting whose
  # label looks like one is not - MIDI CONT. CLOCK "turns MIDI clock ON or OFF when the sequencer
  # is stopped" (p. 32), which is about the clock and not about transport.
  #
  # NOT RECORDED: program change, and so no preset count either. The instrument holds a great many
  # presets - "the Pērkons has 64 banks, each bank containing 64 kits and 64 patterns" (p. 28), on
  # top of a features list that counts one bank of them, "64 kit and 64 pattern memory + additional
  # memory on the SD card" (p. 4) - and the manual describes no way to reach any of them over MIDI.
  # Patterns and kits are chosen with the step buttons and nothing else.
  #
  # NOT RECORDED: sysex. Neither `System Exclusive` nor `SysEx` appears in thirty-seven pages, but
  # this is a manual rather than an implementation chart, and firmware here arrives on an SD card,
  # so nothing has put the question to the maker.
  #
  # CHECKED AND ABSENT. The words NRPN, RPN and Registered appear nowhere in the manual, and the
  # two pages headed MIDI IMPLEMENTATION are the maker's own account of what the instrument answers
  # to.
  nrpn: none

voice:
  # A NOTE PICKS A VOICE RATHER THAN A PITCH, in the mode this file describes: "Voices will be
  # triggered by NOTE ON messages – Voice 1 – C, Voice 2 – C#, Voice 3 – D, Voice 4 – D#" (p. 35).
  # **Which is as far as the document goes** - no octave, so there are no note numbers to list
  # under `voices` and a player has to find them by trying.
  # In the other channel mode a note is a pitch instead, and the maker says so: "Set MIDI mode to
  # multi-channel and you can program notes into the sequencer either by playing them live and
  # recording or by pressing the desired step button and then sending in the MIDI note" (p. 34).
  addressing: voices
  # "4 hybrid voices (digital sound engine and analogue multimode filter with overdrive)" (p. 4),
  # each with its own trigger, its own output and one set of controls, so four notes at once and no
  # more. Nothing says a voice will hold a second note.
  polyphony: 4
  velocity:
    # IT ARRIVES AND DOES NOTHING UNTIL A SETTING IS TURNED ON, which is what `gated` says here:
    # "If the setting is ON in the configuration menu, MIDI notes will be recorded with velocity.
    # Higher velocity means higher volume" (p. 34). The setting is MIDI VELOCITY on the
    # configuration page (p. 31) and is not a control this instrument answers to, so there is
    # nothing to name in `gated_by`.
    note_on: gated
  # NOT RECORDED: note off, aftertouch, pitch bend and the note range. None of the four is
  # mentioned anywhere in the manual, and a drum machine's silence about pitch bend is not the same
  # as a chart's X against it.

groups:
  # THE PAGE'S OWN COLUMN HEADINGS (p. 35), and the only grouping it offers: the four voices are
  # identical in their controls and different in their sound engines.
  voice_1: Voice 1
  voice_2: Voice 2
  voice_3: Voice 3
  voice_4: Voice 4

controls:

  # ──── voice_1 ────
  # Its three algorithms are FOLD DRUM 1, WAVETABLE DRUM and SIMPLE DRUM (p. 8), in that order,
  # which is what the ALGO switch picks between.

  voice_1_tune:          {label: Voice 1 Tune, cc: 70, group: voice_1}
  voice_1_decay:         {label: Voice 1 Decay, cc: 71, group: voice_1}
  voice_1_param_1:       {label: Voice 1 PARAM1, cc: 72, group: voice_1}
  voice_1_param_2:       {label: Voice 1 PARAM2, cc: 73, group: voice_1}
  voice_1_cutoff:        {label: Voice 1 Cutoff, cc: 74, group: voice_1}
  voice_1_drive:         {label: Voice 1 Drive, cc: 75, group: voice_1}
  voice_1_fx_send:       {label: Voice 1 FX Send, cc: 76, group: voice_1}
  voice_1_level:         {label: Voice 1 Level, cc: 77, group: voice_1}
  voice_1_algo_switch:   {label: Voice 1 Algo Switch, cc: 78, group: voice_1}
  voice_1_mode_switch:   {label: Voice 1 Mode Switch, cc: 79, group: voice_1}
  voice_1_filter_switch: {label: Voice 1 Filter Switch, cc: 80, group: voice_1}

  # ──── voice_2 ────
  # FOLD DRUM 2, WAVETABLE DRUM and COMPLEX DRUM (p. 9). Its second algorithm carries the same
  # name as voice 1's, and the maker prints it that way.

  voice_2_tune:          {label: Voice 2 Tune, cc: 81, group: voice_2}
  voice_2_decay:         {label: Voice 2 Decay, cc: 82, group: voice_2}
  voice_2_param_1:       {label: Voice 2 PARAM1, cc: 83, group: voice_2}
  voice_2_param_2:       {label: Voice 2 PARAM2, cc: 84, group: voice_2}
  voice_2_cutoff:        {label: Voice 2 Cutoff, cc: 85, group: voice_2}
  voice_2_drive:         {label: Voice 2 Drive, cc: 86, group: voice_2}
  voice_2_fx_send:       {label: Voice 2 FX Send, cc: 87, group: voice_2}
  voice_2_level:         {label: Voice 2 Level, cc: 88, group: voice_2}
  voice_2_algo_switch:   {label: Voice 2 Algo Switch, cc: 89, group: voice_2}
  voice_2_mode_switch:   {label: Voice 2 Mode Switch, cc: 90, group: voice_2}
  voice_2_filter_switch: {label: Voice 2 Filter Switch, cc: 91, group: voice_2}

  # ──── voice_3 ────
  # RESONANT DRUMS, SLAP and KARPLUS (p. 10).

  voice_3_tune:          {label: Voice 3 Tune, cc: 92, group: voice_3}
  voice_3_decay:         {label: Voice 3 Decay, cc: 93, group: voice_3}
  voice_3_param_1:       {label: Voice 3 PARAM1, cc: 94, group: voice_3}
  voice_3_param_2:       {label: Voice 3 PARAM2, cc: 95, group: voice_3}
  voice_3_cutoff:        {label: Voice 3 Cutoff, cc: 96, group: voice_3}
  voice_3_drive:         {label: Voice 3 Drive, cc: 97, group: voice_3}
  voice_3_fx_send:       {label: Voice 3 FX Send, cc: 98, group: voice_3}
  voice_3_level:         {label: Voice 3 Level, cc: 99, group: voice_3}
  voice_3_algo_switch:   {label: Voice 3 Algo Switch, cc: 100, group: voice_3}
  voice_3_mode_switch:   {label: Voice 3 Mode Switch, cc: 101, group: voice_3}
  voice_3_filter_switch: {label: Voice 3 Filter Switch, cc: 102, group: voice_3}

  # ──── voice_4 ────
  # NOISE HAT, NOISE/TONE and ACOUSTIC HATS (p. 11) - the hi-hat voice, and the one whose third
  # algorithm plays samples a player can replace on the SD card.

  voice_4_tune:          {label: Voice 4 Tune, cc: 103, group: voice_4}
  voice_4_decay:         {label: Voice 4 Decay, cc: 104, group: voice_4}
  voice_4_param_1:       {label: Voice 4 PARAM1, cc: 105, group: voice_4}
  voice_4_param_2:       {label: Voice 4 PARAM2, cc: 106, group: voice_4}
  voice_4_cutoff:        {label: Voice 4 Cutoff, cc: 107, group: voice_4}
  voice_4_drive:         {label: Voice 4 Drive, cc: 108, group: voice_4}
  voice_4_fx_send:       {label: Voice 4 FX Send, cc: 109, group: voice_4}
  voice_4_level:         {label: Voice 4 Level, cc: 110, group: voice_4}
  voice_4_algo_switch:   {label: Voice 4 Algo Switch, cc: 111, group: voice_4}
  voice_4_mode_switch:   {label: Voice 4 Mode Switch, cc: 112, group: voice_4}
  voice_4_filter_switch: {label: Voice 4 Filter Switch, cc: 113, group: voice_4}
