definition: 1

# THE SHAPE OF `korg/kronos`'S IMPLEMENTATION, AND NEARLY THE SAME MAP. Korg's MIDI implementation
# for this instrument is a text file laid out as two lists, `1.TRANSMITTED DATA` and
# `2.RECOGNIZED RECEIVE DATA`, each naming every message by its status byte, with the control that
# sends it or the use it is put to in brackets, as the Kronos's does. All 39 controller numbers
# below are in both lists, so none needs a `direction`; eleven non-registered parameters are
# recorded as well.

model:
  manufacturer: Korg
  name: TRITON
  # ONE DEFINITION FOR THREE KEYBOARDS, BY THE MAKER'S OWN ARRANGEMENT. The implementation footnotes
  # the keys three ways, "kk = 24 - 108 : TRITON (61keys + Transpose)" (implementation), "= 16 -
  # 115 : TRITON pro (76keys + Transpose)" (implementation) and "= 09 - 120 : TRITON proX (88keys +
  # Transpose)" (implementation); the chart is headed for all three (basic_guide p. 137); and the
  # newest system's history is headed "TRITON 'Classic' (Triton, Triton Pro, Triton Pro-x)"
  # (history p. 1).
  # THE NEWEST SYSTEM, AND NOTHING SINCE THE IMPLEMENTATION MOVED THE MAP. The implementation's last
  # revision, 1.6, reads "Mofified for System version 2.5." (implementation), typo and all, followed
  # by `Fix some mistakes.` The history runs from system 1.0.8 to 2.5.3 and gives a controller
  # number only twice, both in fixes to MIDI filters: 66 in 1.1.0 (history p. 6) and 65 in 2.5.0
  # (history p. 2). Neither moves a number, and nothing in 2.5.1 or 2.5.3 names one. So the map read
  # for 2.5 is the map of 2.5.3. Checked 2026-10-09.
  firmware: "2.5.3"

source: >-
  Korg's MIDI implementation for the TRITON series, version 1.6, a text file inside a ZIP archive:
  the transmitted messages in section 1, the received ones in section 2, and the system exclusive
  formats after them. Beside it, the Basic Guide, whose account of the messages is pp. 114 to 123
  and whose MIDI Implementation Chart is p. 137; the Parameter Guide, whose Global MIDI page is
  pp. 117 to 120 and whose appendices on the controllers are pp. 215 to 225; the Version 2.5 update
  guide (pp. 11 and 13); and the history of systems 1.0.8 to 2.5.3 that comes with the newest
  updater. Other pages are cited where they are used.

  THE ARCHIVE HOLDS TWO TEXT FILES AND ONE OF THEM IS READ. `TRITON_MIDIimp.TXT`, 341,443 bytes in
  3,876 lines, headed "TRITON-SERIES MIDI IMPLEMENTATION Version 1.6 (Sep.19.'02)" (implementation),
  is where every controller and NRPN number below comes from. The other, `MIDIFX.TXT`, is the
  effects' system exclusive parameter structure; the controllers it names are a list of modulation
  sources, all of them numbers this map already carries.

  AND THERE IS AN ORDINARY CHART, dated 12 April 1999, on p. 137 of the Basic Guide. It is what
  `mode` and `note_range` rest on. It names every controller number the implementation does but 17,
  19, 20 and 21, which it covers with the knobs' B-assign span of 0 to 95, and 122, which it gives
  only by name as Local On/Off. Against the implementation's numbered rows it differs in one cell,
  circling 6 and 38, Data Entry, as sent where the transmitted list has 6 alone, though 38 can be
  sent through the knobs' and the sequencer's spans. And it gates Bank Select on the program change
  filter, `*P`, where the implementation's `PB` names the bank change filter as well.

  AND THE PARAMETER GUIDE REPRINTS AN OLDER EDITION OF THE IMPLEMENTATION, at its pp. 234 to 236,
  headed "TRITON-SERIES MIDI IMPLEMENTATION 5,Apr,1999" (parameter_guide p. 234). Its controller
  numbers are version 1.6's but for two: its transmitted list has no row for 83, and its received
  list prints Local Control at 121, the number of Reset All Controllers on the line above it, where
  version 1.6 prints 122. It also marks 71, 72 and 79 as sent by `Knob-1A`, as 74 is, which version
  1.6 puts right as 2A, 4A and 3A, and gives Sostenuto and Soft both as sent by `A.SW =Porta.SW`.
  Version 1.6 is followed throughout.

  THE THIRTY-NINE NUMBERS CARRIED, AND THE EIGHTEEN NOT. The two lists name 57 controller numbers
  between them, 44 sent and 57 received. Ten are how MIDI addresses things rather than parameters of
  this instrument: Bank Select (0 and 32), Data Entry (6 and 38), Data Increment and Decrement (96
  and 97), the NRPN selects (98 and 99) and the RPN selects (100 and 101). Bank Select's work is
  under `program_change`, the first registered parameter under `pitch_bend`, and the non-registered
  ones are controls below. Eight more are the channel mode messages, 120 to 127, which this format
  refuses as controls by design; they are described under `midi`. That is the line `korg/kronos`
  drew from the same position. The other 39 are in both lists, and every number the transmitted list
  carries is in the received one too.

  ALL 39 ARE AMONG `korg/kronos`'S NUMBERS, IN THE SAME GROUPS, AND SIX ARE NAMED DIFFERENTLY THERE.
  The Kronos's 94 and 95 switch Master FX1/2 and Total FX1/2, where the TRITON's switch Master FX1
  and Master FX2; and its 17, 19, 20 and 21 are Knob Mod5 to 8, where the TRITON's are Knob Mod1 to
  4.

  THE NUMBERS ARE WHERE EACH FUNCTION SITS, AND THE KNOBS CAN BE SET TO ANY OF 0 TO 95. Beside its
  numbered rows the transmitted list carries "Control (cc)=0-95 ( Knob-B = MIDI CC#00-95 )"
  (implementation); and both lists carry 0 to 101 as sequencer data, sent on playback and received
  for recording, "Control data ( for Seq. recording (cc)=0-101 )" (implementation). The four
  REALTIME CONTROLS knobs send 74, 71, 79 and 72 in their A mode, and "The A-mode functions of the
  REALTIME CONTROLS are fixed." (parameter_guide p. 219); their B mode, [SW1] and [SW2] are assigned
  per program, combination and song, and the foot switch and pedal in Global mode
  (parameter_guide pp. 217 to 220). Each named function sends the number recorded here for it, and
  the B mode can also be set to send any number from 0 to 95.

  EVERY CONTROL ANSWERS ONLY THROUGH A GLOBAL FILTER, AND NO PAGE GIVES ITS FACTORY STATE. Every
  control below travels as a control change enabled "when Enable Control Change in Global mode is
  checked" (implementation), and the chart's notes say the same of the rest: "*P, *A, *C, *E:
  Transmitted/received when Global P1: MIDI Filter (Program Change, After Touch, Control Change,
  Exclusive) is Enable, respectively." (basic_guide p. 137). The Parameter Guide describes each box
  and says only of the exclusive one how it is normally set.

  THREE NUMBERS REACH THE GLOBAL CHANNEL ONLY AND THE FORMAT CANNOT SAY SO. Most rows carry the
  status `Bn`, glossed "MIDI Channel No. (0 - 15) ...... Usually Global Channel." (implementation),
  with each timbre's or track's channel in Combination, Sequencer and Song Play modes. Controllers
  92, 94 and 95 carry `Bg`, "Always Global Channel No. (0 - 15)" (implementation): they switch the
  insert effects and the two master effects off for the whole instrument. A control is placed by its
  `part` here and there is no part for the instrument itself, so they are ordinary controls below
  and the restriction is said only here.

  THE EFFECT SENDS ARE CROSSED, AS THEY ARE ON THE KRONOS. Controller 91, named Effect 1 Depth in
  both lists, is received "for Send 2 Level control" (implementation), and 93, Effect 3 Depth, "for
  Send 1 Level control" (implementation). The Basic Guide heads them "Effect 1 depth (Send 2)
  (CC#91) [Bn, 5B, vv]" (basic_guide p. 117), so the labels below name the send each one reaches.
  Outside Program and Sampling modes the sends after the insert effects, like the panning there, are
  set on the effects' own control channels: "To control the pan following IFX, sends 1/2, MFX 1/2
  and MEQ, use the global MIDI channel in Program or Sampling mode; in Combination, Sequencer, or
  Song Play mode, use the channel specified separately by 'Ctrl Ch'" (parameter_guide p. 117).

  THE ARPEGGIATOR IS REACHED BY NRPN BOTH WAYS. Its ON/OFF key and its GATE and VELOCITY knobs send
  three non-registered parameters, written out in full as "ARPEGGIATOR
  ON/OFF :[ Bn,63,00,Bn,62,02,Bn,06,mm] mm = 00(Off),7F(On)" (implementation) and its two fellows,
  and the same three are received. In Program and Combination modes they travel on the global
  channel, and in Sequencer and Song Play modes on the control track's, which no page defines; the
  1999 edition reads "current selected track's channel" (parameter_guide p. 234). The value is the
  Data Entry MSB alone: "Data Entry LSB value has no effect." (implementation). Each NRPN below is
  recorded as MSB x 128 + LSB, so 00,02 is 2 and 01,08 is 136.

  AND EIGHT MORE ARE RECEIVED FOR GS AND XG SONGS. "The following NRPN messages can be received to
  modify the sound." (basic_guide p. 123), under the Basic Guide's heading for GS and XG music data:
  vibrato rate, depth and delay, filter cutoff and resonance, and envelope attack, decay and
  release. No page says in which modes they are received or on which channel. And ten families more,
  one parameter per drum note, at ten MSBs, 14 to 1E hexadecimal with 1B unused, with the note as
  the LSB, "Only valid when Part Mode is Drum, MDrm1 - Mdrm4." (implementation). At 97 notes each
  they would be 970 controls, so they are not recorded as controls.

  WHERE THE LOCATORS COME FROM. The implementation is a text file with no pages, so a quotation from
  it carries the source's name alone and is found by searching the file. The Basic Guide's printed
  page is five behind its sheet on all 140 sheets that print an arabic number, the five before them
  being the cover and front matter; the Parameter Guide's six behind on all 249, after six sheets of
  front matter; the update guide's three behind on all 17; and the history's equal to its sheet on
  all eight.

  HOW THE DOCUMENTS WERE REACHED. As for `korg/kronos`, the downloads page carries no file address,
  and each document is reached through a licence page that does. The history is not on the downloads
  page at all: it is a PDF inside the 2.5.3 System Updater's archive, beside the system files
  themselves, and its metadata titles it `Trinity 2.1.2 features`, so the title recorded is its
  running head.

  NOT RECORDED: the preset count, because program change reaches different things in different modes
  and the field holds one number. "512 user memory combinations (512 presets)" (basic_guide p. 135),
  "640 user memory programs (512 preset)" (basic_guide p. 135) and "256 + 9 drum ROM programs (GM2
  sound map compatible)" (basic_guide p. 135), with a program change selecting a program or a
  combination by mode, and the bank map choosing between two layouts of the same banks. NOT RECORDED
  EITHER: the other two registered parameters, "= 1 : Fine Tune ( Detune )" (implementation) and
  "= 2 : Coarse Tune ( Transpose )" (implementation), which are a tuning and a transpose this format
  does not hold; the velocity and aftertouch curves; the drum NRPN family above; and the system
  exclusive parameter addresses, which have no field in this format.

