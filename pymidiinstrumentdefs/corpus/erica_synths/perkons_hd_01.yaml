# TWO MAPS AGAIN, AND THIS TIME ONE IS THE OTHER'S FIRST QUARTER. The PĒRKONS answers to the
# forty-four numbers of its table **in SINGLE MIDI CHANNEL mode**, where all four voices are on one
# channel and each has eleven numbers of its own. In MULTI MIDI CHANNEL mode each voice takes a
# channel of its own and they all answer to voice 1's eleven - "In MULTI MIDI CHANNEL mode, MIDI
# CC messages for all voices are the same as for VOICE 1, but you have to assign voices to
# different MIDI channels" (p. 35). The mode is a setting on the instrument's configuration page
# and the maker does not say which way it ships.
#
# **BOTH MAPS ARE CARRIED, EACH IN ITS MODE.** The table's forty-four name no part and answer in
# `single`. The other map is those numbers' first quarter moved onto four channels: eleven
# controls on a part of four voices, which exists in `multi` only. Until 2026-10-11 the format
# had no field for a map that is live in one mode only, and the second map was here in words.
#
# **THE MANUAL GIVES THE SINGLE MODE'S NUMBERS TWICE AND THE TWO DISAGREE.** The table on p. 35
# runs each voice's eight knobs in the order tune, decay, PARAM1, PARAM2, cutoff, drive, FX send,
# level, on 70 to 77 for voice 1. The next page pictures the file the instrument reads them
# from, and there voice 1 has tune 70, decay 74, param1 71, param2 75, cutoff 72, drive 76,
# fx-send 73 and level 77, with voice 2 the same shape from 81 and the picture cut off after
# voice 3's tune. So six of a voice's eleven numbers differ between the two. **This file follows
# the table, as the one the manual states as the implementation and not as the likelier of the
# two**: the page shows the picture as the file to open, and its numbers run in an order a
# maker's file would. **Doubt those six on every voice until an instrument has been tried.** The
# source account has the pictured numbers in full.
#
# THE NUMBERS ARE A FACTORY ASSIGNMENT AND THE PLAYER CAN REWRITE THEM, which is unusual enough to
# say on the file's face: "You can alter the MIDI CC message assignment to your preference simply
# by replacing CC message numbers in a text file on the SD card" (p. 36) - a file the same page
# names `single-midi-cc.json`, and pictures in a folder beside a `multi-midi-cc.json` that no
# sentence describes. So everything below is what a PĒRKONS answers to as it leaves the factory,
# as far as the table can be trusted, and a particular instrument may have been changed; every
# control says so with `assignment: default`. There is no MIDI learn here and no way to ask the
# instrument what it is set to; the files on the card are the whole of it.
#
# THE FOUR NOTE NUMBERS ARE NOT IN PRINT. In SINGLE MIDI CHANNEL mode, "Voices will be triggered
# by NOTE ON messages – Voice 1 – C, Voice 2 – C#, Voice 3 – D, Voice 4 – D#" (p. 35), and **no
# octave is given anywhere in thirty-seven pages**, so there is no note number to record. A
# player has to find the octave by trying it.
#
# AND NEITHER ARE THE SWITCHES' POSITIONS. Each voice's ALGO, MODE and FILTER switch has three
# positions and the manual names all three of each - the algorithms and their modes at pp. 8 to 11,
# the filters at p. 7 - but it never prints what to send to reach one. So they are plain controls
# below rather than three-state ones, because the only number a player actually needs is the one
# the maker did not print.

definition: 1

model:
  manufacturer: Erica Synths
  # THE MAKER WRITES IT WITH A MACRON and the file's name cannot, so the two differ on purpose.
  # Pērkons is the Baltic god of thunder and the manual opens by saying so. The same manual drops
  # the macron twice - its heading on p. 34 spells the name PERKONS before "FIRMWARE V1.1.
  # CHANGELOG" (p. 34), and p. 32 has "the PERKONS sends out all MIDI information from the internal
  # sequencer" (p. 32) - so both spellings are the maker's.
  name: PĒRKONS HD-01
  # The manual's own page headings: pp. 31, 32 and 33 are each headed "CONFIGURATION SETTINGS -
  # FIRMWARE V1.2" (p. 31). **AND 1.2 IS STILL THE NEWEST**, which is an absence and is evidenced:
  # the maker's news listing serves seventy-five posts in an unbroken run from June 2024 to
  # August 2026, and the only PĒRKONS firmware announcement among them is 1.2's, of December
  # 2024. The 1.1 and 1.0 announcements are older than the run and are cited on their own.
  # The maker's two namings of this release differ by a digit: the announcement is headed "PERKONS
  # UPDATE 1.2" (firmware_1_2) and the image it offers is `perkons_both_v1.2.1-0-gbcccfd0.img`.
  # This is 1.2, which is what the pages the numbers come from call it.
  firmware: "1.2"

source: >-
  PĒRKONS HD-01 User Manual, 37 pages, December 2024, for firmware 1.2. **Every controller
  number below comes from pp. 35 and 36**, the two pages headed MIDI IMPLEMENTATION, and there
  is no implementation chart, no separate MIDI document and nothing on midi.guide. Around
  them: the connectors at p. 6, the voice controls at p. 7, the sound engines at pp. 8-11, the
  configuration page at pp. 31-33, where the two MIDI modes and their channels are set, and
  the firmware 1.1 changelog at p. 34, which is all the manual has on notes in the second mode.

  THE MANUAL IS REACHED THROUGH A NEWS ITEM AND THERE IS NO OTHER ROUTE TO IT. The maker's product
  and support pages assemble their download lists in the browser, so an HTTP client that fetches
  either gets no link to anything. The manual is the second of two links in the announcement of
  firmware 1.2, worded "DOWNLOAD UPDATED MANUAL HERE" (firmware_1_2). That announcement is cited
  here as a document in its own right, with the two before it, because between them they are the
  only changelogs this instrument has.

  FORTY-FOUR CONTROLLER NUMBERS, 70 TO 113, WITH NOTHING UNUSED IN BETWEEN. Eleven controls for
  each of four voices: "All 8 potentiometers and 3 switches of each voice on the PĒRKONS can be
  controlled via MIDI CC messages" (p. 35). Voice 1 has 70 to 80, voice 2 81 to 91, voice 3 92 to
  102 and voice 4 103 to 113, in the order the page lists the controls down its left-hand side.
  That is SINGLE MIDI CHANNEL mode's map. MULTI MIDI CHANNEL mode's is voice 1's eleven again,
  for each voice on a channel of its own, and is carried below on a part.

  THE PICTURED FILE DOES NOT AGREE WITH THE TABLE, and nothing in print settles it. Page 36
  carries two pictures that the page's text does not hold. One is the card's SYSTEM folder,
  with three files in it: `device.json`, `multi-midi-cc.json` and `single-midi-cc.json`. The
  other is the single file open in an editor, and its numbers are: voice1 tune 70, decay 74,
  param1 71, param2 75, cutoff 72, drive 76, fx-send 73, level 77, algo 78, mode 79, filter 80;
  voice2 tune 81, decay 85, param1 82, param2 86, cutoff 83, drive 87, fx-send 84, level 88,
  algo 89, mode 90, filter 91; and voice3 tune 92, where the picture ends. Against the table
  that is the same number for tune, level and the three switches, and a different one for
  decay, PARAM1, PARAM2, cutoff, drive and FX send: twelve of the twenty-three numbers
  pictured. The pictured numbers run in the panel's order, down the left column of knobs and
  then the right (p. 7), where the table's run across its rows. **The table is carried as the
  stated implementation** - "In SINGLE MIDI CHANNEL mode, the MIDI implementation is as shown
  in the table below" (p. 35) - **and not as the likelier of the two.** The page shows the
  picture as the file to open, "Then open the single-midi-cc.json file in a text editor"
  (p. 36), and never calls it an altered one, and the two can both be true of one instrument
  only if somebody had altered it. A player whose decay answers on 74 and not on 71 has met
  the pictured file.

  THE TABLE IS A DRAWING AND NOT A TABLE. This manual was set in Adobe Illustrator and its two
  kinds of table are grids of free-standing words with no ruling and no cells, so which number
  belongs under which heading is in the coordinates and nowhere else. **Reading by the order the
  words come out of the file is wrong in the way that looks right**: done that way, the fourth
  voice's three algorithms come back as NOISE HAT, NOISE/TONE, ACOUSTIC HATS, which reads as
  algorithms 1, 2 and 3 - and the maker says elsewhere that algorithm 3 is the one with the samples
  in it, "VOICE 4, ALGORITHM 3 contains three hi-hat samples that can be selected via the MODE
  switch" (p. 33), which is ACOUSTIC HATS. The columns settle it; the text's order does not. Both
  kinds of page also carry a drawing of the voice panel at the right-hand edge, whose words would
  otherwise land in the table.

  WHAT IS ABSENT, SEARCHED FOR ACROSS ALL THIRTY-SEVEN PAGES. The words NRPN, RPN and Registered
  appear nowhere, which is what `nrpn: none` records. Neither do `System Exclusive`, `SysEx`,
  `Program Change`, `Pitch Bend` or `Aftertouch` - but those are left unrecorded rather than
  written as checked absences, because this is a manual and not an implementation chart, and one
  that does not mention a thing has not been asked about it. The distinction matters most for
  program change: the instrument holds 64 banks of 64 kits and 64 patterns (p. 28) and the manual
  describes no way to reach any of them over MIDI, so no preset count is recorded here at all.

  NO MIDI CHANNEL NUMBER OR RANGE IS PRINTED. The channel is chosen on the instrument - "In the
  SINGLE CHANNEL MIDI CONFIG menu, you can select a MIDI channel for controlling the PĒRKONS"
  (p. 32) - and the manual never says how many there are to choose from. The sub-menu is a row of
  sixteen step buttons and MIDI has sixteen channels, which is a good guess and is not a fact the
  maker printed, so `channels` is left unrecorded. The one channel number in print is for MULTI
  MIDI CHANNEL mode, "Voice 1 = MIDI CH1, Voice 2 = MIDI CH2 etc." (p. 34), stated flatly and
  read here as where the voices start, since p. 32 lets the player assign them.

  WHAT THE CONTROLS TRAVEL. Both ways. The connector caption has MIDI IN taking them - "Full-size
  DIN5 MIDI In receives trigger note messages, MIDI clock as well as CC messages for all voice
  parameters" (p. 6) - and the configuration page has them going out, "Step button 7 turns on the
  transmission of parameter MIDI CC messages via the MIDI OUT port" (p. 32). The same caption at
  p. 6 says only that "The MIDI OUT port outputs trigger and MIDI clock messages" (p. 6), which is
  the shorter of the two accounts rather than a contradiction of it. No page prints the numbers
  or channels they go out on, in either mode; that they are the ones they come in on is read.

  THE ONE FIRMWARE NOTE THAT TOUCHES THESE NUMBERS is "Fixed VCF mode CC bug" (firmware_1_2), which
  is the maker saying that a voice's FILTER SWITCH did not answer right before December 2024. The
  1.1 note made a note a pitch, "This update adds chromatic tuning of the voices, adds one new
  algorithm and more!" (firmware_1_1), in the mode its changelog names: "Set MIDI mode to
  multi-channel and you can program notes into the sequencer either by playing them live and
  recording or by pressing the desired step button and then sending in the MIDI note" (p. 34).
  The 1.0 note mentions MIDI only for its clock.

  NOT RECORDED, for MULTI MIDI CHANNEL mode: what a note does when it is simply played and not
  recorded, the range of notes a voice takes, and which note sounds a voice at its TUNE knob's
  pitch. The changelog's sentence is about programming the sequencer, and p. 35's about the
  controllers the voices answer to.

  THE MANUAL REPEATS A PARAGRAPH AND LOSES ONE, which is worth knowing before trusting any of its
  prose. "Step button 9 of the second track" (p. 32) and "Step button 12 of the second track"
  (p. 33) are both described as inverse odds, word for word the same paragraph twice over, while
  the manual's own diagram has TRACK ROTATE at step 12 (p. 31). The announcement of firmware 1.2 is
  what the missing paragraph would have said. Nothing below rests on that page; it is recorded
  because a document that repeats itself may be missing something.

  AND ITS OWN CROSS-REFERENCES ARE A PAGE OUT. One sends a reader to "page 30 of the manual"
  (p. 17) and the next to "page 30 of this manual" (p. 18), for settings that begin on p. 31. The
  printed page numbers themselves match the sheets exactly, and every locator here was taken from
  the page rather than from a reference to it.

sources:
  manual:
    kind: manual
    title: PĒRKONS HD-01 User Manual
    dated: "2024-12"
    landing: "https://www.ericasynths.lv/news/perkons-hd-01-12-firmware-update/"
    url: "https://erp.ericasynths.lv/media/PERKONS_manual_WEB_DEC_2024_Wa2wFLd.pdf"
    sha256: f4ada882abbe7439e234f0a32723a3cc10c3d28fa2ae3e17995c893eb6b6e0bb
    retrieved: 2026-10-04
    page_offset: 0
    # 37 pages, printed numbers matching the sheets exactly. Its colophon reads "User Manual
    # December 2024" (p. 37) and its configuration pages say which firmware it describes. **The
    # landing page is a news item rather than a downloads page**, which is this maker's shape: the
    # product and support pages build their lists in the browser, so neither serves a link to an
    # HTTP client. The `_Wa2wFLd` in the file name is the file host's own suffix for a stored
    # upload, not an edition number, so trying the numbers has nothing to work on.
    #
    # TWO READERS DISAGREE ABOUT THIS DOCUMENT'S TEXT, and anybody who searches it should know.
    # Its capitalised headings set the hyphen as a cased glyph, so a reader that resolves glyph
    # names gives `PERKONS HD-01` and `PER-STEP` while one that does not gives
    # `PERKONS HD/hyphen.case01` and `PER/hyphen.caseSTEP`. The reader this corpus's checks use
    # returns nine such places, on seven pages. So a text search for `HD-01` finds nothing in the
    # headings with one tool and finds it with another, and no quotation here is taken from a
    # line that contains one.
    #
    # PAGE 36 HOLDS TWO PICTURES AND ITS TEXT IS ONLY A PARAGRAPH AND TWO CAPTIONS, so nothing a
    # search can reach says what the pictures show: a folder with a second file in it, and the
    # first file's numbers, twelve of which are not the table's. Both are set out in the source
    # account.
  firmware_1_2:
    kind: release_notes
    title: "Pērkons HD-01 1.2 firmware update! - Blog - Erica Synths"
    dated: "2024-12-18"
    landing: "https://www.ericasynths.lv/news/perkons-hd-01-12-firmware-update/"
    url: "https://www.ericasynths.lv/news/perkons-hd-01-12-firmware-update/"
    sha256: 7a99759888709f7823f1d98528023982a0648517df5236d8617b3898c2027a26
    retrieved: 2026-10-04
    paginated: false
    # The announcement this manual is linked from, and the only published changelog for 1.2 - the
    # manual prints the 1.1 changelog and none for the firmware it describes. Cited for the one
    # fix that touches these numbers. It also names voice 4's third algorithm "sample replacing on
    # the 'Rompler engine'" (firmware_1_2), which the manual never calls it.
    #
    # The sha256 is of the page's visible text; the page as served hashes to
    # 0939e753673d07d286786f582ec1060b52098dc898281d3b370b7fd64c1b12e9.
  firmware_1_1:
    kind: release_notes
    title: "Pērkons 1.1 update! - Blog - Erica Synths"
    dated: "2023-11-24"
    landing: "https://www.ericasynths.lv/news/post/perkons-11-update/"
    url: "https://www.ericasynths.lv/news/post/perkons-11-update/"
    sha256: 5ffe400b75e5eeccba47698a1871d3f5158915e735774a5704576d3f3333cd06
    retrieved: 2026-10-04
    paginated: false
    # The firmware that gave this instrument chromatic MIDI note input, and the one text it
    # publishes twice: the manual reprints it at p. 34. Compared word for word, the two printings
    # differ in three places and only one is a word - the announcement has "Batter accuracy of
    # note recording" (firmware_1_1) where the manual has "Improved accuracy of note recording"
    # (p. 34). Nothing here rests on either, which is the point of having compared them.
    #
    # The sha256 is of the page's visible text; the page as served hashes to
    # 7fdd74d81c24d1d8da84ad2e98da9e13c1d0b6e017520de371fad432baf6457b.
  firmware_1_0:
    kind: release_notes
    title: "Pērkons HD-01 1.0 firmware update! - Blog - Erica Synths"
    dated: "2022-09-19"
    landing: "https://www.ericasynths.lv/news/post/perkons-hd-01-10-firmware-update/"
    url: "https://www.ericasynths.lv/news/post/perkons-hd-01-10-firmware-update/"
    sha256: 0217e727a306a345b9786fee091520dbb7a93eb79dcb725407ecd3afeb842134
    retrieved: 2026-10-04
    paginated: false
    # The oldest firmware note this maker publishes. Cited for two things: that MIDI clock was
    # answered to from the first published firmware, and that its shorthand for the voices - V3A3,
    # V4A2 - reads the sound engine tables **by column**, which is what settled how to read them.
    #
    # The sha256 is of the page's visible text; the page as served hashes to
    # 52f812b1105be49573d681c06711fc45f91ec0f78744105fec2482b656210007.
  news_listing:
    kind: web_page
    title: Erica Synths news listing
    landing: "https://www.ericasynths.lv/news/"
    url: "https://www.ericasynths.lv/news/"
    sha256: a53bdbf71cec48af40f94c61c4878eb71bb040dea417c7e400431fd6c19138ac
    retrieved: 2026-10-04
    paginated: false
    # Every post the listing serves across its six pages, merged and de-duplicated: 75 of them in
    # an unbroken run from June 2024 to August 2026. **It is here to evidence an absence** - that
    # no firmware after 1.2 has been announced - which is the one thing a definition usually has to
    # hedge. The maker's sitemap says the same and cannot be relied on: its newest entry is from
    # January 2026 and a post from August 2026 is missing from it altogether.

midi:
  # NOT RECORDED: the channel range. See the source account - the maker prints no number and no
  # range anywhere, and the sixteen step buttons of the channel sub-menu are a good guess rather
  # than a fact.
  #
  # NOT RECORDED: `mode`, the specification's omni and poly, which are not mentioned in
  # thirty-seven pages. The maker's own MIDI MODE setting is something else, and is the `modes`
  # section below.
  #
  # ALSO ON THE CONFIGURATION PAGE, with no field here: "step button 5 activates MIDI THRU"
  # (p. 32), and "With step button 6 ON, the PERKONS sends out all MIDI information from the
  # internal sequencer" (p. 32).
  #
  # "Use the first three step buttons of the first track to select a clock source – internal clock,
  # MIDI clock or external analogue clock" (p. 31) for one direction, and "step button 3 activates
  # MIDI CLOCK on MIDI OUT" (p. 32) for the other. The connector caption agrees: "The MIDI OUT port
  # outputs trigger and MIDI clock messages" (p. 6).
  clock: both
  # NOT RECORDED: transport. Start, Stop and Continue are not named anywhere, and the setting whose
  # label looks like one is not - MIDI CONT. CLOCK "turns MIDI clock ON or OFF when the sequencer
  # is stopped" (p. 32), which is about the clock and not about transport.
  #
  # NOT RECORDED: program change, and so no preset count either. The instrument holds a great many
  # presets - "the Pērkons has 64 banks, each bank containing 64 kits and 64 patterns" (p. 28), on
  # top of a features list that counts one bank of them, "64 kit and 64 pattern memory + additional
  # memory on the SD card" (p. 4) - and the manual describes no way to reach any of them over MIDI.
  # Patterns and kits are chosen with the step buttons and nothing else.
  #
  # NOT RECORDED: sysex. Neither `System Exclusive` nor `SysEx` appears in thirty-seven pages, but
  # this is a manual rather than an implementation chart, and firmware here arrives on an SD card,
  # so nothing has put the question to the maker.
  #
  # CHECKED AND ABSENT. The words NRPN, RPN and Registered appear nowhere in the manual, and the
  # two pages headed MIDI IMPLEMENTATION are the maker's own account of what the instrument answers
  # to.
  nrpn: none

modes:
  # THE TWO MIDI MODES, UNDER THE MANUAL'S OWN NAMES: "Step button 1 selects SINGLE MIDI CHANNEL
  # mode, step button 2 selects MULTI MIDI CHANNEL mode" (p. 32). Neither is marked as the
  # factory one. No page says which way the instrument ships, and the manual's "For a factory
  # reset, simultaneously push step buttons 15 and 16 of the fourth track." (p. 33) does not say
  # what a reset restores.
  single:
    label: SINGLE MIDI CHANNEL
  multi:
    label: MULTI MIDI CHANNEL
    # The table is the other mode's: "In SINGLE MIDI CHANNEL mode, the MIDI implementation is as
    # shown in the table below" (p. 35). Here every voice answers to voice 1's eleven on a
    # channel of its own, and the card is pictured with a second file named for this mode, so
    # the map that names no part is not the one in force. **What 81 to 113 do in this mode no
    # page says.**
    unparted: false

parts:
  # THE FOUR VOICES IN MULTI MIDI CHANNEL MODE, each on a channel the player gives it: "In MULTI
  # MIDI CHANNEL mode, you can assign different MIDI channels to each track. Simply use the step
  # buttons of each track to select a MIDI channel." (p. 32), in a sub-menu of the configuration
  # page (p. 31). A track is a voice: "Each track/voice on the PĒRKONS HD-01" (p. 20). One part
  # of four instances, because they share one map and the channel is the only thing that tells
  # them apart. The firmware 1.1 changelog has "Voice 1 = MIDI CH1, Voice 2 = MIDI CH2 etc."
  # (p. 34), stated flatly and read here as where they start, since they can be assigned.
  multi_voice:
    label: Voice
    mode: multi
    count: 4
    channel: assigned
    # A NOTE IS A PITCH HERE, where in the other mode it picks a voice. The changelog heads it
    # "CHROMATIC MIDI NOTE INPUT" (p. 34), and the announcement says the update "adds chromatic
    # tuning of the voices" (firmware_1_1). The sentence under that heading is about programming
    # the sequencer; what a note does when simply played is not recorded - see the account.
    addressing: pitches
    receives: [notes, controls]
    # READ FROM THE INSTRUMENT'S SHAPE AND NOT PRINTED, as the `voice` section's four is: each
    # instance is one of the four voices, so it is counted as holding one note. No page says a
    # voice is monophonic, and none has a voice holding a second note.
    polyphony: 1

voice:
  # A NOTE PICKS A VOICE RATHER THAN A PITCH, in SINGLE MIDI CHANNEL mode: "Voices will be
  # triggered by NOTE ON messages – Voice 1 – C, Voice 2 – C#, Voice 3 – D, Voice 4 – D#" (p. 35).
  # **Which is as far as the document goes** - no octave, so there are no note numbers to list
  # under `voices` and a player has to find them by trying.
  # In MULTI MIDI CHANNEL mode a note is a pitch instead: the firmware 1.1 changelog heads its
  # note "CHROMATIC MIDI NOTE INPUT" (p. 34). The `multi_voice` part's `addressing` records
  # that, and its comment says how far the page goes.
  addressing: voices
  # "4 hybrid voices (digital sound engine and analogue multimode filter with overdrive)" (p. 4),
  # each with its own trigger, its own output and one set of controls, read here as four notes at
  # once. Nothing says a voice will hold a second note. In `multi` the four are the part's four
  # instances, one voice each, which is why the figure stands beside the part's. Both figures
  # are read from the instrument's shape, and neither is printed as a polyphony.
  polyphony: 4
  polyphony_shared: false
  velocity:
    # IT ARRIVES AND DOES NOTHING UNTIL A SETTING IS TURNED ON, which is what `gated` says here:
    # "If the setting is ON in the configuration menu, MIDI notes will be recorded with velocity.
    # Higher velocity means higher volume" (p. 34). The setting is MIDI VELOCITY on the
    # configuration page (p. 31) and is not a control this instrument answers to, so there is
    # nothing to name in `gated_by`.
    note_on: gated
  # NOT RECORDED: note off, aftertouch, pitch bend and the note range. None of the four is
  # mentioned anywhere in the manual, and a drum machine's silence about pitch bend is not the same
  # as a chart's X against it.

groups:
  # THE PAGE'S OWN COLUMN HEADINGS (p. 35), and the only grouping it offers: the four voices are
  # identical in their controls and different in their sound engines.
  voice_1: Voice 1
  voice_2: Voice 2
  voice_3: Voice 3
  voice_4: Voice 4
  # NOT A HEADING ON THE PAGE: the eleven that reach whichever voice a channel is given to, in
  # MULTI MIDI CHANNEL mode.
  multi_voice: Voice

controls:

  # **SIX OF EACH VOICE'S ELEVEN ARE DOUBTED**: decay, PARAM1, PARAM2, cutoff, drive and FX send.
  # They follow the table on p. 35, and the file pictured on p. 36 numbers them differently on
  # the two voices it shows in full - see the head of this file and the source account.

  # ──── voice_1 ────
  # Its three algorithms are FOLD DRUM 1, WAVETABLE DRUM and SIMPLE DRUM (p. 8), in that order,
  # which is what the ALGO switch picks between.

  voice_1_tune:          {label: Voice 1 Tune, cc: 70, group: voice_1, assignment: default}
  voice_1_decay:         {label: Voice 1 Decay, cc: 71, group: voice_1, assignment: default}
  voice_1_param_1:       {label: Voice 1 PARAM1, cc: 72, group: voice_1, assignment: default}
  voice_1_param_2:       {label: Voice 1 PARAM2, cc: 73, group: voice_1, assignment: default}
  voice_1_cutoff:        {label: Voice 1 Cutoff, cc: 74, group: voice_1, assignment: default}
  voice_1_drive:         {label: Voice 1 Drive, cc: 75, group: voice_1, assignment: default}
  voice_1_fx_send:       {label: Voice 1 FX Send, cc: 76, group: voice_1, assignment: default}
  voice_1_level:         {label: Voice 1 Level, cc: 77, group: voice_1, assignment: default}
  voice_1_algo_switch:   {label: Voice 1 Algo Switch, cc: 78, group: voice_1, assignment: default}
