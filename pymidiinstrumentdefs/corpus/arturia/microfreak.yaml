    # Cited for which firmware and which manual edition Arturia published when this was
    # read, which is the question model.firmware has to be judged against. The sha256 is of
    # the page's visible text as saved; the page as served hashes to
    # 421b131aadf45b6d80ac309a5cfb8cfde6be1b46e10edafcd0a2f687e2c9b897. It carries the whole
    # download history, so no later fetch will match either hash.

midi:
  # Input chan is [All, 1 ... 16, None] and Output chan is [1 ... 16] (p. 89). Which one
  # yours is set to belongs to your composition, not here.
  channels: [1, 16]
  # "In 'Play' mode the MicroFreak will send MIDI clocks" (p. 77), and its tempo source is
  # [Int, USB, MIDI, Clock, Auto] (p. 89), so it both sends and follows.
  clock: both
  # Both ways, and asymmetrically, which the one field cannot hold: "When you toggle between
  # Play and Stop the MicroFreak will send MIDI start and stop signals that will start/stop
  # external sequencers" (p. 77), and Start is acted on when it arrives - the Cycling
  # Envelope in Run mode "resets when the MicroFreak receives a MIDI start command" (p. 58),
  # and in step-record mode a START/PLAY signal in the incoming stream puts the sequencer
  # into real-time recording (p. 79). Stop being received is never stated, and Continue is
  # not mentioned anywhere in the manual.
  transport: both
  # NOT RECORDED: program_change, nrpn and sysex. See the source line - the manual never
  # mentions any of them, and its silence is demonstrably not evidence of absence.

voice:
  addressing: pitches
  # "The MicroFreak is a paraphonic four-voice synthesizer ... they all share the same
  # analog filter" (p. 10). Each voice has its own amplitude, which the manual calls
  # extended paraphony. Its MIDI output is not held to four: "if you play a ten note chords
  # all of that data will be transmitted over MIDI" (p. 78).
  polyphony: 4
  paraphonic: true
  # NOT RECORDED, note_range. The Digital Oscillator "can play notes in the range from C-2
  # to G8" (p. 35), but the manual never states which note name is which number: if C-2 is
  # note 0 then G8 is 127 and the range is everything, and if C-1 is note 0 then C-2 is
  # below the MIDI range altogether. Its own CV rows use "[C-1 ... G8]" for a reference
  # note (p. 89), which settles nothing, and p. 64 says "the whole pitch range is eight
  # octaves", which is narrower than either reading of C-2 to G8. "Middle C" appears once in
  # the whole manual, on p. 43, with no number beside it.
  # NOT RECORDED, velocity and aftertouch. The keyboard generates one or the other, never
  # both: "These dots will register your touch as aftertouch or as velocity" (p. 61),
  # chosen per preset at Utility > Preset > Press mode [Aftertouch, Velocity] (p. 88).
  # Each has its own response curve, [Lin, Log, Exp] (p. 90), and Velo Amp Mod [0 ... 10]
  # sets how much velocity affects volume (p. 88). What the instrument does with either
  # when it arrives over MIDI is not stated, and nor is whether its aftertouch is channel
  # or polyphonic, so neither field is filled in.
  # NOT RECORDED, pitch_bend. Bend Range is a preset parameter and the manual gives its
  # extent three ways that do not fit together: the Utility table says [0 ... 24], "From
  # zero to two octaves" (p. 88), while p. 69 says "By default the bend range is set to 24
  # chromatic steps: 12 from the center to the left and 12 from the center to the right" and
  # that the range can be set "with a maximum of 48 steps (= four octaves)". So 24 is the
  # table's maximum and the prose's default, and whether the number counts semitones each
  # way or in total is not settled. Nor does the manual say whether the setting governs
  # pitch bend arriving over MIDI, or whether the Bend strip sends pitch bend at all.

groups:
  # Appendix D prints two columns, Parameter and CC number, and no section at all, so these
  # are the manual's own chapter names for the same controls: 6. The Digital Oscillator
  # (p. 34), 7. The Filter (p. 48), 8. The LFO (p. 52), 9. The Envelope Generator (p. 55) with
  # 9.6 The Cycling Envelope Generator (p. 57), 10. The Keyboard Section (p. 61), and the
  # Arpeggio and Sequencer Section, which is the running head over 12. The Arpeggiator (p. 70)
  # and 13. The Sequencer (p. 76). A leading "The" is dropped and a chapter's subtitle with it,
  # so chapter 7, "The Filter: sound in close-up", gives "Filter".
  # The order is the order the appendix lists the controls, which is the order they appear
  # below.
  # The first group is the one the manual does not cover in a single place: Arturia calls
  # Spice one of "the three live controls: Spice, Dice, and Bend" in the panel overview
  # (p. 9), while Glide has its own part of the keyboard chapter (10.3, p. 63). So its label
  # is not the maker's word for a section, because the maker has no one section for it.
  performance: Performance
  oscillator: Digital Oscillator
  filter: Filter
  cycling_envelope: Cycling Envelope Generator
  envelope: Envelope Generator
  keyboard: Keyboard Section
  arpeggiator_sequencer: Arpeggio and Sequencer Section
  lfo: LFO

controls:

  # Appendix D, pp. 128-129, in the order and the words the table prints, which is ascending
  # CC. The table gives names and numbers only: every range below is the format's own
  # 0-127, which p. 111 states for CC# codes generally, and no control claims a value.

  spice:                  {label: Spice, cc: 2, group: performance}
  glide:                  {label: Glide, cc: 5, group: performance}
  oscillator_type:        {label: Oscillator Type, cc: 9, group: oscillator}
  oscillator_wave:        {label: Oscillator Wave, cc: 10, group: oscillator}
  oscillator_timbre:      {label: Oscillator Timbre, cc: 12, group: oscillator}
  oscillator_shape:       {label: Oscillator Shape, cc: 13, group: oscillator}
  filter_cutoff:          {label: Filter Cutoff, cc: 23, group: filter}
  cycling_env_amount:     {label: Cycling Env Amount, cc: 24, group: cycling_envelope}
  filter_amount:          {label: Filter Amount, cc: 26, group: filter}
  cycling_env_hold:       {label: Cycling Env Hold, cc: 28, group: cycling_envelope}
  envelope_sustain:       {label: Envelope Sustain, cc: 29, group: envelope}

  # CC 64 is the specification's Damper Pedal, and holding notes is what Arturia uses it
  # for. The table prints "(toggle)" in the name but gives no on and off values, so this
  # stays continuous rather than being a switch whose two states nobody published.
  # Read p. 66 beside this one: "Hold does not work with external MIDI. If you need to hold
  # external MIDI note(s), send the MicroFreak a Sustain message." So the panel's Hold
  # button does not hold notes that arrive over MIDI, and a Sustain message does - which is
  # what CC 64 is in the specification. The manual never says the two are the same message,
  # and this file does not say so either.
  keyboard_hold:          {label: Keyboard Hold (toggle), cc: 64, group: keyboard}

  filter_resonance:       {label: Filter Resonance, cc: 83, group: filter}
  arp_seq_rate_free:      {label: ARP/SEQ rate (free), cc: 91, group: arpeggiator_sequencer}
  arp_seq_rate_sync:      {label: ARP/SEQ rate (sync), cc: 92, group: arpeggiator_sequencer}
  lfo_rate_free:          {label: LFO rate (free), cc: 93, group: lfo}
  lfo_rate_sync:          {label: LFO rate (sync), cc: 94, group: lfo}

  # The manual's own tutorial on p. 111 calls CC 5 "the CC# number of the Rise parameter",
  # which contradicts this table twice over: 5 is Glide, and Rise is 102. The table is
  # followed, since it names every parameter and the tutorial is describing what a third
  # party's software displayed.
  cycling_env_rise:       {label: Cycling env rise, cc: 102, group: cycling_envelope}
  cycling_env_fall:       {label: Cycling env fall, cc: 103, group: cycling_envelope}

  envelope_attack:        {label: Envelope Attack, cc: 105, group: envelope}
  envelope_decay:         {label: Envelope Decay, cc: 106, group: envelope}
