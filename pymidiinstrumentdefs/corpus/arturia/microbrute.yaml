    url: "https://www.arturia.com/api/download/products/microbrute/manual/MicroBrute_Manual_1_1_0_EN.pdf"
    sha256: f53c242634771600e39b76afb68066de8bd79e28a6cdf48feaa104502c7613e9
    retrieved: 2026-10-06
    # Fifty sheets, a text layer throughout, and **no controller number anywhere in it**. Its
    # printed folio matches the sheet, so a page below is the sheet. The downloads page prints
    # the German word `Versionen` beside it on the English page, which is the maker's own slip
    # and not a sign of the wrong file.
  connection:
