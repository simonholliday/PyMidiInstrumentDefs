midi:
  # Four switches on the back panel set it, 1 to 16, by the item quoted in the account
  # (guide p. 18), and "MIDI in / thru 2 x 5-pin DIN, 16 channels" (guide p. 111). Which one an
  # instrument is on belongs to its owner's rig, not here.
  channels: [1, 16]
  # NOT RECORDED, AND NOT DECLARED ABSENT, the controllers: see the comment above the definition.
  # NOT RECORDED EITHER: the MIDI mode, MIDI clock, transport, program change, system exclusive
  # and NRPN, none of which the guide names.

voice:
  # A reading: the guide's keyboard is another instrument's, and MIDI IN is where the guide
  # expects one. See the account.
  addressing: pitches
  # One voice or two by a sliding switch (guide pp. 14, 113), the second a control voltage at a
  # jack. NOT RECORDED: `polyphony`, the specifications giving a word, Multiphonic, and no
  # figure, and a switch having no default,
  # and the note range, velocity, aftertouch and pitch bend, none of which is mentioned.
  voicing_modes: [1, 2]
