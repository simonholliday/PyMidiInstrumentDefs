midi:
  # "MIDI Channel: ALL, 1…16—Selects which MIDI channel to send and receive data, 1 to 16"
  # (guide p. 13), where ALL receives on every channel at once.
  channels: [1, 16]
  # THE MAKER'S OWN WORD, in both documents. The numbers are not recorded; see the source account.
  nrpn: preferred
  program_change:
    # "Program change, 0-39" (p. 2) is received and "Program change" (p. 3) transmitted.
    receives: true
    sends: true
    # 200 factory and 200 user (guide p. 6), and a program change reaches forty of them at a time.
    presets: 400
  # Four layouts given byte by byte on printed pp. 10 to 13, and a global that chooses the port.
  sysex: true
  # NOT RECORDED: clock and transport. Neither word appears anywhere in the implementation.

voice:
  # Ten (guide p. 1), and nine with a plug in the gate in jack (guide p. 3). Five when two layers
  # are stacked, five a layer when split, and five on request - see the source account.
  polyphony: 10
  velocity:
    # "Note On. Note off if vvvvvvv = 0" (p. 2) is received.
    note_on: received
    # "Note Off. Velocity is ignored" (p. 2), and what it sends is a literal zero (p. 3).
    note_off: false
  # IT RECEIVES POLYPHONIC KEY PRESSURE AND ITS KEYBOARD SENDS CHANNEL PRESSURE. This field says
  # what it answers to; the source account has both halves.
  aftertouch: poly
  pitch_bend:
    # "A setting of 1 equals a semitone. A setting of 12 equals an octave" (guide p. 37), chosen
    # per program. Controller 70 counts the same twelve values from 0 to 11.
    semitones: 12
    programmable: true

groups:
  # The maker's own leading words, which is all the implementation gives: it prints no heading
  # over any of its 59 rows. Seventeen rows that begin with none of them are placed by the User's
  # Guide's own chapters, one row at a time - the Prophet-5's division exactly, because the two
  # guides have the same chapters under the same headings.
  osc_a: OSC A
  osc_b: OSC B
  poly_mod: POLY MOD
  lfo: LFO
  filter: FILTER
  envelope: ENVELOPE
  unison: UNISON
  pressure: PRESSURE
  performance: Performance
  global: Global

controls:

  # OSC A ───────────────────────────────────────────────────
  osc_a_frequency:                     {label: OSC A FREQUENCY, cc: 3, range: [0, 120], group: osc_a}
  osc_a_saw_on_ff:                     {label: OSC A SAW ON/FF, cc: 15, range: [0, 1], group: osc_a}
  osc_a_square_on_off:                 {label: OSC A SQUARE ON/OFF, cc: 20, range: [0, 1], group: osc_a}
  osc_a_pulse_width:                   {label: OSC A PULSE WIDTH, cc: 21, range: [0, 120], group: osc_a}
  osc_sync_on_off:                     {label: OSC SYNC ON/OFF, cc: 23, range: [0, 1], group: osc_a}
  osc_a_level:                         {label: OSC A LEVEL, cc: 27, range: [0, 120], group: osc_a}

  # OSC B ───────────────────────────────────────────────────
  osc_b_frequency:                     {label: OSC B FREQUENCY, cc: 9, range: [0, 120], group: osc_b}
  osc_b_fine_tune:                     {label: OSC B FINE TUNE, cc: 14, group: osc_b}
  osc_b_pulse_width:                   {label: OSC B PULSE WIDTH, cc: 22, range: [0, 120], group: osc_b}
  osc_b_low_freq_on_off:               {label: OSC B LOW FREQ ON/OFF, cc: 24, range: [0, 1], group: osc_b}
  osc_b_keyboard_on_off:               {label: OSC B KEYBOARD ON/OFF, cc: 25, range: [0, 1], group: osc_b}
  osc_b_level:                         {label: OSC B LEVEL, cc: 28, range: [0, 120], group: osc_b}
  osc_b_saw_on_off:                    {label: OSC B SAW ON/OFF, cc: 30, range: [0, 1], group: osc_b}
  osc_b_tri_on_off:                    {label: OSC B TRI ON/OFF, cc: 52, range: [0, 1], group: osc_b}
  osc_b_square_on_off:                 {label: OSC B SQUARE ON/OFF, cc: 116, range: [0, 1], group: osc_b}

