# The sixth Roland here, and the first instrument in this corpus whose maker publishes a proper
# MIDI implementation document AND a two-chart implementation summary AND seven firmware
# supplements. All of it was read, and the whole of what it establishes is below.
#
# THE CONTROLLER MAP IS THE MIDI SPECIFICATION'S OWN. Every one of the 33 controls below is a
# standard assignment under its standard name - bank select, modulation, breath, foot, portamento
# time, volume, pan, expression, the five pedals, the eight sound controllers, the eight general
# purpose controllers and two effect sends. Roland invents none of them. That is why the groups
# are the specification's sections rather than a panel's layout: there is no panel layout to
# follow, because the knobs and sliders are assignable to any controller rather than wired to one.
#
# THREE KEYBOARDS, ONE DEFINITION. The FANTOM-6, -7 and -8 differ in their keyboards alone - 61,
# 76 and 88 keys, the last with a different action - and the implementation documents are headed
# "FANTOM-6/7/8" for all three. "FANTOM EX" is a system upgrade for these same keyboards and is
# covered. Roland's other Fantoms are not: the 2001 Fantom, the Fantom-S, -X and -G, and the
# FANTOM-0 are different instruments that share a name.

definition: 1

model:
  manufacturer: Roland
  name: FANTOM-6/7/8
  # THE NEWEST RELEASE, AND THE MAP IS CHECKED UNCHANGED ACROSS EVERY ONE BEFORE IT. No document
  # here states which firmware it describes - the implementation document says only "Version：
  # 1.00" of itself, and the only firmware-shaped data in 67 pages is an Identity Reply whose
  # software revision distinguishes the three models rather than naming a version.
  # What is checked: Roland publishes a supplementary manual for each release, and **all seven
  # were fetched and read** - 1.10, 1.50, 1.60, 2.00, 2.10, 2.50 and 3.00. **Not one adds,
  # removes or renumbers a controller.** Three of them print the same list of modulation sources,
  # "CC01-31 Controller number 1-31, CC33-95 Controller number 33-95, BEND Pitch bend, AFT
  # Aftertouch", which is the matrix's source list and not a change to the map. So the chart
  # published at version 1.00 is not known to be superseded, and it holds at 3.00.
  firmware: "3.00"

source: >-
  Four documents, all of them read: the MIDI Implementation (67pp, version 1.00 of 1 November
  2020), which is where every number below comes from; the Reference Manual (132pp), for the two
  implementation charts at pp. 128-129 and the settings at pp. 115-117; the Owner's Manual
  (24pp), for the zones and the specifications; and the seven firmware supplements, for the
  question of whether any release changed the map.

  THE IMPLEMENTATION DOCUMENT PRINTS NO PAGE NUMBERS OF ITS OWN, so a citation to it is a page
  of the file and `page_offset` is zero by default rather than by measurement. Both readings
  confirmed that separately.

  IT IS ORGANISED BY DIRECTION, WHICH IS WHY IT WAS READ THAT WAY. Section 1 is what the sound
  source receives (pp. 1-8), section 2 what it transmits (pp. 8-12), sections 3 and 4 what the
  sequencer records and plays (pp. 12-14), section 5 the Parameter Address Map (pp. 14-64) and
  section 6 supplementary material. Sections 3 and 4 are deliberately not read for controls:
  they say what the recorder does, not what the sound engine answers to. Section 5 holds system
  exclusive addresses and no controller numbers.

  SECTION 2 NAMES FIVE FEWER CONTROLLERS THAN SECTION 1, AND THE DOCUMENT SAYS WHY. Foot type
  (4), Decay Time (75), Vibrato Rate (76), Vibrato Depth (77) and Vibrato Delay (78) have an
  entry under reception and none under transmission. That looks like an asymmetry worth
  recording and it is not, because section 2 opens with this: "By selecting a controller number
  that corresponds to the setting of parameters of controllers, the FANTOM-6/7/8 can transmit
  any control change message." (p. 8) It then prints one numberless entry, "General Controller",
  whose second byte is "Controller number: 00H - 77H (0 - 31, 33 - 95)" (p. 10) - a range that
  covers all five. The Reference Manual's chart says the same thing in its own way, marking the
  row "1-31, 33-95" transmitted. So every control below is `both`, which is this format's
  default and is why none of them says so.

  AND THAT SENTENCE CONTRADICTS ITSELF IN ONE CHARACTER. "00H - 77H" is 0 to **119**, not 0 to
  95; for the range the same line glosses, the hex would be 00H-1FH and 21H-5FH. The hex and the
  decimal cannot both be right and the document does not say which it means. Recorded and not
  resolved - it matters because that one line is the only thing in section 2 that accounts for
  the five missing controllers.

  THE TWO DOCUMENTS AGREE ABOUT CC 17, though this account once said they did not. The
  implementation document names General Purpose Controller 2 at CC 17, in both of its sound-source
  sections, and the Reference Manual's chart prints a row for 17, General purpose controller 2,
  between 16 and 18 (reference p. 128). It is carried here.

  FIVE NUMBERS ARE NOT CARRIED, AND THE LINE IS DRAWN ONCE AND SAID OUT LOUD. Data Entry (6 and
  38), the RPN selects (100 and 101) and the High Resolution Velocity Prefix (88) are all named in
  the document and none is a parameter of this instrument: they are how the MIDI specification
  addresses things and how it extends a note's resolution. That is the same ruling that keeps the
  channel mode messages out - 120, 121, 123, 124, 125, 126 and 127, which this document also
  names - drawn one step wider. **Bank Select (0 and 32) is carried**, as it is wherever a maker
  numbers it; this file once set it aside with the five, and other definitions followed it there.

  EVERY NUMBER WAS READ TWICE AND THE TWO AGREE ON EVERY ONE. The second reading, made without
  sight of the first, worked from glyph geometry rather than from extracted text and then
  rendered pages 1-14 and read them by eye. It reports a trap worth passing on: **the controller
  headings are marked with ○, U+25CB, while ● marks a message type**, so a pattern looking for
  `●` and a controller number finds the channel mode messages and misses every control change.

  NRPN IS A CHECKED ABSENCE, FROM BOTH DOCUMENTS AT ONCE. The implementation document names no
  NRPN parameter anywhere in 67 pages and gives no heading for controllers 98 and 99, so there
  is no way to select one; the Reference Manual's chart marks 98 and 99 "x" in both its
  transmitted and recognised columns. NRPN appears only in passing, in Data Entry's gloss and in
  the Reset All Controllers table. **RPN, by contrast, is received and the document lists exactly
  four**: Pitch Bend Sensitivity, Channel Fine Tuning, Channel Coarse Tuning and RPN null.

  EVERY CONTROL BELOW NAMES THE ZONE, BECAUSE A ZONE IS WHAT RECEIVES IT. Each of the sixteen
  sets the channel it receives on, "Receive Channel 1-16 Specifies the MIDI channel assigned to
  each zone" (parameter_guide p. 11), and no zone's is set from another channel, so a control
  naming no part would mean a base channel, which the FANTOM does not have. Beside the zones'
  own, the system's MIDI settings name one channel more, the Scene Control Channel, which
  "Specifies the MIDI channel for controlling the scene" (reference p. 115); bank select's note
  below says what that leaves open. The implementation document puts every channel voice message
  it receives, control change among them, behind a zone's switch, "Not received when the Zone
  Receive Switch parameter (ZONE EDIT:LEVEL/PAN) is OFF." (implementation p. 1), and nineteen of
  the thirty-three below say more of the zone: fourteen change a setting of the zone's own, as 7
  does its level and 74 its cutoff offset, and five more, bank select's two with 1, 11 and 64,
  can each be refused by a filter in the zone (implementation pp. 1 to 4). The other fourteen are
  tied to the zone by that note alone. What any of them does beyond that is assigned elsewhere: a
  tone's MFX and matrix controls can take a controller as their source, and so can the four
  System Control sources, whose settings "allow you to specify MIDI messages that will apply in
  common" (reference p. 117) to the whole instrument, or in their place a scene's own four
  (reference p. 117). The matrix controls are reached through a zone: "When a tone with Matrix
  Control settings is assigned to a zone, confirm that any MIDI messages used for the Matrix
  Control will be received" (parameter_guide p. 29). For the System Control sources no page says
  on which channel they must arrive.

  NOT RECORDED: the sound generator's polyphony, which no document here states. The Reference
  Manual mentions the maximum polyphony twice (reference pp. 124 and 126) without a figure, and
  its specifications give one only for the pad sampler, "Maximum Polyphony: 8" (reference p. 130).
  And the preset count: program change reaches "Program Number 1-128" per the chart and Bank
  Select chooses the bank. The specifications count the scenes, "128 Scenes x 4 Bank" (reference
  p. 130), but give the tones only as "Over 3,500 Tones" (reference p. 130). The parameter guide
  names the tone banks by kind (parameter_guide p. 11), and the bank select table prints the first
  LSB of each and elides the rest of most (implementation p. 1), so no document here says how many
  128-program banks of tones there are.

sources:
  implementation:
    kind: midi_implementation
    title: "MIDI Implementation Model: FANTOM-6/7/8"
    edition: "1.00"
    dated: 2020-11-01
    landing: "https://www.roland.com/global/support/by_product/fantom_6/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/FANTOM-6_7_8_MIDI_Imple_eng01_W.pdf"
    sha256: 8b16ed3b916637e5255664171e4da9ad639cd7f4db2c9154b85854c9ffa2d6fd
    retrieved: 2026-10-03
    # 67 pages, and it prints no folios, so a page cited here is a page of the file. It is
    # AES-128 encrypted with an owner password and opens freely; both readings opened it.
  reference:
    kind: manual
    title: FANTOM-6/FANTOM-7/FANTOM-8 Reference Manual
    edition: eng01
    landing: "https://www.roland.com/global/support/by_product/fantom_6/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/FANTOM-6_7_8_reference_eng01_W.pdf"
    sha256: 1b2c7e19654f8a20dc218755e684a429706ae46f538912c4cf4b8bac5acc604d
    retrieved: 2026-10-03
    # 132 pages. Carries the two MIDI implementation charts, one for the sound generator section
    # and one for the sequencer, both dated 1 September 2019 at version 1.00 - a year older than
    # the implementation document above.
  parameter_guide:
    kind: manual
    title: FANTOM-6/FANTOM-7/FANTOM-8 Parameter Guide
    edition: eng01
    landing: "https://www.roland.com/global/support/by_product/fantom_6/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/FANTOM_ParameterGuide_eng01_W.pdf"
    sha256: 80b8b5c99276192a67471fdac9d64e963555eb883b831c9406dd15b0fc3ac73d
    retrieved: 2026-10-03
    # 76 pages. Cited for the per-zone settings the other three documents only imply: which
    # channel a zone receives on, and the switches that make it ignore either kind of pressure.
  owners_manual:
    kind: manual
    title: FANTOM-6/FANTOM-7/FANTOM-8 Owner's Manual
    edition: eng02
    landing: "https://www.roland.com/global/support/by_product/fantom_6/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/FANTOM-6_7_8_eng02_W.pdf"
    sha256: bdeb60a09915534afbc176d7f6a025db3199aff205b5460ddafd3c60126d2380
    retrieved: 2026-10-03
    # 24 pages, a short guide rather than a full manual. Cited for the zones and for the
    # specifications table that distinguishes the three keyboards.

midi:
  # Every channel message in the implementation document repeats "n = MIDI channel number: 0H -
  # FH (ch.1 - 16)", and the chart's Basic Channel row gives 1-16 as both the default and what it
  # can be changed to. Each zone is given one: "Receive Channel 1-16 Specifies the MIDI channel
  # assigned to each zone" (parameter_guide p. 11).
  channels: [1, 16]
  # The chart's Mode row: "Default Mode 3" in both columns, and Mode 3 is Omni Off, Poly.
  mode: 3
  # BOTH, BUT NOT BY THE SAME SECTION. The sound generator receives clock and does not send it -
  # the chart's System Realtime row is "x" transmitted and "o" recognised - while **the
  # sequencer's chart marks Clock "o" both ways**, and the Reference Manual's Sync Mode setting
  # offers MASTER, "The FANTOM will be the synchronization master" (reference p. 117),
  # against SLAVE with a System Clock Source of MIDI or USB. So the instrument does both and which half of it does
  # which is a fact about its sections rather than about its sockets.
  clock: both
  # Likewise: the sequencer's chart marks Commands "o" in both columns, where the sound
  # generator's marks them "x". Start, stop and continue are the sequencer's business.
  transport: both
  program_change:
    # "Receive Program Change OFF, ON Specifies whether program change messages will be received"
    # (reference p. 115), and the sound generator's chart marks Program Change "o" in both
    # columns with "Program Number 1-128" against its True Number row.
    receives: true
    sends: true
    # NOT RECORDED, the preset count: 1-128 is what one bank holds and Bank Select chooses the
    # bank, and no document here says how many 128-program banks of tones there are. The scenes'
    # four banks are in the source account.
  # A CHECKED ABSENCE FROM TWO DOCUMENTS AT ONCE: no NRPN parameter is named in 67 pages, no
  # heading exists for controllers 98 and 99, and the chart marks both "x" in both directions.
  nrpn: none
  # Section 5 of the implementation document is a Parameter Address Map running from p. 14 to
  # p. 64, which is the bulk of it, and the charts mark System Exclusive "o" in both columns.
  sysex: true

voice:
  addressing: pitches
  # The chart's Note Number row gives 0-127 transmitted and recognised, and its True Voice row
  # 0-127 - which is the instrument saying it sounds every note it answers to.
  note_range: [0, 127]
  # NOT RECORDED, the polyphony. See the source account: the Reference Manual refers to the sound
  # generator's maximum twice and never gives it, and the one figure printed is the pad sampler's.
  velocity:
    # Sent as well as received: the sound generator's chart marks Note On "o" in both columns
    # (reference p. 128), and with Keyboard Velocity at REAL, "The transmitted velocity value will
    # correspond to the force with which you strike the key" (reference p. 113); set to a number
    # from 1 to 127, that number is sent instead. Until 2026-10-14 this said `received`.
    note_on: both
    # The chart marks Note On and Note Off "o" in both columns, so release velocity travels too.
    note_off: true
  # BOTH KINDS ARE RECEIVED. The sound generator section's chart (reference p. 128) gives the
  # After Touch rows: Key's is "x" transmitted and "o" recognised, Channel's is "o" in both. So
  # the sound generator answers to polyphonic pressure and never sends it, and channel pressure
  # goes both ways - and a zone can be told to ignore either: "Receive Poly Key Pressure (PA)
  # OFF, ON Specifies whether polyphonic aftertouch is received (ON) or not received (OFF)."
  # (parameter_guide p. 14), and "Receive Channel Pressure (CA) OFF, ON Specifies whether
  # channel aftertouch is received (ON) or not received (OFF)" (parameter_guide p. 14). Until
  # 2026-10-12 this said `poly`, the stronger of two words where the field had no third, after
  # the MC-707's precedent.
  aftertouch: both
  # SENT, BUT NOT BY THE SAME SECTION: the sound generator sends channel pressure (reference
  # p. 128), and the sequencer section's chart circles both kinds as transmitted (reference
  # p. 129), polyphonic pressure being what a track has recorded.
  aftertouch_transmits: true
  pitch_bend:
    # Settable over RPN, which the implementation document lists first among the four it
    # receives: RPN 00 00H is Pitch Bend Sensitivity, "mm: 00H - 18H (0 - 24 semitones)" with
    # "Up to 2 octave can be specified in semitone steps" (p. 4). The factory depth is not
    # stated, so `semitones` is unrecorded; what it can be set to is 0 to 24.
    programmable: true

parts:
  zone:
    label: Zone
    count: 16
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # "There are 16 zones; by combining zones you can create sounds that consist of multiple
    # tones" (owners_manual p. 11), each with a receive channel of its own. The address map
    # bears it out from the other side, running Scene Zone 1 to Scene Zone 16 with a Receive
    # Channel apiece.
    # A ZONE NEED NOT SOUND ANYTHING, which is unusual enough to say: "You can also use specific
    # zones to control an external sound module (EXT ZONE) instead of the internal sound engine"
    # (owners_manual p. 11). So the same sixteen parts are the instrument's voices and its
    # sixteen-channel MIDI output, switched one at a time, and nothing in the format distinguishes
    # a zone doing one job from the same zone doing the other.

groups:
  # THE MIDI SPECIFICATION'S OWN SECTIONS, not a panel's layout and not this maker's headings -
  # the implementation document prints one flat list in numerical order and gives it no grouping
  # at all. These are used because the map itself is the standard assignment: every name below is
  # the specification's name for that number. Grouping them any other way would suggest this
  # instrument has a layout these numbers follow, and it does not: its knobs and sliders are
  # assignable to any controller from 1 to 31 and 33 to 95.
  continuous: Continuous controllers
  general_purpose: General purpose controllers
  switch: Switches and pedals
  sound: Sound controllers
  effects: Effect send levels

controls:

  # Bank select ───────────────────────────────────────────
  # Carried, as it is wherever a maker numbers it: "Bank Select (Controller number 0, 32)"
  # (implementation p. 1) heads it under reception, and the same under transmission
  # (implementation p. 8), and "0, 32" is both ways on the sound generator's chart (reference
  # p. 128). Reception needs the system's Receive Bank Select and the zone's own; transmission
  # needs Transmit Program Change and Transmit Bank Select (implementation p. 8).
  # NAMED FOR THE ZONE, THOUGH ONE OF ITS JOBS MAY NOT BE A ZONE'S. The zone's filter can refuse
  # it, and its tables of banks list the tones and drum kits (implementation pp. 1 and 2); but the
  # first lists scenes, at MSB 85 (implementation p. 1), and scenes have a channel of their own,
  # the Scene Control Channel quoted in the source account. No page says on which channel a bank
  # select of 85 must arrive to choose a scene, so that use has no control of its own here.
  bank_select_msb:                   {label: Bank Select (MSB), cc: 0, part: zone}
  bank_select_lsb:                   {label: Bank Select (LSB), cc: 32, part: zone}

  # Continuous controllers ────────────────────────────────
  modulation:                        {label: Modulation, cc: 1, part: zone, group: continuous}
  breath_type:                       {label: Breath type, cc: 2, part: zone, group: continuous}
  foot_type:                         {label: Foot type, cc: 4, part: zone, group: continuous}
  portamento_time:                   {label: Portamento Time, cc: 5, part: zone, group: continuous}
  volume:                            {label: Volume, cc: 7, part: zone, group: continuous}
  panpot:                            {label: Panpot, cc: 10, part: zone, group: continuous}
  expression:                        {label: Expression, cc: 11, part: zone, group: continuous}

  # General purpose controllers ───────────────────────────
  general_purpose_controller_1:      {label: General Purpose Controller 1, cc: 16, part: zone, group: general_purpose}
  general_purpose_controller_2:      {label: General Purpose Controller 2, cc: 17, part: zone, group: general_purpose}
  general_purpose_controller_3:      {label: General Purpose Controller 3, cc: 18, part: zone, group: general_purpose}
  general_purpose_controller_4:      {label: General Purpose Controller 4, cc: 19, part: zone, group: general_purpose}
  general_purpose_controller_5:      {label: General Purpose Controller 5, cc: 80, part: zone, group: general_purpose}
  general_purpose_controller_6:      {label: General Purpose Controller 6, cc: 81, part: zone, group: general_purpose}
  general_purpose_controller_7:      {label: General Purpose Controller 7, cc: 82, part: zone, group: general_purpose}
  general_purpose_controller_8:      {label: General Purpose Controller 8, cc: 83, part: zone, group: general_purpose}

  # Switches and pedals ───────────────────────────────────
  hold_1:                            {label: Hold 1, cc: 64, part: zone, group: switch}
  portamento:                        {label: Portamento, cc: 65, part: zone, group: switch}
  sostenuto:                         {label: Sostenuto, cc: 66, part: zone, group: switch}
  soft:                              {label: Soft, cc: 67, part: zone, group: switch}
  legato_foot_switch:                {label: Legato Foot Switch, cc: 68, part: zone, group: switch}
  portamento_control:                {label: Portamento control, cc: 84, part: zone, group: switch}

  # Sound controllers ─────────────────────────────────────
  resonance:                         {label: Resonance, cc: 71, part: zone, group: sound}
  release_time:                      {label: Release Time, cc: 72, part: zone, group: sound}
  attack_time:                       {label: Attack time, cc: 73, part: zone, group: sound}
  cutoff:                            {label: Cutoff, cc: 74, part: zone, group: sound}
  decay_time:                        {label: Decay Time, cc: 75, part: zone, group: sound}
  vibrato_rate:                      {label: Vibrato Rate, cc: 76, part: zone, group: sound}
  vibrato_depth:                     {label: Vibrato Depth, cc: 77, part: zone, group: sound}
  vibrato_delay:                     {label: Vibrato Delay, cc: 78, part: zone, group: sound}

  # Effect send levels ────────────────────────────────────
  general_purpose_effect_1_reverb_send_level: {label: General Purpose Effect 1 (Reverb Send Level), cc: 91, part: zone, group: effects}
  general_purpose_effect_3_chorus_send_level: {label: General Purpose Effect 3 (Chorus Send Level), cc: 93, part: zone, group: effects}
