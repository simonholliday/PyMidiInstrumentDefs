  # ---- track 9, CH, on base channel + 2
  track_9_level:                 {label: Level, cc: 8, part: track_9}
  track_9_mute:                  {label: Mute (>0 mutes trk), cc: 12, direction: receives, part: track_9}
  track_9_machine_parameter_1:   {label: Machine parameter 1, cc: 16, part: track_9, group: synthesis}
  # ---- track 10, OH, on base channel + 2
