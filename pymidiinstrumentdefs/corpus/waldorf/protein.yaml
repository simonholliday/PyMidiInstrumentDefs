    # **ONE SHEET, AND IT SETTLES THREE THINGS NO OTHER DOCUMENT DOES**: that the version is the
    # firmware's, the preset count, and that a controller number is recognised for choosing a
    # preset. See the account above for why it is also the one the downloads page does not name.
    # It was made on the same day the downloads page's answer naming it is dated.
    # It has a section for 1.02 and one for 1.01 and **none for what came before them**. No
    # manual here describes that instrument by itself: the German one is labelled "Version: 1.0,
    # November 2025" (german_manual p. 4) and has later additions in its body. The two-sheet
    # specification is the only document here made before 1.01.
    # One of its 1.02 fixes is a MIDI fault worth a consumer's attention: "MIDI note-off and
    # pitch-bend messages leak between layers in MIDI split mode." (changelog).
