midi:
  # "MIDI In Channel: (All, 1…16)" (manual p. 126), where All is every channel at once.
  channels: [1, 16]
  # `MIDI Clock Mode` is off, in, out or in-tempo-sync (manual p. 128), so it can be sent or
  # followed, one or the other by setting.
  clock: both
  # "MIDI start/stop sequence - If on, MIDI start messages will star the internal sequencer"
  # (spec p. 2), and no document says the instrument sends either.
  transport: receives
  program_change:
    # "the 3rd Wave will accept program changes from incoming MIDI messages" (manual p. 121) - see
    # the source account for the setting the manual names and does not list.
    receives: true
    # Behind "MIDI Send Program Change: (off, on)" (manual p. 127).
    sends: true
  # Pages of it: program import and export, wavetables, samples, a device inquiry (spec pp. 46-75).
  sysex: true
  # "NRPNs are the preferred method." (manual p. 127).
  nrpn: preferred
  # "The 3rd Wave responds to MIDI Polyphonic Expression (MPE)." (manual p. 122), in a mode a global
  # setting turns on.
  per_voice_channels: true

voice:
  # "Because the 3rd Wave has 8 voices of polyphony, multi-parts equally divide the voices"
  # (manual p. 10) - so four each with both parts active.
  polyphony: 8
  pitch_bend:
    # "Pitch bend range up, 0-24 semitones" (spec p. 19) and down the same, per program.
    programmable: true

groups:
  # THE MAKER'S OWN DIVISIONS. The controller table's own column heading for what it lists, and the
  # NRPN table's category names, which the specification defines (spec p. 18).
  panel: 3rd Wave Control
  single: Single
  multi: Multi
  global: Global

