    # The only version history Korg publishes for this instrument, and the reason `firmware` is
    # not recorded above: 1.11 fixed MIDI CC assignments and 1.14 fixed single-channel MIDI
    # handling of note events, both after the charts were written.

midi:
  # ON THE SPLIT CHANNELS THE SIX PARTS ARE ON CHANNELS 1 TO 6 AND NOTHING SETS A BASE. The
  # split-channel chart marks Basic Channel as X in the Received column, which is this chart
  # saying there is no basic channel to set: its Mode row remarks "Channel 1-6 = Parts 1-6"
  # (chart p. 1) instead. So on the split channels the base is 1 and cannot be anything else,
  # and the split part below, six instances from an offset of 0, is what puts them on 1 to 6.
  # Setting a channel at all is what switches the instrument to the other implementation, and
  # on the single channel the base is the channel set, 1 to 16. **This field is the split
  # chart's, and the single mode below gives its own range.** Here it is this file's reading
  # of the split chart's X. Until 2026-10-12 the format had one figure for the whole
  # instrument, and the single channel's 1 to 16 was in words only.
  # THE SPLIT CHART CONTRADICTS ITSELF HERE AND BOTH READINGS ARE RECORDED. An X against Basic
  # Channel says the instrument answers to no basic channel at all, and three cells of the same
  # chart say otherwise: the recognised mode is 3, which is omni off, and the Mode and Velocity
  # rows both spell out that channels 1 to 6 are parts 1 to 6. A device that is omni off and
  # answers on six channels has a basic channel. The single-channel chart gives 1-16 and
  # "Memorized" for the same row. This file follows the X - as "in this mode the player cannot
  # change it" rather than "there is none" - because that is the reading the two remarks agree
  # with.
  channels: [1, 1]
  # Both charts' recognised Mode default, 3, which is omni off and poly. Mode messages are
  # marked X in both columns of each.
  mode: 3
  # "System Real Time: Clock" is X transmitted and O received, with footnote *2. The instrument
  # has no MIDI OUT, so nothing it does travels outward; SYNC OUT is a 3.5 mm pulse jack and not
  # MIDI.
  clock: receives
  # "System Real Time: Commands" and "System Common: Song Position" are both X transmitted and
  # O received, with footnote *2. Song Select and Tune Request are X in both columns.
  transport: receives
  # ALSO RECEIVED, with no field to hold it: Active Sensing is O in the Received column of both
  # charts, where Local On/Off, All Notes Off and System Reset beside it are X.
  program_change:
    # O received, X transmitted, with "True Number" a row of asterisks in both columns, so the
    # charts say it answers to program change and do not say what range.
    receives: true
    sends: false
    # NOT RECORDED: how many presets. See the source account.
  # System Exclusive is X in both columns of both charts: a checked absence rather than silence.
  sysex: false
  # CHECKED AND ABSENT, AS WORDS. NRPN, RPN, Registered and Parameter Number appear nowhere on
  # either chart or on printed page 3 of the manual. **The numbers are not all absent.** The
  # split chart lists 10, 14 to 31, 46 to 52, 103 and 116 to 119, so none of 6, 38 and 98 to
  # 101. The single chart lists 14 to 20, 23 to 29, 46 to 52, 55 to 61, 80 to 86, 89, 90, 96 to
  # 100, 103 to 114 and 116 to 119, and there 98, 99 and 100 are three of part 6's ordinary
  # controllers. So nothing here is an NRPN, and on the single channel the two controllers
  # that carry an NRPN's number are read as part 6's pitch and attack.
  nrpn: none

modes:
  # THE TWO IMPLEMENTATIONS, LABELLED BY THE CHARTS' OWN TITLES, which the files carry. Neither
  # page prints its own, though each names the other in its Notes. The split chart marks itself
  # the factory mode, "This is the factory default implementation." (chart p. 1), and the single
  # chart "is an alternate implementation which can be selected by setting a specific MIDI
  # channel" (alternate_chart p. 1). The channel is set at power-on: "While holding down the REC
  # button, turn the volca drum on." (p. 3) and then "Step buttons 1 to 16 correspond to the
  # MIDI channels 1 to 16." (p. 3).
  split:
    label: Split channel
    factory: true
  single:
    label: Single channel
    # The base channel is the channel set, any of sixteen: the single chart's Basic Channel row
    # reads 1-16 received and "Memorized" (alternate_chart p. 1).
    channels: [1, 16]
    # `unparted` stays true in both modes: the resonator's four controls name no part and are
    # on both charts.

parts:
  # THE SPLIT CHANNELS' SIX PARTS ON SIX CHANNELS, with nothing to set: "Channel 1-6 = Parts
  # 1-6" (chart p. 1) and, from the player's side, "reverts to part 1-6 assigned to channels 1-6.
  # (factory default)" (p. 3). They are one part with six instances rather than six parts,
  # because the split chart gives them one map between them and the channel is the only thing
  # that tells them apart.
  part:
    label: Part
    mode: split
    count: 6
    channel_offset: 0
    # A note reaches the part whose channel carried it and the note number means nothing: the
    # chart recognises 0 to 127 and remarks "Each sound does not correspond to a note number".
    # So this is a part that takes notes and reads nothing from their number, which is `any`.
    addressing: any
    receives: [notes, controls]

  # THE SINGLE-CHANNEL IMPLEMENTATION'S SIX PARTS, all on the one channel set, each with a block
  # of nine numbers of its own, PART1 to PART6 on its chart. Six parts rather than one part of
  # six instances, because each has its own numbers and the channel tells none of them apart.
  # `channel_offset: 0` puts all six on the base channel, which in this mode is the channel
  # set: the single chart's Basic Channel row reads 1-16 received and "Memorized", which the
  # mode's own `channels` above records, where `midi.channels` is read from the split chart.
  # **`notes` is `unrecorded` on each.** The instrument takes notes on this channel too, which
  # the `voice` section says for both modes, and no page says which part one sounds - see the
  # source account. Until 2026-10-12 `notes` was only left out of `receives`, which reads as a
  # part that takes none.
  single_part_1: {label: PART1, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}
  single_part_2: {label: PART2, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}
  single_part_3: {label: PART3, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}
  single_part_4: {label: PART4, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}
  single_part_5: {label: PART5, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}
  single_part_6: {label: PART6, mode: single, channel_offset: 0, receives: [controls], unrecorded: [notes]}

voice:
  addressing: any
  # "Note Number 0-127" recognised, transmitted nothing (chart).
  note_range: [0, 127]
  # NOT RECORDED: polyphony, for a part or for the instrument. The specification counts the
  # parts - "6 digital parts (each with 2 osc. with pitch mod. and amp. e.g.), and a
  # waveguide-based resonator effect" (p. 3) - and never says how many notes one part will hold.
  velocity:
    # "Note On O 9n, V=1-127" received, X transmitted; "Note Off X" in both columns (chart).
    note_on: received
    note_off: false
  # A checked absence, from both charts' own rows: Key's aftertouch X in both columns, Channel
  # aftertouch X in both columns.
  aftertouch: none
  # Never sent: Key's and Channel aftertouch are X as transmitted on both charts.
  aftertouch_transmits: false
  # NOT RECORDED: pitch bend, because there is none. Both charts mark Pitch Bend X in both
  # columns, so there is no range to state and no `pitch_bend` block to state it in.

groups:
  # These three headings are the owner's manual's own, and they are the order it introduces
  # them in. Neither chart heads anything over its rows.
  # "Sound Controls: These knobs and buttons control the sound of the currently selected drum
  # part and waveguide resonator effect" (p. 3).
  sound_controls: Sound Controls
  # "When EDIT/STEP is lit, this encoder functions as the PARAM knob, cycling through the
  # following additional part parameters: BIT: bit reduction amount, FLD: wave folder amount,
  # DRV: overdrive gain, PAN: left-right pan, GAN: pre-mix gain adjustment, QPI: enable pitch
  # quantization (semitone)" (p. 3). Five of those six have a controller number on the split
  # chart and only PAN on the single one; QPI has none on either.
  part_parameters: Part Parameters
  # "WAVEGUIDE" heads the SEND, DECAY, BODY and TUNE knobs (p. 3).
  waveguide: Waveguide

controls:

  # Every one of these is received and never sent, and every one is marked with footnote *1,
  # which the source account gives in full. The split chart's thirty-one come first, generated
  # from it by `Notes/4204_write_controls.py`, which reproduces them; the fifty-four that are
  # the single chart's alone follow under a heading of their own.
  #
  # THE LAYER SUFFIX IS NOT A RANGE. The split chart writes SELECT1, SELECT2, SELECT1-2 against
  # 14, 15, 16: three controls, the third moving both of a part's layers at once.

  # Sound Controls ────────────────────────────────────────────────────────
  select_1:            {label: "Select, layer 1", cc: 14, direction: receives, part: part, group: sound_controls}
  select_2:            {label: "Select, layer 2", cc: 15, direction: receives, part: part, group: sound_controls}
  select_both:         {label: "Select, both layers", cc: 16, direction: receives, part: part, group: sound_controls}
  level_1:             {label: "Level, layer 1", cc: 17, direction: receives, part: part, group: sound_controls}
  level_2:             {label: "Level, layer 2", cc: 18, direction: receives, part: part, group: sound_controls}
  level_both:          {label: "Level, both layers", cc: 19, direction: receives, part: part, group: sound_controls}
  eg_attack_1:         {label: "EG Attack, layer 1", cc: 20, direction: receives, part: part, group: sound_controls}
  eg_attack_2:         {label: "EG Attack, layer 2", cc: 21, direction: receives, part: part, group: sound_controls}
  eg_attack_both:      {label: "EG Attack, both layers", cc: 22, direction: receives, part: part, group: sound_controls}
  eg_release_1:        {label: "EG Release, layer 1", cc: 23, direction: receives, part: part, group: sound_controls}
  eg_release_2:        {label: "EG Release, layer 2", cc: 24, direction: receives, part: part, group: sound_controls}
  eg_release_both:     {label: "EG Release, both layers", cc: 25, direction: receives, part: part, group: sound_controls}
  pitch_1:             {label: "Pitch, layer 1", cc: 26, direction: receives, part: part, group: sound_controls}
  pitch_2:             {label: "Pitch, layer 2", cc: 27, direction: receives, part: part, group: sound_controls}
  pitch_both:          {label: "Pitch, both layers", cc: 28, direction: receives, part: part, group: sound_controls}
  mod_amount_1:        {label: "Mod Amount, layer 1", cc: 29, direction: receives, part: part, group: sound_controls}
  mod_amount_2:        {label: "Mod Amount, layer 2", cc: 30, direction: receives, part: part, group: sound_controls}
