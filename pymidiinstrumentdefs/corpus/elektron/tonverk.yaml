midi:
  # Sixteen, and this instrument uses more of them at once than most: one for each of its sixteen
  # tracks, "TRACK/BUS/SEND/MIX CHANNEL selects the dedicated MIDI channel that is used to receive
  # or send" (manual p. 76), plus an AUTO channel for whichever track is active and a channel each
  # for program change in and out. A track sits on its own number until it is moved, as p. 36
  # reads - "The MIDI channels dedicated to each of the tracks are the same as the track's
  # number." (manual p. 36) - and no page calls that a default, nor states one for the other
  # three.
  channels: [1, 16]
  # BOTH, AND EACH DIRECTION IS ITS OWN SWITCH: "CLOCK RECEIVE determines whether Tonverk responds
  # to MIDI clock sent from external devices or not." (manual p. 76) and "CLOCK SEND determines
  # whether Tonverk transmits MIDI clock or not." (manual p. 76).
  clock: both
  # The same again, one switch each way - "TRANSPORT SEND determines whether Tonverk transmits
  # MIDI transport messages or not." (manual p. 76).
  transport: both
  program_change:
    # Both ways and on channels of their own, which the settings menu sets separately from the
    # tracks': PROG CH RECEIVE and PROG CH SEND, with PROGRAM CHG IN CH and PROGRAM CHG OUT CH.
    receives: true
    sends: true
    # **PATTERNS, NOT PRESETS**: "MIDI program change messages 0-127 will select pattern 1-128
    # (A01-H16) on Tonverk." (manual p. 30), which is eight banks of sixteen.
    presets: 128
  # 92 of the 246 controls below are addressed by NRPN and by nothing else, and counted out over
  # the subtracks they come to 435, 43 and eight times 49, which the `subtrack` part's eight
  # instances give - see the comment above the definition.
  # The maker names the two together as one switch -
  # "RECEIVE CC/NRPN will, when active, make it possible to control Tonverk's parameters from an
  # external MIDI device sending CC and NRPN data." (manual p. 76) - so `supported` is as far as
  # the documents go.
  nrpn: supported

voice:
  # "The 128 notes in the standard MIDI range (0-127) all trigger the preset of the active track"
  # (manual p. 30). **Eight of them do something else on a track running the Subtracks machine** -
  # see the source account - and the format has one word for how an instrument reads a note.
  addressing: pitches
  note_range: [0, 127]
  velocity:
    # Received: "Both the VEL parameter on the TRIG PARAMETERS page and the velocity of incoming
    # MIDI notes sent to the Tonverk from external devices affects the assigned parameters."
    # (manual p. 52), and VELOCITY TO VOL "Selects how MIDI velocity affects volume when playing
    # the preset from a MIDI keyboard." (manual p. 53). The sequencer records the velocity of
    # notes played in from a controller (manual p. 42). Apart from that, the appendix gives
    # `TRIG velocity` a controller number on each of the four kinds of track it lists
    # (manual p. 120), which is a trig's parameter and not a note's velocity.
    note_on: received
  # RECEIVED AND SENT, AND THE KIND IS NOT STATED. It is plainly received - "Opens a menu where
  # you can assign up to four parameters to the MIDI aftertouch command." (manual p. 52) - a
  # MIDI track sends it, since its AT "controls the aftertouch data sent on the MIDI track"
  # (manual p. 98), and **no page of 130 says whether that is channel pressure or polyphonic**,
  # so either would be invented. The same omission the Typhon's manual makes.
  aftertouch: received
  aftertouch_transmits: true
  # NOT RECORDED: pitch bend, for the same reason from the other side. It is received and has a
  # depth setting of its own - "Sets the amount of pitch bend data from external MIDI devices that
  # affects Tonverk." (manual p. 51) - and nothing anywhere says how far it bends, so the two
  # fields a `pitch_bend` block holds would both be guesses.
  # NOT RECORDED: polyphony. The play mode is a per-track setting - "Here, you can set whether a
  # preset is polyphonic or monophonic" (manual p. 50) - and the voice counts in the manual are
  # each a source machine's and not the instrument's. Four of the seven machines give one: "This
  # machine is eight voice polyphonic." (manual p. 86) of the Single Player, the same words of
  # the Multi Player (manual p. 88), "This machine is eight-voice polyphonic, one voice per
  # subtrack." (manual p. 88) of Subtracks, and "Grainer is polyphonic, with up to eight voices"
  # (manual p. 89). Of the three that give none, Wavefinder sounds, Shape "does not produce any
  # sound" (manual p. 95) and runs only on bus and send FX tracks, and the MIDI machine plays
  # other gear. **One voice per subtrack would be the `subtrack` part's own figure, and it
  # stays in words**: that part claims no notes, and a figure on it would have the file say
  # whether every part shares its voices, which no page does.

parts:
  # THE SIXTEEN TRACKS, IN THE FOUR KINDS THE APPENDIX GIVES A COLUMN EACH: "The Tonverk sequencer
  # has 16 tracks. 8 Audio/MIDI tracks, 4 Bus and MIDI tracks, 3 Send FX tracks, and one Mix
  # track." (manual p. 20). Every one has a channel of its own, chosen rather than derived, so all
  # four say `assigned`.
  #
  # **ONLY THE AUDIO TRACKS TAKE NOTES**, because a note plays a track's preset and only tracks
  # 1-8 hold one. The other three kinds are a bus, a send effect and the mixer: they take
  # controls and nothing else.
  audio:
    label: Audio track
    channel: assigned
    count: 8
    addressing: pitches
    # "Tracks 1-8 can be used as audio tracks" (manual p. 20), each holding a preset. They can
    # also run a MIDI machine instead, which turns the track into a sequencer for something else
    # and is not a thing this format describes. One trace of it is below: the mod wheel and the
    # breath controller are two-way, because that machine has a parameter of its own for each.
    receives: [notes, controls]
  bus:
    label: Bus track
    channel: assigned
    count: 4
    # "Tonverk has four separate buses, each with its own sequencer track" (manual p. 20).
    receives: [controls]
  fx_send:
    label: Send FX track
    channel: assigned
    count: 3
    # "Tonverk has three Send FX tracks" (manual p. 20).
    receives: [controls]
  mix:
    label: Mix track
    channel: assigned
    # One, and the only kind whose column in the appendix names the external inputs.
    receives: [controls]

  # THE EIGHT SUBTRACKS INSIDE AN AUDIO TRACK THAT RUNS THE SUBTRACKS MACHINE, which is what the
  # appendix's last table is for: its column is headed "Audio tracks using the Subtracks SRC
  # machine" (manual p. 123). "The Subtracks machine allows you to load eight samples" (manual
  # p. 88), each "onto a separate subtrack on the sequencer" (manual p. 88) with settings of its
  # own. They are on their track's channel and told apart by NRPN MSB: "1–8 = values control
  # parameters for the eight separate subtracks (1–8)." (manual p. 123). So `within` names the
  # audio part, `count` is eight to a track, and `nrpn_msb` is where the first one sits. The
  # rule holds from OS 1.4.1, whose notes list the mapping of subtracks 2 to 8 among its fixes.
  # **ONLY WHILE THE TRACK RUNS THAT MACHINE**, which stays in words: a mode here is the whole
  # instrument's, and this is one track's. No page says what these numbers do on a track running
  # anything else, nor which of the audio column's numbers still act on a track running this
  # one. The machine's additional sequencer track, the supertrack, "controls the parameters on
  # the FX pages and the two FX LFOs on the MOD pages" (manual p. 88), and the appendix gives
  # it no numbers of its own.
  # **`receives` lists controls, which is what the table gives, and `notes` is `unrecorded`.**
  # A note does trigger a subtrack, by its number - 60, 62, 64, 65, 67, 69, 71 and 72, as the
  # source account quotes - and no page says which number sounds which subtrack, nor can a
  # part's note map give one note to one instance. So a program asking whether a subtrack
  # takes a note is told neither yes nor no. Until 2026-10-12 `notes` was only left out of
  # `receives`, and the answer was no.
  subtrack:
    label: Subtrack
    within: audio
    count: 8
    nrpn_msb: 1
    receives: [controls]
    unrecorded: [notes]

