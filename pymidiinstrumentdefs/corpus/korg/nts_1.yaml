# **TWENTY-NINE CONTROLLERS, BOTH WAYS, AND TWO DOCUMENTS AGREE ON EVERY NUMBER.** Korg publishes
# the MIDI surface twice: a plain-text implementation whose transmitted and received tables list the
# same twenty-nine controllers under the same names, the received table adding 123, All Note Off;
# and a one-page chart whose Control Change block lists the same twenty-nine, in the same order,
# circled in both columns. The two were compared number by number and name by name rather than read
# from one and assumed of the other.
#
# **EIGHT OF THEM CHOOSE A TYPE, AND THE IMPLEMENTATION STATES EACH ONE TWICE.** Its transmitted
# table gives the exact values sent - `0,25,50,75,127` for the envelope's five types - and its
# received table the bands it answers to, `0~24` up to `100~127`. **Every value sent falls in the
# received band of the same name**, for all eight, and the bands cover 0 to 127 with no gap and no
# overlap, which this definition's reading script asserts. So the band starts below are the received
# bands', and a consumer that sends one of the transmitted values lands on the state it names.
#
# **THE IMPLEMENTATION AND THE CHART DISAGREE OUTRIGHT THREE TIMES, AND THE DOCUMENTS DIFFER IN
# FOUR MORE PLACES THAT CAN ALL BE TRUE AT ONCE.** None of the seven changes a field below, and the
# account sets out every one.

definition: 1

model:
  manufacturer: Korg
  name: NTS-1 digital kit
  # **1.20, THE NEWEST THE MAKER PUBLISHES, AND THE MANUAL IS ITS EDITION.** The downloads page
  # lists the System Updater at 1.20 and nothing later; the release notes' two 1.20 additions are
  # both rows of the manual's global parameter table; and the manual's own metadata names
  # `NTS-1 digital kit/System Updater v1.20`. Checked 2026-10-09.
  firmware: "1.20"

source: >-
  **TWENTY-NINE CONTROLLERS, SENT AND RECEIVED, FROM TWO DOCUMENTS THAT AGREE ON EVERY NUMBER.** The
  implementation is a 31.7 KB text file, Version 1.00 of 2021-10-04, and its transmitted and
  received channel tables list the same twenty-nine controller numbers under the same names, the
  received table adding 123, `All Note Off`. The chart, Version 1.00 dated 2019.6.25, lists the same
  twenty-nine in its Control Change block, circled in both columns (chart p. 1). The marks on this
  chart are text, so it was read by position against the three vertical rules measured off the page,
  and then rendered and looked at.

  **THE CONTROLLERS AND THE PITCH BEND ARE BEHIND ONE GLOBAL SWITCH THAT IS ON WHEN THE KIT
  ARRIVES.** "Received when global parameter MIDI RX ShortMessage is set to ON." (chart p. 1), and
  the implementation footnotes every controller it receives, and the pitch bend, with the same
  parameter, which it spells `MIDI RX/short message`. The manual's global parameter table gives that
  parameter "0: off, 1*: on" (manual p. 4), under "*: Factory default setting" (manual p. 4). The
  same arrangement as `korg/volca_keys`, set the same way.

  **EIGHT CONTROLLERS CHOOSE A TYPE, AND EACH IS GIVEN TWICE.** The implementation's transmitted
  table prints the exact values it sends and its received table the bands it answers to, and every
  value sent falls in the received band of the same name. The band starts are what this format
  records. They name the oscillator's, filter's and envelope's types, the three effects' types, and
  the arpeggiator's pattern and intervals.

  **MONOPHONIC, FROM ONE OSCILLATOR.** "With a single monophonic digital oscillator, one multimode
  filter, on EG, three LFOs, three stereo effect processors, and full arpeggiator, the NTS-1 is a
  very powerful, flexible, fun-to-explore synth." (product_page) - `on EG` as printed. The manual's
  specifications give one oscillator too: "Sound generator system: 1 VCO, 1 Multimode filter, 1 EG,
  3 LFO" (manual p. 3), a VCO where the product's specifications page says `1 Digital Oscillator`
  (specifications). And firmware 1.20 added "New global option to enable/disable legato handling of
  incoming MIDI notes" (release_notes), which the manual's table carries as `EG Legato`. **No
  document states a voice count**, so `polyphony: 1` reads the one monophonic oscillator as one
  voice, which is the reading `korg/monologue` makes of the same word in its own manual.

  **NOTES ARE RECEIVED OVER THE WHOLE RANGE AND SENT OVER EIGHTEEN.** The chart gives `0–127` for
  Note Number and True Voice in its `Recognized` column and `45–62` in its `Transmitted` column
  (chart p. 1), and the evident source of what is sent is the ribbon keyboard, though the chart does
  not say so. Its velocity row reads `O 9n, V=1–127` received, which is the `received` below.

  **NO DOCUMENT NAMES A MIDI OUT JACK.** The specifications list a "MIDI IN jack (3.5 mm TRS
  mini-phone jack)" (manual p. 3) and a USB port, and the connectivity sheet says "The MIDI IN
  connector of the NTS-1 digital kit can receive notes and other messages from external MIDI devices
  and other sources." (connectivity p. 1), while the USB port is the one to "transmit and receive
  note messages and more." (connectivity p. 1). So whatever is sent can leave only by USB - an
  inference from the jacks, because the same sheet opens by saying the kit "uses either the USB port
  or the MIDI IN connector to send and receive MIDI signals." (connectivity p. 1). The manual's
  `MIDI route` setting is "0*: USB+MIDI, 1: USB" (manual p. 4) and is not explained further.

  **CLOCK BOTH WAYS, TRANSPORT RECEIVED ONLY, BEHIND A SECOND SETTING.** The implementation sends
  `F8` and receives `F8`, `FA`, `FB` and `FC`, each received one footnoted to the clock setting, and
  the chart circles Clock in both columns and Commands in its `Recognized` column alone: "Not
  received when global parameter MIDI Clock src is set to Internal; received when set to Auto."
  (chart p. 1). The manual gives `MIDI clock source` as "0: internal, 1*: auto" (manual p. 4), so
  from the factory it follows a clock that arrives.

  **SYSTEM EXCLUSIVE IS HOW USER OSCILLATORS AND EFFECTS ARRIVE.** Circled in both columns, with "In
  addition to Korg exclusive messages, Inquiry is supported." (chart p. 1), and the implementation
  lays out the requests, the slot data and the status replies for the user modules, which the kit
  can take because "It is compatible with the logue SDK" (manual p. 3). The manual's fifth
  oscillator type is `User OSC`, which it says comes preloaded, printing the preloaded oscillator's
  name in the display's own font; the implementation names that band `WAVES`.

  **THE TWO DOCUMENTS DISAGREE OUTRIGHT THREE TIMES.** The implementation's transmitted realtime
  table lists `FE` Active Sensing, and the chart crosses Active Sense in its `Transmitted` column
  and circles it only in its `Recognized` one (chart p. 1). The chart circles All Notes Off as
  `O (123–127)` where the implementation receives `7b`, 123, alone, as `All Note Off`. And the
  chart's Note Number row carries the same footnote as the controllers, the `MIDI RX ShortMessage`
  switch, where the implementation footnotes none of its note rows in either direction. **None of
  the three reaches a field**: active sensing and the switch have none here, and the channel mode
  messages are refused by the format. So all three are written down and none is chosen.

  **AND THE DOCUMENTS DIFFER IN FOUR MORE PLACES THAT CAN ALL BE TRUE AT ONCE.** The implementation
  footnotes every controller it sends to the same switch, by a footnote saying the message is
  transmitted when the switch is on, where the chart's footnote speaks of reception only. Its
  transmitted note on reads `vv=1~127` where the chart's velocity row reads `X 9n, V=64`: the chart
  says a fixed 64, the implementation prints the message's range, and nothing describes the ribbon
  as sensing how hard it is pressed. Its received note off reads `Note Off vv=1~127` where the chart
  crosses Note Off in the `Recognized` column: the implementation gives the message's range, the
  chart says the value does nothing, which is the `note_off: false` below. And the chart's `Mode 3`,
  OMNI OFF and POLY by its own legend, sits beside a monophonic oscillator; a one-voice instrument
  can receive in mode 3, as `korg/monologue` records.

  **THE CHART IS THE OLDER DOCUMENT BY MORE THAN TWO YEARS**, and between it and the implementation
  came 1.10, announced on the product page on `2020.03.10` (product_page), whose notes include "Fix
  scaling issues with some MIDI CC values" (release_notes) and do not say which values. The
  implementation, the later of the two and the only one to print values, postdates it.

  **AND THE IMPLEMENTATION DISAGREES WITH ITSELF IN ITS SYSTEM EXCLUSIVE TABLES**, about nothing a
  field here holds: its user API version reply gives the platform ID as `3` where its slot status
  table gives `1`; its messages number the user modules `1` to `4` where that table gives `1~5`; its
  received list includes `47` and `48`, which their own formats mark as transmitted only; its status
  message is "Transmitted when an error occurs after receiving a system exclusive message."
  (implementation) where five other formats send it after success too; and its transmitted list
  gives status codes `23-2F` where its own table of them has no `25`.

  **`nrpn: none` IS A CHECKED ABSENCE.** Neither document names 6, 38 or 98 to 101 anywhere: not the
  chart's Control Change block or its Aux rows (chart p. 1), and not the implementation, whose
  channel tables are its whole account of what is sent and received.

  NOT RECORDED: the pitch bend range. The chart circles Pitch Bend in its `Recognized` column
  (chart p. 1) and the implementation receives `En`, and no document gives a range or a setting for
  it; the format's pitch bend field holds those two and nothing else. Nor how a particular user
  oscillator or user effect is chosen over MIDI: the oscillator type controller has one band for the
  user slot, and the three effect type controllers name only the built-in types and `OFF`.

  NOT CARRIED: the chart's own spellings `TREMOLLO` and `Meassages`. The labels below are the
  implementation's, which spells `TREMOLO`.

