# THIS INSTRUMENT'S PUBLISHED MIDI IS FOUR PAGES OF ITS OWNER'S MANUAL, AND THE ONE WITH THE
# NUMBERS HAS NO PAGE NUMBER. A section headed MIDI, on the page printed 38, lists seven kinds
# of information and names no note and no controller. The sync chapter gives the MIDI jacks
# their part in it (manual p. 34), and an External Instrument Mode sends a second set of
# patterns to another instrument (manual p. 37). And four sheets after the MIDI page, behind
# the specifications and two pattern sheets, is a full "MODEL TR-909 MIDI Implementation Chart"
# (manual p. 42): the 41st sheet of the file, which carries no folio and by the file's own
# offset is p. 42. **Until 2026-10-12 this file was read from the MIDI page alone, and said
# that no page holds a note number or says which way any message travels. The chart does
# both.**
#
# WHAT THE CHART SETTLES. Control Change is crossed in both columns, so **no control below** is
# the maker's own crossed box and not a reading of a list. Program change, both kinds of
# aftertouch and pitch bend are crossed both ways as well. Clock, start and stop, song position,
# song select and system exclusive are circled both ways. Notes are recognised from 35 to 51 and
# sent from 36 to 51, with velocity.
#
# WHAT IT DOES NOT. **No page says which note reaches which drum.** The chart's whole remark on
# the note numbers is "assigns to each rhythm voice" (manual p. 42), and the prose pages give no
# note number at all, so the recognised notes are a range here and not a map of voices. The
# manual numbers its sound sources by the sixteen Main Keys that play them, and nothing says the
# seventeen recognised notes follow that order.
#
# WHAT THE MANUAL SHOWS IT SENDING IS A PATTERN WRITTEN FOR ANOTHER INSTRUMENT. "This mode is
# provided for potential control of external sound source through MIDI." (manual p. 37): in
# External Instrument Mode a pattern is written for sixteen instruments of another machine, and
# "Main keys correspond to the keyboard as shown below." (manual p. 37), over a drawing of a
# keyboard with sixteen of its keys numbered, from a C to the D sharp above the next C, and
# Middle C marked two octaves above the first. Sixteen notes is what the chart gives as
# transmitted, 36 to 51. No note number is printed on that page, its keys carrying the Main
# Keys' own numbers, so that the first key is 36 follows only if Middle C is taken as 60. No
# sentence says whether the internal pattern's notes go out as well. And nothing in this format
# holds the notes an instrument sends, so they are in words here.
#
# THE MIDI PAGE lists what MIDI carries, "Information which can be communicated are as follows."
# (manual p. 38) and then, numbered: Rhythm Pattern, Tempo Syncro, Start/Stop, Dynamics, Song
# Selection, Song Position Point, Through Function. Under the list it refers the reader to an
# enclosure - Roland's own words name it in quotation marks - which **is not among the 457
# documents its maker publishes** and is not in the library beside this file.
#
# **THE ABSENCE OF A SEPARATE IMPLEMENTATION IS CHECKED AGAINST THE MAKER'S OWN LIST, NOT AGAINST
# A SEARCH.** Roland's manual archive carries 457 documents, of which **38 are titled as a
# MIDI implementation** - "D-50 MIDI Implementation" (archive) among them - and it lists **ten TR
# drum machines, every one of them an owner's manual and nothing else**: "TR-909 Owner's Manual"
# (archive), "TR-808 Owner's Manual" (archive), "TR-707 Owner's Manual" (archive) and seven more.
# So this maker does publish separate implementations, and publishes none for any of its TRs.
#
# THERE ARE TWO CHANNELS. "Setting Receiving Channel: To set the Channel number for MIDI
# information which controls the internal sound source, press the appropriate Main Key, while
# holding the Shuffle/Flam Button." (manual p. 38), and a sending channel set the same way with a
# different modifier, for "MIDI information which controls external sound source"
# (manual p. 38). The keys that set them are the sixteen the specifications list as "Main Keys
# (1 to 16)" (manual p. 39), and the chart gives `1-16` as the changed channel in both columns.
#
# **AND AT POWER-ON IT LISTENS ON EVERY CHANNEL AND SENDS ON 11, WHICH THE TWO PAGES SAY IN
# DIFFERENT NUMBERS**: "If the unit has been just turned on, the receiving Channel is
# automatically set to 0, and the transmit Channel to 11." (manual p. 38), where nought "is Omni
# mode that receives all Channel information" (manual p. 38). The chart gives the default
# channels as 11 transmitted and 10 recognised, and the default modes as 3 transmitted and 1
# recognised, which is omni on. So the two agree about what the instrument does when it is
# switched on, and differ about the number behind an instrument in omni: nought on one page, 10
# on the other. Neither is recorded, there being no field for a default channel.

definition: 1

model:
  manufacturer: Roland
  name: TR-909
  # NOT RECORDED. The manual states no firmware. The nearest it comes to an edition is the line
  # on its back cover, `TR-909 OWNERS MANUAL '83 DEC. C-3`, a date and a code. This is a 1983
  # instrument, discontinued, and nothing here is updatable.
  # Checked 2026-10-06.

source: >-
  The TR-909 Owner's Manual, 43 sheets, which is **the only document Roland publishes for this
  instrument** - and Roland's own manual archive, which is cited for that being true rather than
  merely unfound.

  **THE MANUAL IS A SCAN AND HAS NO TEXT LAYER AT ALL.** 43 sheets, one image to a sheet, no
  fonts and no drawings - so every word quoted here was read off a rendered page by eye, and the
  quotation checker reports them as unchecked rather than as wrong. **That is this corpus's
  established position for a manual of this age** and not a new liberty: `roland/juno_106`,
  `roland/d_50`, `yamaha/dx7` and `korg/m1` are all built from scans the same way, and the
  library holds eight such files. The archive page beside it is text, so the claims that rest on
  it are checked in the ordinary way.

  ITS MIDI IS THREE PAGES OF PROSE AND, FOUR SHEETS AFTER THE LAST, A CHART. See the comment
  above the definition. The chart crosses Control Change in both columns, so this is a definition
  with **no controls** on the maker's own word. **The chart was read twice, by two readers who
  did not see each other's reading, each from a render of its sheet made with a different
  program, and the two agree in every one of its 26 rows.** The second reader found the sync
  chapter's MIDI and the External Instrument Mode, which the first reading had not opened.

  THE PAGE OFFSET IS +1 AND IS WORTH STATING. The scan opens with a cover, a contents sheet and
  a panel sheet twice the width of the others, none with a folio. Counting the wide sheet as two
  pages is what puts printed 5 on the fourth sheet, where it is, so **printed page = sheet + 1**
  from there on. The second reader read every folio from printed 5 on the fourth sheet to
  printed 41 on the fortieth, with no gap. Printed 38 is the MIDI page and printed 39 the
  specifications. The chart's sheet, the 41st, carries no folio either; by the same offset it
  is p. 42, and it is cited so.

  **A FIGURE IS GIVEN TWICE AND DIFFERS.** The trigger output is "a positive 14V, 18ms" (manual
  p. 38) on the MIDI page and "+14V, 20 ms pulse" (manual p. 39) in the specifications, a page on.
  Neither is a MIDI message - it is a jack that pulses with the rim shot - and it is recorded
  because it is a place where two pages of this manual can be checked against each other, and
  they disagree. The receiving channel at power-on is another, set out above the definition.

  HOW THE DOCUMENT WAS FOUND, WHICH IS NOT WHERE THIS MAKER'S CURRENT ONES ARE. The global
  support page for this product, `by_product/tr-909/owners_manuals/`, is **an empty shell**: it
  builds its list in the browser and its markup carries no document link at all, where the same
  page for a current product carries nine. The archive page that does carry it is on the US site,
  which is where `roland/juno_106` found its own manual two days before this. **One guessed CDN
  address was tried and returned 403**, which is evidence about the guess and not about the file;
  the address that works is the one the archive prints.

  AND THE ARCHIVE IS SAVED ONCE FOR THIS MAKER RATHER THAN ONCE PER INSTRUMENT. The copy cited
  here is the one `roland/juno_106` saved on 2026-10-02, **and its visible text is byte for byte
  what a fetch returned four days later**. The markup was not: two fetches of an unchanged page
  differ in four lines, a CSRF token and an ASP.NET view state, so **the served bytes of this
  maker's pages are not a stable identifier while their rendered text is**. That is a good reason
  to cite the text, which this corpus already does, and a bad reason to pin the HTML.

  NOT RECORDED: which of the seventeen recognised note numbers plays which of its eleven sound
  sources, which no page gives; the polyphony; a default channel, for which there is no field;
  song position and song select, which the chart circles both ways, and its `Reset`, circled
  as recognised and as transmitted `if received`, for none of which there is a field; and the
  firmware. Its own specifications give the shape of the instrument - "48 Rhythm Patterns
  (16 x 3 Pattern Groups) x 2 (Bank I, II)" (manual p. 39) over four tracks in each of two
  banks, eleven sound sources, and MIDI sockets that are one IN and two OUTs - and none of that
  is a number this format holds.

sources:
  manual:
    kind: manual
    title: TR-909 Owner's Manual
    landing: "https://www.roland.com/us/support/manual_archive/"
    url: "http://cdn.roland.com/assets/media/pdf/TR-909_OM.pdf"
    sha256: d786988e4cc0554af3088dd719e8fcdab1b7e624d5e83dd9eacc7d02ae754153
    retrieved: 2026-10-06
    # **A SCAN WITH NO TEXT LAYER**: 43 sheets, one image each, no fonts. Every quotation here
    # was read off a rendered page, and the quotation checker reports them unchecked.
    # Roland's own link is plain HTTP, as it is for this maker's other archived manuals. The
    # same bytes are served over HTTPS from
    # https://static.roland.com/assets/media/pdf/TR-909_OM.pdf, which was fetched and compared
    # byte for byte; the address above is the one the archive page actually carries.
    # **Printed page = sheet + 1**: a cover, a contents sheet and a panel sheet of twice the
    # width come first, none with a folio, and the wide one counted as two pages puts printed 5
    # where it is. Checked at every folio from printed 5 to printed 41. The MIDI page is printed
    # 38 and is one page of prose; the implementation chart is the 41st sheet, with no folio,
    # and is p. 42 by this offset.
    page_offset: -1
  archive:
    kind: web_page
    title: "Roland - Support - Manual Archive"
    landing: "https://www.roland.com/us/support/manual_archive/"
    url: "https://www.roland.com/us/support/manual_archive/"
    sha256: aa08cc61d2b474998265e8e0c893154f7145dfdb48d2726e8478c90e2558b499
    retrieved: 2026-10-02
    paginated: false
    # **Cited for an absence, and it is the maker's own list rather than a search.** 457
    # documents, 38 of them titled `MIDI Implementation`, and ten TR drum machines of which
    # every one is an owner's manual and nothing else. It is also the only place Roland offers
    # this manual at all: the global support page for the product is an empty shell.
    # Saved once for this maker under `_downloads` rather than once per instrument, by
    # `roland/juno_106` on the date above. A fetch four days later returned **the same visible
    # text byte for byte** and different markup, so the date is the saving and not a claim that
    # nothing has moved since.

midi:
  # TWO CHANNELS AND SIXTEEN KEYS TO SET THEM WITH. Each is set by pressing "the appropriate Main
  # Key" (manual p. 38) with a modifier, and the chart gives `1-16` as the changed channel in
  # both columns (manual p. 42).
  # **AT POWER-ON IT IS IN OMNI AND SENDS ON 11.** The prose says so with a receiving channel of
  # nought, and the chart with a recognised default of 10 under mode 1: see the comment above
  # the definition. Neither default is recorded, because this field holds a span.
  channels: [1, 16]
  # `3` transmitted and `1` recognised as the defaults (manual p. 42): it sends on its channel
  # and, until omni is turned off, answers on all of them. The messages row has `OMNI OFF, POLY`
  # transmitted and `OMNI ON/OFF, POLY, MONO` recognised. `roland/tr_707` and `roland/juno_106`
  # give the same two defaults.
  mode: {receives: 1, sends: 3}
  # Circled in both columns, and recognised in `MIDI mode` (manual p. 42). The sync chapter says
  # the same in words: "The TR-909 can serve either as a slave or master device." (manual p. 34),
  # by a sync mode that is INT, MIDI or DIN, and "Turning the TR-909 will automatically set it
  # to the Sync mode INT." (manual p. 34).
  clock: both
  # Commands are circled in both columns (manual p. 42), and "When the Sync mode is either MIDI
  # or DIN, only the external unit can start or stop the units." (manual p. 34). Song Pos and
  # Song Sel, the second with `(0-7)`, are circled both ways too and have no field here.
  transport: both
  program_change:
    # Crossed in both columns, with True # starred out in the transmitted one (manual p. 42).
    receives: false
    sends: false
  # CROSSED IN BOTH COLUMNS (manual p. 42): a checked absence, on the maker's own chart. Until
  # 2026-10-12 this rested on the prose page's list of seven kinds of message, read as complete.
  control_change: none
  # It follows from the line above: a non-registered parameter is addressed and set with
  # controller messages, 98 and 99 and then 6 and 38, and the chart crosses them all.
  nrpn: none
  # Circled both ways, `for rhythm seq` (manual p. 42): sequence data.
  sysex: true

voice:
  # A note names a rhythm voice: the chart's remark against the note numbers is "assigns to each
  # rhythm voice" (manual p. 42). **Which number names which voice no page says**, so there is
  # no `voices` map: see the comment above the definition.
  addressing: voices
  # `35-51` recognised, as the note number and again as the true voice; `36-51` transmitted
  # (manual p. 42).
  note_range: [35, 51]
  # NOT RECORDED: the polyphony, which no page states.
  velocity:
    # Circled in both columns: `9n v=64-96` transmitted, and recognised with no figure
    # (manual p. 42). The MIDI page's `Dynamics` is this.
    note_on: both
    # Crossed as recognised. The transmitted cell is crossed and prints `9n v=0`: a note on with
    # a velocity of nought goes out in place of a note off (manual p. 42).
    note_off: false
  # Key's and Ch's crossed in both columns, as is Pitch Bender (manual p. 42).
  aftertouch: none
