  lfo_1_lr_phase:                       {label: LFO 1 LR Phase, cc: 19, nrpn: 1043, nrpn_range: [0, 16383]}
  lfo_1_mode:                           {label: LFO 1 Mode, cc: 20, values: {"free_norm": 0, "once_dds_1": 43, "reset_dds_2": 85}}
  dds_lfo_1_amount:                     {label: DDS LFO 1 Amount, cc: 21, nrpn: 1045, nrpn_range: [0, 16383]}
  dds_env_1_amount:                     {label: DDS Env 1 Amount, cc: 22, nrpn: 1046, nrpn_range: [0, 16383]}
  dds_modulator_destination:            {label: DDS Modulator Destination, cc: 23, values: {"dds_1": 0, "both": 43, "dds_2": 85}}
  super_mode:                           {label: Super Mode, cc: 24, values: {"off": 0, "n1_2": 43, "on": 85}}
  pw_detune:                            {label: PW/Detune, cc: 25, nrpn: 1049, nrpn_range: [0, 16383]}
  pwm_swm:                              {label: PWM/SWM, cc: 26, nrpn: 1050, nrpn_range: [0, 16383]}
  pwm_swm_source:                       {label: PWM/SWM Source, cc: 27, values: {"lfo_1": 0, "both": 43, "env_1": 85}}
  cross_modulation:                     {label: Cross Modulation, cc: 28, nrpn: 1052, nrpn_range: [0, 16383]}
