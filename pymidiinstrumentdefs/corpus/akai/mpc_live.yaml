  guide:
    kind: manual
    title: MPC Standalone OS User Guide
    edition: v3.9
    dated: 2026-06-15
    landing: "https://www.akaipro.com/mpc-manuals/"
    url: "https://cdn.inmusicbrands.com/Software/15JM26PSBC/MPC%20Standalone%20OS%20-%20User%20Guide%20-%20v3.9.pdf"
    sha256: b0630c574556ed080cb5fb3133352cca4e1dcc92282f78317c0c8f88f9f0090b
    retrieved: 2026-10-04
    # 530 pages, printed page = file page, measured on every sheet: only the cover and the last
    # sheet print no number, and no sheet prints a number other than its own. Akai's own pages
    # link no file - the MPC Manuals page builds its list in the browser, so a fetch of it returns
    # 74 KB of frame and not one PDF - so this was found by a search restricted to the maker's and
    # its parent's domains. The date above is the PDF's modification date; its creation date is
    # 2025-01-16 and is shared with the v3.7 edition, so it is the template's and not this
    # edition's.
    page_offset: 0
  release_notes:
    kind: release_notes
    title: MPC 3.9.1 Release Notes
    edition: "3.9.1"
    landing: "https://www.akaipro.com/mpc-manuals/"
    url: "https://cdn.inmusicbrands.com/Software/MPC/MVSU391APC/MPC%203.9.1%20-%20Release%20Notes.pdf"
    sha256: 593cb2064df3387eb5461b027ab8a4f6f17c69bb538e8ab2dfaf39ca85ec5899
    retrieved: 2026-10-04
    # Two pages. Cited for which firmware is current and for the fact that nothing in it touches
    # MIDI. ITS COMPATIBILITY LIST IS LONGER THAN THE GUIDE'S: fourteen machines, adding the MPC
    # XL, the MPC Live III and the Force to the guide's ten. So a machine the operating system
    # runs on is not necessarily a machine this guide describes, and the guide says which two of
    # them have a user guide of their own.
    page_offset: 0
  earlier_release_notes:
    kind: release_notes
    title: MPC 3.9 Release Notes
    edition: "3.9"
    landing: "https://www.akaipro.com/mpc-manuals/"
    url: "https://cdn.inmusicbrands.com/Software/15JM26PSBC/MPC%203.9%20Release%20Notes.pdf"
