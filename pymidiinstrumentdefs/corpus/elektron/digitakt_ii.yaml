  # LFO 3 ───────────────────────────────────────────────────────────────────
  lfo_3_speed:                        {label: Speed, cc: 78, lsb: 62, nrpn: 186, part: track, group: lfo_3}
  lfo_3_multiplier:                   {label: Multiplier, cc: 52, nrpn: 187, part: track, group: lfo_3}
  lfo_3_fade_in_out:                  {label: Fade In/Out, cc: 53, nrpn: 188, part: track, group: lfo_3}
  lfo_3_destination:                  {label: Destination, cc: 28, nrpn: 189, part: track, group: lfo_3}
  lfo_3_waveform:                     {label: Waveform, cc: 29, nrpn: 190, part: track, group: lfo_3}
  lfo_3_start_phase:                  {label: Start Phase, cc: 30, nrpn: 198, part: track, group: lfo_3}
  lfo_3_trig_mode:                    {label: Trig Mode, cc: 31, nrpn: 199, part: track, group: lfo_3}
