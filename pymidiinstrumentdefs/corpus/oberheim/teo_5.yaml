  # ENVELOPE 1 --------------------------------------------------------
  env_1_delay:              {label: Env 1 Delay, cc: 45, nrpn: 79, range: [0, 127], group: envelope_1}
  env_1_attack:             {label: Env 1 Attack, cc: 46, nrpn: 81, range: [0, 127], nrpn_range: [0, 256], group: envelope_1}
  env_1_decay:              {label: Env 1 Decay, cc: 47, nrpn: 83, range: [0, 127], nrpn_range: [0, 256], group: envelope_1}
