    # printing code on the back cover, `'91-3-E3-21D`, beside part number `26045450`.
    # **CITED BY SHEET**: the book prints chapter folios, and a locator here is a sheet of the
    # file. To turn a printed folio into a sheet: II-n is sheet 160 + n, III-n is sheet 194 + n,
    # and V-n is sheet 232 + n - so the MIDI implementation's V-53 is sheet 285. `file` says 0
    # pages.
    page_offset: 0
