  # CC.
  mod_wheel:                              {label: Mod Wheel, cc: 1, group: wheels}
  bpm:                                    {label: BPM, cc: 3, group: clock}
  glide_mode:                             {label: Glide Mode, cc: 5, group: glide}
  master_volume:                          {label: Master Volume, cc: 7, group: volume}
  # No other page of the guide names a sub oscillator; see the account.
  sub_oscillator:                         {label: Sub Oscillator, cc: 8}
  # Described with the amplifier envelope, beside Prog Volume (guide p. 46).
  pan_spread:                             {label: Pan Spread, cc: 10, group: amplifier_envelope}
  voice_volume:                           {label: Voice Volume, cc: 12, group: volume}
  # The transmitted list prints `Expression` against 0000 1101, which is 13; see the account.
  ab_mode:                                {label: A/B Mode, cc: 13}
  slider_1_position:                      {label: Slider 1 Position, cc: 14, group: touch_sliders}
  slider_2_position:                      {label: Slider 2 Position, cc: 15, group: touch_sliders}
  fx_1_on_off:                            {label: FX 1 On/Off, cc: 16, group: effects}
