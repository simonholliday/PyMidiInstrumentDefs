midi:
  # FROM THE TABLE'S OWN CHANNEL COLUMN, which gives 1-16 for the four track rows, 1-4 for
  # the EQ and "any" for the seven global ones. No sentence in either edition states a span,
  # so this is the table's figure rather than the standard assumed.
  channels: [1, 16]
  # BOTH, OVER EVERY TRANSPORT. "the midi settings page in system settings allows you to set
  # how midi clock, notes and other midi messages are sent and received" (p. 88), and over
  # Bluetooth the connection is "sending and receiving notes and clock" (p. 87). The release
  # notes add that this was built: "support incoming & outgoing midi clock over BLE"
  # (os_updates, 1.0.29). Per connected device it is a setting, with clock separately
  # switchable (p. 90).
  clock: both
  # RECEIVES, AND THE EVIDENCE IS ONE SENTENCE, in a release note rather than in either
  # edition of the guide: "relay incoming transport to other connected midi devices"
  # (os_updates, 1.0.29). That settles that transport arrives. It does not settle that
  # pressing play sends one - relaying what came in is not originating it - and no document
  # here says otherwise, so `both` would be claiming the half that was not established.
  # The multi-out's sync8, sync16 and sync24 settings are not this: those are analogue sync
  # pulses, and the guide describes them carrying "clock, start, stop and reset" over a DIN
  # sync cable (p. 113), which is a different wire and a different standard.
  transport: receives
  program_change:
    # SENDS, VIA THE EXTERNAL MIDI TRACK, which is the only direction either edition
    # describes: "in the external midi track you can control which midi channel, bank and
    # program you want to control" (p. 56), with "rotate the light gray knob to select a
    # program". The release notes treat it as a sequencer parameter too - "fix: midi program
    # change param locks not working" (os_updates, 1.1.15).
    # WHAT IT DOES ON RECEIVING ONE IS NOT RECORDED. The words "program change" appear in
    # neither edition, and loading a project over MIDI is a control change here, not a
    # program change: CC 86 below.
    sends: true

parts:
  # One part and not two, although the maker divides the sixteen tracks into eight instrument
  # and eight auxiliary: the four track controls below reach a track by its channel over the
  # whole 1-16, and no document distinguishes what an auxiliary track answers to from what an
  # instrument track does.
  track:
    label: Track
    count: 16
    # Each is given a channel by the player, so none derives one: "the midi settings page in
    # project settings allows you to set the midi channel on each of the 16 tracks" (project),
    # and "midi channels selectable per track" (product_page). There is no base channel on
    # this instrument to derive from.
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # No polyphony is stated against a part, because a track does not have voices of its own:
    # see voice.polyphony_shared, and the sentence that gives twenty-four voices to sixteen
    # tracks.
    # There is also a channel that reaches whichever track is selected rather than a fixed
    # one - system settings offer "selecting the active track channel (the active track is the
    # one currently selected)" (p. 88) - which is a second way in that the format has nowhere
    # to put, and which a player sets for themselves.

controls:
  # ALL ELEVEN COME FROM ONE TABLE, section 23 of the guide, printed page 122, which is the
  # only table of controller numbers in either edition. The twelfth row of that table is not
  # here: see the warning at the head of this file.
  # The maker sets every name in lower case; they are capitalised here as the other
  # definitions in this corpus capitalise a maker's styling.
  # THE FOUR THAT NAME A TRACK are the rows whose channel column reads 1-16; the seven that
  # do not are the rows whose channel column reads "any", except the EQ, which reads 1-4.
  track_volume:    {label: Track Volume, cc: 7, part: track}
  track_mute:      {label: Track Mute, cc: 9, part: track}
  track_pan:       {label: Track Pan, cc: 10, part: track}
  tempo:           {label: Tempo, cc: 80}
  groove:          {label: Groove, cc: 81}
  # "delay scene" in the printable guide and "scene (delayed switch)" on the website. What it
  # does is in the release notes: "add midi command for setting delayed scene" (os_updates,
  # 1.1.0), and the guide describes the gesture it automates - "by default, when switching
  # scenes this change will happen immediately, to delay this change and queue up the next
  # selected scene hold shift, tap play and then select a scene" (p. 67).
  delay_scene:     {label: Delay Scene, cc: 82}
  previous_scene:  {label: Previous Scene, cc: 83}
  next_scene:      {label: Next Scene, cc: 84}
  # The arrangement holds "99 distinct scenes" (p. 67) and this control's range is the
  # table's 0-127, so no named values are written: the guide gives no mapping from a value to
  # a scene, and 128 values over 99 scenes is not one anybody should guess.
  scene:           {label: Scene, cc: 85}
  # Loading a project over MIDI, which the release notes confirm is real: "fix crash caused by
  # repeated project load requests via MIDI CC" (os_updates, 1.0.40).
  project:         {label: Project, cc: 86}
  # THE ONE ROW WHOSE CHANNEL IS NEITHER 1-16 NOR "any": the table gives this one 1-4. The
  # master EQ has four parameters - low, mid, high and blend (p. 71) - so four channels for
  # one controller number is the obvious reading, and it stays a reading: NEITHER EDITION SAYS
  # WHICH CHANNEL SELECTS WHICH, so no part is written for it and no mapping is claimed.
  eq:              {label: EQ, cc: 90}

voice:
  addressing: pitches
  # TWENTY-FOUR, AND SHARED ACROSS THE SIXTEEN TRACKS, in the maker's own sentence: "the
  # voices settings page in project settings allows you to assign voices to specific tracks,
  # OP-XY has 24 voices of polyphony and by default automatically assigns voices" (project).
  # The product page says the same of the sound - "24-voice multitimbral synthesis" - and the
  # printable guide shows the pool running out rather than describing it, with an indicator
  # that is "only visible when 17 or more voices are in use".
  polyphony: 24
  polyphony_shared: true
  # THREE PLAY MODES AND NO COUNT FOR ANY OF THEM: "rotate the dark gray knob to select
  # between poly, mono and legato. this changes both how the notes play and how many you can
  # play at the same time" (instrument). `voicing_modes` holds counts, and this guide
  # publishes names, so it is left empty rather than filled with guesses.
  velocity:
    # RECEIVED, and routable to something of the player's choosing: "if you wish to assign the
    # modwheel, aftertouch, pitchbend and velocity to modulate the synth parameters you can do
    # so by opening the preset settings" (p. 116). It can also be switched off for a connected
    # device, since the per-device settings include "whether timestamp and velocity are sent
    # or not" (p. 90).
    # The guide's other velocity setting is not this one: "off", "soft (for gentler playing)"
    # and "hard (for more vigorous playing)" (p. 110) set what the built-in keyboard sends.
    note_on: received
    # Note-off velocity is never mentioned in either edition.
  # NOT RECORDED: AFTERTOUCH. It is received and can be routed - "in the mod settings you can
  # change the routing of the modwheel, aftertouch, pitchbend and velocity to control various
  # synth parameters" (instrument) - but neither edition says whether it is channel or
  # polyphonic, and those are the only two things this field can say. Recording either would
  # be a guess, and recording nothing loses the fact, so the fact is here in the comment.
  pitch_bend:
    # THE RANGE IS A SETTING: "rotate the light grey knob to adjust the bend range, this is
    # the pitch range of the pitch bend" (instrument). How far it reaches is not printed, in
    # either edition, so `semitones` is left unrecorded rather than read off an illustration.
    programmable: true
