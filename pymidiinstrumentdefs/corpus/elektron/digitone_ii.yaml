# SIXTEEN TRACKS, EACH OF WHICH IS AN AUDIO TRACK OR A MIDI TRACK, and that is one part of
# sixteen rather than two parts: "The Digitone II sequencer has 16 tracks that can be either an
# audio track or a MIDI track" (p. 16), and "Any of the 16 tracks can be used as a MIDI track"
# (p. 17). The Digitakt II and the Syntakt are the same instrument in this respect and are written
# the same way; the original Digitone is not, having four synth tracks and four MIDI tracks as
# separate slots.
#
# THAT SETTING IS WHY ELEVEN NUMBERS BELOW LOOK LIKE CLASHES AND ARE NOT. NRPN 1:16 is the
# filter's Attack Time on an audio track and VAL1 on a MIDI track; the sixteen CC VAL controls and
# the audio-track parameters cannot both be live on one track at one time. The format has no way to
# say that - a control's meaning depending on a setting rather than on a channel is a gap the
# format has not closed - and until it does, the groups below are what tells them apart.
#
# SIXTEEN VOICES ARE SHARED ACROSS THE SIXTEEN TRACKS, which is where this instrument parts company
# with the Digitakt II. "The Digitone II has 16 voice polyphony" (p. 47) against sixteen tracks, and
# the voices are a pool rather than an allowance: "VOICE STEAL sets the rules for how voices are
# stolen (which voice is taken when you play a new note) when you use more than 16 voices at the
# same time" (p. 47), and a track may reserve some of them - "VOICES Sets the number of voices
# (1-16) you want to lock to a specific track" (p. 47). So the figure sits on the instrument with
# `polyphony_shared: true`, where the Digitakt II's sixteen voices are one per track and the figure
# sits on the part.
#
# FIVE ROWS OF THE EXTERNAL INPUT MIXER ARE A SECOND NAME FOR A ROW ALREADY THERE, not controls of
# their own, and they are not below. `Input L Level` and `Input L R Level` are both CC 72 and both
# NRPN 2:30; the same holds for the pan against the balance and for the three sends. They are one
# message whose meaning follows the Dual Mono setting, and keeping both would make a panel draw two
# faders that move together. The mono name is kept and the stereo name is recorded beside it.
#
# TWO CONTROLS ARE NOT IN THE APPENDIX AT ALL, and the body names both with their numbers: the
# modulation wheel on CC 1 and the breath controller on CC 2, each assignable to up to four of a
# track's parameters (p. 39). A reader with only the appendix would take 1 and 2 for unassigned.
#
# AND ONE NUMBER IS PRINTED TWICE WITHIN ONE TABLE, which is a different thing from the clashes
# above and is carried as printed. In the AMP table both `Decay Time` and `Sustain Level` are given
# CC 86, and the column runs 84, 85, 86, 86, 88 - so 87 is used by nothing. Their NRPNs are 1:32
# and 1:33, an unbroken run, which is what makes the control change look like the slip rather than
# the NRPN. Nothing in the manual or the release notes settles it, so both rows carry 86.

definition: 1

model:
  manufacturer: Elektron
  name: Digitone II
  # The manual says so itself, on p. 11: "This manual for Digitone II OS version 1.12 was last
  # updated September 24, 2026." That agrees with the OS1.12 in Elektron's file name and with the
  # "Digitone II OS 1.12" the support page offers for download, which is three statements agreeing
  # - where the Digitakt II had five dates for one file and no two of them agreed.
  # The version is checked and not only quoted. 1.12 is the newest system Elektron publishes, and
  # the release notes cover every release from 1.00. Four entries mention controllers and all of
  # them are at 1.10 or earlier: "Some NRPN parameters regarding the Euclidean sequencer didn't
  # work as intended", "Some NRPN parameters had incorrect values", "The MIDI machines SEL 1-8 and
  # SEL 9-16 parameters now have unique default SEL CCs", and one about MIDI messages at very low
  # tempos. Nothing since 1.10 adds, removes or renumbers a controller.
  firmware: "1.12"

source: >-
  User Manual, 122 pages, the edition Elektron names OS 1.12: APPENDIX C: MIDI, printed pp. 112-117,
  which is the whole of the control map; and from the body, pp. 11, 15, 16, 17, 24, 37, 39, 47, 74,
  75, 76 and 112. Elektron publishes no separate MIDI implementation document for this instrument,
  so the appendix is all there is. The support page and the OS release notes are saved here too.

  THE APPENDIX HOLDS 167 ROWS IN 20 TABLES AND 162 OF THEM ARE BELOW, with two more from the body
  for 164. The five that are not are the external input mixer's stereo-linked names, which are the
  same five messages already recorded under their mono names: `Input L R Level` is `Input L Level`,
  both CC 72 and NRPN 2:30; `Input L R Balance` is `Input L Pan`, both CC 74 and NRPN 2:32; and
  `Input L R Chorus Send`, `Input L R Delay Send` and `Input L R Reverb Send` are the three mono
  sends the same way. One message whose meaning follows the Dual Mono setting, so keeping both
  names would make a panel draw two faders that move together.

  IT IS SET AT TWO DIFFERENT LEFT MARGINS, which is worth knowing before reading it by machine:
  thirteen of its tables put the Parameter column at x 92 and eleven put it at x 64, every column
  shifted by the same 28 points. And the columns have to be found by position rather than by
  counting, because a row may fill two of the four number columns or three: three numbers on a row
  could be a controller with an NRPN pair, or a controller pair with an NRPN MSB, and those are
  different messages.

  THE CC LSB COLUMN IS PRINTED ON ALL 20 TABLES AND IS EMPTY IN ALL 167 ROWS, which is a negative
  worth stating because the appendix's own introduction explains it: control change on this
  instrument is seven bits and nothing more, and NRPN is the stated route to anything finer. So no
  control here has a fine half, no row fills all four number columns, and three numbers always mean
  a controller with an NRPN pair. Both readings of the appendix found the same, and the extraction
  asserts it rather than assuming it.

  FOUR GAPS AND ONE MISFILED ROW, each checked and each recorded as printed. The TRACK table gives
  Mute NRPN 1:108 and Track level 1:110, and 1:109 turns up two pages later as MISC's Pattern Mute.
  The REVERB table runs 2:8 to 2:13 and then puts its Mix Volume at 2:15, so 2:14 reaches nothing.
  LFO 3 runs 1:58 to 1:62 and then jumps to 1:70, 1:71 and 1:72 - forced, because 1:63 to 1:67 are
  VAL12 to VAL16 and 1:68 and 1:69 are the filter's Env. Reset and Key Tracking - where LFO 1 and
  LFO 2 are clean runs of eight. And `Pattern Volume`, CC 119 and NRPN 2:24, is printed inside the
  COMPRESSOR table between Makeup Gain and Ratio, outside that table's own runs of 111-118 and
  2:16-2:23 on both axes. It is not a compressor parameter; it is kept in the group the manual
  prints it in, because the section it sits under is the mixer and the panel page it belongs to is
  the one the compressor is on.

  LFO 3 IS REACHED BY NRPN AND BY NOTHING ELSE, all eight of its parameters, where LFO 1 takes CC
  102 to 109 and LFO 2 takes CC 111 to 118. With the Euclidean sequencer's seven, that is fifteen
  of the 164 controls below that no control change reaches.

  THE MAKER PREFERS NRPN AND SAYS SO, which is why `nrpn` records a preference rather than mere
  support: "due to the large number of controllable parameters and that the machines share the same
  CC values, it is not possible to control high-resolution parameters using CC. Instead, you should
  use NRPN messages for this purpose" (p. 112). The Digitakt II's appendix opens with one sentence
  and no such advice, so this is this instrument's own statement and not a house form of words.
  160 of the 164 controls below carry an NRPN and 149 carry a control change.

  THE EUCLIDEAN SEQUENCER'S TABLE IS CAPTIONED `AMP`, which is the caption of the table above it
  carried down, so its group is taken from the section heading - "C.6 EUCLIDEAN SEQUENCER
  PARAMETERS" - rather than from the caption. The Digitakt II's manual does the same thing three
  times over. **A reader or a tool should key a table on its section and never on its caption.**

  THE SECTION NUMBERING, THOUGH, IS RIGHT, and that is worth recording because its sibling's is
  not. This appendix runs C.1 to C.12 with no number used twice, and the contents page gives the
  page of all twelve correctly. The Digitakt II's prints two sections numbered B.8 and two B.9, on
  the page and on its contents page both.

  THE FOUR SYN PAGES ARE FOUR GROUPS AND NOT ONE, because each prints the same eight parameter
  names - "Data entry knob A (machine dependent)" to H - and only the caption tells the thirty-two
  apart. What each knob does follows from the machine assigned to the track, which is why the maker
  names none of them: Appendix A lists the machines over seventeen pages and none of its parameter
  names is tied to a knob letter there.

  SIXTEEN TRACKS ARE ONE PART AND NOT TWO, so the sixteen CC VAL controls and the audio-track
  parameters below are two maps reached on the same sixteen channels, never both at once. That is
  why NRPN 1:16 is here twice, as the filter's Attack Time and as VAL1, and why eleven of the CC
  VAL rows repeat the filter's and LFO 3's NRPNs exactly.

  THE EFFECTS AND THE MIXER ANSWER ON A CHANNEL OF THEIR OWN: "FX CONTROL CH selects the dedicated
  MIDI channel that is associated with the parameters on the DELAY, REVERB, CHORUS, and COMPRESSOR
  parameter pages together with the master overdrive, both for input and output" (p. 76). That
  sentence is also why the MISC table's Master Overdrive is on the effects part while its Pattern
  Mute is on a track.

  **THAT SENTENCE NAMES FOUR PAGES AND THE MASTER OVERDRIVE, AND NOT THE INPUT MIXER**, so putting
  the external input mixer and the pattern volume on the effects part is an inference rather than
  something the manual states. It rests on their sitting in the same appendix section as the
  compressor, C.10, and on the same panel page as it. Nothing else in either document places them,
  and the appendix itself never mentions a channel at all - every channel here comes from the body.

  THE APPENDIX NEVER MENTIONS A MIDI CHANNEL, which is why 23 controller numbers below appear
  twice. The delay's CC 21 to 28 are also the filter's; the reverb's 89 to 92 are also the amp's;
  the chorus's Speed is CC 9 and so is the trig page's Portamento Time; CC 17 is both the filter's
  knob F and the master overdrive. On the instrument these are a track's channel against the
  effects channel, and the body is the only place that says so.

  ONE NOTE ON THE EFFECTS CHANNEL DOES SOMETHING, AND THE PART NAMES IT. The release notes for OS
  1.10 say "Added tap tempo via MIDI note, using G10 on FX CONTROL channel" (release_notes) - a note
  number that works the panel rather than sounding a pitch. The manual names notes so that "C5, MIDI
  note 60, being middle C" (p. 24), which puts G10 at 127, the last MIDI note; no other naming keeps
  G10 inside MIDI's range at all. So the effects part takes notes, reads them through a map of its
  own, and the map holds one entry, `tap_tempo` on 127 - a button, not a grid.

  THE NOTE RANGE IS THE OUTER BOUND OF WHAT THE MANUAL STATES, over two bands that do different
  things. "Note numbers 0-15 correspond to notes C0 through to D#1, the leftmost octave. These
  notes will trigger the preset of track 1 through track 16, respectively (provided they are set to
  their default channels 1-16)" (p. 24), and "MIDI note numbers 16-84, that corresponds to notes
  E2-C7 (C5, MIDI note 60, being middle C) will trigger the preset of the active track in it's
  chromatic variations" (p. 24). Nothing above 84 is documented.

  THE MANUAL'S OWN NOTE NAMES DO NOT FOLLOW FROM ITS OWN NUMBERS, and both are left standing. If
  note 0 is C0 then note 16 is E1, and the same page calls notes 16-84 "E2-C7"; the page's own "C5,
  MIDI note 60, being middle C" agrees with note 0 being C0. The manual warns that "there are
  several different naming standards for note names and their corresponding MIDI note values. Here,
  we use the same naming standard as the one used internally in Elektron devices" (p. 24), which
  explains the offset from the common convention but not the disagreement with itself. The numbers
  are what this definition records; the names are not.

  NOT RECORDED: whether the aftertouch it answers to is channel pressure or per-note pressure. The
  instrument does answer to it - "Opens a menu where you can assign up to four parameters to the
  MIDI aftertouch command" (p. 39) - but no page in 122 says which kind, and the field exists to
  say which. The same page assigns pitch bend and the mod wheel the same way, and the pitch bend
  depth is a setting of its own: "PITCH BEND DEPTH Sets how much the pitch bend data from external
  MIDI devices affects the Digitone II" (p. 37), with no range given for it in semitones.

  ALSO NOT RECORDED: the default controller numbers the MIDI tracks' sixteen CC SEL parameters
  carry. The release notes say "The MIDI machines SEL 1-8 and SEL 9-16 parameters now have unique
  default SEL CCs", so those defaults exist and changed at OS 1.10, and the appendix lists the VAL
  parameters that send the values but not the SEL parameters that choose which controller each one
  sends on. A player sets them, so they are a project's business rather than the instrument's.

