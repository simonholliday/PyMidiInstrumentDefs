midi:
  # "n = MIDI channel number: 0H - FH (ch.1 - ch.16)" (implementation p. 1), through both
  # halves, ten entries printing it `(ch.1 - 16)` - and the part setting agrees: "Rx Ch 1-16
  # Specifies the MIDI receive channel of each part." (parameter_guide p. 6).
  channels: [1, 16]
  # NOT RECORDED, the mode. **There is no chart in any of the eleven documents** - no `MIDI
  # Implementation Chart` heading, no Basic Channel row, no True Voice row on any of the 377
  # sheets - and the Mode row is where this field comes from. What the implementation has instead
  # is OMNI OFF, OMNI ON, MONO and POLY among the channel mode messages it receives, which say
  # the instrument answers to them rather than which mode it is in.
  # **BOTH, AND NEITHER IS IN THE DOCUMENT NAMED FOR MIDI.** `F8H` appears on none of the
  # implementation's 90 sheets. The settings are in the system block: "Sync Mode AUTO, INT, MIDI,
  # USB COM, USB MEM" (parameter_guide p. 34) takes the clock, and "Sync Out OFF, MIDI, USB COM,
  # MIDI/USBCM, USB MEM, ALL Specifies the connector from which MIDI clock messages etc. are
  # output." (parameter_guide p. 34) sends it. **So this field rests entirely on a document whose
  # title is about parameters**, which is the same inversion the controls above rest on.
  clock: both
  # NOT RECORDED, the transport - see the account above for all three places it is absent from.
  program_change:
    # Both ways, each gated by its own switch: "Not received when the Rx PC parameter (SYSTEM:
    # MIDI RX) is OFF." (implementation p. 3) and "These messages are transmitted when Program or
    # Tone is selected." (implementation p. 6).
    receives: true
    sends: true
    # **128 PER BANK, AND THE BANKS ARE WHAT MAKE THE NUMBER LARGE.** "pp = Program number: 00H -
    # 7FH (prog.1 - prog.128)" (implementation p. 3), and the bank select table on sheet 1 maps
    # MSB 085 with LSB 000 to 003 onto `SCENE | 1 - 512`. So a scene is reached by a bank and a
    # program rather than by a program alone, and this field holds the second of those.
    presets: 128
  # NOT RECORDED: see the account above. The document says NRPN exists three times and gives no
  # way to select one, so neither statement is carried.
  # **SIXTEEN MEGABYTES OF ADDRESS MAP, AND ITS OWN DOCUMENT SAYS WHICH FOURTH BYTE TWICE.** Model
  # ID 00H 00H 00H 65H, commands RQ1 and DT1, a device ID of `17-32` (parameter_guide p. 36), and a
  # switch to refuse it: "Rx Exclusive OFF, ON Specifies whether system exclusive messages will be
  # received (ON) or not be received (OFF)." (parameter_guide p. 36).
  sysex: true

parts:
  part:
    label: Part
    count: 4
    # **EACH TAKES A CHANNEL OF ITS OWN AND THE SAME SETTING SERVES BOTH DIRECTIONS**: "Rx Ch 1-16
    # Specifies the MIDI receive channel of each part." (parameter_guide p. 6), with "If Tx Mode
    # is ON, this is also used as the MIDI transmit channel setting." (parameter_guide p. 6).
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]
    # **WHAT A PART IS, ON THIS INSTRUMENT, IS A MODEL SOMEBODY CHOSE** - and that is the fact
    # this format cannot hold. "Other models can be used with parts 1-4." (reference p. 61), with
    # one exception the maker states, which is that `VOCODER` "can be used only with part 1."
    # (reference p. 61).
    # So the 149 tone rows in the Parameter Guide belong to whichever model a part is holding at
    # the time, and nothing below can say so.
  drum:
    label: Part R
    count: 1
    channel: assigned
    # Its notes name drums rather than pitches, and the maker keeps it apart from the other four:
    # "No, a drum kit can be used only with PART R. It cannot be used with parts 1-4."
    # (reference p. 61).
    addressing: voices
    receives: [notes, controls, program_change]
    # NOT RECORDED, which note plays which drum. The kits are in the Sound List, which names them
    # and prints no note number for any of them.

voice:
  addressing: pitches
  # "kk = Note number: 00H - 7FH (0 - 127)" (implementation p. 1), on both the note off and the
  # note on entries, so every note in the range reaches something - on a 61-key instrument
  # whose own keys are a window on it.
  note_range: [0, 127]
  # NOT RECORDED AS A NUMBER, AND THE MAKER SAYS WHY RATHER THAN LEAVING IT OUT: "It differs
  # depending on the type and combination of models. As an example, if the JUPITER-8 is assigned
  # to all four parts, the maximum simultaneous polyphony will be 32 voices (up to eight voices
  # per part). In the case of PCM sounds, up to 256 notes (for MONO) can be produced."
  # (reference p. 61). **So there is no one figure to record**, and 32 would be an example rather
  # than a ceiling.
  # **BUT THE POOL IS SHARED, WHICH IS A FACT AND NOT A FIGURE**, and the Parameter Guide gives
  # the setting that only a shared pool would need: a part's Voice Reserve is the "number of
  # voices reserved for each part when the performance exceeds the maximum polyphony"
  # (parameter_guide p. 4). That follows `korg/kronos` at rank 89, which records the same pair.
  polyphony_shared: true
  velocity:
    # Both ways, which is why this is `both` rather than `received`: it reads one - "vv = Note on
    # velocity: 01H - 7FH (1 - 127)" (implementation p. 1) - and sends one its player can fix,
    # "Velocity REAL, 1-127 Specifies the velocity value that is transmitted when you play the
    # keyboard." (parameter_guide p. 34). **So a REAL setting sends what was played and a number
    # sends that number whatever was played**, which this field cannot say and a reader of the
    # guide would want to know.
    note_on: both
    # And note off velocity is a byte it reads rather than discards: "vv = Note off velocity: 00H
    # - 7FH (0 - 127)" (implementation p. 1).
    note_off: true
  # **BOTH KINDS ARE RECEIVED AND THIS FIELD HOLDS ONE WORD**, so it takes the stronger - which is
  # the chain `roland/mc_707`, `roland/fantom_6_7_8` and `roland/jd_xi` established. Channel
  # pressure is in the implementation both ways (pp. 3 and 6); polyphonic has no entry in either
  # half, and the Parameter Guide gives it a switch of its own: "Rx Poly Pres OFF, ON Specifies
  # whether polyphonic aftertouch is received (ON) or not received (OFF)." (parameter_guide
  # p. 6). **The implementation's silence is not a denial** - it lists Polyphonic Key Pressure
  # among the controllers Reset All Controllers resets (implementation p. 4), so the two
  # documents complete each other here rather than disagreeing, which is the opposite of the
  # NRPN case above.
  aftertouch: poly
  pitch_bend:
    # Received and transmitted, fourteen bits: "mm, ll = Pitch Bend value: 00 00H - 40 00H - 7F
    # 7FH (-8192 - 0 - +8191)" (implementation p. 3).
    # Settable over the first registered parameter - "mm: 00H - 18H (0 - 24 semitones)"
    # (implementation p. 3), with "Up to 2 octave can be specified in semitone steps."
    # (implementation p. 3) - and **no factory
    # depth is stated anywhere in 377 sheets**, so `semitones` is unrecorded and what is recorded
    # is that it can be set. Identical to the Fantom's and the JD-Xi's, from identical wording.
    programmable: true

groups:
  continuous: Continuous controllers
  switch: Switches and pedals
  sound: Sound controllers
  effects: Effect send levels

controls:

  # **ONE NUMBER HERE STATES A DIRECTION, FOOT TYPE'S ON ITS TWO CONTROLS, AND 23 DO NOT.** This
  # maker publishes reception and transmission as two prose halves and no chart. Of the 24
  # numbers, eight have a heading in both. Fifteen have one under reception alone; the sentence
  # that opens the transmission half's controllers says any controller can be sent, and the
  # address map lets a button, slider, pedal or wheel be set to each of them: see the account.
  # **Until 2026-10-12 those fifteen said `direction: receives`.** One, Foot Type, has a heading
  # under transmission alone and says `transmits`. `roland/fantom_6_7_8` and `roland/juno_x`
  # record nearly the same list with no direction on any control.
  # Eight of them are relative rather than absolute - `00H - 40H - 7FH (-64 - 0 - +63)`, which the
  # implementation calls a "relative change" (implementation p. 2) - and **this format has no
  # word for that**, so the
  # value range is left to the default and the fact is here. A consumer sending 0 to one of these
  # lowers the parameter by 64 rather than setting it to nothing.
  # **EACH NUMBER IS HERE ONCE FOR THE FOUR PARTS, AS `part_`, AND ONCE FOR PART R, AS `drum_`**,
  # but for the seven Part R does not receive; see the account.

  # Bank select ───────────────────────────────────────────
  # Carried, as it is wherever a maker numbers it, for the four parts and for Part R: "Bank Select
  # (Controller number 0, 32)" (implementation p. 1) heads it under reception, and the same under
  # transmission (implementation p. 6), so both ways. A part takes it under the system's Rx Bank
  # and its own (parameter_guide pp. 6 and 36), and it is sent only with Tx PC and Tx Bank on
  # (implementation p. 6). On a part's channel it chooses a tone or a kit; the scenes' 085 goes on
  # the Ctrl Ch, which no part here is.
  part_bank_select_msb:              {label: Bank Select (MSB), cc: 0, part: part}
  part_bank_select_lsb:              {label: Bank Select (LSB), cc: 32, part: part}
  drum_bank_select_msb:              {label: Bank Select (MSB), cc: 0, part: drum}
  drum_bank_select_lsb:              {label: Bank Select (LSB), cc: 32, part: drum}

  # Continuous controllers ────────────────────────────────
  part_modulation:                   {label: Modulation, cc: 1, part: part, group: continuous}
  # **THE ONE NUMBER ONLY THE TRANSMISSION HALF NAMES.** It is in the transmission half
  # (implementation p. 6) and in no entry of the reception half, which lists every other number
  # below. **And `transmits` is doubted here**: the reception half's Reset All Controllers list
  # resets a `Foot Type` with the rest (implementation p. 4), which a number nothing receives
  # would not need. And 4 is among what a control source can be set to, as `FOOT:CC04`, in the
  # scene's lists and in the MFX's (implementation pp. 13, 85 and 86), and the reception half's
  # controllers open "If you select a controller number that corresponds to an MFX Src 1–4
  # parameter, the respective effect is applied according to the setting." (implementation
  # p. 1). So the instrument can be made to answer 4 as a source of modulation, which is not to
  # say it answers it as Foot Type.
  part_foot_type:                    {label: Foot Type, cc: 4, direction: transmits, part: part, group: continuous}
  part_portamento_time:              {label: Portamento Time, cc: 5, part: part, group: continuous}
  part_volume:                       {label: Volume, cc: 7, part: part, group: continuous}
  part_panpot:                       {label: Panpot, cc: 10, part: part, group: continuous}
  part_expression:                   {label: Expression, cc: 11, part: part, group: continuous}
  drum_modulation:                   {label: Modulation, cc: 1, part: drum, group: continuous}
  drum_foot_type:                    {label: Foot Type, cc: 4, direction: transmits, part: drum, group: continuous}
  drum_volume:                       {label: Volume, cc: 7, part: drum, group: continuous}
  drum_panpot:                       {label: Panpot, cc: 10, part: drum, group: continuous}
  drum_expression:                   {label: Expression, cc: 11, part: drum, group: continuous}

  # Switches and pedals ───────────────────────────────────
  part_hold_1:                       {label: Hold 1, cc: 64, part: part, group: switch}
  part_portamento:                   {label: Portamento, cc: 65, part: part, group: switch}
  part_sostenuto:                    {label: Sostenuto, cc: 66, part: part, group: switch}
  part_soft:                         {label: Soft, cc: 67, part: part, group: switch}
  part_legato_foot_switch:           {label: Legato Foot Switch, cc: 68, part: part, group: switch}
  # Not a switch and filed with them because this maker files it with them: its value is a note
  # rather than a level - "kk = source note number: 00H - 7FH (0 - 127)" (implementation p. 2) -
  # and the note it names is where the next note-on slides from.
  part_portamento_control:           {label: Portamento control, cc: 84, part: part, group: switch}
  drum_hold_1:                       {label: Hold 1, cc: 64, part: drum, group: switch}
  drum_sostenuto:                    {label: Sostenuto, cc: 66, part: drum, group: switch}
  drum_soft:                         {label: Soft, cc: 67, part: drum, group: switch}

  # Sound controllers ─────────────────────────────────────
  # These eight numbers are the relative ones, and each names the Scene Part parameter it moves;
  # Part R has the first five.
  part_resonance:                    {label: Resonance, cc: 71, part: part, group: sound}
  part_release_time:                 {label: Release Time, cc: 72, part: part, group: sound}
  part_attack_time:                  {label: Attack time, cc: 73, part: part, group: sound}
  part_cutoff:                       {label: Cutoff, cc: 74, part: part, group: sound}
  part_decay_time:                   {label: Decay Time, cc: 75, part: part, group: sound}
  part_vibrato_rate:                 {label: Vibrato Rate, cc: 76, part: part, group: sound}
  part_vibrato_depth:                {label: Vibrato Depth, cc: 77, part: part, group: sound}
  part_vibrato_delay:                {label: Vibrato Delay, cc: 78, part: part, group: sound}
  drum_resonance:                    {label: Resonance, cc: 71, part: drum, group: sound}
  drum_release_time:                 {label: Release Time, cc: 72, part: drum, group: sound}
  drum_attack_time:                  {label: Attack time, cc: 73, part: drum, group: sound}
  drum_cutoff:                       {label: Cutoff, cc: 74, part: drum, group: sound}
  drum_decay_time:                   {label: Decay Time, cc: 75, part: drum, group: sound}

  # Effect send levels ────────────────────────────────────
  # Named as the implementation names them, brackets and all, which is also what the Fantom does.
  part_general_purpose_effect_1_reverb_send_level: {label: General Purpose Effect 1 (Reverb Send Level), cc: 91, part: part, group: effects}
  part_general_purpose_effect_3_chorus_send_level: {label: General Purpose Effect 3 (Chorus Send Level), cc: 93, part: part, group: effects}
  drum_general_purpose_effect_1_reverb_send_level: {label: General Purpose Effect 1 (Reverb Send Level), cc: 91, part: drum, group: effects}
  drum_general_purpose_effect_3_chorus_send_level: {label: General Purpose Effect 3 (Chorus Send Level), cc: 93, part: drum, group: effects}
