    url: "https://cdn.inmusicbrands.com/Moog/SlimPhatty/Slim%20Phatty%20Firmware.zip"
    sha256: 128e4d41e9c6b2c43617316505dcfbf822c8d36dd7e5a8069b512bb6f8b3bb6b
    retrieved: 2026-10-09
    paginated: false
    # THE DIGEST ABOVE IS A TEXT RENDERING OF THE UPDATE INSTRUCTIONS, NOT THE DOWNLOAD. The address
    # serves Moog's package, 4,659,203 bytes, digest
    # 470bdc25d03d315ffe033bbe5e537dc1d3a58d32f36ce1c6a2c06bf058e0b6b0, which holds the system,
    # Moog's loader and `Moog Slim Phatty v3_21 update instructions.rtf`. The instructions are
    # rendered to plain text by a rule the library's record of them writes down, so the citation
    # checks can read them; both the package and the rendering are in the library. Its section B
    # lists what 3.2 and 3.21 changed.
  forum_post:
    kind: web_page
    title: "New Firmware v3.1 for Slim Phatty, LP Stage and Tribute"
    dated: 2011-05-07
    landing: "https://forum.moogmusic.com/"
    url: "https://forum.moogmusic.com/t/new-firmware-v3-1-for-slim-phatty-lp-stage-and-tribute/9491"
    sha256: ff217407536dc428e45fb97d007ecc40b30e4d18badc95369299ccfe06f828ba
    retrieved: 2026-10-09
    paginated: false
    # Cited only for what 3.1 changed, which neither the manual nor the update instructions list.
    # The first post announces a pre-release beta of 3.1 and is by Amos Gaynes, whom the manual's
    # foreword names in the team that made the instrument (manual p. 5); the replies are customers'
    # questions and his answers. Nothing a field records rests on this page. The digest is of the
    # visible text; the served bytes are saved beside it.
  downloads_list:
    kind: web_page
    title: Moog downloads
    dated: 2026-10-01
    landing: "https://www.moogmusic.com/downloads/"
    url: "https://www.moogmusic.com/page-data/sq/d/1410304437.json"
    sha256: 2b12c3d24177c87c55f47550f16333f1228b33d740b8dd7fd4067a88605c0349
    retrieved: 2026-10-09
    paginated: false
    # Cited for what Moog serves for this instrument: "Slim Phatty Manual" (downloads_list) and
    # "Slim Phatty Firmware 3.21" (downloads_list), and nothing else. Fetched again on 2026-10-09
    # and byte for byte the copy of 2026-10-01, which is the one in the library.

midi:
  # "Values: OFF, 1 – 16; the default values are 1 for both MIDI In and MIDI Out" (manual p. 32),
  # each set on its own, and "The SP can only send and receive on one channel at a time"
  # (manual p. 32).
  channels: [1, 16]
  # From the chart's Mode row, whose received cell reads `4*` against a transmitted 3, footnoted
  # "Note priority is user selectable" (manual p. 67), with the legend "Mode 4 - Omni Off, Mono"
  # (manual p. 67). As `moog/minitaur` records it.
  mode: 4
  # "Receives Timing Clock" (manual p. 67), crossed as sent. The LFO and the arpeggiator each follow
  # it by a setting of their own: the LFO's is global, "Modes: INTERNAL, MIDI CLOCK; the default is
  # INTERNAL" (manual p. 27), and the arpeggiator's is set for each preset (manual p. 40).
  clock: receives
  # "Receives START, CONTINUE & STOP" (manual p. 67), crossed as sent; song position and song select
  # are crossed both ways. See the account for what 3.1 is said to send.
  transport: receives
  program_change:
    # "Values: ON, OFF; the default values are ON for both SND and RCV" (manual p. 29), and the
    # chart circles both cells with a true number of 00 to 99 (manual p. 67). No page names bank
    # select.
    receives: true
    sends: true
    # "Programmable monophonic analog synthesizer w/100 presets" (manual p. 71), at locations 00 to
    # 99, all of them the user's (manual p. 7).
    presets: 100
  # NO PAGE NAMES A NON-REGISTERED PARAMETER, and the chart's control change list has neither 98 nor
  # 99 (manual p. 67).
  nrpn: none
  # The current preset, all presets and a bulk dump go out from the SysEx menu
  # (manual pp. 42 and 43), and "The SP is able to receive System Exclusive data at any time without
  # any special prior setup." (manual p. 44), firmware included.
  sysex: true

voice:
  addressing: pitches
  # "Programmable monophonic analog synthesizer w/100 presets" (manual p. 71). A Poly setting lets
  # several Moogs share notes between them over MIDI (manual p. 34); each still plays one.
  polyphony: 1
  velocity:
    # Note on is circled received and crossed sent, and note off crossed both ways (manual p. 67).
    # Velocity reaches the filter through controller 110's sensitivity.
    note_on: received
    note_off: false
  # Crossed both ways on the chart (manual p. 67).
  aftertouch: none
  pitch_bend:
    # Received, "Programmable from 0 to ±12 semitones" (manual p. 67), up and down set separately
    # for each preset, "UP: 0, +2, +3, +4, +5, +7, +12" (manual p. 37), and by controllers 107 and
    # 108 below.
    programmable: true

groups:
  # After the table's SECTION column, as the rendered page sets it; the text layer carries no
  # section names.
  interface: Interface Panel
  modulation: Modulation
  oscillators: Oscillators
  filter: Filter
  envelopes: Envelope Generator
  arpeggiator: Arpeggiator
  output: Output
  keyboard: Keybd Response
  wheel: Mod Wheel Function

controls:

  # Interface Panel ─────────────────────────────────────────
  glide_on_off:                {label: Glide On/Off, cc: 65, choices: {"off": 0, "on": 64}, group: interface}

  # Modulation ──────────────────────────────────────────────
  # Changes nothing while the LFO follows MIDI clock: "if you try to control the LFO Rate from the
  # panel knob or send a MIDI CC# 3 message while the LFO Sync Mode is set to MIDI CLOCK, the actual
  # rate of the LFO will not change" (manual p. 58).
  lfo_rate:                    {label: LFO Rate, cc: 3, group: modulation}
  mod_amount:                  {label: Modulation Amount, cc: 6, group: modulation}
  mod_source:                  {label: Modulation Source, cc: 68, choices: {tri: 0, square: 16, saw: 32, ramp: 48, filt_env: 64, osc_2: 80}, group: modulation}
  mod_destination:             {label: Modulation Destination, cc: 69, choices: {pitch: 0, filt: 16, wave: 32, osc_2: 48}, group: modulation}
  lfo_sync_source:             {label: LFO Sync Source, cc: 102, choices: {int: 0, midi_clk: 64}, group: modulation}
  lfo_sync_clock_div:          {label: LFO Sync Clock Div, cc: 103, choices: {thirty_second_note: 0, dotted_thirty_second_note: 8, sixteenth_note: 16, dotted_sixteenth_note: 24, eighth_note: 32, dotted_eighth_note: 40, quarter_note: 48, dotted_quarter_note: 56, half_note: 64, dotted_half_note: 72, whole_note: 80, whole_plus_quarter: 88, whole_plus_half: 96, whole_plus_dotted_half: 104, whole_plus_whole: 112}, group: modulation}
  mod_source_5:                {label: Mod Source 5, cc: 104, choices: {filt: 0, s_and_h: 64}, group: modulation}
  mod_source_6:                {label: Mod Source 6, cc: 105, choices: {osc_2: 0, noise: 64}, group: modulation}
  mod_dest_2:                  {label: Mod Dest 2, cc: 106, choices: {"off": 0, pitch: 25, filt: 50, wave: 75, osc_2: 100}, group: modulation}

  # Oscillators ─────────────────────────────────────────────
  osc_1_octave:                {label: Osc 1 Octave, cc: 74, choices: {sixteen_foot: 16, eight_foot: 32, four_foot: 48, two_foot: 64}, group: oscillators}
  osc_1_wave:                  {label: Osc 1 Wave, cc: 9, group: oscillators}
  osc_1_level:                 {label: Osc 1 Level, cc: 15, group: oscillators}
  glide_rate:                  {label: Glide Rate, cc: 5, group: oscillators}
  sync_1_2:                    {label: 1-2 Sync, cc: 77, choices: {"off": 0, "on": 64}, group: oscillators}
  osc_2_octave:                {label: Osc 2 Octave, cc: 75, choices: {sixteen_foot: 16, eight_foot: 32, four_foot: 48, two_foot: 64}, group: oscillators}
  osc_2_freq:                  {label: Osc 2 Freq, cc: 10, group: oscillators}
  osc_2_wave:                  {label: Osc 2 Wave, cc: 11, group: oscillators}
  osc_2_level:                 {label: Osc 2 Level, cc: 16, group: oscillators}
  # The table gives these 0 to 127; the menu that sets the same depths offers seven steps each way,
  # "UP: 0, +2, +3, +4, +5, +7, +12" (manual p. 37), and no page says how the one maps onto the
  # other.
  pitch_bend_up_amount:        {label: Pitch Bend Up Amount, cc: 107, group: oscillators}
  pitch_bend_down_amount:      {label: Pitch Bend Down Amount, cc: 108, group: oscillators}

  # Filter ──────────────────────────────────────────────────
  # Fourteen bits as received; see the account. The chart's list prints 53 where the table gives 51.
  cutoff:                      {label: Cutoff, cc: 19, lsb: 51, range: [0, 16383], group: filter}
  resonance:                   {label: Resonance, cc: 21, group: filter}
  kb_amount:                   {label: KB Amount, cc: 22, group: filter}
  eg_amount:                   {label: EG Amount, cc: 27, group: filter}
  overload:                    {label: Overload, cc: 18, group: filter}
  filter_poles:                {label: Filter Poles, cc: 109, choices: {one: 0, two: 32, three: 64, four: 96}, group: filter}
  # Seventeen values, 7 apart except from -8 to -7, which is 12 (manual p. 57); recorded as printed.
  filter_velocity_sens:        {label: Filter Velocity Sens, cc: 110, choices: {minus_8: 0, minus_7: 12, minus_6: 19, minus_5: 26, minus_4: 33, minus_3: 40, minus_2: 47, minus_1: 54, zero: 61, plus_1: 68, plus_2: 75, plus_3: 82, plus_4: 89, plus_5: 96, plus_6: 103, plus_7: 110, plus_8: 117}, group: filter}

  # Envelope Generator ──────────────────────────────────────
  filter_eg_attack:            {label: Filter EG Attack, cc: 23, group: envelopes}
  filter_eg_decay:             {label: Filter EG Decay, cc: 24, group: envelopes}
  filter_eg_sustain:           {label: Filter EG Sustain, cc: 25, group: envelopes}
  filter_eg_release:           {label: Filter EG Release, cc: 26, group: envelopes}
  volume_eg_attack:            {label: Volume EG Attack, cc: 28, group: envelopes}
  volume_eg_decay:             {label: Volume EG Decay, cc: 29, group: envelopes}
  volume_eg_sustain:           {label: Volume EG Sustain, cc: 30, group: envelopes}
  volume_eg_release:           {label: Volume EG Release, cc: 31, group: envelopes}
  egr_release:                 {label: EGR Release On/Off, cc: 111, choices: {"off": 0, "on": 64}, group: envelopes}
  egr_legato:                  {label: EGR Legato, cc: 112, choices: {"on": 0, "off": 43, reset: 86}, group: envelopes}

  # Arpeggiator ─────────────────────────────────────────────
  # The arpeggiator is switched on and off only "When a preset has the Arpeggiator function enabled"
  # (manual p. 52), which is 113.
  arpeggiator_enable:          {label: Arpeggiator Enable, cc: 113, choices: {"off": 0, "on": 64}, group: arpeggiator}
  # THE TABLE GIVES 90 TO THIS, AND TWO PAGES GIVE IT TO THE CLOCK RATE: the arpeggiator's rate
  # changes "by issuing a MIDI CC#90 command" (manual p. 40), and "by sending a MIDI CC#90 command
  # with a value in the range 0-127" (manual p. 59). The table puts the rate on 4 and 36, with a
  # worked example (manual pp. 54 and 56), and is followed.
  arp_run_stop:                {label: Arp Run/Stop, cc: 90, choices: {"off": 0, "on": 64}, group: arpeggiator}
  # 3 BPM a step over 21 to 320 BPM, with 36 adding tenths: the manual's example sets 40 and 17 for
  # 121.7 BPM (manual p. 54).
  arp_clock_rate_coarse:       {label: Arp Clock Rate (coarse), cc: 4, group: arpeggiator}
  arp_clock_rate_fine:         {label: Arp Clock Rate (fine), cc: 36, group: arpeggiator}
  # With MIDI chosen and no clock arriving, "Note that if no MIDI Clock signal is present, the
  # Arpeggiator will not run and no notes will be heard." (manual p. 40).
  arp_clock_source:            {label: Arp Clock Source, cc: 114, choices: {int: 0, lfo: 43, midi: 86}, group: arpeggiator}
  arp_clock_divisions:         {label: Arp Clock Divisions, cc: 115, choices: {thirty_second_note: 0, dotted_thirty_second_note: 8, sixteenth_note: 16, dotted_sixteenth_note: 24, eighth_note: 32, dotted_eighth_note: 40, quarter_note: 48, dotted_quarter_note: 56, half_note: 64, dotted_half_note: 72, whole_note: 80, whole_plus_quarter: 88, whole_plus_half: 96, whole_plus_dotted_half: 104, whole_plus_whole: 112}, group: arpeggiator}
  # Seven values printed with uneven steps, 19 apart except from 0 to +1, which is 14
  # (manual p. 56); recorded as printed.
  arp_range:                   {label: Arp Range (Octaves), cc: 116, choices: {minus_3: 0, minus_2: 19, minus_1: 38, zero: 57, plus_1: 71, plus_2: 90, plus_3: 109}, group: arpeggiator}
  arp_pattern:                 {label: Arp Pattern, cc: 117, choices: {up: 0, down: 43, order: 86}, group: arpeggiator}
  arp_mode:                    {label: Arp Mode, cc: 118, choices: {loop: 0, back_forth: 43, once: 86}, group: arpeggiator}
  # 91 latches only once 119 has enabled the latch: with it off, "the Latch is always off and cannot
  # be activated accidently." (manual p. 42).
  arp_latch_enable:            {label: Arp Latch Enable, cc: 119, choices: {"off": 0, "on": 64}, group: arpeggiator}
  arp_latch_unlatch:           {label: Arp Latch/Unlatch, cc: 91, choices: {"off": 0, "on": 64}, group: arpeggiator}

  # Output ──────────────────────────────────────────────────
  volume:                      {label: Volume, cc: 7, group: output}

  # Keyboard Response ───────────────────────────────────────
  # 0 hands the choice to the global priority, which has no controller: "The default is GLOB
  # (Global), which inherits the global keyboard priority setting from the Master KEYBD PRIORITY
  # menu" (manual p. 38), whose "Values: LOW NOTE, HIGH NOTE, LAST NOTE; the default is LAST NOTE"
  # (manual p. 28).
  keyboard_note_priority:      {label: Keyboard Note Priority, cc: 88, choices: {glob: 0, low: 32, high: 64, last: 96}, group: keyboard}

  # Mod Wheel ───────────────────────────────────────────────
  mod_wheel:                   {label: Mod Wheel, cc: 1, lsb: 33, range: [0, 16383], group: wheel}
