    # the 61's 1.5.1 manual while the 61 has 2.0.0, and where the release notes' ids were got.
    # The digest is of the text rendering; `Tools/save_page.py` rebuilds it from the saved HTML
    # byte for byte. Cited also for an absence: Arturia publishes no MIDI implementation document
    # for this instrument. The title is the one the page serves; the copy of 2026-10-03 was
    # recorded here as `Downloads - AstroLab`, which is not what it served.
  cheatsheet:
    kind: manual
    title: AstroLab 61 CheatSheet
    edition: 1.6.0-cheatsheet
    dated: 2024-04-08
    landing: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    url: "https://www.arturia.com/api/download/products/astrolab-61/manual/astrolab_Manual_1_6_0-cheatsheet_EN.pdf"
    sha256: f9651f351ad21b91d65693c9b6ceaaaf2d21937347e3b4413c0945e7fef95c7b
    retrieved: 2026-10-03
    page_offset: 0
    # **ITS VERSION STRING READS NEWER THAN THE MANUAL'S AND THE DOCUMENT IS TWENTY MONTHS
    # OLDER.** Arturia dates it 2024-04-08 and the file was created 2024-04-05, the same week as
    # the 1.0.0 manual and three days after firmware 1.1.6.0 - while firmware 1.6.0 did not
    # exist until 2025-11-19. So the `1.6.0` in its name cannot be that firmware. One landscape
    # page of panel shortcuts, **carrying no controller number, no channel and no MIDI setting
    # at all**, which is the only thing it is cited for. It prints no page number, so a locator
    # means the file's page. The resources page still lists it as the 61's English CheatSheet;
    # its data also links a CheatSheet named 2.0, which was not read.

midi:
  # "Part 1 Input Channel After clicking the Navigation Wheel, you can set the MIDI receive
  # channel by rotating the wheel" (manual p. 27), with "Selecting All makes AstroLab listen to
  # all MIDI channels" (manual p. 27). No factory default is published for either Part.
  channels: [1, 16]
  # RECEIVED AND NOT SENT. "USB: AstroLab syncs to incoming MIDI clock over USB" (manual p. 69)
  # and "MIDI: AstroLab syncs to incoming MIDI clock over the 5-pin MIDI input" (manual p. 69).
  # Nothing anywhere sends a clock, and the MIDI Out Filter's widest setting transmits notes only.
  clock: receives
  # RECEIVED AND NOT SENT, and stated as behaviour rather than as a chart row: "If a MIDI stop
  # message or clock interruption is detected, the MIDI looper (if playing) pauses" (manual
  # p. 69) and "If a MIDI start message is detected, playback resumes synced to the external
  # clock" (manual p. 69).
  transport: receives
  program_change:
    # THE MANUAL IS SILENT AND THE FIRMWARE HISTORY IS NOT - see the source account. "Program
    # change no longer reacts to all MIDI channels" (release_notes), under V 1.3.5.
    receives: true
    # "AstroLab can now send Program change to External devices" (release_notes), under V 1.5.0,
    # so a Muse-like asymmetry does not apply: this one gained sending later than receiving.
    sends: true
    # NO COUNT. The nearest figure is "Over 1,800 built-in sounds across all types of synths and
    # keyboards" (manual p. 11), and "over" is not a number of addressable locations.

voice:
  addressing: pitches
  # VOICES PER PART AND NOT ONE POOL: "These are voices per part, meaning that if you load, for
  # example, a Multi consisting of a Mini V and Prophet-5 V, you can play 16 voices on each
  # part" (manual p. 39). How many each Part gets is the loaded engine's, from 1 to 48 across
  # some forty of them, so no `polyphony` is recorded - see the source account.
  polyphony_shared: false
  velocity:
    # "Keyboard Velocity Here you can set the overall velocity sensitivity of AstroLab's
    # keyboard from Light to Medium to Heavy" (manual p. 28), and the Looper "records all MIDI
    # notes with velocity as well as Pitch Bend, Modwheel, and Aftertouch" (manual p. 70).
    note_on: both
  # THE WORD IS NEVER QUALIFIED, AND POLYPHONIC AFTERTOUCH IS NAMED NOWHERE in any document held
  # here. "Semi-weighted keys with velocity and aftertouch" (manual p. 11), and the setting that
  # shapes it speaks of one pressure: "The desired amount of pressure needed to trigger
  # aftertouch is highly individual" (manual p. 28). `channel` is the ordinary reading of an
  # unqualified word rather than a stated fact, and is recorded as such.
  aftertouch: channel
  # NOT RECORDED: `pitch_bend`. A PART ANSWERS TO IT OR DOES NOT, WHICH IS THE ONLY THING
  # PUBLISHED: "There are also switches that let you decide if Part 1 will be affected by Pitch
  # Bend, Mod Wheel, Aftertouch, Sustain and Expression Pedal or not" (manual p. 36). That is not
  # a settable range, and no range is given anywhere, as `arturia/astrolab_37` records too.

parts:
  part:
    label: Part
    # "Instrument section with two selectable parts, allowing you to split or layer different
    # instruments" (manual p. 11), with the default split at C3 (manual p. 37).
    count: 2
    # A CHANNEL EACH, SET BY THE PLAYER: "The two Parts in AstroLab can conveniently listen to
    # separate channels" (manual p. 27), and each Part's own page sets "MIDI input and output
    # channels" (manual p. 36). Neither derives from the other, so there is no offset.
    channel: assigned
    addressing: pitches
    # NOTES AND CONTROLLERS. "There are also switches that let you decide if Part 1 will be
    # affected by Pitch Bend, Mod Wheel, Aftertouch, Sustain and Expression Pedal or not"
    # (manual p. 36) - all of which are notes and controllers. **Program change is not listed**
    # among them, and the manual says nothing about it at all, so it is left out rather than
    # guessed at.
    receives: [notes, controls]

groups:
  controllers: Controllers
  master: Master
  pedals: Pedals
  effects: Effects
  macros: Macros
  faders: Faders
  functions: Functions

controls:

  # CONTROLLERS -----------------------------------------------
  # the wheel beside the keyboard, which the table itself heads "MIDI"
  mod_wheel:                 {label: Mod Wheel, cc: 1, group: controllers}

  # MASTER ----------------------------------------------------
  # the table's own `Master` label, printed against this row alone; `Never` sent and `Never`
  # received (manual p. 105), so it is recorded and offered to nobody
  master_volume:             {label: Master Volume, cc: 7, direction: none, group: master}

  # PEDALS ----------------------------------------------------
  # `Sustain Polarity` and `Expression Polarity` (manual p. 28), and "Aux 1 / Aux 2: The two Aux
  # sockets accept switching or continuous pedals" (manual p. 28)
