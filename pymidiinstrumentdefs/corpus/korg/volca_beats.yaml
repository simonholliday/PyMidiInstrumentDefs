# THE PLAIN TEXT FILE IS THE BETTER DOCUMENT, AND IT IS THE FIRST TIME IN THIS CORPUS. Korg
# publishes two: a 3.9 KB ASCII implementation and a one-sheet implementation chart. **The chart's
# Yes and No marks are drawings and are not in its text layer at all** - a text extraction of that
# sheet returns no O and no X, not one - while the text file rules its twenty controller numbers
# and its ten note numbers into tables a machine can read, and gives each in hexadecimal and in
# decimal so that the two can be checked against each other. Both are cited. The numbers below come
# from the text file; the chart is what settles what the instrument does with everything else.
#
# AND THE CHART IS SHORT BY THREE PARTS WHERE THE TEXT FILE IS NOT. The chart's footnote naming
# the note numbers stops after seven of them - "36: KICK, 38: SNARE, 43: LO TOM, 50: HI TOM, 42: CL
# HAT, 46: OP HAT, 39: CLAP" (chart p. 1) - and never gives CLAVES, AGOGO or CRASH, although its
# own True Voice row says 36 to 75 and 75 is the claves. The text file has all ten. **A reader of
# the chart alone could not play three of this instrument's ten parts.**
#
# NOTHING IS TRANSMITTED, AND THAT IS A FACT ABOUT THE SOCKETS. "No message is transmitted. (The
# volca beats is not equipped with a MIDI Out jack.)" (midi_impl). So every control below is marked
# `receives`, and so are the clock and the transport.
#
# TWO GLOBAL SETTINGS CAN TURN OFF WHAT THIS FILE DESCRIBES, and both ship on. The twenty
# controllers and the note numbers all carry footnote *1, "Received when global parameter MIDI RX
# ShortMessage is set to ON." (chart p. 1), and the owner's manual marks On as that setting's
# factory default (manual). The clock, the transport and the song position carry *3, "Not received
# when global parameter MIDI Clock src is set to Internal; received when set to Auto." (chart
# p. 1), and Auto is its factory default (manual).

definition: 1

model:
  manufacturer: Korg
  name: volca beats
  # NOT RECORDED, and the reason is the volca drum's reason over again. The chart is "Ver.: 1.00"
  # dated "2013. 06. 10" (chart p. 1) and the text implementation is "Revision 0.01 (2013.06.23)"
  # (midi_impl); Korg's downloads page offers a System Updater at **1.04**, and the one before it
  # says in its own release notes "Fixes MIDI Song Position Pointer." (updater).
  # **SO THE DOCUMENTS DESCRIBE THIS INSTRUMENT BEFORE A CHANGE TO SOMETHING THEY CHART**, and
  # Korg has not republished either. Writing 1.04 here would claim the rows below match it, which
  # that release note puts in doubt for at least one of them. Checked 2026-10-04.

source: >-
  volca beats MIDI Implementation, a plain text file of 3.9 KB: **every controller number and every
  note number below is one of its rows**. volca beats MIDI Implementation Chart, one sheet, for
  everything else the instrument does and does not answer to. Owner's Manual, for the two global
  settings and for the MIDI channel. And Korg's downloads page and System Updater page, for what is
  published and for what has changed since.

  THE CHART'S MARKS ARE DRAWINGS. Pulling the text out of that sheet gives its headings, its row
  names, its values and its footnotes, and **not one O and not one X** - every Yes and every No on
  it is a vector, and its own legend's two symbols are missing from the text for the same reason.
  So both readings of the chart here were made by eye off renders at 300 to 600 dots to the inch,
  and neither could have been taken from the file. That is the EP-133's and the DrumBrute Impact's
  situation in a third maker's document.

  TWENTY CONTROLLER NUMBERS, 40 TO 59, WITH NOTHING UNUSED IN BETWEEN, and ten note numbers from 36
  to 75. The text file gives both in hexadecimal and in decimal, which is the one thing in it that
  can be checked without a second reader, and the two agree on all thirty rows.

  **THE TEXT FILE IS PRINTED ONCE**, which is worth saying because two other Korg text
  implementations in this corpus are not: the electribe's prints its whole table twice and so does
  the minilogue's, and a reader who took the second printing for more rows would double the map.
  Asserted rather than assumed.

  THE TWO DOCUMENTS DISAGREE ABOUT ONE THING AND THE CHART CONTRADICTS ITSELF IN ONE CELL. The
  chart's Velocity Note On cell, read at 600 dots to the inch, holds **a cross and a value
  together**: a cross, then "9n, V=1 - 127" (chart p. 1). A cross means not recognised and that
  value is the form of what is recognised, so the cell cannot be read either way. The text file
  settles it with no ambiguity at all: "Note On  vv=1~127" (midi_impl) sits under its heading
  "2.RECOGNIZED RECEIVE DATA" (midi_impl), and that is what `velocity` records below.

  AND WHAT THE CHART DOES NOT COUNT AS A CONTRADICTION. Its Velocity Note Off row is a cross in
  both columns, while the text file lists two Note Off forms among the messages it recognises. They
  are about different things: the chart's row is release velocity, which this instrument ignores,
  and the text file's rows are the note-off messages themselves, which it accepts. Both are
  recorded.

  THE OWNER'S MANUAL LEAVES THE MIDI SOCKET OUT OF ITS OWN SPECIFICATION. Its walkthrough of the
  back panel describes it - "This jack is where you can connect an external MIDI device to control
  the sound generator of the volca beats" (manual) - and its Main Specifications list the
  connectors as the headphones jack and the two sync jacks and nothing else. The instrument has a
  MIDI IN and the specification does not say so.

  THE MAKER SPELLS THINGS SEVERAL WAYS AND EVERY SPELLING HERE IS ITS OWN. The chart's PCM SPEED
  row names the parts "(CLAP, CALVES, AGOGO, CRASH)" (chart p. 1), where the text file and the rest
  of the chart write CLAVES. The text file's real-time table reads "Contiune" for Continue
  (midi_impl). The setting that gates every control is "MIDI RX Short Message" (midi_impl) in the
  text file and "MIDI RX ShortMessage" (chart p. 1) on the chart, which is also how the owner's
  manual writes it (manual). And the three controls at 56, 57 and 58 are "DECAY (TOM)" (midi_impl),
  "DECAY (CLOSED HAT)" (midi_impl) and "DECAY (OPEN HAT)" (midi_impl) in the text file, against
  "TOM DECAY" (chart p. 1), "CLOSED HAT DECAY" (chart p. 1) and "OPEN HAT DECAY" (chart p. 1) on
  the chart. **The labels below follow the text file**, because that is the document the numbers
  come from. None of it changes a number.

  AND THE OLDER DOCUMENT CARRIES THE HIGHER VERSION. The chart is dated 2013.06.10 at version 1.00
  and the text file 2013.06.23 at revision 0.01, thirteen days later. Which is a reminder that a
  version number is a label a maker chooses rather than an order, and that age is not it either.

