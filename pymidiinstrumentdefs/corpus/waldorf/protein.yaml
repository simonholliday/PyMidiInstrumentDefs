    sha256: 6c08357f1cb380eb891cdaf5efdc277166b89620c4fc7e2eae83b0c9a9093e19
    retrieved: 2026-10-06
    # **CITED FOR A COMPARISON RATHER THAN FOR A FACT, AND IT IS THE REASSURING ONE.** Rank 95's
    # instrument had a translation that omitted its whole MIDI implementation, so this pair was
    # checked the same way: 72 sheets against the English 71, `Rev. 1, November 2025` against
    # `Rev. 2, January 2026`, and **every MIDI fact the English edition has** - CC 74 on its sheet
    # 54, the modulation sources on 57, MPE across five sheets, its own glossary at 63.
    # So this is a translation one revision behind that leaves nothing out, which is what the
    # other case needed comparing with. It arrives in the same `.zip` as the English manual.
    page_offset: 0
  downloads_page:
    kind: download_page
    title: FAQ / Downloads | Protein | Waldorf Music
    landing: "https://waldorfmusic.com/protein/"
    url: "https://waldorfmusic.com/faq-protein/"
    sha256: d6e2a030b2990f3be8d191a99d63ed3ad90244559b99c8b0cfe22ad8797a335f
    retrieved: 2026-10-06
    paginated: false
    # **Cited for the count being four and for one of them being unnamed.** The product page at
    # waldorfmusic.com/protein/ offers only the manual; this page is where the other three are,
    # and it is reached by a link reading `go to protein FAQ / Downloads`.
    # The digest is of the extraction, which pairs each share token with the words that label it -
    # and the changelog's row has the address as its own label, because it is written into the
    # body of an answer rather than offered as a download. The served markup is saved beside it as
    # `.html`, whose own digest is 3dc6c2be9f96f2cf80adfc062f741c84f2747d7a10a1d716521644e12445a731.
    # **No file address appears on it at all**: four share tokens, no file names, and the
    # `.zip` that comes back is the only thing that says what each is.

midi:
  # NOT RECORDED, AND THIS IS THE FIELD THE GLOSSARY TRAP WOULD HAVE FILLED WRONGLY. The only
  # statement of a channel range in 71 sheets is the glossary's "MIDI Channels 1 through 16 are
  # available for this purpose." (manual p. 65), which is a sentence about MIDI and not about this
  # instrument. Its own settings give a receive channel and a send channel with no range -
  # "Determines the basic send and receive channel for the device." (manual p. 51) - and an omni
  # switch that speaks of "any MIDI channel" (manual p. 51) without counting them.
  # **So sixteen is almost certainly right and is not published**, which is the distinction this
  # field exists to keep.
  # NOT RECORDED, the mode: no implementation chart exists in any of the four documents, and the
  # Mode row is where this comes from.
  # **RECEIVES, BY A SETTING WITH TWO VALUES, AND SENDS NOTHING.** `Sync Settings Source`
  # "Determines how Protein reacts to incoming MIDI Clock messages." (manual p. 52) - `Intern`
  # means "Protein doesn’t react to incoming MIDI Clock" (manual p. 52) and `Extern` that it "automatically syncs
  # to incoming MIDI Clock if it is sent by an external device like a DAW, a sequencer or a drum
  # machine." (manual p. 52). **Nothing in any document says it sends one**, and it has a
  # sequencer and an arpeggiator that would be worth syncing to, so this is an absence a consumer
  # may be surprised by rather than a silence about something unlikely.
  clock: receives
  # NOT RECORDED, the transport: no document mentions start, stop or continue as MIDI messages.
  program_change:
    # **THE COUNT IS THE CHANGELOG'S AND THE MESSAGE IT NAMES IS NOT A PROGRAM CHANGE.** Firmware
    # 1.02 added "Recognizing MIDI Bank Select (LSB aka CC32) messages to choose from all 360
    # slots" (changelog), after 1.01 "Increased preset storage from 250 to 360" (changelog).
    # So 360 is what a consumer can reach, and the specification sheet's 250 is a figure
    # from before December 2025.
    # `receives` IS LEFT UNRECORDED DELIBERATELY - see the account. Bank select LSB cannot reach
    # 360 slots by itself, so program change must be received as well, and **no document says it
    # is**: the only page that discusses program change at all is the glossary. Recording `true`
    # would be carrying an inference as a citation.
    # **AND CC 32 IS NOT AMONG THE CONTROLS BELOW**, following the ruling this corpus has applied
    # to every Roland since rank 77: bank select addresses something rather than controlling it,
    # so it belongs to this field rather than to that list.
    presets: 360
  # NOT RECORDED, AND THE REASON IS THAT THIS INSTRUMENT IS BOTH THINGS THIS FIELD HAS WORDS FOR.
  # See the comment above the definition: a fixed set of numbers in the modulation matrix, and
  # MIDI learn for every parameter beyond them.
  # **BOTH WAYS, FOR WHOLE SOUNDS RATHER THAN FOR PARAMETERS.** The preset menu sends - "The
  # active sound (as edited) will be sent as MIDI SysEx dump to the USB-C port. The dump contains
  # multiple MIDI SysEx messages." (manual p. 20) - and receives, by a mode it is put into:
  # "Start Receive: Puts Protein in a receive mode for multiple sound presets as MIDI SysEx dump
  # from any external MIDI source." (manual p. 20). The specification agrees in one line:
  # "Import- and export of patches via MIDI Sysex" (specifications p. 2).
  # Its device id is settable and **it can be addressed as a broadcast but cannot send as one**:
  # "Device ID 127 is a so-called broadcast ID that addresses all connected Protein units. Protein
  # can receive this from other devices, but cannot send it itself." (manual p. 51).
  sysex: true
  # **MPE, AND THE NUMBER OF CHANNELS IT TAKES IS THE PLAYER'S TO SET**: "Here you can determine
  # the number of used channels for MPE purposes." (manual p. 53). Each dimension is named with
  # the message that carries it - the X axis "(sent as MIDI Pitch Bend)" (manual p. 53), the Y
  # axis "(sent as MIDI CC 74)" (manual p. 53) and the Z axis "(sent as MIDI Channel
  # Aftertouch)" (manual p. 53) - and the
  # specification claims it in one word, "MPE Compatible" (specifications p. 2).
  per_voice_channels: true
  # Received, on the channels set above (manual p. 53); nothing says it sends MPE.
  mpe: receives

parts:
  layer:
    label: Layer
    count: 4
    # **THESE PARTS EXIST IN ONE MODE OF FOUR, WHICH IS AN OPEN QUESTION ON THE FORMAT
    # FROM THE OTHER SIDE.**
    # The four layers always exist as sounds; they take channels of their own only under `Midi
    # Split`, and the maker spells the derivation out: "Based on the determined MIDI Receive
    # Channel in the Settings, the select MIDI Channel triggers Layer A, the next MIDI channel
    # Layer B and so on. E.g., Receive Channel is set to 2. Incoming notes on MIDI channel 2
    # triggers Layer A, notes on MIDI channel 3 triggers layer B, notes on MIDI channel 4 triggers
    # Layer C and notes on MIDI channel 5 triggers Layer D." (manual p. 18). That is exactly what
    # `channel_offset` means - consecutive from a base that moves - so it is recorded that way.
    # **IN THE OTHER THREE MODES ALL FOUR ANSWER ON THE ONE CHANNEL.** `Layered` plays them
    # together, `Round Robin` takes "each incoming note triggers the next active layer in
    # ascending order repeatedly" (manual p. 18) and `Random Robin` is "Same as Round Robin, but in random order."
    # (manual p. 18), and Single Mode selects one by a button. **So a consumer that trusts
    # these channels without knowing the mode will address three layers that are not listening.**
    # Where the OB-X8 at rank 70 could not state its polyphony because its parts were conditional,
    # this instrument can: its voices are shared in every mode, which the next field records.
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls]
    # NOT RECORDED, a per-part polyphony, and here that is a fact rather than a gap - see
    # `voice.polyphony_shared`.

voice:
  addressing: pitches
  # NOT RECORDED. The only note range in any document is the glossary's, about MIDI rather than
  # about this instrument: a note's "pitch is derived from the note number, which lies between 0
  # and 127." (manual p. 65). What this instrument says about note numbers is one reference point,
  # for keyboard tracking - "The reference note for Keytrack is C3, note number 60." (manual
  # p. 29) - which fixes a note name to a number and says nothing about what sounds.
  # **EIGHT, SHARED, AND THE MANUAL SAYS THE SHARING OUT LOUD.** "8 voice polyphony"
  # (specifications p. 1) with "4
  # timbral layers" (specifications p. 1), and "Keep in mind that all 4 layers share the maximum
  # of 8 voices." (manual p. 16). **That sentence is why this definition can carry a figure where
  # `oberheim/ob_x8` could not**: its parts take four voices each in split mode and neither half
  # can borrow, so a single figure would have been false there and is true here.
  polyphony: 8
  polyphony_shared: true
  # Three per layer, and two of the three are one voice: "Poly: The corresponding Layer uses all
  # available voices." (manual p. 17), "Mono: Only the last played note sounds."
  # (manual p. 17) and "Legato: Same as Mono, but
  # when you play legato, only the first note that was played triggers the envelopes." (manual
  # p. 17). **So this field's two numbers are three of the maker's modes** - legato and mono are
  # both monophonic and differ in what they retrigger, which no field here holds.
  voicing_modes: [1, 8]
  velocity:
    # Received, with its depth a per-sound setting rather than a global one: "You can also use
    # Select to define the Vel Amnt (Velocity Amount), so that the volume will be affected by
    # keyboard velocity." (manual p. 32), with "With a setting of 0, velocity will have no
    # effect on the volume." (manual p. 32). It is also a modulation source in its own right (manual p. 56).
    note_on: received
    # **AND SO IS RELEASE VELOCITY**, which few instruments here read: `Rel Velo` is "MIDI note
    # release velocity" (manual p. 56), one of the modulation sources.
    note_off: true
  # **BOTH KINDS ARE MODULATION SOURCES**, so this takes the stronger word as the three Rolands
  # before it did: `Ch Press` is "MIDI channel pressure" (manual p. 56) and `Poly AT` is "MIDI polyphonic
  # pressure" (manual p. 56), and the specification claims the second in one line,
  # "Poly-aftertouch capable" (specifications p. 1).
  # **Under MPE the pressure axis arrives as channel aftertouch and drives the polyphonic
  # source**, which is how MPE works and which the manual states: the Z axis "(sent as MIDI
  # Channel Aftertouch) – this controls the Poly Aftertouch (Poly AT) modulation assignments."
  # (manual p. 53).
  aftertouch: poly
  pitch_bend:
    # **SETTABLE PER OSCILLATOR, WHICH IS UNUSUAL, AND NO FACTORY DEPTH IS GIVEN.** "Determines
    # the intensity of the pitch bend (from 0 to 12 semitones) via MIDI pitch bend messages in
    # semitones for the corresponding oscillator." (manual p. 26) - so one oscillator can bend and
    # the other hold, and `semitones` would be a single figure for a thing this instrument has two
    # of. Unrecorded for that reason as well as for the absent default.
    # **AND UNDER MPE IT IS A DIFFERENT NUMBER ENTIRELY**: per-note bend uses "the standard MPE
    # range of +/-48 semitones" (manual p. 53), which is four times the largest value the setting
    # above offers, and the manual gives the way to turn it off - "To disable this per-note Pitch
    # bend effect, set the Pitch Bend parameter in Glide screen to 0." (manual p. 52).
    programmable: true

groups:
  modulation: Modulation sources with a fixed number

controls:

  # **FIVE NUMBERS CARRIED AND TEN MORE RECORDED BELOW, AND NOT ONE OF THEM NAMES A
  # PARAMETER.** Every control below is a
  # modulation *source*: a number arrives, and what it reaches is whatever the sound's eight-slot
  # modulation matrix routes it to. The maker publishes the slot rather than the destination,
  # which is `elektron/tonverk`'s case at rank 88 - its data entry knobs are marked `(machine
  # dependent)` and carried under the generic name the appendix prints, because that is the only
  # name there is. **There is nothing here to decline.**
  # The labels are the maker's own words from the Source column, so a reader of this list is
  # reading what the modulation matrix will show them.

  # Named sources ─────────────────────────────────────────
  mod_wheel:        {label: Mod Wheel, cc: 1, group: modulation}
  # **THE MAKER MISPRINTS THIS ONE'S NUMBER AND IT IS STILL LEGIBLE**: the row reads `Breath MIDI
  # breath control (cCC #2)` (manual p. 56), with a leading lower-case `c` on `CC` that none of
  # the other four rows has. Carried as 2, which is what the digits say and what breath control
  # is; the typo is recorded rather than tidied away.
  breath:           {label: Breath, cc: 2, group: modulation}
  expression:       {label: Expression, cc: 11, group: modulation}
  pedal:            {label: Pedal, cc: 64, group: modulation}
  # The one of the five that is not on p. 56: it is named where MPE is explained, as the
  # message the Y axis arrives on, and its destination is set by the `MPE Y` source.
  mpe_y:            {label: MPE Y, cc: 74, group: modulation}

  # **AND TEN MORE NUMBERS ARE NOT BELOW, BECAUSE THE MAKER PRINTED A RANGE AND NOT A LIST.**
  # The source table carries one further row - `CC22...CC31 MIDI CC22 to CC31` (manual p. 56) -
  # one row, one description, and ten numbers a player can route to anything the modulation
  # matrix reaches. **Only 22 and 31 are printed.**
  # Expanding it was the first thing tried and `tools/check_citations.py` refused it, rightly:
  # it looks for every number a definition claims in the documents that definition cites, and
  # found 24, 28 and 30 on no page. **The manual publishes two ends and a rule, not ten numbers**,
  # which is `elektron/tonverk`'s gate at rank 88 - 329 of its generated numbers were refused the
  # same way - and rank 86's allowance for a printed run does not stretch to this one, where the
  # interior is eight numbers long rather than one.
  # **So the fact is here and not in the list, because no field holds a range of controller
  # numbers.** `nrpn_range` is the nearest thing the format has and it means a range of values
  # rather than of addresses, so it is not it. A consumer that wants one of the eight has the
  # maker's own sentence above and this definition's word that nothing else was found.
