# The fifth Arturia here, and the first whose chart is set as a grid of small tables three
# across rather than as one list. That is why the numbers below were read out of the rules the
# page draws rather than out of its text: the column positions move from one block of rows to
# the next, so a reading that cuts every line at one set of offsets slices some rows through the
# middle of a word while looking perfectly orderly.
#
# THE POLYBRUTE 12 IS NOT THIS INSTRUMENT. It is a separate product with a manual of its own
# which, per the instrument survey, adds MPE and FullTouch - so their maps differ and this file
# must never be read as describing it. The PolyBrute Noir is a finish and is covered.

definition: 1

model:
  manufacturer: Arturia
  name: PolyBrute
  # NOT RECORDED, AND THE MANUAL IS DEMONSTRABLY BEHIND THE INSTRUMENT. This manual never says
  # which firmware it describes - it mentions firmware four times and every one is about how to
  # see or install it, never which version this edition covers. What is known: Arturia's
  # resources page serves this manual as "3.0.1", dated 19 October 2023, and the firmware beside
  # it as **3.1.1.1875**, dated 20 June 2024. So the newest firmware is a minor version ahead of
  # the manual's own number and eight months newer, and whether anything below changed with it
  # is not established. Arturia's firmware article, which would answer that, refuses an ordinary
  # HTTP client: see the source account.
  # ARTURIA SERVES DIFFERENT EDITIONS UNDER ONE HEADING, which is worth knowing before trusting
  # a translation as a second reading: on the same page the same day, the English manual is
  # 3.0.1 and the French, Spanish, German and Japanese are all **3.0.0**, dated across ten days.

source: >-
  User manual (127pp), English edition 3.0.1: the rear panel at p. 8, the voice and timbrality
  modes at pp. 38-39, aftertouch at pp. 42 and 100, the preset count at p. 12, the sync settings
  at pp. 104-105, the MIDI settings at pp. 109-110, the specifications at p. 114, and **the
  chart of controller numbers at 13.1, pp. 115-116**, which is where every number here comes
  from.

  THE PRINTED PAGE IS SEVEN BEHIND THE PAGE OF THE FILE, so `page_offset: 7`, and the chart is
  on the 122nd and 123rd pages of a 127-page document.

  THE CHART IS A GRID OF EIGHTEEN SMALL TABLES, THREE ACROSS, and that is the whole of what is
  difficult about reading it. Each table is a *Parameter* column beside a *MIDI CC* one with a
  heading over it, and three sit side by side across the page. A text reading looks deceptively
  safe - pypdf's layout mode keeps the three abreast and does not interleave them, which is more
  than the Dreadbox Typhon's chart managed - and **the column positions move from one block of
  rows to the next**: one row has its second table's parameter column at character 55 and
  another four rows later has it at 51, with the numbers shifting the other way. So the numbers
  here were read out of the grid the page draws. Arturia rules every row across the full width -
  34 horizontal rules on the first page, each spanning the same two x positions - while the
  verticals are drawn per block, which is the same fact that defeats a fixed cut and is what
  makes the grid usable: the horizontals give the rows and the verticals overlapping a row give
  that row's own columns.

  AND THE SHARPEST FORM OF THAT TRAP IS THREE ROWS WITH ONLY TWO CELLS IN THEM. Where a
  left-hand table runs out of rows before its neighbours, the row that follows carries only the
  tables still going - `Morphée Y 115`, `Morphée Z 89` and `Rate 73` are each alone on their
  line, set where the second or third table sits. **A reader that splits a line on runs of
  whitespace files all three under the leftmost table**, which would put two of the Morphée's
  axes in VCO 1 and the third LFO's rate in LFO 1. Both readings here place a cell by where it
  is rather than by how many precede it, and both get those three right.

  EVERY NUMBER WAS READ TWICE AND THE TWO AGREE ON ALL 74 ROWS. The second reading, made without
  sight of the first, derived each block's column offsets from that block's own heading row and
  then checked the result against both pages rendered and read by eye. It measured the drift the
  paragraph above describes: the second table's parameter column begins at character 55, 54, 51,
  52 and 52 in the five blocks of the first page and at 56 on the second, and the third table's
  at 93, 96, 95, 91, 91 and 97.

  READING ACROSS ALSO MEANS THE RESULT HAS TO BE GATHERED BEFORE IT IS WRITTEN DOWN. The grid's
  natural order is row one of all three tables, then row two of all three, so the controls below
  are regrouped by table - each keeping the order its own rows were read in - rather than
  shipped in the order they came off the page.

  EVERY NUMBER IS DISTINCT, which is worth asserting for an instrument with no parts dividing
  its sound engine: 74 controls and 74 controller numbers, so nothing here needs a part to say
  what a number means. **Fourteen parameter names are not distinct** - `Rate` names four
  different things, `Attack`, `Decay`, `Sustain` and `Release` three apiece, and `Cutoff`,
  `Resonance`, `Level`, `Tune`, `Pulse Width`, `Saw / Tri Mix`, `Saw / Square Mix`, `Velo` and
  `VCF Env Amt` two - so every one of those carries its table in its key.

  THE GAPS IN THE NUMBERING ARE MOSTLY MIDI'S OWN. The chart uses 74 of the 118 numbers between
  1 and 118, and the 44 it does not use are led by **an unbroken absence from 32 to 64** - which
  is two facts and not one. 32 to 63 is the block the MIDI specification reserves for the fine
  halves of controllers 0 to 31, so an instrument sending seven-bit values has no use for it;
  64 is the damper pedal, and this instrument takes a sustain pedal on a jack of its own rather
  than on a controller. The rest are 6 (data entry), 20, 74, 84, 88 and 96 to 101, which are
  data increment and decrement and the NRPN and RPN selects. **The manual accounts for none of
  them**, and none is inferred here; they are set out because a block of numbers that is not
  contiguous is worth asking about rather than passing over.

  CONTROL CHANGE TRAVELS BOTH WAYS AND IT IS A SETTING: "ON enables the PolyBrute to send and
  receive MIDI Continuous Controller (CC) messages when almost any knob is turned, via either
  USB MIDI or the 5-pin MIDI port. OFF disables this capability" (p. 110). So every control
  below is `both`, which is this format's default and is why none of them says so.

  THE CHART NAMES THE TWO FILTERS ONE WAY IN ITS HEADINGS AND ANOTHER WAY IN ITS ROWS, and the
  chart alone cannot reconcile them. Two tables are headed `LADDER FILTER` and `STEINER FILTER`,
  while the `FILTER FM` table beside them routes to `VCF 1` and `VCF 2` - so from pp. 115-116
  there is no way to tell which filter CC 79 and CC 80 reach. **The rest of the manual settles
  it three times over**: "VCF 1 (Steiner)" and "VCF 2 (Ladder)" in the panel diagram (p. 1),
  "VCF 1 is an enhanced version of the Steiner filter that featured prominently in the Brute
  series synthesizers" (p. 31), and "VCF 2 is similar in design to the most well-known ladder
  filter on this planet" (p. 32). So CC 79 routes oscillator 2 into the **Steiner** and CC 80
  routes the noise into the **Ladder**, and the group labels below keep the chart's own words
  while this sentence carries the mapping.

  SEVERAL OF THESE NUMBERS MEAN SOMETHING ELSE IN THE MIDI SPECIFICATION, AND THE MANUAL NEVER
  SAYS SO. CC 7 is Channel Volume and here it is the Steiner filter's Level; CC 8 is Balance and
  here it is the Ladder's Level; CC 2 is Breath Controller and here it is Reverb Level; CC 4 is
  Foot Controller and here it is Expression 2. **So a sequencer sending a routine volume message
  will move a filter level on this instrument.** Four others do follow convention - CC 1 is the
  mod wheel, CC 5 is Glide where the specification has portamento time, CC 10 is Stereo where it
  has pan, CC 11 is Expression 1 - which makes the four above look like choices rather than
  oversights. Recorded because a player meets it as a fault and a panel can warn about it.

  THE SURVEY SAID THIS MANUAL DOES NOT NAME THE REAR CONNECTORS AND IT NAMES THEM TWICE. The
  rear-panel section gives "MIDI In/Out/Thru - Standard 5-pin DIN jacks, used to connect
  PolyBrute to other MIDI devices" (p. 8) and the specifications repeat "MIDI In/Out/Thru
  connectors" (p. 114), with a USB type B port beside them in both places. **The two agree**,
  which is not something to take for granted - the Behringer TD-3's manual contradicts itself
  about its own socket.

  THE EDITOR PUBLISHES NO NUMBERS. PolyBrute Connect's own 77-page manual was fetched and
  searched because the survey raised it as a possible second source: it mentions the controller
  surface exactly once, as the setting above, and carries no chart, no controller number and no
  system exclusive. It is cited for that, and for nothing else.

  NOT RECORDED: transport, and the reason is the vocabulary rather than the manual. Sending is a
  setting - "Use [Assign 1-2] to turn MIDI Transport Message transmission on (default) or off"
  (p. 105) - and **receiving is nowhere stated**: the Sync menu has no transport-receive switch
  because Sync>Source is the one receive control it has, and the manual describes only its Auto
  option. `sends` would deny reception, which nothing here establishes, so the field is left
  unset and the fact is in this sentence.

  ALSO NOT RECORDED: system exclusive, which neither manual mentions; NRPN, likewise; and the
  note range, which no page states - the keyboard is five octaves with buttons that "shift
  keyboard range +/- 2 octaves from center" (p. 114), which is a fact about the keyboard and not
  about what the instrument answers to.

  AND NOT RECORDED, MPE: this manual says nothing about it anywhere in 127 pages, which is
  consistent with the survey's account that the PolyBrute 12 is the sibling that adds it. The
  silence is reported rather than read as a denial.

