    # is superseded, which the account above sets out.
    # It also names the layer modes in the maker's summary - "Stacked, round robin and MIDI-split
    # layer-modes." (specifications p. 1) - **where the manual calls the first of those
    # `Layered`** (manual
    # p. 18). One instrument, two names for one mode, in two documents by one maker.
