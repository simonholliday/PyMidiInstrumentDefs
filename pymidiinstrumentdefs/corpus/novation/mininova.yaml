  chart:
    kind: midi_implementation
    title: MiniNova CC & NRPN Chart
    edition: "0002"
    landing: "https://downloads.novationmusic.com/novation/synthesisers/mininova"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/novation/downloads/10787/mininova-cc-nprn-chart.pdf"
    sha256: da7a3a772d835214aef6c490d83e0b6abf523969d4a08c8d6c51f540947c2c26
    retrieved: 2026-10-04
    page_offset: 0
    # **EVERY NUMBER IN THIS FILE COMES FROM THIS DOCUMENT.** Nine sheets with no printed page
    # numbers other than its own "1 of 9" foot, which matches the sheets. Its own version is given
    # twice and differently: "Version 0002" (chart p. 1) on the seven sheets of the map and
    # "Version 0001" (chart p. 8) on the two of tables behind it, which is one document carrying two numbers rather than two
    # documents. Built 2014-06-03 by its own metadata.
  midi_impl:
    kind: midi_implementation
    title: MiniNova MIDI Implementation Guide
    edition: "0001"
    dated: "2014-02-10"
    landing: "https://downloads.novationmusic.com/novation/synthesisers/mininova"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/novation/downloads/10787/mininova-midi-implementation.pdf"
    sha256: 879fd77cba36635560493ca9a905a20d9143bbd522d9152c5e47c4969b1d02a5
    retrieved: 2026-10-04
    page_offset: 0
    # One sheet, and **everything in `midi:` below comes from it**. It gives its own date and
    # version in its heading - "Date: 10/02/2014" (midi_impl) and "Version: 0001" (midi_impl) -
    # and names the instrument "Model: Novation MiniNova" (midi_impl). It is the document whose name promises controller numbers and
    # which has none: against Control Change it says to look at the other one.
  manual:
    kind: manual
    title: MiniNova User Guide
    edition: "1.01"
    landing: "https://downloads.novationmusic.com/novation/synthesisers/mininova"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/downloads/MiniNova%20User%20Manual%201.01%20English%20-%20EN.pdf"
    sha256: bca2fa0b9f5db8adfec44d588090a4751cd5543100a76910f9822a1f3495b8ac
    retrieved: 2026-10-04
    page_offset: 0
    # 39 pages, printed numbers matching the sheets exactly. Cited for the voices, the patches,
    # the keyboard and the pitch wheel. **It never uses the word NRPN**, and it carries no
    # controller number at all, so it settles nothing about the map - which is why the chart is
    # the document this file rests on. The downloads page calls it "MiniNova User Guide v1.01
    # English - EN" (downloads) and the file is named MiniNova User Manual 1.01; it is one document.
  downloads:
    kind: download_page
    title: "MiniNova | Novation Downloads"
    landing: "https://downloads.novationmusic.com/novation/synthesisers/mininova"
    url: "https://downloads.novationmusic.com/novation/synthesisers/mininova"
    sha256: 26ce90ce3b6033f5dcbb7020a2f39639a8b8b6816ec31f49dab0ec3791daf136
    retrieved: 2026-10-04
    paginated: false
    # Cited for what Novation publishes and what it does not. It serves the user guide in
    # twenty-four languages, the two MIDI documents, a MiniNova Editor user guide and four USB
    # drivers - and **no firmware and no release notes of any kind**, which is why no firmware is
    # recorded above.
    #
    # The sha256 is of the page's visible text; the page as served hashes to
    # a6f25c733c2bd0c67dc04845aa80a1084272f3b672a73deaff43e326b5bbe2ff.

midi:
  # Its Basic Channel row gives "1 - 16" in both columns, for the default and for a changed one
  # alike, remarked "Global Setting (MIDI Channel)" (midi_impl). The guide says which it leaves the factory on: a master
  # keyboard should be "set to MIDI channel 1 (the MiniNova's default channel)" (p. 6).
  channels: [1, 16]
  # NOT RECORDED, because the chart gives two and does not choose. Its Mode row reads "Mode 3,4"
  # in both columns, remarked "Patch Dependent" (midi_impl) - so omni is off either way and
  # whether it is poly or mono is a property of the patch rather than of the instrument.
  clock: receives
  # System Real Time: Commands is X in both columns (midi_impl), and so are Song Position, Song
  # Select and Tune Request. So nothing starts or stops it over MIDI.
  transport: none
  program_change:
    # O in both columns, remarked "Use Bank Select LSB (CC32) for Banks 1=A, 2=B, 3=C"
    # (midi_impl).
    receives: true
    sends: true
    # WHAT THE INSTRUMENT HOLDS, which is the settled way of counting: "The Patches are arranged
    # as 3 banks (A to C), each with 128 patches (000 to 127)" (p. 7), and the guide does the
    # multiplication itself where it describes dumping them all - "all 384 Patches (128 x 3
    # banks)" (p. 34). One program change reaches 128 of them and the bank select reaches the
    # other two hundred and fifty-six.
    presets: 384
  # O in both columns, remarked "For Patch Dumps" (midi_impl). The guide describes three of them:
  # the current patch, all 384, and the global settings (p. 34).
  sysex: true
  # 452 of the 557 controls below are reachable only this way, and the chart is headed "Extended
  # CC & NRPN Map" (chart p. 1). **`supported` rather than `preferred` because neither document ranks them**:
  # nothing says to prefer an NRPN where a controller number exists, and in fact no parameter here
  # has both, so the question never arises for any one control.
  nrpn: supported

voice:
  # "Full polyphony, with up to 18 voices" (p. 4), and the guide says the same again where it
  # warns about running out: "there are a maximum of 18 voices internally" (p. 20).
  polyphony: 18
  # "Note Number 0 - 127" (midi_impl) received and transmitted, "True Voice 0 - 127" (midi_impl). The keyboard
  # itself is smaller and transposable - "37-note (3 octaves) keyboard with velocity sensing"
  # (p. 5), with OCTAVE buttons that "transpose the keyboard up or down one octave each time they
  # are pressed" (p. 5) - but what the instrument will sound is the chart's figure.
  note_range: [0, 127]
  velocity:
    # "Velocity Note On 0-127" (midi_impl) in both columns.
    note_on: received
    # "Note Off X" transmitted and "0-127" received (midi_impl), so it arrives and is never sent.
    note_off: true
  # "Aftertouch Key's X" (midi_impl) in both columns, and its Channel row is X transmitted and O
  # received.
  # The guide says the same from the player's side and says why: "the MiniNova keyboard does not
  # send Aftertouch data, but the synth engine will correctly respond to any Aftertouch data
  # received via MIDI (via DIN or USB)" (p. 36).
  aftertouch: channel
  pitch_bend:
    # "Pitch Bend" (midi_impl) is O in both columns, and the wheel's reach is a setting rather than a
    # fact: "The range of operation can be set via the menu system, from a semitone to an octave,
    # in semitone steps" (p. 8). So there is no one number to record, which is what `programmable`
    # says. Each oscillator also has a pitch bend amount of its own among the controls below.
    programmable: true

groups:
