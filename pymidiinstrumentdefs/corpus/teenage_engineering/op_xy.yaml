# BEFORE CHANGING A NUMBER IN THIS FILE, READ THIS.
# teenage engineering publishes this instrument's guide TWICE - as a 135-page printable PDF
# and as a website of 25 sections - both of them labelled v.1.1.15, and the two do not say
# the same thing. Their MIDI CC reference tables differ in one controller number and one
# parameter name, and the website's section 10 carries two facts the printable guide does
# not contain at all. Both editions are cited below, each for what it states, and every
# place they disagree is written down rather than resolved. Neither is treated as the
# corrected version of the other, because nothing here establishes which came first.
#
# THE ROW THEY DISAGREE ON IS THE BIGGEST ROW IN THE TABLE, and that is why this file has
# no control for it. The printable guide gives the track's parameters as CC `12-47`, a
# range of 36 numbers; the website gives the same row as CC `46`, one number, which falls
# inside the other's range. The format holds one `cc` per control and there is no honest
# value to put in it, so the eleven rows the two editions agree on are below and the
# twelfth is recorded here and nowhere else. It is not resolvable by trying it: this
# instrument is not one the bundled definitions were measured against.
#
# WHAT EACH OF THE 36 NUMBERS ADDRESSES IS NOT PUBLISHED ANYWHERE. The guide names the row
# "track parameters" and stops. There is no second table, in either edition: section 23 is
# the only table of controller numbers in all 135 pages.

definition: 1

model:
  # The maker writes its own name in lower case throughout, as Korg does with the minilogue
  # xd and as this maker's own OP-1 does.
  manufacturer: teenage engineering
  # SPELLED WITH A HYPHEN, WHICH IS NOT HOW THE MAKER SPELLS IT. Counted across the eight
  # documents cited below, "OP-XY" with an en dash appears 174 times and with a hyphen
  # twice - the reverse of the OP-1, where the hyphen won 89 to 1. The hyphen is kept here
  # anyway, deliberately: it is the spelling a reader types and the one this definition's
  # own name, `op_xy`, already uses. The maker's spelling is recorded in this comment so
  # that nothing is lost by the choice.
  name: OP-XY
  # THE GUIDE IS NUMBERED TO A FIRMWARE VERSION, which is this maker's practice here and
  # not at the OP-1, whose releases are numbered `#246` with a hash and no dots. The
  # printable guide's cover says 1.1.15; the OS updates page lists firmware 1.1.15 dated
  # 2026.07.01; and the guide file's own last-modified header is 2026-07-01. Three
  # independent agreements, so this is the firmware the guide describes.
  # IT IS NOT THE CURRENT FIRMWARE. The maker publishes 1.1.33, eighteen releases later,
  # and no guide covers it. Every release note between the two was read for anything that
  # changes what is below, and none does - the nearest are "don't apply sustain pedal to
  # arpeggio notes" (1.1.17) and "use normal note off with release when stopping hold
  # player" (1.1.25), neither of which touches the control map.
  firmware: "1.1.15"

source: >-
  The full guide v.1.1.15, in both the editions the maker publishes: the printable PDF of 135
  pages, cited by page, and the website of 25 sections, cited by the section number each page
  prints for itself. The release notes and the product page carry facts neither guide edition
  does.

  EVERY CONTROLLER NUMBER BELOW COMES FROM ONE PAGE, section 23 on printed page 122, which
  introduces itself as the whole of the published map: "sometimes you want to control OP-XY
  with an external controller. OP-XY has almost all of its controls pre-mapped as midi CCs"
  (p. 122). It is the only table of controller numbers in all 135 pages, and the website's
  edition of that same section is the only other place any of them is printed.

  THE TWO EDITIONS OF ONE GUIDE DISAGREE IN FOUR PLACES, and only the first changes a number.
  Section 23's fourth row reads "track parameters" at CC "12-47" in the printable guide and at
  CC "46" on the website, so no control for it is written. Its seventh row is "delay scene" in
  the printable guide and "scene (delayed switch)" on the website, both at CC 82; the release
  notes settle what it does - "add midi command for setting delayed scene" (os_updates, 1.1.0)
  - so the printable guide's shorter name is used below and the other is recorded here. The
  printable guide's specifications say "midi over bluetooth le" where the website says
  "bluetooth LE midi", and its section 1 says "midi over bluetooth ble", contradicting itself.
  And the website's section 10 states the voice pool and the per-track channel outright where
  the printable guide states neither anywhere in its 135 pages.

  THE PRINTABLE GUIDE NUMBERS ITS PAGES IN TWO RUNS, which anybody adding a citation needs to
  know. What to add to a printed page number to reach the page of the file is 4 up to printed
  page 52 and 5 from printed page 53 on, because file page 57 is an unnumbered overflow of
  section 14.6. This source records the second offset and CITES NOTHING BELOW PRINTED PAGE 53;
  the facts that live only in the earlier run are cited from the website sections and the
  product page instead, which have no pages at all. The guide's own index is no help: it is
  right through section 14 and then falls behind the pages themselves by one, two, three and
  finally five, putting section 23 on page 117 where that page prints 122.

  THE PRINTABLE GUIDE ALSO CARRIES AN INVISIBLE SECOND TEXT LAYER, added by the maker's PDF
  tooling, which extracts alongside the real text and misreads it - "Ito" for "lfo", "ep1ano"
  for "epiano", "84" for "8.4". Everything read from that document was taken from the visible
  layer alone and read again from the rendered page as an image, by two readers working
  separately and by different methods, who agreed on all twelve rows of the table and on every
  dash in it.

  SIXTEEN TRACKS, EACH ON A CHANNEL THE PLAYER SETS: "the midi settings page in project
  settings allows you to set the midi channel on each of the 16 tracks" (project), which the
  product page states as "midi channels selectable per track" and the table's own channel
  column shows as 1-16. Eight of the sixteen are instrument tracks and eight are auxiliary -
  "8 individually sequenceable instrument tracks" (product_page) - and the four track controls
  below reach any of them, so they are one part rather than two.

  THREE WAYS IN, which is why no transport is called the MIDI one: "3.5 mm midi in", "usb
  type-c audio/midi host & device" and "bluetooth LE midi" (hardware_overview). The multi-out
  jack is the way out, and only when set to it - "you can choose between: midi cv/gate sync8
  sync16 sync24 audio" (p. 87). A DIN synthesiser needs "a type a trs to midi cable" (p. 111),
  which is the only statement of the wiring anywhere.

  NOT RECORDED, each for its own reason.

  SYSTEM EXCLUSIVE and NRPN: neither word appears on
  any of the 135 pages or on any section page, searched for as "sysex", "system exclusive",
  "exclusive", "NRPN" and "RPN". The only mention in any document here is a release note,
  "avoid crash on certain sysex messages" (os_updates, 1.0.29), which says the messages arrive
  and are parsed, not that any of them is implemented - and that is the difference from the
  OP-1, whose release notes describe an identity reply that actually answers.

  THE NOTE RANGE:
  never stated. The built-in keyboard is "a two octave keyboard" with octave buttons, which is
  the panel and not what arrives.

  RECEIVING A PROGRAM CHANGE: the words never appear; what is
  described is this instrument sending one.

  AFTERTOUCH: received and routable, quoted against
  voice below, but the guide never says whether it is channel or polyphonic, and there is no
  third value to write.

  THE BEND RANGE IN SEMITONES: settable, but no range and no default is
  printed.

  THE PRESET COUNT: there are preset folders and "thousands of projects", and no
  count addressable by program change.

  WHERE THE SEARCH DOES NOT REACH, said plainly. It covers both editions of the guide, the OS
  updates page and the product page. It does not cover the maker's support site, which this
  maker's OP-1 established answers 403 to anything fetched here, so if a MIDI note is published
  there it has not been read.

