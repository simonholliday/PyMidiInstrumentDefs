    # The visible text of the page, which is the copy cited. It is where the maker states the
    # instrument monophonic in the same breath as its sixteen-voice chaining, and where the
    # list of downloads was read from. The feature lines quoted in the source account are in
    # the page's script payload rather than its visible text, and are described rather than
    # quoted for that reason.

midi:
  # NOT RECORDED, the channel range: no document cited here prints one. See the source account,
  # which also says where the maker does claim a channel setting and why that is not citable.
  # CLOCK AND TRANSPORT ARE RECEIVED AND NOTHING SAYS THEY ARE SENT. The table gives F8 Timing
  # Clock, FA Start, FB Continue and FC Stop (p. 94), and the clock source is a front-panel
  # setting with four states: "Selector switches 1, 2, 3, or 4 represent clock source INT, MIDI,
  # USB, or TRIG respectively" (pp. 38-39), with the caution that it "must always be INT (internal) if you
  # are not using an external clock" (pp. 38-39). So MIDI and USB are each a clock this
  # instrument follows. Nothing published says it sends either, the specifications give the DIN
  # socket as In and Thru only, and the one sentence that says the USB port sends does not say
  # what - so `both` would be a guess and `receives` is what the documents support.
  clock: receives
  transport: receives
  program_change:
    # The table's channel messages are 8n, 9n, Bn and En. `Cn` is not among them, and the table
    # is this instrument's whole published implementation: see the source account.
    receives: false
  # A CHECKED ABSENCE, not an unread page. The only Bn row the table gives is `Bn 7B`, All Notes
  # Off, which is a channel mode message of the MIDI specification rather than a controller this
  # maker publishes - the same ruling that keeps CC 120, 122 and 123 out of every other
  # definition here. Eleven knobs and twenty-eight switches, and not one of them is addressable.
  # The TD-3-MO, which is a different instrument, answers to one: see the source account.
  control_change: none
  # NOT RECORDED, system exclusive. The guide never uses the word, so there is no byte layout
  # and no statement to cite - and `false` would be the wrong answer rather than a cautious one,
  # because the maker's own application configures this instrument over USB and the Model D's
  # manual, from the same maker, publishes a System Exclusive command table that does exactly
  # that job. What the Synthtribe application sends is undocumented, not absent.

voice:
  addressing: pitches
  # "Number of voices Monophonic" (p. 103). Several units make one polyphonic instrument through
  # the Poly Chain, and the maker is careful about the distinction: "While it is a monophonic
  # instrument (one note at a time), TD-3-RD's 16-note Poly Chain function lets you combine
  # multiple synthesizers for up to 16-voice polyphony" (product_page). That is a fact about a
  # rig of TD-3s rather than about one, so it is not here.
  # THE GUIDE ITSELF NEVER RECONCILES THE TWO, which is worth saying because its own cover
  # advertises a "16-Voice Poly Chain" four lines above the title and its specifications say
  # Monophonic ninety pages later, with nothing in between to explain how both are true. The
  # product page is where the maker joins them up, and that is the only reason this field can be
  # filled in from a document rather than from knowing what a TB-303 is.
  polyphony: 1
  # The table's channel messages are 8n, 9n, Bn and En, so neither `An` nor `Dn` is among them
  # and no pressure message reaches this instrument: see the source account.
  aftertouch: none
