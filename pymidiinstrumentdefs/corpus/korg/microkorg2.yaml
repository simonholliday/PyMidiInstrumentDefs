# KORG PUBLISHES THIS INSTRUMENT'S MAP THREE TIMES, AND THE THREE TOGETHER ARE RIGHT WHERE
# NO ONE OF THEM IS. A plain-text MIDI implementation gives 71 panel controls and 108 NRPNs;
# the Owner's Manual's own MIDI Implementation Chart lists 79 controller numbers; and the
# manual's parameter pages name a controller number or an NRPN beside a parameter wherever
# one can be reached. The chart's 79 less the eight that are not panel parameters at all are
# the implementation's 71, number for number; the manual's pages name 70 controller numbers,
# 69 of those 71 plus the modulation wheel, and the two it never names are Timbre Level and
# Timbre Pan. Asserted rather than eyeballed, in
# `Notes/4463_cross_check_the_three_statements.py`.
#
# AND THE IMPLEMENTATION'S NRPN TABLE IS BROKEN IN EIGHT ROWS, WHICH THE MANUAL PUTS RIGHT.
# It prints every number twice, in hexadecimal and in decimal, which is a check it makes on
# itself: in two rows the two columns disagree, and in six more it gives six different
# parameters one and the same address. **All 108 are below anyway**, because the manual
# annotates `(NRPN 4, 32...37)` and `(NRPN 6, 1)` to `(NRPN 6, 3)` on its own pages, so this
# is a second document of the maker's settling what the first garbles rather than a guess
# between two columns. Each of the eight carries a comment saying what the implementation
# prints instead.
#
# IT IS NOT THE microKORG, WHICH IS ALSO HERE. `korg/microkorg` is the 2002 instrument, a
# different machine with a different map - and its numbers are the player's to assign, where
# this one's are fixed. The names are prefixes of each other in both directions, so nothing
# here was matched by substring: see the source account for the count that was taken instead.
#
# AND KORG SPELLS THE NAME TWO WAYS IN ITS OWN DOCUMENTS. The download page, the product page
# and the manual's running header all say "microKORG2"; the MIDI implementation's first line and
# the chart's Model field both say "microKORG 2", with a space. The maker's commonest spelling
# is the one used here, and the other is recorded rather than tidied away.
#
# THE MAP IS TWO SYSTEM VERSIONS BEHIND THE INSTRUMENT. Both primary documents describe the
# machine as it shipped; system 2.0 added a virtual patch source, two virtual patch destinations
# and a custom oscillator, and the implementation was never reissued. `model.firmware` says
# which system this file describes and the release-notes source says which is current - see the
# source account for the item-by-item check that established it.

definition: 1

model:
  manufacturer: Korg
  name: microKORG2
  # THE NEWEST SYSTEM THESE DOCUMENTS STILL DESCRIBE, not the newest system there is, which is
  # 2.0.2 of 2025.12.10. Established by taking each thing Korg's own release notes say version
  # 2.0 added and searching the implementation for it by name: Key Split, logueSDK, Low Mode,
  # Slice, Step Record, Level Scale and Pan Scale return nothing at all in 1,784 lines, the
  # virtual patch source list stops at 17 where Osc3 is now a source, and the destination list
  # stops at 75 where Vocoder Level Scale and Pan Scale have since been added. Nothing in the
  # 1.02 release notes touches MIDI, so these documents describe 1.02 as well as what came
  # before it, and nothing after.
  firmware: "1.02"

source: >-
  Four documents, all Korg's own, and the first two carry the map twice over.

  THE MIDI IMPLEMENTATION IS A PLAIN TEXT FILE WITH NO PAGES, cited by its own section
  numbers. It states "microKORG 2 MIDI Implementation             Revision 1.0
  (2024.05.10)" on its first line, which is the document's revision and not the
  instrument's - the trap the wavestate's chart set, and the TR-6S's. Korg's download page
  dates the same file 2024.11.27, seven months later, which is when it was last posted.

  ITS PANEL TABLE GIVES 71 CONTROL CHANGES, numbered 5 to 118, each with a parameter name
  and a value description. Both channel-message tables, the transmitted and the recognised,
  carry one row for the lot of them and say the same thing about it - "Control Data
  cc=5~118" - so this instrument sends every number it answers to. THAT IS THE DIFFERENCE
  FROM THE microKORG, whose implementation gives no controller number for any panel
  parameter because the numbers there are the player's to assign. Here they are fixed, and
  the manual says so in as many words: "On the microKORG2, control change numbers are
  assigned to the main parameters that alter the sound, and you can use an external MIDI
  sequencer to trigger the sound generator while controlling these parameters" (p. 84).

  AND THE MANUAL PRINTS THE SAME MAP TWICE MORE, which is this document set's own
  redundancy and was asserted rather than trusted. Its MIDI Implementation Chart, on printed
  page 133, lists 79 controller numbers in 22 rows; eight of them - 0, 1, 6, 32, 38, 64, 98
  and 99 - are bank select, the modulation wheel, data entry, the damper pedal and the NRPN
  pair rather than panel parameters, and the remaining 71 are the implementation's table
  exactly. Separately, the manual's own parameter pages name a number beside a parameter
  wherever there is one, in two schemes: **70 controller numbers**, which are 69 of the
  implementation's 71 plus controller 1 for the modulation wheel, and **77 NRPN addresses**.
  The only two of the panel table it never names are Timbre Level and Timbre Pan, which have
  no numbered entry of their own anywhere in 134 pages.

  THAT SECOND SCHEME IS EASY TO MISS AND IT IS THE ONE THAT MATTERS. The manual writes a run
  of parameters as one span - "(NRPN 4, 32...37)" (p. 71) for the six virtual patch
  destinations, "(NRPN 5, 16...31)" (p. 91) for the sixteen vocoder band levels - and names
  single addresses the same way, "(NRPN 6, 1)" and "(NRPN 6, 2)" and "(NRPN 6, 3)" (p. 92).
  **Six of the addresses it gives are addresses the implementation never prints at all**,
  and they are exactly the six needed to make the implementation's broken rows whole.

  THE CHART'S PAGE CANNOT BE READ AS TEXT. Its type was converted to outlines when the
  manual was made, so printed page 133 carries 2,362 vector drawings and 79 characters -
  the running header and the heading. It was read from a render of that page instead, which
  is the one reading here that nothing else checks, and it is declared as `pictured_pages`
  so that a checker finding no numbers on that page knows why.

  WHERE THE IMPLEMENTATION CONTRADICTS ITSELF, AND WHAT THE MANUAL PUTS RIGHT. Its NRPN
  table prints each number in hexadecimal and again in decimal, which is a check the
  document makes on itself and fails twice: Hardtune Speed is printed as "06 | 01 ( 2)" and
  Hardtune Formant as "06 | 02 ( 3)". Taken as hexadecimal, Speed lands on Hardtune
  Intensity's own address; taken as decimal, the three run 1, 2, 3. SEPARATELY, ALL SIX
  `Patch N Destination` ROWS CARRY THE SAME ADDRESS, "04 | 20 (32)", where the six Source 1
  rows run 04/00 to 04/05 and the six Source 2 rows run 04/10 to 04/15 - so five of the six
  cannot be right.

  THE MANUAL SETTLES BOTH, ON ITS OWN PAGES AND IN ITS OWN SCHEME: the hard tune page
  annotates Intensity, Speed and Formant "(NRPN 6, 1)", "(NRPN 6, 2)" and "(NRPN 6, 3)"
  (p. 92), and the virtual patch page annotates Destination "(NRPN 4, 32...37)" (p. 71).
  Both are coherent, both agree with the implementation wherever it is coherent, and
  together they account for every one of its 108 rows. **So all 108 are below**, the eight
  taken from the manual rather than from the implementation, each with a comment saying what
  the implementation prints instead. That is a second document of the maker's own correcting
  the first, not a choice between two columns with nothing to settle it.

  AND THE TWO DOCUMENTS DISAGREE ABOUT TWO THINGS, which is recorded rather than resolved.
  The implementation's recognised table lists "Local Control Off/On" on controller 122;
  the chart's Aux Messages row for Local On/Off says X in both columns. And the chart says
  All Notes Off is transmitted, while the only thing the implementation's transmitted table
  carries there is All Sound Off, controller 120, sent when a global setting changes. Both
  numbers are in the range this format refuses as controls in any case, so neither affects
  what is below.

  TWO TIMBRES, ON TWO CHANNELS THE PLAYER SETS SEPARATELY. "Sets the global MIDI channel.
  This MIDI channel is used to transmit and receive note messages, bend messages and
  control change messages for Timbre 1" (p. 84), and "Sets the MIDI channel that Timbre 2
  will send and receive MIDI messages on" (p. 84). The chart's own note says the same of the
  parameters: the channel for Timbre 2's timbre parameters is Timbre 2 Channel. So every
  control change below reaches whichever timbre's channel it arrives on, which is why none
  of them names a part. A THIRD CHANNEL ONLY TRANSMITS: "Sets the MIDI channel used for
  transmitting note messages corresponding to the pitch that's detected by the vocal
  processor" (p. 84), which can be any of the sixteen or Disable. It is not a part, because
  nothing can be sent to it.

  THE SYSTEM VERSION THESE DOCUMENTS DESCRIBE IS NOT THE CURRENT ONE, and the way that was
  established is worth keeping. Korg's system update page lists 1.02, 2.0.0, 2.0.1 and
  2.0.2. Every MIDI-visible thing version 2.0 added was searched for in the implementation
  by name and none of it is there: Key Split, logueSDK, Low Mode, Slice, Step Record, Level
  Scale and Pan Scale return nothing in 1,784 lines. Two published lists are demonstrably
  short because of it - the virtual patch source list ends at 17 and Osc3 is now a source,
  and the destination list ends at 75 while the version 2.0 supplement says "both Vocoder
  Level Scale and Vocoder Pan Scale are available as virtual patch destinations" (p. 6).
  The custom oscillator adds a wave this file's `osc1_wave` bands do not have, since
  version 2.0 says to "set WAVE to USER" (p. 7). SO THE RANGES ON THE PATCH SOURCES BELOW,
  AND THE WAVE BANDS, ARE RIGHT FOR SYSTEM 1.02 AND SHORT FOR 2.0.2. Korg has published no
  numbers for what 2.0 added.

  THE COLOUR VARIANTS ARE THIS INSTRUMENT, settled three ways rather than assumed. The
  product page describes the MBK and MWH as "two limited edition color models" differing in
  the control panel, side panel, dials and wheels; the manual's specification covers all
  three in one weight line, "MK-2: 2.2 kg/4.85 lb, MK-2 MBK/MWH: 2.1 kg/4.63 lb" (p. 131);
  and the system updater page says it "can be used for the following products as well" and
  names "microKORG2 MBK/MWH". One system, one manual, one map.

  AND IT IS NOT THE microKORG, THE microKORG S, THE XL, THE XL+ OR THE CRYSTAL. Those are
  different instruments with different maps, and `korg/microkorg` is already here. The older
  name is a prefix of every newer one, so a substring test would have matched this
  instrument's documents for the ancestor and the ancestor's for this one. Counted instead
  with a whole-name test that refuses the characters which would make it a longer name, the
  implementation mentions microKORG 2 three times and no other microKORG at all - so nothing
  in it had to be scoped away. WHAT A TEXT SEARCH CANNOT SEE is the chart on printed page
  133, whose Model field reads "microKORG 2" in outlines rather than in text; it was read
  from the render with the rest of that page.

  NO MIDI THRU. The specification lists "MIDI IN, OUT connectors" (p. 131) and a
  "USB Type-C port" (p. 131), and the rear panel names the same two. Routing chooses between:
  "USB+MIDI" or "USB" (p. 84) - so the USB port is never off, and there is no setting that
  leaves only the sockets live.

  FOUR THINGS ARE ABSENT FROM MIDI AND WERE CHECKED RATHER THAN ASSUMED. **The damper has no
  half position**: "The microKORG2 does not have a half-damper function" (p. 82), so
  controller 64 is a switch whatever a pedal sends. **The pitch bend range has no number at
  all** - it is a per-timbre program parameter on the PITCH page (p. 53) and neither the
  implementation's table nor the manual's annotations give it a controller or an NRPN.
  **Controller 50 is the one gap inside the OSC 3 run**, 48, 49, 51, 52, and what sits
  between Shape/Sample and Semitones on the maker's own OSC 3 page is "OSC Mod Type
  (ModType)" (p. 58), printed with no number where every parameter around it has one. **And
  there is no global dump**: the implementation's function code list offers current program
  and one program and nothing else, so the MIDI channels, the clock source, local control and
  the four MIDI filters cannot be read or written over system exclusive as documented.

  ONE MORE ASYMMETRY BETWEEN THE TWO DOCUMENTS, which is not a contradiction but will catch
  somebody out: **the manual never writes "bank select", anywhere in its 134 pages.** Bank
  select is documented only in the implementation, under its note *2, and in the chart's
  own Program Change remark. A reader working from the manual alone would conclude this
  instrument has 64 programs.

  TWO PAGES OF THE MANUAL PRINT NO NUMBER OF THEIR OWN - its first sheet and its last - so
  neither is cited here. Every other sheet prints its own sheet number, which is why the
  offset below is nothing.

