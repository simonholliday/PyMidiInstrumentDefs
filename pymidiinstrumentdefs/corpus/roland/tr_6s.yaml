midi:
  # Two settings, one range: "Pattern Ch 1-16" and "Kit Ch 1-16" (p. 14). The chart's Basic
  # Channel row gives a default of 10 both ways, remarked "Memorized", and a Changed range of
  # "1-16, OFF" - so either channel may also be switched off entirely.
  channels: [1, 16]
  # The chart's Mode row, default both ways. Its Messages row is "x" in both columns, so the
  # four mode messages cannot change it from outside.
  mode: 4
  # "System Real Time : Clock" is marked o in both columns, and "Sync Out" and "TempoSync" are
  # the settings behind each direction (p. 14).
  clock: both
  # Start and Stop are marked o in both columns. CONTINUE IS NOT: "x" transmitted against "o"
  # recognised, so this instrument answers to a Continue it will never send.
  transport: both
  program_change:
    # Marked o in both columns with "True Number 0-127", and the settings are separate: "Tx Prog
    # Chg OFF, ON" and "Rx Prog Chg OFF, ON" (p. 14). They arrive on the kit channel rather than
    # the pattern channel.
    receives: true
    sends: true
    # "Start Kit LAST, 001-128" (p. 13), and the data layout names "128 KITs" beside "128
    # patterns (16 x 8 banks)" (p. 8). The kit channel is "the MIDI transmit/receive channel for
    # program change messages that switch kits" (p. 14), so a program change reaches a kit.
    presets: 128
  # NOT RECORDED: sysex. The chart marks System Exclusive "x" in both columns and the Parameter
  # Guide gives a Device ID for it. See the source account.
  # NOT RECORDED: nrpn. No document mentions it, which is silence rather than a checked absence.

voice:
  # Notes address instruments rather than pitches, which is what a rhythm machine is.
  addressing: voices
  velocity:
    # The chart's Velocity row reads "o 9nH v=80" transmitted against a bare "o" recognised: a
    # machine that accepts any velocity and sends one fixed value. Note Off is "o 8nH v=00"
    # against "o". What it transmits is not a range and is not recorded as one - and the fixed
    # value is not recorded either, because the chart marks the status byte as hexadecimal,
    # "9nH", and gives the velocity no radix at all. 80 and 0x80 are both readings of it, and
    # 0x80 is not a velocity a note on may carry.
    note_on: received
  # Key's and Channel's aftertouch are both marked "x" in both columns, as is pitch bend.
  aftertouch: none
  # The chart's note table, first column. EVERY ONE IS A FACTORY DEFAULT: "These note numbers are
  # configurable on UTILITY:MIDI:Inst Note", and the Parameter Guide gives the range each may
  # take, "OFF (---), 0 (C -)-127 (G 9)" (p. 14). The second column, the alternate sounds, is in
  # the source account because this format has one map.
  voices:
    bd: 36
    sd: 38
    lt: 43
    hc: 39
    ch: 42
    oh: 46

groups:
  # Roland's own two-letter names, and there are no longer ones to be had: the chart heads these
  # six INST and neither other document expands one. The order is the order the chart lists the
  # controls, which is the order they appear below.
  # The first group is every control that belongs to no one instrument. The Parameter Guide files
  # the effects under KIT - "KIT: MASTER FX" and "KIT: DELAY" at pp. 2-3 - and the shuffle under
  # SYSTEM (p. 13), and the accent is a sequencer track of its own beside the six (p. 8).
  global: Kit and pattern
  bd: BD
  sd: SD
  lt: LT
  hc: HC
  ch: CH
  oh: OH

controls:

  # Kit and pattern ───────────────────────────────────────────
  beat:           {label: BEAT, cc: 2, direction: transmits, group: global}
  shuffle:        {label: SHUFFLE, cc: 9, group: global}
  master_fx:      {label: MASTER FX, cc: 15, group: global}
  delay_level:    {label: DELAY LEVEL, cc: 16, group: global}
  delay_time:     {label: DELAY TIME, cc: 17, group: global}
  delay_feedback: {label: DELAY FEEDBACK, cc: 18, group: global}
  master_fx_ctrl: {label: MASTER FX CTRL, cc: 19, group: global}
  fill_in_trig:   {label: FILL IN TRIG, cc: 70, direction: transmits, group: global}
  accent:         {label: ACCENT, cc: 71, group: global}
  reverb_level:   {label: REVERB LEVEL, cc: 91, group: global}

  # BD ────────────────────────────────────────────────────────
  bd_tune:        {label: BD TUNE, cc: 20, group: bd}
  bd_decay:       {label: BD DECAY, cc: 23, group: bd}
  bd_level:       {label: BD LEVEL, cc: 24, group: bd}
  bd_ctrl:        {label: BD CTRL, cc: 96, group: bd}

  # SD ────────────────────────────────────────────────────────
  sd_tune:        {label: SD TUNE, cc: 25, group: sd}
  sd_decay:       {label: SD DECAY, cc: 28, group: sd}
  sd_level:       {label: SD LEVEL, cc: 29, group: sd}
  sd_ctrl:        {label: SD CTRL, cc: 97, group: sd}

  # LT ────────────────────────────────────────────────────────
  lt_tune:        {label: LT TUNE, cc: 46, group: lt}
  lt_decay:       {label: LT DECAY, cc: 47, group: lt}
  lt_level:       {label: LT LEVEL, cc: 48, group: lt}
  lt_ctrl:        {label: LT CTRL, cc: 102, group: lt}

  # HC ────────────────────────────────────────────────────────
  hc_tune:        {label: HC TUNE, cc: 58, group: hc}
  hc_decay:       {label: HC DECAY, cc: 59, group: hc}
  hc_level:       {label: HC LEVEL, cc: 60, group: hc}
  hc_ctrl:        {label: HC CTRL, cc: 106, group: hc}

  # CH ────────────────────────────────────────────────────────
  ch_tune:        {label: CH TUNE, cc: 61, group: ch}
  ch_decay:       {label: CH DECAY, cc: 62, group: ch}
  ch_level:       {label: CH LEVEL, cc: 63, group: ch}
  ch_ctrl:        {label: CH CTRL, cc: 107, group: ch}

  # OH ────────────────────────────────────────────────────────
  oh_tune:        {label: OH TUNE, cc: 80, group: oh}
  oh_decay:       {label: OH DECAY, cc: 81, group: oh}
  oh_level:       {label: OH LEVEL, cc: 82, group: oh}
  oh_ctrl:        {label: OH CTRL, cc: 108, group: oh}
