# THIS MAKER ADDRESSES ONE INSTRUMENT TWO WAYS AT ONCE, AND EACH HAS A SHAPE OF ITS OWN HERE.
# 242 of the 246 controls below come out of an appendix of 74 controller numbers and 92
# parameter numbers:
#
#   **ACROSS**, by the kind of track. The CC table prints a column for each of four - audio, bus,
#   send FX, mix - and fills between one and four of them per row, so a number can name the same
#   parameter on every kind, or name one on some kinds and nothing on others, or **name two
#   different parameters on two kinds**. Which one a message reaches is the channel it arrives on.
#   **That one is expanded here**, one control per cell the appendix fills, which is the maker's
#   own unit and what the eleven other Elektrons in this corpus do - every one of their controls
#   carries a part.
#
#   **DOWN**, by the subtrack. The last table's MSB column reads `1-8` and the page says what that
#   means: "1–8 = values control parameters for the eight separate subtracks (1–8)." (manual
#   p. 123). So its 49 rows are 392 numbers - **and 343 of them are printed nowhere.**
#
# **THE SECOND IS A PART OF EIGHT AND NOT 392 CONTROLS.** Listing all of them was the first thing
# tried: 585 controls, every number distinct, nothing colliding. The citation checker refused
# it, and was right to - it looks for every number a definition claims in the documents that
# definition cites, and found 329 of them on no page. **The manual publishes a range and a
# rule, not 392 numbers**, and a definition that listed them would be asserting what nobody
# printed.
#
# So the 49 rows are carried once, on a `subtrack` part: eight to an audio track, on that track's
# channel (`within: audio`), the first at MSB 1 (`nrpn_msb: 1`). Each control gives the first
# subtrack's number, where the page's range opens, and **the other seven are the same LSBs with
# the MSB counted up**, which the part now says. **That rule is OS 1.4.1's.** The maker's notes
# for it list "MIDI NRPN control of parameters on subtracks 2–8 was mapped incorrectly."
# (release_notes) among its fixes, so on OS 1.4.0 at least, subtracks 2 to 8 did not answer as
# the table says; the notes do not say since when. Until 2026-10-11 no field held the rule: the
# 49 sat on the audio part under keys beginning `subtrack_1_`, with labels to match, and the rule
# was in words here.
#
# SIX NUMBERS NAME DIFFERENT PARAMETERS ON DIFFERENT KINDS OF TRACK, and they are the only ones
# that genuinely conflict rather than being present here and absent there. CC 16 to 18 and 20 to
# 22 are the first source machine's data entry knobs A, B, C, E, F and G on an audio track, and
# the external inputs' level, pan and routing on the mix track. A message sent to the wrong
# channel does something rather than nothing, which is why each is two controls here.
#
# **ONE ROW OF THAT TABLE IS MISPRINTED.** CC 16 to 23 are SRC 1's eight data entry knobs and CC
# 24 to 31 are SRC 2's - and the appendix prints CC 31 as `SRC 1 Data entry knob H (machine
# dependent)`, the same words as CC 23. Two distinct numbers cannot both be SRC 1's knob H, and
# the seven before it are SRC 2's A to G. **The label below ships as printed and only the key
# follows the sequence**, so the document's words are where a reader looks for them and the
# inference is in an identifier, which is not data.
#
# THE DATA ENTRY KNOBS ARE THE OPEN QUESTION OF THIS MAKER'S FORMAT, AND THE MAKER NAMES THEM
# GENERICALLY ITSELF.
# Seventy-two of the controls below, on forty controller numbers, are `SRC 1`, `SRC 2`, `FX 1`,
# `FX 2` or `FLTR` data entry knobs
# A to H, each marked `(machine dependent)` or `(SRC machine dependent)` by the appendix - so what
# a number does depends on which machine the track is running, and the appendix publishes the slot
# rather than the meanings. That is the standing answer to that question arrived at from the
# maker's side: there is nothing here to decline, because the generic name is the only name
# printed. What each machine puts on each knob is in Appendix A and is not carried.
#
# NOT RECORDED, AND WHY. **Aftertouch's kind**: it is received - "Opens a menu where you can
# assign up to four parameters to the MIDI aftertouch command." (manual p. 52) - and the manual
# never gives its kind, neither channel nor polyphonic, in 130 pages, so it is recorded as
# `received` and as sent, which a MIDI track does (manual p. 98), and no more. **Pitch bend**,
# likewise received, with a depth setting of its own - "Sets the amount of pitch bend data from
# external MIDI devices that affects Tonverk." (manual p. 51) - and no figure anywhere for how far
# it bends, so its fields would be invented. **Polyphony**: the play mode is per track, "Here, you
# can set whether a preset is polyphonic or monophonic" (manual p. 50), and the voice counts in
# the manual belong to source machines rather than to the instrument: four of the seven give
# one, and of the three that give none one sounds. And **system exclusive**, which is
# not mentioned in any spelling on any of the 130 pages - a silence rather than a checked absence.
#
# THE MANUAL SAYS WHICH OS IT DESCRIBES IN THE LAST LINE OF A COPYRIGHT NOTICE: "This manual for
# Tonverk OS version 1.4.1 was last updated September 23, 2026." (manual p. 13). Its cover reads
# `Tonverk / User Manual` and nothing else. **Until 2026-10-11 this file said no page carried a
# version**, on a search for `OS 1.4` that the page's `OS version 1.4.1` does not answer to. See
# `model`.

definition: 1

model:
  manufacturer: Elektron
  name: Tonverk
  # STATED BY THE MANUAL, in the last line of the copyright notice at the foot of an inside
  # page: "This manual for Tonverk OS version 1.4.1 was last updated September 23, 2026."
  # (manual p. 13). Its file's name agrees, `..._OS1.4.1_...`,
  # the downloads page lists it as "Tonverk User Manual - EN" (download_page) dated Sept 23, 2026,
  # and the same page's Updates section announces "Tonverk OS 1.4.1" (download_page) on that same
  # date. **Until 2026-10-11 this comment said the document did not state its OS.**
  # **The survey this instrument was picked from recorded OS 1.4.0** and the page now offers
  # 1.4.1, so a reader who comes back to this will find a third. Checked 2026-10-05.
  firmware: "1.4.1"

source: >-
  The Tonverk User Manual, 130 pages, created 2026-09-23 by its own metadata and offered as
  "Tonverk User Manual - EN" (download_page) on the day its maker announced "Tonverk OS 1.4.1"
  (download_page). Elektron publishes no separate MIDI implementation for this instrument and
  puts the tables in the manual's own Appendix D: "This appendix lists the CC and NRPN
  specification for Tonverk." (manual p. 120).

  EVERY NUMBER BELOW BUT FOUR COMES FROM THAT APPENDIX, which is pp. 120-124 and three tables.
  D.1 gives 74 controller numbers against four columns of track kind; D.2 gives 43 NRPNs for
  audio tracks, every MSB nought; D.3 gives 49 more whose MSB is the subtrack.
  `Notes/4606_extract_tonverk.py` reads all three off the grid the publisher drew, and
  `Notes/4606_write_controls.py` wrote the block below as it stood until 2026-10-11; the
  subtrack rows' keys, labels and part were changed by
  hand that day. **The appendix's one word on how the audio column bears on a track running the
  Subtracks machine is a footnote** to its `Audio tracks*` heading, "* = Several of the Subtracks
  SRC machines' parameters are controlled using NPRN values." (manual p. 120), in its spelling.
  It does not say which of the audio column's numbers still act on such a track.

  **AND ONE FIGURE OUTSIDE THESE DOCUMENTS AGREES WITH THE READING IN A WAY WORTH RECORDING.**
  midi.guide lists this instrument at 435 NRPNs, which is exactly 49 times eight plus the 43 of
  D.2 - so whoever compiled that entry expanded the subtracks the same way, and read the same 49
  and 43 rows. It is not a source and nothing here rests on it; it is a third party arriving at
  this appendix's own arithmetic independently, which is the only corroboration available for a
  maker who publishes one document.

  **THE GRID COST THREE ROWS BEFORE IT WAS READ PROPERLY, AND THE WAY IT DID IS WORTH CARRYING.**
  This publisher draws a table's header and its body as two blocks whose column edges differ in
  the first decimal, and **the body's rules stop one short of the table's bottom rule, which
  belongs to the header's block.** So reading the blocks apart loses the last row of every page -
  here controller numbers 51, 103 and 110, each the last on its page, each silently absent. They
  are recovered by matching edges within two points and taking the union of the rules. Page 122
  also carries the end of one table and the start of another, five columns and three, so a page
  cannot be read with one set of column edges either.

  SIXTEEN TRACKS IN FOUR KINDS, WHICH IS WHERE THE PARTS COME FROM. "The Tonverk sequencer has 16
  tracks. 8 Audio/MIDI tracks, 4 Bus and MIDI tracks, 3 Send FX tracks, and one Mix track."
  (manual p. 20). Each has a channel of its own: "TRACK/BUS/SEND/MIX CHANNEL selects the dedicated
  MIDI channel that is used to receive or send" (manual p. 76) parameter data for it, and set to
  OFF a track neither receives nor sends. The manual also says they are the tracks' own numbers,
  "The MIDI channels dedicated to each of the tracks are the same as the track's number."
  (manual p. 36). Choosing freely is new in 1.4.0, "It is now possible to freely select a MIDI
  channel for each track." (release_notes), so p. 36 reads as where a track sits until it is
  moved. No page calls that a default. **There is a seventeenth channel besides** - "AUTO
  CHANNEL selects the MIDI channel that will give access to the currently active track." (manual
  p. 77) - and the manual notes that the track sharing that channel then listens to nothing, which
  no field here can say.

  TWO PAGES SAY WHERE A NOTE GOES, AND THEY DO NOT SAY THE SAME THING. "The 128 notes in the
  standard MIDI range (0-127) all trigger the preset of the active track" (manual p. 30) in its
  chromatic variations, with no word on the channel. And "The presets can also be played
  chromatically using an external MIDI device connected to Tonverk. The MIDI channels dedicated
  to each of the tracks are the same as the track's number." (manual p. 36), which reads as a
  note reaching the track whose channel carries it. The second is what the parts below record,
  each audio track taking notes on its own channel. The first holds on the AUTO channel at
  least: "If an external MIDI keyboard connected to Tonverk sends MIDI data on this channel, the
  keyboard will control the active track." (manual p. 77). Either way a setting has to allow
  it: "RECEIVE NOTES will, when active, enable playing Tonverk using an external MIDI
  keyboard." (manual p. 76). **Until 2026-10-11 this account took the first page alone, and said
  notes go to no track of their own.** **And eight of those notes mean something else again on
  a track running the Subtracks machine**: "The subtracks are triggered over MIDI using these
  note values: 60, 62, 64, 65, 67, 69, 71, and 72." (manual p. 30). So a note is a pitch or a
  subtrack selector depending on the machine. The eight MSBs are the `subtrack` part below. The
  eight notes stay in prose: the page lists them without pairing each to a subtrack, and a
  part's note map is the whole part's and cannot give one note to one instance.

  THE DIRECTIONS ARE ALL SETTINGS AND ALL TWO-WAY. Clock: "CLOCK RECEIVE determines whether
  Tonverk responds to MIDI clock sent from external devices or not." (manual p. 76) and "CLOCK
  SEND determines whether Tonverk transmits MIDI clock or not." (manual p. 76). Transport the
  same, with "TRANSPORT SEND determines whether Tonverk transmits MIDI transport messages or
  not." (manual p. 76). Program change both ways, with a channel for each direction. And the
  controls: "RECEIVE CC/NRPN will, when active, make it possible to control Tonverk's parameters
  from an external MIDI device sending CC and NRPN data." (manual p. 76), against a channel that
  is "used to receive or send" (manual p. 76) - so every control of the appendix is two-way and
  none of them carries a direction of its own. Of the four controllers outside the appendix,
  the mod wheel and the breath controller are two-way as well and the two pedals are received
  only, for the reasons given below.

  WHAT THE MANUAL GETS WRONG, RECORDED AND NOT TIDIED. **Two consecutive sections print the same
  sentence.** 11.1.11 is headed PITCH BEND and 11.1.12 AFTERTOUCH, and both read "Opens a menu
  where you can assign up to four parameters to the MIDI aftertouch command." (manual p. 52) - so
  the pitch bend section describes aftertouch, and what pitch bend's four assignable parameters
  are is stated nowhere. The misprinted CC 31 is the other one, above. A third is smaller: `not
  availble` for available, once on p. 50 and once on p. 51. And the appendix's footnote spells
  NRPN `NPRN` (manual p. 120), while two of its rows drop the slash their neighbours print.

  FOUR CONTROLLERS OUTSIDE THE APPENDIX ARE CONTROLS BELOW: TWO OF THEM TWO-WAY, AND TWO PEDALS
  RECEIVED ONLY. The track setup menu assigns parameters to "the MIDI mod wheel command
  (CC #1)" (manual p. 52) and to "the MIDI breath controller command (CC #2)" (manual p. 52),
  among settings that "are only available for audio tracks (Track 1–8)" (manual p. 50). So each
  is a modulation source the player routes to up to four parameters, as aftertouch and pitch
  bend are here, and not a parameter with a place of its own.

  **THOSE TWO CARRY NO DIRECTION, WHICH SAYS BOTH WAYS, AND THAT IS TRUE OF THE TRACK AND OF NO
  ONE MACHINE.** A track with a sound machine answers to them. The same track can hold the
  MIDI machine instead, "which then converts the audio track into a MIDI track" (manual
  p. 20), and that machine has a parameter of its own for each: "MW (Mod Wheel) controls the
  modulation wheel data sent on the MIDI track." (manual p. 99) and "BC (Breath Controller)
  controls the breath control data sent on the MIDI track." (manual p. 99). Those two lines
  print no number, and that they are 1 and 2 is the menu's naming. Each is off until it is
  switched on (manual p. 98), and it goes out on the channel the machine's own CHAN parameter
  names (manual pp. 77, 98), a setting apart from the track's channel. The bus tracks can hold
  the MIDI machine too, with the same pages of parameters (manual pp. 64, 86), and so send the
  same two, and no control here says so: the bus part carries the appendix's column for a
  bus, which has neither number.

  **THE PEDALS ARE `direction: receives`: NO PAGE NAMES EITHER AMONG WHAT A TRACK SENDS.** The
  1.3.0 notes have "Added support for MIDI sustain pedal (CC64) and MIDI sostenuto pedal
  (CC66)." (release_notes), and that line is all any document says of them: the manual never
  mentions a pedal, and the note says neither which kinds of track answer nor, in so many
  words, that the instrument receives them. They are read as received, and they are written
  on the audio part because a pedal holds notes and the audio tracks' presets are what an
  outside keyboard plays (manual p. 36). That is a reading and not a statement. The MIDI
  machine also has sixteen slots a player sets to any standard controller, "The selectable
  commands are the standard MIDI Control Change Messages." (manual p. 99), so a track can be
  made to send 64, 66 or any other standard controller. That is the player's choice and not
  the instrument's map, and no direction here counts it.

  None of the four is in Appendix D, where the other 242 come from, so none has a group. The
  manual's text prints two more numbers the appendix lacks, the MIDI machine's bank changes
  on CC 0 and CC 32 (manual p. 98). They are not controls here: no page has this instrument
  answer to either, and they would be the only numbers carried for what the MIDI machine
  alone sends. So the text prints six controller numbers the appendix lacks, and four are
  carried. A picture of that machine's screen shows eight numbers in its slots, as examples
  (manual p. 99); two of them, 8 and 40, are controller numbers that no table and no sentence
  gives. Until 2026-10-13 the four were named here and not carried.

  NOT CARRIED: what each machine puts on each data entry knob. Appendix A runs thirty pages and
  names the parameters of every SRC and FX machine, and the MIDI appendix publishes the slots
  rather than the meanings - `SRC 1 Data entry knob A (machine dependent)` and so on through 40
  of them, 32 so marked and eight `(SRC machine dependent)`. **That is the same shape as the
  Analog Rytm's 220 rows and gets the same answer**, with one difference worth noting: outside
  the Subtracks machine's own table, this maker publishes no number against a machine's
  parameter, so there is nothing here to decline. The generic name is the only name printed.

