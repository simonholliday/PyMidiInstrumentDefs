# THE CONTROLLER NUMBERS BELOW ARE THIS INSTRUMENT'S FACTORY ASSIGNMENT, NOT FIXED FACTS.
# Korg lets the player assign a control change to each front panel knob and key, and the
# column the numbers come from is headed "Initial". The manual says so plainly: "Control
# changes can be assigned to each front panel knob/key of the microKORG so that the changes
# in sound as controlled by knob/key operations can be transmitted as performance data"
# (p. 56). So a microKORG somebody has reassigned does not answer to the table below, and
# each of the 41 from that table says so with `assignment: default`. CC 1, the one control
# here whose number the player cannot reassign, carries no such word.
#
# EACH NUMBER MEANS TWO THINGS, AND WHICH ONE DEPENDS ON THE PROGRAM, not on the channel.
# This instrument runs synth programs and vocoder programs, and the same knob is a different
# parameter in each: CC 18 is Semitone or HPF Level, CC 83 is Filter Type or Formant Shift,
# CC 85 is KBD Track or E.F.Sense. The label below is the synth meaning and a comment carries
# the vocoder one. Rows marked "synth programs only" have no vocoder meaning at all, and the
# sixteen vocoder band controls have no synth meaning.
#
# TWO DOCUMENTS, AND NEITHER CONTAINS THE OTHER'S HALF. Korg's plain-text MIDI implementation
# gives the NRPNs and names the panel's control changes without a single number; the owner's
# manual gives those numbers and no NRPNs. Both are cited below.
#
# THE microKORG CRYSTAL IS THIS INSTRUMENT where MIDI is concerned - Korg's download page for
# the Crystal links the very same file, by the same id, so there was nothing to compare.
# THE microKORG S IS NOT: it has an implementation of its own, revision 1.01 of 2026, which
# adds Bank Select MSB and LSB that this one does not have at all. The microKORG XL, XL+ and
# microKORG2 are different instruments again.

definition: 1

model:
  manufacturer: Korg
  name: microKORG
  # NOT RECORDED, and the search is worth writing down. Korg publishes no OS file, no release
  # notes and no system version for this instrument: its download page offers manuals, a sound
  # editor and templates, and nothing that names a firmware. The MIDI implementation's
  # "Revision 1.4 (2002.06.27)" is the document's own revision, the way the wavestate's chart
  # carries a version that is the chart's and not the instrument's. The manual states none
  # either. Checked 2026-10-02.

source: >-
  Two documents, because this instrument's control map is split across both and neither half
  is in the other. The MIDI Implementation, revision 1.4, is a plain text file with no pages,
  cited by its own section numbers; the Owner's Manual E 2 has 80 pages and is cited by page.

  THE IMPLEMENTATION GIVES NO CONTROLLER NUMBER FOR ANY PANEL PARAMETER, which is this
  instrument's first surprise. Its channel message rows say only "Control Change cc=00~95",
  and its panel table is headed "Panel Knob & Switch Control (assignable)" - forty-odd
  parameters in two columns and not one number against them. That is not an omission. The
  numbers are the player's to set, and Korg prints the factory assignment in the manual
  instead, in a table whose column is headed "Initial" (p. 56). Both facts are at the head of
  this file because that is where somebody about to rely on a number is looking.

  THE IMPLEMENTATION GIVES THE NRPNS, all 29, and prints them twice over - once for what the
  instrument transmits and once for what it recognises. The two copies are identical, which
  was checked rather than assumed. They address what the panel does not: the arpeggiator, the
  four modulation patches, and the vocoder's eight bands.

  ONE CONTROL CHANGE IS NOT ASSIGNABLE and so is in neither table: CC 1, which the
  implementation's receive table fixes as pitch modulation depth and its transmit table names
  as the modulation wheel.

  ONE CHANNEL, STATED AS A LIMIT RATHER THAN INFERRED: "The microKORG uses only one MIDI
  channel to transmit and receive. You cannot use two MIDI channels to play the two timbres
  independently" (p. 66). So there are no parts here, although the instrument is two timbres
  deep when layered. Which timbre a control change reaches is CC 95 below, a setting rather
  than a channel.

  THE TWO DOCUMENTS DO NOT NAME THE SAME 41 CONTROLS, which is worth knowing before anybody
  tries to reconcile them. The implementation's map of assignable slots includes an "EG2/Gate
  Sw" and a "SEQ Off/On Sw" that the manual's table has no row for, while the manual's table
  has Timbre Select and Sync Ctrl, which the implementation keeps as two global bytes of their
  own rather than as slots in that map. The numbers below are the manual's, because the
  implementation gives none; the overlap is recorded rather than resolved.

  NO BANK SELECT, said outright: "The microKORG does not transmit or receive bank select
  messages" (p. 52). That is the difference the microKORG S's own implementation adds, and it
  is why one definition cannot cover both.
  NO USB. The specifications list the connectors and name only MIDI in, out and thru, and the
  word USB appears twice in 80 pages, both times about somebody else's interface box: "Some
  USB-MIDI interface devices may not be able to transmit/receive the microKORG's MIDI
  exclusive messages" (p. 49). Every byte this instrument sends or receives goes down a DIN
  cable.

  WHAT IT WILL NOT ANSWER TO, established from the table that enumerates what it does. The
  recognised channel messages are note off, note on, CC 1, data entry, the NRPN pair, the
  channel mode messages, generic control data, program change and pitch bend - and nothing
  else.

  AFTERTOUCH IS ABSENT FROM THAT LIST in both forms, which agrees with the keyboard the
  specifications describe: "37 notes (mini keyboard, velocity sensitive, no aftertouch)"
  (p. 67). So aftertouch is a checked absence rather than an unread page.

  NOT RECORDED: the note range, which neither document states for what the instrument
  receives - the implementation gives kk = 0 ~ 127 for what the 37-key keyboard transmits
  with octave and transpose applied, and that is the panel rather than the span it answers to.

  THE SIBLING MODELS WERE SETTLED, NOT ASSUMED. The microKORG Crystal's download page offers
  the same MIDI Implementation under the same manual id, resolving to the same file, so this
  definition describes the Crystal by construction. The microKORG S's own implementation was
  fetched and compared: it is a different document, revision 1.01 (2026.06.22), and it adds
  Bank Select MSB and LSB that this instrument has not got. It is held in the library beside
  this one and is not described here.

