definition: 1

model:
  manufacturer: Waldorf
  name: Streichfett

source: >-
  Reference manual, 31 pages: the MIDI Controller Numbers table at p. 21, which
  gives a value range for every controller; the MIDI Implementation at p. 22;
  MIDI channel setting, and the second channel the Solo section can be played on,
  at p. 18; the technical data and factory settings at p. 20; and what Balance
  does at p. 14, with its sound parameter at p. 26. Polyphony, which the manual
  does not state, is from Waldorf's hardware product page as saved on 2026-09-14,
  which gives each section its own. One fact is measured rather than read, and
  says so where it is used: that the Solo section's channel takes notes but not
  control changes, measured on one unit running OS 1.14. NOT RECORDED: aftertouch
  and clock, which neither source covers.

sources:
  manual:
    kind: manual
    title: streichfett_manual_v1
    edition: version 1.2 (2020)
    landing: "https://waldorfmusic.com/streichfett-en/"
    url: "https://downloads.waldorfmusic.com/cloud/index.php/s/BppCqf8X5knMwyC/download"
    sha256: 0d7291d42c7203ad1e35e4b04266394506f2c328e7d206d7d2b8e0ca909b2bec
    retrieved: 2026-09-13
  product_page:
    kind: product_page
    title: "Streichfett EN – Waldorf Music"
    landing: "https://waldorfmusic.com/streichfett-en/"
    url: "https://waldorfmusic.com/streichfett-en/"
    sha256: 306b11a23e571b91176458c10e812acf192444fe5f15260037662bc55bc48293
    retrieved: 2026-09-14
    paginated: false
    # Cited only for polyphony, which the manual does not state. A web page can
    # change overnight and serves different bytes to everyone, so what was read is
    # pinned by saving it: the sha256 above is of the page's visible text as
    # rendered on 2026-09-14 at 08:31 UTC. The page itself, as served, hashes to
    # c39577d1648fc2572f2155f15d78c1c392a4d3fe47e885d03a0c2fa89c65211f. No later
    # fetch will match either.

midi:
  # Set by holding all four Memory buttons and playing a note on the channel
  # wanted; Omni by holding them while powering on. From the factory it
  # receives Omni and transmits on 1 (pp. 18, 20). Which one yours is on belongs
  # to your project, not here.
  channels: [1, 16]
  program_change:
    receives: true
    presets: 12              # "Program number (0 - 11)", where pp = preset + 4 x bank (p. 22)

parts:
  # Two sections, and every control below is deliberately unparted -- that is, on
  # the base channel. The manual prints one *generic* control change (p. 22,
  # "Bc cc vv", "c : MIDI channel (0 - 15)") over a single flat list of 70-94,
  # and never ties a controller number to a section or to a channel.
  strings:
    label: Strings
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
    polyphony: 128           # "128 voice fully polyphonic Strings section" (product page)
  solo:
    label: Solo
    channel_offset: 1
    addressing: pitches
    # Notes only. p. 18 documents that the Solo section "can be triggered
    # independently of the Strings section on the next channel, with split
    # settings being ignored", and p. 22 ties no control change to any channel --
    # so the manual settles the notes and leaves the controls open.
    #
    # MEASURED, not stated by the maker: on one unit running OS 1.14, over USB MIDI,
    # with the base channel set to 2, on 2026-09-14. CC 76, 70 and 77 sent on the
    # channel above left the instrument's own dumped sound parameters unmoved,
    # while CC 76 and 70 moved them on the base channel both before and after, and
    # notes sent there sounded the Solo section. A fact about that unit and that
    # firmware.
    #
    # Only when the base channel is 1-14.
    receives: [notes]
    polyphony: 8             # "Eight voice polyphonic Solo section" (product page)

voice:
  addressing: pitches
  # No single figure for the whole instrument: Waldorf gives one per section, and
  # each is recorded against its part above. 136 is a number Waldorf never states.
  polyphony_shared: false
  velocity:
    # Note On carries key velocity and Note Off release velocity (p. 22).
    note_on: received
    note_off: true
  pitch_bend:
    semitones: 2             # the factory setting (p. 20)

controls:

  # Two conventions share this table, and each control keeps its own. Sustain
  # Pedal's "0 = Off, 64 = On" is a band, as it is everywhere. Five others are
  # exact values -- "0 = Base, 1 = Both, 2 = 8va" means 0, 1 and 2, and nothing
  # above 2 -- so they are choices, sent exactly as printed.

  # ── Performance ───────────────────────────────────────────────────────────

  mod_wheel:
    label: Modulation Wheel
    cc: 1
    # Sets the vibrato level and speed of both sections (p. 18).
    group: performance
  sustain_pedal:
    label: Sustain Pedal
    cc: 64
    values: {"off": 0, "on": 64}
    group: performance

  # ── Strings ───────────────────────────────────────────────────────────────

  string_registration:
    label: String Registration
    cc: 70
    choices: {base: 0, both: 1, octave: 2}     # "2 = 8va"
    group: strings
  string_octaves:
    label: String Octaves
    cc: 71
    group: strings
  string_release:
    label: String Release
    cc: 72
    group: strings
  crescendo:
    label: Crescendo
    cc: 73
    group: strings
  string_ensemble_type:
    label: String Ensemble Type
    cc: 74
    choices: {string: 0, string_chorus: 1, chorus: 2}
    group: strings
  string_ensemble:
    label: String Ensemble
    cc: 75
    group: strings

  # ── Solo ──────────────────────────────────────────────────────────────────

  solo_tone:
    label: Solo Tone
    cc: 76
    group: solo
  solo_tremolo:
    label: Solo Tremolo
    cc: 77
    group: solo
  solo_split:
    label: Solo Split
    cc: 78
    choices: {low: 0, layer: 1, high: 2}
    group: solo
  solo_sustain:
    label: Solo Sustain
    cc: 79
    choices: {no_sustain: 0, full_sustain: 1}
    group: solo
  solo_attack:
    label: Solo Attack
    cc: 80
    group: solo
  solo_decay:
    label: Solo Decay
    cc: 81
    group: solo
  balance:
    label: Balance
    cc: 82
    # Not a Solo control, though the table prints it among them: it "Mixes the
    # signals of the Strings and Solo section" (p. 14), and sound parameter 13
    # gives it as "0: Strings.. 64: Strings+Solo 127: Solo" (p. 26). It acts on
    # the whole instrument, so it is grouped apart from either section.
    group: mix

  # ── Effects ───────────────────────────────────────────────────────────────

  fx_type:
    label: FX Type
    cc: 91
    choices: {reverb: 0, phaser: 1, animate: 2}
    group: fx
  fx_animate_amount:
    label: FX Animate Amount
    cc: 92
    group: fx
  fx_phaser_amount:
    label: FX Phaser Amount
    cc: 93
    group: fx
  fx_reverb_amount:
    label: FX Reverb Amount
    cc: 94
    group: fx

# The table also lists 120-123 -- All Sound Off, Reset All Controllers, Local
# Control and All Notes Off. They are channel mode messages, the same on every
# instrument that has them, so they live in pymididefs.cc and not here.
