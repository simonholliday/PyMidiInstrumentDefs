# This instrument's controllers are the player's, not the maker's: up to four incoming
# control changes are routed to chosen destinations per sound, and the maker publishes no
# number for any of them anywhere. `control_change: learned` says so, which is neither a
# checked absence nor an unread page. What is fixed, and so true of every OP-1, is below.
#
# BEFORE ADDING A CONTROLLER NUMBER TO THIS FILE, READ THIS.
# There is a full MIDI chart on teenage engineering's site under an address that looks like
# this instrument's, and it is a different instrument's. The OP-1 field's guide, at
# /guides/op-1 where this one is at /guides/op-1/original, publishes incoming note on with
# velocity 1-127, pitch bend 0-16383, program change loading synth and drum slots, clock,
# start, continue, stop and song position, all on channels 1-16, and a control change table
# of dozens of numbers: 7 mixer volume, 9 mixer mute, 10 mixer pan, 46-49 synth parameters,
# 50-53 the envelope, 54-57 patch effects, 58-61 patch LFO, 64 sustain pedal, 70-77 master
# effects and compressor, 78-88 tape and transport, 90 upward the master EQ. **None of that
# is this instrument.** The field is a later product with its own definition name in the
# survey's list, and the original's guide carries no such table anywhere in its 18 sections.
# Anything claiming a CC number for the OP-1 came either from the field or from a community
# database, and the guide beside this corpus forbids lifting a value from one of those.

definition: 1

model:
  # The maker writes its own name in lower case throughout, as Korg does with the minilogue
  # xd, so it is kept that way.
  manufacturer: teenage engineering
  # SPELLED WITH A HYPHEN BECAUSE THE MAKER SPELLS IT THAT WAY, which was counted rather
  # than chosen: across the eight documents cited below, "OP-1" appears 89 times and "OP-1"
  # with an en dash once, on a downloads page heading. Its marketing pages prefer the en
  # dash and its user guide does not.
  name: OP-1
  # THE MAKER NUMBERS THIS FIRMWARE WITH A HASH AND NO DOTS, and #246 is the newest it
  # publishes, dated 2022.12.13 (os_updates). Two of the facts below rest on it: the system
  # exclusive reply, which #243 fixed from returning zeros, and nothing else - the guide
  # describes no feature that any release note changed.
  # ESTABLISHED ON A PAGE ABOUT THIS INSTRUMENT ALONE, which matters: the maker's
  # /downloads/op-1 lists both this and the OP-1 field, whose OS is 1.7.3, so reading a
  # version off that page would have been a coin toss. Confirmed again from the file the
  # page offers, which names the version itself and belongs to no other product:
  # /_software/op-1/op1_246.op1, fetched for its headers alone and not kept.
  firmware: "#246"

source: >-
  User guide v.2.2, the maker's online manual in 18 numbered sections, of which 1, 5, 10, 13,
  14 and 15 are cited, with the OS updates page for the firmware. The guide has no pages,
  so every source here cites the section number the guide prints for itself.

  NO CONTROLLER NUMBER IS PUBLISHED ANYWHERE, which is this instrument's whole story and was
  established by searching all 19 of the guide's fetched pages, not inferred from the two
  that discuss MIDI. Searched for: control change, CC, CC#, continuous controller, program
  change, pitch bend, aftertouch, velocity, sysex, system exclusive, NRPN, MMC, song
  position, implementation, modulation wheel, mod wheel, and any digit following a
  controller word. Six hits in 18 sections, and not one of them a number. Section 15.6 is
  the MIDI LFO, where "you may route up to four incoming channels of MIDI CC, and target
  them to your preferred destinations"; section 5 lists that LFO as "MIDI - route external
  MIDI CC to the OP-1". The other four are not about what this instrument answers to:
  "pitch bend" twice in section 14.4, naming what shift and the arrow keys do on the panel;
  "mod wheel" once in 13.10, describing what an encoder does to somebody else's software;
  and "song position" once in 13.9, where "Arrow keys move the current song position one
  beat" is Ableton Live's playhead and not the MIDI message of that name. The words
  aftertouch, velocity, program change, NRPN, system exclusive and implementation appear in
  the guide not at all.

  SO THERE ARE NO CONTROLS BELOW, and no groups either. Sections 13.8 to 13.10 do print two
  tables of assignments, and neither is this instrument's: one is a control surface script
  the maker asks you to download for Ableton Live, the other is remote support built into
  Propellerhead Reason. Both map keys to functions and name no controller number.

  MIDI TRAVELS OVER USB ALONE, and that is the maker's own enumeration rather than silence:
  "OP-1 has three ports located on the right hand side of the unit", those being audio in,
  audio out, and a "usb port for charging, streaming audio, file transfers and midi"
  (section 1.3). There is no DIN and no TRS.

  NOT RECORDED: the channel range, since the guide gives a default and no span; velocity,
  aftertouch, program change and NRPN, searched for as above and absent, which is not the
  same as checked; the note range, though section 3.2 has an octave shift; the polyphony,
  for the reason below; and whether transport messages travel, for the reason below.

  WHERE THE SEARCH DOES NOT REACH, said plainly rather than left to be assumed. It covers
  the guide, the OS updates and the quick start guide. It does not cover
  support.teenage.engineering, which the guide links as its support site and which answers
  403 to anything fetched here, so if a MIDI note is published there it has not been read.

  TWO OTHER DOCUMENTS OF THIS INSTRUMENT ARE NOT CITED. A Japanese manual, 34 pages, whose
  own title is "OP-1 Manual 1.0" and whose PDF was made in June 2011, describes a materially
  older instrument than this English v.2.2 - 17 sections against 18, and four LFO modes
  against ten - so it is not a second witness to anything here. And an accessories page sits
  at the guide's own address without being linked from its contents, so a reader reaches it
  only by looking for it; it names pitch bend in the same panel sense section 14.4 does.

