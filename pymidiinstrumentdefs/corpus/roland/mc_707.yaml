    # Cited for what Roland publishes for this instrument. It renders a document list but
    # **names no file URL** - every link is built in the browser - so each document was found
    # by searching the maker's own domain instead.

midi:
  # The chart's Basic Channel is 1-16 in both columns, Default and Changed alike, with the
  # remark "Memorized" - so no factory channel is published.
  channels: [1, 16]
  # The chart's Mode row: nothing transmitted, Mode 3 recognized. Omni off, Poly.
  mode: 3
  # BOTH, AND THE SETTINGS SAY WHICH WAY EACH GOES. The chart marks Clock o in both columns, and
  # the system settings have a MIDI Sync Out switch per port, which "Specifies whether clock,
  # start, and stop messages are transmitted (ON) or are not transmitted (OFF) to the devices
  # connected to the corresponding MIDI port" (reference p. 54), against a MIDI Sync parameter
  # of AUTO, INT, MIDI or USB for the other direction.
  clock: both
  # BOTH, WITH ONE ASYMMETRY THE CHART IS EXPLICIT ABOUT: Start and Stop are o in both columns
  # and **Continue is x transmitted, o recognized** - it answers to a continue and never sends
  # one. Song Position and Song Select are x in both.
  transport: both
  program_change:
    # o in both columns of the chart, where Version 1.00 had x in both - this was added by
    # firmware. What it reaches depends on the channel; see the source account.
    receives: true
    sends: true
    # THE SCENES, WHICH ARE WHAT A PROGRAM CHANGE ON THE CONTROL CHANNEL SELECTS: the chart's
    # True Number row gives 0-127 both ways, and the update notes' CALL SCENE setting divides
    # 128 of them into banks either way round (update p. 11). A program change on a *track*
    # channel selects one of that track's 16 clips instead, which this field has no room for.
    presets: 128
  # NONE, CHECKED RATHER THAN UNREAD - see the source account. The chart lists its controller
  # numbers individually and 98 and 99 are not among them, it has no NRPN row, and the words
  # NRPN, RPN, Registered Parameter, Data Entry and Bank Select occur nowhere in any of this
  # instrument's four documents.
  nrpn: none
  # NOT RECORDED, BECAUSE THE TWO DOCUMENTS CONTRADICT EACH OTHER. The chart marks System
  # Exclusive x in both columns; the reference manual carries a Device ID "17-32" parameter for
  # "transmitting and receiving system exclusive messages" (reference p. 54). Recording either
  # would be choosing between them, and nothing published here does.

voice:
  addressing: pitches
  # The chart gives Note Number 0-127 in both columns, and True Voice 0-127 recognized.
  note_range: [0, 127]
  # NOT RECORDED: no document here states a voice count. **What is established is that the
  # eight tracks share one pool**, by a system setting that exists to divide it: the VOICE
  # RESERVE tab's TRACK 1-8 parameter, 0-10, "Specifies how polyphony resources are allocated
  # to each tone/drum track" (reference p. 18). A reserve is only meaningful against a shared
  # ceiling.
  polyphony_shared: true
  velocity:
    # The chart gives Note On o in both columns and Note Off o in both, so this instrument
    # sends and answers to a note-off velocity as well as a note-on one.
    note_on: both
    note_off: true
  # RECEIVED ONLY, AND BOTH KINDS. The chart has two After Touch rows, Key's and Channel's, and
  # both are x transmitted and o recognized. `poly` is the stronger of the two and is published;
  # channel pressure is answered to as well, and the Ver.1.80 notes give it a per-track switch
  # of its own, "Receive Channel Pressure" (update p. 3).
  aftertouch: poly
  pitch_bend:
    # RECEIVED AND NEVER SENT - the chart's Pitch Bend row is x transmitted, o recognized - and
    # settable up and down separately, by a tone's "Bend Range Up 0-48 [semitone]" and "Bend
    # Range Down 0-48 [semitone]" (reference p. 62), each with a fine adjustment in cents. A
    # clip has a "Bend Range 0-24, TONE" (reference p. 64) of its own. No default is stated for any of them, so no
    # figure is recorded.
    programmable: true

parts:
  # Each track is given a channel by the player and the control channel likewise, so neither
  # derives one: there is no base channel on this instrument to derive from.
  track:
    label: Track
    count: 8
    channel: assigned
    addressing: pitches
    # NOTES, CONTROLLERS AND A PROGRAM CHANGE OF ITS OWN, the last selecting one of the track's
    # sixteen clips. The Ver.1.80 notes add a per-track switch for each of nine controller
    # numbers, which is a second statement that controllers reach a track.
    receives: [notes, controls, program_change]
  control:
    label: Control Channel
    count: 1
    channel: assigned
    # A CHANNEL THAT MAKES NO SOUND AND IS NOT A TRACK. It takes a program change, which
    # switches the scene, and note numbers 60 to 75, which work the Scatter Pad. **It takes no
    # control change**: nothing in either document says a controller reaches it, and a control
    # sent to a channel an instrument ignores does nothing and says nothing about why.
    receives: [notes, program_change]

groups:
  # NONE OF THESE FIVE LABELS IS THE MAKER'S WORD, because the chart heads nothing over its
  # control change rows - all twenty-five sit under the single heading "Control Change". The
  # control *names* below are the chart's own, verbatim, including its lower-case "Attack time"
  # and its two "General Purpose Effect" rows.
  controllers: Controllers
  portamento: Portamento
  pedals: Pedals
  tone: Tone
  vibrato: Vibrato
  knobs: Knobs
  effects: Effects

controls:
  # CONTROLLERS ---------------------------------------------------
  modulation:             {label: Modulation, cc: 1, direction: receives, group: controllers}
  volume:                 {label: Volume, cc: 7, direction: receives, group: controllers}
  panpot:                 {label: Panpot, cc: 10, direction: receives, group: controllers}
  expression:             {label: Expression, cc: 11, direction: receives, group: controllers}
  breath_control:         {label: Breath Control, cc: 2, direction: receives, group: controllers}
  foot_control:           {label: Foot Control, cc: 4, direction: receives, group: controllers}

  # PORTAMENTO ----------------------------------------------------
  portamento_time:        {label: Portamento Time, cc: 5, direction: receives, group: portamento}
  portamento_control:     {label: Portamento control, cc: 84, direction: receives, group: portamento}

  # PEDALS --------------------------------------------------------
  hold_1:                 {label: Hold 1, cc: 64, direction: receives, group: pedals}
  portamento:             {label: Portamento, cc: 65, direction: receives, group: pedals}
  sostenuto:              {label: Sostenuto, cc: 66, direction: receives, group: pedals}
  soft:                   {label: Soft, cc: 67, direction: receives, group: pedals}
  legato_foot_switch:     {label: Legato Foot Switch, cc: 68, direction: receives, group: pedals}

  # TONE ----------------------------------------------------------
  resonance:              {label: Resonance, cc: 71, direction: receives, group: tone}
  release_time:           {label: Release Time, cc: 72, direction: receives, group: tone}
  attack_time:            {label: Attack time, cc: 73, direction: receives, group: tone}
  cutoff:                 {label: Cutoff, cc: 74, direction: receives, group: tone}
  decay_time:             {label: Decay Time, cc: 75, direction: receives, group: tone}

  # VIBRATO -------------------------------------------------------
  vibrato_rate:           {label: Vibrato Rate, cc: 76, direction: receives, group: vibrato}
  vibrato_depth:          {label: Vibrato Depth, cc: 77, direction: receives, group: vibrato}
  vibrato_delay:          {label: Vibrato Delay, cc: 78, direction: receives, group: vibrato}

  # KNOBS ---------------------------------------------------------
  filter_knob:            {label: FILTER Knob, cc: 80, group: knobs}
  mod_knob:               {label: MOD Knob, cc: 81, group: knobs}
  fx_knob:                {label: FX Knob, cc: 82, group: knobs}
  sound_knob:             {label: SOUND Knob, cc: 83, group: knobs}

  # EFFECTS -------------------------------------------------------
  reverb_send:            {label: General Purpose Effect 1 (Reverb Send Level), cc: 91, direction: receives, group: effects}
  chorus_send:            {label: General Purpose Effect 3 (Chorus Send Level), cc: 92, direction: receives, group: effects}
  delay_send:             {label: Delay Send Level, cc: 93, direction: receives, group: effects}

