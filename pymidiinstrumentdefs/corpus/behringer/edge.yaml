# **NO CONTROLS, AND THIS FILE DELIBERATELY DOES NOT SAY `none`.** Everything this maker publishes
# for this instrument is a quick start guide, and **a quick start guide that lists no controller
# is not the same as an instrument that has none** - which is `pwm/malevolent`'s ruling and is the
# one that applies here. `behringer/td_3` does say `none` out of the same kind of document, and
# the difference is exact: **its guide carries a table of MIDI messages and the sibling TD-3-MO's
# copy of that table carries a controller**, so the absence there is informative. **The EDGE's
# guides have no table of MIDI messages at all**, in either edition, so there is nothing for a
# controller to be missing from.
#
# **AND THERE IS NO USER MANUAL, WHICH WAS ESTABLISHED FROM A LIST RATHER THAN A SEARCH.** The
# product page embeds its own download list and it has six items: four quick start guides and two
# builds of an application. `behringer/neutron`, whose product code is one letter away, has a
# `NEUTRON User Manual` on its page - and that is where its two controllers come from. **So this
# maker does publish a manual when there is one to publish, and for this instrument it has not.**
#
# **TWO OF THE SIX ARE BOTH CALLED `Quick Start Guide`, BOTH MULTI-LANGUAGE, AND FOUR YEARS
# APART.** One is `V 1.0`, 35 sheets, made 15 November 2021; the other is `V 2.0`, 50 sheets, made
# 22 January 2025. Only the second is labelled `Quick Start Guide, All Languages`, and nothing on
# the page says the first is older. A reader clicking the third item gets the 2021 edition.
#
# **AND THE TWO COVERS DESCRIBE DIFFERENT INSTRUMENTS.** V 1.0 reads `Analog Semi-Modular
# Percussion Synthesizer with 2 Oscillators, Multi-Mode Filter, Dual 8-Step Sequencer and 16-Voice
# Poly Chain`; V 2.0 reads `Analog Percussion Synthesizer with 2 Oscillators, Multi-Mode Filter
# and Dual 8-Step Sequencer`. **`Semi-Modular` and `16-Voice Poly Chain` are gone from the newer
# one** - and the product page that serves it still advertises both, word for word as V 1.0 had
# them. So the page and the document it offers do not agree about what this instrument is.
#
# **THE POLY CHAIN IS WHY THAT MATTERS, AND IT IS DOCUMENTED NOWHERE BUT A PICTURE.** Both guides
# carry a connection diagram headed `Poly Chain System` in ten languages, showing MIDI IN to MIDI
# THRU to MIDI THRU between three EDGEs. **There is no prose about it anywhere in either edition**
# - no channel rule, no setup, no mention of how sixteen monophonic instruments divide a chord -
# and the only other appearance of the word is a panel note that the power LED "Turns red if poly
# mode is activated." (guide p. 20). A consumer cannot be told from these documents how to do the
# thing the page sells.
#
# **AND THE SPANISH LABEL ON THAT DIAGRAM READS `Sistema de cadena de polietileno`** - a
# polyethylene chain - in **both** editions, four years apart. So a Spanish reader looking for the
# poly chain section is looking for a plastics term.

