# **THE THIRD REFACE HERE, AND THE DOCUMENTS WERE ALREADY IN THE LIBRARY.** Yamaha publishes one
# Data List for all four of them, and `yamaha/reface_dx` and `yamaha/reface_cp` are built from it
# already - so this definition cites the same three files at the same three digests, saved once
# under the DX. That is `novation/summit`'s arrangement for a shared addendum: one file, one
# digest, several definitions citing it.
#
# **AND THE DOCUMENT MAKES THAT SAFE, BECAUSE IT IS FOUR SELF-CONTAINED SECTIONS RATHER THAN ONE
# INTERLEAVED ONE.** The reface CS has sheets 2 to 5, the DX 6 to 10, the CP 11 to 14 and the YC
# 15 to 19; every sheet prints its model's name in its own header, and **no sheet names two
# models**. So the four can be read apart without the risk the DX's definition had to check for.
# Each ends with a MIDI Implementation Chart of its own.
#
# **TWENTY-ONE CONTROLS, OF WHICH SEVENTEEN ANSWER ONLY WHILE A SETTING IS ON.** The Control
# Change table's own heading says so - "Transmitted and recognized Control Change Number and
# Value, when MIDI control is on." (dl p. 4) - and the chart footnotes the same seventeen
# `*1 Transmitted and recognized if MIDI control mode is on.` (dl p. 5). The setting is a system
# parameter, `00 00 0E`, printed as "MIDI Control off, ON" (dl p. 4). The other four - modulation,
# volume, expression and the sustain switch - work whatever it is set to.
#
# **ITS PEDAL SOCKET HAS TWO FUNCTIONS AND SENDS ONLY ONE OF THEM AT A TIME.** The chart marks
# controller 11 transmitted with `*3 Transmitted if Foot Volume / Sustain switch is Foot Volume.`
# and controller 64 with `*4 Transmitted if Foot Volume / Sustain switch is Sustain.` (dl p. 5) -
# **one socket, one setting, and the two are exclusive**. Out of the box it is the first of them:
# "Factory default setting: Foot Volume" (supplement p. 12). Both are carried as travelling both
# ways, because that is what the chart says of each; which one a given instrument sends is a
# setting and belongs to its owner.
#
# **AND IT CAN TRANSMIT A HALF-DAMPER VALUE IT CANNOT USE.** The sustain switch sends 0 or 127
# with the factory pedal setting - "When Sustain is set to 'FC4/5,' operating the foot switch
# transmits only values of 0 (off) or 127 (on)." (dl p. 2) - and the full range with the other,
# whose own note is the interesting half: "Half-damper playing has no effect on the sound of the
# reface CS." (supplement p. 12). So a continuous pedal on this instrument is a controller for
# something else to listen to.
#
# WHAT SEPARATES IT FROM ITS SIBLINGS, READ OFF TWO SYSTEM OVERVIEWS. The CS's is headed
# "(4) SYSTEM OVERVIEW (Keyboard (KBD), Looper Play/Rec (LPR PLAY/REC) and Tone Generator (TG))"
# (dl p. 3) where the CP's names only a keyboard and a tone generator - **so the CS has a third
# block its sibling lacks, and it is a looper.** That is the structural reason this definition has
# `clock: both` and `transport: both` where `yamaha/reface_cp` has `none` for each: the two
# refaces with a looper answer to a clock and send one, and the two without cross all four cells.
# **A family difference worth stating rather than discovering twice.**

definition: 1

model:
  manufacturer: Yamaha
  name: reface CS
  # **FIRMWARE 1.30**, which is what the library path says and what the supplementary manual
  # describes: nine new functions for this instrument, among them the pitch bend range and the
  # two channel settings this definition records. The Data List is edition `b0` and dates its
  # own chart "Date :31-MAR-2016" (dl p. 5) with "Version : 1.1" (dl p. 5) - **a chart
  # version of its own, one step ahead of the three siblings' 1.0**, which is this document's way
  # of saying the CS's
  # chart was reissued for that firmware and theirs were not.
  # The system exclusive Model ID is `03H` (dl p. 2), which is how an instrument answering a
  # device inquiry proves it is this one rather than another reface.
  # Checked 2026-10-06.

source: >-
  **The reface CS/DX/CP/YC Data List, sheets 2 to 5**, which carry this instrument's data format,
  its Control Change table and its MIDI Implementation Chart. Every number below comes from
  sheet 4 or sheet 2, and every direction from the chart on sheet 5.

  **ALL THREE DOCUMENTS WERE ALREADY IN THIS LIBRARY AND NONE WAS FETCHED AGAIN.** They are saved
  under `Library/yamaha/reface_dx/1.30/`, cited by `yamaha/reface_dx` and `yamaha/reface_cp`
  before this, and their digests were checked against what those two definitions record before
  anything here was written. See the comment above the definition for why reading one model's
  section out of a four-model document is safe here.

  **THE REFERENCE MANUAL IS NOT A SOURCE FOR THIS INSTRUMENT**, although it is for the DX and is
  in the same library directory. Its eleven sheets are about Edit mode on the reface DX - "By
  using Edit mode on the reface DX, you can m[ake]" (reference) is how its second sheet
  opens - and it says nothing about the CS. Recorded so the next reader knows it was looked
  at rather than missed.

  SEVENTEEN OF THE TWENTY-ONE ARE CONDITIONAL, AND FOUR ARE NOT. See the comment above. The four
  that always work are the MIDI specification's own - controller 1, 7, 11 and 64 - and the
  seventeen that are not are this instrument's panel, from its oscillator type to its effect rate.
  **The definition cannot express the condition**, so it is stated here and in the controls'
  comments; a consumer offering all twenty-one on a new instrument would find seventeen of them
  silent until somebody turned the setting on.

  **TWO OF THE FOUR ARE RECEIVED AND NEVER SENT**, which the chart gives cell by cell: controller
  1, Modulation Wheel, and controller 7, Main Volume, are crossed transmitted and circled
  recognised (dl p. 5). The data format agrees from the other side, listing them under
  `*RECEIVED CONTROL NUMBER` and not under `*TRANSMITTED CONTROL NUMBER` (dl p. 2) - which is the
  rare case of a document stating a direction twice in two different ways.

  WHY THE SELECTOR VALUES ARE THE ONES THE INSTRUMENT SENDS RATHER THAN THE BANDS IT HEARS. The
  table gives both for each of the three five-way switches: an exact value transmitted and a
  range recognised, so `OSC TYPE` sends 0, 32, 64, 95 or 127 and answers to 0-25, 26-51, 52-76,
  77-102 or 103-127. **The exact values are recorded**, which is `yamaha/reface_cp`'s choice for
  the same table shape from the same document, and is the one a consumer sending a value needs.
  What it costs is the display case: a value of 40 arriving is `FILTER` and nothing above says so.

  NOT RECORDED, THE MODE, AND THE CHART IS WHY. It gives **two different defaults** - 3
  transmitted and 1 recognised - and this field holds one number. That is `yamaha/reface_dx`'s
  ruling from the identical row, and it holds for all four refaces. The recognised side is the
  one a reader would want and it is the one the supplement explains: "Factory default setting:
  All" (supplement p. 9) for the receive channel, which is mode 1 by another name.

  AND THE FAMILY DIVIDES ON THE ROW UNDER IT, which is worth recording because it is the kind of
  thing somebody carries across by mistake. The CS and the DX recognise mode messages `1 - 4`
  with the footnote `*2 "m" is always treated as "1" regardless of its actual value.` (dl p. 5);
  the CP and the YC recognise `1,3` instead. **Four charts in one document, and no two of them
  are the same chart.**

  NOT RECORDED: the nine functions the 1.30 firmware added, of which only two reach this format -
  the pitch bend range and the channels. The other seven are a master tuning, a master transpose,
  a `Quantize Mode`, a `Guide / Click Sound Switch`, the pedal switch above and the
  pedal-type selection, and all are set by holding a key at power-on. NOT RECORDED EITHER: the
  system exclusive
  parameters, two tables of them totalling 54 bytes, among which `Volume` carries a note worth a
  reader's time - "This parameter can be set only via MIDI." (dl p. 4) - because there is no
  volume knob on this instrument at all.

sources:
  dl:
    kind: midi_implementation
    title: reface CS/DX/CP/YC Data List
    edition: "b0"
