midi:
  # A pad's MIDI In, `None, Ch1 through Ch16.` (manual p. 29), and a sequence's MIDI Out,
  # `None, Ch1, through Ch 16` (manual p. 73); no page lists the Global In or MIDI Seq channels,
  # which are taken to be the same.
  channels: [1, 16]
  clock: both
  transport: both
  program_change:
    # PGM In, off by default (manual p. 107).
    receives: true
    sends: false
    # "the first 128 presets" (manual p. 107).
    presets: 128
  # LEARNED: any controller, by the Learn button in a modulation slot (manual p. 26; manual p. 99).
  # The three the maker fixes are the controls below.
  control_change: learned
  # NOT RECORDED: `nrpn` and `sysex`, which no page mentions, and `mode`: no page mentions
  # channel-mode messages, and Omni here is a Global In setting (see the account).

voice:
  # The Global In note map; a pad on a channel of its own is played by pitch instead - see the
  # parts.
  addressing: voices
  # Each pad's Pad Note can be set, from `C#-1` to `G9`, and `Default` restores this map
  # (manual p. 29; manual p. 97).
  note_map: learned
  # Notes 36 to 51, "starting at the bottom left, moving across and then up." (manual p. 105),
  # numbered here in that order.
  voices:
    pad_1: 36
    pad_2: 37
    pad_3: 38
    pad_4: 39
    pad_5: 40
    pad_6: 41
    pad_7: 42
    pad_8: 43
    pad_9: 44
    pad_10: 45
    pad_11: 46
    pad_12: 47
    pad_13: 48
    pad_14: 49
    pad_15: 50
    pad_16: 51
  velocity:
    # Received as the modulation source VEL (manual p. 98); sent with notes passed through from the
    # MIDI Seq channel (manual p. 108).
    note_on: both
  # NOT RECORDED: `polyphony` and `polyphony_shared` (a pool of 16 that two pad modes stand outside,
  # within 32 voices in all; see the account), `note_range`, `aftertouch`, `pitch_bend` (a
  # modulation source on a pad's channel, with no range given) and note-off velocity.

parts:
  # **THE GLOBAL IN CHANNEL**, or Omni, or None (manual p. 95), with the note map above.
  global_in:
    label: Global In
    channel: assigned
    receives: [notes]
    addressing: voices
  # **THE SIXTEEN PADS**, each with a MIDI In channel of its own or none (manual p. 29), played
  # chromatically on it, or by slice, and modulated by the three controllers below.
  pad:
    label: Pad
    count: 16
    channel: assigned
    receives: [notes, controls]
    addressing: pitches
  # **THE MIDI SEQ CHANNEL**, whose notes are recorded into the selected sequence (manual p. 97).
  midi_seq:
    label: MIDI Seq
    channel: assigned
    receives: [notes]
    addressing: pitches

controls:
  # The three controllers a modulation slot names as sources, on the pad's own channel
  # (manual p. 29; manual p. 98). Each acts only where a slot has it as its source. Received only:
  # all MIDI output comes from sequences (manual p. 93).
  mod_wheel:    {label: MODW, cc: 1, part: pad, direction: receives}
  volume:       {label: MVOL, cc: 7, part: pad, direction: receives}
  pan:          {label: MPAN, cc: 10, part: pad, direction: receives}
