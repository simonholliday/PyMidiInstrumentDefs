    url: "https://www.ableton.com/en/release-notes/move-1/"
    sha256: "5f2e59d1b23ddba076484c9bb95abd9357c3cc79ed1db204e486da1a6347c1d2"
    retrieved: 2026-10-05
    paginated: false
    # **THE MIDI IMPLEMENTATION RECORD FOR THIS INSTRUMENT**, and the only document that is
    # current. Newest entry `Move 2.1.1`.
    # **ITS ADDRESS IS `move-1` AND GUESSING IT WRONG COSTS THE WHOLE READING.**
    # `/en/release-notes/move/` and `/en/move/release-notes/` both answer 404, and two wrong
    # guesses were briefly written down as `no release notes exist`. It is linked from the tech
    # specs page and from the new-features page, and from nowhere on the manual.
  manual:
    kind: manual
    title: Ableton Move Manual
    landing: "https://www.ableton.com/en/move/manual/"
    url: "https://www.ableton.com/en/move/manual/"
    sha256: "3790e9ec2649b84dcc48597e1de5b3d995de043ac5e07e49463ce3df2ffb7a46"
    retrieved: 2026-10-05
    paginated: false
    # **OBSOLETE FOR MIDI AND SILENT ABOUT BEING SO**: copyright 2024, newest software
    # reference 1.1, no version or date on the page. Cited here only for what has not changed -
    # the track count, the ports as hardware, which engines answer aftertouch, the two names for
    # channel aftertouch, and the pads. Its provenance record lists the five statements that are
    # no longer true.
    # One page, 21 chapters, so no page to cite. Its 196 figures are all lazy-loaded with empty
    # alt text, so **nothing any screenshot shows is in the saved copy** - including the MIDI
    # submenu's option list.
  product_page:
    kind: product_page
    title: Move
    landing: "https://www.ableton.com/en/move/"
    url: "https://www.ableton.com/en/move/"
    sha256: "552e7221487006ed1209fc2f9c10624f8fd6ba8cb85d8fa7e6f5fa52f3e9a5a9"
    retrieved: 2026-10-05
    paginated: false
    # **RIGHT WHERE THE MANUAL IS WRONG**, which is not the usual way round and is why it is
    # cited rather than merely saved. Its MIDI paragraph is inside a hidden modal, so a reader
    # of the page never sees it without clicking.
  tech_specs:
    kind: specification
    title: Move Tech Specs
    landing: "https://www.ableton.com/en/move/tech-specs/"
    url: "https://www.ableton.com/en/move/tech-specs/"
    sha256: "96851515234e0c19cbe6b383c1ad6a4dbb902a784dd070ddd11e7c62cf73ad89"
    retrieved: 2026-10-05
