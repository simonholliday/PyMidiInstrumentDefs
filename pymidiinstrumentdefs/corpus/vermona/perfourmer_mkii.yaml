midi:
  # "Select the MIDI-channel (1…16) using the SELECT/SEQ control." (manual p. 25), once for each
  # synthesiser channel; see the parts.
  channels: [1, 16]
  # Received for the LFOs: the MIDI CH LED blinks "to indicate clock-reception." (manual p. 18).
  # Nothing is said to be sent: the MIDI connections are an input and a thru (manual p. 23).
  clock: receives
  # NOT RECORDED: `transport`, `program_change`, `nrpn`, `sysex` and `mode` (channel-mode messages),
  # which no page mentions. `control_change` is left unset; see the account.

voice:
  # Except where a synthesiser channel's OCTAVE is at HI or LO, when its oscillator "doesn't respond
  # to incoming pitch information." (manual p. 8), a panel setting.
  addressing: pitches
  # Four synthesiser channels with a voice each, stated on the part below; see the account.
  polyphony_shared: false
  velocity:
    # To the VCA envelope's amount, switched per synthesiser channel by edit parameter 4
    # (manual p. 14; manual p. 29).
    note_on: received
  # "(channel) after touch data" (manual p. 29), to the cutoff, by edit parameter 3.
  aftertouch: channel
  # NOT RECORDED: `note_range`, `pitch_bend` (the pitch bender is received, by edit parameter 1, and
  # neither its range nor whether that is settable is given) and note-off velocity.

parts:
  # **THE FOUR SYNTHESISER CHANNELS**, each assigned a MIDI channel (manual p. 25) and each one
  # voice; combining them is a setting, set out in the account, and in the Duo modes all four answer
  # on channel 1's.
  synth_channel:
    label: Synthesizer Channel
    count: 4
    channel: assigned
    receives: [notes, controls]
    addressing: pitches
    polyphony: 1

controls:
  # "the modulation wheel (MIDI CC #1)" (manual p. 7), to the square wave's pulse width, switched
  # per synthesiser channel by edit parameter 2 (manual p. 29). Received only: the MIDI connections
  # are an input and a thru (manual p. 23).
  modulation_wheel: {label: Modulation Wheel, cc: 1, part: synth_channel, direction: receives}
