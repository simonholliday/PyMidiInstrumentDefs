midi:
  # **THE TEN PARTS ARE ON CHANNELS 1 TO 10 AND NOTHING SETS A BASE.** The chart crosses Basic
  # Channel in the Recognized column and stars it in the Transmitted one, and says what it means
  # instead in the Velocity row's remark: "n=0 - 9 (Channel 1 - 10 = Parts 1 - 10)" (chart). So
  # the base is 1 and cannot be anything else, and the part below - ten instances from an offset
  # of 0 - is what puts them on 1 to 10. **This is `korg/volca_drum`'s settled reading applied to
  # the same maker's same row**: the cross means the player cannot change it, not that there is
  # none, because a device whose recognised mode is 3 and which answers on ten channels has a
  # basic channel.
  channels: [1, 1]
  # `3` in the Recognized column of the Mode row - OMNI OFF, POLY - with the Transmitted box
  # crossed and Messages crossed both ways (chart).
  mode: 3
  # Crossed transmitted and circled recognized, under footnote `*2` (chart). The instrument has
  # no MIDI OUT, so nothing it does travels outward; SYNC OUT is a 3.5 mm pulse jack and not MIDI.
  clock: receives
  # The System Real Time Command row is crossed transmitted and circled recognized, under the
  # same footnote (chart). **Song Position is crossed in both columns and that row is the one the
  # 2019 firmware note calls into question** - see the account.
  transport: receives
  program_change:
    # Crossed in both columns (chart), so this instrument neither answers to a program change nor
    # sends one. `korg/volca_drum` answers to them; this one does not, which is the second thing
    # the two siblings disagree about.
    receives: false
    sends: false
  # Crossed in both columns (chart): a checked absence rather than a silence.
  sysex: false
  # NOT RECORDED, NRPN: neither `NRPN` nor `RPN` nor `Registered Parameter` appears on the chart
  # or in either manual part, swept with the text squashed.

parts:
  # **TEN PARTS ON TEN CHANNELS, WITH NOTHING TO SET**: "n=0 - 9 (Channel 1 - 10 = Parts 1 - 10)"
  # (chart), and from the player's side "Selecting a part: FUNC button + step buttons 1 to 10"
  # (manual_2 p. 1). They are one part with ten instances rather than ten parts, because the chart
  # gives them one map between them and the channel is the only thing that tells them apart -
  # which is exactly how `korg/volca_drum` records its six.
  part:
    label: Part
    count: 10
    channel_offset: 0
    # A note reaches the part whose channel carried it and the note number means nothing: the
    # chart recognises 0 to 127 and remarks "Each sound does not correspond to a note number."
    # (chart). So this is a part that takes notes and reads nothing from their number: `any`.
    addressing: any
    receives: [notes, controls]

voice:
  addressing: any
  # `0 - 127` in the Recognized column, with the Transmitted column starred and True Voice
  # starred in both (chart).
  note_range: [0, 127]
  # **EIGHT, SHARED ACROSS THE TEN PARTS**: "Sound generators: PCM sound sources (maximum of 8
  # simultaneous notes), digital reverb, analog isolator" (manual_2 p. 1). Ten parts over eight notes,
  # so the parts cannot all sound at once.
  polyphony: 8
  polyphony_shared: true
  velocity:
    # **IGNORED, AND THE CROSS IS WHAT SAYS SO.** The Note On row is crossed in both columns with
    # the message format printed beside the cross - "9n, V=1 - 127" (chart) - which is what the
    # instrument answers to rather than what it does with it. See the account for why that cross
    # is readable: the same row is a circle on one sibling's chart and a cross on another's.
    note_on: ignored
    # Crossed in both columns (chart).
    note_off: false
  # Crossed in all four boxes - polyphonic and monophonic, transmitted and recognized (chart).
  aftertouch: none
  # NOT RECORDED, the pitch bend, because there is none: the chart crosses it in both columns, so
  # there is no range to state and no block to state it in. `korg/volca_fm` differs here - its
  # chart marks pitch bend as answered to - which is the third thing these siblings disagree
  # about.

groups:
  sample: Sample
  tone: Tone
  pitch_eg: Pitch envelope
  amp_eg: Amplifier envelope
  mix: Level and pan

controls:

  # **ELEVEN NUMBERS, ALL RECEIVED AND NONE SENT**, each carrying footnote `*1`: "Received when
  # global parameter MIDI RX ShortMessage is set to ON." (chart). **That parameter ships On**
  # (manual_2 p. 1), so these work out of the box and a player can switch all eleven off at once,
  # which is a thing no other instrument in this corpus has a single switch for.
  #
  # Two of the eleven are the numbers the MIDI standard assigns - 7 for level and 10 for pan -
  # and the other nine are this maker's own, running 40 to 48 with no gap.

  # mix (2)
  level:              {label: LEVEL, cc: 7, group: mix, direction: receives}
  pan:                {label: PAN, cc: 10, group: mix, direction: receives}

  # sample (3)
  sample_start_point: {label: SAMPLE START POINT, cc: 40, group: sample, direction: receives}
  sample_length:      {label: SAMPLE LENGTH, cc: 41, group: sample, direction: receives}
  speed:              {label: SPEED, cc: 43, group: sample, direction: receives}

  # tone (1)
  hi_cut:             {label: HI CUT, cc: 42, group: tone, direction: receives}

  # pitch_eg (3)
  pitch_eg_int:       {label: PITCH EG INT, cc: 44, group: pitch_eg, direction: receives}
  pitch_eg_attack:    {label: PITCH EG ATTACK, cc: 45, group: pitch_eg, direction: receives}
  pitch_eg_decay:     {label: PITCH EG DECAY, cc: 46, group: pitch_eg, direction: receives}

  # amp_eg (2)
  amp_eg_attack:      {label: AMP EG ATTACK, cc: 47, group: amp_eg, direction: receives}
  amp_eg_decay:       {label: AMP EG DECAY, cc: 48, group: amp_eg, direction: receives}
