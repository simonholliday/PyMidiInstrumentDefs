definition: 1

model:
  manufacturer: Arturia
  name: MicroFreak
  # The file's own front matter says "Product version: 4.0.1", revision date 9 September
  # 2022, and that is what this records. Arturia names the same file 4.0.3 on its resources
  # page and serves a separate, earlier 4.0.1 file (146pp, revised 26 October 2021) whose
  # front matter also says 4.0.1, so the version in the name and the version in the document
  # disagree and the document is quoted.
  # THE FIRMWARE 5 MANUAL HAS BEEN READ, and this definition describes firmware 5 because
  # of what it says rather than because its file name says 5. Arturia names that file
  # microfreak_Manual_5_0_1_EN.pdf and its front matter says "Product version: 5.0.0",
  # revision date 6 July 2023, which is the same disagreement between name and document
  # that the 4.0.3 file has. The document is quoted, as before.
  # IT WAS MISSING AND THEN IT WAS NOT, which is worth recording because this file said so
  # for a while: on 2026-10-01 every 5.x manual address on Arturia's CDN answered 404
  # NoSuchKey, checked while the resources page below was being saved. Arturia uploaded the
  # English one at 08:50 GMT that same morning, which its server reports as the object's
  # last-modified time, and it has served normally since. The other four language editions
  # were not rechecked.
  # The two editions carry the same control-change map: Appendix D's 21 rows were read from
  # the firmware 5 manual and compared with this file's, and every name and every number is
  # identical. The MIDI chapter is word for word the same in both, including the two
  # contradictions recorded below, and so is Appendix A. What firmware 5 changed is not in
  # any of them: four new engines, a snappier envelope option, a new key/arp modulation
  # option, and preset slots "increased from 384 to 512" (fw 5 manual, printed p. 11).
  firmware: "5.0.0"

source: >-
  User manual (137pp), the edition Arturia names 4.0.3: pp. 10, 18, 35, 43, 58, 61,
  64, 66, 69, 77-79, 88-90, 92, 108-111, 113-115, 128-129.
  The control-change map is Appendix D, "CC# VALUES", pp. 128-129, whose two columns
  are Parameter | CC number. It prints no values, no band boundaries, no 14-bit pairs
  and no NRPNs, so each control here carries the maker's own name and its number and
  claims nothing else; p. 111 is where the manual says CC# codes run 0-127. Arturia
  publishes no MIDI implementation chart for this instrument, so the user manual is
  the whole of what its maker documents.
  The manual contradicts itself in several places. The two that bear on a number here
  are followed to the table and recorded in comments below: p. 110 says there are 20
  CC# codes where Appendix D lists 21, and p. 111 calls CC 5 the Cycling Envelope's
  Rise where Appendix D gives 5 to Glide and 102 to Rise. Four more are recorded here
  because nothing in the file rests on them, and two others sit beside the facts they
  bear on, at CC 64 and at the bend range. The four: p. 108 says it transmits on all
  channels by default where p. 109 says channel 1, and the Utility table offers no
  "All" value for the output channel at all; p. 78 says notes arriving at MIDI In
  have "the same priority" as the keyboard's and, four lines on, that the keyboard is
  "first in line, then incoming MIDI notes"; the Utility table's value lists for Output
  dest and for the tempo source (p. 89) are not the lists the same settings are given
  in the MIDI Control Center prose (p. 92); and p. 78 has aftertouch and velocity both
  transmitted where everywhere else they are alternatives.
  NOT RECORDED, and marked in place: the note range as numbers, since p. 35 gives it
  as "C-2 to G8", p. 64 calls the whole pitch range eight octaves, and the manual never
  says which note name is which note number;
  whether note-on velocity or aftertouch arriving over MIDI does anything, since every
  mention of either is about the keyboard generating it; whether its aftertouch is
  channel or polyphonic; and program change, bank select, NRPN and SysEx, which the
  manual never mentions at all - searched for by name across every page in two
  readings, with no hit. That silence is not a checked absence here: the same manual
  describes moving presets to and from a computer with the MIDI Control Center (p. 88)
  without ever calling that SysEx, so what it leaves out is not thereby absent from the
  instrument.
  THE FIRMWARE 5 MANUAL AGREES WITH ALL OF IT. Its Appendix D, printed pp. 141-142 of a
  151-page edition whose front matter says product version 5.0.0, holds the same 21 rows
  with the same names and the same numbers, compared row by row rather than by eye. Its
  MIDI chapter is word for word what is quoted above, contradictions included, and its
  Appendix A is the same. So the numbers below describe both editions, and the page
  citations here are the 4.0.3 edition's throughout, because that is the file they were
  read from.
  Also not recorded, because the format has no way to say it: Appendix A, pp. 113-115,
  gives value bands for CC 10, CC 12 and CC 13 that hold only while the Speech
  oscillator is the selected type - the same three controllers mean something different
  under each of the oscillator types.

