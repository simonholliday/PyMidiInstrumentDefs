    # The downloads page links this and holds none of it, so it was not read until 2026-10-11.
    # It lists the changes of every system from 1.0.1 to 1.4.1, and four entries are quoted in
    # this file: the 1.4.1 fix to the subtracks' NRPNs, which the header quotes; the free choice
    # of a track's channel in 1.4.0 and the two pedals in 1.3.0, which the source account quotes;
    # and, among the fixes of 1.1.0, "The device did not handle NRPN data." (release_notes). The
