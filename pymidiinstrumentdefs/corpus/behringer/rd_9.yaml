    # the covers none. English throughout. Made with InDesign on 2022-01-07. Its file name carries
    # `P0DG6`, where the page's product code is `0704-AAB`.
    page_offset: 0
  guide:
    kind: manual
    title: Quick Start Guide RD-9
    edition: V 4.0
