    retrieved: 2026-10-06
    # **A SCAN WITH NO TEXT LAYER**: 43 sheets, one image each, no fonts. Every quotation here
    # was read off a rendered page, and the quotation checker reports them unchecked.
    # Roland's own link is plain HTTP, as it is for this maker's other archived manuals. The
    # same bytes are served over HTTPS from
    # https://static.roland.com/assets/media/pdf/TR-909_OM.pdf, which was fetched and compared
    # byte for byte; the address above is the one the archive page actually carries.
    # **Printed page = sheet + 1**, because the cover and the contents sheet carry no folio.
    # Checked at printed 6, 38, 39 and 41. The MIDI page is printed 38 and is one page.
    page_offset: -1
  archive:
    kind: web_page
    title: "Roland - Support - Manual Archive"
    landing: "https://www.roland.com/us/support/manual_archive/"
    url: "https://www.roland.com/us/support/manual_archive/"
    sha256: aa08cc61d2b474998265e8e0c893154f7145dfdb48d2726e8478c90e2558b499
    retrieved: 2026-10-02
    paginated: false
    # **Cited for an absence, and it is the maker's own list rather than a search.** 457
    # documents, 38 of them titled `MIDI Implementation`, and ten TR drum machines of which
    # every one is an owner's manual and nothing else. It is also the only place Roland offers
    # this manual at all: the global support page for the product is an empty shell.
    # Saved once for this maker under `_downloads` rather than once per instrument, by
    # `roland/juno_106` on the date above. A fetch four days later returned **the same visible
    # text byte for byte** and different markup, so the date is the saving and not a claim that
    # nothing has moved since.

midi:
  # TWO CHANNELS AND SIXTEEN KEYS TO SET THEM WITH. Each is set by pressing "the appropriate Main
  # Key" (manual p. 38) with a modifier, and the specifications list "Main Keys (1 to 16)"
  # (manual p. 39) - which is the whole of the evidence for this span, joined across two pages of
  # one document because neither states it alone.
  # **A receiving channel of nought is omni rather than a channel**, and the instrument powers up
  # on it while transmitting on 11. Neither default is recorded, because this field holds a span.
  channels: [1, 16]
  # SOMEBODY LOOKED AND FOUND NONE. The maker's list of what "can be communicated" (manual p. 38)
  # names seven kinds of message in its own words and a control change is not among them, nor is
  # any controller number printed anywhere in 43 sheets. That is a checked absence; what it is
  # not is a claim that the instrument ignores every controller, only that Roland published none.
  control_change: none

voice:
  # NOT RECORDED: how a note addresses this instrument. Its eleven sound sources are listed in the
  # specifications and "Rhythm Pattern" (manual p. 38) is one of the seven things MIDI carries
  # here - but **no page says which note reaches which drum**, or whether a note reaches one at
  # all, so both `addressing` and `note_range` would be invented.
  # NOT RECORDED EITHER: velocity, although `Dynamics` is in that same list (manual p. 38). What
  # the list establishes is that dynamics travel, not which direction nor in what message.
