midi:
  # **TWO BY DEFAULT, WHICH IS AN ODD NUMBER TO SHIP ON** and is what both documents say: the
  # chart prints `2` in the transmitted and recognized default boxes and marks the row
  # "Memorized", and the manual gives "(default: C 2)" (manual). "1-16, OFF" either way (chart),
  # and the manual gives the third state: "MIDI messages of all channels are received. The MIDI
  # transmit channel will be 2." (manual) - so an omni TB-3 still transmits on 2, exactly as an
  # omni TR-8 still transmits on 10.
  channels: [1, 16]
  # **FOUR, WHICH IS OMNI OFF AND MONO**, default and the only value either way (chart). The same
  # row `roland/tr_8` carries, and here it suits the instrument: a bass line synthesizer.
  mode: 4
  # **BOTH WAYS ON THE CHART, AND THE MANUAL NAMES THE SETTING THAT CHOOSES.** Clock is marked in
  # both columns; the manual's `MIDI Clock Source` is `AUTO`, "If MIDI clock is being input to the
  # MIDI IN connector or the USB port, the TB-3's tempo will automatically synchronize to MIDI
  # clock." (manual), against `INTERNAL`, and "If MIDI clock is being simultaneously input from
  # the MIDI IN connector and from the USB port, the USB port takes priority." (manual).
  clock: both
  # **SENT AS START AND STOP, RECEIVED AS ALL THREE** (chart) - continue is crossed transmitted
  # and marked in the `Recognized` column, with the footnote "The same processing will be carried out as when
  # Start is received." (chart). The manual says the same from the other end: "It can also receive
  # MIDI Start (FA) and MIDI Stop (FC) to start/stop itself." (manual), and never mentions
  # continue, which is the half the chart adds.
  transport: both
  program_change:
    # **RECEIVED AND NEVER SENT**, crossed in the transmitted column (chart).
    receives: true
    sends: false
    # `0-127` in the True Number row (chart). A count of what a program change can select, not a
    # count of patterns the panel reaches.
    presets: 128
  # **RECEIVED AND NEVER SENT** - crossed transmitted and marked in the `Recognized` column (chart) - and the whole
  # six-sheet `MIDI Implementation` is what it receives: a model ID of "00H 00H 7BH"
  # (implementation p. 2), parameter addresses for the controller block, the patch, and eleven
  # effects.
  sysex: true
  # NOT RECORDED, NRPN: no document mentions it. Swept across all eight sheets of all three
  # documents rather than noticed on one, which is rank 99's rule.

voice:
  # Notes sound pitches on one monophonic bass line, not one drum per number.
  addressing: pitches
  # **12 TO 108 RECEIVED, 12 TO 84 SENT** (chart), which is the one row here where the two columns
  # differ by more than a mark. The True Voice row is struck through transmitted and gives
  # `12-108` recognized, and the remark reads "C0-C6 12-84" (chart) - so the span this instrument
  # plays from its own pad is two octaves narrower than the span it answers to. The received
  # range is recorded, because this field says what the instrument answers to.
  note_range: [12, 108]
  # NOT RECORDED, the polyphony. **`Mode 4` is OMNI OFF and MONO and that is a statement about
  # channel mode rather than a count of voices**, and neither "monophonic" nor "polyphony"
  # appears anywhere in the three documents. A bass line synthesizer is very likely one voice and
  # no document here says so.
  velocity:
    # Both ways, with the status bytes given: "o 9nH v=64,127" (chart) transmitted, and marked
    # in the recognized column. **The two transmitted values are the pad's two states** rather
    # than a range.
    note_on: both
    # A real note off, sent and recognized - `o 8nH v=64` (chart) - where `roland/tr_8` sends a note
    # on with a velocity of nothing instead.
    note_off: true
  # **NONE, AND THE CHART CROSSES BOTH KINDS IN BOTH DIRECTIONS**: key's and channel's,
  # transmitted and recognized (chart). **The manual's `Pad Aftertouch Sensitivity` is not a
  # contradiction of this** - see the comment above the definition. Pad pressure leaves the
  # instrument as controller 1.
  aftertouch: none
  # NOT RECORDED, the pitch bend, **although this instrument has one**: the chart marks it in both
  # columns and names the axis it comes from, "(XY PLAY) PAD X" (chart), so its pitch bend is a
  # finger position on a touch pad rather than a wheel. No document gives a depth for it and
  # neither says whether the depth can be set, so there is nothing here that either field of this
  # block could carry without inventing it. `roland/tr_8` leaves the same block out for the
  # opposite reason - its chart crosses pitch bend in all four boxes.

groups:
  pad: XY pad
  filter: Filter
  pattern: Pattern
  scatter: Scatter
  tone: Tone

controls:

  # **THIRTEEN NUMBERS OFF ONE CHART, SEVEN OF THEM CONFIRMED BY A SECOND DOCUMENT, AND ELEVEN OF
  # THE THIRTEEN TRAVEL BOTH WAYS.** The two that do not are the scatter controls, crossed in the
  # transmitted column and marked in the recognized one (chart) - **so a TB-3 can be told to
  # scatter and will never tell anybody that it is.** That is the same pair of numbers, 68 and 69,
  # that `roland/tr_8` refuses to transmit for the same two parameters, which is as close to a
  # maker's habit as this corpus has caught Roland in.
  #
  # **THE FOURTEENTH ROW OF THE CHART IS NOT A CONTROL.** `0, 32` carries footnote `*1`,
  # "CC#0: Bank Number, CC#32: 0" (chart) - bank select, which is addressing machinery and not a
  # parameter, by the ruling `roland/fantom_6_7_8` set at rank 77 and every Roland since has
  # followed.
  #
  # The pad is three axes and they leave by three different routes: X as pitch bend, Y as
  # controller 11, and pressure as controller 1. The names in brackets are the chart's own and
  # say which of the pad's two modes each axis belongs to.

  # pad (4)
  pad_z:          {label: PAD Z, cc: 1, group: pad}
  xy_play_pad_y:  {label: (XY PLAY) PAD Y, cc: 11, group: pad}
  env_mod_pad_x:  {label: (ENV MOD) PAD X, cc: 12, group: pad}
  env_mod_pad_y:  {label: (ENV MOD) PAD Y, cc: 13, group: pad}

  # tone (3)
  accent:         {label: ACCENT, cc: 16, group: tone}
  effect:         {label: EFFECT, cc: 17, group: tone}
  tuning:         {label: TUNING, cc: 104, group: tone}

  # filter (2) - both restated by the system-exclusive document; see the account above
  resonance:      {label: RESONANCE, cc: 71, group: filter}
  cutoff:         {label: CUTOFF, cc: 74, group: filter}

  # pattern (2)
  pattern_slide:  {label: PATTERN SLIDE, cc: 102, group: pattern}
  pattern_accent: {label: PATTERN ACCENT, cc: 103, group: pattern}

  # scatter (2) - received and never sent
  scatter_type:   {label: SCATTER TYPE, cc: 68, group: scatter, direction: receives}
  scatter_depth:  {label: SCATTER DEPTH, cc: 69, group: scatter, direction: receives}
