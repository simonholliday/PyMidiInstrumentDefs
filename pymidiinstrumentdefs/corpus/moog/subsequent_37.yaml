  # specifications line as "6/12/18/24 dB/Oct Filter Slopes", so the state names drop the
  # sign the way Moog does. All four are attenuation; none is a boost.
  filter_slopes_poles:
    label: Filter Slopes (Poles)
    cc: 109
    nrpn: 502
    values: {"six_db": 0, "twelve_db": 32, "eighteen_db": 64, "twenty_four_db": 96}
    nrpn_range: [0, 3]
    group: filter

  # NOT ONE OF THIS GROUP HAS AN NRPN, and it is the published chart that stops rather than
  # this instrument that lacks them. The NRPN chart gives the filter envelope twelve rows
  # and then ends at 524, four rows into reserved space; p. 51 lists twelve amplifier
  # envelope parameters by name, including a Sync, a Loop and a Latch this group has no way
  # to reach. So the ten below are all of this envelope that Moog publishes a number for,
  # and the five that match the filter envelope's NRPN-only parameters are not among them.
  # ITS CLOCK DIVISION IS ONE OF THEM, and the manual describes it as fully as the two that
  # do have numbers: "This specifies the amplifier envelope's repeating relationship to the
  # internal or MIDI clock ... Please refer to the chart on page 52 for a list of available
  # clock divisions" (p. 42). Three parameters are sent to that table - the arpeggiator's
  # clock division on p. 40, the filter envelope's on p. 41 and this one - and this is the
  # one of the three that cannot be reached over MIDI at all.
  amp_eg_attack_time:
    label: Amp EG Attack Time
    cc: 28
    lsb: 60
    range: [0, 16383]
    group: amp_envelope
  amp_eg_decay_time:
    label: Amp EG Decay Time
    cc: 29
    lsb: 61
    range: [0, 16383]
    group: amp_envelope
  amp_eg_sustain_time:
    label: Amp EG Sustain Time
    cc: 30
    lsb: 62
    range: [0, 16383]
    group: amp_envelope
  amp_eg_release_time:
    label: Amp EG Release Time
    cc: 31
    lsb: 63
    range: [0, 16383]
    group: amp_envelope
  amp_eg_kb_amt:
    label: Amp EG KB Amount
    cc: 80
    group: amp_envelope
  amp_eg_reset:
    label: Amp EG Reset
    cc: 83
    values: {"off": 0, "on": 64}
    group: amp_envelope
  amp_eg_vel_amt:
    label: Amp EG Velocity Amount
    cc: 87
    group: amp_envelope
  amp_eg_delay:
    label: Amp EG Delay
    cc: 104
    group: amp_envelope
  amp_eg_hold:
    label: Amp EG Hold
    cc: 106
    group: amp_envelope
  amp_eg_multi_trig:
    label: Amp EG Multi Trigger
    cc: 113
    values: {"off": 0, "on": 64}
    group: amp_envelope
