  track_1_mute:                  {label: Mute (>0 mutes trk), cc: 12, direction: receives, part: track_1}
  track_1_machine_parameter_1:   {label: Machine parameter 1, cc: 16, part: track_1, group: synthesis}
  track_1_machine_parameter_2:   {label: Machine parameter 2, cc: 17, part: track_1, group: synthesis}
