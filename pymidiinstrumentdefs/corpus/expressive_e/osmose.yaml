midi:
  # "MIDI channels 1-14" in each direction, with the remark "MPE channel master 1" (midi_impl
  # p. 1). The other two are spoken for: "Individual notes must be sent on MIDI channels #2
  # to #14 (#2 to #12 for some presets). The Master Channel, according to the MPE standard,
  # is #1. MIDI channels #15 & #16 are used for communication with the Haken Editor
  # exclusively, so make sure to not send note data on these channels" (sound_engine_input).
  channels: [1, 14]
  # MPE: the voices are spread across channels, one note to a channel, rather than sounding
  # on one. Everything else about it is in the comment below voice, because a boolean cannot
  # carry any of it.
  per_voice_channels: true
  # BOTH WAYS. Its keyboard plays other instruments in MPE, the `mpe` configuration being the one
  # that "sends MIDI messages according to the MIDI Polyphonic Expression standard" (manual p. 51),
  # and its own engine is played the same way from outside, "allowing you to play the EaganMatrix
  # from an external DIN MIDI device using MPE data" (manual p. 88).
  mpe: both
  # RECEIVES ONLY, AND THE MAKER'S TWO DOCUMENTS DISAGREE ABOUT IT. The chart marks MIDI
  # Clock, Song Position Pointer, Start, Continue and Stop as both transmitted and
  # recognised. The manual says the opposite in as many words: "Attention: Osmose is not
  # capable of sending its own internal clock" (p. 45). The manual is followed here, for
  # three reasons recorded rather than re-argued: its statement is about this exact question; the midi i/o tab offers three ports to take clock *from* and
  # no way to send any (p. 87); and this chart's transmit column is demonstrably unreliable,
  # since it marks CC 83 and 84 as answering to nothing while printing a range for both.
  # DAW Control Mode does drive a DAW's "Play, Stop, Record, and Metronome" (p. 72), over
  # port 4 by a DAW protocol, which the manual nowhere calls MIDI transport.
  clock: receives
  transport: receives
  program_change:
    # "Osmose expects MIDI Bank Select (CC#0) and Program Change (PC) messages on its USB
    # MIDI Port 2 input (the sound engine port)" (preset_changes), or on the DIN input with
    # din mode set to dsp in, dsp in/out or cvc. The chart agrees on its CC 0 row and
    # contradicts itself on p. 1, where "Bank Select response?" is answered No - with the
    # transmit cell left blank, where every other row of that section is filled.
    receives: true
    # Not sent: the chart marks program change as recognised and not transmitted, and no
    # setting anywhere in the manual sends one.
    sends: false
    # COUNTED FROM THE MAKER'S OWN TWO LISTS, read as table rows because the page renders
    # each preset as four cells and a line-by-line reading interleaves them: 529 under
    # "Factory sounds (firmware 1.0 and higher)" across bank select 30 to 34, and 80 under
    # "Expansion 01 sounds (firmware 2.1 and higher)" on bank 34, which continues from the
    # first list at program 17. This is what the maker names and numbers, not a ceiling:
    # the product page says "up to 2048 preset slots", user presets are addressable too,
    # and that same page says "580 factory presets", which is neither 529 nor 609.
    presets: 609
  # "NRPNs (Yes/No) No No", and RPN 00 to 05 the same (midi_impl p. 1). The two NRPN and two
  # RPN controller numbers are printed in the control table and marked No both ways as well,
  # which is the same answer twice over.
  nrpn: none
  # Every system exclusive row of the chart is No in both directions, the whole Universal
  # block and "Manufacturer or Non-Commercial System Exclusive" with it. Worth knowing that
  # the Haken Editor nonetheless talks to the sound engine over MIDI channels 15 and 16
  # (sound_engine_input), on a port the chart does not describe, so this is an answer about
  # port 2 and not about the instrument's every socket.
  sysex: false

# MPE, WHICH THE FORMAT HOLDS AS A FLAG AND NOT MUCH MORE. The engine is Haken
# Audio's and takes Haken's extension of the standard: "MPE+ is what Haken Audio calls their
# optimized extension to the MPE standard (MIDI Polyphonic Expression)" (sound_engine_input).
# The master channel is 1 and member channels are 2-14, narrowing to 2-12 on some presets.
# CC 87 carries "LSB value of Aftertouch or Pressure (see MPE+)" (chart), which is the extra
# resolution MPE+ adds. Pressure is required rather than optional: "To produce a sound in the
# first place, you are always required to send Channel Pressure messages (sometimes called
# "mono aftertouch") alongside your Note On messages", because "a constant flow of Channel
# Pressure messages is used to describe a sound's envelope, specifically its attack
# trajectory" (sound_engine_input). None of that fits in a boolean, so it is here.

voice:
  addressing: pitches
  # "polyphony up to 24 voices" (product_page). The manual never states it, in 92 pages:
  # its only voice counts are of other instruments the Osmose is driving. The hedge is the
  # maker's, and 24 is recorded as the number they publish.
  polyphony: 24
  # THE KEYBED IS THE INSTRUMENT'S WHOLE POINT, and the manual puts it in three axes:
  # "extended polyphonic pressure", "hi-resolution polyphonic aftertouch" and "polyphonic
  # pitch bending" (p. 14). They reach the engine as MPE+ on member channels, which is why
  # the chart answers No to poly key aftertouch while the keyboard is polyphonic throughout.
  aftertouch: channel
  velocity:
    # IGNORED ON THE PATH THE INSTRUMENT IS BUILT FOR, AND NOT ON THE OTHER, which one field
    # cannot say. The chart marks note-on and note-off velocity No in both directions and
    # remarks "MPE+" against each; the article says why: "MIDI Velocity ("MPE Strike") is
    # ignored entirely by the EaganMatrix's when it comes to the MPE implementation" - the
    # stray apostrophe is theirs. Driven instead by legacy mono-channel MIDI on channel 1,
    # "MIDI Velocity will be interpreted as a first Pressure (Z) data value for the
    # respective note to start with", and on that path it is channel pressure that is
    # "ignored completely" while "Polyphonic Key Pressure (Polyphonic Aftertouch) messages
    # can be used to modulate Pressure (Z) on a per-note basis over time"
    # (sound_engine_input). So aftertouch above and velocity here both record the MPE path,
    # which is the chart's scope, and the legacy path is the reverse of both.
    note_on: ignored
    note_off: false
  pitch_bend:
    # "Pitch Bend (Yes/No) Yes Yes" (midi_impl p. 1). The range is per preset and the manual
    # gives no number: the voice tab "features only one parameter: the pitch bend range of
    # the pitch slider" (p. 35), which bends every sounding note together, where the keys
    # bend one note each.
    programmable: true

groups:
  # THE MANUAL'S OWN TAB NAMES, which are its headings for the parts of the sound these
  # controls reach, printed in lower case as every heading in this manual is: "macros tab",
  # "global fx tab", "eq tab", "comp & drive tab", "voice tab" (manual p. 29) and
  # "mod/pedal tab" (manual p. 35). The word "tab" names the screen a group is on rather
  # than the group, so it is left off.
  # **AND THE MANUAL NAMES THAT LAST ONE TWICE, DIFFERENTLY.** Page 29 introduces the Synth
  # menu's tabs and calls it "assign tab", on a line reading "define the parameters controlled
  # by the modulation slider and the pedals" (manual p. 29). Page 35, where the tab is
  # described, heads it "mod/pedal tab" instead. **So citing page 29 for the name this file
  # uses was wrong**, and it stayed invisible for as long as the locator could not be parsed.
  # Page 29 also names a seventh, "save tab", which is an action rather than a part of the
  # sound, and is why "all six" was wrong twice over.
  # NOT THE MAKER'S WORD: "Program", for the one bank select row. The manual heads nothing
  # with a word for choosing a sound from outside, because the manual does not cover it.
  # NO GROUP FOR THE EQ, because no control below is in one: the chart gives CC 83 and 84
  # for the eq tab's tilt and frequency and marks both as neither sent nor received, so
  # there is nothing to put in it. See the comment at the end.
  program: Program
  macros: macros
  global_fx: global fx
  comp_drive: comp & drive
  mod_pedal: mod/pedal

controls:

  # ── Choosing a sound ──────────────────────────────────────────────────────────

  bank_select:
    label: Bank Select (MSB)
    cc: 0
    # The only row in the chart recognised but not transmitted, and the only remarked row
    # whose remark is the bare "range: [0-127]" without the master channel prefix.
    direction: receives
    group: program

  # ── The six macros, which are the sound ───────────────────────────────────────
  # "up to 6 sound macros that are predefined by the sound designers during preset
  # creation. A single macro can modulate multiple parameters in Osmose's modular sound
  # engine at once" (p. 29). So what each one does is a fact about a preset, not about the
  # instrument, and there is nothing here to name beyond the maker's own numbering. The
  # manual's examples of what they often reach are timbre, fmAmt, fmRatio, cutoff, envAmt,
  # envTime, modulation, structure, body and resonance (p. 30).

  macro_1:
    label: Macro 1
    cc: 12
    group: macros

  macro_2:
    label: Macro 2
    cc: 13
    group: macros

  macro_3:
    label: Macro 3
    cc: 14
    group: macros

  macro_4:
    label: Macro 4
    cc: 15
    group: macros

  macro_5:
    label: Macro 5
    cc: 16
    group: macros

  macro_6:
    label: Macro 6
    cc: 17
    group: macros

  # ── The global effect ─────────────────────────────────────────────────────────
  # "The 'global fx' tab allows creating of a sense of space by adding a global time-based
  # effect to the sound. The first parameter selects one of seven reverb/delay/echo
  # algorithms. The FX parameters will vary depending on the effect chosen" (p. 31). THE
  # ALGORITHM ITSELF HAS NO CONTROLLER NUMBER: the chart gives four numbered parameters and
  # a mix, and nothing for the choice of effect. Which four parameters they are therefore
  # depends on the algorithm - predelay, diffuse, LPF, HPF, damping and decay for the two
  # reverbs; depth, rate, feedback and time for the modulated delays; noise, offset,
  # feedback and time for the analog echo (pp. 31-32). The maker calls the section
  # "Recirculator" in the Haken Editor (p. 32).

  global_fx_parameter_1:
    label: Global FX Parameter 1
    cc: 20
    group: global_fx

  global_fx_parameter_2:
    label: Global FX Parameter 2
    cc: 21
    group: global_fx

  global_fx_parameter_3:
    label: Global FX Parameter 3
    cc: 22
    group: global_fx

  global_fx_parameter_4:
    label: Global FX Parameter 4
    cc: 23
    group: global_fx

  global_fx_mix:
    label: Global FX Mix
    cc: 24
    # "One parameter is always available: mix controls the dry/wet of the FX, the amount of
    # sound that passes through the FX" (p. 31).
    group: global_fx

  # ── The output stage ──────────────────────────────────────────────────────────
  # "The comp & drive tab lets you choose between two different output stages to round off a
  # sound" (p. 33), compressor or drive. Both have a pregain, an amount, a mix and a
  # postgain; the chart numbers the two gains and the compressor's mix, and neither amount.
  # "pregain sets the level that enters the compressor", and at high settings "an aggressive
  # distortion to the audio that is reminiscent of a wave folding effect"; "postgain changes
  # the overall volume of the sound" (p. 34).

  pre_gain:
    label: Pre Gain
    cc: 26
    group: comp_drive

  post_gain:
    label: Post Gain
    cc: 18
    group: comp_drive

  compressor_mix:
    label: Compressor Mix
    cc: 93
    # "comp. mix allows mixing the wet and dry signal of the compressor to achieve parallel
    # compression" (p. 34). The drive stage's own mix has no controller number.
    group: comp_drive

  # ── What a player's hands and feet reach ──────────────────────────────────────
  # "The 'mod/pedal' tab lets you choose the parameters that you control from the modulation
  # slider and the two pedal inputs. These are always global parameters that will influence
  # the sound as a whole, not on a per-note basis" (p. 35). What each reaches is a per-preset
  # assignment, so these two controls are the sources rather than destinations: "Pedal 1 is
  # assigned to Sustain by default. Pedal 2 and the Mod Slider will always control the same
  # parameter and are assigned to one of the sound macros by default" (p. 35), which is why
  # the chart names CC 1 for both the slider and pedal 2 and gives pedal 1 a number of its
  # own.

  mod_wheel_pedal_2:
    label: Modulation Wheel / Pedal 2
    cc: 1
    group: mod_pedal

  pedal_1:
    label: Pedal 1
    cc: 64
    # CONTINUOUS, THOUGH CC 64 IS CONVENTIONALLY A SWITCH, and the maker means it: the chart
    # gives it "range: [0-127]" like every other control here, the specification calls them
    # "2 continuous pedal inputs, assignable to sustain or synth parameters"
    # (product_page), and the manual explains what that is for. "The sustain and sostenuto
    # functions in Osmose work differently compared with regular keyboard instruments.
    # Usually, sustain takes the current pressure/position of the notes played and keeps
    # them in that state. On Osmose, Sustain, and Sostenuto are continuous controls that
    # allow fading and swelling sustained notes when moving the expression pedal" (p. 36).
    group: mod_pedal

# THE EQ'S TWO NUMBERS, RECORDED HERE RATHER THAN AS CONTROLS, because the chart will not
# have them: CC 83 "EQ tilt value" and CC 84 "EQ frequency" are marked No in both
# directions, yet carry the same "Master Channel (channel 1) range: [0-127]" remark as the
# eighteen rows that do answer, and the manual describes both as adjustable - "tilt:
# Positive values will lead to more highs and fewer lows" and "frequency: choice of the
# central frequency that defines the threshold between lows and highs" (p. 33). A number and
# a range are printed for two controls the chart says answer to nothing. Making them
# controls would assert what no document states, so they are not below, and the
# contradiction is recorded instead of resolved. The eq tab's third parameter, mix, has no
# controller number at all.
#
# TWO MORE PLACES THE CHART ARGUES WITH ITSELF, neither of them changing anything above.
# CC 74 "Aftertouch" is marked No both ways with the remark "Aftertouch values send on
# member channel" - the maker's "send" for "sent" - which says where aftertouch does go
# rather than that it goes nowhere, and agrees with p. 1 marking channel aftertouch Yes both
# ways. And note-on and note-off velocity are marked No in both directions for a keyboard
# whose every key is velocity-sensitive, with "MPE+" as the whole explanation; the article
# quoted under voice is what makes sense of it.
#
# THE MAKER'S OWN SPELLING, KEPT: the chart prints CC 87 as "MPE+ LSB Aftertouch / Presure",
# one s, while the same row's remark spells Pressure correctly.
