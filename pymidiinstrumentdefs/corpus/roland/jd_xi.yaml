midi:
  # The sound source chart's Basic Channel row: 1 to 16 as a default and as changed, both ways.
  # **AND THAT IS ABOUT THE INSTRUMENT RATHER THAN ABOUT ITS PARTS**, whose four channels are
  # fixed at 1, 2, 3 and 10 - see the parts below and the comment above the definition.
  # The sequencer's chart says something different in the same row, and it is worth knowing:
  # "Basic Channel Default Changed All channel x All channel 1-16 There is not specific basic
  # channel" (implementation p. 18). A sequencer records every channel.
  channels: [1, 16]
  # "Mode Default Messages Altered Mode 3 x ************** Mode 3 Mode 3, 4(M=1) *2"
  # (implementation p. 17) - mode 3 as the default both ways, with mode 4 also recognised and a
  # footnote on what happens to its voice count: "*2 Recognized as M=1 even if M1."
  # (implementation p. 17).
  mode: 3
  # **BOTH, AND THE TWO CHARTS DIVIDE IT BETWEEN THEM** - which is `roland/fantom_6_7_8`'s case
  # exactly. The sound source's chart crosses Clock transmitted and circles it recognised; the
  # sequencer's circles both: "System Real Time :Clock :Commands o o o *1 o *1" (implementation
  # p. 18). The owner's manual says the whole of it in one sentence: "The JD-Xi can transmit and
  # receive MIDI clock (F8) messages to synchronize its tempo." (manual p. 15).
  clock: both
  # The same division, and the same sentence continues: "It can also send and receive MIDI start
  # (FA) and MIDI stop (FC) messages to start or stop." (manual p. 15).
  transport: both
  program_change:
    # "Program Change : True Number o *1 ************** o *1 0-127 Program No.1-128"
    # (implementation p. 17). The `*1` is the footnote that applies to nine of this chart's
    # rows: "*1 o x is selectable (using System Exclusive Messages)." (implementation p. 17) -
    # so each of them can be switched off, and the sysex map carries `Receive Program Change`
    # and `Receive Bank Select` as the switches.
    receives: true
    sends: true
    # NOT RECORDED, the preset count. See the account: 1 to 128 is one bank and sixteen
    # bank-select combinations choose among sixteen banks, so a total would be arithmetic this
    # document does not do.
  # **SUPPORTED, AND THIS IS THE FIRST ROLAND HERE THAT IS.** The implementation devotes a
  # section to it and then lists the parameters: 21 of the controls below are addressed this way
  # rather than by a controller number. Its own description of the mechanism is worth a reader's
  # time - "Once an NRPN parameters has been specified, all Data Entry messages received on that
  # channel will modify the value of that parameter." (implementation p. 2) - because it means a
  # consumer must send the address and then the value, and should send an RPN null afterwards:
  # "To prevent accidents, it is recomended that you set RPN Null (RPN Number = 7FH/7FH) when
  # you have finished setting the value of the desired parameter." (implementation p. 2), typo
  # and all.
  nrpn: supported
  # Circled in both columns of both charts. Sheets 9 to 14 are a Parameter Address Map, which is
  # the bulk of the document, and the transmitted side carries a condition: `*3 Transmitted only
  # when "Transmitted Edit Data" is ON or RQ1is received.` (implementation p. 17) - a
  # sentence with a quotation inside it, given as an identifier rather than requoted.
  sysex: true

voice:
  addressing: pitches
  # The chart's recognised Note Number and its True Voice row both give 0 to 127 - the
  # instrument saying it sounds every note it answers to. **What it sends is narrower and is a
  # fact about the keys**: 0 to 108 transmitted, for a 37-key keyboard with a transpose.
  note_range: [0, 127]
  velocity:
    # "Velocity Note On Note Off o o o o" (implementation p. 17) - circled in all four cells, so
    # both a striking and a release velocity travel in both directions.
    note_on: received
    note_off: true
  # **BOTH KINDS RECEIVED, NEITHER TRANSMITTED, AND EACH CAN BE SWITCHED OFF.** The chart's
  # After Touch rows cross both transmitted cells and circle both recognised ones, each under
  # the `*1` footnote - and the sysex map names the switches, `Receive Polyphonic Key Pressure`
  # and `Receive Channel Press`. `poly` is the stronger of the two words this field holds, which
  # follows `roland/mc_707` and `roland/fantom_6_7_8`.
  aftertouch: poly
  pitch_bend:
    # Circled both ways under the `*1` footnote, and settable over the first of the three
    # registered parameters - 0 to 24 semitones. The document gives no factory depth, so
    # `semitones` is unrecorded and what is recorded is that it can be set.
    programmable: true

parts:
  # **FOUR PARTS ON FOUR FIXED CHANNELS, EXPRESSED AS OFFSETS FROM ONE BECAUSE THAT IS WHAT THIS
  # FORMAT HAS.** The channels are 1, 2, 3 and 10, stated by the owner's manual and settable
  # nowhere. `channel_offset` says a part's channel is derived from a base and cannot be set on
  # its own; the second half of that is exactly right here and the first half is a fiction, there
  # being no base to derive from because the base never moves. **The numbers a consumer sends
  # are right** - 1 + 0, 1 + 1, 1 + 2, 1 + 9 - and the fiction is recorded here rather than left
  # for somebody to find. One for the format specification's list of what it cannot say.
  digital_synth:
    label: Digital Synth
    count: 2
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
    # **TWO PARTS WITH ONE MAP**, on channels 1 and 2. Each is a SuperNATURAL Synth Tone of
    # three partials, and the 27 controls carrying this part are the three partials' nine
    # parameters - so a consumer addresses partial 2's cutoff on either channel with the same
    # controller, 103.
  analog_synth:
    label: Analog Synth
    channel_offset: 2
    addressing: pitches
    receives: [notes, controls, program_change]
    # **ONE TONE WITH ONE PARTIAL, TAKING THE FIRST ADDRESS OF EACH OF THE DIGITAL PART'S RUNS.**
    # So controller 102 is this part's whole cutoff where it is the first partial's on channels
    # 1 and 2 - the collision the `part` field exists for. It has one parameter the digital tone
    # has no counterpart for, a pulse width at NRPN 37.
  drum:
    label: Drum
    channel_offset: 9
    addressing: voices
    receives: [notes, controls, program_change]
    # **ITS OWN PARAMETERS ARE NOT CARRIED, AND THAT IS A DECISION RATHER THAN A GAP.** Four of
    # them, each addressed by the note it belongs to: `Cutoff | 36 - 72 | NRPN MSB:89, LSB:Note`
    # (implementation p. 14) and the same shape for Resonance at 92, Level at 64 and Envelope at
    # 119. **148 addresses stated as four rules**, and no page prints one of them. See the
    # comment above the definition.
    # Its 33 drum kits are reached by bank select 086/064 and program 001-033. The controllers
    # every part receives are carried for it, below, as `drum_`, all but portamento time.

groups:
  # **THE MIDI SPECIFICATION'S OWN SECTIONS FOR THE FIFTEEN IT NAMES**, which is what
  # `roland/fantom_6_7_8` does for the same maker's flat list - every one of those fifteen is a
  # standard assignment under its standard name. The other three groups are this instrument's own
  # divisions, because the Control Change Message List is written that way: a table per sound
  # engine and one for the effects.
  continuous: Continuous controllers
  switch: Switches and pedals
  sound: Sound controllers
  effects: Program effects
  partial: The digital synth's three partials
  analog: The analog synth

controls:

  # **THE CONTROLLERS EVERY PART RECEIVES, ONCE FOR EACH KIND OF PART**, as `digital_synth_`,
  # `analog_synth_` and `drum_`; see the account. **The drum part has no portamento time**: its
  # entry says "The Portamento Time parameter (TONE:COMMON) will change." (implementation p. 1),
  # and a drum kit's common block holds only its name and its level (implementation p. 13).

  # Continuous controllers ────────────────────────────────
  digital_synth_modulation:         {label: Modulation, cc: 1, part: digital_synth, group: continuous}
  digital_synth_portamento_time:    {label: Portamento Time, cc: 5, part: digital_synth, group: continuous}
  digital_synth_volume:             {label: Volume, cc: 7, part: digital_synth, group: continuous}
  digital_synth_panpot:             {label: Panpot, cc: 10, part: digital_synth, group: continuous}
  digital_synth_expression:         {label: Expression, cc: 11, part: digital_synth, group: continuous}
  analog_synth_modulation:          {label: Modulation, cc: 1, part: analog_synth, group: continuous}
  analog_synth_portamento_time:     {label: Portamento Time, cc: 5, part: analog_synth, group: continuous}
  analog_synth_volume:              {label: Volume, cc: 7, part: analog_synth, group: continuous}
  analog_synth_panpot:              {label: Panpot, cc: 10, part: analog_synth, group: continuous}
  analog_synth_expression:          {label: Expression, cc: 11, part: analog_synth, group: continuous}
  drum_modulation:                  {label: Modulation, cc: 1, part: drum, group: continuous}
  drum_volume:                      {label: Volume, cc: 7, part: drum, group: continuous}
  drum_panpot:                      {label: Panpot, cc: 10, part: drum, group: continuous}
  drum_expression:                  {label: Expression, cc: 11, part: drum, group: continuous}

  # Switches and pedals ───────────────────────────────────
  digital_synth_hold_1:             {label: Hold 1, cc: 64, part: digital_synth, group: switch}
  digital_synth_portamento:         {label: Portamento, cc: 65, part: digital_synth, group: switch}
  analog_synth_hold_1:              {label: Hold 1, cc: 64, part: analog_synth, group: switch}
  analog_synth_portamento:          {label: Portamento, cc: 65, part: analog_synth, group: switch}
  drum_hold_1:                      {label: Hold 1, cc: 64, part: drum, group: switch}
  drum_portamento:                  {label: Portamento, cc: 65, part: drum, group: switch}

  # Sound controllers ─────────────────────────────────────
  digital_synth_resonance:          {label: Resonance, cc: 71, part: digital_synth, group: sound}
  digital_synth_release_time:       {label: Release Time, cc: 72, part: digital_synth, group: sound}
  digital_synth_attack_time:        {label: Attack Time, cc: 73, part: digital_synth, group: sound}
  digital_synth_cutoff:             {label: Cutoff, cc: 74, part: digital_synth, group: sound}
  digital_synth_decay_time:         {label: Decay Time, cc: 75, part: digital_synth, group: sound}
  digital_synth_vibrato_rate:       {label: Vibrato Rate, cc: 76, part: digital_synth, group: sound}
  digital_synth_vibrato_depth:      {label: Vibrato Depth, cc: 77, part: digital_synth, group: sound}
  digital_synth_vibrato_delay:      {label: Vibrato Delay, cc: 78, part: digital_synth, group: sound}
  analog_synth_resonance:           {label: Resonance, cc: 71, part: analog_synth, group: sound}
  analog_synth_release_time:        {label: Release Time, cc: 72, part: analog_synth, group: sound}
  analog_synth_attack_time:         {label: Attack Time, cc: 73, part: analog_synth, group: sound}
  analog_synth_cutoff:              {label: Cutoff, cc: 74, part: analog_synth, group: sound}
  analog_synth_decay_time:          {label: Decay Time, cc: 75, part: analog_synth, group: sound}
  analog_synth_vibrato_rate:        {label: Vibrato Rate, cc: 76, part: analog_synth, group: sound}
  analog_synth_vibrato_depth:       {label: Vibrato Depth, cc: 77, part: analog_synth, group: sound}
  analog_synth_vibrato_delay:       {label: Vibrato Delay, cc: 78, part: analog_synth, group: sound}
  drum_resonance:                   {label: Resonance, cc: 71, part: drum, group: sound}
  drum_release_time:                {label: Release Time, cc: 72, part: drum, group: sound}
  drum_attack_time:                 {label: Attack Time, cc: 73, part: drum, group: sound}
  drum_cutoff:                      {label: Cutoff, cc: 74, part: drum, group: sound}
  drum_decay_time:                  {label: Decay Time, cc: 75, part: drum, group: sound}
  drum_vibrato_rate:                {label: Vibrato Rate, cc: 76, part: drum, group: sound}
