midi:
  # `1 - 11` in the chart's Basic Channel row, with the Changed row crossed in both columns - so
  # eleven channels, one per track, and not one of them settable.
  channels: [1, 11]
  # Default 3 recognised, and `3,4(m=1)` under Mode Messages, where the chart's own footnote
  # reads `*1 m is always treated as "1" regardless of its value.` - so mode 4 collapses to one
  # voice. Nothing is transmitted: that column is crossed.
  mode: 3
  # Both ways, each gated by a setting the chart names: `*4 If clock out is on and SEQTRAK uses
  # the internal clock.` transmitting, `*5 If MIDI sync is "MIDI(Auto)".` receiving.
  clock: both
  # The chart's System Real Time Commands row, circled both ways.
  transport: both
  # **NOT ONE OCCURRENCE IN 272 SHEETS**, swept with the whitespace and hyphens taken out so that
  # a stacked or hyphenated spelling could not hide. The chart's `96,97` and `100,101` are the
  # registered parameters, which are addressing and not controls.
  nrpn: none
  sysex: true
  # Circled both ways with the chart's `*3 If switch is on.` against each, and the parameter table
  # gives the switch - `Receive/Transmit Program Change`, which ships on.
  program_change:
    receives: true
    sends: true

voice:
  addressing: pitches
  note_range: [0, 127]
  # **NOT RECORDED, AND THE REASON IS PUBLISHED RATHER THAN MISSING.** See the account: two
  # engines, 128 voices and 8, and no sum in either document. `yamaha/montage_6_7_8` is
  # unrecorded for the same reason.
  velocity:
    note_on: both
    note_off: false
  # **CROSSED IN ALL FOUR BOXES** - key's and channel's, transmitted and recognised - and the word
  # appears once in either document, as that row's own label. No ambiguity at all, where
  # `yamaha/montage_6_7_8` had two charts answering differently and needed a judgement.
  aftertouch: none
  pitch_bend:
    # Plus two and minus two, the defaults of the two system exclusive parameters that set the
    # bounds separately.
    semitones: 2
    programmable: true

parts:
  # **ELEVEN TRACKS ON ELEVEN FIXED CHANNELS, GROUPED THE WAY BOTH DOCUMENTS GROUP THEM.** The
  # Data List's track table gives a Track Group for each of the eleven, and the User Guide's
  # `AVAILABLE ON` column names those same four groups against each controller - so the grouping
  # is the maker's twice over rather than this file's invention.
  #
  # **`channel_offset` CARRIES THE SAME FICTION IT CARRIES IN `roland/jd_xi`**, and for the same
  # reason: the field says a part's channel is derived from a base and cannot be set on its own.
  # The second half is exactly right - the chart crosses the Changed row - and the first half is
  # a fiction, there being no base to derive from because the base never moves. The numbers a
  # consumer sends are right, 1 through 11, and the fiction is recorded here rather than left for
  # somebody to find. One for the format specification's list of what it cannot say.
  drum:
    label: Drum
    count: 7
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channels 1 to 7: a kick, a snare, a clap, two hats and two percussion tracks, each its own
    # track with its own name in the maker's table. **The only part the drum pitch controller
    # reaches**, which is how the group's span is confirmed from the controller side.
  synth:
    label: Synth
    count: 2
    channel_offset: 7
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channels 8 and 9. These and the DX part are the three the portamento, arpeggio and
    # mono/poly/chord controllers are given for, which is why those controllers span 8 to 10 and
    # name two groups rather than one - something `Control.part` cannot say, so it is said here.
  dx:
    label: DX
    channel_offset: 9
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channel 10, the four-operator FM track, and **the only part the four FM controllers reach**.
    # Also the one part the system exclusive bend-range parameters exclude.
  sampler:
    label: SAMPLER
    channel_offset: 10
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channel 11. Named in capitals because that is how both the track table and the controller
    # tables' `AVAILABLE ON` column print it.

groups:
  mix: Mix
  envelope: Envelope
  filter: Filter
  eq: EQ
  send: Send
  portamento: Portamento
  arpeggio: Arpeggio
  voicing: Voicing
  fm: FM
  effect: Effect

controls:
  # ---- 18.3.1 Sound Design parameters, all eleven tracks unless the account says otherwise ----
  track_volume:        {label: TRACK VOLUME, cc: 7, group: mix}
  # **1 to 127, not 0 to 127**, which is what the maker prints for this one row and for no other.
  track_pan:           {label: TRACK PAN, cc: 10, range: [1, 127], group: mix}
  attack_time:         {label: ATTACK TIME, cc: 73, group: envelope}
  decay_release_time:  {label: DECAY/RELEASE TIME, cc: 75, group: envelope}
  filter_cutoff:       {label: FILTER CUTOFF, cc: 74, group: filter}
  filter_resonance:    {label: FILTER RESONANCE, cc: 71, group: filter}
  eq_high_gain:        {label: EQ - HIGH GAIN, cc: 20, range: [40, 88], group: eq}
  eq_low_gain:         {label: EQ - LOW GAIN, cc: 21, range: [40, 88], group: eq}
  reverb_send:         {label: REVERB SEND, cc: 91, group: send}
  delay_send:          {label: DELAY SEND, cc: 94, group: send}
  # Drum tracks only, channels 1 to 7.
  drum_pitch:          {label: DRUM PITCH, cc: 25, range: [40, 88], part: drum, group: voicing}
  # Synth and DX only, channels 8 to 10. Exact values, not bands.
  mono_poly_chord:     {label: MONO/POLY/CHORD, cc: 26, choices: {mono: 0, poly: 1, chord: 2}, group: voicing}
  # Synth and DX only. 0 switches it off rather than setting the shortest time.
  portamento_time:     {label: PORTAMENTO TIME, cc: 5, group: portamento}
  # **EXACT VALUES WHERE THE MUTE TWO SHEETS LATER TAKES BANDS** - see the account.
  portamento_switch:   {label: PORTAMENTO SWITCH, cc: 65, choices: {"off": 0, "on": 1}, group: portamento}
  arp_type:            {label: ARP TYPE, cc: 27, range: [0, 16], group: arpeggio}
  arp_gate:            {label: ARP GATE, cc: 28, group: arpeggio}
  arp_speed:           {label: ARP SPEED, cc: 29, range: [0, 9], group: arpeggio}
  # The DX track alone, channel 10.
  fm_algorithm:        {label: FM ALGORITHM, cc: 116, part: dx, group: fm}
  fm_modulation_amount: {label: FM MODULATION AMOUNT, cc: 117, part: dx, group: fm}
  fm_modulator_frequency: {label: FM MODULATOR FREQUENCY, cc: 118, part: dx, group: fm}
  fm_modulator_feedback: {label: FM MODULATOR FEEDBACK, cc: 119, part: dx, group: fm}

  # ---- 18.3.2 Effect parameters: assigned-parameter slots, so what each one does depends on
  # ---- which effect type the track or the master bus is using.
  master_effect_1_parameter_1: {label: MASTER EFFECT 1 - ASSIGNED PARAMETER 1, cc: 102, group: effect}
  master_effect_1_parameter_2: {label: MASTER EFFECT 1 - ASSIGNED PARAMETER 2, cc: 103, group: effect}
  master_effect_1_parameter_3: {label: MASTER EFFECT 1 - ASSIGNED PARAMETER 3, cc: 104, group: effect}
  master_effect_2_parameter:   {label: MASTER EFFECT 2 - ASSIGNED PARAMETER, cc: 105, group: effect}
  master_effect_3_parameter:   {label: MASTER EFFECT 3 - ASSIGNED PARAMETER, cc: 106, group: effect}
  single_effect_parameter_1:   {label: SINGLE EFFECT - ASSIGNED PARAMETER 1, cc: 107, group: effect}
  single_effect_parameter_2:   {label: SINGLE EFFECT - ASSIGNED PARAMETER 2, cc: 108, group: effect}
  single_effect_parameter_3:   {label: SINGLE EFFECT - ASSIGNED PARAMETER 3, cc: 109, group: effect}
  send_reverb_parameter_1:     {label: SEND REVERB - ASSIGNED PARAMETER 1, cc: 110, group: effect}
  send_reverb_parameter_2:     {label: SEND REVERB - ASSIGNED PARAMETER 2, cc: 111, group: effect}
  send_reverb_parameter_3:     {label: SEND REVERB - ASSIGNED PARAMETER 3, cc: 112, group: effect}
  send_delay_parameter_1:      {label: SEND DELAY - ASSIGNED PARAMETER 1, cc: 113, group: effect}
  send_delay_parameter_2:      {label: SEND DELAY - ASSIGNED PARAMETER 2, cc: 114, group: effect}
  send_delay_parameter_3:      {label: SEND DELAY - ASSIGNED PARAMETER 3, cc: 115, group: effect}

  # ---- 18.3.3 Mute/Solo, receive only on two documents' word ----
  mute: {label: MUTE, cc: 23, values: {"off": 0, "on": 64}, direction: receives, group: mix}
  # 0 is off and 1 to 11 each name a track, so the value is a track number rather than a level.
  solo: {label: SOLO, cc: 24, range: [0, 11], direction: receives, group: mix}

  # ---- On the chart and in no table: the instrument answers to these and Yamaha publishes no
  # ---- model-specific parameter behind them. In no group, because there is no panel control to
  # ---- group them with - `korg/volca_keys` records its controller 11 the same way.
  expression:      {label: Expression, cc: 11, direction: receives}
  sustain_switch:  {label: Sustain Switch, cc: 64, direction: receives}
  sostenuto:       {label: Sostenuto, cc: 66, direction: receives}
