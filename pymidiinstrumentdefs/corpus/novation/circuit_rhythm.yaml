midi:
  # "Each track can be set to any of MIDI channels 1-15. Channel 16 is reserved for the
  # Project" (p. 89), so between them the sixteen are all in use.
  channels: [1, 16]
  # "MIDI Rx (receive) and Tx (transmit) can be enabled independently for each of the data
  # categories" (p. 90), one of which is Clock, and both are on by default.
  clock: both
  # BOTH, AND ALL THREE CIRCUITS AGREE ABOUT IT. Each of the three references lists start,
  # stop, continue and timing clock under "Supported Realtime Messages" (p. 5) without saying
  # which direction any of them goes, so the switch is what answers it: Rx and Tx are separate
  # settings over a Clock category that is on both ways by default, and start, stop and
  # continue travel with the clock.
  #
  # THE FAMILY DID NOT ALWAYS AGREE, AND THIS FILE IS WHERE THAT SURFACED. `novation/circuit`
  # had read that silence as both, from the one switch covering both directions, and
  # `novation/circuit_tracks` had read it as receives, from a reference saying "Send messages
  # on" over every other table. **That second argument does not apply here**: this reference
  # says "Send on appropriate channel 1-8" (p. 3) over one table of four and nothing of the sort
  # over the rest. So this file took the Circuit's reading and raised the difference as a
  # question of its own, and the three were then settled together on the switch.
  transport: both
  program_change:
    # "MIDI Program Change Rx on/off" (p. 90) and "MIDI Program Change Tx on/off" are pads 29
    # and 30 in Setup View (p. 90), both on by default.
    receives: true
    sends: true
    # "You can save your work in one of 64 internal Project memories" (p. 6). The reference's
    # table reaches them twice over from channel 16: 0 to 63 "select project (instant)" (p. 5) and 64
    # to 127 "select project (queued)" (p. 5), which is one set of sixty-four and not two.
    presets: 64
  # The reference addresses the dipper, the delay, the reverb, the compressor and the audio
  # input by NRPN and everything else by control change, with no number serving both.
  nrpn: supported
  # NOT RECORDED, and the search is the point. "system exclusive", "SysEx" and "exclusive"
  # appear **nowhere** in the reference, the user guide or the addendum - 112 sheets between
  # them - where the Circuit Tracks' reference says SysEx twenty-one times and both siblings
  # record it as true. A family resemblance is not evidence, so this is left out.

voice:
  # The eight sample tracks answer to eight notes on one channel, which is a note map rather
  # than a keyboard: "Table of notes used to trigger sample tracks from a single MIDI channel"
  # (p. 5). The notes are the maker's own, C1 to C2 in its naming.
  addressing: voices
  voices:
    sample_track_1: 36
    sample_track_2: 38
    sample_track_3: 40
    sample_track_4: 41
    sample_track_5: 43
    sample_track_6: 45
    sample_track_7: 47
    sample_track_8: 48
  velocity:
    # "RGB grid with 32 velocity-sensitive pads for playing and displaying information"
    # (p. 7), and a step's velocity is a value the sequencer stores and sends.
    note_on: received
  # NOT RECORDED: aftertouch and pitch bend, neither of which appears anywhere in the three
  # documents. See the source account for what was searched for.

parts:
  sample_track:
    label: Sample track
    # "Each track can be set to any of MIDI channels 1-15" (p. 89), and the factory default is
    # track N on channel N. Eight of them, described once.
    channel: assigned
    count: 8
    # Its own channel carries the track's parameters - "Send on appropriate channel 1-8"
    # (p. 3) - while the eight trigger notes arrive on the Project's channel instead, which is
    # why this part takes controls and not notes.
    receives: [controls]
  project:
    label: Project
    # Channel 16, which no track may use. It takes the program change that selects a project,
    # and the eight notes that trigger the sample tracks.
    channel: assigned
    addressing: voices
    receives: [notes, program_change]

groups:
  # The reference's own sections, one per run of rows, which the user guide's chapters match.
  # Two of its sections - Master and Click - hold nothing but rows marked NOT SUPPORTED, and
  # so have no group here.
  voice: Voice
  sampler: Sampler
  mixer: Mixer
  dipper: Dipper
  reverb: Reverb
  delay: Delay
  effects: Effects
  beat_repeat: BeatRepeat
  reverser: Reverser
  gator: Gator
  autofilter: Autofilter
  digital_lofi: DigitalLofi
  phaser: Phaser
  vinyl: Vinyl
  lp_hp_filter: LP HP Filter
  compressor: Compressor
  audio_input: Audio Input

controls:

  # Generated by `Notes/4468_write_controls.py` from the extraction, not typed. In the order
  # the reference prints them, table by table. A comment carries the panel's own name for a
  # macro knob, and the maker's own notation wherever a printed range needed reading twice.
  voice_sample_choice:         {label: Voice SampleChoice, cc: 8, default: 0, part: sample_track, group: voice}
  voice_playback_mode:         {label: Voice PlaybackMode, cc: 12, range: [0, 2], default: 0, part: sample_track, group: voice}
  voice_reverse:               {label: Voice Reverse, cc: 14, range: [0, 1], default: 0, part: sample_track, group: voice}
  voice_choke:                 {label: Voice Choke, cc: 15, range: [0, 1], default: 0, part: sample_track, group: voice}
  voice_slice:                 {label: Voice Slice, cc: 16, range: [0, 1], default: 0, part: sample_track, group: voice}
  voice_number_of_slices:      {label: Voice Number of Slices, cc: 17, range: [1, 16], default: 16, part: sample_track, group: voice}
  sampler_pitch:               {label: Sampler Pitch, cc: 21, range: [4, 124], part: sample_track, group: sampler}  # the panel's 1. Tune; the maker prints 4 – 124 (–60 – 60), so the figures in brackets are what the value means; its default is printed 0, which is on the parameter's own scale and not a value to send
  sampler_start_coarse:        {label: Sampler StartCoarse, cc: 22, default: 0, part: sample_track, group: sampler}  # the panel's 2. Start
  sampler_length_coarse:       {label: Sampler LengthCoarse, cc: 23, default: 127, part: sample_track, group: sampler}  # the panel's 3. Length
  sampler_slope:               {label: Sampler Slope, cc: 24, part: sample_track, group: sampler}  # the panel's 4. Slope; the maker prints 0 – 127 (–64 – 63), so the figures in brackets are what the value means; its default is printed 0, which is on the parameter's own scale and not a value to send
  sampler_distortion:          {label: Sampler Distortion, cc: 25, default: 0, part: sample_track, group: sampler}  # the panel's 5. Distortion
  sampler_hpf:                 {label: Sampler HPF, cc: 26, default: 0, part: sample_track, group: sampler}  # the panel's 6. HP Filter
  sampler_lpf:                 {label: Sampler LPF, cc: 27, default: 127, part: sample_track, group: sampler}  # the panel's 7. LP Filter
  sampler_resonance:           {label: Sampler Resonance, cc: 28, default: 0, part: sample_track, group: sampler}  # the panel's 8. Resonance
  sampler_start_fine:          {label: Sampler StartFine, cc: 86, default: 0, part: sample_track, group: sampler}
  sampler_length_fine:         {label: Sampler LengthFine, cc: 87, default: 127, part: sample_track, group: sampler}
  mixer_level:                 {label: Mixer Level, cc: 29, default: 100, part: sample_track, group: mixer}
  mixer_pan:                   {label: Mixer Pan, cc: 30, part: sample_track, group: mixer}  # the maker prints –64 – 63; its default is printed 0, which is on the parameter's own scale and not a value to send
  mixer_reverb_send:           {label: Mixer ReverbSend, cc: 31, default: 0, part: sample_track, group: mixer}
  mixer_delay_send:            {label: Mixer DelaySend, cc: 32, default: 0, part: sample_track, group: mixer}
  dipper_source:               {label: Dipper Source, nrpn: 128, nrpn_range: [0, 7], default: 0, part: sample_track, group: dipper}
  dipper_attack:               {label: Dipper Attack, nrpn: 129, default: 0, part: sample_track, group: dipper}
