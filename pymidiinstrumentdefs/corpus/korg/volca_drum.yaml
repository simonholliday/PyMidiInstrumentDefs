# THIS INSTRUMENT HAS TWO MIDI IMPLEMENTATIONS AND KORG PUBLISHES A CHART FOR EACH. They are not
# one map re-channelled: twenty-one numbers appear on both charts naming different parameters,
# four parameters can be reached in one implementation and not in the other, and a part's two
# layers can be reached one at a time in one and only together in the other. The two are
# "MIDI Implementation Chart (Split channel)" and "MIDI Implementation Chart (Single channel)",
# both dated 2019.03.29, both on the same download page.
#
# THE SPLIT-CHANNEL IMPLEMENTATION IS THE ONE THE INSTRUMENT HAS OUT OF THE BOX, and is the
# factory mode below. Three documents say so. The split-channel chart: "This is the factory default
# implementation." The single-channel chart: "This is an alternate implementation which can be
# selected by setting a specific MIDI channel. The factory default implementation, split
# channels, can be reverted to by deselecting the MIDI channel." And the owner's manual, from
# the player's side: "Tapping the step for the selected channel (LED lit up) cancels the
# selection and reverts to part 1-6 assigned to channels 1-6. (factory default)" (p. 3).
#
# **BOTH ARE CARRIED, EACH IN ITS MODE.** Until 2026-10-11 the format could not hold both: a
# control's number was a fact about the instrument and not about the instrument in a mode, so
# there was nowhere to put a second map that replaces the first when somebody picks a channel,
# and the single-channel map was described in words. Modes hold it now. The split chart's part
# answers in `split`, the single chart's six parts in `single`, and the resonator's four
# controls, which name no part, in both.

definition: 1

model:
  manufacturer: Korg
  name: volca drum
  # NOT RECORDED, and this one can be shown rather than merely asserted. Both charts print
  # "Date: 2019.2.20" and "Version: 1.00", which is the chart's own version in the way the
  # wavestate's is - and Korg has published two systems since. The System Updater page gives
  # 1.11, "Fixes to MIDI CC assignments. Minor bug fix in program chaining", and then 1.14 of
  # 2019.09.10, whose notes begin "Support for external clock synced delay. Added a new edit
  # parameter to enable pitch quantization. Fixed single channel MIDI handling of note events.
  # Fixed MIDI Song Position Pointer."
  # SO THE CHARTS DESCRIBE THIS INSTRUMENT BEFORE TWO CHANGES TO THE THINGS THEY CHART, and
  # Korg has not republished them. The owner's manual is newer and shows it: 1.14 added pitch
  # quantization and the 2024 manual lists "QPI: enable pitch quantization (semitone)" among the
  # part parameters (p. 3). Writing 1.14 here would claim the maps below match it, which the
  # release notes themselves put in doubt. Checked 2026-10-02.

source: >-
  MIDI Implementation Chart (Split channel), one page, which is the whole of the split-channel
  map below: p. 1. Owner's Manual, the edition Korg names EFGSCJ 4, eight sheets of six
  languages: printed p. 3, the English one. MIDI Implementation Chart (Single channel), p. 1,
  which is the whole of the single-channel map below. And two pages of Korg's own site, saved as
  text and cited for what Korg publishes and for the system versions.

  THE SPLIT-CHANNEL CHART IS THE FACTORY DEFAULT and is the `split` mode below. Its
  Mode row is remarked "Channel 1-6 = Parts 1-6" and its Velocity row "n=0-5 (Channel 1-6 =
  Parts 1-6)", so the six parts are separately addressable with nothing set and nothing learned.

  THE SINGLE-CHANNEL CHART IS A DIFFERENT MAP, NOT THE SPLIT ONE MOVED. Setting a MIDI channel
  switches the instrument to the single-channel implementation, where all six parts answer on
  that one channel and each gets a block of nine numbers of its own - part 1 on 14 to 20 with
  103 and 109, part 2 on 23 to 29 with 104 and 110, part 3 on 46 to 52 with 105 and 111, part 4
  on 55 to 61 with 106 and 112, part 5 on 80 to 86 with 107 and 113, part 6 on 89, 90, 96 to 100
  with 108 and 114, and the resonator still on 116 to 119. Twenty-one numbers mean different
  things in the two implementations: CC 14 is layer 1's Select on the split channels and part
  1's both-layer Select on the single one. A twenty-second, CC 103, keeps its name and changes
  whose it is: the send of whichever part's channel carries it on the split channels, and part
  1's alone on the single one. **Every layer parameter on the single-channel chart carries the
  `1-2` suffix**, so a part there reaches both of its layers at once and neither layer alone.
  Those six blocks are the parts `single_part_1` to `single_part_6` below, which exist in the
  `single` mode only.

  THE TWO CHARTS ORDER A PART'S PARAMETERS DIFFERENTLY, which is a second trap for anyone copying
  one from the other. The split chart runs select, level, attack, release, pitch, mod amount and
  mod rate; the single chart runs select, level, mod amount, mod rate, pitch, attack and
  release: "PART1: SELECT1-2, LEVEL1-2, MODAMT1-2, MODRATE1-2" (alternate_chart p. 1) and then
  "PART1: PITCH1-2, EGATT1-2, EGREL1-2" (alternate_chart p. 1).

  FOUR PARAMETERS EXIST IN ONE IMPLEMENTATION AND NOT THE OTHER. Bit reduction, wave folder,
  drive and dry gain are CC 49 to 52 on the split channels, and in the single-channel map those
  four numbers belong to part 3, which leaves that implementation with no way to reach them at
  all. It also has no CC 10: each part's pan has a number of its own there. And the fourteen
  controls that reach one layer alone are the split channels' only, so the single channel
  cannot set one layer without the other.

  EACH ROW PAIRS ITS NUMBERS TO ITS NAMES BY ORDER ALONE, which is the trap in reading either
  chart. A row of the split chart reads "14, 15, 16" against "SELECT1, SELECT2, SELECT1-2"
  (chart p. 1), and SELECT1-2 is not a range covering two numbers: it is a third control that
  moves both layers at once, which is what the panel's LAYER 1/2 button does - "The button will
  light up when both layers are selected at once" (p. 3). The single-channel chart is where the
  misreading costs most: every layer name there has the `1-2` form, and read as ranges one
  part's nine controls become sixteen. Every row of both charts was checked to have exactly as
  many names as numbers: the split chart's ten rows give thirty-one controls and the single
  chart's nineteen give fifty-eight.

  THE INSTRUMENT SENDS NOTHING. No row of either chart has an O in its Transmitted column, and
  the specification lists one connector - "MIDI IN connector" (p. 3) - with no OUT and no THRU.
  So every control below is marked `receives`, and `clock` and `transport` likewise.

  TWO GLOBAL SETTINGS CAN TURN OFF WHAT THIS FILE DESCRIBES, and both ship on. Footnote *1,
  carried by every control-change row and by the note row, reads "Received when global parameter
  MIDI RX ShortMessage is set to ON", and the manual's table of global parameters marks On as
  the factory default for it (p. 3). Footnote *2, on song position, clock and commands, reads
  "Not received when global parameter MIDI Clock src is set to Internal; received when set to
  Auto", and Auto is that parameter's factory default (p. 3).

  THAT FOOTNOTE IS APPLIED UNEVENLY, which is worth knowing before anyone relies on it. It
  marks the Note Number row, making note reception depend on MIDI RX ShortMessage too, and it
  does not mark the Velocity row directly below - which is where the chart actually states that
  note on is received. One of those two rows is marked wrongly and the chart does not say which.

  CC 46 TO 52 ARE THE LSB PARTNERS OF CC 14 TO 20 IN THE SPECIFICATION, and both charts give
  them parameters of their own. On the split channels, anything sending 14-bit controller pairs
  will move a part's mod rate while it means to refine its select, its bit reduction, wave
  folder or drive while it means a level, and its dry gain while it means layer 1's attack. On
  the single channel the pairs cross parts: 46 to 52 are part 3's block and 14 to 20 part 1's,
  and 55 to 61 are part 4's and the partners of part 2's 23 to 29, so a pair aimed at part 1 or
  2 moves the same parameter of part 3 or 4. Neither chart warns about it. That is a caution for
  a consumer rather than a fault in the file: the numbers below are what the maker published.

  THE SINGLE-CHANNEL CHART ALSO GIVES PART 6 FIVE NUMBERS THE SPECIFICATION KEEPS FOR OTHER
  WORK. 96 and 97 are data increment and decrement there, 98 and 99 the two halves of an NRPN's
  number and 100 half of an RPN's, and the chart has them as part 6's mod amount, mod rate,
  pitch, attack and release: "PART6: SELECT1-2, LEVEL1-2, MODAMT1-2, MODRATE1-2"
  (alternate_chart p. 1) against 89, 90, 96 and 97, and the next row against 98, 99 and 100.
  So anything that sends an NRPN or an RPN on that channel moves part 6's pitch, attack or
  release. 6, 38 and 101 are on neither chart.

  NOTES REACH A PART WITHOUT NAMING ONE. The chart recognises note numbers 0 to 127 and remarks
  "Each sound does not correspond to a note number", so on the split channels the channel says
  which part sounds and the note number says nothing at all. That is why `addressing` is `any`:
  the part takes every note, and no note says more than another.

  NOT RECORDED: which channel carries the four resonator controls in the split-channel
  implementation. The resonator is shared - "each part has two identical layers and the
  waveguide resonator is shared for all parts" (p. 3) - so those four are not a part's, and the
  chart does not say whether they answer on all six channels or on one. They name no part
  below, which in this format puts them on the base channel, channel 1: that is where the
  file's shape leaves them and not something the chart says. In the single-channel
  implementation there is one channel, and they are on it.

  NOT RECORDED: which part a note sounds in the single-channel implementation. The split
  chart's Velocity row says which, "n=0-5 (Channel 1-6 = Parts 1-6)" (chart p. 1), and the
  single chart's has no remark. Its Note Number row recognises 0 to 127 with the split chart's
  remark, "Each sound does not correspond to a note number." (alternate_chart p. 1), and with
  six parts on one channel the channel cannot say either. The 1.14 system, later than both
  charts, lists "Fixed single channel MIDI handling of note events." (release_notes) and does
  not say what the handling is; the update manual in its archive, which sits behind a licence
  agreement, was not read here. So the six parts there are recorded as taking controls, which
  is all the chart gives each of them, and each says `unrecorded: [notes]`: notes arrive on
  that channel, and how one reaches a part is not in the documents.

  NOT RECORDED: polyphony, which neither chart nor manual states for a part or for the
  instrument; the pitch bend range, there being no pitch bend; and how many presets a program
  change reaches. The manual's program memory is sixteen locations loaded with FUNC + LOAD PRG.
  (p. 3) and nothing connects a program change to them, so the number is not written here.

  CHECKED AND ABSENT: NRPN and RPN. Neither word, nor "Registered", nor "Parameter Number",
  appears anywhere on either chart or on printed page 3 of the manual. Three of their numbers
  are on the single-channel chart as part 6's own, as above. System exclusive is marked X in
  both columns of both charts.

