# **SEVENTY-ONE SHEETS, A SIX-SHEET MIDI GLOSSARY, AND NO IMPLEMENTATION.** Most of the MIDI words
# in this manual are in a glossary of general synthesis and MIDI terms - sheets 62 to 67, between
# `Aftertouch` and `Wavetable`, with `Coffee Filter` among them - and **not one sentence of it is
# about this instrument.** It is MIDI education: what a controller is, what a channel is for, what
# a program change does.
#
# **SO THE NUMBERS IN IT ARE NOT THIS INSTRUMENT'S, AND THREE OF THEM LOOK EXACTLY AS IF THEY
# WERE.** The glossary says a controller number "can be between 0 and 120." (manual p. 63), that
# "MIDI Channels 1 through 16 are available for this purpose." (manual p. 65), and that "Program
# numbers 1 through 128 can be changed via program change messages." (manual p. 65). A reader
# taking those for the Protein's own would record a channel range, a controller range and a preset
# count, all from a page explaining MIDI to a beginner. **The channel range is left unrecorded
# below for exactly that reason**: those words are the only `1 through 16` anywhere in 71 sheets,
# and this instrument's own settings pages never give a range.
#
# **THIS IS THE JD-XI'S LESSON IN A NEW SHAPE.** Rank 94 gave *a page is not a page's first
# screen*; rank 96 found a maker's tone map in the document its sibling had cited for an absence.
# This one gives **a glossary is not an implementation** - and it is harder to catch than either,
# because the words are right, the page number is right, and the sentence is about MIDI.
#
# WHAT THIS INSTRUMENT ACTUALLY ANSWERS TO IS FIVE PRINTED NUMBERS, TEN MORE INSIDE A PRINTED
# RANGE, AND ANYTHING ELSE A PLAYER TEACHES IT. All fifteen are modulation sources rather than
# parameters - four are named with their numbers on one sheet (manual p. 56), one more where MPE
# is explained (manual p. 53), and the last ten are a row reading `CC22...CC31` whose interior
# the maker never prints, so they are recorded and not listed. Everything else is learned: "Protein allows you
# to map its parameters to incoming MIDI control change data." (manual p. 55), and until somebody
# does, "If no MIDI CC mapping was made, Nothing Mapped is displayed." (manual p. 55).
#
# **`control_change` IS LEFT EMPTY BECAUSE IT HOLDS ONE WORD AND THIS INSTRUMENT IS BOTH THINGS.**
# `learned` is what six definitions here use for an instrument whose map the player makes, and all
# six carry no controls at all; writing it would say the five below are factory defaults
# somebody can change, which they are not - they are fixed sources in the modulation matrix. The
# field has no word for a maker that publishes some numbers and leaves the rest to MIDI learn.
#
# **AND THE DOCUMENT THAT SETTLES THE MOST IS THE ONE THE DOWNLOADS PAGE DOES NOT NAME.** Four
# things are offered there; three are labelled `manual`, `Specifications` and `SysEx Drop Tool`,
# and the fourth is a bare address in the body of an answer about something else: "New OS versions
# are available in your “my waldorf” account under Hardware & OS Updates. Here is the changelog:"
# (downloads_page). That changelog is **the only document that gives this instrument's
# firmware version, the only one that says a controller number is recognised for anything, and the
# only one with the right preset count.** A reader who took the labelled three would have none of
# those.

definition: 1

model:
  manufacturer: Waldorf
  name: Protein
  # **1.02, FROM THE ONE DOCUMENT THAT STATES A VERSION AT ALL** - "Changelog - Protein Firmware
  # 1.02 (January 2026)" (changelog), which is also where 1.01 and its December 2025 changes
  # are. The manual names no firmware and the specification sheet names none; the instrument shows
  # its own at startup, which 1.02 added.
  # **THE FIRMWARE ITSELF IS BEHIND A LOGIN** - the downloads page says new versions "are
  # available in your “my waldorf” account under Hardware & OS Updates" (downloads_page) -
  # so what is public is the account of what changed rather than the thing that changed.
  firmware: "1.02"
  # A desktop module with no keyboard: its manual has a section called `Playing Notes without a
  # keyboard` (manual p. 13), and the specification sheet's connections are audio, headphones,
  # MIDI and USB (specifications p. 2). The Microwave lineage, which its own specification claims
  # in the first line: "Two oscillators based on unique Waldorf Microwave ASIC chip."
  # (specifications p. 1).
  # Checked 2026-10-06.

source: >-
  **FOUR DOCUMENTS, ONE OF WHICH THE DOWNLOADS PAGE DOES NOT NAME, AND THE MIDI IS SPREAD ACROSS
  THREE OF THEM.** See the comment above the definition for the glossary trap and for which
  document settles what.

  WHERE EACH FACT COMES FROM, BECAUSE NO ONE DOCUMENT HOLDS THEM. The manual (71 sheets, `Rev. 2,
  January 2026`) has the settings on p. 51, the sync and MPE settings on p. 52, the MPE mapping
  and its one controller number on p. 53, the learn procedure on p. 55 and **fourteen of the
  the modulation sources on p. 56**, in the Source column of its modulation table; the layers are on
  p. 18, the shared voices on p. 16, the pitch bend on p. 26, the keyboard tracking reference on
  p. 29, the velocity on p. 32, the sysex dumps on p. 20 and the glossary on pp. 62 to 67. The
  changelog (1 sheet) has the firmware, the preset count and the one controller number recognised
  for choosing a preset. The specification sheet (2 sheets) has the voice count and the layer
  modes in the maker's own summary. **And the German manual is cited for a comparison rather than
  for a fact.**

  **THE SPECIFICATION SHEET IS STALE AND THE CHANGELOG PROVES IT, WHICH IS WHY `presets` IS 360
  AND NOT 250.** The specification says "Capacity of 250 patch memory slots" (specifications
  p. 2); firmware 1.01 "Increased preset storage from 250 to 360" (changelog) and 1.02 added
  "Recognizing MIDI Bank Select (LSB aka CC32) messages to choose from all 360 slots"
  (changelog). **That is not two statements contradicting each other** - the rule `novation/peak`
  established, where neither is carried - **it is one statement superseded by a dated one**, and
  the dates are in the documents: the specification sheet was made on 17 November 2025 and 1.01
  shipped in December. So the later figure is carried and the earlier is recorded here, because a
  consumer reading the maker's own specification page today is told 250.

  **AND THE ONLY STATEMENT ABOUT CHOOSING A PRESET OVER MIDI NAMES BANK SELECT RATHER THAN PROGRAM
  CHANGE**, so `program_change.receives` is left unrecorded while `presets` is not. CC 32 alone
  cannot reach 360 slots and program change must be received too - but the documents never say so,
  and the only page that discusses program change is the glossary. **An inference is not a
  citation**, so the count is recorded, the message that is named is recorded in a comment, and
  the one that must also be true is not claimed.

  HOW ITS DOCUMENTS ARE ADDRESSED, WHICH IS THE HABIT THIS MAKER DOES KEEP. Every file comes from
  a share on the maker's own Nextcloud - `downloads.waldorfmusic.com/cloud/index.php/s/<token>` -
  and `waldorf/blofeld` and `waldorf/iridium` are reached the same way, so **three Waldorfs in
  this corpus and one arrangement.** Two differences worth having: **the share serves a `.zip`
  rather than the file**, each holding one folder and one or two PDFs, and **the token says nothing
  about what it serves**, so the four here are told apart only by what comes back.

  NOT RECORDED: the channel range, for the reason in the comment above - the only `1 through 16`
  in 71 sheets is the glossary's. The mode, there being no implementation chart in any document.
  The transport, which **no document mentions in any spelling**. The note range, whose only
  statement is the glossary's "between 0 and 127" (manual p. 65) about MIDI in general. NRPN, which appears
  nowhere at all - not even as a glossary entry, which is a silence and not a checked absence. And
  `control_change`, for the reason in the comment: this instrument is both of the things that
  field has words for.

sources:
  manual:
    kind: manual
    title: Protein Manual
    edition: "2"
    dated: 2026-01-01
