  # Printed CC MSB 82, CC LSB 32. Every other pair here is MSB + 32, and its neighbours run
  # 30/62 and 31/63, so the series would continue 32/64. Recorded as printed.
  master_reverb_send_r:   {label: Reverb Send R, cc: 82, lsb: 32, nrpn: 360, part: fx, group: master}
  master_pattern_volume:  {label: Pattern Volume, cc: 95, nrpn: 294, part: fx, group: master}
