# THE MAKER'S DEFAULT COLUMN DOES NOT AGREE WITH ITSELF, AND 33 OF THE 246 CONTROLS BELOW
# CARRY NO DEFAULT BECAUSE OF IT. The MIDI parameters list prints up to two numbers per row -
# `64 (0)` - and the second is the first as the display shows it, which the row's own Range
# column gives the arithmetic for: a range of `0-127 (-64 to +63)` says the display is the wire
# value less 64, so `64 (0)` checks out and `0 (60)` cannot. **Nothing in either document
# explains either column**, and these are the four ways the rule found a row the manual does
# not settle:
#
#   26 rows where the two halves cannot both be right, by the row's own range;
#    2 where the manual's Init Patch table (pp. 38-39) gives a third number again;
#    4 where the body states a range shifted from the MIDI one and the default then lands
#      somewhere the document contradicts - a pan that would default to hard left where the
#      screen beside it reads "+0", an arpeggiator that would start on two octaves where the
#      Init Patch says one, and two effects whose three presets the body numbers 1 to 3;
#    1 that prints no wire value at all, the Arp/Clock Sync Rate's "16th".
#
# A default is recorded only where every statement the two documents make about it agrees.
# `Notes/4240_write_controls.py` applies that rule and names each of the 33 refusals with the
# arithmetic that refused it. **THE REVERB IS THE ONE THE MANUAL DISPROVES TWICE**: its three
# presets "set the RevSize parameter (see page 32) to values of 0, 64 or 127 respectively"
# (manual p. 31), and `Reverb Size`'s own default is 64 - which is preset 2, where the Default
# Value column's 2 on a range of 0-2 would be preset 3.
#
# THIS DEFINITION IS BUILT FROM TWO DOCUMENTS DESCRIBING TWO FIRMWARES, and it targets the
# later. The manual is "applicable to Peak synthesisers with v1.2 firmware" (manual p. 4) and
# the addendum is "For Firmware Updates 2.0 and 2.1" (addendum p. 1). So `1.2` in the manual's
# file name is the instrument's firmware and not the manual's edition, which is worth saying
# because the sibling Bass Station II's guide numbers itself and not the synth.
#
# THREE THINGS IN THE ADDENDUM ARE THE SUMMIT'S AND ARE NOT HERE. Its last pages cover both
# synths and mark what belongs to which, under "Update Features Exclusive to Peak" (p. 12) and
# "Update Features Exclusive to Summit" (p. 14). Aftertouch scaling is under the second
# heading, so `Atouch Scale` - NRPN 64:3, printed in the shared MIDI parameters list on p. 18 -
# is left out: the Peak has no keyboard to scale. And three FM NRPNs, 25:13, 25:17 and 25:21,
# are named only in a bug-fix list beside fixes for "voices 9-16", which the Peak does not
# have; they address an "FM ... Manual Amount" that appears nowhere in the Peak's own manual,
# whose only FM is a modulation matrix destination. A number in a document two instruments
# share is not this instrument's number until the document says so.
#
# NO CONTROL HERE HAS `choices`, ALTHOUGH DOZENS OF THEM ARE SELECTORS. The manual names the
# states of its stepped parameters in prose and numbers none of them, and the one place the
# order of a published list could be checked against something, it fails: the LFO Range button
# "has three settings: High, Low and Sync" (manual p. 20) over a range of 0-2, which would put
# High at 0 - but the MIDI list gives the default as 0 and the Init Patch table gives it as
# Low. One of those is wrong and nothing says which. The three sync-rate tables (manual p. 37),
# the wavetable list, and the modulation matrix's sources and destinations are all in the same
# position: an ordered list with no number against any row.

definition: 1

model:
  manufacturer: Novation
  name: Peak
  # The newest firmware any document here describes. The addendum is "For Firmware Updates 2.0
  # and 2.1" (addendum p. 1), and its own MIDI parameters list adds or renames eighteen of this
  # instrument's parameters, all of which are below. Novation delivers firmware through Novation
  # Components, which serves nothing a fetch can read, so whether 2.1 is still the newest is not
  # stated anywhere this reached. The
  # instrument reports its own version in the Settings menu and the manual's example screen
  # shows "Version 0221" (manual p. 34) - four digits whose format the manual never explains,
  # and which cannot be the v1.2 its text claims. Checked 2026-10-03.
  firmware: "2.1"

source: >-
  Peak user guide, 44 pages, for firmware v1.2, created 2019-08-07 by its own metadata, and the
  "Summit and Peak User Guide Addendum Version 2.1", 18 pages, created 2022-07-27. Novation
  publishes no programmer's reference and no separate MIDI implementation for this instrument,
  unlike its Circuit, so these two documents are the whole of the published map.

  BOTH END IN A MIDI PARAMETERS LIST and the two together are this definition: 230 rows over
  the manual's pp. 40-43 and 19 more on the addendum's p. 18, each row giving the parameter,
  whether it is addressed by control change, by a pair of control changes or by NRPN, the
  number, the range and the default.

  THE TABLE RUNS BOTH WAYS AND ONE SETTING GOVERNS THE WHOLE OF IT: "With the default CC/NRPN
  setting of Rec+Trans, Peak's physical controls transmit their settings as MIDI CC or NRPN
  data. The synth engine itself also responds to received MIDI CC/NRPN data with this setting"
  (manual p. 35), the alternatives being Receive, Transmit and Disabled. So no control below
  carries a direction of its own: they all go both ways or none of them does.

  EIGHTEEN CONTROL CHANGES CARRY A FINE HALF, which the manual marks by writing "CC pair" in
  the kind column and two numbers in the next, always n and n+32. Each such parameter runs 0 to
  255 rather than 0 to 127, and none of the eighteen fine halves is also a control change in
  its own right - both checked for every row, because this maker writes a two-number cell in
  the same column for two different things.

  THE SAME NOTATION MEANS SOMETHING ELSE ON AN NRPN ROW, where `0:14` and `25:6` are the two
  halves of one parameter number rather than a pair of controllers. Each is recorded as MSB x
  128 + LSB, the number that goes on the wire, so `0:14` is 14 and `25:6` is 3206. The two
  meanings were separated by the check above: every control change pair is n and n+32, and no
  NRPN row satisfies that.

  THE MOD MATRIX IS SIXTEEN SLOTS OF FOUR PARAMETERS and uses the NRPN high half as the slot
  number: slot 1 is `1:0` to `1:3` and slot 16 is `16:0` to `16:3`, which is 64 of the controls
  below. The second, later-numbered block at `25:x` and `64:x` is the addendum's, and the gap
  between 16 and 25 is not explained.

  TWO ROWS ARE NOT CONTROLS AND ARE NOT BELOW. `Arp/Clock Rate` is the only row in either
  document whose number reads `NA:NA`, so the tempo - "The range is 40 to 240 BPM" (manual p.
  30) - is reachable by no message. And the addendum's `Atouch Scale` is the Summit's, by that
  document's own heading.

  ONE PARAMETER IS RENAMED RATHER THAN ADDED. NRPN 0:5 is "Voice Unison Spread" in the manual
  and "Spread" in the addendum, which says so itself: "The Voice panning setting 'Spread'
  (formerly known as 'UniSpread') has broken out into four unique Spread Modes" (addendum p.
  3). It is one control under the later name.

  AND ONE NUMBER WAS RESERVED BEFORE THE PARAMETER EXISTED. The manual gives `Osc Common Noise
  HPF` the NRPN 0:12 and a range printed as `0-0 ( to+)`, with a default of `(0)` - the one row
  in 249 whose range and default are not values at all, because firmware 1.2 had no high-pass
  noise filter. The addendum adds the filter, under its own heading "Update Features Exclusive
  to Peak" (addendum p. 12): Novation "added a High-pass noise filter to the Osc menu to match
  Summit" (addendum p. 13) with a "Range of adjustment: 0 to 127" (addendum p. 13). That range
  is what is recorded against the
  manual's number - **and joining the two is an inference, because the addendum never gives
  Noise HPF a number.** It rests on the name being the same and on 0:12 being the row the
  manual blanked. Nothing else in either document connects them.

  THE GROUPS ARE THE TABLE'S OWN SECTION HEADINGS - Oscillators, Mixer, Filter, Envelopes,
  LFOs, Effects, ARP and Mod Matrix. The ten rows the manual prints before its first heading
  have none, and are grouped as Voice, which is the menu the manual puts them in; the
  addendum's table has no headings at all, and each of its rows is placed by the menu the
  addendum says it lives in.

  THREE RANGES DO NOT FIT THE LISTS THEY SELECT FROM, which is worth knowing before trusting
  any of them. Every `Mod Matrix n Source1` and `Source2` row gives the range as 0-16, which is
  17 values, and the table that "lists the sources of modulation available to Inputs A and B
  of each Slot in the Modulation Matrix" (manual p. 39) lists 23 of them - the range looks to
  predate the CV, LFO 3, LFO 4 and bend-wheel sources that table now carries. The
  destinations do fit: 37 listed against a range of 0-36. And `Delay Sync Time` is given 0-18,
  19 values, where the Delay Sync Rate table (manual p. 37) lists 16 divisions; the Arp/Clock
  Sync Rate table lists 19, and the three divisions the delay table lacks are exactly the
  arpeggiator's three longest, so 0:94's range reads as copied from 0:116's.

  THE PATCH COUNT IS STATED TWICE AND SPLIT DIFFERENTLY EACH TIME. The feature list claims the
  instrument is "Pre-loaded with 286 brand new Patches" (manual p. 4) with "Memory for 226
  additional User Patches" (manual p. 4), while the chapter on loading them says "Banks A and B
  are pre-loaded with 256 great factory Patches" (manual p. 11) and that "Banks C and D are for
  storing your own Patches" (manual p. 11). Both readings total 512, and only the second is
  consistent with four banks of 128, so `presets` rests on it.

  THE TWO LFOS ARE DESCRIBED AS IDENTICAL AND ARE NOT ADDRESSED ALIKE. "The parameters of LFO 1
  and LFO 2 are immediately user-adjustable via a full set of top panel controls" (manual p.
  20) and their menu pages are the same, but LFO 1 Range is NRPN 0:68 where LFO 2 Range is cc
  83. Every other pair of LFO parameters matches in kind.

  A GREAT DEAL IS NAMED AND NUMBERED NOWHERE, so the 246 below are not everything the
  instrument has. Nothing reaches LFO 3 and LFO 4's waveform, rate or sync rate - the addendum
  numbers only the phase, slew and fade time it adds to them - nor LFO 1 and 2's Fade Sync and
  MonoTrig, nor the envelopes' Hold Time and Repeats, nor the delay's L/R Ratio. **All four
  parameters of every FX Modulation Matrix slot are unnumbered** (manual pp. 33 and 40), where
  the sixteen main matrix slots are numbered in full. And so is every item in the Settings
  menu, which is where the MIDI channel, Local, the CC/NRPN switch and the Bank/Patch switch
  live: the one exception is the tuning table's selection, which the addendum numbers at 25:6.

  TWO CONTROLS BELOW ARE NUMBERED AND DESCRIBED NOWHERE, which is the opposite case. `Voice
  Keyboard Octave`, NRPN 0:6 over 61-67 for -3 to +3, matches no parameter in the Voice menu,
  the Settings menu or the Init Patch table. `Patch Genre`, NRPN 0:1 over 0-9, likewise: the
  manual has a patch Category on save and never a Genre. `Patch Category`'s own range of 0-14
  implies fifteen categories and the manual lists none of them.

  NOT RECORDED: the note range, which no page states - this is a desktop module with no
  keyboard, played with "the MIDI controller of your choice" (manual p. 4). Transport, which
  nothing in either document mentions: not start, not stop, not continue, not song position.
  Whether MIDI clock is sent, since both documents describe only the receiving side. The MIDI
  mode, there being no implementation chart in either document. And the clock source itself,
  which is a five-way setting - "Auto, Internal, Ext-Auto, MIDI, USB" (manual p. 30) - that the
  MIDI parameters list gives no number for.

  ONE FURTHER DOCUMENT COULD NOT BE READ. The downloads page offers "an online version of this
  user guide and translations" at userguides.novationmusic.com, which answers a fetch with a
  Cloudflare challenge rather than the guide. Whether it is a later edition than the 1.2 manual
  is therefore not established, and nothing here rests on it.

