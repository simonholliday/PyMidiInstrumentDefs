    sha256: bb20e276b374676aae693f045b90cdba821224c60fb1e53809395a3e56607aca
    retrieved: 2026-10-09
    # 75 sheets, beginning at printed p. 3: printed pp. 1 and 2 are not in the file, so the printed
    # page is two more than the sheet and the offset is negative. Sheets 2, 3 and 75 print no
    # number. The title is the running head; the metadata title is the layout file's name,
    # `Slim Phatty Monday 9_27.indd`. Its dates are the chart's 10/1/10 and the colophon's 2010
    # (manual p. 76), and no page's text names a firmware, though two pictures read `VERS: 2.2`.
    page_offset: -2
  firmware_notes:
    kind: release_notes
    title: Moog Slim Phatty synthesizer Firmware update v3.21
