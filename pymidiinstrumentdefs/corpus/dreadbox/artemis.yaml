  lpf_ffm:                          {label: LPF FFM, cc: 4, direction: receives, group: vcf}
  lpf_cut_eg_amount:                {label: LPF CUT EG AMOUNT, cc: 6, direction: receives, group: vcf}
  hpf_cutoff:                       {label: HPF CUTOFF, cc: 16, direction: receives, group: vcf}
  hpf_resonance:                    {label: HPF RESONANCE, cc: 17, direction: receives, group: vcf}
