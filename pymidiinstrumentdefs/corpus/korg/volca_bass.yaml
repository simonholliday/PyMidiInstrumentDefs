# THIS INSTRUMENT SENDS NOTHING, AND ITS MAKER SAYS SO IN A SENTENCE RATHER THAN BY LEAVING A
# COLUMN BLANK. "No message is transmitted." (implementation), with the reason in the line
# beneath it: "The volca bass is not equipped with a MIDI Out jack." (implementation). So every
# control below is `receives`, and that is a checked absence rather than a silence - which is
# worth the distinction, because this maker's chart could have said it by blankness alone and
# instead says it twice.
#
# **THE CHART SAYS THE SAME THING THIRTY TIMES AND NONE OF THEM IS TEXT.** Its answers are drawn
# marks: a circle for yes and a cross for no, and a text extraction of the page returns every row
# label and not one answer. They are recoverable because **the two are drawn differently** - a
# circle is a path of curve segments and a cross a path of straight lines - so
# `Notes/4604_extract_volca_bass.py` reads all 59 of them by asking what each path is made of,
# and finds **thirty crosses in the Transmitted column and not one circle.** That is the
# SP-404MKII's arrow-glyph problem in a form that could be solved rather than worked around.
#
# TWO DOCUMENTS DISAGREE ABOUT ONE MESSAGE, AND IT IS RECORDED RATHER THAN RESOLVED. The chart
# marks Pitch Bend with `*1` - "Received when global parameter MIDI RX ShortMessage is set to ON."
# (chart p. 1) - and the implementation's Pitch Bender Change row **carries no footnote at all**,
# where every one of its twelve control change rows carries `*1`. So one document says pitch bend
# depends on that setting and the other says, by its silence in a table that is otherwise
# scrupulous about marking, that it does not. Nothing below turns on it: pitch bend has no field
# here anyway, because no document says how far this instrument bends.
#
# THREE OF THE TWELVE CONTROLLERS REACH SOMETHING THE PLAYER CANNOT. The chart marks CC 5, 11
# and 49 with `*3`: "Cannot be changed with machine operations; can only be changed with MIDI."
# (chart p. 1). And the owner's manual bears it out - **it never prints the words `GATE TIME` or
# `EXPRESSION` at all**, and gives `SLIDE` only as a per-step switch with no mention of its time.
# So a MIDI controller does not merely duplicate this instrument's panel, it extends it.
#
# **The format has no word for that.** `panel_only` says the opposite - a control on the panel
# that no message reaches - and there is no field for a control a message reaches that the panel
# does not. Raised rather than hidden, and the three are in the `performance` group below, which
# is what they have in common besides.
#
# EVERY MESSAGE THIS INSTRUMENT ANSWERS TO IS CONDITIONAL ON A GLOBAL SETTING, and both settings
# ship permissive. `*1` covers the notes and all twelve controllers and is off when `MIDI RX
# ShortMessage` is Off; `*2` covers the clock and the transport - "Not received when global
# parameter MIDI Clock src is set to Internal; received when set to Auto." (chart p. 1). The
# manual's table of global parameters marks Auto and On as the factory defaults, so an instrument
# out of the box answers to all of it.
#
# NOT RECORDED: polyphony. This instrument has three oscillators and a setting that groups them -
# "Each VCO will be in a separate group and operated by separate sequences." (manual p. 1) at one
# extreme and "All VCOs will be in the same group." (manual p. 1) at the other - but the manual
# describes that grouping as a property of **sequences**: "VCOs grouped together are activated by
# the same sequence data" (manual p. 1). **No page of any of the three documents says how many
# notes arriving over MIDI will sound at once**, so three would be an inference from the hardware
# and one would be an inference from the name.
#
# Also not recorded: pitch bend's range, which no document states; and anything about the SYNC
# IN and OUT jacks, which carry a voltage pulse rather than a MIDI message and so are no part of
# `clock`.

definition: 1

model:
  manufacturer: Korg
  name: volca bass
  # NOT RECORDED, and the omission is this maker's. None of the three documents states a firmware
  # version for the instrument: the chart carries its own `Ver.: 1.01`, the implementation its own
  # `Revision 0.01`, and both of those number the document. The downloads page offers a `volca
  # bass/System Updater` at 1.02, so a firmware number exists and no document here says which one
  # it describes. Checked 2026-10-05.

source: >-
  The volca bass MIDI Implementation, "Revision 0.01 (2013.06.23)" (implementation), **a 3.4 KB
  plain text file rather than a PDF**; the volca bass MIDI Implementation Chart, whose single sheet is cited
  throughout as p. 1, carrying `Ver.: 1.01` and dated 2013. 06. 10 on its face; and the volca bass Owner's Manual,
  edition EFGSCJ 4. All three are offered on one Korg downloads page, which is saved beside them.

  THE IMPLEMENTATION IS THE SOURCE OF EVERY NUMBER and the chart is a second reading of it.
  Twelve control changes, and both documents name all twelve - checked one by one rather than
  taken on trust, because the chart's names live in its Remarks column, which is text, where its
  answers do not.

  **THE CHART'S ANSWERS ARE DRAWINGS.** 59 marks inside the table, a circle for yes and a cross
  for no, and nothing in the text layer to say which is where. They are read by what each path is
  made of - curves against straight lines - which is sound here because the chart uses no other
  shape inside its rules. Thirty crosses in the Transmitted column and not one circle, nineteen
  circles in the recognised one. The legend below the table prints one of each beside the words
  it defines, and is excluded by the table's own bottom rule rather than by eye.

  WHAT THE TWO DOCUMENTS DISAGREE ABOUT is one footnote on pitch bend; see the comment above the
  definition. **What they agree about is everything else**, including the direction of every
  message, the twelve numbers, and their names bar one spelling: the implementation prints `EG
  DECAT/RELEASE` where the chart prints `EG DECAY/RELEASE`, and the chart is the one that can be
  read as a word. The implementation also prints `Contiune` for Continue in its realtime table.
  Two typos in 3.4 KB, both carried here as findings rather than as names - the control below
  takes the chart's spelling.

  AND ONE SMALL DEFECT IN THE IMPLEMENTATION'S OWN APPARATUS: its channel-message table defines
  `[H]:Hex, [D]:Decimal` and its system-common table then heads two columns `Second[B]` and
  `Third[B]`, where `[B]` is defined nowhere. From the bit patterns printed under it, it means
  binary.

  THE ONE THING ONLY THE IMPLEMENTATION SAYS is what a Song Position Pointer does here: "pppp :
  0~15 = STEP 1 ~ STEP 16" (implementation), with the rest of the message's bits marked ignored.
  So this instrument reads a song position as a step within one sixteen-step pattern and discards
  the bars - which is a sixteen-step sequencer's honest reading of a message meant for a longer
  song, and the chart says only that the message is received.

  THE THREE DOCUMENTS ARE DATED THREE WAYS AND NONE OF THEM AGREES WITH THE PAGE THAT OFFERS
  THEM. The chart's face says 2013. 06. 10, its own metadata says it was made on 2013-06-14, and
  the downloads page dates the file 2015.06.01. The implementation's face says 2013.06.23 and the
  page dates it 2016.01.08. **Neither date on a page is a date in a document**, which is worth
  knowing before citing either: the dates recorded in the sources below are the documents' own.

  Korg encrypts every PDF it serves for this instrument with an empty password, as it does for
  the volca drum - noted because a reader whose tool refuses them is meeting a setting and not a
  fault.

