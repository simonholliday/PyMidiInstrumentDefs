    landing: "https://downloads.novationmusic.com/novation/synthesisers/summit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/summit_user_guide_v1.2_it.pdf"
    sha256: bd7e00e4810878cb9f82b15cfbf7b1327f5c6a1c6834242fca1e9904bad4f8bb
    retrieved: 2026-10-05
    # 63 pages, created 2022-09-13. **CITED FOR ONE FACT AND QUOTED FOR NOTHING**: its cover
    # gives the edition as 1.2 and its own body sentence still gives the firmware as v1.1, which
    # is what establishes that the two numbers are independent - the English edition cannot show
    # that, because for it they are the same number. Its text layer was regenerated by a
    # different tool and its reading order is lost, so no number was read from it; its parameter
    # names are translated in any case. Searched, not read.
    page_offset: 0
  second_edition:
    kind: manual
    title: Summit Mode d'emploi V2 Francais
    edition: V2
    landing: "https://downloads.novationmusic.com/novation/synthesisers/summit"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/s3fs-public/downloads/Summit%20User%20Guide%20V2%20-%20FR.pdf"
    sha256: e84a3cccfab1556269592e9af9bbb81004e9259d3c559030741171518203dbb1
    retrieved: 2026-10-05
    # 65 pages, created 2021-11-30. **CITED FOR AN ABSENCE AND QUOTED FOR NOTHING**: it is the
    # second edition that witnesses the sixty blank Control Number cells, which is what makes
    # them the maker's omission rather than one edition's typesetting. It also omits the
    # firmware sentence the English and Italian editions both carry, so it says nothing about
    # which firmware it describes. Three of its pages are not in French: p. 1 is a German
    # colophon, p. 2 the same colophon in French, p. 3 a contents page headed in English.
