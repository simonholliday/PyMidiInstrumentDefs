    # 145 pages. **THE PRINTED NUMBER IS FIVE LOWER THAN THE FILE'S PAGE**, where the 1.5.1
    # edition's is six: file 12 prints 7 and file 110 prints 105. The implementation table is
    # printed pages 105 and 106, file pages 110 and 111. The title is the file's own metadata.
    page_offset: 5
  manual_1_5_1:
    kind: manual
    title: User Manual AstroLab
    edition: "1.5.1"
    dated: 2025-12-04
    landing: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    url: "https://www.arturia.com/api/download/products/astrolab-61/manual/astrolab_Manual_1_5_1_EN.pdf"
    sha256: d5cf5957005f0f8ac41a821f1666f5e9643c2229526b51c03a59bc9cb07d6009
    retrieved: 2026-10-03
    # **KEPT FOR TWO REASONS**: its table is the 2.0.0 edition's cell for cell, which is what
    # shows the map did not change, and it is still the newest English manual the resources page
    # lists for the AstroLab 88, whose entry points at this file. 115 pages, counted with pypdf
    # and with PyMuPDF, which agree. **THE PRINTED NUMBER IS SIX LOWER THAN THE FILE'S PAGE**: the
    # front matter is unnumbered and the folio alternates sides, so it is only ever the last line
    # on an odd file page - file 97 prints 91, file 103 prints 97. Its table is printed pages 96
    # and 97.
    page_offset: 6
  release_notes:
    kind: release_notes
    title: AstroLab 61 firmware release notes, through 2.0.0
    edition: "2.0.0"
