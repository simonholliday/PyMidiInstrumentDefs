    # Read by coordinate: the flat text runs every number, then every transmitted mark, then every
    # recognized mark, then every name, so `20 o o BD TUNE` appears nowhere in it. The four
    # columns sit at x=188, 197, 317 and 438 and the rows are keyed by height.
    # **Two rows of the note-number footnote fall in the same bands** and read as controls 36 and
    # 40 with no marks - the `BASS DRUM 2` and `SNARE DRUM 2` lines. They are dropped by requiring
    # a mark, which is the thing a control row has and a footnote row has not.
