model:
  manufacturer: Behringer
  name: EDGE
  # NOT RECORDED, the firmware, and **it is not published anywhere**: the guide says to let the
  # application find it - "The app looks for the latest firmware file which can then be downloaded
  # and used to update the EDGE." (guide p. 22) - and the download list offers the application and
  # no firmware. So what version an EDGE runs is something only the application knows.
  # `V 2.0` and `V 1.0` on the two guides' covers are **the documents' versions**, not the
  # instrument's, which is why neither is here.
  # A desktop module with no keyboard, monophonic, and the page sells it as a companion to this
  # maker's CRAVE. Product code `0718-ABM`.
  # Checked 2026-10-06.

source: >-
  **FOUR DOCUMENTS AND ALL FOUR ARE THE SAME QUICK START GUIDE.** See the comment above the
  definition for what that costs. Two are multi-language editions four years apart, two are
  Chinese and Japanese editions of the older one, and **none of them carries a table of MIDI
  messages.**

  WHAT THE NEWER GUIDE DOES SETTLE, WHICH IS FOUR THINGS. The channel range, twice over: "A MIDI
  channel from 1 to 16 is selectable using the dip switches." (guide p. 20) and "MIDI In / Out /
  Thru 2 x 5-pin DIN / 16 channels" (guide p. 86). That it is monophonic: "Number of voices
  Monophonic" (guide p. 86). That it takes a clock: "CLOCK – Clock can be set to MIDI, USB or INT
  / EXT." (guide p. 20). And what its sockets are for: "MIDI IN – This MIDI DIN input can be used
  to play sounds via an external MIDI device and also allow MIDI clock to be used." (guide p. 20).

  **ITS CHANNEL IS SET BY DIP SWITCHES AND ALSO BY AN APPLICATION**, which is a thing worth a
  consumer's attention: the switches are on the rear panel, and "The SYNTHTRIBE application allows
  you to select the MIDI channel number and to set and adjust various parameters of the EDGE to
  suit your preferences." (guide p. 23). **Two mechanisms for one setting and no word on which
  wins.** The application is two executables on the download list and **was not run**: vendor
  software is not installed to read a specification, so whatever parameters it adjusts are not
  recorded here - and they are the likeliest place this instrument's controller numbers would be.

  WHAT IT SAYS ABOUT ITS OUTPUT SOCKET AND NOTHING MORE: "MIDI OUT / THRU – MIDI DIN can be used
  as an output or a thru." (guide p. 20). **What it puts out is never stated** - not notes, not
  clock, not anything - so `clock` records reception only and nothing records transmission.

  NOT RECORDED, AND EACH FOR A REASON RATHER THAN BY OMISSION. **The controllers**, for the ruling
  in the comment above. **The note range and the velocity**: the guide's eight `VEL` controls are
  the sequencer's own per-step levels and its `Velocity` figures are patch-bay voltages, so the
  word appears seven times in this document and never once about a MIDI message. **The mode**,
  there being no chart. **The transport**: `Play / stop` is a patch-bay input taking "more than
  3.2 V" (guide p. 86) and no MIDI transport message is named. **Program change, system exclusive
  and NRPN**, none of which appears in any spelling in any of the four documents.

