  # THE ONE VALUE TABLE THIS MANUAL PRINTS FOR A CONTROLLER IS FOR THIS ONE, under a name
  # the chart does not use, so it is quoted here rather than carried as values. Page 52 is
  # headed "MIDI CC VALUES FOR THE LFO 1 CLOCK DIVIDER (CC #3), LFO 2 CLOCK DIVIDER (CC #8)"
  # and gives 21 bands; this chart gives CC 3 as LFO 1 RATE, 0-16383. Both are the same
  # knob: "When the SYNC button is illuminated, the LFO rate is synchronized to the
  # Subsequent 37's internal clock, or external MIDI clock. In this mode, the LFO RATE knob
  # selects between clock divisions of the internal or external MIDI clock" (p. 23). So the
  # bands apply when LFO 1 Sync is on and the 14-bit rate applies when it is off, and a
  # definition cannot say that. The table, as printed, with the maker's own two names for
  # each band:
  #     4 WHOLE NOTES         4 WHOLE     0-6
  #     3 WHOLE NOTES         3 WHOLE     7-12
  #     2 WHOLE NOTES         2 WHOLE     13-18
  #     WHOLE NOTE + HALF     WH + 1/2    19-24
  #     WHOLE NOTE            WH          25-40     <- see below
  #     DOTTED 1/2 NOTE       1/2 DOT     31-36
  #     WHOLE NOTE TRIPLET    WH T        37-42
  #     1/2 NOTE              1/2         43-48
  #     DOTTED 1/4 TRIPLET    1/4 DOT     49-54     <- see below
  #     1/2 NOTE TRIPLET      1/2 T       55-60
  #     1/4 NOTE              1/4         61-67
  #     DOTTED 1/8 NOTE       1/8 DOT     68-73
  #     1/4 NOTE TRIPLET      1/4 T       74-79
  #     1/8 NOTE              1/8         80-85
  #     DOTTED 1/16 NOTE      1/16 DOT    86-91
  #     1/8 NOTE TRIPLET      1/8 T       92-97
  #     1/16 NOTE             1/16        98-103
  #     1/16 NOTE TRIPLET     1/16 T      104-109
  #     1/32 NOTE             1/32        110-115
  #     1/32 NOTE TRIPLET     1/32 T      116-121
  #     1/64 NOTE TRIPLET     1/64 T      122-127
  # TWO ROWS OF IT ARE WRONG AS PRINTED. The whole note's band is given as 25-40, which runs
  # over the three bands below it; every other band is six or seven wide and they run
  # consecutively from 0 to 127, so 25-30 is the only reading that fits, and 25-30 is not
  # what the page says. And the ninth row's two names disagree with each other: its time
  # value is "DOTTED 1/4 NOTE TRIPLET" where its division is "1/4 DOT", which cannot both
  # be true. The 21 bands are also what the NRPN chart's count of 21 agrees with, for LFO 1
  # Clock Division, LFO 2 Clock Division and Arp Clock Division.
