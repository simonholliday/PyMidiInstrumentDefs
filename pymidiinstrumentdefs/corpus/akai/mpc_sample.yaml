midi:
  # "MIDI In Channel ... Select All to receive MIDI input data from all channels, or select a
  # specific channel. All, 1-16", and "MIDI Out Channel ... 1-16" (p. 60). Two settings and one
  # field: this records the span each of them may take, and the input's extra All is in the
  # prose above rather than in a number.
  channels: [1, 16]
  # "MIDI Sync In ... Off, Midi Clock, MTC" and "MIDI Sync Out ... Off, Midi Clock, MTC"
  # (p. 60), so clock travels both ways and either direction can be switched off. MIDI Time
  # Code is the other half of each setting and this field has no room for it.
  clock: both
  program_change:
    # "Receive Program Change ... When enabled, these messages can be used to trigger sequences.
    # Off, Sequence" (p. 60).
    receives: true
    # THE TWO FACTS THAT MAKE THIS NUMBER ARE NEVER JOINED BY THE GUIDE. It holds "16 sequences
    # x 8 banks, per project" (p. 65), which is 128, and it says a received program change
    # triggers a sequence (p. 60). It never says that program change 0 to 127 selects sequence 1
    # to 128, the way Elektron's manuals do. The count is recorded because it is what a program
    # change reaches; the mapping is not claimed.
    presets: 128
    # NOT RECORDED: whether it sends program change. The menu has a receive setting and no
    # matching send setting, and nothing else in either document mentions one.

voice:
  # "Polyphony 32 stereo voices" (p. 65), with "Disk Streaming Fast onboard disk streaming (up to
  # 32 voices)" beside it.
  polyphony: 32
  # EVERYTHING ELSE HERE IS UNRECORDED AND THE SOURCE ACCOUNT SAYS WHY. Notes reach the pads and
  # which note reaches which pad is not published; the pads produce poly aftertouch and nothing
  # says the instrument receives any, nor what aftertouch does at all; and no page states a note
  # range or a velocity response.
