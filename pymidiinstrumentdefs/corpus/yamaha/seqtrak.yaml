# **THE CONTROLLER MAP IS NOT IN THE DATA LIST, WHICH IS WHERE RANK 109 TAUGHT ME TO LOOK.** The
# MONTAGE established that Yamaha publishes no standalone MIDI implementation and that its MIDI
# data format, data table and implementation chart sit in the Data List. All three are here too,
# promised on the contents page at 111, 117 and 162 - and **sheets 117 to 161 are a system
# exclusive address map**, not a controller table. `Parameter Base Address`, `Bulk Dump Block`,
# `Top Address`, addresses and sizes. The only places `Control Change` appears in those
# forty-five sheets are the switches deciding whether control changes are transmitted at all.
#
# **SO THE NUMBERS AND THE NAMES ARE IN DIFFERENT DOCUMENTS, AND NEITHER IS SUFFICIENT ALONE.**
# The chart gives sixteen cells of controller numbers and the direction each travels, and names
# three of those cells only `Model-Specific *2`, where `*2` says to refer to the manual. The
# User Guide's section 18.3 names all thirty-seven with their channels and ranges and says
# nothing about direction. This definition is built from both, which is why both are cited.
#
# **THE COUNT RECONCILES TO FORTY THREE WAYS, AND NOT ONE OF THEM IS A HAND COUNT.** The chart's
# sixteen cells expand to fifty controller numbers; ten of those are addressing machinery or
# channel mode, which the ruling at rank 77 and the Fantom's at rank 101 both exclude; forty
# remain. The User Guide's three tables name thirty-seven, every one of them on the chart, and
# the three the chart has that 18.3 does not are 11, 64 and 66 - Expression, Sustain Switch and
# Sostenuto, standard controllers with no model-specific parameter behind them. 37 + 3 = 40.
# **And midi.guide's independent figure for this instrument is 40.** Three sources agreeing, two
# of them not Yamaha's.
#
# **UNLIKE THE MONTAGE'S, THIS DATA LIST NAMES ITS FIRMWARE.** Its cover reads `For OS V2.00` and
# the User Guide says the same in prose, so the firmware comes from inside both documents rather
# than from a download page's label. **The maker rule held a thirteenth time by failing**: a
# Yamaha Data List was expected to behave as the MONTAGE's did, and in this one respect it does
# the opposite. What did repeat is the trap: the chart stamps `Version : 1.0` and
# `Date :26-SEP-2023` on itself inside an edition published 01/2026 for OS V2.00.
#
# **THE CHART WAS READ GEOMETRICALLY AND THE METHOD RANK 109 USED DOES NOT WORK ON IT.** Its four
# columns have no clear vertical gutter, because the Remarks column's footnotes and the mode
# legend span across them, so measuring the widest clear band finds only the right margin. It was
# read by clustering its 331 words onto baselines with a two-point tolerance instead - rank 108's
# rule - which gives 53 rows and puts every cell in its own. A flat reading interleaves the two
# value columns and is unusable.
#
# **AND THE TRACK NAMES ARE NOT QUOTED ANYWHERE BELOW, ON PURPOSE.** The track table's cells are
# three separate columns, and a label reassembled across columns is not a quotation - which is
# exactly what the gate caught twice in `yamaha/montage_6_7_8`. The eleven names are described
# rather than quoted, and only whole cells are quoted.

definition: 1

model:
  manufacturer: Yamaha
  name: SEQTRAK
  # **STATED ON THE COVER OF BOTH DOCUMENTS, NOT INFERRED FROM A LABEL.** The Data List's cover
  # reads `For OS V2.00` and the User Guide's says the functions it describes are for OS V2.00.
  # Rank 109 had to reach for a sibling document and the newest updater to name a firmware at
  # all; here two documents say it outright.
  firmware: "2.00"
  # NOT RECORDED: a hardware revision. Yamaha sells one SEQTRAK, so there is none to give. D0 is
  # the edition of both documents, from each colophon and matching each filename - the Data List
  # prints `Published 01/2026 YJ-D0` and the User Guide is served as `..._En_D0.pdf` - and it is
  # recorded as each source's edition below. The Safety Guide is at C0 and the Quick Operation
  # Guide at B1 on the same page, so a reader matching editions across the whole download page
  # will think something is stale when nothing is. Checked 2026-10-07.

source: >-
  **ELEVEN TRACKS, EACH ON ITS OWN FIXED CHANNEL, AND THAT IS WHAT MAKES EVERY CONTROLLER BELOW
  MEAN SOMETHING.** The Data List's track table gives eleven named tracks and the MIDI channel
  each answers on, in that order: seven drum tracks on channels 1 to 7, two synth tracks on 8
  and 9, an FM track on 10 and a sampler on 11. The names are the maker's - a kick, a snare, a
  clap, two hats, two percussion tracks, two synths, the DX and the sampler - and they are
  described here rather than quoted, because each sits in its own column of that table and words
  joined across columns are not words the page prints. The implementation chart agrees from the
  other side: its Basic Channel row reads `1 - 11`, and its Changed row is crossed, so **no
  channel on this instrument can be moved.**

  **THE CONTROLLER'S CHANNEL IS THEREFORE WHICH TRACK IT REACHES**, and the User Guide's own
  `AVAILABLE ON` column says which tracks each controller has any effect on. Those spans are
  exactly the track table's groups, arrived at independently: the drum pitch controller is given
  for channels 1 to 7, the mono/poly/chord and arpeggio controllers for 8 to 10, and the four FM
  controllers for channel 10 alone. Two documents reaching the same layout from different
  directions is the strongest thing said about this instrument's addressing.

  **FORTY CONTROLLER NUMBERS ARE PUBLISHED AND THE TWO DOCUMENTS DIVIDE THE WORK.** The
  implementation chart lists the numbers and whether each travels, and names three of its cells
  only as model-specific, with a footnote reading "Please refer to the manual." (data_list
  p. 162). The manual it means is the User Guide, whose "18.3 MIDI Control Change Parameters"
  (user_guide p. 100) names thirty-seven of the forty with a channel span and a value range for
  each. The remaining three - Expression at 11, Sustain Switch at 64 and Sostenuto at 66 - are on
  the chart and in no table, which is to say the instrument answers to them and Yamaha publishes
  no model-specific parameter behind them.

  **FIVE OF THE FORTY ARE RECEIVE-ONLY, AND ON TWO OF THEM TWO DOCUMENTS AGREE.** The chart
  crosses the transmitted column for 11, 23, 24, 64 and 66 while circling all five as recognised.
  For 23 and 24 the User Guide says the same thing in prose - "MUTE and SOLO are receive only"
  (user_guide p. 101) - which is a chart written to describe message flow and a guide written to
  tell an owner what to expect, arriving at one fact without either deriving from the other. The
  other thirty-five travel both ways.

  **THE TWO SWITCHES AMONG THEM USE DIFFERENT CONVENTIONS, WHICH IS THE MAKER'S DOING AND NOT A
  TRANSCRIPTION ERROR.** The portamento switch at 65 is given exact values, 0 for off and 1 for
  on, so it carries `choices`; the mute at 23 is given halves of the range, 0 to 63 off and 64 to
  127 on, so it carries `values`. Both are in the same section two sheets apart. Nothing says
  what 2 to 127 do to the portamento switch, which is why a band would be an invention.

  **TRANSMISSION SHIPS SWITCHED OFF, WHICH THE CHART DOES NOT TELL YOU AND THE SYSTEM EXCLUSIVE
  TABLE DOES.** The chart circles the control change rows in both columns with no footnote, while
  the parameter table gives a transmit switch for each port - legacy MIDI, USB MIDI and Bluetooth
  - whose control change bit defaults to off. So the instrument is capable of sending these
  controllers and will not do so until an owner turns it on. Both statements are true and the
  directions below record the capability, which is what a reader needs in order to know the
  message exists at all.

  **PITCH BEND IS PROGRAMMABLE TWO WAYS WITH TWO DIFFERENT REACHES, AND SHIPS AT THE CONVENTIONAL
  TWO SEMITONES.** The registered parameter sets it symmetrically: "PITCH BEND SENSITIVITY 00H -
  18H (0 - 24 semitones)" (data_list p. 115). The system exclusive parameters set the upper and
  lower bounds separately and reach further, over `-48 - +24` each, defaulting to plus two and
  minus two - and they are "Not available for DX track" (data_list p. 142), so the FM track takes
  the registered parameter and not those. `roland/jd_xi` records no depth
  because its maker published none; this maker publishes a default, so it is here.

  **POLYPHONY IS NOT RECORDED, FOR THE REASON RANK 109 MET IN THE SAME WORDS.** The specification
  gives "AWM2: 128, FM: 8" (user_guide p. 98) - two engines, two figures, and no sum anywhere in
  either document. Ten of the eleven tracks are served by the first and the DX track by the
  second, so neither number is true of the instrument and no third number is published.

  **AND WHAT THE COMPANION APP ADDS IS SOUNDS, NOT CONTROLLERS**, which had to be established
  before this map could be taken as complete. The specification gives the preset counts and notes
  that they "Can be added from the SEQTRAK app" (user_guide p. 98) under the sounds heading and
  nowhere near the MIDI sections. The controller map does not grow.

  **ONE DISAGREEMENT IS CARRIED RATHER THAN SETTLED.** The specification lists this instrument's
  track types as "DRUM, DRUMKIT, SYNTH, DX, SAMPLER" (user_guide p. 98) - five - while the track
  table names four groups and the controller tables' own `AVAILABLE ON` column names the same
  four. **DRUMKIT appears in neither MIDI table.** Nothing below rests on it, and it is said here
  rather than quietly reduced to four, because an owner who meets a DRUMKIT track needs to know
  the MIDI documentation does not mention one.

  **FOUR ABSENCES, EACH READ RATHER THAN COUNTED.** Both documents were swept with the whitespace
  and hyphens taken out, which is what finds a maker's own typography: there is no NRPN and
  nothing non-registered anywhere in either; aftertouch appears once in 272 sheets and it is the
  chart's own row label, crossed in all four boxes; nothing describes polyphonic pressure; and
  the only MPE-shaped hits are the letters inside ordinary words.

