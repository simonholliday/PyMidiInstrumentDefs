# THIS MANUAL TWICE SENDS THE READER TO A MIDI IMPLEMENTATION CHART THAT IS NOT IN IT. "See the
# MIDI Implementation Chart at the back of the owner's manual", printed page 55, once for the
# pedal switch and once for the external control pedal. The back of this manual is five appendix
# tables - patch factors, tone parameters, MIDI functions, error messages and a blank worksheet -
# and then the back cover. **There is no chart.**
#
# THE LIKELIEST REASON IS THAT THIS IS HALF A MANUAL. Its cover carries a black triangle reading
# ADVANCED and its contents page is headed "ADVANCED COURSE", and the body refers to "page 21 in
# the Basic Course" and to a "separate booklet "MIDI"". Roland published at least three documents
# for this instrument and serves one of them.
#
# SO THIS DEFINITION CARRIES NO CONTROLS. What the manual does give is the two things the pedals
# send - any controller from 64 to 95, and any from 0 to 31 - and the player chooses which. Every
# other controller it names, modulation and volume and hold and portamento, is an on/off switch
# with no number beside it.
#
# AND IT IS A SCAN. Not one of its 78 pages carries a character, so every figure below was read
# by eye off a rendered page, twice and independently.

definition: 1

model:
  manufacturer: Roland
  name: D-50
  # NOT RECORDED, and there is nothing to record it from: a 1987 instrument whose manual names no
  # firmware, no revision and no date of its own. The only date in the book is the printing code
  # on the back cover, "'87-7-F3-5S", and the part number above it, 10481. Roland publishes no
  # update history for it and no product page. Checked 2026-10-02.

source: >-
  Owner's Manual (Advanced Course), 78 pages, scanned and with no text layer at all: the MIDI
  chapter on printed pp. 51-56, the data transfer chapter on p. 61, the patch factor table on
  p. 70, the MIDI function table on p. 73, and the back cover on p. 78.
  ROLAND'S OWN PAGE FOR THIS INSTRUMENT SERVES NOTHING. Its owner's manuals page exists and
  offers no document: the page's own title reads "Roland - Support -  - Owner's Manuals", with
  nothing where the product's name belongs. That is proved rather than asserted, by fetching the
  same page for a product that does have documents on the same day - the TR-1000's names its
  product and offers fourteen files, this one names none and offers none. The manual was found by
  a search restricted to the maker's own domains.
  THE CHART THE MANUAL POINTS AT IS IN NEITHER PLACE, and the head of this file says what that
  probably means: this is the Advanced Course volume, and the book refers to a Basic Course and
  to a separate booklet called "MIDI" which Roland does not publish.
  WHAT IT SAYS ABOUT CONTROL CHANGE IS TWO RANGES AND NO NUMBERS. "With the pedal switch, the
  Controls from 64 to 95 can be controlled" and "With the external control pedal, Controls from 0
  to 31 can be controlled" (p. 55), and the appendix repeats them as "Pedal SW 64 ... 95" and
  "External Control 0 ... 31" (p. 73). Which one each pedal sends is the player's to choose, so
  there is no factory map to transcribe and no `controls` block below. The display drawn beside
  that passage shows 91 and 31, which may be the values as shipped and which the manual never
  calls defaults.
  FOUR MORE CONTROLLERS ARE NAMED WITHOUT THEIR NUMBERS. Aftertouch, Bender, Modulation and
  Volume each get a line in the MIDI-2 display and Hold, Portamento, Program Change and Exclusive
  in MIDI-3, every one of them with the same sentence - "To receive or transmit Modulation
  messages, set this to ON" (p. 54). The instrument plainly answers to modulation, volume, hold
  and portamento; the specification's numbers for them are not this maker's words, so they are
  not written here.
  TWO TONES ON TWO CHANNELS, which is what `parts` below records. "When Separate (Solo) mode is
  selected ... the Upper and Lower Tones can be controlled on different channels. The Lower Tone
  is controlled by the basic channel, and the Upper Tone is controlled by the receive channel set
  here. (The D-50's keyboard can control only the Upper Tone.)" (p. 53). The upper tone's channel
  is set on its own, and each patch may override it.
  THE MANUAL CONTRADICTS ITSELF ABOUT THAT CHANNEL'S RANGE, and three of its four statements
  agree. Page 53 says "1 to 16 are valid for receive channel"; the appendix says "1 ... 16"
  (p. 73); the patch factor table says "Off, 1 ... 16" (p. 70); and page 56 says "OFF and 1 to
  100 are optional", which is the sentence above it about program change numbers repeated by
  mistake. The three are followed.
  AND IT CONTRADICTS ITSELF ABOUT PROGRAM CHANGE. Its table of patches runs 1 to 128 - sixty-four
  in the instrument and sixty-four on a memory card - and the footnote under that same table
  reads "*0 to 127 Program changes can be sent" (p. 55). One of the two is off by one and the
  manual never says which. A patch's own transmitted number, moreover, stops at 100 (p. 56), so
  the last twenty-eight of the map cannot be chosen that way.
  NOT RECORDED: POLYPHONY, and this is a case where something is known and cannot honestly be
  written. **There is no specifications page in this volume at all.** The number of voices is
  stated nowhere in words; it appears only as rows of circles in the key mode diagrams on
  pp. 57 and 59, which both readings counted as sixteen in whole mode and eight and eight when
  the keyboard is split. A count of circles in a drawing is not the maker saying a number.
  NOT RECORDED: the note range, the key count, aftertouch's kind, and any system exclusive
  layout. The manual names no note number anywhere - pitches are "C1 to C7" and "Middle C (C4)" -
  and its exclusive chapter describes bulk dump and bulk load without one byte of format.

