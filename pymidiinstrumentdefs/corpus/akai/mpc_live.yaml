    retrieved: 2026-10-04
    # Thirteen pages, cited for nothing. Held because it is the release the guide describes, and
    # because its own list of what changed is where a reader would look for a MIDI change and not
    # find one. `file` reports it as 8 pages and is wrong, as it was about both Octatrack manuals
    # and the Super 6's.
    page_offset: 0

midi:
  # "MIDI Channels 1-16 are available for this purpose" is the glossary (p. 386) and is not a
  # statement about this machine. What is: a track's input and output each take a channel
  # (p. 267), and every Controller Mode control chooses one of "(1-16)" (p. 335).
  channels: [1, 16]
  # EVERY CONTROLLER NUMBER IS THE OWNER'S, assigned by MIDI Learn and saved with the project
  # rather than with the instrument (p. 320). So there is no map to publish and no map is missing.
  control_change: learned
  # Clock travels both ways and either direction may be switched off. MIDI Time Code and Ableton
  # Link are the other two choices of the same pair of settings, and no field here holds them.
  clock: both
  program_change:
    # "This determines what an incoming MIDI program change message will change: a Sequence or
    # Track" (p. 64).
    receives: true
    # "To select a MIDI program change value for the track to send" (p. 54).
    sends: true
    # NOT RECORDED: presets. See the source account - the guide gives no sequence count, and what
    # a program change selects is a setting with two positions.
  # NOT RECORDED: sysex and nrpn. Neither word is anywhere in 530 pages or in either set of
  # release notes, which is silence rather than a checked absence.

voice:
  pitch_bend:
    # "Range Down / Range Up: Use these fields to determine the range of pitch bend in semitones"
    # (p. 65), with a Global Pitch Bend switch that overrides every track's own setting. THE
    # RANGE THOSE FIELDS TAKE IS NOT PUBLISHED, so `semitones` holds nothing: the only numbers
    # the guide gives for a bend range are two plugin instruments' own, 0-12 and 2-12, which are
    # parameters of a sound and not of this instrument's MIDI.
    programmable: true
  # NOT RECORDED: polyphony, aftertouch, velocity, the note map and the addressing. The pads are
  # "(16) velocity- and pressure-sensitive pads" (p. 472) and their notes are assigned by the
  # owner from three presets, none of them named as the default. The specifications for this
  # machine give no voice count. See the source account for each.
