# **ITS CHART CONTAINS NOT ONE `o` AND NOT ONE `x`.** Every tick and every cross on this
# instrument's only MIDI document is vector artwork rather than text, so a reader that extracts
# the text layer gets the row labels, the eleven controller numbers and the remarks - and
# **nothing at all about which direction any of them travels**. `dreadbox/nymphes` met a page
# that was entirely a picture and declared it with `pictured_pages`; this is narrower and worse,
# because the page looks perfectly readable and is silently missing the only column that matters.
#
# **SO THE MARKS WERE READ AS SHAPES AND THEN LOOKED AT.** A circle is drawn with curves and a
# cross with straight lines only, and the chart prints its own key in the same two shapes - a
# circle beside "Yes" and a cross beside "No" (chart). `Notes/4651_extract_volca_sample.py` reads
# the key with the same code as the table, so neither is assumed; and the table was rendered at
# three times and at six and read by eye before any of this was written down.
#
# **THE EFFECT: 29 CROSSES IN THE TRANSMITTED COLUMN AND NOT ONE CIRCLE.** This instrument sends
# nothing whatever, which its connector list confirms without ever naming a MIDI OUT:
# "Connectors: (Headphone) jack (ø3.5mm stereo mini-phone jack), SYNC IN jack" (manual_2 p. 1) and no
# more. The jack it has is an in: "MIDI IN jack This jack is where you can connect an external
# MIDI device to control the sound generator of the volca sample." (manual_2 p. 1).
#
# **AND THE SURVEY POINTED AT A DIFFERENT MACHINE.** The ranking's source for this instrument is
# Korg's product 867, which is the **volca sample2** - a later model with two charts and a
# plain-text MIDI implementation. The original volca sample is product 370 and has one chart and
# no implementation at all. Nothing here is taken from the sample2's documents.

definition: 1

model:
  manufacturer: Korg
  name: volca sample
  # **1.42, FROM THE SYSTEM UPDATER, WHICH IS FIVE YEARS NEWER THAN THE CHART.** The chart says
  # "Ver.: 1.00" (chart) and is dated 2014; the newest system program Korg offers is 1.42, dated
  # 2019. See the account for the one row that is known to have moved between them.
  firmware: "1.42"
  # A sampler, **still made**. Checked 2026-10-06.

source: >-
  **ONE CHART, AND ITS MARKS ARE DRAWINGS RATHER THAN TEXT.** Every tick and cross on it is
  vector artwork, so extracting the text gives the eleven controller numbers and none of their
  directions. They were read as shapes - a circle is drawn with curves, a cross with straight
  lines - against the chart's own printed key, and then the table was rendered and read by eye.
  **29 crosses stand in the Transmitted column and not one circle**, and every one of the eleven
  controllers carries a circle in the `Recognized` column.

  **THE TWO MANUAL PARTS PRINT NO PAGE NUMBER**, being fold-outs of two sheets each carrying
  five languages side by side, so a locator below is the file's own sheet rather than a printed
  folio - which is the ruling `dreadbox/nymphes` needed for the same reason. Everything taken
  from part 1 is on its second sheet and everything from part 2 on its first. The chart and the
  updater page are one sheet each and are cited by name alone.

  **SO EVERYTHING HERE IS RECEIVED AND NOTHING IS SENT**, which the manual settles twice over
  without naming a MIDI OUT at all: "An external MIDI device can be connected to the MIDI IN jack
  of the volca sample to control the audio source of the volca sample." (manual_1 p. 2), and the
  specification lists "Connectors: (Headphone) jack (ø3.5mm stereo mini-phone jack), SYNC IN
  jack" (manual_2 p. 1) and no other. `korg/volca_fm` and `korg/volca_drum` are the same shape for the
  same reason.

  **THE VELOCITY CELL HOLDS A CROSS AND A MESSAGE FORMAT TOGETHER**, which reads like a
  contradiction and is not: the cross says the velocity is not acted on, and "9n, V=1 - 127"
  (chart) says what the note-on message looks like. **This corpus can show the two shapes carry
  meaning rather than decorating the page**, out of the same maker's own charts: the identical
  row is a circle on the volca drum's chart and a cross on the volca fm's, and the volca fm's
  implementation says in three words why - velocity is not used there either. So `ignored` is
  what the cross means, and it is read off this chart's key rather than borrowed from a sibling.

  **AND THE CHART IS FIVE YEARS OLDER THAN THE FIRMWARE, WITH ONE ROW KNOWN TO HAVE MOVED.** It
  is "Ver.: 1.00" (chart), dated 2014. The newest system updater is 1.42, dated 2019, and its
  release note reads "Fixed MIDI Song Position Pointer." (updater) - **while the chart crosses
  Song Position in both columns**. A thing that was fixed is a thing that exists, so the chart is
  out of date on at least that row. Nothing here claims song position is unsupported, and nothing
  here claims it works: one sentence on a download page is enough to doubt a row and not enough
  to replace it. `roland/tr_8` met the same shape with a whole update document to read instead.

  **WHAT THE TWO FOOTNOTES DO, AND WHAT THEY DO NOT.** "*1: Received when global parameter MIDI
  RX ShortMessage is set to ON." (chart) hangs on all eleven controllers, and "*2: Not received
  when global parameter MIDI Clock src is set to Internal; received when set to Auto." (chart)
  hangs on the clock rows. **Both parameters ship in the state that lets MIDI through**: the
  manual's global table gives "Step7 MIDI RX ShortMessage *On St.on Off St.oF" (manual_2 p. 1) and
  "Step6 MIDI Clock Src *Auto CL.At Internal CL.In" (manual_2 p. 1), where the asterisk is that
  table's own mark for the factory default.

