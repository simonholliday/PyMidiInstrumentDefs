  eg_attack:                        {label: EG ATTACK, cc: 12, direction: receives, group: envelope}
  eg_decay:                         {label: EG DECAY, cc: 13, direction: receives, group: envelope}
  eg_sustain:                       {label: EG SUSTAIN, cc: 14, direction: receives, group: envelope}
  eg_release:                       {label: EG RELEASE, cc: 15, direction: receives, group: envelope}
  vca_eg_release:                   {label: VCA EG RELEASE, cc: 72, direction: receives, group: envelope}
