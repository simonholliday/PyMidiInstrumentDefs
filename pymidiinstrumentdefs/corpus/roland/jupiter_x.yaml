    # all: each GUID page prints its own file address twice, once in a link and once in a script
    # that redirects to it. That is this maker's arrangement for anything still made, and
    # `roland/tr_909` needed the US manual archive instead because it is not.
    # The digest is of the extraction, which pairs each document with its GUID page and the file
    # that page serves; the served markup is saved beside it as `.html`, whose own digest is
