# **THE DOCUMENT NAMED FOR THIS INSTRUMENT'S MIDI IS NOT WHERE ITS CONTROLLERS ARE, AND EIGHT
# ROLANDS HAD TAUGHT THE OPPOSITE.** The `JUPITER-X/Xm MIDI Implementation` runs to 90 sheets and
# gives 35 controller numbers a heading, of which **24 are carried below** and every one is a
# standard assignment - bank select, and the performance controls: modulation, volume, the
# pedals, the eight filter and envelope offsets. The tone parameters are somewhere else
# entirely: **the Parameter Guide carries a `CC#` column on nine of its 75 sheets, in six
# tables**, holding 149 more rows over 52 distinct numbers.
#
# `roland/jd_xi` at rank 94 cited its Parameter Guide **for an absence** - 51 sheets, some thirty
# thousand words and no controller map, only the modulation wheel's number in passing - because on
# that instrument the implementation held everything. Here the same two documents, from the same
# maker, divide the work the other way round. **So rank 94's lesson was about the JD-Xi and not
# about Roland**, which is the same correction `erica_synths/hexdrums` forced one rank later
# about its own maker. Two instruments by one maker are not a habit, and this is the second rank
# running to say so.
#
# **AND THE SAME NUMBER MEANS DIFFERENT THINGS DEPENDING ON A SETTING RATHER THAN ON A CHANNEL,
# WHICH IS WHY THOSE 149 ROWS ARE NOT CARRIED BELOW.** A part is loaded with one of the models -
# "Seven types are provided: JUPITER-8, JUNO-106, JX-8P, SH-101, XV- 5080, RD (Piano), and
# VOCODER." (reference p. 61) - and the guide's tone tables go by model. **28 of the 52 numbers
# are given more than one name from table to table**, capitals apart: CC 3 is `CUTOFF` in four
# tables and `FILTER FREQ` in a fifth, CC 16 is `OSC1 LEVEL` or `PW LEVEL`, CC 18 is one of
# `OSC3 LEVEL`, `SUB LEVEL` or `SUB OSC LEVEL`, and CC 119 is `KEY MODE` in five tables and
# `Unison Sw` in the sixth. Some of the 28 are one parameter under two names, as 3 looks to
# be, and some are not, as 16 is not.
#
# That is **not** the collision the `part` field exists for. `elektron/tonverk` expands its
# per-kind map because a track's kind decides which channel reaches it, so a part holds the fact.
# Here every part takes any model - "Other models can be used with parts 1-4." (reference p. 61) -
# so the meaning turns on what somebody loaded, not on where the message arrived. **No field holds
# that**, and carrying the rows anyway would assert that CC 16 is `OSC1 LEVEL` on an instrument
# whose part might be holding an SH-101, where it is `PW LEVEL`. So the figures are recorded
# here and the format gap is raised rather than papered over. Until 2026-10-12 the example
# here was CC 3 and a JUNO-106, whose table gives 3 to `CUTOFF` like three others.
#
# **A FURTHER MAP IS ADDRESSED PER PARTIAL, AND IT IS PRINTED TWICE.** The Parameter Guide has a
# `List of supported CCs` (parameter_guide p. 33) whose columns are partials 1 to 4: fifteen
# parameters over four columns, sixty numbers and none of them twice, so `L1 Rate` is CC 29,
# 20, 22 and 23 depending on which partial it reaches. The JD-800 Model Expansion's guide has a
# list of the same name (jd_800 p. 14) with the same sixty in the same fours under its own
# names, `LFO1:Rate` for that one, and a `CC#` column besides, fourteen rows in two tables
# (jd_800 pp. 9, 13 and 14). That is a third axis again, and with it the tone map takes 76
# numbers. **Until 2026-10-12 this gave the list to the expansion alone, and counted sixteen
# parameters in it.**
#
# THE IMPLEMENTATION PRINTS RECEPTION AND TRANSMISSION AS TWO HALVES AND NO CHART, AND A HEADING
# MISSING FROM ONE HALF DENIES NOTHING. Eight of the 24 numbers have a heading in both. Fifteen
# have one under reception alone, **and until 2026-10-12 this file recorded them as received
# only.** They can be sent as well: the transmission half says at the head of its controllers
# that the instrument can transmit any control change, the address map names all fifteen among
# what an assignable button, slider, pedal or wheel can be set to, and the factory scenes ship
# with their sliders on six of them. See the account. So the fifteen state no direction, as
# the eight do not, which in this format says both. **One number is in the transmission half
# alone** - `Foot Type`, CC 4 - and it still says `transmits`, with a doubt beside it.
#
# **AND THERE IS NO CHART IN ANY OF THE ELEVEN DOCUMENTS.** No `MIDI Implementation Chart`
# heading, no Basic Channel row, no True Voice row, on any of the 377 sheets. That is why `mode` is
# unrecorded: the Mode row is where it would have come from.

definition: 1

model:
  manufacturer: Roland
  name: JUPITER-X
  # **`3.0 and later`, WHICH IS WHAT THE DOCUMENTS SAY RATHER THAN A VERSION THE INSTRUMENT
  # REPORTS.** The owner's manual states it plainly - "This Owner's Manual explains the
  # basic operations of the JUPITER-X (Ver. 3.0 and later)." (owners_manual p. 1) - and the
  # Reference Manual and the Sound List print the words as well. Seven of the eleven titles on
  # the downloads page carry them; the two expansion guides', the install manual's and the
  # Roland Cloud manual's do not. Until 2026-10-12 this said ten of the eleven documents say it
  # and every title does. **The implementation's own version is a different number**:
  # its first sheet reads `Date: Apr 19, 2022 Version: 1.06`, which is the document's revision and
  # not the firmware's, and the file is served as `eng06` to match. So a reader comparing the two
  # is comparing a firmware floor with a document revision.
  # The keyboard is 61 keys - "Roland JUPITER-X: Synthesizer Keyboard 61 Keys (semi-weighted
  # keyboard and channel aftertouch)" (owners_manual p. 4) - and the Xm is the same engine in a
  # 37-key box, which is why seven of the eleven documents are titled for both and ten name it
  # somewhere, all but the Sound List.
  firmware: "3.0"
  # Checked 2026-10-06.

source: >-
  **ELEVEN ENGLISH DOCUMENTS, 377 SHEETS, AND THE TWO THAT MATTER DIVIDE THE WORK THE OPPOSITE WAY
  ROUND FROM THIS MAKER'S LAST INSTRUMENT HERE.** See the comment above the definition. Every one
  of the eleven was opened and searched, because rank 89 cost a corrected definition for reading
  the document whose name promised the map and not the one that held it.

  WHAT IS IN EACH, WHICH IS THE POINT OF LISTING THEM. The `MIDI Implementation` (90 sheets) holds
  the 24 controllers below and the system exclusive address map, and gives no tone parameter a
  controller number. The `Parameter Guide` (75) holds the per-model tone tables, every `Rx` switch,
  and the system MIDI settings this definition's clock rests on. The `Reference Manual` (65) holds
  the models, the parts and the polyphony. The `Owner's Manual` (31) holds the specification. Both
  of those print the range of controllers an assignable control can be set to. **Of the other seven,
  three name no controller number**: `SOUND PACK/WAVE EXPANSION Install Manual` (4), `Roland Cloud
  Connect Setup Manual` (3) and `MainStage Profile Usage Guide` (2), in their text and in their
  pictures. The `Editor Owner's Manual` (14) has none in its text and one in a picture: its
  screenshot of a tone editor shows a `Source 1` set to `MOD:CC01` (sheet 10). The `Sound List` (61)
  gives the two sliders of each of its 192 factory scenes a function, and 298 of the 384 are
  controllers (sound_list pp. 3-8). The `Vocal Designer Model Expansion` guide (13) names one in
  passing, "CC17 (controller number 17)" (vocal_designer p. 7). And the `JD-800 Model Expansion`
  guide (19) has a map of its own. **Until 2026-10-12 this said the seven named none but for the
  JD-800's.** The search behind that did not look for the Sound List's spelling, `CUTOF: CC74`, or
  at a picture.

  **FIFTEEN NUMBERS HAVE NO HEADING UNDER TRANSMISSION, ONE SENTENCE SAYS ANY CONTROLLER CAN BE
  SENT, AND THE CONTROLS THAT SEND ARE OFFERED ALL FIFTEEN.** 5, 10, 66, 67, 68, 71, 72,
  73, 75 to 78, 84, 91 and 93 each have a heading under reception (implementation pp. 1-3) and none
  under transmission, whose headings are bank select, 1, 4, 7, 11, 64, 65 and 74 (implementation
  p. 6). First, the transmission half opens its controllers with "By selecting a controller number
  that corresponds to the setting of parameters of controllers (knobs, etc.), this unit can transmit
  any control change message." (implementation p. 6). Second, the address map gives the three
  assignable buttons, the two sliders, the two pedals and the two wheels a function each, in the
  system's block and again in the scene's, eighteen parameters, and every one lists the controllers
  from `MOD:CC01` to `PHASR:CC95` with 32 as `OFF:CC32` (implementation pp. 9, 10, 12 and 13). The
  fifteen are there as `PTIME:CC05`, `PAN:CC10`, `SOSTE:CC66`, `SOFT:CC67`, `LEGAT:CC68`,
  `RESO:CC71`, `RELES:CC72`, `ATTAK:CC73`, `DECAY:CC75`, `VRATE:CC76`, `VDPTH:CC77`, `VDLY:CC78`,
  `PCTRL:CC84`, `REV:CC91` and `CHO:CC93`. Third, the Parameter Guide gives a slider's choices as
  "CC01–CC95 Controller number 1–95" (parameter_guide p. 3), and its table of what can be assigned
  to which control has a row `CC01–31, 32 (OFF), 33–95` marked in all six columns (parameter_guide
  p. 37), which the Reference Manual and the Owner's Manual print as well (reference p. 52;
  owners_manual p. 31). Fourth, the Sound List has the factory scenes' sliders on six of the
  fifteen: `RELES: CC72` 76 times, `ATTAK: CC73` 73, `RESO: CC71` 37, `PTIME: CC05` 26,
  `DECAY: CC75` five and `VDPTH: CC77` once, of 298 (sound_list pp. 3-8). **A missing heading denies
  nothing, so the fifteen state no direction**, which is the reading `roland/juno_x` gives the four
  of them that its own implementation leaves out of transmission. Until 2026-10-12 each said
  `direction: receives`. What sending rests on is the first of the four and one sentence of the
  Reference Manual, "MIDI messages can be sent from the MIDI OUT connector and from USB MIDI OUT
  when you operate the controllers of this unit, such as the knobs and keyboard, and the various
  pedals connected to the rear panel." (reference p. 45). The second and third say a control can be
  set to the number, and the fourth that the factory's sliders are.

  **THE TONE PARAMETERS' NUMBERS ARE COUNTED HERE AND NOT CARRIED, AND THE COUNT WAS WRONG UNTIL
  2026-10-12.** The Parameter Guide's `CC#` column is in six tables (parameter_guide pp. 16-24):
  the common parameters of the tones it heads `RD-PIANO, XV-5080, PR-A, PR-B, PD-C, PR-D,
  COMMON, PR-X`, 7 rows with a number; `JUPITER-8`, 33; `JUNO-106`, 22; `JX-8P`, 30; `SH-101`,
  22; and `JUPITER-X`, 35, four of whose rows hold more than one number. That is 149 rows and
  155 numbers, 52 of them distinct, where this file said 156 rows over 46. A row is counted
  here as what lies between two rules of a table. Two readers who did not see each other's
  reading agree on every table, number for number. See the comment above the definition for
  what the numbers collide over, and for the lists that give a tone's four partials sixty
  numbers, seventeen of them in no table.

  **THE PARAMETER GUIDE'S TONE MAP HAS A SYSTEM SWITCH, AND FOUR OF THE NUMBERS BELOW ARE TONE
  NUMBERS TOO.**
  The first of the Parameter Guide's tone tables has a note above it, "You can set whether control
  change messages (CC) are transmitted/received" (parameter_guide p. 16), by the Tone CC Map
  parameter, which "Sets whether control change messages (CC) for the tone parameters are
  transmitted/received (ON) or not (OFF)." (parameter_guide p. 36). 5 is the portamento time in all
  six tables, as it is in the implementation. **84 is not the same thing in the two documents**: the
  implementation's is Portamento control, whose value is a note (implementation p. 2), and the
  `JUPITER-X` tone table gives 84 to `FENV1 DECAY`, by its footnote the first filter envelope's
  (parameter_guide pp. 23-24). No page reconciles them, and the control below is the
  implementation's. The JD-800 guide's effects table gives 93 to `CH Level` and 91 to `RV Level`
  (jd_800 pp. 13-14), the numbers of the two send levels below, and that guide does not name the
  switch.

  **THE IMPLEMENTATION CONTRADICTS ITSELF ABOUT NRPN, SO `nrpn` IS LEFT EMPTY RATHER THAN SET TO
  `none`.** Three of its sentences treat NRPN as something this instrument holds: Data Entry is "the
  value of the parameter specified by RPN/NRPN" (implementation p. 1), RPN null sets both RPN and
  NRPN to `unspecified` (implementation p. 3), and Reset All Controllers resets "NRPN unset;
  previously set data will not change" (implementation p. 4). **And the reception half, whose
  headings name 34 controller numbers, has none for 98 and none for 99**, which are the only way to
  select an NRPN parameter, and no NRPN parameter list exists anywhere in 90 sheets. A document that
  says a thing twice and does not agree gets neither statement carried, and the disagreement written
  down instead - which is the rule `novation/peak` and `novation/circuit_tracks` established for
  `default` and which has not been applied to this field before.

  AND IT CONTRADICTS ITSELF ABOUT ITS OWN MODEL ID, WHICH CHANGES NOTHING AND IS WORTH KNOWING. Its
  prose says "The model ID of the exclusive messages used by this instrument is 00H 00H 00H 65H."
  (implementation p. 5) and the two byte tables on that same sheet both gloss the fourth byte as
  `52H model ID #4`, each under a line of bytes that has 65H there. The identical table in the
  transmission half reads `65H` in its bytes and in its gloss, and a line under it has the model ID
  ending 65H (implementation p. 7), and the worked checksum example sends `F0 41 10 00 00 00 65 12`
  (implementation p. 90). **Seven places give 65H and two give 52H**, so the two are the misprint -
  which a consumer needs only because a sysex implementer reading sheet 5 alone would address a
  device that is not there.

  EVERY CONTROL NAMES ITS PART, ONCE FOR THE FOUR PARTS AND ONCE FOR PART R, AND SEVEN NUMBERS
  ARE THE FOUR PARTS' ALONE. Each part listens on a channel of its own setting, "Specifies the
  MIDI receive channel of each part." (parameter_guide p. 6), so none derives its channel from a
  base, and a control naming no part would mean one. The implementation's entries change the
  part's own parameters - "The Cutoff parameter (SCENE PART EDIT: MODIFY) will change."
  (implementation p. 2) - so a controller reaches whichever part listens on the channel it
  arrives on. Six entries name a parameter the Parameter Guide marks `Part 1–4 only`
  (parameter_guide p. 5) - Porta Time, Porta Sw, Legato Sw and the three vibrato offsets, which 5,
  65, 68 and 76 to 78 change - and the entry for 84 says its glide "is determined by the Portamento
  Time value." (implementation p. 2), the same parameter. So the four parts carry all 24 numbers
  and Part R the other seventeen, Foot Type and bank select among them: 41 controls.

  NOT RECORDED: the mode, there being no chart in any of the eleven documents to carry a Mode row.
  The transport, which **no document mentions in any spelling** - the implementation's System
  Realtime sections hold Active Sensing and nothing else in either direction, `F8H`, `FAH`, `FBH`
  and `FCH` appear on none of its 90 sheets, and the `START/STOP` in the reference manual is a
  function assignable to a pedal (reference p. 52) rather than a message. And the polyphony as a
  number, for the reason the maker gives.

