  release_notes_37:
    kind: release_notes
    title: AstroLab 37 firmware release notes, through 1.7.0
    edition: "1.7.0"
    dated: 2026-02-26
    landing: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    url: "https://www.arturia.com/api/content/resources/release_notes?resource_id=27511"
    sha256: aff40562e459de20a96e6edbc523832a30af73b55a7f30aadd62243c3ca9fd09
    retrieved: 2026-10-03
    paginated: false
    # FETCHED FOR THE OPPOSITE REASON AND CITED FOR A SCOPE DECISION: whether the AstroLab 37
    # belongs in this definition. It does not. Its list starts at V 1.5.9, a version neither of
    # the others has, and carries an entry about its own preset ranges that theirs do not. The
    # 37 has a definition of its own, which cites its notes through 2.0.0.
  resources_page:
    kind: download_page
    title: Arturia - AstroLab
    landing: "https://www.arturia.com/products/hardware-synths/"
    url: "https://www.arturia.com/products/hardware-synths/astrolab/resources"
    sha256: c206b9a1312d5b55d4daec2593a052723b7efbcf8f34ae2084e38ad0929d3573
    retrieved: 2026-10-10
    paginated: false
    # ONE PAGE FOR THREE PRODUCTS, and its own data carries far more than it shows: a record for
