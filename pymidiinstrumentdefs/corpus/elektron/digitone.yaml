  lfo1_multiplier:        {label: Multiplier LFO1, cc: 108, nrpn: 177, part: synth, group: lfo}
  lfo1_fade_in_out:       {label: Fade In/Out LFO1, cc: 109, nrpn: 178, part: synth, group: lfo}
