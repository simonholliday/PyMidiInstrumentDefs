  vco_1_tune:                       {label: VCO 1 TUNE, cc: 77, direction: receives, group: vco}
  vco_2_tune:                       {label: VCO 2 TUNE, cc: 78, direction: receives, group: vco}
  vco_detune:                       {label: VCO DETUNE, cc: 79, direction: receives, group: vco}
