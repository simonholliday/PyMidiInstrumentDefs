    retrieved: 2026-10-04
    page_offset: 0
    # 89 pages, stating no version anywhere. Carries the panel, the MIDI settings, the part
    # parameters and the effect sends.
  update:
    kind: release_notes
    title: MC-101 Update
    edition: eng09
    landing: "https://www.roland.com/global/support/by_product/mc-101/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/MC-101_update_eng09_W.pdf"
    sha256: e0b943a32429bdd75e78d919de292d4f8bb20e1c158d949cd88b6cbc4078fe75
    retrieved: 2026-10-04
    page_offset: 0
    # 21 pages, cumulative, newest first: Ver.1.80, 1.71, 1.60, 1.50, 1.30, 1.20 and 1.02, each
    # in a section of its own. **It carries three controller numbers the chart does not**, and
    # it is where the Control Channel comes from.
  sibling_chart:
    kind: midi_implementation
    title: MC-707 MIDI Implementation Chart
    edition: eng03
    dated: 2020-09-25
    landing: "https://www.roland.com/global/support/by_product/mc-707/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/MC-707_MIDIImpleChart_eng03_W.pdf"
    sha256: 9e2b15b507e63523b02d40fe4e6793cbb2525e36efbfa2627ef9dea0c58c9697
    retrieved: 2026-10-03
    page_offset: 0
    # **ANOTHER INSTRUMENT'S CHART, cited for one sentence about this one.** The MC-707's chart
    # prints "SOUND Knob *1" and footnotes it "*1 for MC-101 compatibility.", which is the
    # maker saying where CC 83 comes from. This chart prints the same row with no footnote.
    # Nothing else here rests on it; it is `roland/mc_707`'s own source.

midi:
  # The chart's Basic Channel row gives 1-16 as both the default and the changed value in both
  # columns, with the remark "Memorized" (chart p. 1) - so no factory channel is published, and each track is
  # given one by the player: "Track1-4 Ch 1-16 Specifies the MIDI channel of each track"
  # (reference p. 40).
  channels: [1, 16]
  # The chart's Mode row gives nothing transmitted and "Mode 3" recognised (chart p. 1):
  # Omni off, Poly.
  mode: 3
  # BOTH, AND THE SETTINGS SAY WHICH WAY EACH GOES. The chart marks Clock o in both columns; the
  # system settings have "Sync Out OFF, ON Specifies whether clock, start, and stop messages are
  # transmitted (ON) or are not transmitted (OFF)" per port, against a "Sync Src AUTO, INT, MIDI,
  # USB" for the other direction (reference p. 40).
  clock: both
  # BOTH, WITH ONE ASYMMETRY THE CHART IS EXPLICIT ABOUT: Start and Stop are o in both columns
  # and **Continue is x transmitted, o recognised** - it answers to a continue and never sends
  # one. Song Position, Song Select and Tune Request are x in both.
  transport: both
  program_change:
    # o in both columns, where Version 1.00 had x in both - this was added by firmware, and the
    # update notes put it at Ver.1.20. What it reaches depends on the channel; see below.
    receives: true
    sends: true
    # THE SCENES, WHICH ARE WHAT A PROGRAM CHANGE ON THE CONTROL CHANNEL SELECTS: the chart's
    # True Number row gives 0-127 both ways and its footnote reads "*1 Scene change (0-127) on
    # control channel, Clip change (0-15) on track channel." (chart p. 1) A program change on a *track*
    # channel selects one of that track's clips instead - "You can assign up to 16 clips to each
    # track" (reference p. 7) - which this field has no room for.
    presets: 128
  # NONE, CHECKED RATHER THAN UNREAD. The chart lists its controller numbers individually and 98
  # and 99 are not among them, it has no NRPN row, and the words NRPN, RPN, Registered Parameter,
  # Data Entry and Bank Select occur **nowhere in any of this instrument's five documents**.
  nrpn: none
  # NOT RECORDED, BECAUSE TWO DOCUMENTS CONTRADICT EACH OTHER. The chart marks System Exclusive x
  # in both columns; the reference manual carries a "Device ID 17-32" parameter for "When
  # transmitting and receiving system exclusive messages, the device ID numbers of both devices
  # must match" (reference p. 40). Recording either would be choosing between them, and nothing
  # published here does. The same contradiction stands on the MC-707.

voice:
  addressing: pitches
  # The chart gives "Note Number" as "0-127" in both columns, and True Voice 0-127
  # recognised (chart p. 1).
  note_range: [0, 127]
  velocity:
    # The chart gives Note On o in both columns and Note Off o in both, so this instrument sends
    # and answers to a note-off velocity as well as a note-on one.
    note_on: both
    note_off: true
  # RECEIVED ONLY, AND BOTH KINDS. The chart has two After Touch rows, Key's and Channel's, and
  # both are x transmitted and o recognised. `poly` is the stronger of the two and is published;
  # channel pressure is answered to as well, and the Ver.1.80 notes give it a per-track switch of
  # its own, "Rx ChPress" (update p. 5).
  aftertouch: poly
  pitch_bend:
    # RECEIVED AND NEVER SENT - the chart's Pitch Bend row is x transmitted, o recognised - and
    # settable: "Bend Range 0-24, TONE Specifies the amount of pitch change in semitone units
    # (maximum two octaves) that occurs when you move a controller when pitch bend is assigned to
    # that controller" (reference p. 45). No default is stated, so no figure is recorded.
    programmable: true

parts:
  # Each track is given a channel by the player and the control channel likewise, so neither
  # derives one: there is no base channel on this instrument to derive from.
  track:
    label: Track
    # "Track1-4 Ch" (reference p. 40), and the panel's TRACK SEL [1]-[4] buttons.
    count: 4
    channel: assigned
    addressing: pitches
    # NOTES, CONTROLLERS AND A PROGRAM CHANGE OF ITS OWN, the last selecting one of the track's
    # sixteen clips. The Ver.1.80 notes add a per-track switch for each of nine controller
    # numbers, which is a second statement that controllers reach a track.
    receives: [notes, controls, program_change]
  control:
    label: Control Channel
    count: 1
    channel: assigned
    # A CHANNEL THAT MAKES NO SOUND AND IS NOT A TRACK. "Control Channel CH1, CH2, CH3...CH16
    # Specifies the MIDI channel that switches scenes" (update p. 20). It takes a program change,
    # which switches the scene, and note numbers 60 to 75, which work the Scatter Pad - the
    # chart's second footnote reads "*2 Scatter Pad (60-75) on control channel" (chart p. 1),
    # and the update
    # notes say the same from the other side, "Use note numbers 60-75 on the control channel"
    # (update p. 11). **It takes no control change**: nothing in any document says a controller
    # reaches it, and a control sent to a channel an instrument ignores does nothing and says
    # nothing about why.
    receives: [notes, program_change]

groups:
  # NONE OF THESE SEVEN LABELS IS THE MAKER'S WORD, because the chart heads nothing over its
  # control change rows - all twenty-five sit under the single heading "Control Change". They are
  # `roland/mc_707`'s, deliberately: the two instruments publish the same twenty-five numbers
  # with the same names, and two definitions of one family inventing two different sets of
  # made-up headings would be worse than sharing one. The control *names* below are the chart's
  # own, verbatim, including its lower-case "Attack time" and its two "General Purpose Effect"
  # rows.
  controllers: Controllers
  portamento: Portamento
  pedals: Pedals
  tone: Tone
  vibrato: Vibrato
  knobs: Knobs
  effects: Effects

controls:
# ──── controllers ────

  modulation:              {label: Modulation, cc: 1, direction: receives, group: controllers}
  breath_control:          {label: Breath Control, cc: 2, direction: receives, group: controllers}
  foot_control:            {label: Foot Control, cc: 4, direction: receives, group: controllers}
  volume:                  {label: Volume, cc: 7, direction: receives, group: controllers}
  panpot:                  {label: Panpot, cc: 10, direction: receives, group: controllers}
  expression:              {label: Expression, cc: 11, direction: receives, group: controllers}

  # ──── portamento ────

  portamento_time:         {label: Portamento Time, cc: 5, direction: receives, group: portamento}
  portamento_control:      {label: Portamento control, cc: 84, direction: receives, group: portamento}

  # ──── pedals ────

  hold_1:                  {label: Hold 1, cc: 64, direction: receives, group: pedals}
  portamento:              {label: Portamento, cc: 65, direction: receives, group: pedals}
  sostenuto:               {label: Sostenuto, cc: 66, direction: receives, group: pedals}
  soft:                    {label: Soft, cc: 67, direction: receives, group: pedals}
  legato_foot_switch:      {label: Legato Foot Switch, cc: 68, direction: receives, group: pedals}

  # ──── tone ────

  resonance:               {label: Resonance, cc: 71, direction: receives, group: tone}
  release_time:            {label: Release Time, cc: 72, direction: receives, group: tone}
  attack_time:             {label: Attack time, cc: 73, direction: receives, group: tone}
  cutoff:                  {label: Cutoff, cc: 74, direction: receives, group: tone}
  decay_time:              {label: Decay Time, cc: 75, direction: receives, group: tone}

  # ──── vibrato ────

  vibrato_rate:            {label: Vibrato Rate, cc: 76, direction: receives, group: vibrato}
  vibrato_depth:           {label: Vibrato Depth, cc: 77, direction: receives, group: vibrato}
  vibrato_delay:           {label: Vibrato Delay, cc: 78, direction: receives, group: vibrato}

  # ──── knobs ────

  filter_knob:             {label: FILTER Knob, cc: 80, group: knobs}
  mod_knob:                {label: MOD Knob, cc: 81, group: knobs}
  fx_knob:                 {label: FX Knob, cc: 82, group: knobs}
  sound_knob:              {label: SOUND Knob, cc: 83, group: knobs}

  # ──── effects ────

  reverb_send:             {label: General Purpose Effect 1 (Reverb Send Level), cc: 91, direction: receives, group: effects}
  chorus_send:             {label: General Purpose Effect 3 (Chorus Send Level), cc: 92, direction: receives, group: effects}
  chorus_delay_send:       {label: Rx ChoDlySend, cc: 93, direction: receives, group: effects}
