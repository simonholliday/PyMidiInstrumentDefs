    retrieved: 2026-10-06
    paginated: false
    # **Cited for the count being four, and for the page existing at all.** This instrument is
    # discontinued, and this maker's discontinued pages are usually empty shells - `roland/tr_909`
    # had to be built from the US manual archive for exactly that reason. This one is a current
    # product's page in every respect: four documents, each behind a GUID that prints its file
    # address twice. **So that habit is not a rule**, and the next discontinued Roland is worth
    # checking before assuming.
    # Two of the four are titled without a language prefix and two with `[English]`, which is this
    # maker's way of marking a document that exists in one language only.
    # The digest is of the extraction, which pairs each document with its GUID page and the
    # file that page serves; the served markup is saved beside it as `.html`, whose own
    # digest is 4adfa288e88a56e6f1a041c212e817a08cdfecb0897ad7c3e6070529bda5f396. One page, cited by name.

midi:
  # `10` by default and `1-16, OFF` either way, marked `Memorized` (chart) - and the manual gives
  # the third state: "ONn (OMNI) MIDI messages of all channels are received. The MIDI transmit
  # channel will be 10." (manual). **An omni TR-8 still transmits on 10**, and switching the
  # channel off stops it transmitting entirely: "No MIDI messages are transmitted out when the
  # MIDI channel is set to OFF." (update p. 5).
  channels: [1, 16]
  # **FOUR, WHICH IS OMNI OFF AND MONO**, default and the only value either way (chart). An odd
  # row for an eleven-voice drum machine, and it is what the chart says.
  mode: 4
  # **RECEIVED BY DEFAULT AND SENT, WITH A SETTING THAT NARROWS WHAT IS OBEYED.** The chart marks
  # Clock as answered both ways, and the manual gives the source: `AUTO` means "If MIDI clock is
  # being input to the MIDI IN connector or the USB port, the TR-8's tempo will automatically
  # synchronize to MIDI clock (default)." (manual), against `INTERNAL`.
  clock: both
  # **SENT AS START AND STOP, RECEIVED AS ALL THREE** (chart): continue is crossed in the
  # transmitted column and marked in the recognized one, where the footnote says "The same
  # processing will be carried out as when Start is received." (chart). **And whether any of them
  # is obeyed is a power-on setting**: `ON` means "Only MIDI clock is received" (update p. 5)
  # and `OFF`, the default, "MIDI clock, play, and stop messages are received" (update p. 5).
  transport: both
  program_change:
    # **RECEIVED AND NEVER SENT**, crossed in the transmitted column (chart).
    receives: true
    sends: false
    # `1-15` in the True Number row (chart), which is the pattern count rather than a kit count -
    # the manual gives sixteen kits and sixteen patterns, and this row reaches fifteen of them.
    presets: 15
  # Crossed in all four boxes of its row (chart), so nothing here is addressed by system
  # exclusive. **That is a checked absence rather than a silence**, which is what a chart is for.
  sysex: false
  # NOT RECORDED, NRPN: the chart has no row for it and no document mentions it.

voice:
  # Its notes name drums, and the chart's True Voice row is struck through rather than filled.
  addressing: voices
  # **EVERY NUMBER FROM 35 TO 51 SOUNDS SOMETHING**, because six of the eleven instruments answer
  # to two numbers each - see the comment above the definition. That is seventeen notes with no
  # gap, which `korg/drumlogue` and `korg/volca_beats` cannot manage over spans of twenty and
  # forty.
  note_range: [35, 51]
  # NOT RECORDED, the polyphony. Eleven instruments and no statement of how many sound at once.
  velocity:
    # Both ways with the status byte given: `o 9nH` transmitted and recognized (chart).
    note_on: both
    # And note off is sent as a note on with a velocity of nothing - `o 9nH v=00` transmitted -
    # while a real note off is recognized (chart).
    note_off: true
  # **NONE, AND THE CHART CROSSES BOTH KINDS IN BOTH DIRECTIONS**: key's and channel's, transmitted
  # and recognized (chart). A checked absence rather than a silence.
  aftertouch: none
  # NOT RECORDED as a depth, because there is none: pitch bend is crossed both ways (chart), so
  # this instrument has no pitch bend at all rather than an unpublished range.
  voices:
    # **THE ELEVEN, AT THE HIGHER NUMBER OF EACH PAIR** - see the comment above the definition for
    # why that one and not the other. The names are the chart's and are the TR-707's, which the
    # chart's own footnote says will differ with the instrument set.
    bass_drum: 36
    rim_shot: 37
    snare_drum: 38
    hand_clap: 39
    closed_hi_hat: 42
    low_tom: 43
    open_hi_hat: 46
    mid_tom: 47
    crash_cymbal: 49
    high_tom: 50
    ride_cymbal: 51

