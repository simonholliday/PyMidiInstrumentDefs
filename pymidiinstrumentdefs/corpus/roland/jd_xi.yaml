# **FOUR PARTS ON FOUR FIXED CHANNELS, AND ONLY THE OWNER'S MANUAL SAYS WHICH.** "The MIDI
# transmit/receive channels are channel 1 for the Digital Synth 1 part, channel 2 for the Digital
# Synth 2 part, channel 10 for the Drum part, and channel 3 for the Analog Synth part." (manual
# p. 15). It gives them twice, the second time as a table under "The channels used by the JD-Xi
# to transmit and receive MIDI messages are fixed and cannot be changed." (manual p. 17), and of
# its settings only one sets a channel, Prog Rx/Tx Ch, which is the program's (manual p. 13).
#
# **THE IMPLEMENTATION HAS A RECEIVE CHANNEL FOR EACH PART, AND NO PAGE EXPLAINS IT.** Its
# address map gives each of the four parts a Program Part block (implementation p. 8), whose
# first parameter is `Receive Channel (0 - 15)`, shown as 1 to 16 (implementation p. 10). That
# map is what system exclusive messages read and write (implementation p. 5), and it marks with
# `<*>` the addresses the JD-Xi ignores when it receives them (implementation p. 8); this one
# is not marked. No other page of the five documents names the parameter. So the parts are
# recorded on the manual's channels and as fixed, which is what the manual says; that a system
# exclusive message could move one is what the map suggests and no page states.
#
# **SO THE SAME CONTROLLER MEANS DIFFERENT THINGS ON DIFFERENT CHANNELS.** Controller 102 is the
# first partial's cutoff on channels 1 and 2, the whole analog tone's cutoff on channel 3, and
# nothing at all on channel 10. The parts below carry that, which is what `part` is for and what
# eight Elektron definitions here already do.
#
# **ITS MAP IS IN TWO PLACES AND THE SECOND IS WHERE THE FIRST SAYS IT IS.** The chart gives 22
# groups of controller numbers, and three of them - 12 to 18, 83, and 102 to 119 - carry no name
# at all, only "*4 Refer to Control Change Message List (p. 14) about function of each controller
# number." (implementation p. 17). That list is section 6 of sheet 14, **6,138 characters into a
# page that opens with the tail of a system exclusive address map**. A first reading of that
# page's beginning found no list and was one sentence away from recording that Roland had printed
# a stale cross-reference. **A page is not a page's first screen.**
#
# **TWENTY-ONE OF THE NINETY-EIGHT CONTROLS BELOW ARE ADDRESSED BY NRPN RATHER THAN BY A CONTROLLER
# NUMBER**, which makes this the first Roland here with `nrpn: supported` - `roland/fantom_6_7_8`
# and the rest have `none`. The list gives each as a most and a least significant byte, and every
# one of them has a most significant byte of nought, so the address below is the least significant
# byte as printed.
#
# **AND NINE OF THE NINETY-EIGHT NUMBERS ARE NOT PRINTED AS THEIR CONTROLS' NUMBERS ANYWHERE.**
# The maker writes its runs as spans - `Cutoff | 1 - 3 | 102 - 104` (implementation p. 14) is
# three partials and three controllers - so the inside of each run is **the interior of a
# printed range** rather than a printed number: 103, 106, 118 and 17 as controllers, and 125, 4,
# 16, 19 and 22 as NRPN numbers. That is reading a table rather than generating numbers - the
# run is three long and the rule is in the row, where `elektron/tonverk`'s refused 329 had
# neither - but a reader deserves to know that nine of these rest on arithmetic.
#
# **THE CITATION CHECKER'S THREE ARE THREE OF THOSE NINE.** It reads only the pages the account
# cites, and the list's has been one of them since 2026-10-12. **95 of the 98 are found as
# numbers and three only inside a span**: 103, 106 and 118, each inside the list's own span and
# inside the chart's `102-119` (implementation p. 17). The other six of the list's nine pass as
# numbers because the same digits are printed somewhere on the pages it reads, which is no
# evidence for them. Before the list's page was cited the figures were 89 and nine, all nine
# inside the chart's span, though the list prints 104, 105, 107 and 117 as numbers.
#
# **AND THE DRUM PART'S PARAMETERS ARE A RULE RATHER THAN A LIST, SO THEY ARE NOT CARRIED.** Four
# of them, each addressed by the note number: `Cutoff | 36 - 72 | NRPN MSB:89, LSB:Note`
# (implementation p. 14) and the same shape for Resonance at 92, Level at 64 and Envelope at 119.
# **That is 148 addresses stated as four rules**, and enumerating them would put numbers in this
# corpus that no page prints one by one - which is `elektron/tonverk`'s lesson at rank 86, where
# 329 generated numbers were refused by the gate and the gate was right.
#
# ITS CHART MISSPELLS THREE OF ITS OWN NAMES. The chart writes `Vibrate rate`, `Vibrate depth` and
# `Vibrate delay` (implementation p. 17) where the data reception section three sheets earlier
# writes "Vibrato Rate" (implementation p. 2), "Vibrato Depth" (implementation p. 2) and "Vibrato
# Delay" (implementation p. 2). The labels below take the correct spelling, and the script asserts
# both spellings so that a corrected re-issue fails there rather than leaving this paragraph
# stale.

definition: 1

model:
  manufacturer: Roland
  name: JD-Xi
  # **FIRMWARE 1.50, WHICH IS THE NEWEST ROLAND PUBLISHES AND IS NOT WHAT THE IMPLEMENTATION
  # DESCRIBES.** The implementation dates itself "Date: May 1, 2015" (implementation p. 1) at
  # "Version: 1.00" (implementation p. 1), and two supplementary manuals follow it - one for
  # 1.10 and one for 1.50. **Both were read and neither adds, removes or renumbers a controller**:
  # 1.10 is a
  # pattern-shift and a vocoder addition, 1.50 a set of sequencer and arpeggio changes. So the
  # map is the map, and that is a checked absence rather than an assumption.
  # Checked 2026-10-06.

source: >-
  **Roland's MIDI Implementation for this instrument, 18 sheets**, which is this maker's proper
  document of that name and the same shape as `roland/fantom_6_7_8`'s: reception, transmission, a
  parameter address map, a Control Change Message List (implementation p. 14), which gives each
  knob-operated parameter its controller number or its NRPN address, the partials' as spans, and
  two implementation charts.

  **FIVE DOCUMENTS, ALL ENGLISH, AND SEVEN MORE THAT ARE TRANSLATIONS OF ONE OF THEM.** Roland's
  manuals page lists twelve: the owner's manual in eight languages, a Parameter Guide, this
  implementation, and supplementary manuals for firmware 1.10 and 1.50. The five English ones are
  in the library and all five were read - 97 sheets between them.

  **TWO CHARTS, AND THEY ARE TWO SECTIONS OF ONE INSTRUMENT RATHER THAN TWO COMPETING MAPS.**
  Sheet 17 is the chart for the Sound Source Section and sheet 18 for the Sequencer section, which
  is `roland/fantom_6_7_8`'s arrangement and not `korg/drumlogue`'s - the drumlogue's two charts
  are the same instrument in two modes, where a number can mean a different thing on each part's
  channel. These two do not
  overlap: the sound source's control change block names 22 groups and the sequencer's names
  `0-119` wholesale, because a sequencer records whatever arrives. **The fields below are the
  sound source's, but for two that rest on the sequencer's chart: the sending of the clock, and
  the transport both ways.**

  WHY `presets` IS UNRECORDED THOUGH THE DOCUMENT COUNTS BANKS. The chart gives "Program No.1-128"
  (implementation p. 17) against its True Number row, and the reception section then lists sixteen
  bank-select combinations reaching four user banks of 64, four preset banks of 64 and eight extra
  banks of 64. **Multiplying those out would give a figure no page prints**, which is the same
  ruling `roland/fantom_6_7_8` made for the same maker: 1 to 128 is what one bank holds, and bank
  select chooses the bank.

  **SIX NUMBERS ARE KEPT OUT OF THE MAP.** Data Entry (6 and 38), the NRPN selects (98 and 99) and
  the RPN selects (100 and 101) are all named by the chart and none is a parameter of this
  instrument: they are how MIDI addresses things, and the registered parameters are under
  `pitch_bend`. Bank Select (0 and 32) is carried, as it is wherever a maker numbers it, once for
  each kind of part. Eight more are the channel mode messages, 120 to 127, which this format
  refuses as controls by design.

  THE REGISTERED PARAMETERS, OF WHICH THERE ARE THREE AND ONE REACHES A FIELD. "00H, 00H mmH, llH
  Pitch Bend Sensitivity mm: 00H - 18H (0 - 24 semitones)" (implementation p. 3), "00H, 01H mmH,
  llH Channel Fine Tuning" (implementation p. 3) and "00H, 02H mmH, llH Channel Coarse Tuning"
  (implementation p. 3). The first is `pitch_bend.programmable`; the other two are a tuning and a
  transpose, which this format does not hold.

  THE CONTROLLERS EVERY PART RECEIVES ARE HERE ONCE FOR EACH KIND OF PART. The reception section
  lists modulation, portamento time, volume, pan, expression, hold 1, portamento, the sound
  controllers 71 to 78 and two effect sends, 91 and 94, on any channel, most of them changing a
  parameter of the part that listens there - "The Part Cutoff Offset parameter (PROG:OFFSET) will
  change." (implementation p. 2) - and the address map gives all four parts, the drum part
  included, the same Program Part block, which holds `Part Level (CC# 7)`, the offsets 71 to 78
  and both sends (implementation pp. 8 and 10). The reception section keeps two channel mode
  messages from the analogue part, MONO and POLY (implementation pp. 3 and 4), and no other
  controller from any part. So each is recorded for the digital synth parts, the analogue synth
  part and the drum part, but for portamento time on the drum part, whose entry changes a tone's
  parameter that a drum kit does not have: 50 controls, and the controls say why. In this format
  a control naming no part means the base channel, which here is the first digital synth's alone.
  The five program effects, 12 to 15 and 83, name no part, because the Control Change Message
  List gives them no channel; the program has a channel of its own, which the comment above them
  names.

  **91 AND 94 ARE CARRIED THOUGH THE CHART HAS NO ROW FOR EITHER.** Its 22 rows of controller
  numbers include neither (implementation p. 17), where the reception section gives each an entry
  of its own, "General Purpose Effect 1 (Reverb Send Level) (Controller number 91)"
  (implementation p. 2) and "General Purpose Effect 4 (Delay Send Level) (Controller number 94)"
  (implementation p. 2), and the address map names each as a part's parameter, `Part Reverb Send
  Level (CC# 91)` and `Part Delay Send Level (CC# 94)` (implementation p. 10). The chart is the
  narrowest of the three and the other two agree, so both are recorded. They are received only
  because no page says the sound source sends them: the transmission section lists neither,
  though it leaves out the knobs' numbers too, and the chart has no row to mark.

  DIRECTIONS ARE THE SOUND SOURCE CHART'S. Its transmitted column crosses 7, 10, 11, 64, 65 and 71
  to 78 (implementation p. 17), and the transmission section lists none of the thirteen, so they
  are received only, on every part; the comment above the controls gives that section's list.
  Modulation and portamento time are circled and listed, and go both ways, and so do the numbers
  the Control Change Message List gives, which the chart circles. **The sequencer's chart circles
  `0-119` transmitted, and that is the sequencer rather than the sound source**: "Recorded
  messages are transmitted during playback." (implementation p. 8). So a pattern can send any of
  these numbers back out; the directions here are the sound source's, as the rest of the fields
  are but for the clock and the transport.

  NOT RECORDED: the polyphony, which no document states. 68, which the address map names beside
  a part's legato switch, `Part Legato Switch (CC# 68)` (implementation p. 10), and which neither
  the reception section nor the chart lists. The 51-sheet Parameter Guide's whole
  contents, which is a panel reference with no controller map, and names one number, the
  modulation wheel's, in passing - **checked, because its name suggests otherwise**. The drum
  part's 148 NRPN addresses, for the reason above. And the
  sequencer's own behaviour, of which the chart's footnotes give three sentences worth reading if
  somebody ever records into it: a note-off is recorded for each sounding note before an all-notes
  -off, and the all-notes-off itself is not recorded.

sources:
  implementation:
    kind: midi_implementation
    title: JD-Xi MIDI Implementation
    edition: "1.00"
    dated: 2015-05-01
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/JD-Xi_MIDI_Imple_e01_W.pdf"
    sha256: aa516bd31d972c3a7cbfe4f952712f09c9a8856a2c1d854e2f8b7c67ed6bb4a3
    retrieved: 2026-10-06
    # **18 sheets, and every one prints its own folio** - checked on all 18 rather than
    # sampled, so a locator here is the printed number.
    # Its two charts are sheets 17 and 18, for the Sound Source and Sequencer sections. Its
    # **Control Change Message List is section 6 of sheet 14**, below a system exclusive
    # address map and 6,138 characters into the page - which is where the chart's `*4` footnote
    # says it is and not where a reading of that page's opening would find it.
    page_offset: 0
  manual:
    kind: manual
    title: JD-Xi Owner's Manual
    edition: eng07
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/JD-Xi_eng07_W.pdf"
    sha256: b06cf33c4124f4a443ce8154f9df875d373f6dbaf745a63811b4402af1296cae
    retrieved: 2026-10-06
    # 22 sheets. **Cited for the four parts' channels, and that is the load-bearing citation**:
    # which channel each part is on, which the implementation never gives, and that they are fixed.
    # It also names the program's channel setting, and states the clock and transport in prose,
    # which the two charts give between them in marks.
    page_offset: 0
  parameter_guide:
    kind: manual
    title: JD-Xi Parameter Guide
    edition: e01
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/JD-Xi_ParameterGuide_e01_W.pdf"
    sha256: 08a8825e91d98bad0451f0717f1e932f780d6ac4819beaf8e40ee68a8e1269b2
    retrieved: 2026-10-06
    # **CITED FOR AN ABSENCE AND QUOTED FOR NOTHING, AND ITS NAME IS WHY IT WAS CHECKED.** 51
    # sheets, some thirty thousand words, and **no controller map** - neither `CC#` nor
    # `Controller number` nor `Control Change` appears anywhere in it. **One controller number is
    # in it, in passing**: `(CC01)` seven times, five on p. 14 and two on p. 19, each time beside
    # the modulation wheel or the modulation controller it names. Until 2026-10-12 this comment
    # said the guide held not one, and gave a count of its words to the last digit, which
    # depends on who counts. It is a panel reference: every parameter of every tone, by the knob
    # that reaches it. On this maker's other instruments a document called a Parameter Guide is
    # where the numbers are, so the absence is worth recording rather than leaving a reader to
    # search 51 sheets for themselves.
    page_offset: 0
  supplement_1_10:
    kind: firmware_addendum
    title: JD-Xi Version 1.10 Supplementary Manual
    edition: "1.10"
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/JD-Xi_v110_e01_W.pdf"
    sha256: d4882d89095a38fb6c7e22f28528075f7121ecf6865307e1f075fcd68dc06b57
    retrieved: 2026-10-06
    # Two sheets. **Cited for an absence**: it adds a pattern shift and a vocoder, and **no
    # controller number**.
    page_offset: 0
  supplement_1_50:
    kind: firmware_addendum
    title: JD-Xi Version 1.50 Supplementary Manual
    edition: "1.50"
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/JD-Xi_Leaflet_V150_e01_W.pdf"
    sha256: 674418bd41513fdb8f9f88466e3dbe0ecb165b094f261bc2c247ad63f0eea131
    retrieved: 2026-10-06
    # Four sheets, and **the newest firmware Roland publishes for this instrument**. Cited for
    # an absence: sequencer and arpeggio changes, and **no controller number**. So the map the
    # 2015 implementation prints is still the map, which is checked across both supplements
    # rather than assumed from their titles.
    page_offset: 0
  manuals_page:
    kind: web_page
    title: "Roland - Support - JD-Xi - Owner's Manuals"
    landing: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    url: "https://www.roland.com/global/support/by_product/jd-xi/owners_manuals/"
    sha256: 8f561e37f12917da7e0954ce48542e6d82c66df097344d2939039b7e2d80de27
    retrieved: 2026-10-06
    paginated: false
    # **Cited for the count being twelve**, which is what makes five English documents the whole
    # of what this maker publishes in English rather than five that were found.
    # **This is the working half of Roland's two arrangements**, which `roland/tr_909` learned
    # the hard way at rank 88: for a product still made, this page carries its documents as
    # GUIDs in the markup, each needing a fetch of its own; for a discontinued one the same page
    # is an empty shell and the route is the US manual archive. **And each GUID page prints its
    # file's address twice, once escaped** - met by `roland/ju_06a` at rank 87 - so a naive match
    # returns two addresses for one file.
    # The digest is of the extraction; the served bytes are saved beside it as `.html`, whose
    # own digest is b3e7b13231c643be017e2c140b26687d233c070ceeb47e0d64756dc7cabd393b. One page,
    # cited as p. 1.

midi:
  # The sound source chart's Basic Channel row: 1 to 16 as a default and as changed, both ways.
  # **AND THAT IS ABOUT THE INSTRUMENT RATHER THAN ABOUT ITS PARTS**, whose four channels are
  # fixed at 1, 2, 3 and 10 - see the parts below and the comment above the definition.
  # The sequencer's chart says something different in the same row, and it is worth knowing:
  # "Basic Channel Default Changed All channel x All channel 1-16 There is not specific basic
  # channel" (implementation p. 18). A sequencer records every channel.
  channels: [1, 16]
  # "Mode Default Messages Altered Mode 3 x ************** Mode 3 Mode 3, 4(M=1) *2"
  # (implementation p. 17) - mode 3 as the default both ways, with mode 4 also recognised and a
  # footnote on what happens to its voice count: "*2 Recognized as M=1 even if M1."
  # (implementation p. 17).
  mode: 3
  # **BOTH, AND THE TWO CHARTS DIVIDE IT BETWEEN THEM** - which is `roland/fantom_6_7_8`'s case
  # exactly. The sound source's chart crosses Clock transmitted and circles it recognised; the
  # sequencer's circles both: "System Real Time :Clock :Commands o o o *1 o *1" (implementation
  # p. 18). The owner's manual says the whole of it in one sentence: "The JD-Xi can transmit and
  # receive MIDI clock (F8) messages to synchronize its tempo." (manual p. 15).
  clock: both
  # NOT THE SAME DIVISION, THOUGH THE SAME SENTENCE CONTINUES. The sound source's chart crosses
  # Commands in both columns (implementation p. 17) and the sequencer's circles both
  # (implementation p. 18), so starting and stopping are the sequencer's alone, sent and received.
  # The manual: "It can also send and receive MIDI start (FA) and MIDI stop (FC) messages to
  # start or stop." (manual p. 15).
  transport: both
  program_change:
    # "Program Change : True Number o *1 ************** o *1 0-127 Program No.1-128"
    # (implementation p. 17). The `*1` is the footnote that applies to nine of this chart's
    # rows: "*1 o x is selectable (using System Exclusive Messages)." (implementation p. 17) -
    # so each of them can be switched off, and the sysex map carries `Receive Program Change`
    # and `Receive Bank Select` as the switches.
    receives: true
    sends: true
    # NOT RECORDED, the preset count. See the account: 1 to 128 is one bank and sixteen
    # bank-select combinations choose among sixteen banks, so a total would be arithmetic this
    # document does not do.
  # **SUPPORTED, AND THIS IS THE FIRST ROLAND HERE THAT IS.** The implementation devotes a
  # section to it and then lists the parameters: 21 of the controls below are addressed this way
  # rather than by a controller number. Its own description of the mechanism is worth a reader's
  # time - "Once an NRPN parameters has been specified, all Data Entry messages received on that
  # channel will modify the value of that parameter." (implementation p. 2) - because it means a
  # consumer must send the address and then the value, and should send an RPN null afterwards:
  # "To prevent accidents, it is recomended that you set RPN Null (RPN Number = 7FH/7FH) when
  # you have finished setting the value of the desired parameter." (implementation p. 2), typo
  # and all.
  nrpn: supported
  # Circled in both columns of both charts. Sheets 9 to 14 are a Parameter Address Map, which is
  # the bulk of the document, and the transmitted side carries a condition: `*3 Transmitted only
  # when "Transmitted Edit Data" is ON or RQ1is received.` (implementation p. 17) - a
  # sentence with a quotation inside it, given as an identifier rather than requoted.
  sysex: true

voice:
  addressing: pitches
  # The chart's recognised Note Number and its True Voice row both give 0 to 127 - the
  # instrument saying it sounds every note it answers to. **What it sends is narrower and is a
  # fact about the keys**: 0 to 108 transmitted, for a 37-key keyboard with a transpose.
  note_range: [0, 127]
  velocity:
    # "Velocity Note On Note Off o o o o" (implementation p. 17) - circled in all four cells, so
    # both a striking and a release velocity travel in both directions.
    note_on: received
    note_off: true
  # **BOTH KINDS RECEIVED, NEITHER TRANSMITTED, AND EACH CAN BE SWITCHED OFF.** The chart's
  # After Touch rows cross both transmitted cells and circle both recognised ones, each under
  # the `*1` footnote - and the sysex map names the switches, `Receive Polyphonic Key Pressure`
  # and `Receive Channel Press`. `poly` is the stronger of the two words this field holds, which
  # follows `roland/mc_707` and `roland/fantom_6_7_8`.
  aftertouch: poly
  pitch_bend:
    # Circled both ways under the `*1` footnote, and settable over the first of the three
    # registered parameters - 0 to 24 semitones. The document gives no factory depth, so
    # `semitones` is unrecorded and what is recorded is that it can be set.
    programmable: true

parts:
  # **FOUR PARTS ON FOUR FIXED CHANNELS, EXPRESSED AS OFFSETS FROM ONE BECAUSE THAT IS WHAT THIS
  # FORMAT HAS.** The channels are 1, 2, 3 and 10, which the owner's manual gives twice and calls
  # fixed; the address map's `Receive Channel` for each part is the one sign of a setting, and no
  # page explains it (see the comment above the definition). `channel_offset` says a part's
  # channel is derived from a base and cannot be set on its own; the second half of that is the
  # manual's word here and the first half is a fiction, there being no base to derive from because
  # the base never moves. **The numbers a consumer sends are right** - 1 + 0, 1 + 1, 1 + 2, 1 + 9 -
  # and the fiction is recorded here rather than left for somebody to find. One for the format
  # specification's list of what it cannot say.
  digital_synth:
    label: Digital Synth
    count: 2
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
    # **TWO PARTS WITH ONE MAP**, on channels 1 and 2. Each is a SuperNATURAL Synth Tone of
    # three partials, and 27 of the controls carrying this part are the three partials' nine
    # parameters - so a consumer addresses partial 2's cutoff on either channel with the same
    # controller, 103.
  analog_synth:
    label: Analog Synth
    channel_offset: 2
    addressing: pitches
    receives: [notes, controls, program_change]
    # **ONE TONE WITH ONE PARTIAL, TAKING THE FIRST ADDRESS OF EACH OF THE DIGITAL PART'S RUNS.**
    # So controller 102 is this part's whole cutoff where it is the first partial's on channels
    # 1 and 2 - the collision the `part` field exists for. It has one parameter the digital tone
    # has no counterpart for, a pulse width at NRPN 37.
  drum:
    label: Drum
    channel_offset: 9
    addressing: voices
    receives: [notes, controls, program_change]
    # **ITS OWN PARAMETERS ARE NOT CARRIED, AND THAT IS A DECISION RATHER THAN A GAP.** Four of
    # them, each addressed by the note it belongs to: `Cutoff | 36 - 72 | NRPN MSB:89, LSB:Note`
    # (implementation p. 14) and the same shape for Resonance at 92, Level at 64 and Envelope at
    # 119. **148 addresses stated as four rules**, and no page prints one of them. See the
    # comment above the definition.
    # Its 33 drum kits are reached by bank select 086/064 and program 001-033. The controllers
    # every part receives are carried for it, below, as `drum_`, all but portamento time.

groups:
  # **THE MIDI SPECIFICATION'S OWN SECTIONS FOR THE FIFTEEN IT NAMES**, which is what
  # `roland/fantom_6_7_8` does for the same maker's flat list - every one of those fifteen is a
  # standard assignment under its standard name. The two effect sends, 91 and 94, take that
  # definition's label for its own sends, under a key of their own because `effects` is taken
  # here. The other three groups are this instrument's own divisions, because the Control Change
  # Message List is written that way: a table per sound engine and one for the effects.
  continuous: Continuous controllers
  switch: Switches and pedals
  sound: Sound controllers
  sends: Effect send levels
  effects: Program effects
  partial: The digital synth's three partials
  analog: The analog synth

controls:

  # **THE CONTROLLERS EVERY PART RECEIVES, ONCE FOR EACH KIND OF PART**, as `digital_synth_`,
  # `analog_synth_` and `drum_`; see the account. **The drum part has no portamento time**: its
  # entry says "The Portamento Time parameter (TONE:COMMON) will change." (implementation p. 1),
  # and a drum kit's common block holds only its name and its level (implementation p. 13).
  #
  # **FIFTEEN OF THEM ARE RECEIVED ONLY.** Thirteen are 7, 10, 11, 64, 65 and 71 to 78, crossed in
  # the chart's transmitted column (implementation p. 17) and absent from the transmission section,
  # whose control changes are bank select, modulation, portamento time, data entry and the NRPN
  # selectors (implementation p. 5). The other two are 91 and 94, which the chart has no row for;
  # see the account. Modulation and portamento time are in both, and go both ways. **So do the
  # numbers the Control Change Message List gives**: the chart circles them transmitted, the list
  # is headed `(Knob operation)` (implementation p. 14), and the owner's manual says "Turning a
  # knob will transmit the corresponding control change message." (manual p. 15). What the
  # sequencer plays back is not counted; see the account.

  # Bank select ───────────────────────────────────────────
  # Carried, as it is wherever a maker numbers it, once for each kind of part: "Bank Select
  # (Controller number 0, 32)" (implementation p. 1) heads it under reception, and the same under
