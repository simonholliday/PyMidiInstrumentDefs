  midi_impl:
    kind: midi_implementation
    title: TEO-5 MIDI Implementation Document
    edition: v2
    landing: "https://oberheim.com/products/teo-5/"
    url: "https://oberheim.com/wp-content/uploads/2025/07/TEO-5-MIDI-Implementation-Document_v2.pdf"
    sha256: c04ca96ecfbd4ff9dd87160f944c1ba6fa33d5b3fd2e600bd652e61915ecec49
    retrieved: 2026-10-02
    # The edition is the file name's; the document's pages carry no version and no date. The
    # number printed on each page is its file page. No later edition is served: `_v3` and `_v4`
    # were tried under five upload folders and none answers.
    page_offset: 0
  guide:
    kind: manual
    title: TEO-5 User's Guide
    edition: Version 2.0
    dated: 2025-06
    landing: "https://oberheim.com/products/teo-5/"
    url: "https://oberheim.com/wp-content/uploads/2025/07/TEO-5-User-Manual_v2.pdf"
    sha256: 8c93b7f56efe827713be213d1d78b992c83e920bed4db50cc758d43ac1493715
    retrieved: 2026-10-02
    # CITED BY FILE PAGE, which is what `page_offset: 0` means here: the front matter is
    # unnumbered, so the printed number runs behind the file page by a varying amount and the
    # file page is the only one a reader can turn to.
    page_offset: 0
  product_page:
    kind: product_page
    title: "Oberheim TEO-5"
    landing: "https://oberheim.com/products/teo-5/"
    url: "https://oberheim.com/products/teo-5/"
    sha256: f7fff1f68b3f5553b0688f2d869aed02a1529f0c4ef6b0f26f225ee0ff278ca1
    retrieved: 2026-10-02
    paginated: false
    # Cited for the two things that are on it and in neither PDF: the OS versions, and the
    # connections - "5-pin DIN MIDI In, Out, Thru" and "USB MIDI". Its document links are in
    # the markup as served, so nothing had to be guessed to find the PDFs above.

midi:
  # "MIDI Channel: All, 1...16 - Selects which MIDI channel to send and receive data, 1 to 16.
  # All receives on all 16 channels" (p. 1), and the global table gives 4098 as 0-16 with
  # "0 = All".
  channels: [1, 16]
  # Six clock settings, three of which receive and three of which send; two of the six suppress
  # start and stop while still carrying clock (p. 1). So both go both ways, and which depends on
  # a global setting.
  clock: both
  transport: both
  program_change:
    # One switch each: "MIDI Prog Send: Off, On" and "MIDI Prog Receive: Off, On" (p. 2).
    receives: true
    sends: true
    # The guide's count of the instrument. See the source account for the five figures in the
    # implementation document that cannot all be right.
    presets: 512
  # "NRPNs are the preferred method" (p. 2), which is the maker's word for it, and most of the
  # controls below carry both numbers.
  nrpn: preferred
  # Device inquiry, three dump requests, three dumps and a packed-data format (pp. 12-15), all
  # behind a global switch. No layout is published.
  sysex: true

voice:
  addressing: pitches
  # "five voices, classic analog warmth" and "a five-voice architecture with genuine analog VCOs
  # and VCFs" (guide p. 6). There is no specifications page in the guide, so this is the prose.
  polyphony: 5
  velocity:
    note_on: received
    # "Note Off. Velocity is ignored" (p. 3). Its own keyboard has seven velocity curves to
    # choose between, "Velocity Curve: Curve 1... Curve 7" (guide p. 22) - which is seven names
    # against the global table's range of 0-7, one of the many places this maker is out by one.
    note_off: false
  # BOTH KINDS COME IN AND ONLY ONE GOES OUT. Polyphonic Key Pressure and Channel Pressure are
  # both in the received table (p. 3); the transmitted table has Channel Pressure and no
  # polyphonic row (p. 4). Whether either travels at all is one global switch: "Aftertouch On:
  # On, Off - Selects whether aftertouch (key pressure) is enabled or disabled. If disabled, the
  # TEO-5 will neither respond to nor transmit aftertouch/key pressure data" (guide p. 21).
  aftertouch: poly
  pitch_bend:
    # Up and down are set separately and by different amounts - 0-12 semitones up and 0-24 down
    # (CC 85 and 86, NRPN 32 and 33) - so no single number is the range.
    programmable: true

# How to read the controls below. A control with both `cc` and `nrpn` is one parameter reachable
# two ways, and `nrpn_range` appears where the two tables print different ranges for it; the
# source account above says which three of those sixteen are a contradiction rather than NRPN
# being finer. A control with only `nrpn` has no control change at all, which is true of the
# whole modulation matrix and of every global. `choices` appears only on the globals, because
# only that table numbers its states - and it keeps the maker's spelling, including the
# arpeggiator hold that is printed "Apr".
#
# Twenty of the 128 control changes are not parameters and are not here: Data Entry at 6 and 38,
# which is how an NRPN's value travels, the increment and decrement at 96 and 97, the NRPN and
# RPN selectors at 98 to 101, the two the document itself calls Unassigned at 118 and 119, and
# the eight channel mode messages at 120 to 127.

