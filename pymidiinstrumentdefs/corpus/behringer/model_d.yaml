# Nearly empty for the opposite reason to the DFAM's. The DFAM has no MIDI at
# all; the Model D's settings are reached by System Exclusive, and the format
# has no way yet to describe a SysEx surface. **It carries no control and does
# not say there are none.** Its manual has a MIDI keyboard's modulation wheel
# adjust the modulation depth and prints no controller number, so
# `control_change` is unset. Until 2026-10-13 it said `none`.

definition: 1

model:
  manufacturer: Behringer
  name: MODEL D
  # NOT RECORDED, and Behringer publishes nothing that would establish it. Its own
  # product page for this model (www.behringer.com/en/products/0718-AAC, read
  # 2026-09-30) lists three downloads and no firmware: the quick start guide, this
  # manual, and the Synthtribe app at version 3.2.4, which is the application's
  # version and not the instrument's. The manual says updates are published
  # (p. 13, "any updates to the firmware of your MODEL D") but names no version.

source: >-
  User manual, 44 pages: the MIDI and USB connections at p. 8, the rear-panel
  MIDI channel switches at p. 11, the Poly Chain system at p. 29, the System
  Exclusive format and command table at pp. 30-31, setting the channel in a
  Eurorack at p. 33, and the specifications at p. 34.

  **NO CONTROL IS CARRIED, AND `control_change` IS UNSET, NOT `none`.** Every
  page was searched for `control change`, `CC` and `controller number`. None
  of the three is on any page as a MIDI term: the only `cc` is a byte of the
  System Exclusive format (manual p. 30), and the nearest thing is the
  glossary's entry for a Continuous Controller (manual p. 36). Until
  2026-10-13 that was taken for a checked absence, and this file said `none`.
  It is not one. The manual has the instrument answer to a controller without
  using any of those words: "The modulation depth can also be adjusted using
  the modulation wheel on a MIDI keyboard." (manual p. 8), "Use the MOD DEPTH
  knob, and/or the Modulation wheel of your keyboard to increase the effect."
  (manual p. 13), and with OSC 3 CONTROL off "the keyboard, Pitch wheel, and
  Modulation wheel, will have no effect on OSC 3." (manual p. 9). A MIDI
  keyboard's modulation wheel sends controller 1, by the MIDI specification.
  The manual prints no number for it, and a control is written here only with
  a number its maker prints, so there is no `controls` block and the field
  says nothing. The manual also draws a footswitch and an expression pedal
  plugged into that keyboard, in two hook-up diagrams (manual pp. 27, 28), and
  its glossary defines an expression pedal and a sustain pedal (manual pp. 37,
  39). No sentence says the instrument answers to either, and no number is
  printed for them. **A search for a controller's names cannot find one the
  manual names by the wheel that sends it.**

  NOT RECORDED: velocity, note range and
  the factory pitch-bend range, which the manual does not state.

sources:
  manual:
    kind: manual
    title: User Manual MODEL D
    edition: V 1.0
    landing: "https://www.behringer.com/en/products/0718-AAC"
    url: "https://cdn-media.empowertribe.com/8c8a01b4c7ad4ef5972fdbe9a0e841de/M_BE_0718-AAC_MODEL-D_EN.pdf"
    sha256: e2d8203b83f5275ad1d104cc99a3a167c15b55ecc2244950b677a42c7820a514
    retrieved: 2026-09-13

midi:
  # "MIDI In/Thru 5-pin DIN / 16 channels", plus class-compliant USB MIDI in and
  # out (pp. 8, 34). The channel is set by four rear-panel switches, or by SysEx
  # when the unit is racked and the switches are gone (pp. 11, 33). Which one
  # yours is on belongs to your project, not here.
  channels: [1, 16]
  # `control_change` IS UNSET, AND SAID `none` UNTIL 2026-10-13. A MIDI
  # keyboard's modulation wheel adjusts the modulation depth (manual pp. 8, 13),
  # which is a controller answered to, and no page prints its number. See the
  # account.
  # F0 00 20 32 aa bb cc dd ee ff F7, where bb is a device ID that is "the same
  # as the Poly Chain ID. It is not the MIDI Channel" (p. 30). The command table
  # at p. 30 sets MIDI channel, key priority, multi trigger, pitch-bend range,
  # MIDI-in transpose, the note at zero volts, Poly Chain and its style, device
  # ID, the channel switches, and the modulation curve.
  sysex: true

voice:
  addressing: pitches
  # "Number of voices: Monophonic" (p. 34). Several units make one polyphonic
  # instrument through the 16-voice Poly Chain (p. 29), each playing the next
  # note - a fact about a rig of Model Ds, not about one, so it is not here.
  polyphony: 1
  pitch_bend:
    # Settable in semitones over SysEx, with a separate command to make the
    # range take effect (p. 31). The factory range is not stated.
    programmable: true
