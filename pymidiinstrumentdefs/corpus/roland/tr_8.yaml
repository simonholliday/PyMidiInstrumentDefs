# **A COMPLETE IMPLEMENTATION CHART ON ONE SHEET, AND IT IS FIVE FIRMWARE RELEASES OLD.** The
# chart prints `Version: 1.11` and `Date: Nov. 18, 2014`; the update document on the same page
# carries this instrument up to 1.60. **So the chart is where the 50 controller numbers come from
# and it is not where this instrument's MIDI ends**: the update's last sheet is a MIDI section the
# chart has no row for.
#
# **THAT SECTION ADDS EIGHT NOTES THAT ARE NOT DRUMS**, each toggling an effect pattern rather
# than striking anything: `C0 ACCENT PATTERN ALL ON/OFF`, `D0 REVERB PATTERN ALL ON/OFF`, `E0
# DELAY PATTERN ALL ON/OFF`, `F0 EXT. IN PATTERN ALL ON/OFF`, and the same four again as
# `ALL MUTE` at `G0`, `A0`, `B0` and `C1` (update p. 5). **They are given as note names and never
# as numbers**, and no document here states which octave convention this maker is using, so they
# are recorded and not carried: `C0` is 12 under one common convention and 24 under another, and
# a definition that picked one would be inventing the difference.
#
# **ELEVEN INSTRUMENTS, SEVENTEEN NOTES, AND NOT A GAP BETWEEN THEM.** The chart's note table
# gives six of the eleven two numbers each - bass drum 35 and 36, snare 38 and 40, low tom 41 and
# 43, closed hi-hat 42 and 44, mid tom 45 and 47, high tom 48 and 50 - so **every number from 35
# to 51 sounds something**,
# which is rare among the drum machines here. `voices` holds one note per instrument and takes the
# higher of each pair, for a reason the maker gives rather than for tidiness: those are the eleven
# that survive when the expansion board below is fitted.
#
# **AND FITTING THAT BOARD CHANGES THE MAP.** With a `7X7-TR8 Drum Machine Expansion` installed,
# each instrument answers to one note instead of two and the numbers freed up become new
# instruments: 35 is a second bass drum, 40 a second snare, 56 a cow bell and 54 a tambourine
# (chart). **This definition carries the instrument as sold**, which is the ruling
# `roland/ju_06a` set at rank 87 and `korg/drumlogue` followed at 93: where a maker publishes two
# maps, carry the one in force by default.
#
# **AND THE CHART NAMES ITS INSTRUMENTS AFTER A MACHINE THE STOCK TR-8 CANNOT BE.** Its own
# footnote says so: "The instrument names are for the 707. These names will differ depending on
# the instrument set that's selected." (chart) - and the TR-707's sounds are part of that same
# expansion. So the eleven labels below are the maker's, and a reader whose TR-8 is playing its
# 808 or 909 set will see different names on the panel for the same numbers.

definition: 1

model:
  manufacturer: Roland
  name: TR-8
  # **1.60, FROM THE UPDATE DOCUMENT, WHICH IS FIVE RELEASES PAST THE CHART.** The chart describes
  # 1.11 and says so on its face; the update covers 1.10, 1.12, 1.20, 1.50 and 1.60 and is the
  # newest thing this maker publishes for the instrument. Nothing after 1.60 is offered.
  firmware: "1.60"
  # A drum machine, discontinued - and **its support page is not the empty shell this maker's
  # discontinued pages usually are**: four documents, each on a GUID page of the kind a current
  # product gets. `roland/tr_909` had to go to the US manual archive instead, so that habit does
  # not hold for every discontinued Roland.
  # Checked 2026-10-06.

source: >-
  **FOUR DOCUMENTS, AND THE MIDI IS IN TWO OF THEM.** The `MIDI Implementation Chart` is one A4
  sheet and gives every field below but three. The `TR-8 Update` is five sheets of release notes
  whose **last sheet is a MIDI section** - the eight effect notes, the three scatter controllers
  and a setting that decides whether transport messages are obeyed at all, all on update p. 5.

  **TWO OF THE FOUR HAVE NO PAGE TO TURN TO**, which is why most of what is cited below is cited
  by name: the chart is a single sheet and the manual is a single A3 sheet of 17,395 characters.
  Only the update and the Serato guide are paginated, so `update p. 5` is the one locator in this
  account and the rest name their document.

  THE OTHER TWO ARE CITED AND HOLD NOTHING. The owner's manual is **one A3 sheet carrying 17,395
  characters**, which is this maker's fold-out poster format; it gives the channel setting, the
  clock source and the kit count and no controller number. The `Roland TR / Serato DJ Pro
  Connection Guide` is three sheets about a DJ application and names no MIDI message at all.

  **WHAT THE CHART SETTLES THAT NOTHING ELSE DOES.** That `Mode 4` is the default both ways -
  OMNI OFF, MONO, which is an odd thing for an eleven-voice drum machine and is what the row says.
  That after touch and pitch bend are crossed in all four boxes. That system exclusive is crossed
  both ways. That program change is **received and never sent**, over `1-15`. And that three of
  the fifty controllers are received and never transmitted.

  **AND THE INSTRUMENT ANSWERS ON ONE CHANNEL OR ALL OF THEM.** The chart gives `10` as the
  default and `1-16, OFF` as the range, marked `Memorized`; the manual adds the state between
  them: "ONn (OMNI) MIDI messages of all channels are received. The MIDI transmit channel will be
  10." (manual). **So an omni TR-8 still transmits on 10**, which no field here holds.

  NOT RECORDED: the polyphony. The manual says its eleven instruments are collectively called a
  `kit` and that "The TR-8 has 16 kits." (manual), and nothing says how many sound at once - though eleven
  instruments each with one voice is the likeliest reading, it is a reading.

