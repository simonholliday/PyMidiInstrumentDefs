    # Saved as served and as text; **the digest above is the text copy**, which is the one the
    # citation checker reads. It is also served identically at
    # `arturia.com/products/hardware-synths/microbrute/resources`, the address shape every other
    # Arturia here cites - the same file list inside the product-page wrapper.
    # Every download is a plain `href` under `/api/download/`, with no `data-path` attribute and
    # no address in a query string, which is **not** how Korg or Roland arrange theirs.

midi:
  # "You can choose individual channels or ALL channels." (connection p. 5) for what it receives,
  # and "You can choose any of the 16 MIDI channels." (connection p. 5) for what it sends. The
  # controller table gives both as numbers: `1 to 16, 17=All` and `1 to 16` (connection p. 13).
  channels: [1, 16]
  # NOT RECORDED, the mode. See the account - no document names one.
  # **RECEIVES, ON EITHER SOCKET.** "The Rate knob acts differently if MicroBrute detects an
  # external MIDI clock on the MIDI Input or USB connector:" (manual p. 44), and the editor makes
  # it a setting with three states - "MIDI will select an external MIDI clock source."
  # (connection p. 8), which is controller 108 below. It sends no clock, having no output socket
  # and no sentence claiming it.
  clock: receives
  # NOT RECORDED, the transport. **This is the absence that a counting sweep gets wrong**: the
  # words Start, Stop and Continue occur thirty-two times across the two documents and not one of
  # them is a MIDI message. So nothing here says whether the sequencer answers to Start or Stop -
  # only that it follows a clock.
  # NOT RECORDED, program change, system exclusive and NRPN. None of the three is named in either
  # document; see the account for the sheet counts that absence rests on.

voice:
  addressing: pitches
  # NOT RECORDED, the note range. The keyboard is two octaves shifted over six by the Octave
  # buttons, and "Middle C with the octave set to 0 = MIDI note 60 on the MicroBrute."
  # (connection p. 12) fixes where it sits - but **what it answers to is a different question**,
  # and the manual only hints at it: a full-sized keyboard is suggested "if you want a wider
  # playing range" (manual p. 46), which says the received range is wider than the keyboard and
  # not what it is.
  # **ONE NOTE AT A TIME, AND THE PROOF IS THE NOTE PRIORITY SETTING.** "Low Note priority means
  # if two notes are played at the same time, the lower note on the keyboard is prioritized and
  # played." (connection p. 8) - a choice of which single note sounds. The word `monophonic`
  # appears in neither document, so this rests on the behaviour rather than the label, and the
  # sentence that reads like a contradiction is about the keyboard as a controller; see above.
  polyphony: 1
  velocity:
    # **IGNORED, AND TRANSMITTED ALL THE SAME.** "The MicroBrute does not receive or respond to
    # velocity but it does send it." (connection p. 8), which the user's manual states twice over
    # in its own words (manual p. 32). The transmitted curve is a setting of its own, controller
    # 112 below, with three shapes - so the instrument carries a parameter governing something it
    # will never hear.
    note_on: ignored
    transmits: true
  # NOT RECORDED, aftertouch. The word appears nowhere in either document, and the manual's list
  # of what the keyboard offers for expressiveness closes without it: velocity, transposition,
  # pitch bend, modulation wheel and the sequencer (manual p. 32).
  pitch_bend:
    # Two semitones by default and settable from one to twelve, which two documents say three
    # times between them; see the account.
    semitones: 2
    # Over MIDI as well as in the editor, by `RPN 06` with a value of `1 to 12`
    # (connection p. 13).
    programmable: true

groups:
  # The editor's own four section headings, in its order - which is also the order the controller
  # table runs in, so these group labels are the maker's and not this corpus's.
  midi_settings: MIDI Settings
  sequencer: Sequencer settings
  module: Module Settings
  keyboard: Keyboard Parameters

controls:

  # **THIRTEEN, EVERY ONE RECEIVED, AND NOT ONE OF THEM A KNOB.** The instrument's panel is
  # analogue and answers to nothing; these thirteen are the editor's settings, exposed so that a
  # sequencer can reach them, and they revert at the next power-up unless the editor writes them.
  # Each one's bands below are the table's own, which gives a low and a high for every state; the
  # low is what this format records.

  # MIDI Settings (2) - **the only two of the thirteen whose values are exact and not banded.**
  # `1 to 16, 17=All` and `1 to 16` (connection p. 13) mean the numbers as written, so these take
  # `choices`; the other eleven print a low and a high for each state and take `values`.
  receive_channel:     {label: Receive Channel, cc: 102, choices: {channel_1: 1, channel_2: 2, channel_3: 3, channel_4: 4, channel_5: 5, channel_6: 6, channel_7: 7, channel_8: 8, channel_9: 9, channel_10: 10, channel_11: 11, channel_12: 12, channel_13: 13, channel_14: 14, channel_15: 15, channel_16: 16, all: 17}, range: [1, 17], direction: receives, group: midi_settings}
  send_channel:        {label: Send Channel, cc: 103, choices: {channel_1: 1, channel_2: 2, channel_3: 3, channel_4: 4, channel_5: 5, channel_6: 6, channel_7: 7, channel_8: 8, channel_9: 9, channel_10: 10, channel_11: 11, channel_12: 12, channel_13: 13, channel_14: 14, channel_15: 15, channel_16: 16}, range: [1, 16], direction: receives, group: midi_settings}

  # Sequencer settings (5)
  seq_retrig:          {label: Seq Retrig, cc: 104, values: {reset: 0, legato: 42, none: 84}, direction: receives, group: sequencer}
  seq_play_mode:       {label: Seq Play Mode, cc: 105, values: {hold: 0, note_on: 64}, direction: receives, group: sequencer}
  next_seq_mode:       {label: Next Seq Mode, cc: 106, values: {end: 0, instant_reset: 42, instant_continuous: 84}, direction: receives, group: sequencer}
  seq_step_size:       {label: Seq Step Size, cc: 107, values: {quarter: 0, eighth: 30, sixteenth: 60, thirty_second: 90}, direction: receives, group: sequencer}
  seq_step_gate_mode:  {label: Seq Step/Gate Mode, cc: 114, values: {clk: 0, gate_tap: 64}, direction: receives, group: sequencer}

  # Module Settings (4)
  sync_source:         {label: Sync Source, cc: 108, values: {auto: 0, int: 42, ext: 84}, direction: receives, group: module}
  env_legato_mode:     {label: Env Legato Mode, cc: 109, values: {"off": 0, "on": 64}, direction: receives, group: module}
  lfo_retrig_mode:     {label: LFO Retrig Mode, cc: 110, values: {"off": 0, "on": 64}, direction: receives, group: module}
  gate_length:         {label: Gate Length, cc: 113, values: {short: 0, med: 42, long: 84}, direction: receives, group: module}

  # Keyboard Parameters (2)
  note_priority:       {label: Note Priority, cc: 111, values: {last: 0, low: 42, high: 84}, direction: receives, group: keyboard}
  velocity_curve:      {label: Velocity Curve, cc: 112, values: {lin: 0, log: 42, anti_log: 84}, direction: receives, group: keyboard}
