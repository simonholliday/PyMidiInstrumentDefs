  mutator_3: Mutator 3
  mutator_4: Mutator 4
  osc_1: OSC 1
  osc_2: OSC 2
  osc_3: OSC 3
  post_fx: Post-fx
  pre_fx: Pre-fx
  reverb: Reverb
  system: System
  voice: Voice

