  manual:
    kind: manual
    title: HexDrums User Manual
    dated: 2026-02-16
    landing: "https://www.ericasynths.lv/hexdrums-3562/"
    url: "https://www.ericasynths.lv/service/file/download/product_id/1009/file_id/608/"
    sha256: f1ccad2db9d6652b317a73b8ec41bc3aeef6ddb2202fd00825df558655d9bf04
    retrieved: 2026-10-06
    # **28 sheets, and its MIDI implementation is the bottom half of sheet 27.** No chart, no
    # folio on any page, so a locator here is the file's sheet.
    # Served through a download controller rather than at a file name: the address above carries
    # a product id and a file id and nothing else, and `HexDrums_manual_Feb2026.pdf` arrives in
    # a `content-disposition` header. Not encrypted. Made in Adobe Illustrator, whose creation
    # date is the 16 February 2026 the product page prints.
    page_offset: 0
  product_page:
    kind: download_page
    title: Hexdrums - Erica Synths
    landing: "https://www.ericasynths.lv/hexdrums-3562/"
    url: "https://www.ericasynths.lv/hexdrums-3562/"
    sha256: 75473240336461876592a9d596f41971435471ba6f22668db200973acd63cb7f
    retrieved: 2026-10-06
    paginated: false
    # **Cited for the count being three, and for what the third of them is.** A manual in
    # English, the same manual in Japanese, and a firmware image - **no release notes, no
    # specification sheet, no separate MIDI document.** So the English manual is the whole of
    # what this instrument has, and that is a list rather than a search.
    # It is a shop page, so its markup carries no file address at all: the three downloads are
    # controller URLs. The digest is of the extraction, which pairs each file id with its label
    # and date; the served bytes are saved beside it as `.html`, whose own digest is
    # 2d5423bde9338966287a458a492b0791837a0fecdcc9ce09e2d39433ad8bc2eb. One page, cited as p. 1.

midi:
  # `MIN MIDI in` offers a choice "between OFF ... OMNI ... and 1 - 16 representing the
  # individual MIDI channels" (manual p. 24), and `MOT MIDI out` one "between OFF ... THR ...
  # and 1 - 16 representing the MIDI channels" (manual p. 24). So sixteen either way - **and three things this field cannot hold**:
  # that either direction can be switched off entirely, that the input can be set to omni, and
  # that **the output can be set to act as a thru**, passing on what arrives at the input.
  channels: [1, 16]
  # NOT RECORDED, for want of the chart. Sheet 5 asks the reader to "refer to the MIDI
  # implementation chart in the manual" (manual p. 5) and there is none - what sheet 27 has is
  # ten note numbers and a sentence, and no Mode row.
  # **BOTH, AND EACH DIRECTION HAS A SETTING OF ITS OWN WITH THREE VALUES.** It receives one by
  # being told to: `CLK Clock source` selects "between INT - internal clock, MID - MIDI clock and
  # EXT - external analog clock" (manual p. 23). And it sends one, with a distinction worth
  # having: `MCK MIDI clock` selects "between OFF - no MIDI clock messages are transmitted, ON -
  # MIDI clock messages are transmitted when the sequencer is playing and CON - MIDI clock
  # messages are transmitted continuously" (manual p. 24). The manual states the pair plainly as
  # well - its input "receives trigger note messages and MIDI clock" (manual p. 5) and its
  # "MIDI Out outputs trigger and MIDI clock messages" (manual p. 5).
  clock: both
  # NOT RECORDED, the transport. The manual's START and STOP are panel keys - "The three keys on
  # the bottom left are for starting and stopping sequences and saving patterns." (manual p. 15) -
  # and **no MIDI start, stop or continue message is mentioned anywhere in 28 sheets**. So what
  # it does with one is not published, which is not the same as its doing nothing.
  # NOT RECORDED EITHER: program change and system exclusive, neither mentioned. **And unlike the
  # controllers these are not declared absent**, which is the distinction worth keeping: sheet 27
  # says there is no control change implementation and says why, and says nothing about these.
  # SOMEBODY DECIDED THERE WOULD BE NONE, AND WROTE DOWN WHY. "There is no MIDI CC implementation
  # for parameter control, however, since the parameters aren't digitally mapped. This is
  # intentional to allow for a more traditional drum machine workflow." (manual p. 27).
  # **That is the only instance of this field in the corpus that records a decision rather than
  # an absence**, and it is a stronger statement than any chart could make: not that no
  # controller was found, but that the parameters are not the kind of thing a controller could
  # reach, by design.
  control_change: none

voice:
  # Its notes name drums and nothing else - ten of them, one per voice.
  addressing: voices
  # **TEN VOICES OVER TEN CONSECUTIVE NUMBERS, WHICH IS RARE HERE.** Most drum machines in this
  # corpus leave gaps - `korg/drumlogue` has eleven voices over a span of twenty and
  # `korg/volca_beats` ten over forty. This one runs 36 to 45 with nothing in between, so every
  # note in the span sounds something.
  note_range: [36, 45]
  # NOT RECORDED, the velocity, and the reason is worth stating: **the word does not appear once
  # in 28 sheets.** The manual calls what arrives "trigger note messages" (manual p. 5), which
  # suggests the note is a trigger and the rest of the message is not read - and suggesting is
  # not saying, on an instrument whose maker was willing to write a sentence about what it does
  # not implement.
  # NOT RECORDED, the polyphony. Ten voices sound; how many at once is nowhere.
  voices:
    # **THE TEN, IN THE ORDER SHEET 27 PRINTS THEM**, which is down one column and then the
    # other rather than in number order - the manual sets them in two columns and a reader of
    # the extracted text meets them interleaved.
    bd1: 36
    bd2: 37
    machine: 38
    snare: 39
    clap: 40
    rimshot: 41
    oh: 42
    ch: 43
    crash: 44
    ride: 45
