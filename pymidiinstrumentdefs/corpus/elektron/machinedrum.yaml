  track_10_mute:                 {label: Mute (>0 mutes trk), cc: 13, direction: receives, part: track_10}
  track_10_machine_parameter_1:  {label: Machine parameter 1, cc: 40, part: track_10, group: synthesis}
  # ---- track 11, RC, on base channel + 2
  track_11_level:                {label: Level, cc: 10, part: track_11}
  track_11_mute:                 {label: Mute (>0 mutes trk), cc: 14, direction: receives, part: track_11}
  track_11_machine_parameter_1:  {label: Machine parameter 1, cc: 72, part: track_11, group: synthesis}
  # ---- track 12, CC, on base channel + 2
  track_12_level:                {label: Level, cc: 11, part: track_12}
  track_12_mute:                 {label: Mute (>0 mutes trk), cc: 15, direction: receives, part: track_12}
  track_12_machine_parameter_1:  {label: Machine parameter 1, cc: 96, part: track_12, group: synthesis}
