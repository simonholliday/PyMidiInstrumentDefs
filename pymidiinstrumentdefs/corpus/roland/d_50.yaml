  manual:
    kind: manual
    title: D-50 Owner's Manual
    edition: Advanced Course
    dated: 1987-07
    landing: "https://www.roland.com/global/support/by_product/d-50/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/D-50_OM.pdf"
    sha256: 8aed6f4a7117cb13ed55e467e5c5543e9255102c3d01d8fe6e3e76c08e1d48c9
    retrieved: 2026-10-02
    # A SCAN: 78 pages and not one character of text on any of them, so nothing in it can be
    # searched and every figure above was read off a rendered page. The date is the printing
    # code on the back cover, "'87-7-F3-5S"; the edition is the triangle on the cover, which
    # reads ADVANCED, and the contents page, headed "ADVANCED COURSE".
    # PRINTED PAGE = FILE PAGE, WITH ONE EXCEPTION THAT MATTERS TO ANYBODY CITING IT. File pages
    # 57 and 59 are each a landscape spread carrying two printed pages - 57 with 58, and 59 with
    # 60 - and file pages 58 and 60 are blank. The two blanks absorb the offset, so file 61
    # prints 61 again, and an offset of 0 is right everywhere else in the book.
    # SO PRINTED 58 AND 60 CANNOT BE CITED AT ALL under this convention: an offset of 0 sends
    # them to the blank file pages beside their spreads. The one passage here that needs that
    # part of the book cites file pages 57 and 59, which is where those four printed pages are.
    page_offset: 0
  support_page:
    kind: download_page
    title: "Roland - Support - D-50 - Owner's Manuals"
    landing: "https://www.roland.com/global/support/"
    url: "https://www.roland.com/global/support/by_product/d-50/owners_manuals/"
    sha256: 726141535776d770a3fa615df2126436530a9f8c7f9642a8ff316015784df9ec
    retrieved: 2026-10-02
    paginated: false
    # Cited for what it does not contain. Its own title has nothing where the product's name
    # belongs, and its visible text offers no file at all; the TR-1000's equivalent page, fetched
    # the same way on the same day and kept in the library beside it, names its product and
    # offers fourteen.
    # AND THIS HASH IS NOT THIS PRODUCT'S, which is the strongest thing to be said about the
    # emptiness: the JUNO-106's owner's manuals page, a different product at a different URL
    # fetched the same day, renders to **the same 3,567 bytes, byte for byte**. Neither page
    # carries one word about the instrument it is supposed to be about, so the two are
    # indistinguishable once the markup is gone. A tool that finds documents by their hash will
    # therefore name whichever of the two files it indexed first, and that is not an error.

midi:
  # "This sets the Basic Channel (MIDI channel on which the D-50 receives and transmits messages)
  # from 1 to 16" (p. 52), and the appendix gives "MIDI CH 1 ... 16" (p. 73).
  channels: [1, 16]
  # Three settings decide what the instrument does with mode messages, and no field here holds
  # them: "Control ... Basic CH, Global CH, Mode Message Off" (p. 73), where Mode Message Off
  # means "the D-50 does not receive the Mode messages from the external MIDI device, but is
  # assigned to the Key mode as set on the D-50" (p. 53). Omni is its own on/off switch beside
  # them. So no single mode number is true of this instrument and none is written.
  program_change:
    # "To receive or transmit Program Change messages, set this to ON" (p. 54) - one switch for
    # both directions, so both are recorded.
    receives: true
    sends: true
    # "Program Change Numbers correspond to the D-50's Patches as shown in the table on the next
    # page" (p. 54), and that table runs 1 to 128: sixty-four patches in the instrument and
    # sixty-four on an optional memory card. See the source account for the off-by-one its own
    # footnote introduces.
    presets: 128
  # "To receive or transmit Exclusive messages (Roland ID Number only), set this to "ON" or
  # "P-Dump"" (p. 55), and a whole chapter transfers patch data by bulk dump (p. 61). No layout
  # is published.
  sysex: true
  # NO FACTORY MAP, BY DESIGN, AND THE PLAYER CHOOSES. The only controller numbers this
  # instrument publishes are the two ranges its pedals may be set to send. See the source
  # account; the mechanism is a menu rather than MIDI learn, which this field has no word for.
  control_change: learned
  # NOT RECORDED: clock and transport. The manual's MIDI chapter never mentions either, and its
  # function table has no row for them - silence rather than a checked absence.

parts:
  # Two tones, and in one key mode they answer on two channels. "The Lower Tone is controlled by
  # the basic channel, and the Upper Tone is controlled by the receive channel set here. (The
  # D-50's keyboard can control only the Upper Tone.)" (p. 53). ONLY IN SEPARATE MODE: in the
  # others both tones answer on the basic channel, which is why the lower carries an offset of 0
  # and the upper a channel of its own.
  lower:
    label: Lower Tone
    channel_offset: 0
    addressing: pitches
    receives: [notes]
  upper:
    label: Upper Tone
    channel: assigned
    addressing: pitches
    receives: [notes]
    # "1 to 16 are valid for receive channel" (p. 53), and each patch may set its own, "At OFF,
    # the receive channel set in "MIDI Functions commonly set for all Patches" on page 53 is
    # used" (p. 56).

voice:
  addressing: pitches
  # NOT RECORDED: polyphony, the note range and the key count. There is no specifications page in
  # this volume; see the source account.
