    # Cited for the firmware check above: nine releases from OS 1.00 to 1.12, with every entry
    # that mentions a controller at 1.10 or earlier. **The address had to be found rather than
    # guessed**: the pattern the Digitakt II's notes are served under,
    # `/release-notes/digitakt-ii-os-release-notes`, answers "Page not found" for this product,
    # whose notes are at `/release-notes/digitone-ii`. The 404 was fetched, recognised and
    # deleted rather than kept as a document.

midi:
  # A channel is set per track, for the effects, for the auto channel and for program change in
  # each direction, each selected or set to OFF (p. 76). SIXTEEN IS THE PROTOCOL'S NUMBER AND HERE
  # IT IS ALSO THE MAKER'S: no page prints the range a channel setting takes, but this instrument's
  # sixteen tracks default to "their default channels 1-16" (p. 24), so all sixteen are in use as
  # shipped.
  channels: [1, 16]
  # CLOCK RECEIVE and CLOCK SEND are separate settings, as are TRANSPORT RECEIVE and TRANSPORT
  # SEND (p. 74), so both travel both ways and either can be switched off on its own.
  clock: both
  transport: both
  program_change:
    receives: true         # PRG CH RECEIVE, "useful when wanting to select patterns externally"
    sends: true            # PRG CH SEND, "send program change messages when patterns are changed"
    # "MIDI program change messages 0-127 will select pattern 1-128 (A01-H16)" (p. 24), and "A
    # project contains 128 patterns" in eight banks (p. 16).
    presets: 128
    # Which channel carries them is its own setting, PROGRAM CHG IN CH and OUT CH, either of which
    # may instead follow the auto channel (p. 76).
  # THE MAKER'S OWN PREFERENCE, stated in the appendix and quoted in the source account: control
  # change cannot reach the high-resolution parameters because the machines share CC values, "you
  # should use NRPN messages for this purpose" (p. 112).
  nrpn: preferred
  # "In the SYSEX DUMP menu, project, pattern, and preset data can be sent and received via the
  # MIDI OUT or USB port" is the menu at 13.5 (p. 76). No byte layout is published.
  sysex: true

parts:
  # Both parts are given a channel by the player, in SETTINGS > MIDI CONFIG > CHANNELS (p. 76), so
  # neither derives one: there is no base channel on this instrument.
  track:
    label: Track
    count: 16
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # "TRACK 1-16 selects the dedicated MIDI channel that is used to receive or send (by turning
    # the knobs) parameter data to or from a specific audio track. If configured as OFF, parameter
    # data are neither received nor sent via MIDI" (p. 76), and RECEIVE NOTES "will, when active,
    # make it possible to play Digitone II using an external MIDI keyboard" (p. 75).
    # NO POLYPHONY FIGURE HERE, because the sixteen voices are a shared pool rather than an
    # allowance per track - see `voice`. A track may lock some of them to itself, which is a
    # project's setting and not a property of the instrument.
  fx:
    label: FX and Mixer
    channel: assigned
    receives: [notes, controls]
    # Takes no notes to sound: the delay, the reverb, the chorus, the compressor, the external
    # input mixer and the master overdrive. "FX CONTROL CH selects the dedicated MIDI channel that
    # is associated with the parameters on the DELAY, REVERB, CHORUS, and COMPRESSOR parameter
    # pages together with the master overdrive, both for input and output" (p. 76). One note does
    # reach it and it is a button rather than a pitch: tap tempo on G10, which is 127 by the
    # manual's own note names - see the source account.
    addressing: voices
    voices:
      tap_tempo: 127

voice:
  addressing: pitches
  # "The Digitone II has 16 voice polyphony" (p. 47), and the architecture pages describe "the
  # Digitone II internal sound architecture for its 16 audio voices" (p. 15).
  polyphony: 16
  # SHARED, AND THE MANUAL SAYS SO IN THE SAME BREATH AS THE FIGURE: voices are stolen "when you
  # use more than 16 voices at the same time" (p. 47) across the sixteen tracks, and a track can
  # lock between one and sixteen of them to itself. So sixteen is a ceiling for the instrument
  # rather than a figure any track can count on, which is the opposite of the Digitakt II.
  polyphony_shared: true
  # Two bands of notes do something and the manual gives both, at 8.4 MIDI NOTES (p. 24): 0-15
  # trigger the sixteen tracks, and 16-84 play the active track chromatically. Nothing above 84 is
  # documented, so the range is the outer bound of what the manual states. The manual's own note
  # names do not follow from its own numbers - see the source account.
  note_range: [0, 84]
  velocity:
    # "Both the VEL parameter on the TRIG menu and the velocity of incoming MIDI notes sent to the
    # Digitone II from external devices affects the assigned parameters" (p. 39), which is the
    # engine answering to velocity. Nothing states what it does with a note-off velocity.
    note_on: received

