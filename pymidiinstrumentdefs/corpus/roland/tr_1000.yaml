  oh_level:               {label: OH LEVEL, cc: 109, group: oh}

  # CC ──────────────────────────────────────────────────────────────────
  cc_tune:                {label: CC TUNE, cc: 110, group: cc}
  cc_decay:               {label: CC DECAY, cc: 111, group: cc}
  cc_ctrl:                {label: CC CTRL, cc: 112, group: cc}
  cc_level:               {label: CC LEVEL, cc: 113, group: cc}

  # RC ──────────────────────────────────────────────────────────────────
  rc_tune:                {label: RC TUNE, cc: 114, group: rc}
  rc_decay:               {label: RC DECAY, cc: 115, group: rc}
  rc_ctrl:                {label: RC CTRL, cc: 116, group: rc}
  rc_level:               {label: RC LEVEL, cc: 117, group: rc}

