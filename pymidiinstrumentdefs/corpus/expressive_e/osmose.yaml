definition: 1

model:
  manufacturer: Expressive E
  name: Osmose
  # ONE DEFINITION COVERS BOTH KEYBED SIZES, which is the maker's own arrangement rather
  # than a decision taken here: "This manual revision 2.3 describes the feature set of
  # Osmose 49 and Osmose 61 with operating system version 2.3 or higher" (p. 10), and the
  # chart names the model "Osmose" with no size. The two differ in keys, dimensions and
  # weight and in nothing below. The compliance page calls the unit a "Polyphonic
  # Synthesizer" (p. 7).
  # THE OSMOSE CE IS A DIFFERENT PRODUCT and is not described here. Expressive E's own
  # comparison of the two says the synth "Includes its own built-in sound engine" where the
  # CE is "Designed to control software and hardware"; the CE's manual has four sections
  # where this one has six, and the two it lacks are Sound Engine Mode and Advanced Users.
  # THE MAKER SPELLS THE FIRMWARE THREE WAYS for one release, and 2.3 is what they agree
  # on: the cover says "rev. 2.3 for osmose 49/61 synth - firmware 2.3", p. 2 says
  # "published September 24th, 2026 for firmware versions 2.3.12+", and the chart says
  # "Version: 2.3.x rev. A" with a stamp on every page reading "valid for firmware 2.3".
  firmware: "2.3"

source: >-
  MIDI implementation chart v2.3.x rev. A (3pp), and the user manual rev. 2.3 (92pp),
  pp. 10, 14-15, 29-36, 45, 87-88 and 92, with three pages of the maker's own online manual
  for the Advanced Users material the printed manual does not carry. The chart is where
  every control number below comes from; the manual is where the groups, the descriptions
  and the behaviour come from.

  THE MANUAL CARRIES NO CHART AND SAYS SO, which is why there are two documents: "For
  advanced use cases like establishing a connection with the Haken Editor, triggering
  Osmose's sound engine from an external source, switching sounds with Program Change
  messages, and remote-controlling parameters with MIDI CC messages, please refer to our
  online knowledge base" (p. 92). The words "master channel", "member channel", "program
  change" and "bend range" appear nowhere in its 92 pages, and it states the sound engine's
  polyphony nowhere.

  THE CHART DESCRIBES ONE OF FIVE PORTS, and nothing in the definition holds beyond it:
  "All information refers to USB MIDI Port 2, the 'sound engine' mode" (chart_article).
  Port 1 sends what the player configures in External MIDI Mode, port 3 is a DIN
  interface, port 4 carries DAW control, and port 5 is the Haken Editor's (p. 15).

  EVERY ROW OF THE CHART IS ACCOUNTED FOR. It prints 126 rows, which is 0-126 without 63,
  and 34 of them name a function. 17 are controls here. The other 17 are excluded and each
  for a stated reason: 7 channel mode messages, CC 120-126, which a control list may not
  carry; 4 rows that name the NRPN and RPN number controllers, CC 98-101, all four marked
  as answering to nothing; 2 data entry rows, CC 6 and 38, the same; CC 74, which is
  aftertouch and is recorded under voice rather than as a parameter; CC 87, which carries
  the low 7 bits of a pressure value rather than a parameter anybody sets; and CC 83 and
  84, which the chart marks as neither sent nor received - see the comment on the eq.
  The remaining 92 rows name no function and are marked No in both directions, so the
  numbers missing below are checked absences and not unread rows.

  THE CHART PRINTS NO ROW AT ALL FOR CC 63 OR CC 127, which was established from the
  page's geometry rather than from the order its text layer draws: pages 2 and 3 each draw
  an unbroken ladder of 63 rows at a uniform spacing, 0-62 and 64-126, with no gap where a
  dropped row would show and no number drawn twice. Both extractions agreed. CC 127 would
  have been Poly Mode On, so the chart's channel mode block stops one row short.

  NOT RECORDED: the note range, which neither document gives for either keybed; the pitch
  bend range in semitones, which is a per-preset setting the manual describes without a
  number; and whether anything answers on the DIN input beyond what the din mode routes.

