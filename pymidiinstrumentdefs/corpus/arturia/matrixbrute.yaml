    # The product's Resources tab, its visible text saved by `Tools/save_page.py` with the HTML
    # beside it. Cited for the versions and dates the documents do not carry: which firmware is
    # current, and which edition of the manual is the newest.

midi:
  # `Input MIDI Channel - All, 1-16, None` and `Output MIDI Channel - 1-16` (manual p. 53).
  channels: [1, 16]
  # **RECEIVED, AND NOTHING SAYS IT IS SENT.** "MIDI Sync ignores the internal tempo and locks the
  # Sequencer and Arpeggiator to incoming MIDI clock." (manual p. 40), from MIDI, USB or the Sync
  # port, chosen at `MIDI clock source` (manual p. 53) - `INT, CLK, USB, MIDI` on the panel
  # (manual p. 55).
  clock: receives
  # **RECEIVED, A READING OF THE RELEASE NOTES.** The manual names no transport message; firmware
  # 2.0.1's notes fix a stuck note "when holding a key and pressing play on Master device"
  # (release_notes). See the account.
  transport: receives
  program_change:
    # A setting, `Program Change Receive` (manual p. 54), whose factory state no page gives.
    receives: true
    # "To recall one of the 256 internal presets" (manual p. 35), in sixteen banks of sixteen. No
    # page names bank select.
    presets: 256
  # NOT RECORDED: system exclusive and NRPN. See the account; neither is a checked absence.
  # `control_change` is left unset because a map is published - see the controls below.

voice:
  addressing: pitches
  # Paraphonic mode plays one note on each oscillator, and they "share the same filters and VCA
  # settings" (manual p. 21). NOT RECORDED, `polyphony` and `voicing_modes`: the voice mode is a
  # setting, and two pages give paraphonic mode three notes and two. See the account.
  paraphonic: true
  velocity:
    # A reading - see the account.
    note_on: received
  # NOT RECORDED, aftertouch: the keys have it, and no page says which kind, or that it travels over
  # MIDI. See the account.
  pitch_bend:
    # Bend Range is controller 119, up to an octave each way (manual p. 22).
    programmable: true

parts:
  # **THE LOWER HALF OF THE KEYBOARD IN DUO-SPLIT, ON A CHANNEL OF ITS OWN** -
  # `Lower Part MIDI Channel - None, 1-16` (manual p. 53), `Ch.Lo` on row B (manual p. 55). Notes,
  # and nothing more is claimed. Everything else is on the input channel, which is why no control
  # names a part.
  lower:
    label: Lower Part
    channel: assigned
    receives: [notes]
    addressing: pitches

groups:
  # The table's own headings, in its order, with the word `Parameters` dropped because every heading
  # carries it. Its capitals are kept as printed - some headings are set in them and some are not -
  # except ENV 2's `(VCF)`, which every other page contradicts: see the account.
  pedals: Pedals
  vco_1: VCO 1
  vco_2: VCO 2
  vco_3_lfo_3: VCO 3 - LFO 3
  audio_mod: AUDIO MOD
  mixer: MIXER
  steiner: STEINER
  ladder: LADDER
  lfo_1: LFO 1
  lfo_2: LFO 2
  env_1: ENV 1
  env_2: ENV 2
  env_3: ENV 3
  analog_effects: ANALOG EFFECTS
  sequencer: SEQUENCER
  wheels: WHEELS
  glide: GLIDE
  macro_knobs: MACRO KNOBS

controls:

  # **EIGHTY, IN THE TABLE'S ORDER, EACH WITH THE LABEL IT PRINTS.** Thirty-two are marked
  # `7-bit/14-bit` and carry no `lsb`, because no page numbers their fine halves.

  # Pedals ──────────────────────────────────────────────────
  sustain_pedal:              {label: Sustain Pedal, cc: 64, group: pedals}
  # 3 and 4 are also M4 and M3, below - "duplicate CC assignments" (manual p. 52).
  expr_pedal_2:               {label: Expr. Pedal 2, cc: 3, group: pedals}
  expr_pedal_1:               {label: Expr. Pedal 1, cc: 4, group: pedals}

  # VCO 1 ───────────────────────────────────────────────────
  vco_1_fine:                 {label: Fine, cc: 65, group: vco_1}
  vco_1_coarse:               {label: Coarse, cc: 66, group: vco_1}
  vco_1_waveform_selection:   {label: Waveform Selection, cc: 67, group: vco_1}
  vco_1_sub:                  {label: Sub, cc: 9, group: vco_1}
  vco_1_ultrasaw:             {label: Ultrasaw, cc: 68, group: vco_1}
  vco_1_sawtooth:             {label: Sawtooth, cc: 10, group: vco_1}
  vco_1_square:               {label: Square, cc: 12, group: vco_1}
  vco_1_triangle:             {label: Triangle, cc: 13, group: vco_1}
  vco_1_pulse_width:          {label: Pulse Width, cc: 69, group: vco_1}
  # 10 in edition 2.0.1 (manual_2_0_1 p. 52), and 70 in this one. See the account.
  vco_1_metalizer:            {label: Metalizer, cc: 70, group: vco_1}

  # VCO 2 ───────────────────────────────────────────────────
  vco_2_fine:                 {label: Fine, cc: 71, group: vco_2}
  vco_2_coarse:               {label: Coarse, cc: 72, group: vco_2}
  vco_2_waveform_selection:   {label: Waveform Selection, cc: 73, group: vco_2}
  vco_2_sub:                  {label: Sub, cc: 14, group: vco_2}
  vco_2_ultrasaw:             {label: Ultrasaw, cc: 74, group: vco_2}
  vco_2_sawtooth:             {label: Sawtooth, cc: 15, group: vco_2}
  vco_2_square:               {label: Square, cc: 16, group: vco_2}
  vco_2_triangle:             {label: Triangle, cc: 17, group: vco_2}
  vco_2_pulse_width:          {label: Pulse Width, cc: 75, group: vco_2}
  vco_2_metalizer:            {label: Metalizer, cc: 76, group: vco_2}

  # VCO 3 - LFO 3 ───────────────────────────────────────────
  vco_3_coarse:               {label: Coarse, cc: 22, group: vco_3_lfo_3}

  # AUDIO MOD ───────────────────────────────────────────────
  vco_1_vco_2:                {label: VCO 1 > VCO 2, cc: 77, group: audio_mod}
  vco_1_vco_3_vco_2:          {label: VCO 1 < VCO 3 > VCO 2, cc: 78, group: audio_mod}
  vcf_1_vco_3_vcf_2:          {label: VCF 1 < VCO 3 > VCF 2, cc: 79, group: audio_mod}
  vco_1_noise_vcf_1:          {label: VCO 1 < Noise > VCF 1, cc: 80, group: audio_mod}

  # MIXER ───────────────────────────────────────────────────
  mixer_vco_1:                {label: VCO 1, cc: 18, group: mixer}
  mixer_vco_2:                {label: VCO 2, cc: 19, group: mixer}
  mixer_vco_3:                {label: VCO 3, cc: 20, group: mixer}
  mixer_noise:                {label: Noise, cc: 21, group: mixer}
  mixer_external:             {label: External, cc: 89, group: mixer}

  # STEINER ─────────────────────────────────────────────────
  steiner_drive:              {label: Drive, cc: 81, group: steiner}
  steiner_cutoff:             {label: Cutoff, cc: 23, group: steiner}
  steiner_resonance:          {label: Resonance, cc: 83, group: steiner}
  steiner_brute_factor:       {label: Brute Factor, cc: 82, group: steiner}
  steiner_env_1_amt:          {label: Env 1 Amt, cc: 24, group: steiner}
  steiner_out:                {label: Steiner Out, cc: 7, group: steiner}
  # Both filters at once (manual p. 29), listed here by the table.
  master_cutoff:              {label: Master Cutoff, cc: 27, group: steiner}

  # LADDER ──────────────────────────────────────────────────
  ladder_drive:               {label: Drive, cc: 85, group: ladder}
