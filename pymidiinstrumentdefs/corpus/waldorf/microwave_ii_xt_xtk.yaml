midi:
  # 1 to 16 in the Changed row, both ways (manual p. 122); the setting is omni or 1 to 16
  # (manual p. 93), and 1 at the very first power-up (manual p. 16). No `mode`: the chart
  # crosses it. See the account.
  channels: [1, 16]
  # `o` in both columns (manual p. 122). Sent only with MIDI Clock Send on (manual p. 94).
  clock: both
  # `o` in both columns, remarked `Start, Stop, Continue` (manual p. 122), and no sentence
  # anywhere. See the account.
  transport: both
  program_change:
    # `x` as transmitted and `o` as recognised over `0 - 127` (manual p. 122).
    receives: true
    sends: false
    # Two banks of 128 Sound programs, chosen by bank select on 32; and 128 Multi programs.
    presets: 256
  # Four numbers are the owner's to set, Control W to Z, beside the 99 the maker fixes; see the
  # account.
  control_change: learned
  # No page of any of the three documents names one; see the account.
  nrpn: none
  # Marked in both columns (manual p. 122).
  sysex: true

voice:
  addressing: pitches
  # `0 - 127` as recognised, and True Voice the same (manual p. 122).
  note_range: [0, 127]
  # "all 10 voices of the MicroWave II/XT/XTk" (manual p. 67). An expansion to thirty is named
  # only in a table of codes; shared is a reading. See the account.
  polyphony: 10
  polyphony_shared: true
  velocity:
    # `o` as transmitted and as recognised (manual p. 122); sent by the XTk's keyboard.
    note_on: both
    # `o` as recognised (manual p. 122), and a source a sound can use (manual p. 81).
    note_off: true
  # Key's and Ch's both `o` as recognised (manual p. 122).
  aftertouch: both
  # Ch's is `o` as transmitted and Key's `x` (manual p. 122): channel pressure, from the XTk's
  # keyboard (manual p. 95).
  aftertouch_transmits: true
  pitch_bend:
    # A range for each oscillator, 0 to 120 semitones, harmonic or the global setting
    # (manual p. 40); no factory value is printed.
    programmable: true

modes:
  sound:
    label: Sound mode
    # "When the MicroWave II/XT/XTk is first powered up, Sound mode is selected." (manual p. 24).
    factory: true
  multi:
    label: Multi mode
    # Controller messages go to the channel "selected for the corresponding Instrument"
    # (manual p. 97). Program changes still reach the basic channel (manual p. 94).
    unparted: false

parts:
  # Up to eight, each with a channel that may be another's, the global one or omni
  # (manual pp. 20, 88). An initialised Multi has Instrument 1 active, each on the channel of its
  # own number (manual p. 21).
  instrument:
    label: Instrument
    mode: multi
    count: 8
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]

