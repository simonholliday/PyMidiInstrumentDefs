    # Cited for the edition letters and for which documents exist. **The product path needs the
    # hyphens**: `music_production/music-production-studios/seqtrak/` is the instrument, while
    # `/music_production/seqtrak/` redirects to a category listing that answers 200 and is not
    # this instrument - the failure that is hardest to notice. This fetch took no redirect.
    # **And no two rows serve one file here, which was checked rather than assumed** after rank
    # 109 found two of the MONTAGE's rows behind the same bytes: all seven rows have their own
    # path, and the two documents fetched differ in size and hash and match the sizes the page
    # prints. The digest is of the text the page renders to, which is what a reader can search;
    # the HTML as served is beside it in the library at `759da116`.

midi:
  # `1 - 11` in the chart's Basic Channel row, with the Changed row crossed in both columns - so
  # eleven channels, one per track, and not one of them settable.
  channels: [1, 11]
  # Default 3 recognised, and `3,4(m=1)` under Mode Messages, where the chart's own footnote
  # reads `*1 m is always treated as "1" regardless of its value.` - so mode 4 collapses to one
  # voice. Nothing is transmitted: that column is crossed.
  mode: 3
  # Both ways, each gated by a setting the chart names: `*4 If clock out is on and SEQTRAK uses
  # the internal clock.` transmitting, `*5 If MIDI sync is "MIDI(Auto)".` receiving.
  clock: both
  # The chart's System Real Time Commands row, circled both ways.
  transport: both
  # **NOT ONE OCCURRENCE IN 272 SHEETS**, swept with the whitespace and hyphens taken out so that
  # a stacked or hyphenated spelling could not hide. The chart's `96,97` and `100,101` are the
  # registered parameters, which are addressing and not controls.
  nrpn: none
  sysex: true
  # Circled both ways with the chart's `*3 If switch is on.` against each. Receiving needs
  # `Receive/Transmit Program Change`, which ships on; sending needs that and each port's own
  # program change bit, which ships off (data_list p. 123). See the account on bank select.
  program_change:
    receives: true
    sends: true

voice:
  addressing: pitches
  note_range: [0, 127]
  # **NOT RECORDED, AND THE REASON IS PUBLISHED RATHER THAN MISSING.** See the account: two
  # engines, 128 voices and 8, and no sum in either document. `yamaha/montage_6_7_8` is
  # unrecorded for the same reason.
  velocity:
    # The chart marks Velocity, Note ON `O 9nH,v=1-127` as transmitted and as recognised, and
    # Note OFF `X` both ways (data_list p. 162).
    note_on: both
    note_off: false
  # **CROSSED IN ALL FOUR BOXES** - key's and channel's, transmitted and recognised - and the word
  # appears once in either document, as that row's own label. No ambiguity at all, where
  # `yamaha/montage_6_7_8` had two charts answering differently and needed a judgement.
  aftertouch: none
  # Never sent: both rows are crossed as transmitted (data_list p. 162).
  aftertouch_transmits: false
  pitch_bend:
    # Plus two and minus two, the defaults of the two system exclusive parameters that set the
    # bounds separately.
    semitones: 2
    programmable: true

parts:
  # **ELEVEN TRACKS ON ELEVEN FIXED CHANNELS, GROUPED THE WAY BOTH DOCUMENTS GROUP THEM.** The
  # Data List's track table gives a Track Group for each of the eleven, and the User Guide's
  # `AVAILABLE ON` column names those same four groups against every controller but the master
  # and send effects', where it is blank - so the grouping
  # is the maker's twice over rather than this file's invention.
  #
  # **`channel_offset` CARRIES THE SAME FICTION IT CARRIES IN `roland/jd_xi`**, and for the same
  # reason: the field says a part's channel is derived from a base and cannot be set on its own.
  # The second half is exactly right - the chart crosses the Changed row - and the first half is
  # a fiction, there being no base to derive from because the base never moves. The numbers a
  # consumer sends are right, 1 through 11, and the fiction is recorded here rather than left for
  # somebody to find. One for the format specification's list of what it cannot say.
  drum:
    label: Drum
    count: 7
    channel_offset: 0
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channels 1 to 7: a kick, a snare, a clap, two hats and two percussion tracks, each its own
    # track with its own name in the maker's table. **The only part the drum pitch controller
    # reaches**, which is how the group's span is confirmed from the controller side.
  synth:
    label: Synth
    count: 2
    channel_offset: 7
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channels 8 and 9. With the DX part, the two kinds the portamento, arpeggio and
    # mono/poly/chord controllers are given for, so each of those is written twice below.
  dx:
    label: DX
    channel_offset: 9
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channel 10, the four-operator FM track, and **the only part the four FM controllers reach**.
    # Also the one part the system exclusive bend-range parameters exclude.
  sampler:
    label: SAMPLER
    channel_offset: 10
    addressing: pitches
    receives: [notes, controls, program_change]
    # Channel 11. Named in capitals because that is how both the track table and the controller
    # tables' `AVAILABLE ON` column print it.

groups:
  mix: Mix
  envelope: Envelope
  filter: Filter
  eq: EQ
  send: Send
  portamento: Portamento
  arpeggio: Arpeggio
  voicing: Voicing
  fm: FM
  effect: Effect

controls:
  # ---- Bank select, from the Data List: 18.3 does not name it ----
  # "0 BANK SELECT MSB 0 - 127" (data_list p. 113) and "32 BANK SELECT LSB 0 - 127" (data_list
  # p. 113), in both the transmitted and the received lists. Both ways they pass the
  # `Receive/Transmit Bank Select` switch (data_list pp. 111, 112), which ships on, and sent they
  # pass each port's bank select bit too, which ships off (data_list p. 123). Only the banks the
  # Data List's table gives are answered, and only when a program change follows: see the account.
  # WRITTEN FOR ALL FOUR KINDS, because every channel takes control change, but what it chooses
  # is often not the track's own. A project "Channel number will be ignored." (data_list
  # p. 117), so it loads from any channel; a sound's type is "Drum / Synth / DX Sound" (data_list
  # p. 117), which leaves the sampler out; and a sampler element and a DrumKit sound each
  # "Regards channel number as element number." (data_list pp. 117, 118). The sampler has seven
  # elements (data_list pp. 113, 119), so they are chosen on channels 1 to 7, the drum tracks';
  # and a DrumKit sound chooses its drum track by its MSB, 32 to 38 (data_list p. 118), and its
  # element by the channel, where no element is numbered above 7 (data_list p. 119). **So on the
  # sampler's own channel the only bank documented to act is a project's.**
  drum_bank_select_msb:               {label: BANK SELECT MSB, cc: 0, part: drum}
  synth_bank_select_msb:              {label: BANK SELECT MSB, cc: 0, part: synth}
  dx_bank_select_msb:                 {label: BANK SELECT MSB, cc: 0, part: dx}
  sampler_bank_select_msb:            {label: BANK SELECT MSB, cc: 0, part: sampler}
  drum_bank_select_lsb:               {label: BANK SELECT LSB, cc: 32, part: drum}
  synth_bank_select_lsb:              {label: BANK SELECT LSB, cc: 32, part: synth}
  dx_bank_select_lsb:                 {label: BANK SELECT LSB, cc: 32, part: dx}
  sampler_bank_select_lsb:            {label: BANK SELECT LSB, cc: 32, part: sampler}
  # ---- 18.3.1 Sound Design parameters, each once for every kind of track it reaches ----
  drum_track_volume:                  {label: TRACK VOLUME, cc: 7, part: drum, group: mix}
  synth_track_volume:                 {label: TRACK VOLUME, cc: 7, part: synth, group: mix}
  dx_track_volume:                    {label: TRACK VOLUME, cc: 7, part: dx, group: mix}
  sampler_track_volume:               {label: TRACK VOLUME, cc: 7, part: sampler, group: mix}
  # **1 to 127 in 18.3, the one row it gives that range, and 0 - 127 in the Data List's control
  # change lists** (data_list p. 113), **whose own parameter table has 1 to 127 as well**
  # (data_list p. 135). This file carries 1 to 127: see the account.
  drum_track_pan:                     {label: TRACK PAN, cc: 10, range: [1, 127], part: drum, group: mix}
  synth_track_pan:                    {label: TRACK PAN, cc: 10, range: [1, 127], part: synth, group: mix}
  dx_track_pan:                       {label: TRACK PAN, cc: 10, range: [1, 127], part: dx, group: mix}
