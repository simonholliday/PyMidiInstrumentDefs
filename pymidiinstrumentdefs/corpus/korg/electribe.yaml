midi:
  # "GLOBAL MIDI CH ... [01...16] Specifies the MIDI channel of the electribe" (guide p. 6), and
  # the exclusive layout gives the same field as "Global Channel | 0~15=1~16". One channel for
  # the whole instrument; see the source account for what that means for its sixteen parts.
  channels: [1, 16]
  # Five settings, three of which take clock from outside: "CLOCK MODE ... [Internal, Auto,
  # External USB, External MIDI, External Sync]" (guide p. 6). Internal sends it - the
  # implementation's real-time messages are footnoted "This message is transmitted when the
  # Global "CLOCK MODE" is set to "Internal"" - and the external settings receive it.
  clock: both
  transport: both
  # Only the chart says this, in its Mode row: X transmitted, 3 received (manual p. 110). Mode 3
  # is Omni Off, Poly, which the chart's own legend spells out. The implementation never
  # mentions a mode, and the instrument answers no mode message - the chart marks Mode Messages
  # X in both columns.
  mode: 3
  program_change:
    # Both tables carry Cn, and the global send and receive filters each have a setting that
    # stops program change alone.
    receives: true
    sends: true
    # "capable of creating and storing up to 250 patterns" (manual p. 8). A program change picks
    # a pattern here rather than a sound, and see the source account for why the published
    # mapping reaches only 248 of them.
    presets: 250
  # A full layout, parameter by parameter: a pattern, each of the sixteen parts, and the global
  # data, with eight function IDs for the dumps and the errors. This is the most complete
  # exclusive documentation in this corpus.
  sysex: true
  # NOT RECORDED: NRPN. Neither table mentions it and no page does, so nobody was told either
  # way - which is a silence rather than the checked absence that aftertouch gets below.

voice:
  addressing: pitches
  # Footnote *1 on note off gives "kk =  0 ~ 127", the guide's step editor offers
  # "NOTE ... [---, C-1...G 09]" (p. 5), which is the same 128 notes under Korg's naming, and the
  # chart's Note Number row reads 0-127 in both columns (manual p. 110).
  # BUT THE CHART'S TRUE VOICE ROW READS 0-108 RECEIVED, so it takes all 128 and sounds the
  # bottom 109 of them. `note_range` is what it answers to, which is the wider figure; the
  # narrower one is here because a host that sends note 120 will be heard and not played.
  note_range: [0, 127]
  # "The maximum number of sounds (entire pattern):    MAX. 24 voices (The number of
  # simultaneous sounds in entire pattern depends on the type of Oscillator, Filter or Insert
  # Fx.)" (manual p. 19), against "The maximum number of sound (per part):    MAX, 4 voices" on
  # the same page.
  # SO TWENTY-FOUR IS A CEILING SHARED BETWEEN THE SIXTEEN PARTS, not four each - sixteen parts
  # of four would be sixty-four - and the parenthesis says even the twenty-four depends on which
  # oscillator, filter and insert effect the parts are set to. **`polyphony_shared` would be the
  # field for that and this file cannot use it**, because it says whether *parts* share their
  # voices and there is no `parts` block here; see the source account for why there is not.
  polyphony: 24
  velocity:
    # "Note On  vv=1~127" in both tables, and the trigger pads have four response curves to
    # choose between - "VELOCITY CURVE ... [Heavy, Normal, Light, Const96]", where "Const96: The
    # velocity value will always be 96" (guide p. 6).
    note_on: both
    # Note off is "8n | kk  (kk) | 40    (64)" in both tables, a fixed 64, so there is no
    # velocity in it - and the chart agrees, marking the note-off velocity "X 8n, V=64"
    # transmitted and "X" received (manual p. 110).
    note_off: false
  # A CHECKED ABSENCE TWICE OVER. The implementation's two tables list every status byte this
  # instrument transmits and recognises, and there are four - 8n, 9n, Bn and Cn - so neither An
  # nor Dn appears. And the chart says it outright: its After Touch rows, Key's and Channel, are
  # marked X in both the Transmitted and the Received column (manual p. 110).
  aftertouch: none
  # NOT RECORDED: pitch bend, because there is none to record and no field that says so. En is
  # absent from both of the implementation's tables, and the chart's Pitch Bend row is X in both
  # columns (manual p. 110).

groups:
  oscillator: Oscillator
  filter: Filter
  modulation: Modulation
  envelope: EG
  amp: Amp
  insert_fx: Insert effect
  master_fx: Master effect

controls:

  # Generated from the implementation by `Notes/4231_write_controls.py`, which reproduces this
  # block. Every one is both transmitted and received, so none carries a `direction`; the
  # extraction script asserts that the two tables agree.
  #
  # EVERY ONE OF THESE IS 7-BIT ON THE WIRE, which the footnotes say and which is easy to read
  # the wrong way. A bipolar parameter is still sent as 0 to 127 and only *reads* as a signed
  # number on the display - "00,01~40~7F : L63,L63~Center~R63" for the pan, "00,01~7F :
  # -63,-63~+63" for the two pitch figures - so none of them carries a negative `range`, because
  # that field is the value on the wire. The three switches are sent as **0x00 or 0x7F** rather
  # than 0 or 1, which is why they carry `choices` of 0 and 127: a host that sent 1 for "on"
  # would be following a guess rather than this document.
  # The groups are the parameter guide's own panel sections, because the tables are a flat list
  # in numerical order and give no grouping at all.

  # OSCILLATOR --------------------------------------------------------

  # OSCILLATOR --------------------------------------------------------
  osc_pitch:              {label: Osc Pitch, cc: 80, group: oscillator}
  osc_glide:              {label: Osc Glide, cc: 81, group: oscillator}
  osc_edit:               {label: Osc Edit, cc: 82, group: oscillator}

  # FILTER ------------------------------------------------------------
  filter_resonance:       {label: Filter Resonance, cc: 71, group: filter}
  filter_cutoff:          {label: Filter Cutoff, cc: 74, group: filter}
  filter_eg_int:          {label: Filter EG Int., cc: 83, group: filter}

  # MODULATION --------------------------------------------------------
  modulation_depth:       {label: Modulation Depth, cc: 85, group: modulation}
  modulation_speed:       {label: Modulation Speed, cc: 86, group: modulation}

  # ENVELOPE ----------------------------------------------------------
  eg_decay_release:       {label: EG Decay/Release, cc: 72, group: envelope}
  eg_attack:              {label: EG Attack, cc: 73, group: envelope}

  # AMP ---------------------------------------------------------------
  amp_level:              {label: Amp Level, cc: 7, group: amp}
  amp_pan:                {label: Amp Pan, cc: 10, group: amp}

  # INSERT FX ---------------------------------------------------------
  insert_fx_edit:         {label: Insert Fx Edit, cc: 87, group: insert_fx}
  insert_fx_on:           {label: Insert Fx Off/On, cc: 104, choices: {"off": 0, "on": 127}, group: insert_fx}

  # MASTER FX ---------------------------------------------------------
  master_fx_x:            {label: Master Fx X, cc: 102, group: master_fx}
  master_fx_y:            {label: Master Fx Y, cc: 103, group: master_fx}
  mfx_send_on:            {label: MFX Send Off/On, cc: 105, choices: {"off": 0, "on": 127}, group: master_fx}
  master_fx_on:           {label: Master Fx Off/On, cc: 106, choices: {"off": 0, "on": 127}, group: master_fx}
