# TWO MAPS, AND WHETHER THE SECOND IS LIVE DEPENDS ON A MODE RATHER THAN ON A CHANNEL. The Tracker
# answers to one set of thirty-two controller numbers for its performance effects and its mixer,
# on which the manual's page puts no condition but CC In being on; and to a second set of
# forty-eight for the selected instrument's own parameters, **only in MIDI Synthesizer mode,
# which the manual says needs the sequencer stopped**. The two sets share no number. **The
# second set is on a part that exists in the `synthesizer` mode only.** Until 2026-10-11 this
# format had no field to say that a control answers in one mode only, and the groups below were the
# only thing distinguishing the two.
#
# NOTHING BELOW IS TRANSMITTED. The Tracker's outgoing controllers are not a map at all: six slots
# per MIDI instrument, A to F, each of which the player sets to any number. So this file describes
# what the Tracker answers to, and the sending side is a setting rather than a fact.
#
# THE ONE CONTROLLER THAT IS NOT IN EITHER TABLE. The manual's Synthesizer Mode table has the
# whole panning automation and no row for panning itself - and the picture of the instrument's own
# screen two pages earlier reads "Panning = 10" (manual p. 265). It ships, from the screen, and is
# marked.

definition: 1

model:
  manufacturer: Polyend
  name: Tracker
  # The manual's own colophon: "October 2025 - Tracker OS 1.9.2 a" (manual p. 307), and the
  # download page offers `PolyendTracker_1.9.2.ptf.zip` as the firmware. The `1v9v2a` in both
  # PDFs' file names is that same version written for a URL.
  firmware: "1.9.2"

source: >-
  Tracker Manual (308pp, October 2025, for OS 1.9.2a): chapter 11 is MIDI, and **the two tables
  every number here but one comes from are at pp. 262 and 267**. Beside them: the MIDI
  configuration at pp. 251-252, an example setup that lists the first table's numbers at p. 255,
  the MIDI instruments at p. 256, velocity at p. 258, the CC out slots at pp. 259-260, program
  change at p. 263, the mode headed "MIDI Synthesizer" (manual p. 264) at pp. 264-266,
  performance over MIDI at p. 279, the mixer's controllers at pp. 185-186, the voices at p. 236
  and the tracks at p. 18. And the release notes on the maker's download page, which say of the
  mode what the manual does not: when it arrived, a shortcut into it, and a new name.

  **THIS MANUAL IS NOT WRITTEN BY POLYEND.** Its colophon reads "Manual Produced in the United
  Kingdom by ... Synthdawg" (manual p. 307) - the ellipsis is the typesetter's web address,
  which the page sets below the name and the text layer returns between the two, so the words
  a reader sees in one line are not one string in the file. Its cover calls it "An Official
  Reference for The Polyend Tracker" (manual p. 1). So it is a third party's book that the
  maker publishes and serves from its own download page as the manual. That is worth knowing
  before weighing it against the instrument: where this book and the Tracker's own screen
  disagree, the screen is the instrument and the book is a description of it.

  **AND THAT IS NOT HYPOTHETICAL HERE.** The "Synthesizer Mode - MIDI CC Configurations"
  (manual p. 267) table lists forty-seven controller numbers and **has no row for panning**,
  although it carries the whole panning automation at 26 to 31. Two pages earlier, a picture of the
  Tracker's own display lists the same parameters in the same unusual order - Tune, FineTune,
  Volume, **Panning**, Filter type, Cutoff, Resonance - with their numbers beside them, and gives
  "Panning = 10" (manual p. 265). The picture shows thirteen lines of a list that scrolls, and the
  twelve other pairs in it carry the table's numbers. **So the table has dropped a line the screen
  has**, and CC 10 is recorded below on the screen's authority, marked. The picture runs from Delay
  Send at 15 straight to Volume Automation Type at 20, so the table's 16 and 17, the wavetable and
  granular pair, rest on the table alone.

  THE OTHER THING THE TABLE IS SHORT OF, AND THIS ONE IS NOT RECORDED. Five of the six automation
  blocks have six rows - Automation Type, Attack, Decay, Sustain, Release and Amount - and
  **Finetune has five**, ending at 118 Finetune Release with no Finetune Amount. By the pattern
  that would be 119. Nothing published says whether the parameter exists and was left out or does
  not exist, so nothing is recorded for it; unlike panning, no second printing settles it.

  TWO ROWS OF EACH BLOCK CARRY TWO NAMES, because an automation is an envelope or an LFO: "The
  modulator can be an LFO or an Envelope" (manual p. 115). So "Volume - Attack - Shape LFO"
  (manual p. 267) is read here as one number that sets an envelope's attack or an LFO's shape,
  by the block's Automation Type, and the Decay row as doubling for the LFO's speed the same
  way. No page says so of the controller. NOT RECORDED: which value of Automation Type, or of
  Filter Type, selects which. No page gives a controller's values for either.

  WHAT A VALUE DOES IS SAID FOR THE PERFORMANCE NUMBERS ONLY. For the effect slots, "The CC range
  on the controller is 0-127 which will be reflected across the range of the effect" (manual
  p. 279), and for 41 to 48, "The value will represent the pattern" (manual p. 279). Nothing is
  said for the mixer's twelve. Of the second map the manual says only that "The instrument
  parameters will adjust when controlled by the external MIDI controller" (manual p. 266).

  WHAT THE TRACKER SENDS IS A SETTING, NOT A MAP. Each of its sixteen MIDI instruments carries
  **six controller slots, A to F**, and the player puts any number in each: "Six CC parameter
  slots A-F exist in tracker that can be allocated a CC and then used in FX1 or FX2 of a step"
  (manual p. 259). The list offered when filling a slot is the MIDI specification's own names, not
  this instrument's parameters, and it runs past 127: "the Program Change 128, Channel Aftertouch
  129 and Polyphonic Aftertouch 130 can also be configured here" (manual p. 260). **So the
  Tracker transmits program change and both kinds of aftertouch as step effects, and none of them
  on a fixed number.**

  AND THE MANUAL CONTRADICTS ITSELF ABOUT WHICH NUMBER PROGRAM CHANGE IS. Page 260 gives 128, and
  page 263 says "Program change is configured as a CC parameter using number 129" (manual p. 263) -
  which is the number p. 260 gives to Channel Aftertouch. Neither is recorded.

  NOT RECORDED: whether the Tracker answers to a program change at all, because the configuration
  menu enumerates its four inputs - clock, transport, notes and CC - and program change is not
  among them, which is an absence of mention rather than a stated no; whether it answers to
  aftertouch, for the same reason; its note range, which no document states, and which the Middle
  C setting shifts anyway; and system exclusive, which appears only as a glossary entry explaining
  what the term means.

  **PITCH BEND IS A CHECKED ABSENCE**: the words "pitch bend" do not occur anywhere in this
  manual's 308 pages, in either case, and neither does MPE.

  THE MANUAL SPELLS THE MODE'S NAME BOTH WAYS. "Synthesizer" (manual p. 264) twenty-five times
  across twelve pages, five of them about wavetable and granular synthesis and not the mode,
  and "Synthesiser" (manual p. 265) twice - both on one page, in the two paragraphs that
  explain the mode. A British author writing for a Polish maker in a document whose own
  headings are American. The heading's spelling is kept wherever this file names the mode.

  THE MAKER HAS RENAMED IT SINCE, AND THE MANUAL HAS NOT FOLLOWED. The release notes on the
  download page call it "MIDI Synth Mode (press the Shift + Instrument Parameters keys shortcut
  to enter" (downloads) when it arrived in 1.6.0, and say of 1.9.0 that "Instrument Synthesizer
  functionality (on Instrument Parameters/Effects screen) was renamed to Instrument MIDI
  Mapping" (downloads). This file describes 1.9.2, and its manual still prints "Instrument
  Synthesizer" (manual p. 265) on the pictured screen. So a player on current firmware should
  look for Instrument MIDI Mapping on the instrument, and in the manual for the heading this
  file takes the mode's label from. Whether the 1.6.0 shortcut still exists the manual does not
  say: it names no shortcut. The one route it gives is to the mode's page, "Select [Instrument
  Parameters] page 1/2. Screen Button [More] then Press [Instrument Synthesizer]" (manual
  p. 265), which the 1.7.0 notes record as "Added access to the Instrument Synthesizer page in
  Instrument Parameters > More" (downloads), and it says that page need not be displayed.

  ONE LINE OF THIS MANUAL BELONGS TO ANOTHER INSTRUMENT. The settings table at p. 50 explains
  Clock Out as "Sets the Tracker Mini clock output" (manual p. 50) - in a book about the Tracker,
  whose cover, running head and every other page say Tracker. It is the only such line, and the same
  setting is described without the Mini at p. 251. Recorded because a manual that carries a
  sibling's text in one place may carry it in others.

sources:
  manual:
    kind: manual
    title: Tracker Manual
    edition: 1v9v2a
    dated: "2025-10"
    landing: "https://polyend.com/downloads/tracker-downloads/"
    url: "https://polyend-website.fra1.digitaloceanspaces.com/wp-content/uploads/2023/11/29122938/Polyend-Tracker-Manual-1v9v2a.pdf"
    sha256: 638cd9075051df1df8aa904d307668397064bb1a3f99b2059429e99254c33f43
    retrieved: 2026-10-04
    page_offset: 0
    # 308 pages, and its printed page numbers match its sheets exactly, which is rare enough here
    # to be worth saying. **The URL's `/2023/11/` is where the maker's site filed the name, not
    # when this file was made**: the PDF was built on 2025-10-14 and its colophon says October
    # 2025, so Polyend has replaced the document in place and the path's date is misleading.
  downloads:
    kind: download_page
    title: "Tracker downloads • Polyend"
    landing: "https://polyend.com/downloads/tracker-downloads/"
    url: "https://polyend.com/downloads/tracker-downloads/"
    sha256: c0ab90b6b22c1dc06d9ba1985d40065b44d54c500c3a4f9cb9e1d5b9d41c3770
    retrieved: 2026-10-04
    paginated: false
    # Cited for the firmware and for its release notes, which it carries version by version
    # inline rather than as a document. Several are about what this file describes: "Tracker can
    # now be configured to send 6 distinct MIDI CCs per MIDI channel" (downloads); "Performance
    # mode is now controllable via MIDI input." (downloads); a fix for "In Instrument Synthesizer
    # mode Tracker not responding to CCs assigned to Delay Send correctly" (downloads); and the
    # mode's arrival in 1.6.0 and its renaming in 1.9.0, which the source account quotes.
    #
    # The sha256 is of the page's visible text; the page as served hashes to
    # 4c8d6182f66e60e1f56f1d2fddfc1a65e89a95a46cd1372dee15f06658499f98.

midi:
  # TWO CHANNELS, SET SEPARATELY AND EACH ABLE TO BE ALL. Notes Input Channel "Sets the MIDI
  # channel for external note inputs. Select All channels or Ch 1-16" (manual p. 251), and CC In
  # channel "Sets the MIDI channel that is used to receive CC (control change) messages"
  # (manual p. 251) with the same choices. So notes and controllers can arrive on different
  # channels, which one range cannot say.
  channels: [1, 16]
  # Clock In sets the clock between "the internal generated clock (default) or an external clock
  # received through the USB or MIDI In jack" (manual p. 251), and Clock Out "Sends the Tracker
  # clock output to other devices" (manual p. 251). Internally it runs at "192 PPQN"
  # (manual p. 250).
  clock: both
  # Transport In and Transport Out, each with the same routing choices (manual p. 251).
  transport: both
  program_change:
    # SENT AS A STEP EFFECT AND NOT ON A FIXED NUMBER - it is one of the things a CC slot can be
    # set to. **Which number selects it is the one thing the manual contradicts itself about**,
    # 128 at p. 260 and 129 at p. 263, so neither is recorded.
    sends: true
    # `receives` IS DELIBERATELY UNSET. The configuration menu enumerates what the Tracker takes
    # in - Clock In, Transport In, Notes In, CC In - and program change is not among them
    # (manual p. 251), and the received map at p. 262 has no program-change destination. That is
    # an absence of mention, not a stated no, so it is left unrecorded rather than called false.
  # NONE, CHECKED. The word NRPN occurs twice in 308 pages: once as a glossary entry explaining
  # what the term means - "Non-Registered Parameter Number is part of the MIDI standard"
  # (manual p. 250) - and once as a label in the list of names a transmit slot can be set to.
  # Neither is a statement that this instrument speaks NRPN.
  nrpn: none
  # `sysex` IS UNSET for the same reason: SYSEX appears once, in that same glossary, describing
  # what system exclusive is for in general. Nothing says what the Tracker does with it.

modes:
  # TWO STATES. The second is the mode the manual heads "MIDI Synthesizer" (manual p. 264), in
  # which a controller "will be able to play and control Trackers instruments" (manual p. 264).
  # **The manual names no switch that turns it on.** What it gives is a condition, "Tracker's
  # sequencer must be stopped to use as a MIDI synthesizer." (manual p. 265), and a statement
  # that its page need not be open: "The Synthesizer mode page does not have to be displayed to
  # operate in this mode." (manual p. 265). On that account the mode is the sequencer stopped
  # and the other state the sequencer running. The 1.6.0 release note has a shortcut that
  # enters it, quoted in the source account, and no document reconciles the two. So the mode is
  # recorded as the state in which the second map answers, and how it is reached stays in
  # words. The first state has no name in any document, so its key is this file's and it has no
  # label. Neither is marked as the factory one, since no page says which the instrument
  # starts in.
  # **PERFORMANCE MODE IS ANOTHER STATE THE MANUAL NAMES, AND IT IS KEPT IN WORDS HERE.** It is
  # not one of these two and can hold in either: it is entered with playback stopped (manual
  # p. 275) and patterns are played in it (manual p. 271). The first map's performance numbers
  # are described as working in it - see the comment above the controls.
  standard: {}
  synthesizer:
    label: MIDI Synthesizer

parts:
  # THE SELECTED INSTRUMENT, as an outside controller reaches it in MIDI Synthesizer mode, one
  # instrument at a time: "The last selected instrument will be the one used for the synthesizer
  # control from an external controller." (manual p. 265). Its forty-eight numbers come in on
  # the CC In channel, as the other thirty-two do: that setting "Sets the MIDI channel that is
  # used to receive CC (control change) messages" (manual p. 251), and the mode's setup asks
  # that "the MIDI configuration is matched, for example same MIDI channel" (manual p. 266). So
  # the part sits on the base channel, and what tells the two sets apart is the mode and not
  # the channel. **`notes` is `unrecorded`: the part takes them, on a channel that is set apart
  # from the part's own.** A controller plays the instruments in this mode too, "controlling up
  # to 8 voices across MIDI" (manual p. 264), but notes come in on the Notes Input Channel,
  # which "Sets the MIDI channel for external note inputs." (manual p. 251), a setting of its
  # own beside the CC In channel. The two may hold the same number or different ones: the
  # mode's own example shows both at channel 1 (manual p. 264), and an example setup outside
  # the mode shows notes on 1 and control changes on 2 (manual p. 255). On which instrument a
  # note plays, the mode's setup has the selected one "as the destination target from the MIDI
  # controller and as the synthesizer instrument" (manual p. 266), and that example outside the
  # mode has "The keyboard will control the current instrument in Channel 1." (manual p. 255).
  # **So the manual gives the route, its channel (manual p. 251) and its instrument (manual
  # pp. 255, 266), and the format has no place for it**: a part has one channel, and this one's
  # is the CC In channel. That is the second of the two cases the word has, and not the volca
  # drum's, where no page ties a note to a part. No sentence says the Notes Input Channel
  # governs in this mode; the mode's own example shows it set (manual p. 264). Until 2026-10-13
  # `notes` was only left out of `receives`, which reads as a part that takes none.
  synthesizer:
    label: Selected instrument
    mode: synthesizer
    channel_offset: 0
    receives: [controls]
    unrecorded: [notes]

voice:
  addressing: pitches
  # "Tracker has 8 voices which would represent each of the tracks playback" (manual p. 236), and
  # "Tracker has 8 tracks" (manual p. 18). The 1.9.0 release notes add four MIDI tracks, "MIDI
  # can now be sequenced on 12 tracks in total" (downloads), which the manual does not
  # mention.
  polyphony: 8
  # ONE POOL, AND THE SELECTED INSTRUMENT PLAYS FROM IT. The Tracker has eight voices in all,
  # the figure above (manual p. 236). MIDI Synthesizer mode has a controller "controlling up to
  # 8 voices across MIDI" (manual p. 264), with the sequencer stopped (manual p. 265). No
  # sentence says those eight are the tracks' eight, and no page gives the Tracker any other,
  # so they are read as the Tracker's eight and not eight more. How many of them one selected
  # instrument can hold at once is not said. The field is here since 2026-10-13: the part now
  # says notes reach it, and the loader then asks whether a part's voices are its own.
  polyphony_shared: true
  velocity:
    # Sent with every step, and recordable from outside: "To be able to record velocity, the
    # Config > General > 'Recording Options' would need a velocity option to be set"
    # (manual p. 258).
    note_on: both
    # NOT RECORDED. Nothing says what the Tracker does with a note-off velocity it receives, and
    # what it sends is a note's own velocity rather than a release one.
  # `aftertouch` IS UNSET AND `aftertouch_transmits` IS TRUE, an asymmetry worth reading
  # carefully: the Tracker **sends** both kinds as step effects - a step's MIDI message can be "CC
  # (Control Change), PC (Program Change), Polyphonic Aftertouch or Channel Aftertouch" (manual
  # p. 180) - and no document says it answers to either. `aftertouch` describes what an instrument
  # does with what it is sent.
  aftertouch_transmits: true
  # NOT RECORDED, note_range. No document states one, and "Middle C" is settable to C-3, C-4, C-5
  # or C-6 (manual p. 251), which shifts the whole mapping against the sender's notes.

# How to read the controls below. **Every one is received and none is transmitted**, for the
# reason in the account above. They fall into two sets:
#
#   `performance_effects` and `master`   on which the page puts no condition but CC In being
#                                        on. "The MIDI CC Mapping within Tracker has a set of
#                                        pre-defined destinations for CC messages" (manual
#                                        p. 262). They name no part, so the file has them
#                                        answering in both modes. That is the format's reading
#                                        of a row with no condition, and not a sentence of the
#                                        manual's: it speaks of the performance numbers
#                                        "in perform mode" (manual p. 279), an example setup
#                                        lists them under "Performance Mode Tracks" (manual
#                                        p. 255) and "Performance Mode Effects" (manual
#                                        p. 255), and no page says whether they answer outside
#                                        it, or with the sequencer stopped.
#   everything else                      only in MIDI Synthesizer mode, for which the sequencer
#                                        must be stopped: "To use Tracker as a synthesizer, the
#                                        sequence must be stopped" (manual p. 265). They reach
#                                        whichever instrument is selected, and are on the
#                                        `synthesizer` part, which exists in that mode only.
#
# The two sets share no controller number, and as the file reads them they could not: the first
# set answers while the second does, so a number in both would mean two things at once. Until
# 2026-10-11 the file could say no more than that; the part's mode now says when the second set
# answers.
#
# THE ORDER IS THE MAKER'S, NOT NUMERIC. The synthesizer map's first rows run 5, 3, 7, 10, 9, 1,
# 11 because that is the order the instrument's own screen lists them in, and the manual follows
# it. Sorting them would lose the evidence that the table follows the screen, which the picture
# gives as far as 15.
#
# NOT LISTED: nothing. Neither table has a mechanism row - no bank select, no data entry - so
# unlike most instruments here there is nothing set aside, and every row of both tables is below.

groups:
  # Neither table has a sub-heading, so these are taken from **the maker's own prefix inside the
  # rows**: every row of the first block begins "Performance Effect" (manual p. 262), every row of
  # the second "Master -", and each automation block is named for the parameter it shapes.
  performance_effects: Performance Effect
  master: Master
  # The plain instrument parameters of Synthesizer Mode, as against the automation blocks below.
  # NOT THE MAKER'S WORD: the manual heads this run with nothing, and says of the thing they
  # belong to "The last selected instrument will be the one used" (manual p. 265).
  instrument: Instrument
  volume: Volume
  panning: Panning
  cutoff: Cutoff
  wavetable_position: Wavetable Position
  granular_position: Granular Position
  finetune: Finetune

controls:
# ──── performance_effects ────

  track_1_pattern_select:            {label: Performance Effect Track 1 Pattern Select, cc: 41, direction: receives, group: performance_effects}
  track_2_pattern_select:            {label: Performance Effect Track 2 Pattern Select, cc: 42, direction: receives, group: performance_effects}
  track_3_pattern_select:            {label: Performance Effect Track 3 Pattern Select, cc: 43, direction: receives, group: performance_effects}
  track_4_pattern_select:            {label: Performance Effect Track 4 Pattern Select, cc: 44, direction: receives, group: performance_effects}
  track_5_pattern_select:            {label: Performance Effect Track 5 Pattern Select, cc: 45, direction: receives, group: performance_effects}
  track_6_pattern_select:            {label: Performance Effect Track 6 Pattern Select, cc: 46, direction: receives, group: performance_effects}
  track_7_pattern_select:            {label: Performance Effect Track 7 Pattern Select, cc: 47, direction: receives, group: performance_effects}
  track_8_pattern_select:            {label: Performance Effect Track 8 Pattern Select, cc: 48, direction: receives, group: performance_effects}
  slot_1_value:                      {label: Performance Effect Slot 1 Value - Top Row, cc: 51, direction: receives, group: performance_effects}
  slot_2_value:                      {label: Performance Effect Slot 2 Value - Top Row, cc: 52, direction: receives, group: performance_effects}
  slot_3_value:                      {label: Performance Effect Slot 3 Value - Top Row, cc: 53, direction: receives, group: performance_effects}
  slot_4_value:                      {label: Performance Effect Slot 4 Value - Top Row, cc: 54, direction: receives, group: performance_effects}
  slot_5_value:                      {label: Performance Effect Slot 5 Value - Top Row, cc: 55, direction: receives, group: performance_effects}
  slot_6_value:                      {label: Performance Effect Slot 6 Value - Top Row, cc: 56, direction: receives, group: performance_effects}
  slot_7_value:                      {label: Performance Effect Slot 7 Value - Top Row, cc: 57, direction: receives, group: performance_effects}
  slot_8_value:                      {label: Performance Effect Slot 8 Value - Top Row, cc: 58, direction: receives, group: performance_effects}
  slot_9:                            {label: Performance Effect Slot 9 - Top Row, cc: 59, direction: receives, group: performance_effects}
  slot_10_value:                     {label: Performance Effect Slot 10 Value - Top Row, cc: 60, direction: receives, group: performance_effects}
  slot_11_value:                     {label: Performance Effect Slot 11 Value - Top Row, cc: 61, direction: receives, group: performance_effects}
  slot_12_value:                     {label: Performance Effect Slot 12 Value - Top Row, cc: 62, direction: receives, group: performance_effects}

  # ──── master ────

  track_mixer_track_1_volume:        {label: Master - Track Mixer Track 1 Volume Level, cc: 71, direction: receives, group: master}
  track_mixer_track_2_volume:        {label: Master - Track Mixer Track 2 Volume Level, cc: 72, direction: receives, group: master}
  track_mixer_track_3_volume:        {label: Master - Track Mixer Track 3 Volume Level, cc: 73, direction: receives, group: master}
  track_mixer_track_4_volume:        {label: Master - Track Mixer Track 4 Volume Level, cc: 74, direction: receives, group: master}
  track_mixer_track_5_volume:        {label: Master - Track Mixer Track 5 Volume Level, cc: 75, direction: receives, group: master}
  track_mixer_track_6_volume:        {label: Master - Track Mixer Track 6 Volume Level, cc: 76, direction: receives, group: master}
  track_mixer_track_7_volume:        {label: Master - Track Mixer Track 7 Volume Level, cc: 77, direction: receives, group: master}
  track_mixer_track_8_volume:        {label: Master - Track Mixer Track 8 Volume Level, cc: 78, direction: receives, group: master}
  global_mixer_delay_mix:            {label: Master - Global Mixer Delay Mix, cc: 79, direction: receives, group: master}
  global_mixer_reverb_mix:           {label: Master - Global Mixer Reverb Mix, cc: 80, direction: receives, group: master}
  global_mixer_dry_mix:              {label: Master - Global Mixer Dry Mix, cc: 81, direction: receives, group: master}
  global_mixer_line_input:           {label: Master - Global Mixer Line Input, cc: 82, direction: receives, group: master}

  # ──── instrument ────

  tune:                              {label: Tune, cc: 5, direction: receives, part: synthesizer, group: instrument}
  finetune:                          {label: Finetune, cc: 3, direction: receives, part: synthesizer, group: instrument}
  volume:                            {label: Volume, cc: 7, direction: receives, part: synthesizer, group: instrument}
  # FROM THE PICTURED SCREEN AND NOT THE TABLE: "Panning = 10" (manual p. 265). See the account.
  panning:                           {label: Panning, cc: 10, direction: receives, part: synthesizer, group: instrument}
  filter_type:                       {label: Filter Type, cc: 9, direction: receives, part: synthesizer, group: instrument}
  cutoff:                            {label: Cutoff, cc: 1, direction: receives, part: synthesizer, group: instrument}
  resonance:                         {label: Resonance, cc: 11, direction: receives, part: synthesizer, group: instrument}
  overdrive:                         {label: Overdrive, cc: 12, direction: receives, part: synthesizer, group: instrument}
  bit_depth:                         {label: Bit Depth, cc: 13, direction: receives, part: synthesizer, group: instrument}
  reverb_send:                       {label: Reverb Send, cc: 14, direction: receives, part: synthesizer, group: instrument}
  delay_send:                        {label: Delay Send, cc: 15, direction: receives, part: synthesizer, group: instrument}
  wavetable_granular_position:       {label: Wavetable / Granular Position, cc: 16, direction: receives, part: synthesizer, group: instrument}
  wavetable_window_granular_length:  {label: Wavetable Window / Granular Length, cc: 17, direction: receives, part: synthesizer, group: instrument}

  # ──── volume ────

  volume_automation_type:            {label: Volume Automation Type, cc: 20, direction: receives, part: synthesizer, group: volume}
  volume_attack_shape_lfo:           {label: Volume - Attack - Shape LFO, cc: 21, direction: receives, part: synthesizer, group: volume}
