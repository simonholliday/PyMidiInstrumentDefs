# **THE FIRST INSTRUMENT HERE WHOSE CONTROLLER NUMBERS ARE PUBLISHED TWICE.** Roland offers three
# documents for the TB-3 and two of them are about MIDI and nothing else: a one-sheet
# `MIDI Implementation Chart`, which gives all thirteen controller numbers, and a six-sheet
# `MIDI Implementation`, which has no controller table at all.
#
# **BUT THE SECOND ONE NAMES SEVEN OF THE SAME NUMBERS ANYWAY.** It is a system-exclusive
# document, and its `Controller` address block prints each parameter's controller number beside
# the SysEx address that reaches the same parameter. **All seven agree with the chart**, and the
# account below quotes each of the seven at the page it is on rather than repeating them here.
# Nothing else in this corpus has had a second document, written for another purpose, restate a
# controller number at all - and the usual trouble with a number given twice is that the two
# disagree - and this corpus carries neither number when that happens, saying what both were.
#
# **AND THE CHART HAS TO BE READ BY COORDINATE, WHERE A FLAT READING LOSES A BOX.** Its text layer
# runs every number, then every transmitted mark, then every recognized mark, then every name, so
# `74 o o CUTOFF` appears nowhere in it. A flat count of the marks comes to 27 where fourteen rows
# need 28, because one row's two glyphs and its name sit a point apart in the layer.
# `Notes/4647_extract_tb_3.py` measures the three columns from the chart's own heading row and
# reads 28, which is the rule `roland/tr_8` set at rank 101.
#
# **ITS MANUAL NAMES AFTERTOUCH AND ITS CHART CROSSES AFTERTOUCH IN ALL FOUR BOXES, AND BOTH ARE
# TRUE.** The manual has a `Pad Aftertouch Sensitivity` setting that "Adjusts the sensitivity of
# the pad to pressure (aftertouch)." (manual); the chart crosses key's and channel's, transmitted
# and recognized. The resolution is in the controller table rather than in either statement:
# **pad pressure leaves this instrument as controller 1, `PAD Z`.** So the pad is pressure
# sensitive, nothing aftertouch-shaped goes down the wire, and a reader who presses the pad and
# watches the wire still sees something move. Recorded here because a reader meeting the manual's
# sentence alone would expect `aftertouch: channel` and be wrong.

definition: 1

model:
  manufacturer: Roland
  name: TB-3
  # **1.10, WHICH BOTH MIDI DOCUMENTS DECLARE ON THEIR OWN FACES** - the chart as
  # "Model TB-3 Date: Jul. 25, 2014 Version: 1.10" (chart) and the implementation as
  # "Model: TB-3 Date: Jul. 04, 2014 Version: 1.10" (implementation p. 1), three weeks apart at
  # the same version.
  # Nothing later is offered, and unlike `roland/tr_8` there is no update document carrying the
  # instrument past its chart.
  firmware: "1.10"
  # A synthesizer, discontinued - and its support page is the live-product shape, three documents
  # each behind a GUID of its own, not the empty shell `roland/tr_909` had to work around.
  # Checked 2026-10-06.

source: >-
  **THREE DOCUMENTS, AND THE TWO THAT MATTER ARE ABOUT MIDI AND NOTHING ELSE.** The
  `MIDI Implementation Chart` is one A4 sheet and settles every field below except two. The
  `MIDI Implementation` is six sheets of system exclusive, and **its `Controller` address block
  restates seven of the thirteen controller numbers** beside the addresses that reach the same
  parameters. All seven agree with the chart, which is the only corroboration of a controller
  number by a second document anywhere in this corpus:

  "CUTOFF (CC# 74)" (implementation p. 2); "RESONANCE (CC# 71)" (implementation p. 2);
  "ACCENT (CC# 16)" (implementation p. 2); "EFFECT (CC# 17)" (implementation p. 2);
  "ENV MOD X (CC# 12)" (implementation p. 2); "ENV MOD Y (CC# 13)" (implementation p. 2);
  "TUNING (CC# 104)" (implementation p. 2).

  **THE CHART AND THE MANUAL HAVE NO PAGE TO TURN TO**, being one sheet each, so what is cited
  from them is cited by document name; only the implementation is paginated, and its seven
  controller numbers are all on p. 2.

  **THE CHART IS READ BY COORDINATE AND NOT BY ITS TEXT ORDER.** The flat layer gives every
  number, then every transmitted mark, then every mark in the `Recognized` column, then every
  name, and comes to
  27 marks where fourteen rows need 28. The columns are at x=201 `Transmitted`, x=322
  `Recognized` and x=442 `Remarks`, measured from the heading row itself, and
  `Notes/4647_extract_tb_3.py` asserts all fourteen rows against that geometry.

  **WHAT THE MANUAL ALONE SETTLES** is the channel default and the clock source: "Specifies the
  MIDI transmit/receive channel." (manual), at "(default: C 2)" (manual), and `AUTO`, which
  means "If MIDI
  clock is being input to the MIDI IN connector or the USB port, the TB-3's tempo will
  automatically synchronize to MIDI clock." (manual).

  **THE MANUAL NAMES AFTERTOUCH AND THE CHART CROSSES IT IN ALL FOUR BOXES, AND BOTH ARE TRUE.**
  The manual carries a `Pad Aftertouch Sensitivity` setting that "Adjusts the sensitivity of the
  pad to pressure (aftertouch)." (manual), while the chart crosses key's and channel's,
  transmitted and recognised. Neither is wrong, because the resolution is in the controller
  table: **pad pressure leaves this instrument as controller 1**, `PAD Z`, and not as an
  aftertouch message. So the pad is pressure sensitive, `aftertouch` is `none`, and anybody who
  presses the pad and watches the wire still sees something move. A reader meeting the manual's
  sentence by itself would expect `aftertouch: channel` and be wrong, which is why it is here
  rather than only in a comment.

  **IT ANSWERS TO TWO MORE OCTAVES THAN IT PLAYS**, which is the one row on this chart where the
  two columns differ by more than a mark: `12-84` transmitted against `12-108` in the `Recognized` column, with
  the True Voice row struck through transmitted, and the remark "C0-C6 12-84" (chart).
  `note_range` carries the received span, because this field says what the instrument answers to.

  **AND IT HAS A PITCH BEND THAT NO FIELD HERE CAN HOLD.** The chart marks it in both columns and
  names the axis it comes from, "(XY PLAY) PAD X" (chart), so the bend is a finger position on a
  touch pad rather than a wheel - but no document gives a depth or says whether a depth can be
  set, so the `pitch_bend` block is left out entirely. `roland/tr_8` leaves it out for the
  opposite reason: its chart crosses pitch bend in all four boxes.

