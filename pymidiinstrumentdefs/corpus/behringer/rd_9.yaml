    retrieved: 2026-10-07
    # 29 sheets: the cover and the back are single pages and the 27 between carry two printed pages
    # each, so p. 51 is the right half of sheet 26. Made with InDesign on 2023-04-20. It names no
    # note, channel or controller; cited for its DUMP line and its specifications.
    page_offset: 1
    pages_per_sheet: 2
  product_page:
    kind: product_page
