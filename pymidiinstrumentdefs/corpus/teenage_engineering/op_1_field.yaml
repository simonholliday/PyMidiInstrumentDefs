    # 79 pages, one more than the current edition. **Still linked from the same page as the
    # current one, behind a bare line break rather than behind any words**, which is why it was
    # found and why it is pinned: a reader following `download as PDF` gets the newer file and
    # a tool reading the markup may get either.
    # Cited because **its MIDI settings page is fuller than the current edition's**, naming an
