  inst_1_freq:                            {label: Inst 1 Freq, cc: 66, group: sample_playback}
  inst_1_fine_tune:                       {label: Inst 1 Fine Tune, cc: 67, group: sample_playback}
  inst_1_level:                           {label: Inst 1 Level, cc: 68, group: sample_playback}
