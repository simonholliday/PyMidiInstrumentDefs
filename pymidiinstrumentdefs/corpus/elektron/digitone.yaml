  syn1_ratio_c_offset:    {label: Ratio C Offset, nrpn: 223, part: synth, group: syn1}
  syn1_ratio_a_offset:    {label: Ratio A Offset, nrpn: 224, part: synth, group: syn1}
  syn1_ratio_b1_offset:   {label: Ratio B1 Offset, nrpn: 225, part: synth, group: syn1}
  syn1_ratio_b2_offset:   {label: Ratio B2 Offset, nrpn: 226, part: synth, group: syn1}

  # B.3 FM PARAMETERS, SYN2 ─────────────────────────────────────────────────
  syn2_a_env_attack:      {label: A Env Attack, cc: 75, nrpn: 208, part: synth, group: syn2}
  syn2_a_env_decay:       {label: A Env Decay, cc: 76, nrpn: 209, part: synth, group: syn2}
  syn2_a_env_end:         {label: A Env End, cc: 77, nrpn: 210, part: synth, group: syn2}
  syn2_a_level:           {label: A Level, cc: 78, nrpn: 211, part: synth, group: syn2}
  syn2_b_env_attack:      {label: B Env Attack, cc: 79, nrpn: 212, part: synth, group: syn2}
  syn2_b_env_decay:       {label: B Env Decay, cc: 80, nrpn: 213, part: synth, group: syn2}
  syn2_b_env_end:         {label: B Env End, cc: 81, nrpn: 214, part: synth, group: syn2}
  syn2_b_level:           {label: B Level, cc: 82, nrpn: 215, part: synth, group: syn2}
  syn2_a_delay:           {label: A Delay, cc: 83, nrpn: 216, part: synth, group: syn2}
  syn2_a_trig:            {label: A Trig, cc: 84, nrpn: 217, part: synth, group: syn2}
  syn2_a_env_reset:       {label: A Env Reset, cc: 85, nrpn: 218, part: synth, group: syn2}
  syn2_b_delay:           {label: B Delay, cc: 86, nrpn: 219, part: synth, group: syn2}
  syn2_b_trig:            {label: B Trig, cc: 87, nrpn: 220, part: synth, group: syn2}
  syn2_b_env_reset:       {label: B Env Reset, cc: 88, nrpn: 221, part: synth, group: syn2}
  syn2_phase_reset:       {label: Phase Reset, cc: 89, nrpn: 222, part: synth, group: syn2}

  # B.4 FILTER PARAMETERS ───────────────────────────────────────────────────
  filter_frequency:       {label: Filter Frequency, cc: 23, lsb: 55, nrpn: 148, part: synth, group: filter}
  filter_resonance:       {label: Resonance, cc: 24, lsb: 56, nrpn: 149, part: synth, group: filter}
  filter_type:            {label: Filter Type, cc: 74, nrpn: 150, part: synth, group: filter}
