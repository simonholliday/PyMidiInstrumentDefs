# **THE DOCUMENT NAMED FOR THIS INSTRUMENT'S MIDI IS NOT WHERE ITS CONTROLLERS ARE, AND EIGHT
# ROLANDS HAD TAUGHT THE OPPOSITE.** The `JUPITER-X/Xm MIDI Implementation` runs to 90 sheets and
# names 35 controller numbers, of which **22 are controls** and every one of those is a standard
# performance control - modulation, volume, the pedals, the eight filter and envelope offsets. The
# tone parameters are somewhere else entirely: **the Parameter Guide carries a `CC#` column on
# nine of its 75 sheets, one table per model**, holding 156 more rows over 46 distinct numbers.
#
# `roland/jd_xi` at rank 94 cited its Parameter Guide **for an absence** - 51 sheets, 31,811 words
# and not one controller number - precisely because on that instrument the implementation held
# everything. Here the same two documents, from the same maker, divide the work the other way
# round. **So rank 94's lesson was about the JD-Xi and not about Roland**, which is the same
# correction `erica_synths/hexdrums` forced one rank later about its own maker. Two instruments by
# one maker are not a habit, and this is the second rank running to say so.
#
# **AND THE SAME NUMBER MEANS DIFFERENT THINGS DEPENDING ON A SETTING RATHER THAN ON A CHANNEL,
# WHICH IS WHY THOSE 156 ROWS ARE NOT CARRIED BELOW.** A part is loaded with one of the models -
# "Seven types are provided: JUPITER-8, JUNO-106, JX-8P, SH-101, XV- 5080, RD (Piano), and
# VOCODER." (reference p. 61) - and each has a tone table of its own. **21 of the 46 numbers name
# more than one parameter across those tables**: CC 3 is `CUTOFF` on one model and `FILTER FREQ`
# on another, CC 16 is `OSC1 LEVEL` or `PW LEVEL`, CC 18 is one of `OSC3 LEVEL`, `SUB LEVEL` or
# `SUB OSC LEVEL`.
#
# That is **not** the collision the `part` field exists for. `elektron/tonverk` expands its
# per-kind map because a track's kind decides which channel reaches it, so a part holds the fact.
# Here every part takes any model - "Other models can be used with parts 1-4." (reference p. 61) -
# so the meaning turns on what somebody loaded, not on where the message arrived. **No field holds
# that**, and carrying the rows anyway would assert that CC 3 is `CUTOFF` on an instrument whose
# part might be holding a JUNO-106, which is false. So the figures are recorded here and the
# format gap is raised rather than papered over.
#
# **A WHOLE FURTHER MAP IS IN A MODEL EXPANSION, AND IT IS ADDRESSED PER PARTIAL.** The JD-800
# Model Expansion prints a `List of supported CCs` (jd_800 p. 14) whose columns are partials 1 to
# 4 - sixteen parameters over four columns, so `LFO1:Rate` is CC 29, 20, 22 and 23 depending on
# which partial it reaches. A third axis again, in a twelfth document, for a model somebody buys
# separately.
#
# WHAT THE IMPLEMENTATION DOES SETTLE IS THE DIRECTION OF EVERY ONE OF ITS 22, because it prints
# reception and transmission as two separate halves rather than as a chart's two columns. **One
# control is transmitted and never received** - `Foot Type`, CC 4 - and fifteen are received and
# never transmitted. The Fantom's definition at rank 77 records the same maker's same list with no
# direction on any control; this one records all three cases, because the halves are what the
# document has instead of a chart.
#
# **AND THERE IS NO CHART IN ANY OF THE ELEVEN DOCUMENTS.** No `MIDI Implementation Chart`
# heading, no Basic Channel row, no True Voice row, on any of the 377 sheets. That is why `mode` is
# unrecorded: the Mode row is where it would have come from.

definition: 1

model:
  manufacturer: Roland
  name: JUPITER-X
  # **`3.0 and later`, WHICH IS WHAT TEN OF THE ELEVEN DOCUMENTS SAY RATHER THAN A VERSION THE
  # INSTRUMENT REPORTS.** The owner's manual states it plainly - "This Owner's Manual explains the
  # basic operations of the JUPITER-X (Ver. 3.0 and later)." (owners_manual p. 1) - and so does
  # every title on the downloads page. **The implementation's own version is a different number**:
  # its first sheet reads `Date: Apr 19, 2022 Version: 1.06`, which is the document's revision and
  # not the firmware's, and the file is served as `eng06` to match. So a reader comparing the two
  # is comparing a firmware floor with a document revision.
  # The keyboard is 61 keys - "Roland JUPITER-X: Synthesizer Keyboard 61 Keys (semi-weighted
  # keyboard and channel aftertouch)" (owners_manual p. 4) - and the Xm is the same engine in a
  # 37-key box, which is why ten of the eleven documents are titled for both.
  firmware: "3.0"
  # Checked 2026-10-06.

source: >-
  **ELEVEN ENGLISH DOCUMENTS, 377 SHEETS, AND THE TWO THAT MATTER DIVIDE THE WORK THE OPPOSITE WAY
  ROUND FROM THIS MAKER'S LAST INSTRUMENT HERE.** See the comment above the definition. Every one
  of the eleven was opened and searched, because rank 89 cost a corrected definition for reading
  the document whose name promised the map and not the one that held it.

  WHAT IS IN EACH, WHICH IS THE POINT OF LISTING THEM. The `MIDI Implementation` (90 sheets) holds
  the 22 controls below, the system exclusive address map and nothing about the tone parameters.
  The `Parameter Guide` (75) holds the per-model tone tables, every `Rx` switch, and the system
  MIDI settings this definition's clock rests on. The `Reference Manual` (65) holds the models,
  the parts and the polyphony. The `Owner's Manual` (31) holds the specification. **The other
  seven name no controller at all except the JD-800 expansion**, which names a map of its own:
  `Sound List` (61), `Editor Owner's Manual` (14), `JD-800 Model Expansion` (19), `Vocal Designer
  Model Expansion` (13), `SOUND PACK/WAVE EXPANSION Install Manual` (4), `Roland Cloud Connect
  Setup Manual` (3) and `MainStage Profile Usage Guide` (2).

  **THE IMPLEMENTATION CONTRADICTS ITSELF ABOUT NRPN, SO `nrpn` IS LEFT EMPTY RATHER THAN SET TO
  `none`.** Three of its sentences treat NRPN as something this instrument holds: Data Entry is
  "the value of the parameter specified by RPN/NRPN" (implementation p. 1), RPN null sets both RPN
  and NRPN to `unspecified` (implementation p. 3), and Reset All Controllers resets
  "NRPN unset; previously set data will not change" (implementation p. 4). **And the enumeration
  that gives every controller number it receives gives no 98 and no 99**, which are the only way
  to select an NRPN parameter, and no NRPN parameter list exists anywhere in 90 sheets. A
  document that says a thing twice and does not agree gets neither statement carried, and the
  disagreement written down instead - which is the rule `novation/peak` and
  `novation/circuit_tracks` established for `default` and which has not been applied to this field
  before.

  AND IT CONTRADICTS ITSELF ABOUT ITS OWN MODEL ID, WHICH CHANGES NOTHING AND IS WORTH KNOWING.
  Its prose says "The model ID of the exclusive messages used by this instrument is 00H 00H 00H
  65H." (implementation p. 5) and the two byte tables on that same sheet both gloss the fourth
  byte as `52H model ID #4`, where the identical table in the transmission half reads `65H`
  (implementation p. 7) and the worked checksum example sends `F0 41 10 00 00 00 65 12`
  (implementation p. 90). **Three statements say 65H and two say 52H**, so the two are the misprint
  - which a consumer needs only because a sysex implementer reading sheet 5 alone would address a
  device that is not there.

  NOT RECORDED: the mode, there being no chart in any of the eleven documents to carry a Mode row.
  The transport, which **no document mentions in any spelling** - the implementation's System
  Realtime sections hold Active Sensing and nothing else in either direction, `F8H`, `FAH`, `FBH`
  and `FCH` appear on none of its 90 sheets, and the `START/STOP` in the reference manual is a
  function assignable to a pedal (reference p. 52) rather than a message. And the polyphony as a
  number, for the reason the maker gives.

