    sha256: 84a5ed74373fb3d58bb0afa639a3af89fa7bdb2334ef75087f3a0497a3cceb71
    retrieved: 2026-10-02
    # 117 pages, and printed page + 6 = file page. THE CHART ITSELF CARRIES A VERSION, "Version:
    # 3.1.0", dated January 17 2023 - which is the chart's own and not the instrument's, for the
    # reason in the model block above. It is recorded here so that a later chart can be told
    # from this one.
    page_offset: 0
  chart:
    kind: midi_implementation
    title: "opsix MIDI Implementation Chart, decoded"
    edition: Version 3.1.0
    dated: 2023-01-17
    landing: "https://www.korg.com/us/support/download/product/0/946/"
    url: "https://cdn.korg.com/us/support/download/files/dc109944c32fd473b555fee28318cf8d.pdf?response-content-disposition=inline%3Bfilename%2A%3DUTF-8%27%27opsix_OM_E6.pdf&response-content-type=application%2Fpdf%3B"
    sha256: 53c89b1767d1fd43afb9b47667a1a7981adbbb4ead8b21a3133022c7e94d1836
    retrieved: 2026-10-02
    paginated: false
    # THE CHART IS PAGE 116 OF THE MANUAL ABOVE, AND THAT PAGE CANNOT BE SEARCHED. Its fonts
    # carry no usable character map, so its text comes back 29 below the characters it draws
    # and no tool reading the PDF can find a number on it. So the page is cited through a
    # rendering of itself: `Notes/4195_extract_opsix_chart.py` decodes the offset, orders the
    # pieces as they are drawn, and writes exactly this file. Rebuilding it reproduces these
    # bytes, which is the same answer this project already gives for a web page - the HTML is
    # saved and the visible text is what gets cited.
    # The url above is the manual's, because that is where these bytes come from; the hash is
    # the rendering's.
  property_exchange:
    kind: midi_implementation
    title: opsix Property Exchange MIDI Implementation
    edition: Version 1.0
    dated: 2025/9/9
    landing: "https://www.korg.com/us/support/download/product/0/946/"
    url: "https://cdn.korg.com/us/support/download/files/19c0e8d14aa1d8fbbc90b4e7e86ac4ba.txt"
    sha256: 7ad281f10a4228f2c3bcaca3d65889e18f2a4cd325d794aea235428063870dee
    retrieved: 2026-10-02
    paginated: false
    # CITED FOR WHAT IT IS NOT. Korg calls this a MIDI implementation and it holds no controller
    # number at all: it is the MIDI-CI Property Exchange layer, which is why the chart in the
    # manual is the source for every number below. The same maker's file of that name for the
    # minilogue xd is a control-change map, so the title means two different things on two of
    # Korg's own pages.
  download_page:
    kind: download_page
    title: opsix mk II downloads
    landing: "https://www.korg.com/us/support/download/"
    url: "https://www.korg.com/us/support/download/product/0/946/"
    sha256: 8e164fdfbeb77ec7f1e9c0b7ee7994a008af4d17d91bda6950c3fb95cfc9aa04
    retrieved: 2026-10-02
    paginated: false
    # Cited for what Korg publishes and does not: manuals, the Property Exchange files, a quick
    # start guide, and no OS file and no release notes. The system reaches this instrument
    # through the Korg System Updater, which has its own manual on this page.

midi:
  # "Basic Channel: Default 1-16, Changed 1-16", both transmitted and recognised, remarked
  # "Memorized" (chart).
  channels: [1, 16]
  # The chart's recognised Mode default is 3, which is omni off and poly, and it marks mode
  # messages as neither transmitted nor recognised.
  mode: 3
  # "System Real Time: Clock" is marked both ways (chart).
  clock: both
  # "System Real Time: Commands" is marked both ways (chart) - the start, stop and continue
  # messages. The manual gives the setting that governs it from each side: "Rx Transport: Sets
  # whether start and stop messages (which are MIDI real-time messages) will be received" and
  # "Tx Transport" for the other direction (p. 41).
  transport: both
  program_change:
    receives: true
    sends: true
    # "500 (350 preset programs and 150 user programs as the factory-set default)" (p. 106),
    # reached by bank select, which is controller 0 and 32 below. The chart gives 0 to 99 in
    # both columns and "True Number 0-99" (chart), so one program change reaches a hundred of
    # them. **The count is what the instrument holds, not what one program change reaches**,
    # which is the rule every other definition here follows and a test now states.
    presets: 500
  # The chart marks system exclusive both ways, with the footnote "Supports universal system
  # exclusive messages device inquiry, master volume, master fine tuning, and master coarse
  # tuning", and a second one: "Supports MIDI 2.0 Property Exchange" (chart). The file Korg
  # publishes about that layer is cited above.
  sysex: true
  # NOT RECORDED: NRPN. The chart has no NRPN row, and neither the manual nor the Property
  # Exchange file uses the word anywhere. That is silence rather than a checked absence.

voice:
  addressing: pitches
  # "Note Number 0-127" transmitted and recognised, and "True voice 0-127" recognised (chart),
  # which is the chart saying it will sound every note it will accept.
  note_range: [0, 127]
  # "opsix: 32 voices (the maximum number of voices depends on the settings)" (p. 105). The
  # same page gives the SE and the module 80, which is why this definition is the opsix alone.
  polyphony: 32
  velocity:
    # "Note On O 9n, V=1-127" both ways, and "Note Off O 8n, V=1-64" transmitted against
    # "O 8n, V=0-127" recognised, remarked "Received Note Off Velocity values are clipped at
    # 64" (chart). So release velocity is both sent and received, which is rare enough to be
    # worth saying: the specifications call the keyboard "velocity and release-velocity
    # sensitive" (p. 105).
    note_on: received
    note_off: true
  # BOTH KINDS ARE RECOGNISED AND NEITHER IS SENT ON THIS MODEL. A setting chooses which kind
  # reaches the sound, and the chart's footnote gives sending to the SE alone. See the source
  # account.
  aftertouch: both
  aftertouch_transmits: false
  # NOT RECORDED: THE PITCH BEND RANGE. The chart marks pitch bend as travelling both ways and
  # gives no span, and no page of the manual puts a number of semitones on it.
