definition: 1

model:
  manufacturer: Moog Music
  name: Matriarch
  # Moog publishes no firmware version on any page it serves - its downloads list is built in
  # the browser - and publishes one inside every firmware package. The package for this
  # instrument carries "MATRIARCH FIRMWARE UPDATE V1.3.0 December 2022", which is the newest
  # Moog offers (checked 2026-10-01), and its release notes are what settle the question:
  # "CC 94 added to allow switching voice modes over MIDI", under CHANGES SINCE V1.2.3.
  # THE MANUAL'S OWN CHART CARRIES CC 94, so the manual describes firmware 1.3.0 or later, and
  # this definition describes 1.3.0. That is a conclusion from the maker's two documents rather
  # than from a date: the manual states no version at all, and the edition read here was fetched
  # in 2026 while 1.3.0 shipped in 2022.
  # The same notes say what 1.3.0 and the releases before it changed about MIDI, and two of
  # those changes are recorded against the controls they touch: CC 106 and CC 73.
  firmware: "1.3.0"

source: >-
  User manual (88pp), pp. 5, 9-10, 31-32, 50-51, 54, 57-59, and the MMA v2 MIDI
  implementation chart at pp. 70-74. The control-change map is the manual's own
  table at pp. 73-74, whose columns are Parameter | CC Number (MSB) | CC Number
  (LSB) | Values. Band boundaries below are quoted from that table.
  AND THE FIRMWARE v1.3.0 UPDATE DOCUMENT, five pages, published inside the firmware
  package rather than beside it, cited for the firmware this definition describes and for two
  numbers the manual does not settle:
  CC 106 IS IN NEITHER THE CHART NOR THE MANUAL. The notes say "Arp/Sequencer Gate Length can
  be adjusted using MIDI CC 106. Value 64 = 50% gate length (default)", under CHANGES SINCE
  V1.2.0 on the notes' own p. 3, where the manual's chart gives Arp Gate Length as CC 15 with a fine half at CC 47.
  Two of the maker's own documents give two numbers for what reads as one parameter, and both
  are recorded, each saying what the other says.
  CC 73 IS RECEIVED AND NOT SENT, which the chart does not distinguish: "Arp/Seq PLAY button
  does not output MIDI CC 73 (can still respond to it if necessary)", under the same section,
  with the reason "Improves compatibility with other Grandmother/Matriarchs".
  READ THOSE NOTES' HEADINGS CAREFULLY. Every change list in them is headed by the version it
  is changes SINCE - "CHANGES SINCE V1.2.3", "CHANGES SINCE V1.2.0" - and never by the version
  it shipped in, and the document names no v1.2.1 at all. So only two things in it can be
  attributed outright: the first list, which is 1.3.0's because these are 1.3.0's notes, and the
  known issues, whose heading says "AS OF V1.3.0". Everything cited here gives the heading it
  sits under rather than a version it arrived in, CC 106 and CC 73 included.
  Also in those notes, and recorded against the fields they touch rather than as controls: the
  clock's pulses-per-quarter-note default changed from 2 to 4; the MIDI clock output default
  changed to off; and the instrument "no longer outputs unexpected streams of MIDI CC/NRPN
  data", which is a fault in firmware before this one rather than a feature of it. That line is
  also the only place either document mentions NRPN, and it gives no NRPN number.
  ONE PROMISE THOSE NOTES DO NOT KEEP: "Can now edit global settings via MIDI SysEx messages
  (documented below)", and nothing below documents one. Their remaining pages describe reaching
  the global settings from the keyboard, and no system exclusive message, byte or template
  appears anywhere in them. So `sysex: true` below still rests on the manual, as it always did,
  and this instrument's SysEx interface is documented somewhere Moog has not published here.
  AND ONE KNOWN ISSUE WORTH A READER'S TIME: the notes' KNOWN OUTSTANDING ISSUES AS OF V1.3.0
  include "Send Program Change - Seems to have no effect". This definition records program
  change as received and says nothing about sending, which agrees with that.
  NOT RECORDED, and marked in place: the power-on default for the voice mode
  switch.

sources:
  manual:
    kind: manual
    title: Matriarch Manual
    landing: "https://www.moogmusic.com/downloads/?product=Matriarch&type=User+Manual"
    url: "https://cdn.inmusicbrands.com/Moog/Matriarch/Matriarch_Manual_012023.pdf"
    sha256: f27e2f69bf117b00363d78466436e5a04d3f1b271e81e65c7de6f63d8349bb36
    retrieved: 2026-09-13
    # Moog now serves a later 92-page edition at this address, and the facts below were read
    # from the 88-page edition whose sha256 is above. **No number here depends on which of the
    # two you read**: both editions' chart pages print exactly the same controller numbers,
    # compared as sets in both pypdf readings on 2026-10-01, and every number this definition
    # carries is on the newer chart too. What moved is the page geometry - the chart is on the
    # newer file's pp. 74-75 where it is on pp. 73-74 here - which is why a citation has to name
    # its document and not only its page. The newer edition is in the library beside this one,
    # cited by nothing, so that the comparison can be checked.
  release_notes:
    kind: release_notes
    title: Matriarch Firmware Update V1.3.0
    edition: "V1.3.0"
    dated: "2022-12"
    landing: "https://www.moogmusic.com/downloads/?product=Matriarch&type=Firmware%20Update"
    url: "https://cdn.inmusicbrands.com/Moog/Matriarch/Matriarch%20Firmware%20v1.3.0.zip"
    sha256: 9b0eb2f48e65253890abd784e7e52a993173eedfb9675d243d4b5b73df18f15a
    retrieved: 2026-10-01
    page_offset: 0
    # The sha256 is of the update document itself, which is a member of the zip at the url
    # above rather than a file Moog serves on its own: "Matriarch Firmware v1.3.0/
    # Matriarch_V1.3.0_Firmware_Update_120522.pdf". The zip hashes to
    # 44137eda026c87e36f33a004547095887143a66d8c591753416ff95ceeab883f, and re-extracting that
    # member reproduces the cited bytes, which was asserted rather than assumed.
    # The document prints "December 2022" and no day, which is what `dated` carries. Its file
    # name carries 120522, which reads as 5 December 2022 and agrees with the month; that is an
    # inference from a file name rather than something the maker printed, so it stays here.
    # Five pages printing no page numbers, so it is cited by its own section headings:
    # CHANGES SINCE V1.2.3, CHANGES SINCE V1.2.0 and KNOWN OUTSTANDING ISSUES AS OF V1.3.0
    # carry everything this definition takes from it, and CC 106 is on the file's p. 3.

midi:
  # 1-16 is what it can be set to. Which one yours is on belongs to your
  # composition, not here.
  channels: [1, 16]
  clock: both
  # Start and Stop travel both ways; Continue is recognised but not
  # transmitted. The format has one field, so the asymmetry is recorded here.
  transport: both
  program_change:
    receives: true
    presets: 12          # "Selects saved sequences"
  nrpn: none             # chart section 1: NRPNs not supported
  sysex: true            # transmitted and recognised, but undocumented by Moog

voice:
  addressing: pitches
  note_range: [0, 127]
  # Voicing is a three-position front-panel switch AND is settable over MIDI at
  # CC 94, so there is no single number that is true. The manual gives no
  # power-on default, so this stays unknown rather than guessed: see
  # voicing_modes for what it can be, and paraphony_voice_mode for how to change
  # it while playing.
  polyphony: null
  paraphonic: true
  voicing_modes: [1, 2, 4]
  velocity:
    note_on: received
    note_off: false
  aftertouch: channel
  pitch_bend:
    programmable: true   # RPN 00 pitch bend sensitivity is recognised

groups:
  # What Moog itself calls each module, from the headings of FEATURES & CONTROLS, which walks
  # the panel module by module: KEYBOARD p. 10, GLIDE and OSCILLATORS p. 13, MIXER p. 17 with
  # NOISE under it p. 18, FILTERS p. 20, ENVELOPE GENERATORS (ADSR) p. 25, PARAPHONY p. 31,
  # STEREO DELAY p. 32, MODULATION p. 36, ARP / SEQ p. 44. The words are the maker's; the
  # capitals are the document's own styling on every heading it prints and are not reproduced.
  # The order is the order the chart lists the controls, which is the order they appear below,
  # and not the order the modules sit on the panel.
  modulation: Modulation
  glide: Glide
  # The chart names every row in this group "Arp ...", and the module they belong to is headed
  # ARP / SEQ: one rate, one gate length and one play button serve the arpeggiator and the
  # sequencer alike, which is also why the release notes call CC 106 Arp/Sequencer Gate Length.
  arpeggiator: Arp / Seq
  # Printed under MIXER rather than as a module of its own.
  noise: Noise
  delay: Stereo Delay
  oscillator: Oscillators
  keyboard: Keyboard
  # The panel switch this sets is headed PARAPHONY, p. 31.
  voicing: Paraphony

controls:

  # ── 14-bit pairs ──────────────────────────────────────────────────────────
  # Twelve controls the manual pairs explicitly, each "MIN TO MAX (0 TO 16383)".
  # Sending the coarse number alone is still a legal 7-bit message.

  mod_wheel:
    label: Mod Wheel
    cc: 1
    lsb: 33
    range: [0, 16383]
    group: modulation
  mod_rate:
    label: Mod Rate
    cc: 3
    lsb: 35
    range: [0, 16383]
    group: modulation
  glide_time:
    label: Glide Time
    cc: 5
    lsb: 37
    range: [0, 16383]
    group: glide
  arp_rate:
    label: Arp Rate
    cc: 8
    lsb: 40
    range: [0, 16383]
    group: arpeggiator
  noise_filter_cutoff:
    label: Noise Filter Cutoff
    cc: 9
    lsb: 41
    range: [0, 16383]
    group: noise
  delay_time:
    label: Delay Time
    cc: 12
    lsb: 44
    range: [0, 16383]
    group: delay
  delay_spacing:
    label: Delay Spacing
    cc: 13
    lsb: 45
    range: [0, 16383]
    group: delay
  arp_swing:
    label: Arp Swing
    cc: 14
    lsb: 46
    range: [0, 16383]
    group: arpeggiator
  arp_gate_length:
    label: Arp Gate Length
    cc: 15
    lsb: 47
    range: [0, 16383]
    group: arpeggiator
    # The maker gives this parameter a second number, and only in its release notes: see
    # arp_seq_gate_length on CC 106 below. Which one a Matriarch answers to, or whether both
    # reach the same setting, is not stated anywhere; both are recorded.
  osc_2_frequency:
    label: Osc 2 Frequency
    cc: 16
    lsb: 48
    range: [0, 16383]
    group: oscillator
  osc_3_frequency:
    label: Osc 3 Frequency
    cc: 17
    lsb: 49
    range: [0, 16383]
    group: oscillator
  osc_4_frequency:
    label: Osc 4 Frequency
    cc: 18
    lsb: 50
    range: [0, 16383]
    group: oscillator

  # ── Switches ──────────────────────────────────────────────────────────────
  # All written "0-63 = OFF, 64-127 = ON" in the manual's table.

  sustain_pedal:
    label: Sustain Pedal
    cc: 64
    values: {"off": 0, "on": 64}
    group: keyboard
  glide_on:
    label: Glide On
    cc: 65
    values: {"off": 0, "on": 64}
    group: glide
  arp_latch:
    label: Arp Latch
    cc: 69
    values: {"off": 0, "on": 64}
    group: arpeggiator
  arp_play:
    label: Arp Play
    cc: 73
    direction: receives
    values: {"off": 0, "on": 64}
    group: arpeggiator
    # The chart does not say which way a controller travels, and for this one the release notes
    # do: "Arp/Seq PLAY button does not output MIDI CC 73 (can still respond to it if
    # necessary)", with the reason "Improves compatibility with other Grandmother/Matriarchs".
    # So it is answered to and not transmitted, from the firmware that changed it onwards.
  hard_sync_enable:
    label: Hard Sync Enable
    cc: 80
    values: {"off": 0, "on": 64}
    group: oscillator
  osc_2_sync:
    label: Osc 2 Sync
    cc: 81
    values: {"off": 0, "on": 64}
    group: oscillator
  osc_3_sync:
    label: Osc 3 Sync
    cc: 82
    values: {"off": 0, "on": 64}
    group: oscillator
  osc_4_sync:
    label: Osc 4 Sync
    cc: 83
    values: {"off": 0, "on": 64}
    group: oscillator
  gated_glide:
    label: Gated Glide
    cc: 86
    values: {"off": 0, "on": 64}
    group: glide
  legato_glide:
    label: Legato Glide
    cc: 87
    values: {"off": 0, "on": 64}
    group: glide
  delay_ping_pong:
    label: Delay Ping Pong
    cc: 88
    values: {"off": 0, "on": 64}
    group: delay
  delay_sync:
    label: Delay Sync
    cc: 89
    values: {"off": 0, "on": 64}
    group: delay
  multi_trig:
    label: Multi Trig
    cc: 95
    values: {"off": 0, "on": 64}
    group: keyboard

  # ── Choices with quoted bands ─────────────────────────────────────────────

  osc_1_octave:
    label: Osc 1 Octave
    cc: 74
    values: {sixteen_foot: 0, eight_foot: 32, four_foot: 64, two_foot: 96}
    group: oscillator
  osc_2_octave:
    label: Osc 2 Octave
    cc: 75
    values: {sixteen_foot: 0, eight_foot: 32, four_foot: 64, two_foot: 96}
    group: oscillator
  osc_3_octave:
    label: Osc 3 Octave
    cc: 76
    values: {sixteen_foot: 0, eight_foot: 32, four_foot: 64, two_foot: 96}
    group: oscillator
  osc_4_octave:
    label: Osc 4 Octave
    cc: 77
    values: {sixteen_foot: 0, eight_foot: 32, four_foot: 64, two_foot: 96}
    group: oscillator

  glide_type:
    label: Glide Type
    cc: 85
    # "0-42 = LCR, 43-84 = LCT, 85-127 = EXP." - the Minitaur's glide type with
    # the same boundaries and the same option names.
    values: {lcr: 0, lct: 43, exp: 85}
    group: glide

  square_lfo_polarity:
    label: Square LFO Polarity
    cc: 90
    values: {unipolar: 0, bipolar: 64}
    group: modulation

  paraphony_voice_mode:
    label: Paraphony Voice Mode
    cc: 94
    # The front-panel voicing switch, reachable over MIDI: a panel can move this
    # instrument between monophonic and four-note paraphonic while it plays.
    values: {one_voice: 0, two_voice: 43, four_voice: 85}
    group: voicing

  # From the release notes and not from the chart. "Arp/Sequencer Gate Length can be adjusted
  # using MIDI CC 106. Value 64 = 50% gate length (default)", under CHANGES SINCE V1.2.0. The
  # manual's own chart gives Arp Gate Length as CC 15 with a fine half at 47 and does not
  # mention CC 106; this entry and that one each point at the other.
  arp_seq_gate_length:
    label: Arp/Sequencer Gate Length
    cc: 106
    default: 64
    # 64 is what the notes call 50% gate length and the default. They give no other value and
    # no band boundaries, so nothing else is claimed: this is a continuous control whose one
    # documented point is its middle.
    group: arpeggiator

  kb_octave:
    label: KB Octave
    cc: 105
    values: {minus_2: 0, minus_1: 26, zero: 51, plus_1: 77, plus_2: 102}
    group: keyboard

  # ── Arpeggiator choices ───────────────────────────────────────────────────
  # All three quoted from the table at p. 74.

  arp_mode:
    label: Arp Mode
    cc: 91
    # "0-42 = ARP, 43-84 = SEQ, 85-127 = REC"
    values: {arp: 0, seq: 43, rec: 85}
    group: arpeggiator
  arp_pattern:
    label: Arp Pattern
    cc: 92
    # "0-42 = ORDER, 43-84 = FW/BW, 85-127 = RANDOM"
    values: {order: 0, fw_bw: 43, random: 85}
    group: arpeggiator
  arp_range:
    label: Arp Range / Bank
    cc: 93
    # "0-42 = 1, 43-84 = 2, 85-127 = 3" - the manual labels it Arp Range / Bank
    # and names its states only by number.
    values: {one: 0, two: 43, three: 85}
    group: arpeggiator
