  # MPE ─────────────────────────────────────────────────────
  # THE ONE CONTROL THE CHART DOES NOT CARRY, and the only number this instrument answers to that
  # the PolyBrute's map has not got. It is the MPE third dimension, named in the aftertouch tables
  # and in the MPE section: "Aftertouch and Slide (CC74) MIDI data are routed differently into the
  # modulation lanes according to your selected aftertouch mode, or if you have enabled or not the
  # MPE" (manual p. 106), and "Slide (CC74) is routed depending on the Aftertouch mode selected"
  # (manual p. 118). **Where it lands is a setting, not a fixed destination**: the MPE IN table at
  # p. 107 routes it to the `Z` modulation lane in four of the five aftertouch modes and to
  # `Aftertouch` in FullTouch Envelope.
  # Both ways, by the same sentences as the rest: it is received per note when MPE is on, and
  # "When sending MPE, PolyBrute 12 sends mono aftertouch (Channel Pressure) and Slide (CC74) on
  # multiple channels (one per note)" (manual p. 118). So no `direction` - the format's default is
  # what this is.
  slide:                       {label: Slide, cc: 74, group: mpe}
