    sha256: a006bb0f7c66dbff89c4c83c75ca0e1760b9957a0436a420e276cd562c2d77f2
    retrieved: 2026-10-02
    paginated: false
    # The maker's own spacing in the title - "micro KORG" - is reproduced rather than tidied.
    # The download page dates this file 2016.01.08, which is when Korg last posted it; the
    # document dates itself 2002.06.27, and that is what is recorded here.
  manual:
    kind: manual
    title: microKORG Owner's Manual
    edition: E 2
    landing: "https://www.korg.com/us/support/download/product/0/104/"
    url: "https://cdn.korg.com/us/support/download/files/8f226053113b3be59753dcce14e74cca.pdf?response-content-disposition=inline%3Bfilename%2A%3DUTF-8%27%27microKORG_OM_E2.pdf&response-content-type=application%2Fpdf%3B"
    sha256: cd033d4378c130bd31732a4706cceb65b3521cfeb49d1438f7c4bbb6742322b8
    retrieved: 2026-10-02
    page_offset: 6
    # 80 pages, counted with two readers that agree. `file` reports 19, because this PDF's
    # page tree is nested and `file` reports the first /Count it meets rather than the root's.
    # So the rule that every download is checked with `file` holds for what a file IS, and a
    # page count is worth taking from something that walks the tree.
  download_page:
    kind: download_page
    title: microKORG (2002) downloads
    landing: "https://www.korg.com/us/support/download/"
    url: "https://www.korg.com/us/support/download/product/0/104/"
    sha256: 0aa6f7e1bd2d50abd00efe48d0b0321ae37938d42c703cdabe396e5df20a3ace
    retrieved: 2026-10-02
    paginated: false
    # Cited for what Korg calls this instrument and for the absence of any firmware.
    # It also holds a trap worth knowing on this maker's site: the entry it labels
    # "Owner's Manual (Spanish)" is served as a file named microKORG_S.pdf. The S is Spanish.
    # Anything matching a file to a model by its name would file that as the microKORG S's.

midi:
  # "MIDI CH [1...16] Specifies the MIDI channel" (p. 51), and one channel is all there is:
  # see the source paragraph and the sentence quoted there from p. 67.
  channels: [1, 16]
  # BOTH, AND WHICH IT DOES IS A SETTING with three states, "CLOCK [Internal, External, Auto]"
  # (p. 51). The implementation agrees from each side: it transmits F8 "when the Clock is set
  # to Internal", and recognises F8 "when the Clock is set to External or Auto".
  clock: both
  # RECEIVES ONLY, and this is a checked absence rather than silence. The recognised realtime
  # messages are timing clock, start, stop and active sensing; the transmitted realtime
  # messages are timing clock and active sensing, and no more. So it will follow an incoming
  # start and stop - the arpeggiator does - and sends neither.
  transport: receives
  program_change:
    receives: true
    sends: true
    # "Programs: total 128 programs (A/B side x 8 banks x 8 programs)" (p. 67). There is no
    # bank select on this model, which is one of the two things the microKORG S adds.
    presets: 128
  # NUMBERS PER CONTROL, below, 29 of them.
  nrpn: supported
  # It answers a device inquiry with an identity reply naming Korg, the MS2000 series family
  # and member ID 11 for this model, and has system exclusive sections of its own in both
  # directions - current program dump, program write request and the rest. Of the universal
  # messages it supports master volume and master fine tuning (p. 55). Its own model ID is
  # "58: microKORG model ID (same as MS2000/MS2000R)" (p. 55), and the manual says the data
  # it will exchange with those is only "parameters that it shares" with them.
  sysex: true

voice:
  addressing: pitches
  # "Maximum polyphony: 4 voices" (p. 67), stated separately for synth programs and for
  # vocoder programs and the same for both. Two timbres can be layered and they draw on those
  # same four voices, which the manual shows as a table of what each voice assign mode leaves
  # the other timbre; it is one instrument on one channel, so there are no parts to share
  # between and `polyphony_shared` says nothing here.
  velocity:
    # "37 notes (mini keyboard, velocity sensitive, no aftertouch)" (p. 67), and the
    # recognised note on row is "Note On vv=1~127".
    note_on: received
    # "The note-off velocity is transmitted at a fixed 64, but is not received" (p. 52), which
    # is both halves of the question in one sentence.
    note_off: false
  polyphony: 4
  # NONE, AND CHECKED: the recognised channel messages enumerate what this instrument answers
  # to, and neither channel pressure nor polyphonic key pressure is among them. The
  # specifications say the same of the keyboard, "no aftertouch", so neither side of it exists.
  aftertouch: none
  pitch_bend:
    # "BEND RANGE [-12...12] Specifies the amount of pitch change in semitones that will occur
    # when the pitch wheel is operated" (p. 17). Twelve is as far as it will go; the negative
    # half of the setting makes the wheel bend the other way rather than reaching further.
    semitones: 12
    programmable: true
