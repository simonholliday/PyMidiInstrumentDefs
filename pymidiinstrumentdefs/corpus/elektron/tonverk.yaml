  # OUTSIDE THE APPENDIX ----------------------------------------
  # The four controllers carried from outside Appendix D, two that the manual numbers and two
  # that the release notes do, so they have no group of the maker's. The first two are
  # modulation sources the player routes to up to four parameters each (manual p. 52), among
  # settings for the audio tracks alone (manual p. 50). **They are two-way, for the track and
  # for no one machine**: a track with a sound machine answers to them, and with the MIDI
  # machine in its place it sends them, each off until switched on (manual pp. 98, 99). **The
  # two pedals are received only**: they rest on one line of the 1.3.0 notes (release_notes),
  # which says they are supported and not which tracks answer, and no page names either among
  # what a track sends. They are on the audio part as a reading. See the source account.
  audio_mod_wheel:                            {label: "MODULATION WHEEL", cc: 1, part: audio}
  audio_breath_controller:                    {label: "BREATH CONTROLLER", cc: 2, part: audio}
  audio_sustain_pedal:                        {label: "MIDI sustain pedal", cc: 64, part: audio, direction: receives}
  audio_sostenuto_pedal:                      {label: "MIDI sostenuto pedal", cc: 66, part: audio, direction: receives}
