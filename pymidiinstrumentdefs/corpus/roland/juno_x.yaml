midi:
  # `1-16` in both columns of the chart's Basic Channel rows, `Memorized` (implementation p. 92),
  # and "n = MIDI channel number: 0H - FH (ch.1 - ch.16)" (implementation p. 1) on the entries,
  # ten of which print it as `(ch.1 - 16)`.
  channels: [1, 16]
  # `Mode 3` as the default in both columns (implementation p. 92).
  mode: 3
  # Circled in both columns (implementation p. 92), each way by the Sync Mode setting; see the
  # account.
  clock: both
  # Commands crossed in both columns (implementation p. 92), and neither half has a start, a stop
  # or a continue.
  transport: none
  program_change:
    # Both ways, each behind switches: "Not received when the Rx PC parameter (SYSTEM: MIDI RX) is
    # OFF." (implementation p. 4), and sent "when Program or Tone is selected." (implementation
    # p. 9).
    receives: true
    sends: true
    # 128 to a bank: "pp = Program number: 00H - 7FH (prog.1 - prog.128)" (implementation p. 4).
    # The banks are what make the number large; the bank select table is on the first sheet.
    presets: 128
  # `98,99` crossed in both columns, "NRPN LSB,MSB" (implementation p. 92); see the account.
  nrpn: none
  # Marked in both columns (implementation p. 92); see the account.
  sysex: true

parts:
  part:
    label: Part
    count: 4
    # A channel of its own setting, which serves for sending as well when Tx Mode is on
    # (parameter_guide p. 5).
    channel: assigned
    addressing: pitches
    receives: [notes, controls, program_change]
    # What a part is, on this instrument, is a model somebody chose; see the account.
  drum:
    label: Part R
    count: 1
    channel: assigned
    # Its notes name drums: "No, a drum kit can be used only with part R." (reference p. 53).
    addressing: voices
    receives: [notes, controls, program_change]

voice:
  addressing: pitches
  # `0-127` in both columns of the chart's Note Number row, and a True Voice of `0-127`
  # (implementation p. 92).
  note_range: [0, 127]
  # NOT RECORDED AS A NUMBER, AND THE MAKER SAYS WHY: "It differs depending on the type and
  # combination of models." (reference p. 53), with two figures and neither a ceiling for the
  # instrument: "The JUNO-X model has a maximum polyphony of 16 notes." (reference p. 53) and, of
  # PCM sounds, "up to 256 notes (for MONO) can be produced." (reference p. 53). The pool is
  # shared: each part has a reserve, "Specifies the number of voices reserved for each part when
  # the performance exceeds the maximum polyphony." (parameter_guide p. 4).
  polyphony_shared: true
  velocity:
    # Note on and note off circled in both columns (implementation p. 92).
    note_on: both
    note_off: true
  # Key's and Channel's both recognised, each selectable; Channel's is sent and Key's is not
  # (implementation p. 92), from a keyboard with channel aftertouch (reference p. 56).
  # `roland/jupiter_x` answers to both kinds as well, and recorded `poly`, the stronger of the
  # two, until 2026-10-12; both files now use the word for both.
  aftertouch: both
  aftertouch_transmits: true
  pitch_bend:
    # Both ways (implementation p. 92). The range is a setting of each of the four parts, `0–24,
    # TONE`, marked `Part 1–4 only` (parameter_guide p. 4), so Part R has none; the first
    # registered parameter sets it: "mm: 00H - 18H (0 - 24 semitones)" (implementation p. 4).
    programmable: true

groups:
  continuous: Continuous controllers
  general: General purpose controllers
  switch: Switches and pedals
  sound: Sound controllers
  effects: Effect send levels

controls:

  # **NO CONTROL HERE STATES A DIRECTION.** Twenty-nine numbers have a heading in both halves of
  # the implementation. Four, 75 to 78, have one under reception alone, and the chart, the address
  # map and the transmission half's General Controller say they are sent as well. See the account.
  # **EACH NUMBER IS HERE ONCE FOR THE FOUR PARTS, AS `part_`, AND ONCE FOR PART R, AS `drum_`**,
  # but for the seven Part R does not receive.

  # Bank select ───────────────────────────────────────────
  # "Bank Select (Controller number 0, 32)" (implementation p. 1) under reception and again under
  # transmission (implementation p. 7). On a part's channel it chooses a tone or a kit.
