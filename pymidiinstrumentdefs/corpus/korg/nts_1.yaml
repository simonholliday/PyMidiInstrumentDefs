    # Its visible text, as for the product page. Cited for its `1 Digital Oscillator`, where the
    # manual's specifications say `1 VCO`; it differs from them in a few smaller ways besides.

midi:
  # `1–16` in both the Default and Change rows of both columns, marked `Memorized` (chart p. 1), and
  # the manual's `MIDI channel` runs "0*–F: 1–16" (manual p. 4), so channel 1 from the factory.
  channels: [1, 16]
  # `3` in the `Recognized` column's Mode Default row (chart p. 1), OMNI OFF and POLY by its own
  # legend, for an instrument with one monophonic oscillator - see the account, and
  # `korg/monologue`, which records the same pair.
  mode: 3
  # **SENT AND RECEIVED.** The implementation sends `F8` and receives it, and the chart circles
  # Clock in both columns (chart p. 1). Receiving it depends on `MIDI clock source`, auto from the
  # factory.
  clock: both
  # **RECEIVED ONLY.** `FA` Start, `FB` Continue and `FC` Stop are in the received realtime table
  # and not the transmitted one, and the chart crosses Commands sent and circles them received.
  transport: receives
  program_change:
    # **Crossed in both columns** (chart p. 1), and neither of the implementation's channel tables
    # has a `Cn` row. A checked absence twice over.
    receives: false
    sends: false
  # **A CHECKED ABSENCE**: neither document names 6, 38 or 98 to 101 - not the chart's Control
  # Change block, which runs `14`, `16`, `19` up to `117`, `118`, `119` (chart p. 1), nor its Aux
  # rows, nor either of the implementation's channel tables. The rule `roland/tr_08` follows.
  nrpn: none
  # Circled in both columns, footnoted "In addition to Korg exclusive messages, Inquiry is
  # supported." (chart p. 1), and laid out at length in the implementation.
  sysex: true

voice:
  addressing: pitches
  # `0–127` in both the Note Number and True Voice rows of the `Recognized` column (chart p. 1).
  note_range: [0, 127]
  # "With a single monophonic digital oscillator" (product_page), read as one voice - see the
  # account.
  polyphony: 1
  velocity:
    # **RECEIVED**: `O 9n, V=1–127` in the `Recognized` column (chart p. 1). What it sends the chart
    # gives as a fixed 64, `X 9n, V=64`, where the implementation prints `vv=1~127`; no document
    # says the ribbon senses velocity. That is about what it sends, not what it answers to.
    note_on: received
    # Crossed in the `Recognized` column (chart p. 1), while the implementation receives
    # `Note Off vv=1~127` and takes `9n kk 00` as a note off too. The implementation gives the
    # message's range and the chart says the value does nothing; both can be true.
    note_off: false
  # Crossed in all four boxes, polyphonic and channel, in both columns (chart p. 1), and absent from
  # the implementation. A checked absence.
  aftertouch: none
  # NOT RECORDED, the pitch bend. Circled received (chart p. 1) and `En` is in the implementation's
  # received table; the format's pitch bend field holds a range and whether it can be set, and no
  # document gives either.

groups:
  # The panel's seven buttons, which are the manual's own sections: OSC, FILTER and EG in the mode
  # table (manual p. 4), MOD, DELAY and REVERB in the effects table (manual pp. 3-4), and ARP.
  osc: OSC
  filter: FILTER
  eg: EG
  mod: MOD
  delay: DELAY
  reverb: REVERB
  arp: ARP

controls:

  # **TWENTY-NINE, BOTH WAYS, AS THE IMPLEMENTATION NAMES THEM.** Each control's group is the panel
  # section the manual describes it under: the oscillator's LFO is on the OSC row of the mode table
  # (manual p. 4) and the tremolo on the EG row, beside the knobs they share a button with.
  #
  # The eight stepped controls carry the received bands' starts. The values the instrument sends are
  # those same starts, except the last state's, which it sends as `127`.

  # OSC (5). The fifth type's band selects the user oscillator slot, `User OSC` in the manual's
  # table (manual p. 4); the implementation names the band `WAVES`, after what the slot comes loaded
  # with.
  oscillator_type:      {label: OSCILLATOR TYPE, cc: 53, values: {saw: 0, tri: 25, sqr: 50, vpm: 75, waves: 100}, group: osc}
  oscillator_shape:     {label: OSCILLATOR SHAPE, cc: 54, group: osc}
  oscillator_alt:       {label: OSCILLATOR ALT, cc: 55, group: osc}
  oscillator_lfo_rate:  {label: OSCILLATOR LFO RATE, cc: 24, group: osc}
  oscillator_lfo_depth: {label: OSCILLATOR LFO DEPTH, cc: 26, group: osc}

  # FILTER (5). The seventh type is `OFF` in the implementation and the manual's table
  # (manual p. 4); the product page calls it an `OPEN mode`.
  filter_type:          {label: FILTER TYPE, cc: 42, values: {lp2: 0, lp4: 18, bp2: 36, bp4: 54, hp2: 72, hp4: 90, "off": 108}, group: filter}
  filter_cutoff:        {label: FILTER CUTOFF, cc: 43, group: filter}
  filter_resonance:     {label: FILTER RESONANCE, cc: 44, group: filter}
  filter_sweep_depth:   {label: FILTER SWEEP DEPTH, cc: 45, group: filter}
  filter_sweep_rate:    {label: FILTER SWEEP RATE, cc: 46, group: filter}

  # EG (5)
  eg_type:              {label: EG TYPE, cc: 14, values: {adsr: 0, ahr: 25, ar: 50, ar_loop: 75, open: 100}, group: eg}
  eg_attack:            {label: EG ATTACK, cc: 16, group: eg}
  eg_release:           {label: EG RELEASE, cc: 19, group: eg}
  tremolo_depth:        {label: TREMOLO DEPTH, cc: 20, group: eg}
  tremolo_rate:         {label: TREMOLO RATE, cc: 21, group: eg}

  # MOD (3)
  mod_fx_type:          {label: MOD FX TYPE, cc: 88, values: {"off": 0, chorus: 25, ensemble: 50, phaser: 75, flanger: 100}, group: mod}
  mod_fx_time:          {label: MOD FX TIME, cc: 28, group: mod}
  mod_fx_depth:         {label: MOD FX DEPTH, cc: 29, group: mod}

  # DELAY (4)
  delay_fx_type:        {label: DELAY FX TYPE, cc: 89, values: {"off": 0, stereo: 21, mono: 42, ping_pong: 63, highpass: 84, tape: 105}, group: delay}
  delay_fx_time:        {label: DELAY FX TIME, cc: 30, group: delay}
  delay_fx_depth:       {label: DELAY FX DEPTH, cc: 31, group: delay}
  delay_fx_mix:         {label: DELAY FX MIX, cc: 33, group: delay}

  # REVERB (4)
  reverb_fx_type:       {label: REVERB FX TYPE, cc: 90, values: {"off": 0, hall: 21, plate: 42, space: 63, riser: 84, submarine: 105}, group: reverb}
  reverb_fx_time:       {label: REVERB FX TIME, cc: 34, group: reverb}
  reverb_fx_depth:      {label: REVERB FX DEPTH, cc: 35, group: reverb}
  reverb_fx_mix:        {label: REVERB FX MIX, cc: 36, group: reverb}

  # ARP (3). The pattern length is "ARP pattern length: 1–24" (manual p. 4) on a controller that
  # runs 0 to 127, and no document says how the one maps onto the other, so it stays continuous.
  arp_pattern:          {label: ARP PATTERN, cc: 117, values: {up: 0, down: 12, up_down: 24, down_up: 36, conv: 48, div: 60, conv_div: 72, div_conv: 84, rand: 96, stoch: 108}, group: arp}
  arp_intervals:        {label: ARP INTERVALS, cc: 118, values: {oct: 0, maj: 21, sus: 42, aug: 63, min: 84, dim: 105}, group: arp}
  arp_length:           {label: ARP LENGTH, cc: 119, group: arp}
