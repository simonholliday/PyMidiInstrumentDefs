    sha256: 9a09dbe821f3a32a96aa4d8a007cc0de58cb732dff74ac6b272cd9d5e6f09353
    retrieved: 2026-10-03
    # 44 pages, counted with pypdf and with PyMuPDF, which agree. `FILE GIVES NO PAGE COUNT AT
    # ALL` for this one and says "0 page(s)" for the addendum, which is the third Novation in
    # two instruments to defeat that tool's count. Every page prints its own number and it is
    # the file's page index, so nothing is added.
    page_offset: 0
  addendum:
    kind: manual
    title: Summit and Peak User Guide Addendum Version 2.1
    edition: V1, for firmware updates 2.0 and 2.1
    dated: 2022-07-27
    landing: "https://downloads.novationmusic.com/novation/synthesisers/peak"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/summit_peak_2.1_firmware_update_addendum_v1_english_en.pdf"
    sha256: c57ee8ff062dc2cae21d149e57b69865e8c0b0a7c5be1def6102774515c4c5cd
    retrieved: 2026-10-03
    # 18 pages, counted twice and agreed. Covers the Peak and the Summit together and marks
    # which features belong to which, which is why it can be read for one of them.
    page_offset: 0
  download_page:
    kind: download_page
    title: Peak Downloads
    landing: "https://downloads.novationmusic.com/"
    url: "https://downloads.novationmusic.com/novation/synthesisers/peak"
    sha256: c14516cd7f7915534f39943af0e4b2aed31b315f9ae71e7cffe4596821a1cb53
    retrieved: 2026-10-03
    paginated: false
    # Cited for what Novation publishes for this instrument - the user guide in 25 language
    # versions, the 2.1 addendum, and two Windows USB drivers - and for what it does not: no
    # programmer's reference and no separate MIDI implementation, unlike this maker's Circuit.

midi:
  # "MIDI protocol provides for 16 channels of data" and the setting that chooses one is
  # MidiChan, "Default value: 1 ... Range of adjustment: 1 to 16" (manual p. 35). The maker
  # states both the span and the default: "MidiChan lets you set Peak to receive and transmit
  # MIDI data on a particular channel" (manual p. 35).
  channels: [1, 16]
  # RECEIVES, AND ONLY THAT IS ESTABLISHED. The clock source setting chooses between the
  # internal clock and an external one "provided by an external device able to transmit MIDI
  # clock" (manual p. 30), and five pages describe what the Peak does with an incoming clock.
  # Nothing in either document says it sends one, so `both` would claim the half that was not
  # established.
  clock: receives
  program_change:
    # "This setting controls how Peak handles MIDI Program Change and Bank Change messages",
    # defaulting to Rec+Tran, which "allows Peak to send a Program/Bank Change message whenever
    # a new Patch is loaded, and also lets you load a Patch from an external MIDI controller"
    # (manual p. 35). Both directions, and both can be switched off independently of the
    # controllers, which have a setting of their own.
    receives: true
    sends: true
    # "Peak can store 512 Patches in memory, arranged in four Banks of 128" (manual p. 11).
    presets: 512
  # 172 OF THE 246 CONTROLS BELOW ARE ADDRESSED BY NRPN AND BY NOTHING ELSE, which is more than
  # twice the number the control changes reach. The maker still does not prefer either in
  # words: the Settings menu names them together as one switch, "CC/NRPN", with one value for
  # both (manual p. 35), so `supported` is as far as the documents go.
  nrpn: supported
  # Patches travel this way, in Banks or singly: "It is also possible to import Patch data into
  # Peak via MIDI SysEx messages using applications such as SysEx Librarian (Mac) or MIDI-OX
  # (Windows)" (manual p. 37), and the Backup page sends the current Patch, any Bank, all four,
  # the Settings, or everything (manual p. 36). No byte layout is published.
  sysex: true

voice:
  addressing: pitches
  # "Peak is an eight-voice synth, and each voice has three oscillators" (manual p. 19), and in
  # Poly mode "up to eight voices can sound simultaneously" (manual p. 29).
  polyphony: 8
  # EIGHT IS THE DEFAULT AND NOT THE ONLY ANSWER, because voicing is a setting here: Voice Mode
  # has a "Range of adjustment: Mono, MonoLG, Mono2, Poly, Poly2" (manual p. 29), of which
  # "three of the possible modes are mono and two are polyphonic" (manual p. 29). One voice or
  # eight, then, which is what these two numbers are. The setting is `voice_mode` below, NRPN
  # 0:2, and is saved with the Patch - so what an instrument is doing depends on which Patch is
  # loaded, the same reason the Moogs here record a list rather than a number.
  voicing_modes: [1, 8]
  velocity:
    # RECEIVED, AND THAT IS ALL THIS INSTRUMENT COULD DO - it has no keyboard. Velocity shapes
    # the envelopes through three parameters of its own below, and a global VelShape "modifies
    # the synth's response to the velocity curve set on the controlling keyboard" (manual
    # p. 34).
    note_on: received
  # POLY, AND CHANNEL PRESSURE AS WELL, WHICH THIS FIELD HAS NO ROOM TO SAY. The maker covers
  # both in one sentence: the modulation matrix's "AftTouch source will accept either channel
  # aftertouch, which is the most common type of aftertouch, or can be used with polyphonic
  # aftertouch, as generated by some controllers such as the Novation LaunchPad Pro" (manual
  # p. 27), and with polyphonic aftertouch "the pressure applied during a note event is
  # interpreted as a modulation event for this one note only". `poly` is recorded because it is
  # the stronger of the two and is published; channel pressure is answered to as well.
  aftertouch: poly
  pitch_bend:
    # TWELVE BY DEFAULT AND SETTABLE PER OSCILLATOR, which is unusual enough to say plainly:
    # there is no one bend range here but three, `Oscillator 1/2/3 Bend Range` below, each an
    # NRPN over 40-88 for -24 to +24. The manual's own figure for the span agrees: "A keyboard
    # pitch wheel can vary the oscillator pitch by up to two octaves, up or down" (manual
    # p. 18). Twelve is where all three start, by the Init Patch table (manual p. 38) and by
    # the MIDI list's default of 76, which is +12 on that range.
    semitones: 12
    programmable: true

