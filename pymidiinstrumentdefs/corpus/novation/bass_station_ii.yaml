# ONE NUMBER IN THIS FILE IS ALMOST CERTAINLY THE MAKER'S MISTAKE, AND IS CARRIED ANYWAY.
# The guide gives the modulation wheel as `cc 0` (p. 73). CC 0 is Bank Select MSB in the MIDI
# specification and the modulation wheel is CC 1, so 0 is very hard to believe. But it is what
# the only document says: the cell was rendered at 900 dpi and read character by character, by
# two readers working separately, and it reads 0. There is no second edition to compare - the
# Bass Station II, the AFX Station and the Swifty Edition are all served this one guide - and
# this instrument is not one the bundled definitions were measured against, so it cannot be
# tried. The number is recorded as printed and doubted in writing, which is this corpus's rule:
# a definition says what the maker published, and says where that looks wrong.
#
# A SECOND SLIP IS SMALLER AND IS CERTAIN. The mixer's coarse and fine pairs are printed
# 20:52, 21:53, 22:54 and 24:56, and `noise level` alone is printed `23.55`, with a full stop
# where the others have a colon. It is carried as 23 and 55, because that is the only thing
# the sequence leaves it to be.
#
# TWO NRPNS ARE PUBLISHED TWICE, 87 and 91, under different names in different sections of the
# same table. Both rows are kept and each names the other, because the guide prints both.
#
# THE PARAMETER NAMES ARE THE GUIDE'S OWN, VERBATIM, including its inconsistent capitals -
# "osc 1 fine" beside "Mod Env attack" beside "Bend Amount". Where a maker styles a table
# uniformly this corpus normalises it; there is no uniform styling here to normalise.

definition: 1

model:
  manufacturer: Novation
  name: Bass Station II
  # NOT RECORDED. The guide states a version for itself - "Version 5.0" on its title page - and
  # no firmware version for the instrument anywhere in its 82 pages. Novation's downloads page
  # offers a Librarian and Firmware Updater 1.2 "only for users not using newer firmware",
  # whose own notes say it upgrades "from r540 to r554"; the current firmware is delivered
  # through Novation Components, which serves nothing a fetch here can read. So the newest
  # firmware is not stated on any page this was read from. Checked 2026-10-02.

source: >-
  Bass Station II user guide, version 5.0, 82 pages, dated 2025-08-15 by its own metadata. Its
  "MIDI parameters list" (pp. 71-74) is the whole of this instrument's published map: 98 rows
  of panel section, parameter, whether it is addressed by control change, NRPN or a message of
  its own, the number, and the range, run over four pages.

  THE TABLE RUNS BOTH WAYS, which the guide states rather than leaving to be inferred: "Bass
  Station II has a high degree of MIDI implementation, and almost every control and synth
  parameter transmits MIDI data to external equipment, and similarly, the synth can be
  controlled in almost every respect by incoming MIDI data from a DAW or sequencer" (p. 19).

  FOUR OF THE 98 ROWS ARE NOT CONTROLS and are not below: patch inc and patch dec, which are
  program changes, pitch, which is a pitch bend, and after touch. For those the message is the
  address, so each belongs to a field of its own rather than to the controls.

  SIXTEEN CONTROL CHANGES CARRY A FINE HALF, written in the guide as `MSB:LSB` and always as n
  and n+32.

  THE SAME NOTATION MEANS SOMETHING ELSE ON AN NRPN ROW, where it is the two halves
  of one parameter number: `0:72` is 72, not a pair. Conflating the two was caught by a check
  that every control change pair is n and n+32, which no NRPN row satisfies.

  THE GUIDE WRITES ITS NRPNS TWO WAYS in the one table: 28 give both halves as `0:nn` and three
  give the low half alone. Every pair it writes out has a high half of zero, so the three bare
  ones mean the same thing - checked rather than assumed, because the whole NRPN column rests
  on it.

  THREE PRODUCTS, ONE GUIDE, AND THE GUIDE SAYS SO ITSELF: "This user guide applies to all
  editions of the Bass Station II. We've used the original Bass Station II for graphics
  throughout. If you're using the AFX Station or Bass Station II Swifty Edition you'll have
  more information on the top panel relevant to the various firmware upgrades we've added over
  the years" (p. 4). Novation's download pages agree from the other side: the three products
  are offered this same file and no other. So this definition describes all three where MIDI
  is concerned, and the guide has a section of its own for the AFX Station's overlays and the
  system exclusive that manages them.

  TWO DIN SOCKETS AND NO THRU: "MIDI IN and OUT - standard 5-pin DIN MIDI sockets for
  connecting Bass Station II to other MIDI-equipped hardware" (p. 13), with a class-compliant
  USB port beside them that also carries MIDI. The guide rules out the obvious next thought:
  "Bass Station II is not a computer MIDI interface. MIDI can be transmitted between the synth
  and computer via the USB connection, but MIDI cannot be transferred between the computer and
  external equipment via Bass Station II's MIDI DIN ports" (p. 14).

  NOT RECORDED: the note range, which the guide never states for what the instrument receives -
  its keyboard is "25-note (two octaves) velocity-sensitive" with octave shift keys, and that is
  the panel rather than the span it answers to. Whether it transmits MIDI clock, since the guide
  describes only the other direction. Transport, which no sentence in the guide mentions at all -
  not start, not stop, not continue, not song position. And whether program change is received:
  the only thing in 82 pages that bears on it is the table's own two rows, patch inc and patch
  dec, which name the message and say nothing about direction. Aftertouch in either direction,
  for the same reason - its row is in the same list - and its kind, which no page gives.

  ONE MORE TYPOGRAPHICAL SLIP, CARRIED AS PRINTED: the envelope section has an "amp env fixed
  sustatin duration" where its neighbour four rows down is spelled "Mod Env fixed sustain
  duration". The label below is the guide's, misspelling and all.

sources:
  guide:
    kind: manual
    title: Bass Station II user guide
    edition: Version 5.0
    dated: 2025-08-15
    landing: "https://downloads.novationmusic.com/novation/synthesisers/bass-station-ii"
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/bass_station_ii_user_guide_v5_en.pdf"
    sha256: 3a1555cb0f234c1a8956018d0583e01e36958344b5c31a5b1ab676b99197487e
    retrieved: 2026-10-02
    # Every page prints its own number and it is the file's own page index, so nothing is added.
    # 82 pages, counted with two readers that agree. `FILE REPORTS IT AS 2`, which is the second
    # maker in two instruments to defeat that tool's page count and on a different toolchain -
    # Novation's PDF is produced by Antenna House out of Paligo, Korg's by Adobe PageMaker. It
    # is a property of nested page trees, not of one publisher. `file` establishes what a
    # download is; a page count is worth taking from something that walks the tree.
    page_offset: 0
  download_page:
    kind: download_page
    title: Bass Station II downloads
    landing: "https://downloads.novationmusic.com/"
    url: "https://downloads.novationmusic.com/novation/synthesisers/bass-station-ii"
    sha256: 5ad23b57073deafd071fa265cabe9f43033218edb21473ad0bc5eff1c9a0708e
    retrieved: 2026-10-02
    paginated: false
    # Cited for what Novation publishes for this instrument, which is the guide in twenty-odd
    # languages and a Librarian for older setups, and for nothing else: no programmer's
    # reference and no separate MIDI implementation, unlike this maker's Circuit.

midi:
  # "Global: MIDI Channel (upper G#) Range: 1 to 16" (p. 63), and the factory default is 1:
  # the display shows "the current MIDI channel number (1 if it has not been changed from the
  # factory default)" (p. 64).
  channels: [1, 16]
  # RECEIVES, AND ONLY THAT IS ESTABLISHED. "If Bass Station II is being synchronsied to an
  # external MIDI clock, it will automatically detect the incoming clock and disable the Tempo
  # control" (p. 51) - the maker's own spelling of synchronised is kept. Nothing in 82 pages
  # says it sends clock, so `both` would be claiming the half that was not established.
  clock: receives
  program_change:
    # "Pre-loaded with 64 brand new Killer Patches" and "Memory for 64 additional User
    # Patches" (p. 4), which the panel reaches as "one of the 64 Factory or 64 User Patches"
    # (p. 8).
    presets: 128
  # NUMBERS PER CONTROL, below, 29 distinct ones across 31 published rows.
  nrpn: supported
  # Patches, overlays and tuning tables all travel this way, and the guide gives the byte
  # layouts: "Via SysEx messages it's possible to export, import, copy, move and save the
  # overlays" (p. 74), and a section on importing patches by system exclusive.
  sysex: true

voice:
  addressing: pitches
  # MONOPHONIC, AND THE MAKER SAYS SO IN THOSE WORDS: "The Bass Station II is at its core a
  # monophonic synthesiser. However, enabling paraphonic mode gives you different playing
  # possibilities" (p. 37). In that mode the two oscillators track separate keys and still
  # "share the same amplifier and filter", which is what paraphonic means and why it is a flag
  # of its own rather than a polyphony of two.
  polyphony: 1
  paraphonic: true
  velocity:
    # "25-note (two octaves) velocity-sensitive keyboard with aftertouch" (p. 8). Velocity has
    # two destinations of its own in the table below, the amplitude and modulation envelopes.
    note_on: received
  # NOT RECORDED: AFTERTOUCH, IN EITHER DIRECTION, although the keyboard has it - "25-note
  # (two octaves) velocity-sensitive keyboard with aftertouch" (p. 8) - three of the NRPNs
  # below are its destinations, and the MIDI parameters list gives it a row, `after touch`, 0
  # to 127 (p. 73). That list has no direction column and no page says aftertouch arrives or
  # leaves over MIDI: the guide's sentence about direction covers "almost every control and
  # synth parameter" (p. 19), and this file does not stretch it to the list's message rows, as
  # it does not for program change. Nor does any page say channel pressure or polyphonic key
  # pressure. The one indirect sign is the row itself, a single value with no note number,
  # which is what channel pressure looks like and is not a statement that it is.
  pitch_bend:
    # SETTABLE, AND THE GUIDE GIVES THREE DIFFERENT ANSWERS FOR HOW FAR, so no number is
    # written. Page 17 says "The maximum range of operation is 12 semitones up or down, but
    # this may be adjusted using On-Key function Oscillator: Pitch Bend Range". Page 61 gives
    # that function as "Range: -24 to +24" and says "A maximum of two octaves can be
    # selected". The MIDI parameters list gives Bend Amount as cc 107 with the range "1 to
    # 12". Twelve, twenty-four and twelve, in one document. The init patch table (p. 70)
    # gives the default as "12 (oct up and down)", which settles the default and not the span.
    programmable: true
