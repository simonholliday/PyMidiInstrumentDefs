midi:
  # The chart's Basic Channel row gives "1–16" (manual p. 73) in both columns against Changed,
  # which is the range either of the two channels below can be set to. Both menus agree.
  channels: [1, 16]
  # "Mode 3" in both columns, with Messages and Altered both x (manual p. 73). Omni off, poly.
  mode: 3
  # The chart's Clock row is o in both columns (manual p. 73), and the manual's menu has a setting
  # for where it comes from: "SYnC (MIDI Clock Sync)" (manual p. 68), whose settings are "AUtO",
  # "Int", "NiDi" and "USb" (manual p. 68).
  clock: both
  # Start and Stop are both o in both columns (manual p. 73). **Continue is x in both**, so it
  # answers to a transport it cannot be told to resume - which is unusual enough to say out loud.
  transport: both
  program_change:
    # o in both columns, with a True Number of "0–63" in both (manual p. 73). Two menu settings
    # govern it: "txPc (Tx Program Change)" (manual p. 68) and "rxPc (Rx Program Change)"
    # (manual p. 68).
    receives: true
    sends: true
    # WHAT THE INSTRUMENT HOLDS, and the chart's own range agrees: "The patterns are arranged in
    # banks (1–4) and numbers (1–16), for a total of 64 patterns." (manual p. 9), which is the 0
    # to 63 of its True Number row.
    presets: 64
  # x in both columns (manual p. 73).
  sysex: false
  # CHECKED AND ABSENT. The words NRPN, RPN and Registered Parameter appear nowhere in the manual's
  # 75 pages.
  nrpn: none

parts:
  # TWO CHANNELS AT ONCE, AND THE CHART GIVES BOTH DEFAULTS. Its Basic Channel row names 3 for the
  # synth and 16 for program change, in both columns (manual p. 73) - one channel carrying the
  # notes and the controllers, another carrying only the program changes that change patterns. The
  # manual
  # has a menu entry for each and both take 1 to 16, so neither is fixed and neither derives from
  # the other, which is what `assigned` says.
  synth:
    label: Synth
    channel: assigned
    receives: [notes, controls]
    # ALL FOUR OF THE INSTRUMENT'S VOICES, because the other part does not sound: "Maximum
    # Polyphony 4 voices" (manual p. 71), which the panel reaches as a chord - "Lets you play more
    # than one tone at the same time (up to four voices)." (manual p. 24). The three CHORD VOICE
    # switches below are how the other three are turned on.
    polyphony: 4
  pattern:
    label: Pattern
    channel: assigned
    # "Sets the MIDI channel for transmitting/receiving the program change messages used to change
    # patterns." (manual p. 68) - and nothing else reaches it.
    receives: [program_change]

voice:
  # NOT SHARED, AND THE FIGURE IS ON THE PART, because only one of the two parts sounds at all:
  # the pattern part takes program change and nothing else. So "Maximum Polyphony 4 voices"
  # (manual p. 71) is stated against the synth part above rather than here - the format's rule is
  # to say it once, where it is true.
  polyphony_shared: false
  # "0–127" in both columns of the chart's Note Number row, with a True Voice of the same (manual
  # p. 73). The instrument itself has no keyboard in the ordinary sense - its keys are pads - and
  # the chart's figure is what it will sound.
  note_range: [0, 127]
  velocity:
    # "o" in both columns of the chart's Note On row (manual p. 73).
    note_on: received
    # "x" in both columns of its Note Off row (manual p. 73), so release velocity is neither sent
    # nor acted on.
    note_off: false
  # A checked absence, from the chart's own rows: Key's and Channel's are both x in both columns
  # (manual p. 73).
  aftertouch: none
  # NOT RECORDED: how far it bends. The chart marks Pitch Bend x transmitted and o received (manual
  # p. 73) - so it answers to a bend it will never send - and gives no range. Two controls below
  # set how far a bend reaches, one for the oscillator and one for the filter, and the manual gives
  # no figure for either.

groups:
  # THE FIRST WORD OF THE MAKER'S OWN NAME FOR EACH CONTROL, which is also how its panel is laid
  # out. Two merges the maker's own brackets license: the poly mode and the three chord voices all
  # reach the panel through the `[POLY]` pad, and reverb, delay and chorus are the effects.
  # **Two controls get no group** - the transpose switch and the noise mode - because inventing one
  # for a single control would invent a grouping the maker does not have.
  midi: MIDI
  lfo: LFO
  portamento: Portamento
  osc: Oscillator
  filter: Filter
  amp: Amp
  env: Envelope
  chord: Chord
  effects: Effects
controls:

  # ──── midi ────

  modulation_wheel:        {label: Modulation Wheel, cc: 1, direction: receives, group: midi}
  pan:                     {label: Pan, cc: 10, direction: receives, group: midi}
  expression_pedal:        {label: Expression Pedal, cc: 11, direction: receives, group: midi}
  damper_pedal:            {label: Damper Pedal, cc: 64, direction: receives, group: midi}

  # ──── lfo ────

  lfo_rate:                {label: LFO RATE, cc: 3, group: lfo}
  lfo_wave_form:           {label: LFO WAVE FORM, cc: 12, group: lfo}
  lfo_modulation_depth:    {label: LFO MODULATION DEPTH, cc: 17, group: lfo}
  lfo_mode:                {label: LFO MODE, cc: 79, group: lfo}
  lfo_key_trigger:         {label: LFO KEY TRIGGER, cc: 105, group: lfo}
  lfo_sync:                {label: LFO SYNC, cc: 106, group: lfo}

  # ──── portamento ────

  portamento_time:         {label: PORTAMENTO TIME, cc: 5, group: portamento}
  portamento_mode:         {label: PORTAMENTO MODE, cc: 31, group: portamento}
  portamento:              {label: PORTAMENTO, cc: 65, direction: receives, group: portamento}

  # ──── osc ────

  osc_lfo:                 {label: OSC LFO, cc: 13, group: osc}
  osc_range:               {label: OSC RANGE, cc: 14, group: osc}
  osc_pulse_width:         {label: OSC PULSE WIDTH, cc: 15, group: osc}
  osc_pwm_source:          {label: OSC PWM SOURCE, cc: 16, group: osc}
  osc_bend_sens:           {label: OSC BEND SENS, cc: 18, group: osc}
  osc_level_19:            {label: OSC LEVEL, cc: 19, group: osc}
  osc_level_20:            {label: OSC LEVEL, cc: 20, group: osc}
  osc_sub_osc_level:       {label: OSC SUB OSC LEVEL, cc: 21, group: osc}
  osc_sub_oct_type:        {label: OSC SUB OCT TYPE, cc: 22, group: osc}
  osc_noise_level:         {label: OSC NOISE LEVEL, cc: 23, group: osc}
  fine_tune:               {label: FINE TUNE, cc: 76, group: osc}
  osc_draw_multiply:       {label: OSC DRAW MULTIPLY, cc: 102, group: osc}
  osc_chop_overtone:       {label: OSC CHOP OVERTONE, cc: 103, group: osc}
  osc_chop_comb:           {label: OSC CHOP COMB, cc: 104, group: osc}
  osc_draw_sw:             {label: OSC DRAW SW, cc: 107, group: osc}

  # ──── filter ────

  filter_envelope:         {label: FILTER ENVELOPE, cc: 24, group: filter}
  filter_lfo:              {label: FILTER LFO, cc: 25, group: filter}
  filter_keyboard_follow:  {label: FILTER KEYBOARD FOLLOW, cc: 26, group: filter}
  filter_bend_sens:        {label: FILTER BEND SENS, cc: 27, group: filter}
  filter_resonance:        {label: FILTER RESONANCE, cc: 71, group: filter}
  filter_frequency:        {label: FILTER FREQUENCY, cc: 74, group: filter}

  # ──── amp ────

  amp_envelope_mode_sw:    {label: AMP ENVELOPE MODE SW, cc: 28, group: amp}

  # ──── env ────

  env_trigger_mode:        {label: ENV TRIGGER MODE, cc: 29, group: env}
  env_sustain:             {label: ENV SUSTAIN, cc: 30, group: env}
  env_release:             {label: ENV RELEASE, cc: 72, group: env}
  env_attack:              {label: ENV ATTACK, cc: 73, group: env}
  env_decay:               {label: ENV DECAY, cc: 75, group: env}

  # ──── chord ────

  poly_mode:               {label: POLY MODE, cc: 80, group: chord}
  chord_voice_2_sw:        {label: CHORD VOICE 2 SW, cc: 81, group: chord}
  chord_voice_3_sw:        {label: CHORD VOICE 3 SW, cc: 82, group: chord}
  chord_voice_4_sw:        {label: CHORD VOICE 4 SW, cc: 83, group: chord}
  chord_voice_2_key_shift: {label: CHORD VOICE 2 KEY SHIFT, cc: 85, group: chord}
  chord_voice_3_key_shift: {label: CHORD VOICE 3 KEY SHIFT, cc: 86, group: chord}
  chord_voice_4_key_shift: {label: CHORD VOICE 4 KEY SHIFT, cc: 87, group: chord}

  # ──── effects ────

  reverb_time:             {label: REVERB TIME, cc: 89, group: effects}
  delay_time:              {label: DELAY TIME, cc: 90, group: effects}
  reverb_level:            {label: REVERB LEVEL, cc: 91, group: effects}
  delay_level:             {label: DELAY LEVEL, cc: 92, group: effects}
  chorus:                  {label: CHORUS, cc: 93, group: effects}

  # ──── no group of its own ────

  transpose_sw:            {label: TRANSPOSE SW, cc: 77, direction: receives}
  noise_mode:              {label: NOISE MODE, cc: 78}
