  filter_key_tracking:                {label: Key Tracking, cc: 92, nrpn: 197, part: track, group: filter}
  filter_base:                        {label: Base, cc: 26, nrpn: 179, part: track, group: filter}
  filter_width:                       {label: Width, cc: 27, nrpn: 180, part: track, group: filter}
  filter_env_reset:                   {label: Env. Reset, cc: 111, nrpn: 196, part: track, group: filter}

  # AMP ─────────────────────────────────────────────────────────────────────
  amp_attack_time:                    {label: Attack Time, cc: 79, nrpn: 158, part: track, group: amp}
  amp_hold_time:                      {label: Hold Time, cc: 80, nrpn: 159, part: track, group: amp}
