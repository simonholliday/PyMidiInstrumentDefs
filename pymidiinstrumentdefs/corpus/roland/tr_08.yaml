# **ROLAND DOES PUBLISH A MIDI IMPLEMENTATION CHART FOR THIS INSTRUMENT**, as the last of ten
# documents on its Owner's Manuals page, and it is the whole control map: one A3 sheet with the
# chart on the left and, on the right, two note tables and a list naming all thirty-eight
# controllers. Neither edition of the two-sheet manual names a controller number.
#
# **THE CONTROLLER NUMBERS ARE THE TR-8's, AND ELEVEN OF THEM CARRY ANOTHER NAME.** Every one of
# the thirty-eight is among the fifty the committed `roland/tr_8` carries. Eight differ there only
# in the instrument's code: 58 to 60 are `HC` there and `CP` here, 84 and 85 `CC` and `CY`, and 86
# to 88 `RC` and `CB`, the cowbell. Two name another parameter of the same drum - 21 is `BD ATTACK`
# there and `BD TONE` here, 25 `SD TUNE` against `SD TONE` - and 83 differs in both, `CC TUNE`
# against `CY TONE`. A consumer feeding a TR-08 the TR-8's map would offer twelve controls this
# chart does not list, and reach the cowbell with the three numbers the TR-8 gives to `RC`.
#
# **AND THE MANUAL ROLAND LISTS IS THE ONE WITH THE CURRENT FIRMWARE'S MIDI SETTINGS.** Edition 04
# has the two MIDI additions the notes for system program 1.07 name - MIDI and USB as clock
# sources, and a soft thru switch - and the edition 03 Roland still serves has neither. 1.08, the
# newest, changed only its number.

definition: 1

model:
  manufacturer: Roland
  name: TR-08
  # **1.08, THE ONLY SYSTEM PROGRAM ROLAND OFFERS, AND IT CHANGED NOTHING.** Its notes read "The
  # version number has been updated due to management-related circumstances. Product
  # specifications are unaffected." (release_notes). The last release that changed anything was
  # 1.07, of January 2019, and the manual cited below is the edition that describes it - see the
  # source account. The chart is older still, dated August 2017 and marked `Version 1.00`, which it
  # does not say is its own revision or a system program's; neither release contradicts a row of
  # it. Checked 2026-10-07.
  firmware: "1.08"

source: >-
  MIDI Implementation Chart, one A3 sheet cited as p. 1: the chart, both note tables and the control
  change list, which is every controller and note number below. Owner's Manual, edition 04, two A3
  sheets cited as p. 1 and p. 2: the channel, clock and thru settings and what each panel control
  is. Edition 03 of the same manual, which Roland no longer lists, for what 1.07 added. The Serato
  connection guide and the preset track list, the other two documents Roland lists. And Roland's own
  three pages for this instrument: its owner's manuals, its updates, and the notes for system
  program 1.08.

  NEITHER THE CHART NOR EITHER MANUAL PRINTS A PAGE NUMBER, and nor does the Serato guide, whose
  `01` at the foot of its first sheet is its edition. So every locator below is a sheet counted from
  one. The track list numbers its four sheets, and its numbers are the sheets'. The manual is two
  sheets of A3, each carrying the text of a small booklet.

  THIRTY-EIGHT CONTROLLERS, ALL OF THEM BOTH WAYS. The chart's Control Change row gives four ranges,
  `20–29`, `46–63`, `71` and `80–88`, each `o` in both columns, and points at the list: "For
  details, refer to 'Control change list.'" (chart p. 1). The list names every number in those
  ranges and no other, so the chart and the list are thirty-eight numbers twice over and agree.

  THE LABELS ARE THE LIST'S OWN WORDS IN ITS OWN CAPITALS, `BD TUNE` and the like: a two-letter
  instrument code and a parameter, except 71, which is `ACCENT` alone. The codes are the manual's
  own, expanded in its entry for the select switch: "AC (ACCENT), BD (BASS DRUM), SD (SNARE DRUM),
  LT (LOW TOM), MT (MID TOM), HT (HI TOM), RS (RIM SHOT), CP (HAND CLAP), CB (COWBELL), CY (CYMBAL),
  OH (OPEN HIHAT), CH (CLS’D HIHAT)" (manual p. 1). **That expansion is where the twelve group
  labels come from**, in its spelling and its capitals.

  AND ALL BUT THREE PARAMETERS ARE ONES THE MANUAL GIVES THAT INSTRUMENT. `LEVEL` is on all eleven:
  "You can use 11 different instruments (BD–CH) in a pattern." (manual p. 1), and "Use the [LEVEL]
  knob of each instrument to adjust the volume balance" (manual p. 1). `TONE` is on exactly the
  three the knob names: "In the case of the bass drum and snare drum, this adjusts the tension of
  the head. In the case of the cymbal, this adjusts the character of the sound." (manual p. 1).
  `SNAPPY` is the snare's alone. `COMP` is on the two the menu's compression reaches: "Adjusts the
  level of compression applied to BD and SD." (manual p. 2). That reads as one value for the pair,
  where the gain beside it is chosen drum by drum - "Use the [2]–[12] buttons to select the
  instrument." (manual p. 2) - **and the list gives each drum a number of its own**, so whether 22
  and 27 move one setting or two is not said. `TUNE` is on the menu's six - "This can be set for BD,
  RS, CP, CB, OH, and CH." (manual p. 2) - and the three toms, whose `[TUNING]` knob "Adjusts the
  pitch of a tom or conga." (manual p. 1). `DECAY` is on the menu's eight - "This can be set for SD,
  LT, MT, HT, RS, CP, CB, and CH." (manual p. 2) - and on three more, the bass drum, the open hi-hat
  and the cymbal, which are presumably the panel's DECAY knob. **No text gives those three a decay
  at all**: the knob's entry names no instrument, and the panel drawing's labels are part of an
  image. **What has no number** is the rest of the menu's sound settings: pan, gain, the bass drum's
  type, the hi-hat link and the level knob's curve.

  AND THE HI-HAT LINK MAY SILENCE TWO OF THEM. "If this is On, the settings of OH and CH (Tune and
  Level settings) are linked." (manual p. 2), and "When they are linked, the settings for CH are
  ignored" (manual p. 2). So while the link is on, 61 and 63, `CH TUNE` and `CH LEVEL`, would seem
  to change nothing; no page says so of MIDI.

  FIVE PANEL POSITIONS SERVE TWO INSTRUMENTS EACH, AND THE LIST NAMES ONLY ONE. The instrument
  select switch's entry pairs the low, mid and high congas with the three toms, the claves with the
  rim shot and the maracas with the hand clap, and "It is not possible to play or write both of
  these instruments simultaneously." (manual p. 1). The list's codes are the toms', the rim shot's
  and the clap's. So whether 46, `LT TUNE`, retunes the low conga when the switch is on it is not
  said, and nor is whether a note can sound both of a pair at once: **the note tables give all
  sixteen instruments a number of their own**, and the page does not say whether that sentence
  applies to notes arriving over MIDI.

  TWO NOTE TABLES, ONE SENT AND ONE ANSWERED TO. The chart's Note Number row reads `*1` transmitted
  against `*2` recognised, and the two tables on the right are headed `*1` and `*2`. Each lists the
  same sixteen instruments. **Seven answer to two numbers and send one**: bass drum 35 and 36, snare
  38 and 40, closed hi-hat 42 and 44, low tom 41 and 43, mid tom 45 and 47, high tom 48 and 50, and
  cowbell 51 and 56. The number sent is one of the pair, and not always the higher - the snare sends
  38 and the closed hi-hat 42. `voices` below holds the transmitted table, every number of which is
  also answered to. Twenty-three numbers are answered to in all: every one from 35 to 51, then 56,
  62, 63, 64, 70 and 75. **So no note range is recorded**, because 35 to 75 would claim eighteen
  numbers the table does not have.

  THE CHART'S FOOTNOTE MARKS EACH DO TWO JOBS, AND ONE OF THEM IS EXPLAINED NOWHERE. `*1` heads the
  transmitted note table and is also printed in the Remarks of the Mode row's Default and Messages
  lines, where no note on the sheet says what it means. `*2` heads the recognised note table and
  also qualifies four Aux rows, which is the one note the sheet prints: "*2 The same processing will
  be carried out as when All Notes Off is received." (chart p. 1). The mode below is read from the
  cells, which are plain.

  MODE 3, AND NOTHING OVER MIDI CHANGES IT. Default `Mode 3` in both columns and Messages `x`. Omni
  Mode Off, Omni Mode On, Mono Mode On and Poly Mode On are `x` transmitted and `o` recognised, each
  with that `*2`: each is processed as an All Notes Off would be, and none of them changes the mode.

  ONE CHANNEL, WHICH MAY BE SWITCHED OFF. The Basic Channel row gives `1` as the default both ways,
  remarked `Memorized`, and `1–16, OFF` as the range. The manual's menu says "Specifies the MIDI
  transmit/receive channel." (manual p. 2); edition 03 had said the range in words, "Specifies the
  MIDI transmit/receive channel (1–16, OFF)." (manual_eng03 p. 2).

  CLOCK BOTH WAYS, AND A SETTING DECIDES WHETHER INCOMING CLOCK IS FOLLOWED. Clock, Start, Continue
  and Stop are `o` in both columns, and so is Song Position. Since 1.07 the menu has four sources:
  automatic, internal, the MIDI IN connector alone and the USB port alone. Internal follows neither
  port: "Use this setting if you don’t want to synchronize with an external device." (manual p. 2).
  Of the automatic one: "If MIDI clock is input simultaneously from the MIDI IN connector and the
  USB port, the USB port takes priority." (manual p. 2). **No document says which source is the
  default**, nor which port sends clock, beyond the Serato guide's word that MIDI OUT syncs other
  instruments. The USB port carries MIDI as well as audio: "It can be used to transfer USB MIDI and
  USB audio data." (manual p. 1).

  SOFT THRU, FROM 1.07, AND NO DEFAULT FOR IT EITHER. "Specifies whether data received from the MIDI
  IN connector will be retransmitted from the MIDI OUT connector (On) or will not be retransmitted
  (OFF)." (manual p. 2). It speaks of the two MIDI connectors and of nothing arriving by USB.

  HOW THE MANUAL WAS SHOWN TO DESCRIBE 1.07. Roland's notes for that release name two MIDI
  additions, "USB and MIDI have been added as MIDI clock sources." (release_notes) and "A function
  enabling switching soft thru on and off has been added." (release_notes), and support for Serato
  DJ Pro besides. Edition 03, made in August 2017 by its own metadata, has two clock sources and no
  thru switch. Edition 04, the one Roland links, has four, the switch, and the rule for when both
  ports carry clock; the rest of what differs drops a range restated in brackets or changes a word's
  case, and neither edition describes the Serato sync. So edition 04 is the manual for 1.07's MIDI
  settings, although its own metadata dates it September 2018, four months before the release.

  NO PROGRAM CHANGE AND NO SYSTEM EXCLUSIVE, BOTH CROSSED BOTH WAYS. Song Select is crossed too, so
  the chart offers no message that chooses one of the 256 rhythm patterns or the twelve tracks: "The
  TR-08 has 256 rhythm patterns, and two variations (A and B) for each rhythm pattern." (manual p.
  1).

  THREE AUX MESSAGES ARE SENT WITH A REMARK NOTHING EXPLAINS. All Sound Off, Reset All Controllers
  and All Notes Off are `o` both ways, each remarked "Transmitted: MIDI OFFLINE" (chart p. 1), and
  neither the sheet nor either manual says what offline means here. Active Sensing is `o` both ways;
  Local On/Off and System Reset are `x` both ways.

  VELOCITY IS MARKED BOTH WAYS AND NO PAGE SAYS WHAT IT DOES. The chart's two Velocity rows, Note On
  and Note Off, are `o` in all four cells. Neither edition of the manual uses the word velocity.
  What it has is an accent: a knob, which "Adjusts the strength of the accent." (manual p. 1), and a
  position on the select switch, `AC`, whose steps are written into a pattern as a drum's are - but
  no note number. Controller 71, `ACCENT`, is presumably the knob, so it sets the accent's strength
  rather than accenting a step. Whether a received velocity changes the sound, or an accented step
  is sent louder, is not said.

  THE SERATO GUIDE NAMES THIS INSTRUMENT AND SPEAKS OF CLOCK. "Roland TR-8S, TR-8, TR-08, and TR-09
  drum machines are now sync compatible with Serato DJ Pro via USB." (serato_guide p. 1), and "the
  MIDI OUT port on the TR-8S, TR-8, TR-08, and TR-09 allows synchronization of other external
  sequencer-based instruments" (serato_guide p. 1). Its section for this machine says "Update your
  TR-08 to Ver.1.07 or later." (serato_guide p. 3). It names no controller, note or exclusive
  message. And it sends the reader to a heading neither edition of the manual has - "refer to
  'Device Connections - Micro USB Port' in the owner’s manual" (serato_guide p. 3) - while the SYNC
  mode it switches on with the menu button is in neither edition either. The preset track list is
  four sheets of track credits - number, tempo, genre, author and a web address - beside artwork
  with no text, and the word MIDI is not in it.

  CHECKED AND ABSENT: both aftertouches and pitch bend, each `x` in both columns; and Song Select
  and Tune Request. Swept across both editions of the manual with the text reduced to letters and
  digits, none of NRPN, exclusive, program change, bank select, control change, velocity,
  aftertouch, pitch bend, polyphony, omni or offline appears.

  NOT RECORDED: the polyphony, which no document states; NRPN, which the chart has no row for and no
  document mentions, a silence rather than a checked absence; values, bands or defaults for any
  control, none of which any document gives; and how a controller's 0 to 127 lands on the menu's own
  ranges, -128 to 127 for tune and decay and 0 to 100 for compression, which no document gives
  either.

