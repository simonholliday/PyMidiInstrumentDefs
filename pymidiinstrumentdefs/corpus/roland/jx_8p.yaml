    # A SCAN: 34 sheets, each one 1-bit image, and not a character of text. No edition or date is
    # printed; the back cover carries `10661`. **CITED BY SHEET**, with page_offset 0: from sheet 5
    # to sheet 27 the printed page is the sheet. Sheet 4 is the panel description, which the
    # contents calls page 3, and sheets 1 to 4 and 28 to 34 print no page number, so the MIDI
    # implementation is sheets 28 and 29 and its chart sheet 31. Sheets 2, 32 and 33 are blank.
    page_offset: 0
