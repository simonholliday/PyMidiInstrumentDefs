  # B.8 FX PARAMETERS, MASTER ───────────────────────────────────────────────

  # Printed twice in the table, first row and sixteenth, identically.
  master_overdrive:       {label: Master Overdrive, cc: 29, lsb: 61, nrpn: 293, part: fx, group: master}
