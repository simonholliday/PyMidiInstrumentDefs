definition: 1

model:
  manufacturer: Roland
  name: TR-8S
  # The chart names no firmware, and Roland's own update history settles which ones it
  # covers: across all fourteen releases, from Ver.1.02 (Mar 2018) to Ver.3.00 (Sep 2023),
  # the word MIDI appears once - "MIDI sometimes becomes unsynchronized when a pattern is
  # changed", a fix in Ver.2.01. No release adds, removes or renumbers a controller. So
  # every row below holds for the current system program, which is what this records. (The
  # chart's own version, 1.10 dated October 2018, sits between system program 1.10 of
  # August 2018 and 1.11 of December 2018; Roland does not say the two numbering schemes
  # are the same thing, so nothing here rests on that.)
  firmware: "3.00"

source: >-
  MIDI Implementation Chart, Version 1.10, dated 4 October 2018: a single page
  (p. 1), and every row of it is below. Its 55 control numbers and 11 note
  numbers agree exactly with a working Subsequence map of the same machine,
  whose names these follow. NOT RECORDED: values, bands and defaults for any
  control, none of which the chart gives. The firmware this covers is not in the chart
  either: it comes from Roland's update history, saved the same way, which shows no
  release changing the MIDI implementation.
  THE GROUP LABELS ARE THE CHART'S OWN WORDS. Its note table heads the eleven drum voices
  INST and names each of them by two letters, BD to RC, and Roland expands none of them
  anywhere: its reference manual (56pp) and its owner's manual (24pp) were both searched for
  Bass Drum, Snare Drum, Low Tom, Rim Shot, Hand Clap, Closed Hi, Crash Cymbal and Ride
  Cymbal, and neither document contains one of them. So the two-letter names are what the
  maker calls these, and the expansions everybody knows are nobody's to add here.
  THE REFERENCE MANUAL IS CITED FOR ONE THING, and nothing below depends on it: that the
  eleven controls which belong to no drum voice are kit and pattern parameters rather than
  the instrument's own, which is where that group's label comes from. Its KIT: MASTER FX is
  at p. 26 and its KIT: EXT IN at p. 29, and the shuffle is a pattern setting at p. 17.

sources:
  midi_impl:
    kind: midi_implementation
    title: TR-8S MIDI Implementation Chart
    edition: Version 1.10
    dated: 2018-10-04
    landing: "https://www.roland.com/global/support/by_product/tr-8s/owners_manuals/"
    url: "https://static.roland.com/assets/media/pdf/TR-8S_MIDIImpleChart_eng03_W.pdf"
    sha256: 518360070cfde572ae3cf9454877821d60f21edbbb9fc8a455243e9d8e7851a2
    retrieved: 2026-09-13
  reference_manual:
    kind: manual
    title: TR-8S Reference Manual
    edition: eng05
    landing: "https://www.roland.com/global/support/by_product/tr-8s/owners_manuals/"
    sha256: f58df8e53ef31a7dcd806c737026b39695901b1180c817e156d013f1dfd7ca77
    # No url and no retrieval date, because neither was written down: this file was held
    # before the library kept provenance records, and what is known of it was established
    # from its own bytes on 2026-09-30. The landing page above is where Roland offers the
    # document; which file on it these bytes are has not been checked, so it is not claimed.
  release_notes:
    kind: release_notes
    title: "Roland - Support - TR-8S - Updates & Drivers"
    edition: Ver.3.00
    dated: 2023-09
    landing: "https://www.roland.com/global/support/by_product/tr-8s/updates_drivers/"
    url: "https://www.roland.com/global/support/by_product/tr-8s/updates_drivers/84163b50-a2c5-4c3e-be2a-6ccee610d6ff/"
    sha256: 397280c1ebe0fde5a5d03b5b7c72582ba624d13fd81791d6792997757be880e5
    retrieved: 2026-09-30
    paginated: false
    # Cited for which firmware is current and for the whole update history, which is what
    # establishes that no release changes the chart above. The sha256 is of the page's
    # visible text as saved on 2026-09-30; the page as served hashes to
    # 9a3de4111f65cb3c8929fa7748c2b2c7772f01993c0c8d51769c5e1ace66ff87. Roland adds
    # releases to this page, so no later fetch will match either.

midi:
  # Default 10, memorised; settable to 1-16 or OFF. Which one yours is on
  # belongs to your project, not here.
  channels: [1, 16]
  mode: 4                    # Omni off, mono - the chart's default both ways
  clock: both
  # Start and Stop go both ways; Continue is recognised and never transmitted.
  # Active Sensing goes both ways.
  transport: both
  program_change:
    receives: true
    sends: true
    presets: 128             # "True Number 0-127", both ways
  sysex: false               # "x" both ways, as are Song Position and Song Select

voice:
  addressing: voices
  velocity:
    # Recognised; the machine itself sends a fixed velocity of 80.
    note_on: received
  # Neither key nor channel aftertouch, and no pitch bend, either way. Mode
  # messages and every Aux message - All Notes Off, Local, Omni - are "x" both
  # ways as well.
  aftertouch: none
  # The chart's INST map. Both it and the second, ALT map it prints are factory
  # defaults, "configurable on UTILITY:MIDI:Inst Note". The ALT map is:
  #   bd 35, sd 40, lt 41, mt 45, ht 48, rs 56, hc 54, ch 44, oh 55, cc 61, rc 63
  # The TRIGGER OUT voice has no note.
  voices:
    bd: 36
    sd: 38
    lt: 43
    mt: 47
    ht: 50
    rs: 37
    hc: 39
    ch: 42
    oh: 46
    cc: 49
    rc: 51

groups:
  # Roland's own names, and there are no longer ones to be had: the chart's note table heads
  # these eleven INST and calls each of them by two letters. Both held Roland documents were
  # searched for an expansion and neither has one, so BD stays BD here.
  # The order is the order the chart lists the controls, which is the order they appear below.
  # The first group is every control that belongs to no one drum voice. Roland heads nothing
  # over them in the chart, and the reference manual files them as kit parameters, KIT: MASTER
  # FX at p. 26 and KIT: EXT IN at p. 29, and as pattern settings, the shuffle at p. 17.
  global: Kit and Pattern
  bd: BD
  sd: SD
  lt: LT
  mt: MT
  ht: HT
  rs: RS
  hc: HC
  ch: CH
  oh: OH
  cc: CC
  rc: RC

controls:

  # ── Global ────────────────────────────────────────────────────────────────

  shuffle:           {label: Shuffle,           cc: 9,  group: global}
  external_in_level: {label: External In Level, cc: 12, group: global}
  master_fx_on:      {label: "Master FX [On]",  cc: 15, group: global}
  delay_level:       {label: Delay Level,       cc: 16, group: global}
  delay_time:        {label: Delay Time,        cc: 17, group: global}
  delay_feedback:    {label: Delay Feedback,    cc: 18, group: global}
  master_fx_ctrl:    {label: Master FX Ctrl,    cc: 19, group: global}
  accent:            {label: Accent,            cc: 71, group: global}
  reverb_level:      {label: Reverb Level,      cc: 91, group: global}

  # Transmitted, and not recognised: the chart's "*2", sent only while
  # UTILITY:SOUND:LocalSw is SURFACE. A panel may read these and must never
  # offer to send them.
  auto_fill_in:
    label: Auto Fill In [On]
    cc: 14
    direction: transmits
    group: global
  auto_fill_in_manual:
    label: Auto Fill In [Manual Trig]
    cc: 70
    direction: transmits
    group: global

  # ── Eleven voices, four controls each ─────────────────────────────────────
  # BD and SD are numbered differently from the other nine, which leaves 21, 22,
  # 26 and 27 unassigned inside the block. That is the chart, not a gap in the
  # reading.

  bd_tune:  {label: BD Tune,  cc: 20,  group: bd}
  bd_decay: {label: BD Decay, cc: 23,  group: bd}
  bd_level: {label: BD Level, cc: 24,  group: bd}
  bd_ctrl:  {label: BD Ctrl,  cc: 96,  group: bd}

  sd_tune:  {label: SD Tune,  cc: 25,  group: sd}
  sd_decay: {label: SD Decay, cc: 28,  group: sd}
  sd_level: {label: SD Level, cc: 29,  group: sd}
  sd_ctrl:  {label: SD Ctrl,  cc: 97,  group: sd}

  lt_tune:  {label: LT Tune,  cc: 46,  group: lt}
  lt_decay: {label: LT Decay, cc: 47,  group: lt}
  lt_level: {label: LT Level, cc: 48,  group: lt}
  lt_ctrl:  {label: LT Ctrl,  cc: 102, group: lt}

  mt_tune:  {label: MT Tune,  cc: 49,  group: mt}
  mt_decay: {label: MT Decay, cc: 50,  group: mt}
  mt_level: {label: MT Level, cc: 51,  group: mt}
  mt_ctrl:  {label: MT Ctrl,  cc: 103, group: mt}

  ht_tune:  {label: HT Tune,  cc: 52,  group: ht}
  ht_decay: {label: HT Decay, cc: 53,  group: ht}
  ht_level: {label: HT Level, cc: 54,  group: ht}
  ht_ctrl:  {label: HT Ctrl,  cc: 104, group: ht}

  rs_tune:  {label: RS Tune,  cc: 55,  group: rs}
  rs_decay: {label: RS Decay, cc: 56,  group: rs}
  rs_level: {label: RS Level, cc: 57,  group: rs}
  rs_ctrl:  {label: RS Ctrl,  cc: 105, group: rs}

  hc_tune:  {label: HC Tune,  cc: 58,  group: hc}
  hc_decay: {label: HC Decay, cc: 59,  group: hc}
  hc_level: {label: HC Level, cc: 60,  group: hc}
  hc_ctrl:  {label: HC Ctrl,  cc: 106, group: hc}

  ch_tune:  {label: CH Tune,  cc: 61,  group: ch}
  ch_decay: {label: CH Decay, cc: 62,  group: ch}
  ch_level: {label: CH Level, cc: 63,  group: ch}
  ch_ctrl:  {label: CH Ctrl,  cc: 107, group: ch}

  oh_tune:  {label: OH Tune,  cc: 80,  group: oh}
  oh_decay: {label: OH Decay, cc: 81,  group: oh}
  oh_level: {label: OH Level, cc: 82,  group: oh}
  oh_ctrl:  {label: OH Ctrl,  cc: 108, group: oh}

  cc_tune:  {label: CC Tune,  cc: 83,  group: cc}
  cc_decay: {label: CC Decay, cc: 84,  group: cc}
  cc_level: {label: CC Level, cc: 85,  group: cc}
  cc_ctrl:  {label: CC Ctrl,  cc: 109, group: cc}

  rc_tune:  {label: RC Tune,  cc: 86,  group: rc}
  rc_decay: {label: RC Decay, cc: 87,  group: rc}
  rc_level: {label: RC Level, cc: 88,  group: rc}
  rc_ctrl:  {label: RC Ctrl,  cc: 110, group: rc}
