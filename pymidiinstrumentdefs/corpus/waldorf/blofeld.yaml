  filter_2_drive:            {label: Filter 2 Drive, cc: 82, group: filter_2}
  filter_2_keytrack:         {label: Filter 2 Keytrack, cc: 83, group: filter_2}
  filter_2_env_amount:       {label: Filter 2 Env. Amount, cc: 84, group: filter_2}
  filter_2_env_velocity:     {label: Filter 2 Env. Velocity, cc: 85, group: filter_2}
  filter_2_cutoffmod:        {label: Filter 2 CutoffMod, cc: 86, group: filter_2}
  filter_2_fm:               {label: Filter 2 FM, cc: 87, group: filter_2}
  filter_2_pan:              {label: Filter 2 Pan, cc: 88, group: filter_2}
  filter_2_panmod:           {label: Filter 2 Panmod, cc: 89, group: filter_2}

  # FILTER COMMON -----------------------------------------------
  filter_routing:            {label: Routing, cc: 67, group: filter_common}

  # AMPLIFIER ---------------------------------------------------
  amp_volume:                {label: Amp Volume, cc: 90, group: amplifier}
  amp_velocity:              {label: Amp Velocity, cc: 91, group: amplifier}
  amp_mod:                   {label: Amp Mod, cc: 92, group: amplifier}

