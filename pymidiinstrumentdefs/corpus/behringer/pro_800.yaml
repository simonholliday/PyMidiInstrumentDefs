  lfo_shape:              {label: LFO Shape, cc: 57, group: lfo_mod}
  lfo_speed:              {label: LFO Speed, cc: 58, group: lfo_mod}
  lfo_targets:            {label: LFO Targets, cc: 59, group: lfo_mod}
  lfo_dest_freq:          {label: LFO Dest Freq, cc: 74, group: lfo_mod}
