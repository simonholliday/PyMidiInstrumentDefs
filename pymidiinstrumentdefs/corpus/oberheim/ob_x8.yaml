# THE MAKER PUBLISHES NO SEPARATE MIDI IMPLEMENTATION DOCUMENT FOR THIS INSTRUMENT, and the
# implementation is a sixteen-sheet section inside the User's Guide, headed "OB-X8 MIDI
# Implementation". So this definition is read out of a user manual that happens to contain a
# complete implementation, which is not the same thing as a user-manual-only instrument.
#
# AND THE GUIDE WAS BUILT FROM A SEQUENTIAL DOCUMENT. Its PDF metadata says so: `/Title` is
# "Pro 3 User's Guide" and `/Author` is "Mark Wilcox/Sequential". **That is the explanation of
# the sibling.** `oberheim/teo_5`'s own implementation document says in as many words that its
# control map is the Pro 3's, and nineteen pages of the TEO-5's guide carry the Sequential Take
# 5's running headers. The same production line made both.
#
# **THIS DOCUMENT'S BODY IS CLEAN, THOUGH, AND THAT WAS CHECKED RATHER THAN ASSUMED.** All 137
# sheets were searched for "Pro 3", "Sequential", "Prophet", "Take 5", "Trigon" and "OB-6".
# "Pro 3" appears nowhere in the body. "Sequential" and "Prophet" appear on one sheet, and that
# is Tom Oberheim's foreword telling the story of the OB-X against the Prophet-5. No sheet
# carries another instrument's running header. So the lineage is in the file's metadata and the
# map in it is this instrument's.
#
# WHAT IS GOOD HERE: the section prints a control change for 120 numbers, an NRPN for 133 more
# parameters, the received and transmitted channel messages, and the system exclusive messages.
# WHAT IS NOT: it contradicts itself about more things than any document in this corpus so far,
# and the list of those is the bulk of the account below. **Every one of them was found twice,
# by two readers working from different libraries, and the ones the two readers disagree about
# are recorded as disagreements rather than settled.**

definition: 1

model:
  manufacturer: Oberheim
  name: OB-X8
  # OS 2.0, which is the addendum's subject and the newest the maker offers: "The newest
  # version of the OS is 2.0" (addendum p. 1).
  # **THE CONTROL MAP BELOW IS THE GUIDE'S, AND THE GUIDE PREDATES OS 2.0.** The addendum
  # renumbers, removes and adds nothing in either table - checked by name against both - and
  # the only controller number it mentions at all is CC 74, which the guide already carries.
  # What OS 2.0 does add is five Page 2 parameters with no published MIDI address at all:
  # `47. Aftertouch Amount`, `48. Aftertouch To Vol`, `49. MIDI #74 to OSC 2`, `50. MIDI #74 to
  # Filter` and `23. LFO Volume Dest`. Searched for by name in both tables and in neither.
  # ONE DEFINITION COVERS TWO BODIES, the keyboard and the Module, which share one product page
  # and one guide. **The MIDI section carries no keyboard-or-Module qualification anywhere** -
  # sheets 122 to 137 were searched for "(Keyboard only)" and "(Module only)" and have none,
  # while every such marker in the document falls between sheets 7 and 83. The differences the
  # guide states are the keybed, the levers and where a parameter is reached from: "Master Tune
  # (Keyboard only)... On the Module, Master Tune is found in the Global menu" (manual p. 46),
  # "Lever Calibration (Keyboard only)" (manual p. 28), "Master Tune Fine (Module only)"
  # (manual p. 22), "Lever Box (Keyboard only)" (manual p. 50). None of those names appears in
  # either table. The Module has no keybed and no levers, so it has no local source for a note,
  # a channel pressure or a pitch bend; **that is an inference from the absence of the hardware
  # and not something either document states**, and what either body *receives* is the same.
  firmware: "2.0"

source: >-
  OB-X8 User's Guide, printed "Version 1.2, May, 2023" and served as `OB-X8-Manual-V2_2.pdf`,
  137 sheets: the MIDI implementation is sheets 122 to 137 - the globals that govern MIDI
  response on p. 122, the received and transmitted channel and controller messages on
  pp. 123-124, the control change table on pp. 125-128, how an NRPN travels on pp. 129-130, the
  NRPN table on pp. 131-133, and system exclusive on pp. 134-137. The OS 2.0 Addendum (8 sheets) supplies
  everything about split channels, MPE and the arpeggiator's clock. The product page is cited
  for which documents the maker offers and for the two bodies sharing one page.

  **PAGES ARE CITED AS FILE PAGES, BECAUSE THE PRINTED NUMBERING IS BROKEN.** Sheets 1 to 7
  print no number; 8 and 9 print "viii" and "ix", and i to vii are never printed at all; sheets
  10 to 120 print 1 to 111; and then **two different sheets both print 112** - sheet 121, the
  last page of Appendix E, and sheet 122, the first page of the MIDI implementation - after
  which 123 to 137 print 113 to 127. So the offset would be +9 for one run and +10 for the
  other and undefined for 112 itself. Both readers read the folio off all 137 sheets
  independently and agree on every range. The addendum prints no page number on any sheet.

  THE MAKER STATES A LIMIT AND THEN BREAKS IT TEN TIMES, which is the one thing most likely to
  be got wrong here. "NRPNs are the preferred method of parameter transmission, since they
  cover the complete range of all parameters, while CCs are limited to a range of 128" (manual
  p. 122) - and its own control change table prints a range wider than 128 on ten rows: CC 1 and
  CC 73 and the six envelope times at 0-255, CC 33 at "00-175" and CC 74 at 0-175. **Those are
  the parameter's range printed in a control change column, not the message's.** `range` below
  carries the figure exactly as printed and nothing is scaled, because no page says how a value
  that wide is scaled into seven bits, and a 127 that no document prints would be this file's
  invention rather than the maker's statement. Where the parameter also has an NRPN, that is the
  way to reach the top of it, which is the maker's own advice.

  SIX RANGES DISAGREE BETWEEN THE TWO TABLES, and `nrpn_range` carries the NRPN table's. Both
  readers found the same six and no others, out of 91 parameters this file pairs. One is not a
  real disagreement: Filter Frequency is "00-175" by control change against 0-175 by NRPN, which
  is a leading zero. **Three are unreadable as anything but a mistyping of 0-127** - Page 2 LFO 1
  Mod 2 Ramp Up and Mod Box Arp Speed are 0-27 by NRPN, where Mod 2's own twin is 0-127 in both
  tables, and Page 2 Chord Key Limit is "0-1207". **Two are genuinely two-sided.** Env Type is
  0-1 by control change and 0-2 by NRPN, and the prose supports the control change: Page 2's
  Envelope Type sets the envelopes "to either OB-X/Xa or OB-8 contours", which is two states.
  Mod Box LFO 2 Bend Amount is 0-255 by control change and 0-12 by NRPN, twenty-one times apart,
  and here the prose supports the **NRPN**: the Bend Lever Amount runs "from ¼ to 12 semitones"
  (manual p. 67). Both figures are published in both cases and neither is resolved.

  TWO NRPN ADDRESSES ARE NOT PUBLISHED AT ALL, which is the strongest thing in this file. The
  NRPN table prints `MOD BOX LFO 2 DEST OSC 2` **twice**, at 56 and at 57, with one range. The
  two tables list that block in the same order - control change 75 Rate, 76 Shape, 77 Dest Osc
  1, 78 Dest Osc 2, 79 Depth against NRPN 54, 55, 56, 57, 58 - so 56 sits exactly where the
  control change table has Dest Osc 1, and the reading that explains the document is that 56's
  printed name is wrong. **That reading is not written into this file**, because correcting a
  maker's printed name is not this project's to do. Nor is either address attached to a control:
  pairing CC 78 with whichever of the two comes first would be arbitrary, and publishing both as
  controls would invent a parameter the instrument has not. So the two control changes publish
  without an NRPN, and 56 and 57 publish not at all. Both readers reached this independently.

  THREE PARAMETERS ARE DELIBERATELY NOT PAIRED, and the two readers disagree about one of them.
  NRPN 122 `MOD BOX TRANSPOSE UP/ DOWN` could be control change 9 `TRANSPOSE UP/DOWN` or control
  change 90 `ARP TRANSPOSE`: all three are 0-2, the arpeggiator lives in the Mod Box, and both
  control changes are otherwise unpaired. **The second reader paired it with 90 and this file
  pairs it with neither**, which is a disagreement recorded rather than resolved. The other two
  are NRPN 25 `FILTER KBD TRACK` against control change 36 `FILTER KEYBOARD`, and NRPN 123 `PAGE
  2 FILTER KBD TRACK` against control change 37 `PAGE 2 FILTER KBD ON LEVEL`: plausible both
  times, and "keyboard track" and "on level" are not the same words.

  CONTROL CHANGE 12 IS PRINTED TWICE, for `OSC 1 XMOD` and for `OSC 1 FILTER ENV MOD`. The NRPN
  table gives those 9 and 12, so the second row's "12" is very likely its NRPN number repeated
  into the control change column. **Both ship at control change 12 as printed**, which is the
  rule this corpus follows for a number a maker prints and nothing corrects.

  SIXTEEN CONTROL CHANGES ARE NOT PUBLISHED AS CONTROLS, which follows `oberheim/teo_5` exactly:
  6 and 38 Data Entry, 96 and 97 Data Increment and Decrement - whose printed "ranges" are "+1"
  and "-1" - 98 to 101 NRPN and RPN, and 120 to 127, which are channel mode messages the
  validator refuses. 0 and 32 Bank Select do publish, as they do for the sibling.

  THE DOCUMENT GIVES SIX ACCOUNTS OF HOW MANY PROGRAMS THERE ARE AND NO TWO AGREE, so
  `presets` is not recorded. "The OB-X8 contains 768 user-programmable presets... organized into
  six Banks, each of which contain 128 preset locations (organized as 16 Groups of 8 Programs)"
  (manual p. 15); a global transmits "the entire 640 program sound set" (manual p. 27); bank
  select is "1 - 5 select user banks 1 - 5; 6 - 9 select factory banks 1 - 4" (manual p. 123),
  which is nine banks against six, while the transmitted table gives "Bank Select: 1 - 5"; the
  program dump request takes a "Bank Number, 0 - 7" (manual p. 135) and the program data dump a
  "Group Number: 0 - 9" with "Program Number: 0 - 39" (manual p. 136); and the program change row
  announces "0-39" and then enumerates 0 to 127 across sixteen groups (manual p. 123). Six
  statements of one number. `receives` and `sends` are recorded because every account agrees
  that program change travels both ways.

  WHAT IS ABSENT, CHECKED RATHER THAN ASSUMED. **There is no MIDI implementation chart** - the
  conventional grid - in either document, so `mode` is not recorded: the control change table
  lists Omni and Mono and Poly Mode messages as received, and no page gives a default mode.
  Neither document states a note range for the sound engine beyond "Note number 0-127" in the
  message tables, so `note_range` is not recorded. And **neither message table is a complete
  statement of what is received**: control changes 2 and 4 are absent from the control change
  table and present in the message tables, while a global says the synth responds to "Pitch
  Wheel, Mod Wheel, Pedal, Breath, Volume, and Expression".

  FOUR THINGS THAT LOOK LIKE MISPRINTS AND ARE NOT, established from the prose by the second
  reader, and recorded here so nobody "fixes" them. **Portamento Mode's 0-66 is right**: Page 2
  lists three non-bend modes and a Bend Up mode whose range "is displayed as -12.0... to +19.5,
  in 0.5 semitone increments", which is 64 bend steps plus three modes, 67 values. **Osc Freq's
  0-63 is right**: "5-octave+minor third range (0-+63 semitones.)" (manual p. 30). **Program Name
  Char's 0-87 is right**, 88 printable characters, and consistent across all twenty rows. **Arp
  Transpose Interval's 0-120 against a count of 0-5 is right**, five keys pressed.

  THE MAKER'S CAPITALS ARE THE LABELS, as they are for `roland/tr_6s`, whose document is also
  entirely in capitals - where `oberheim/teo_5` keeps title case because its own document prints
  title case. The printed typos are kept in the labels and not in the field names: `0SC 2 FREQ`
  for control change 16, `EXPRESION PEDAL` for 11, `PAGE 2 PANWIDTH` for 10 against the NRPN
  table's `PAGE 2 PAN WIDTH`, `MOD BOX LFO2` for 1 against `MOD BOX LFO 2` everywhere else.

  NOT RECORDED: values, bands and defaults for any control. The two tables give a range and
  nothing else, and the guide's Page 2 chapter names the states some parameters step through
  under menu numbers that **the addendum shows are not stable** - it addresses "Global 3. MIDI
  Channel" where the guide's third global is Local Control, and "Page 2 23. LFO Volume Dest"
  where the guide's twenty-third is Vibrato LFO Wave. Those numbers also have to differ between
  the keyboard and the Module, because one has a global the other has not. So no state is taken
  from a menu position.

  WHAT THIS FILE DOES NOT CARRY, and a reader implementing system exclusive needs to know:
  **the document gives this instrument two different SysEx IDs.** The device inquiry reply says
  "OB-X8  ID  (Family LS)" against 0011 0011, which is 0x33, and every one of the seven other
  SysEx messages says "OB-X8 ID" against 0011 0001, which is 0x31. One is wrong and no page
  tells which. The dump sizes do not agree either - 599 bytes for a program dump against 597 for
  an edit buffer dump of the same data, and "The 128 'packed' parameter bytes in the program
  dump follow the order of the NRPN list" - and a "Save Edit Buffer" table is byte-for-byte the
  "Request Program Dump" table above it, command byte and description included. `sysex: true`
  records that the instrument has system exclusive, which is not in doubt; the messages
  themselves are beyond what this format holds.

sources:
  manual:
    kind: manual
    title: OB-X8 User's Guide
    edition: Version 1.2
    dated: 2023-05
    landing: "https://oberheim.com/products/ob-x8/"
    url: "https://oberheim.com/wp-content/uploads/2023/09/OB-X8-Manual-V2_2.pdf"
    sha256: 55f631dc92855dddb2cf9206b254eb7ebbe1b41874feaf649e7da40b46c706aa
    retrieved: 2026-10-04
    # The printed edition is "Version 1.2, May, 2023", the file is named `V2_2`, and the PDF was
    # created on 27 September 2023. Three numbering schemes and nothing says they are the same
    # thing, so the printed one is recorded and nothing here rests on `V2_2` meaning anything.
    # `page_offset` is left at 0 and pages are cited as file pages: see the source account.
  addendum:
    kind: firmware_addendum
    title: Oberheim OB-X8 OS 2.0 New Features Addendum
    dated: 2024-06-28
    landing: "https://oberheim.com/products/ob-x8/"
    url: "https://oberheim.com/wp-content/uploads/2024/07/OB-X8-OS2.0-Addendum.pdf"
    sha256: 71b6ed663aaa37ad8da9b2a288b9c9e2e757d58f2716d73e6d820de93b0ee171
    retrieved: 2026-10-04
    # It names no version of itself. The date is the PDF's own creation date, because the
    # document carries none in its pages.
  product_page:
    kind: product_page
    title: "OB-X8"
    landing: "https://oberheim.com/products/ob-x8/"
    url: "https://oberheim.com/products/ob-x8/"
    sha256: 72f707d3be799a5a3064da1992a0c9217661c278a0d67c9c80e8c996c04e812e
    retrieved: 2026-10-04
    paginated: false
    # The digest is of the page's visible text as saved on 2026-10-04, which is the copy a
    # citation can be checked against. Cited for the three documents the maker offers and for
    # the keyboard and the Module sharing one page.

midi:
  # "MIDI Channel: All, 1-16. This allows you to set the MIDI channel that the OB-X8 will both
  # send and respond to. When set to all, the OB-X8 will receive on all MIDI channels, and will
  # transmit on channel 1" (manual p. 22). The MIDI section's own wording is shorter and does not
  # say what it transmits on.
  channels: [1, 16]
  # NOT RECORDED: mode. There is no MIDI implementation chart in either document, and no page
  # gives a default mode. See the source account.
  # RECEIVES, AND NOTHING SAYS IT SENDS ONE. The arpeggiator's clock source is "MIDI In DIN or
  # MIDI In USB" (addendum p. 6), and no page in either document describes a clock going out.
  clock: receives
  # RECEIVES, AND THE MAKER ENUMERATES WHICH MESSAGES. "The arpeggiator also responds to external
  # MIDI Song Position Pointer messages, specifically Song Start, Song Continue, and Song Position
  # Pointer" (addendum p. 6). **Song Stop is not among them**, which is the maker's own list and
  # not an omission in this reading.
  transport: receives
  program_change:
    # Both ways: the received and the transmitted channel message tables each carry a program
    # change row (manual pp. 123-124).
    receives: true
    sends: true
    # NOT RECORDED: presets. Six accounts and no two alike - see the source account.
  # PREFERRED, IN THE MAKER'S OWN WORDS, and the same words it uses for the sibling: "NRPNs are
  # the preferred method of parameter transmission, since they cover the complete range of all
  # parameters, while CCs are limited to a range of 128" (manual p. 122). Which of the two a
  # parameter change travels as is a setting - "Param Param Send: Off, CC, NRPN" and "Param
  # Param Receive: Off, CC, NRPN" (manual p. 122), the doubled word being the maker's typo - so a
  # control below carrying both numbers is one parameter reachable either way.
  # **AND THE CLAIM IS NOT QUITE TRUE OF THIS INSTRUMENT**: four real controls have no NRPN at
  # all - 9 Transpose Up/Down, 74 Brightness, 95 Lower/Upper/No Select and 119 Normal/Split/
  # Double Mode - so NRPN does not "cover the complete range of all parameters" here.
  nrpn: preferred
  # "MIDI SysEx Cable: Off, MIDI, USB-When set to MIDI it will receive and transmit MIDI SysEx
  # messages using the MIDI ports/cables" (manual p. 122). What the messages are is a different
  # question and the document does not agree with itself about it: see the source account.
  sysex: true
  # MPE, WHICH IS A SETTING RATHER THAN A STATE. "the OB-X8 will respond to any MPE-capable
  # controller across eight MPE MIDI channels (as the OB-X8 has eight voices)" (addendum p. 4),
  # chosen by selecting "MPE Enabled" in the same global that sets the MIDI channel. So this is
  # true of the instrument and not true all the time, which is the same shape as
  # `expressive_e/osmose` and is why that flag exists. The three axes are "X-axis, or left-right
  # movement, sent as Pitch Bend", "Y-axis, or front-to-back movement, sent as MIDI CC74
  # (assignable per preset)" and "Z-axis, or up-down movement, sent as Channel Pressure/
  # Aftertouch" (addendum p. 4). Whether MPE transmits as well as receives, whether there is a
  # master channel, and whether MPE and the split channels below can both be on, are all
  # unstated - the addendum says only "eight MPE MIDI channels".
  per_voice_channels: true

voice:
  addressing: pitches
  # **EIGHT VOICES, AND THIS FORMAT CANNOT SAY SO WHILE ALSO DESCRIBING THE SPLIT.** "The OB-X8
  # is an eight-voice, polyphonic analog synthesizer" (manual p. 10), and Poly Chain raises it:
  # "connect up to four OB-X8 keyboards or modules using Poly Chain mode, increasing the total
  # polyphony from 8 up to as many as 32 voices" (addendum p. 2), one way only, over MIDI DIN.
  #
  # The eight are stated against the two parts below, four each, rather than here. That is not a
  # preference: the validator refuses a whole-instrument figure beside parts that do not share a
  # pool, and these parts do not share one - "Split (four voices with one sound on the lower
  # portion of the keyboard, and four voices with a different sound on the upper)" (manual
  # p. 15), with Double likewise "two different programs of four voices each layered on top of
  # each other" (manual p. 15). Neither half can take a voice from the other.
  #
  # **So the eight is here in words only, and that is a gap rather than a decision.** The parts
  # exist only in Split mode and the eight is true always, which is one claim this format cannot
  # hold beside the other. The two part figures do sum to eight, which recovers it for anybody
  # reading the parts. Raised as a question of its own rather than worked around silently.
  polyphony_shared: false
  # CHANNEL, AND POLY KEY PRESSURE IS A SINGLE ROW WITH NOTHING BEHIND IT. "Polyphonic Key
  # Pressure" appears **once in 137 sheets**, in the received channel message table, and no page
  # in either document says what it does. Everything else about pressure here is channel
  # pressure: it is in both the received and the transmitted tables, it is what the TOUCH button
  # routes, it is MPE's Z-axis, and the addendum calls it "mono pressure" where MPE is off. So
  # `channel` is what the documents describe and `poly` would rest on one unexplained row.
  aftertouch: channel
  velocity:
    # "Note On. Note off if vvvvvvv = 0" against "Note Off. Velocity is ignored" (manual p. 123).
    note_on: received
    note_off: false
  pitch_bend:
    # "Bend Lever Amount: Use this parameter to limit the range of the Bend lever, from ¼ to 12
    # semitones" (manual p. 67), and two semitones by default. **MPE is a different number
    # entirely**: "MPE Pitch Bend on the OB-X8 covers a range of +/-48 semitones by default,
    # regardless of the program's Bend Lever Amount setting" (addendum p. 4). Twelve is the
    # program's own maximum and is what a panel can set; the 48 belongs to MPE and is recorded
    # here in words because this format holds one number.
    semitones: 12
    programmable: true

parts:
  # TWO PARTS, AND ONLY IN SPLIT MODE. "This new feature allows you to control the Lower and
  # Upper programs of a Split program over separate MIDI channels. The Lower and Upper voices
  # transmit and receive on separate MIDI channels" (addendum p. 2). They are "active whenever
  # Split mode is enabled with the Global MIDI Channel set to any channel but All", and **"The
  # Upper MIDI channel is automatically assigned as Lower channel +1"** - which is what
  # `channel_offset` holds. What the Upper channel is when the global is 16 is not stated.
  # Not available in Double mode: "The Double program will only transmit and receive on the
  # Global MIDI channel" (addendum p. 2).
  # **THE VOICES ARE NOT STATED AGAINST EITHER PART, AND THE VALIDATOR IS RIGHT TO ASK.** In
  # Split mode the eight divide evenly - "Split (four voices with one sound on the lower portion
  # of the keyboard, and four voices with a different sound on the upper)" (manual p. 15) - but
  # that is true only in Split mode, and these parts exist only in Split mode while the eight
  # voices in `voice` above are true of the instrument always. So the figure is said once, where
  # it holds without a condition, and `voice.polyphony_shared: false` says the two halves do not
  # draw on one another's voices. See the comment on `voice.polyphony_shared`.
  lower:
    label: Lower
    channel_offset: 0
    polyphony: 4
    receives: [notes, controls]
  upper:
    label: Upper
    channel_offset: 1
    polyphony: 4
    receives: [notes, controls]

