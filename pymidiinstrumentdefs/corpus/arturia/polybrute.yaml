midi:
  # "The lower zone sends / receives on MIDI channel 2 by default. Change this at Settings/MIDI/
  # Channels: select [Assign 3] (Input Channel Lower) or [Assign 4] (Output Channel Lower), then
  # use the Assign buttons to set the value to 1-16 or None" (p. 39). So sixteen channels, said
  # by the maker rather than assumed from the protocol - and each zone has an input channel and
  # an output channel of its own, which is why there are two parts below.
  channels: [1, 16]
  # Received through Sync>Source, whose "Auto detects an incoming clock and syncs to that. If no
  # clock is present, the internal clock is selected automatically at the last known tempo"
  # (p. 104); sent through Sync>Clock Send, "Use [Assign 1-2] to turn MIDI Clock transmission on
  # (default) or off" (p. 105). Both directions, and both switchable.
  clock: both
  program_change:
    # One setting covers both directions and says so: "Use [Assign 1-4] to make a selection.
    # Choices include: Off, Receive, Send, Both. This includes both MIDI Program Change and Bank
    # Select messages" (p. 110).
    receives: true
    sends: true
    # "PolyBrute has 8 banks of 96 presets (for a total of 768)" (p. 12), which is why bank
    # select is in that sentence: 768 does not fit in a program change.
    presets: 768
  # NOT RECORDED: system exclusive, NRPN and transport. See the source account for each; the
  # transport one is a limit of this field's vocabulary rather than of the manual.
  # `control_change` is left unset because a map is published - see the controls below.

voice:
  addressing: pitches
  # "6-voice polyphonic analog synthesizer with split/layer capability", and the three modes are
  # named at p. 38: "Poly (polyphonic) allows all six voices to be triggered independently by
  # different notes", "Unison stacks multiple voices on a single key", and "Mono (monophonic)
  # limits the keyboard to playing only one dual-oscillator voice".
  polyphony: 6
  # The two zones draw on the one pool of six: in Split "the keyboard has two zones" (p. 39) and
  # the voice modes are per zone, so six is a ceiling across both together rather than each.
  # One layering mode takes a third of it away and the manual says so: in Stereo Layer "two
  # voices are allocated for each note played, and it pans them Left and Right. Please note that
  # only 3 voices can be played" (p. 39).
  polyphony_shared: true
  # Mono is one voice and Poly is six. Unison is a third mode whose voice count the player sets
  # per zone, at Settings/Synth Voice/Voicing/Unison Voice Count (p. 38), and the manual does not
  # print the range it takes - so the two counts it does name are what is here.
  voicing_modes: [1, 6]
  velocity:
    note_on: received
    # "Keyboard: 5-octave, velocity-sensitive, channel aftertouch, adjustable curves" (p. 114),
    # and the curve is a setting: "Use [Assign 1] to set the velocity and aftertouch curves"
    # (p. 106).
  # Stated outright, in the specifications and again in the overview: "Keyboard:
  # velocity-sensitive, channel aftertouch" (p. 6).
  # The duophonic option is NOT polyphonic pressure and must not be read as it. It restricts
  # which voices respond: "AT Monophonic: Aftertouch affects all voices" against "AT Duophonic:
  # Aftertouch only affects the last played note, or group of notes that was played
  # simultaneously" (p. 100). One pressure message, two ways of applying it.
  aftertouch: channel
  # NOT RECORDED, pitch bend. The instrument has a pitch wheel - "Pitch and Modulation wheels"
  # (p. 114) - and no page states how far it bends or whether that is settable, which is what
  # this field holds. See the source account.

parts:
  # The two keyboard zones, which exist only in one of the three Timbrality modes: "Single: the
  # keyboard has one zone", "Layer: ... the keyboard has one zone, with two morphing voices per
  # note", "Split: the keyboard has two zones. The lower zone is always sound A; the upper zone
  # can morph between sounds A + B" (p. 39).
  # THEY ARE PARTS BECAUSE EACH HAS ITS OWN CHANNELS, not because the keyboard is divided: the
  # MIDI settings give an Input Channel and an Output Channel for each, and "The pages for the
  # upper and lower zones are identical, so both are described here" (p. 109).
  upper:
    label: Upper Zone
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
  lower:
    label: Lower Zone
    channel: assigned
    addressing: pitches
    receives: [notes, controls]
    # "The lower zone sends / receives on MIDI channel 2 by default" (p. 39), which is the only
    # default either zone is given; the upper's is not printed. A default is not a derivation,
    # so both say `assigned` and which channel yours are on belongs to your project.
    # It is also the half that can drive the pattern generators: "The lower zone can trigger the
    # Sequencer or Arpeggiator, so you can play a pattern or arpeggio using the lower zone while
    # playing more notes in the upper zone" (p. 39).
  # NOT A PART: the Sequencer and Arpeggiator, whose output is a setting on the MIDI menu rather
  # than a channel - "ON sends the output of the Seq/Arp section to the MIDI output; OFF does not
  # send the data over MIDI" (p. 109). It has no channel of its own, so there is nothing to
  # address it by.
  # EVERY CONTROL BELOW IS WITHOUT A PART, because the chart gives one number per parameter for
  # the whole instrument and never says a zone. Whether a controller reaches one zone or both is
  # not something this manual states.

groups:
  # Arturia's own names, from the headings over the eighteen tables these numbers were read
  # from, with the word `Parameter` dropped because every heading carries it and none of them is
  # told apart by it. The capitals are the chart's styling and are not reproduced, except where
  # the heading is an abbreviation the panel prints that way. The order is the chart's order,
  # which is also the order of the controls below.
  vco_1: VCO 1
  vco_2: VCO 2
  expression: Expression
  filter_fm: Filter FM
  midi: MIDI
  noise: Noise
  ladder_filter: Ladder Filter
  steiner_filter: Steiner Filter
  mixer: Mixer
  vcf_env: VCF Env
  vca_env: VCA Env
  mod_env: Mod Env
  lfo_1: LFO 1
  lfo_2: LFO 2
  lfo_3: LFO 3
  effects: Effects
  sequencer: Sequencer
  filters_common: Filters Common

