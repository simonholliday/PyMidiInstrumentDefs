midi:
  # 1 to 16, memorised. Sixteen parts answer on sixteen channels; see `parts` below.
  channels: [1, 16]
  # **Named outright, which no other Yamaha here does.** Mode 3 is OMNI OFF, POLY, per the chart's
  # own legend, and mode messages are refused.
  mode: 3
  # Receives it, and transmits its own when the `sequencer part` is switched to. The synthesizer
  # part's chart alone would have said `receives`; see the account.
  clock: both
  transport: both
  # **Two learnable jacks' worth of range and fifteen published defaults.** The chart gives
  # controllers 1 to 95 as assignable, so most of that range means whatever a Performance says -
  # the reading `teenage_engineering/op_1` established and `waldorf/iridium` carries beside
  # fifteen published controls.
  control_change: learned
  # A checked absence: 98 and 99 appear in no list, no chart row and neither flow diagram, while
  # four registered-parameter controllers do.
  nrpn: none
  sysex: true
  program_change:
    receives: true
    sends: true
    # `presets` omitted: the maker's figure is an approximation. See the account.

parts:
  # A CONTROL NAMING THIS PART IS ON THE PART'S OWN CHANNEL, and one naming no part is on the MIDI
  # I/O channel: see the account.
  part:
    label: Part
    count: 16
    channel: assigned
    receives: [notes, controls, program_change]
    addressing: pitches

voice:
  addressing: pitches
  # Stated twice: the chart gives 0-127 against Note Number and True Voice, and the data format
  # names the ends as C-2 and G8.
  note_range: [0, 127]
  # NOT RECORDED, the polyphony: two engines, two ceilings of 128, and no sum printed anywhere.
  # The parts draw on those pools rather than owning voices, which is what the flag below says;
  # that there are two of them is in the account, because a boolean cannot carry it.
  polyphony_shared: true
  velocity:
    note_on: received
    # The chart marks Note Off "X" recognised, and the data format says the velocity byte of a
    # note off is ignored. Two statements, one answer.
    note_off: false
  # **CHANNEL, AND THE OTHER CHART SAYS BOTH KINDS** - the `sequencer part` records and plays
  # back key pressure that the tone generator does not answer to. See the account; this is the
  # field in this definition most worth a second opinion.
  aftertouch: channel
  # Sent, as channel pressure, by the synthesizer part: its chart has `Ch's` O and `Key's` X as
  # transmitted (data_list p. 225), and a zone has a switch for it, "After Touch (Transmit After
  # Touch) Determines whether After Touch messages are transmitted to the external tone generator or
  # not." (reference_manual p. 65). The sequencer part's chart marks key pressure as transmitted too
  # (data_list p. 226).
  aftertouch_transmits: true
  pitch_bend:
    # Settable over RPN 0, with fine and coarse tuning beside it. The shipped depth is printed
    # nowhere in 633 sheets of documentation.
    programmable: true

groups:
  wheels: Wheels
  mix: Volume and Pan
  portamento: Portamento
  pedals: Pedals and Switches
  # The chart's own names for these two blocks of numbers.
  sound_controller: Sound Controller
  effect_depth: Effect Depth
  assignable: Assignable Cntrl

controls:

  # FIXED, AND TRAVELLING BOTH WAYS ------------------------------------------
  # Fourteen numbers in both of the maker's lists. Where the two lists give different names, the
  # label is the received one and the transmitted one is in the comment.

  # Bank select, both ways: "c = 0 BANK SELECT MSB" (data_list p. 191) and "c = 32 BANK SELECT
  # LSB" (data_list p. 191), in both lists, and "0,32" against "Bank Select" on the chart
  # (data_list p. 225). A global switch governs both directions (data_list pp. 190-191,
  # reference_manual p. 171), each part has a Receive Bank Select (reference_manual p. 92) and each
  # zone a Transmit Bank Select (reference_manual p. 64), and "Bank Select will be actually executed
  # when the Program Change message is received." (data_list p. 192).
  bank_select_msb:       {label: Bank Select MSB, cc: 0}
  bank_select_lsb:       {label: Bank Select LSB, cc: 32}

  modulation:            {label: Modulation, cc: 1, group: wheels}
  channel_volume:        {label: Channel Volume, cc: 7, group: mix}
  pan:                   {label: Pan, cc: 10, group: mix}
  portamento_time:       {label: Portamento Time, cc: 5, group: portamento}
  sustain:               {label: Sustain Switch, cc: 64, group: pedals}

  # **Signed about 64, so the middle of the range means no change** - "v = 0: -64 - 64: 0 - 127:
  # +63" (data_list p. 191) for all five. No named states, because the maker prints none.
  # 71 and 74 are the two the maker names differently by direction: transmitted they are
  # `FILTER RESONANCE` and `FILTER CUTOFF FREQ`.
  harmonic_content:      {label: Harmonic Content, cc: 71, group: sound_controller}
  eg_release_time:       {label: EG Release Time, cc: 72, group: sound_controller}
  eg_attack_time:        {label: EG Attack Time, cc: 73, group: sound_controller}
  brightness:            {label: Brightness, cc: 74, group: sound_controller}
  eg_decay_time:         {label: EG Decay Time, cc: 75, group: sound_controller}

  effects_1_depth:       {label: Effects 1 Depth, cc: 91, group: effect_depth}
  effects_4_depth:       {label: Effects 4 Depth, cc: 94, group: effect_depth}

  # FIXED, AND IN THE RECEIVED LIST ALONE ------------------------------------
  # Three numbers in the received list and not in the transmitted one. Two are received only.
  # **Expression is sent too**: the chart marks its row transmitted (data_list p. 225), and the
  # jack for Foot Controller 1 is shipped set to 11 (data_list pp. 191, 201). Until 2026-10-13
  # it said `direction: receives`. See the account.

  expression:            {label: Expression, cc: 11, group: mix}
  # Two bands rather than two exact values: the maker prints "0 - 63: OFF, 64 - 127: ON"
  # (data_list p. 191) for each of the two.
  portamento_switch:     {label: Portamento Switch, cc: 65, values: {"off": 0, "on": 64}, direction: receives, group: portamento}
  sostenuto:             {label: Sostenuto, cc: 66, values: {"off": 0, "on": 64}, direction: receives, group: pedals}

  # THE FACTORY ASSIGNMENTS --------------------------------------------------
  # **Every one of these is a default and not a fixture.** Each is the number its controller is
  # shipped set to, and each can be set to `Off` or moved anywhere in 1 to 95 (data_list
  # p. 201) - which is what `midi.control_change: learned` above says, and what
  # `assignment: default` says on each since 2026-10-13. A consumer offering them should say
  # so. **The breath controller is not a part of the instrument**: its number is the one
  # "received from the external equipment such as a Breath Controller." (reference_manual
  # p. 153), and the maker's lists of the instrument's controllers and connectors have no
  # breath controller and no jack for one (manual p. 63).
  # Two more rows of the same footnote are shipped pointing at something that is not a controller
  # at all, so they are not here: foot controller 2 at the Super Knob and the foot switch at
  # Arp SW. A third, foot controller 1, is shipped at 11, which is Expression above.

  breath:                {label: Breath Controller, cc: 2, assignment: default, group: assignable}
  ribbon:                {label: Ribbon Controller, cc: 16, assignment: default, group: assignable}
  assignable_knob_1:     {label: Assignable Knob 1, cc: 17, assignment: default, group: assignable}
  assignable_knob_2:     {label: Assignable Knob 2, cc: 18, assignment: default, group: assignable}
  assignable_knob_3:     {label: Assignable Knob 3, cc: 19, assignment: default, group: assignable}
  assignable_knob_4:     {label: Assignable Knob 4, cc: 20, assignment: default, group: assignable}
  assignable_knob_5:     {label: Assignable Knob 5, cc: 21, assignment: default, group: assignable}
  assignable_knob_6:     {label: Assignable Knob 6, cc: 22, assignment: default, group: assignable}
  assignable_knob_7:     {label: Assignable Knob 7, cc: 23, assignment: default, group: assignable}
  assignable_knob_8:     {label: Assignable Knob 8, cc: 24, assignment: default, group: assignable}
  assignable_function_1: {label: Assignable Function 1, cc: 86, assignment: default, group: assignable}
  assignable_function_2: {label: Assignable Function 2, cc: 87, assignment: default, group: assignable}
  motion_seq_hold:       {label: Motion Seq Hold, cc: 88, assignment: default, group: assignable}
  motion_seq_trigger:    {label: Motion Seq Trigger, cc: 89, assignment: default, group: assignable}

  # THE SUPER KNOB -----------------------------------------------------------
  # Its own controller number, from `Off` to 95, shipped at 95: the Data List's default is `5F`
  # (data_list p. 198) and the picture of the setting shows 95 (supplementary_manual p. 118).
  # Sent when the knob is turned, and read as the knob when it arrives (supplementary_manual
  # p. 118). A system setting the owner can move, so `assignment: default`. It is not one of
  # the footnote's fourteen, so it has no group. Sent on channel 1 in Multi mode and on the MIDI
  # I/O channel in Single. **Scenes have a number of the same kind, and it is not here**: its
  # default is printed two ways. See the account.
  super_knob:            {label: Super Knob, cc: 95, assignment: default}

  # THE STANDARD CONTROLLERS AGAIN, FOR A PART ON ITS OWN CHANNEL -------------
  # Eleven numbers, each named and directed as its control above is: see the account. Each control
  # above names no part and is on the MIDI I/O channel. A part may be a Drum Part, and portamento
  # time and the portamento switch are "Invalid with Drum Parts." (data_list p. 191).
  part_bank_select_msb:   {label: Bank Select MSB, cc: 0, part: part}
  part_bank_select_lsb:   {label: Bank Select LSB, cc: 32, part: part}
  part_modulation:        {label: Modulation, cc: 1, part: part, group: wheels}
  part_channel_volume:    {label: Channel Volume, cc: 7, part: part, group: mix}
  part_pan:               {label: Pan, cc: 10, part: part, group: mix}
  part_portamento_time:   {label: Portamento Time, cc: 5, part: part, group: portamento}
  part_sustain:           {label: Sustain Switch, cc: 64, part: part, group: pedals}
  part_expression:        {label: Expression, cc: 11, part: part, group: mix}
  part_portamento_switch: {label: Portamento Switch, cc: 65, values: {"off": 0, "on": 64}, direction: receives, part: part, group: portamento}
  part_sostenuto:         {label: Sostenuto, cc: 66, values: {"off": 0, "on": 64}, direction: receives, part: part, group: pedals}
  # The breath controller's shipped number, a default like the fourteen above it.
  part_breath:            {label: Breath Controller, cc: 2, assignment: default, part: part, group: assignable}
